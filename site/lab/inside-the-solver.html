<style>
  /* ---- animation ---- */
  #solv-sec .anim-hud {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px;

    #solv-sec .anim-hud .chip-stat { padding: 4px 7px; font-size: 11px; }
    #solv-sec .anim-hud .chip-stat b { font-size: 15px; }
  }
  @media (max-width: 620px) {
    #solv-sec .anim-hud { grid-template-columns: repeat(4, minmax(0, 1fr)); top: 8px; left: 8px; right: 8px; width: auto; gap: 4px; }
    #solv-sec .anim-hud .chip-stat { padding: 3px 6px; font-size: 10.5px; }
    #solv-sec .anim-hud .chip-stat b { font-size: 14px; }
  }
  #solv-sec .anim-legend span[hidden] { display: none; }
  #solv-sec .anim-legend i.lg-region { background: var(--region); border: 1.5px solid var(--ink); }
  #solv-sec .anim-legend i.lg-int { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); }
  #solv-sec .anim-legend i.lg-lp { width: 11px; height: 11px; border-radius: 50%; border: 2.5px solid var(--accent); background: var(--surface); }
  #solv-sec .anim-legend i.lg-star { width: auto; height: auto; font-style: normal; color: var(--accent); font-size: 15px; line-height: 1; }
  #solv-sec .anim-legend i.lg-cut { width: 18px; height: 0; border-top: 2.5px solid var(--mit-bright); }
  #solv-sec .anim-legend i.lg-open { width: 12px; height: 12px; border-radius: 50%; border: 1.5px dashed var(--mit-silver); }
  #solv-sec .anim-legend i.lg-br { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); background: var(--surface); }
  #solv-sec .anim-legend i.lg-intn { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
  #solv-sec .anim-legend i.lg-pr { width: 12px; height: 12px; border-radius: 50%; background: var(--mit-silver); }
  #solv-sec .anim-legend i.lg-inf { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--mit-silver); position: relative; }
  #solv-sec .anim-legend i.lg-inf::before, #solv-sec .anim-legend i.lg-inf::after {
    content: ""; position: absolute; left: 1px; right: 1px; top: 50%; height: 1.5px; margin-top: -0.75px; background: var(--mit-silver); transform: rotate(45deg);
  }
  #solv-sec .anim-legend i.lg-inf::after { transform: rotate(-45deg); }
  #solv-sec .anim-legend i.lg-bd { width: 18px; height: 0; border-top: 2.5px solid var(--ink); }
  #solv-sec .anim-legend i.lg-ic { width: 18px; height: 0; border-top: 2.5px solid var(--accent); }
  #solv-sec .anim-legend i.lg-ghost { width: 18px; height: 0; border-top: 1.6px dashed var(--mit-silver); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) #solv-sec .anim-legend i.lg-cut { border-top-color: var(--crit); }
  }
  :root[data-theme="dark"] #solv-sec .anim-legend i.lg-cut { border-top-color: var(--crit); }

  /* ---- solver log (modeled on how commercial solver logs look) ---- */
  .solv-log {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 8px 12px 6px;
    font-family: var(--font-mono); font-size: 12.5px; color: var(--ink2);
  }
  .solv-log .log-title { font: 700 11px var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }

  .solv-log td.msg { text-align: left; color: var(--ink); font-family: var(--font-sans); font-size: 13px; }

  .solv-log td.inc { color: var(--accent-text); font-weight: 600; }
  .solv-log col.c-mk { width: 5%; }
  .solv-log col.c-ex { width: 13%; }
  .solv-log col.c-op { width: 12%; }
  .solv-log col.c-in { width: 18%; }
  .solv-log col.c-bd { width: 19%; }
  .solv-log col.c-gp { width: 17%; }
  .solv-log col.c-pv { width: 16%; }
  .log-note { font-size: 12.5px; color: var(--muted); margin: 0; max-width: 78ch; }
  @media (max-width: 620px) {
    .solv-log { padding: 6px 6px 4px; font-size: 11px; }

  .stat .v.ink { color: var(--ink); }
  @media (max-width: 560px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .stat { padding: 10px 11px; }
    .stat .v { font-size: 21px; }

  table.data { min-width: 560px; }
  table.data th.num, table.data td.num { text-align: right; }
  table.data td.num, table.data td.mono { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }

<script>
(function () {
  "use strict";
  var T = I18N.t;
  var MINUS = "−", DASH = "-";
  var fmt = function (v, d) { if (Math.abs(v) < 5e-10) v = 0; return I18N.fmt(v, d == null ? 2 : d); };
  var num = function (v, d) { var m = fmt(Math.abs(v), d); return (v < 0 && m !== fmt(0, d) ? MINUS : "") + m; };
  var pair = function (x, d) { return T("solv.pair", { x: num(x[0], d), y: num(x[1], d) }); };
  var fix2 = function (v) { if (Math.abs(v) < 5e-10) v = 0; return I18N.fmt(v, 2, 2); };
  var pct = function (v) { return T("solv.pct", { v: fmt(v, 2) }); };
  var gapOf = function (inc, bound) { return inc === null || bound === null ? null : Math.max(0, (bound - inc) / Math.abs(inc) * 100); };
  var SUB = ["₁", "₂"];
  var xn = function (j) { return "x" + SUB[j]; };

  /* =====================================================================================
     The model (illustrative data): a small coffee roaster plans a week in whole batches.
     x1 = batches of the traditional blend, x2 = batches of the specialty blend.
     ===================================================================================== */
  var DATA = {
    c: [9, 10],
    rows: [
      { a: [7, 8], b: 55, k: "roast" },
      { a: [4, 7], b: 42, k: "pack" },
      { a: [3, 2], b: 33, k: "green" }
    ]
  };
  var NV = DATA.c.length, TOL = 1e-6;
  function isInt(v) { return Math.abs(v - Math.round(v)) < TOL; }
  function fl(v) { return Math.floor(v + TOL); }
  function dot(a, x) { var s = 0; for (var j = 0; j < a.length; j++) s += a[j] * x[j]; return s; }
  function unit(j) { var e = []; for (var k = 0; k < NV; k++) e.push(k === j ? 1 : 0); return e; }

  /* ---------- presolve: bounds from single rows (all data >= 0), then rows that can never bind ---------- */
  function presolve() {
    var raw = [], rawRow = [], ub = [], j;
    for (j = 0; j < NV; j++) {
      var best = Infinity, bi = -1;
      DATA.rows.forEach(function (r, i) { if (r.a[j] > 0 && r.b / r.a[j] < best - 1e-12) { best = r.b / r.a[j]; bi = i; } });
      raw.push(best); rawRow.push(bi); ub.push(fl(best));
    }
    var red = [], act = [];
    DATA.rows.forEach(function (r, i) { var m = dot(r.a, ub); act.push(m); if (m <= r.b + 1e-9) red.push(i); });
    var rows = [];
    DATA.rows.forEach(function (r, i) { if (red.indexOf(i) < 0) rows.push({ a: r.a.slice(), op: "<=", b: r.b, k: r.k }); });
    for (j = 0; j < NV; j++) rows.push({ a: unit(j), op: "<=", b: ub[j], k: "ub" + j });
    return { raw: raw, rawRow: rawRow, ub: ub, red: red, act: act, rows: rows };
  }

  /* ---------- Chvatal-Gomory cut from the optimal tableau of the presolved LP ---------- */
  function gomory(rows) {
    var st = LP.steps({ c: DATA.c, rows: rows }), last = st[st.length - 1];
    var Tb = last.tableau, basis = last.basis, m = rows.length, N = Tb[0].length - 1, best = null, i, j;
    for (i = 0; i < m; i++) {
      var v = Tb[i][N], f = v - Math.floor(v + TOL);
      if (f < TOL || f > 1 - TOL) continue;
      var sc = Math.abs(f - 0.5);
      if (!best || sc < best.sc - 1e-9 || (Math.abs(sc - best.sc) <= 1e-9 && basis[i] < best.col)) best = { sc: sc, row: i, col: basis[i] };
    }
    if (!best) return null;
    var R = Tb[best.row], alpha = [], beta = fl(R[N]), g = [];
    for (j = 0; j < NV; j++) alpha.push(fl(R[j]));
    for (i = 0; i < m; i++) {
      var k = fl(R[NV + i]); g.push(k);
      for (j = 0; j < NV; j++) alpha[j] -= k * rows[i].a[j];
      beta -= k * rows[i].b;
    }
    return { a: alpha, b: beta, col: best.col, row: Array.prototype.slice.call(R), basis: basis.slice(), g: g, rows: rows.slice() };
  }

  function feasibleOrig(x) { return DATA.rows.every(function (r) { return dot(r.a, x) <= r.b + 1e-9; }); }
  function nodeRows(base, lo, hi, ub) {
    var rows = base.slice();
    for (var j = 0; j < NV; j++) {
      if (lo[j] > 0) rows.push({ a: unit(j), op: ">=", b: lo[j] });
      if (hi[j] < ub[j]) rows.push({ a: unit(j), op: "<=", b: hi[j] });
    }
    return rows;
  }

  /* ---------- branch and bound: best bound first, most fractional variable, down branch first ---------- */
  function run(full) {
    var P = presolve(), base = P.rows.slice(), ev = [], piv = 0, j;
    var root = LP.solve({ sense: "max", c: DATA.c, rows: base });
    piv += root.iterations;
    var out = { P: P, root: root, full: full, events: ev, nodes: [] };
    var inc = null, incX = null, incNode = -1, rootLP = root;
    ev.push({ type: "root", piv: piv, bound: root.z, inc: null, expl: 0, open: 1 });
    if (full) {
      var cut = gomory(base);
      out.cut = cut;
      base.push({ a: cut.a.slice(), op: "<=", b: cut.b, k: "cut" });
      rootLP = LP.solve({ sense: "max", c: DATA.c, rows: base });
      piv += rootLP.iterations;
      out.rootCut = rootLP;
      ev.push({ type: "cut", piv: piv, bound: rootLP.z, inc: null, expl: 0, open: 1 });
      var xr = rootLP.x.map(fl);
      if (feasibleOrig(xr)) {
        inc = dot(DATA.c, xr); incX = xr; incNode = 0;
        out.rootHeur = { x: xr, z: inc };
        ev.push({ type: "heur", node: 0, piv: piv, bound: rootLP.z, inc: inc, incX: xr, expl: 0, open: 1 });

    if (nd.out === "inf") return T("solv.res.inf");
    if (nd.out === "bound") return T("solv.res.bound");
    if (nd.out === "int") return T("solv.res.int");
    var s = T("solv.res.branch", { x: xn(nd.sv) });
    var h = nd.heur || (nd.id === 0 ? S.R.rootHeur : null);   // the root's rounding runs right after the cut
    if (h) s += "; " + T("solv.res.heur", { z: num(h.z, 0) });
    return s;
  }
  function bText(nd) {
    var p = [];
    for (var j = 0; j < NV; j++) {
      if (nd.lo[j] > 0 && nd.hi[j] === nd.lo[j]) { p.push(xn(j) + " = " + nd.lo[j]); continue; }
      if (nd.lo[j] > 0) p.push(xn(j) + " ≥ " + nd.lo[j]);
      if (nd.hi[j] < PRE.ub[j]) p.push(xn(j) + " ≤ " + nd.hi[j]);
    }
    return p.length ? p.join(", ") : T("solv.run.none");
  }
  function renderRun() {
    var S = scen(state.sc), R = S.R, O = RUN[other(state.sc)];
    document.getElementById("solv-run-title").textContent = T("solv.run.title", { s: T("solv.sc." + state.sc) });
    document.getElementById("solv-s-z").textContent = num(R.inc, 2);
    document.getElementById("solv-s-zl").textContent = T("solv.run.optl", { x: pair(R.incX, 0) });
    document.getElementById("solv-s-n").textContent = String(R.expl);
    document.getElementById("solv-s-nl").textContent = T("solv.run.nodesl." + state.sc, { m: O.expl });
    document.getElementById("solv-s-p").textContent = String(R.piv);
    document.getElementById("solv-s-pl").textContent = T("solv.run.pivl", { m: O.piv });
    document.getElementById("solv-s-r").textContent = num(R.rootLP.z, 2);
    document.getElementById("solv-s-rl").textContent = R.full ? T("solv.run.rootl.full", { z: num(R.root.z, 2) }) : T("solv.run.rootl.plain");
    document.getElementById("solv-run-intro").textContent = T("solv.run.intro." + state.sc);
    var h = "<thead><tr><th class='num'>" + T("solv.run.th.n") + "</th><th>" + T("solv.run.th.b") + "</th><th class='num'>" + T("solv.run.th.x") +
      "</th><th class='num'>" + T("solv.run.th.z") + "</th><th>" + T("solv.run.th.r") + "</th><th class='num wide'>" + T("solv.run.th.p") + "</th></tr></thead><tbody>";
    var list = S.nodes.filter(function (nd) { return nd.order; }).sort(function (a, b) { return a.order - b.order; })
      .concat(S.nodes.filter(function (nd) { return nd.out === "pruned"; }));
    list.forEach(function (nd) {
      var ok = nd.lp && nd.lp.status === "optimal";
      var cls = nd.out === "int" ? "res-int" : (nd.heur || (nd.id === 0 && R.rootHeur)) ? "res-heur" : (nd.out === "branch" ? "" : "res-quiet");
      var piv = nd.order ? (nd.id === 0 ? R.root.iterations + (R.full ? R.rootLP.iterations : 0) : nd.piv) : DASH;
      h += "<tr><td class='num'>" + (nd.order || DASH) + "</td><td class='mono'>" + bText(nd) + "</td><td class='num'>" + (ok ? pair(nd.lp.x) : DASH) +
        "</td><td class='num'>" + (ok ? num(nd.lp.z, 2) : DASH) + "</td><td class='" + cls + "'>" + resultText(S, nd) + "</td><td class='num wide'>" + piv + "</td></tr>";
    });
    document.getElementById("solv-nodes").innerHTML = h + "</tbody>";
  }
  function renderNotes() {
    var F = scen("full"), Pn = scen("plain"), P = PRE, rf = RUN.full, rp = RUN.plain;
    var red = DATA.rows[P.red[0]];
    document.getElementById("solv-n1").textContent = T("solv.n.p1", {
      raw: fmt(P.raw[0], 2), u: P.ub[0], x: xn(0), row: T("solv.m." + red.k), lhs: lin(red.a, false), act: P.act[P.red[0]], b: red.b,
      z1: num(NOPRE.z), z0: num(rf.root.z)
    });
    var gapCut = gapOf(rf.inc, rf.rootLP.z);
    document.getElementById("solv-n2").textContent = T("solv.n.p2", {
      cut: lin(rf.cut.a, false) + " ≤ " + num(rf.cut.b, 0), x: pair(rf.root.x), z0: num(rf.root.z), zc: num(rf.rootLP.z), z: num(rf.inc, 2), g: pct(gapCut)
    });
    document.getElementById("solv-n3").textContent = T("solv.n.p3", {
      hx: pair(rf.rootHeur.x, 0), h: num(rf.rootHeur.z, 0), first: firstIncNode(Pn), incs: incList(Pn)
    });
    document.getElementById("solv-n4").textContent = T("solv.n.p4", {
      z: num(rf.inc, 2), x: pair(rf.incX, 0), np: rp.expl, pp: rp.piv, nf: rf.expl, pf: rf.piv
    });
  }

  var segBtns = document.querySelectorAll("#solv-seg button");
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      if (state.sc === b.getAttribute("data-sc")) return;
      state.sc = b.getAttribute("data-sc");
      segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      renderScenText(); renderStatus(); renderRun();
      logKey = "";
      if (A.reducedMotion) { player.seek(DUR); return; }
      if (player.time < CH[2]) player.refresh();
      else { player.seek(CH[2] + 0.001); player.play(); }
    });
  });

  function renderPage() {
    renderScenText(); renderStatus(); renderModel(); renderRun(); renderNotes();
    hudKey = ""; logKey = "";
    player.refresh();
  }
  I18N.onChange(renderPage);
})();
</script>
</body>
</html>
