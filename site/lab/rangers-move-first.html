<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  [hidden] { display: none !important; }
  /* new or urgent cues: bright red, or the crit shade where dark mode makes the accent that same red */
  :root { --hot: var(--mit-bright); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --hot: var(--crit); } }
  :root[data-theme="dark"] { --hot: var(--crit); }

  /* ---- part index ---- */
  .case-nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 760px) { .case-nav { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 420px) { .case-nav { grid-template-columns: minmax(0, 1fr); } }
  .case-nav a {
    display: flex; gap: 9px; align-items: baseline; padding: 10px 12px; min-width: 0;
    background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--accent); border-radius: 3px;
    color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14px; line-height: 1.3;
  }
  .case-nav a:hover { background: var(--surface2); }
  .case-nav .n, .case-num { font-family: var(--font-mono); color: var(--accent-text); font-weight: 600; }
  .case-num { display: block; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }
  section.block { scroll-margin-top: 70px; grid-template-columns: minmax(0, 1fr); }
  section.block > * { min-width: 0; }

  /* ---- controls ---- */
  .ctl-row { display: flex; flex-wrap: wrap; gap: 12px 26px; align-items: flex-end; }
  .ctl-group { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .ctl-group .lbl { font-size: 13px; color: var(--ink2); font-weight: 600; }
  button.btn {
    font: 600 13px var(--font-sans); color: var(--on-solid); background: var(--accent); border: 1px solid var(--accent); border-radius: 2px;
    padding: 8px 12px; cursor: pointer;
  }
  button.btn:hover { filter: brightness(1.1); }
  button.btn:disabled { opacity: 0.45; cursor: default; filter: none; }
  button.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--border); }
  .btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .rng { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; align-items: baseline; min-width: 200px; flex: 1 1 240px; max-width: 380px; }
  .rng label { font-size: 13px; color: var(--ink2); font-weight: 600; }
  .rng output { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
  .rng input[type="range"] { flex: 1 1 100%; width: 100%; accent-color: var(--accent); margin: 4px 0 0; }

  /* ---- live numbers ---- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 14px; }
  @media (max-width: 460px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .kpi { border: 1px solid var(--border); border-radius: 3px; padding: 8px 11px; background: var(--surface); min-width: 0; }
  .kpi b { display: block; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); letter-spacing: -0.01em; line-height: 1.2; overflow-wrap: anywhere; }
  .kpi span { display: block; font-size: 12.5px; color: var(--ink2); line-height: 1.3; margin-top: 2px; }
  .kpi.accent { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .kpi.accent b { color: var(--accent-text); }
  .kpi.hot b { color: var(--hot); }
  @media (max-width: 460px) { .kpi b { font-size: 16px; } .kpi span { font-size: 12px; } }
  .verdict { margin: 14px 0 0; padding: 10px 14px; border-radius: 3px; font-size: 14.5px; border: 1px solid var(--border); border-left: 3px solid var(--ink2); background: var(--surface2); color: var(--ink2); }
  .verdict b { color: var(--ink); }
  .verdict.ok { border-left-color: var(--accent); }
  .verdict:empty { display: none; }
  .readline { font-size: 13.5px; color: var(--ink2); margin: 10px 0 0; min-height: 2.6em; }
  .readline b { color: var(--ink); }

  /* ---- layout helpers ---- */
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px 24px; align-items: start; margin-top: 6px; }
  @media (max-width: 860px) { .two { grid-template-columns: minmax(0, 1fr); } }
  .two > div { min-width: 0; }
  .subhead { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
  .mhead { margin: 16px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-text); }
  .mhead:first-child { margin-top: 0; }
  .mtext { font-size: 14px; color: var(--ink2); margin: 6px 0 0; max-width: 80ch; }
  .mtext b { color: var(--ink); }
  .chartbox { margin-top: 8px; min-width: 0; touch-action: pan-y; }
  .chartbox svg { display: block; width: 100%; max-width: 760px; height: auto; overflow: visible; }
  .tabnote { font-size: 13px; color: var(--muted); margin: 6px 0 0; max-width: 80ch; }
  .tabnote b { color: var(--ink2); }

  /* ---- SVG charts (colours from the tokens) ---- */
  .chartbox svg text { font-family: var(--font-sans); font-size: 12px; fill: var(--ink2); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
  .chartbox svg text.m { fill: var(--muted); font-size: 11px; }
  .chartbox svg text.a { fill: var(--accent-text); font-weight: 700; }
  .chartbox svg text.i { fill: var(--ink); font-weight: 700; }
  .chartbox svg text.h { fill: var(--hot); font-weight: 700; }
  .chartbox svg text.mono { font-family: var(--font-mono); }
  .chartbox svg text.on { fill: var(--on-solid); stroke: none; font-weight: 700; }
  .chartbox svg text.sm { font-size: 10.5px; letter-spacing: -0.02em; }
  .chartbox svg .ax { stroke: var(--axis); stroke-width: 1; fill: none; }
  .chartbox svg .gr { stroke: var(--grid); stroke-width: 1; fill: none; }
  .chartbox svg .col { fill: var(--region); stroke: var(--mit-silver); stroke-width: 1; }
  .chartbox svg .cov { fill: var(--accent); fill-opacity: 0.3; stroke: var(--accent); stroke-width: 1; }
  .chartbox svg .band { fill: var(--region); stroke: var(--mit-silver); stroke-width: 1; }
  .chartbox svg .lnA { stroke: var(--accent); fill: none; stroke-width: 3; stroke-linecap: round; }
  .chartbox svg .lnI { stroke: var(--ink); fill: none; stroke-width: 1.5; }
  .chartbox svg .lnS { stroke: var(--mit-silver); fill: none; stroke-width: 1.2; }
  .chartbox svg .dash { stroke-dasharray: 5 4; }
  .chartbox svg .dotA { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
  .chartbox svg .dotI { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
  .chartbox svg .dotO { fill: var(--surface); stroke: var(--ink2); stroke-width: 1.6; }
  .chartbox svg .fA { fill: var(--accent); }
  .chartbox svg .fI { fill: var(--ink); }
  .chartbox svg .fI2 { fill: var(--ink2); }
  .chartbox svg .seg0 { fill: var(--surface2); stroke: var(--ink2); stroke-width: 1; }
  .chartbox svg .seg1 { fill: var(--region); stroke: var(--ink2); stroke-width: 1; }
  .chartbox svg .segH { fill: var(--accent); fill-opacity: 0.28; stroke: var(--accent); stroke-width: 2; }
  .chartbox svg .idle { fill: url(#pat-hatch); stroke: var(--mit-silver); stroke-width: 1; }
  .chartbox svg .hatch { stroke: var(--mit-silver); stroke-width: 1.2; }
  .chartbox svg .tooth { stroke: var(--accent); stroke-width: 2.2; }
  .chartbox svg .grab { cursor: ns-resize; touch-action: none; }
  .chartbox.drag svg { cursor: ns-resize; }

  /* ---- part 1: the game ---- */
  .game-grid { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 16px 24px; align-items: start; margin-top: 14px; }
  @media (max-width: 860px) { .game-grid { grid-template-columns: minmax(0, 1fr); } }
  .game-grid > div { min-width: 0; }
  .map-stage { position: relative; width: 100%; aspect-ratio: 4 / 3; background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; overflow: hidden; }
  .map-legend { margin-top: 8px; }
  .map-legend i.lg-forest { background: var(--mit-silver); opacity: 0.6; }
  .map-legend i.lg-cov { border-radius: 50%; border: 3px solid var(--accent); border-right-color: var(--grid); border-bottom-color: var(--grid); background: transparent; }
  .map-legend i.lg-gain { border-radius: 50%; border: 2px solid var(--mit-silver); background: transparent; }
  .map-legend i.lg-top { border-radius: 50%; border: 2.5px solid var(--ink); background: transparent; }
  .map-legend i.lg-hit { background: var(--hot); }
  .map-legend i.lg-team { background: var(--accent); }
  .budget { display: grid; gap: 5px; margin-bottom: 4px; }
  .budget .bl { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 600; color: var(--ink2); }
  .budget .bl output { font-family: var(--font-mono); font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .bbar { position: relative; height: 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 2px; overflow: hidden; }
  .bbar .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); }
  .bbar .tk { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--surface); }
  .bnote { font-size: 12.5px; color: var(--muted); margin: 0; min-height: 1.4em; }
  .sliders { display: grid; gap: 0; }
  .srow { display: grid; grid-template-columns: 34px minmax(0, 1fr) 54px; gap: 0 10px; align-items: center; padding: 5px 0 6px; border-bottom: 1px solid var(--grid); }
  .srow:last-child { border-bottom: none; }
  .srow .zn { font-weight: 700; font-size: 14px; color: var(--ink); }
  .srow .zi { display: block; font: 400 11px var(--font-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srow .trk { position: relative; min-width: 0; }
  .srow input[type="range"] { width: 100%; accent-color: var(--accent); margin: 2px 0 0; display: block; }
  .srow .opt { position: absolute; bottom: -4px; width: 2px; height: 7px; margin-left: -1px; background: var(--ink); left: calc(8px + (100% - 16px) * var(--c, 0)); }
  .srow output { font: 600 13px var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; color: var(--accent-text); }
  .srow.top .zn { color: var(--ink); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .srow.hit .zn { color: var(--hot); text-decoration-color: var(--hot); }
  table.data { min-width: 0; margin-top: 8px; }
  table.data th.num, table.data td.num { text-align: right; }
  table.data td.num { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
  table.data td.acc { color: var(--accent-text); font-weight: 700; }
  table.data td.hot { color: var(--hot); font-weight: 700; }
  table.data td.mut { color: var(--muted); }
  table.data tr.opt td { background: var(--sel); font-weight: 600; }
  @media (max-width: 560px) {
    table.data .wide { display: none; }
    table.data th, table.data td { padding-inline: 5px; font-size: 12px; }
    table.data td.num { font-size: 11.5px; }
  }

  /* ---- part 2: the optimum ---- */
  .locked { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .locked p { margin: 0; color: var(--ink2); font-size: 14.5px; max-width: 64ch; }
  .lpgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  @media (max-width: 700px) { .lpgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .lpc { border: 1px solid var(--border); border-radius: 3px; padding: 8px 10px; background: var(--surface); min-width: 0; display: grid; gap: 1px; }
  .lpc .h { font-size: 12px; color: var(--ink2); font-weight: 600; line-height: 1.25; }
  .lpc b { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); line-height: 1.25; }
  .lpc .s { font: 400 11.5px var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
  .lpc.best { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); background: var(--sel); }
  .lpc.best b { color: var(--accent-text); }
  .lpc.off { background: var(--surface2); }
  .lpc.off .h, .lpc.off b { text-decoration: line-through; text-decoration-thickness: 1.5px; color: var(--muted); }
  .tiebox { border: 1px solid var(--border); border-left: 3px solid var(--hot); border-radius: 3px; background: var(--surface); padding: 12px 14px; }
  .tiebox .subhead { margin-bottom: 2px; }
  .optstrip {
    border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 3px; background: var(--surface);
    padding: 10px 14px; display: grid; gap: 4px;
  }
  .optstrip .kicker { margin: 0; color: var(--accent-text); }
  .optstrip p { margin: 0; font-size: 14px; color: var(--ink2); max-width: 86ch; }
  .optstrip p b { color: var(--ink); }
  .anim-legend i.s-bar { background: var(--ink2); }
  .anim-legend i.s-tick { width: 16px; height: 3px; background: var(--accent); }
  .anim-legend i.s-band { background: var(--region); border: 1px solid var(--mit-silver); }
  .anim-legend i.s-cov { background: var(--accent); opacity: 0.45; }
  .anim-legend i.s-col { background: var(--region); border: 1px solid var(--mit-silver); }
  .anim-legend i.s-lvl { width: 16px; height: 3px; background: var(--accent); }
  .anim-legend i.s-idle { background: repeating-linear-gradient(45deg, var(--mit-silver) 0 1.5px, transparent 1.5px 4px); border: 1px solid var(--mit-silver); }

  /* ---- model ---- */
  .model-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 22px; align-items: start; margin-top: 16px; }
  @media (max-width: 860px) { .model-grid { grid-template-columns: minmax(0, 1fr); } }
  .model-grid > div { min-width: 0; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="backlink" href="index.html" data-keep-lang><span aria-hidden="true">←</span> <span data-i18n="pat.back"></span></a>
    <div class="lang" data-lang-switcher></div>
  </div>
</header>

<div class="wrap">
  <header class="masthead">
    <p class="eyebrow" data-i18n-html="pat.eyebrow"></p>
    <h1 data-i18n="pat.title"></h1>
    <p class="lede" data-i18n-html="pat.lede"></p>
  </header>

  <nav class="case-nav" data-i18n-attr="aria-label:pat.nav.aria">
    <a href="#pat-p1"><span class="n">1</span><span data-i18n="pat.p1.title"></span></a>
    <a href="#pat-p2"><span class="n">2</span><span data-i18n="pat.p2.title"></span></a>
    <a href="#pat-p3"><span class="n">3</span><span data-i18n="pat.p3.title"></span></a>
    <a href="#pat-model"><span class="n">4</span><span data-i18n="pat.m.title"></span></a>
  </nav>

  <!-- =================================================================== part 1: the game -->
  <section class="block" id="pat-p1" aria-labelledby="pat-p1-h">
    <h2 class="section-title" id="pat-p1-h"><span class="case-num" data-i18n="pat.part1"></span><span data-i18n="pat.p1.title"></span></h2>
    <p class="section-intro" data-i18n-html="pat.p1.intro"></p>
    <div class="card" id="g-card">
      <div class="ctl-row">
        <div class="ctl-group">
          <span class="lbl" id="m-lbl" data-i18n="pat.g.teams"></span>
          <div class="seg" role="group" aria-labelledby="m-lbl" id="m-seg">
            <button type="button" data-m="2" aria-pressed="false">2</button>
            <button type="button" data-m="3" aria-pressed="true">3</button>
            <button type="button" data-m="4" aria-pressed="false">4</button>
          </div>
        </div>
      </div>
      <div class="game-grid">
        <div>
          <div class="map-stage" id="map-stage" role="img"></div>
          <div class="anim-legend map-legend">
            <span><i class="lg-forest"></i><span data-i18n="pat.lg.forest"></span></span>
            <span><i class="lg-cov"></i><span data-i18n="pat.lg.cov"></span></span>
            <span><i class="lg-gain"></i><span data-i18n="pat.lg.gain"></span></span>
            <span><i class="lg-top"></i><span data-i18n="pat.lg.top"></span></span>
            <span><i class="lg-hit"></i><span data-i18n="pat.lg.hit"></span></span>
          </div>
        </div>
        <div>
          <div class="budget">
            <div class="bl"><span data-i18n="pat.g.budget"></span><output id="b-val"></output></div>
            <div class="bbar" id="b-bar"><span class="fill" id="b-fill"></span></div>
            <p class="bnote" id="b-note" aria-live="polite"></p>
          </div>
          <div class="sliders" id="sliders"></div>
          <div class="btnrow">
            <button type="button" class="btn" id="g-decide" data-i18n="pat.g.decide"></button>
            <button type="button" class="btn ghost" id="g-same" data-i18n="pat.g.same"></button>
            <button type="button" class="btn ghost" id="g-even" data-i18n="pat.g.even"></button>
            <button type="button" class="btn ghost" id="g-clear" data-i18n="pat.g.clear"></button>
          </div>
        </div>
      </div>
      <div class="kpis" id="g-kpis"></div>
      <p class="readline" id="g-read" aria-live="polite"></p>
      <div class="tblwrap"><table class="data" id="g-log"></table></div>
      <div class="btnrow">
        <button type="button" class="btn ghost" id="g-new" data-i18n="pat.g.new"></button>
        <button type="button" class="btn" id="g-show" data-i18n="pat.g.show"></button>
      </div>
      <div class="verdict ok" id="g-verdict" aria-live="polite"></div>
    </div>
  </section>

  <!-- =================================================================== part 2: the optimum -->
  <section class="block" id="pat-p2" aria-labelledby="pat-p2-h">
    <h2 class="section-title" id="pat-p2-h"><span class="case-num" data-i18n="pat.part2"></span><span data-i18n="pat.p2.title"></span></h2>
    <p class="section-intro" data-i18n-html="pat.p2.intro"></p>
    <div class="card locked" id="opt-locked">
      <p data-i18n="pat.p2.locked"></p>
      <button type="button" class="btn" id="opt-show" data-i18n="pat.g.show"></button>
    </div>
    <div id="opt-body" hidden>
      <div class="card">
        <h3 class="subhead" id="cmp-title"></h3>
        <div class="tblwrap"><table class="data" id="cmp"></table></div>
        <p class="tabnote" id="cmp-note"></p>
      </div>
      <div class="card" style="margin-top:14px">
        <h3 class="subhead" data-i18n="pat.wf.title"></h3>
        <p class="mtext" style="margin-top:0" data-i18n-html="pat.wf.intro"></p>
        <div class="ctl-row" style="margin-top:12px">
          <div class="rng"><label for="wf-lv" data-i18n="pat.wf.level"></label><output id="wf-lvv" for="wf-lv"></output><input type="range" id="wf-lv" min="-40" max="120" step="0.01" value="25"></div>
          <div class="ctl-group"><button type="button" class="btn" id="wf-drop" data-i18n="pat.wf.drop"></button></div>
        </div>
        <div class="chartbox" id="wf" role="img"></div>
        <div class="anim-legend" style="margin-top:6px">
          <span><i class="s-col"></i><span data-i18n="pat.wf.lg.col"></span></span>
          <span><i class="s-cov"></i><span data-i18n="pat.wf.lg.cov"></span></span>
          <span><i class="s-lvl"></i><span data-i18n="pat.wf.lg.lvl"></span></span>
        </div>
        <div class="kpis" id="wf-kpis"></div>
        <p class="tabnote" id="wf-note" aria-live="polite"></p>
        <div class="formula" id="wf-f"></div>
      </div>
      <div class="card" style="margin-top:14px">
        <h3 class="subhead" data-i18n="pat.lp.title"></h3>
        <p class="mtext" style="margin-top:0" data-i18n-html="pat.lp.intro"></p>
        <div class="lpgrid" id="lps"></div>
        <p class="mtext" id="lp-note"></p>
        <p class="tabnote" id="lp-why" data-i18n-html="pat.lp.why"></p>

    if (Math.abs(U - Ustar) > 0.005) {

      g += txt(ml + 4, Y(Ustar) + (U > Ustar ? 15 : -6), T("pat.wf.ustar", { u: num(Ustar, 2) }), "m", "start");
    }
    g += line(ml, Y(U), W - mr, Y(U), "lnA");
    g += txt(W - mr - 4, Y(U) - 8, "U = " + num(U, 2), "a", "end");
    g += '<rect class="grab" x="' + ml + '" y="' + (Y(U) - 12).toFixed(1) + '" width="' + (W - ml - mr) + '" height="24" fill="transparent"/>';
    g += dot(W - mr, Y(U), 6, "dotA grab");
    var need = needs(U);
    $("wf").innerHTML = svg(W, H, g, T("pat.wf.aria", { u: num(U, 2), n: num(need, 2) }));
    $("wf").dataset.h = String(H);
    $("wf-lv").value = U.toFixed(2);
    $("wf-lvv").textContent = cop(U);
    kpis("wf-kpis", [
      [T("pat.wf.k.level"), cop(U)],
      [T("pat.wf.k.need"), T("pat.g.budget.v", { u: num(need, 2), m: m }), need > m + 1e-6 ? "hot" : ""],
      [T("pat.wf.k.opt"), cop(Ustar), "accent"],
      [T("pat.wf.k.set"), T("pat.k.tie.v", { n: at.length, z: zl(at) })]
    ]);
    var key = Math.abs(U - Ustar) <= 0.005 ? "pat.wf.note.at" : U > Ustar ? "pat.wf.note.above" : "pat.wf.note.below";
    $("wf-note").innerHTML = T(key, { u: cop(Ustar), need: num(need, 2), spare: num(m - need, 2), m: m, ha: ha(so.r.loss), z: zn(so.r.fav) });
  }
  function wfFromEvent(ev) {
    var box = $("wf").querySelector("svg"); if (!box) return;
    var rc = box.getBoundingClientRect(), H = +$("wf").dataset.h, sc = H / rc.height;
    var W = boxW("wf", 300, 760), mt = 30, mb = 26, lo = -45, hi = 125;
    var y = (ev.clientY - rc.top) * sc;
    var v = hi - (y - mt) / (H - mt - mb) * (hi - lo);
    S.level = clamp(v, -40, 120);
    if (Math.abs(S.level - sol(S.m).o.U) < 0.25) S.level = null;   // snaps to the optimum
    drawWater();
  }
  function dropWater() {
    cancelAnimationFrame(wfRaf);
    var Ustar = sol(S.m).o.U;
    if (REDUCE) { S.level = null; drawWater(); return; }
    var t0 = performance.now(), from = R[0], dur = 2600;
    (function f(now) {
      var u = clamp((now - t0) / dur, 0, 1);
      S.level = u >= 1 ? null : lerp(from, Ustar, ease.inOut(u));
      drawWater();
      if (u < 1) wfRaf = requestAnimationFrame(f);
    })(t0);
  }
  function renderWfFormula() {
    var so = sol(S.m), o = so.o, parts = [], plain = [];
    o.set.forEach(function (t) {
      if (o.c[t] <= 0) return;
      parts.push("\\tfrac{" + R[t] + "-" + num(o.U, 2) + "}{" + D[t] + "}");
      plain.push("(" + R[t] + " " + MINUS + " " + num(o.U, 2) + ")/" + D[t]);
    });
    var vals = o.set.filter(function (t) { return o.c[t] > 0; }).map(function (t) { return num(o.c[t], 3); });
    var tex = "\\begin{aligned} U^* &= " + num(o.U, 2) + "\\ \\text{" + T("pat.tex.mcop") + "}:\\\\ " +
      "&" + parts.slice(0, 4).join(" + ") + (parts.length > 4 ? " \\\\ &\\quad + " + parts.slice(4).join(" + ") : "") +
      " \\\\ &= " + vals.slice(0, 4).join(" + ") + (vals.length > 4 ? " \\\\ &\\quad + " + vals.slice(4).join(" + ") : "") +
      " = " + S.m + "\\end{aligned}";
    TeX.set($("wf-f"), tex, "U* = " + num(o.U, 2) + ": " + plain.join(" + ") + " = " + S.m);
  }
  function renderLPs() {
    var so = sol(S.m), best = so.lp0.best, h = "";
    so.lp0.list.forEach(function (r) {
      var cls = !r.ok ? " off" : r === best ? " best" : "";
      h += '<div class="lpc' + cls + '"><span class="h">' + esc(T("pat.lp.card", { z: zn(r.t) })) + "</span>";
      if (r.ok) h += "<b>" + esc(ha(r.ha)) + '</b><span class="s">' + esc(T("pat.lp.cov", { z: zn(r.t), p: pct(r.x[r.t]) })) + "</span>";
      else h += "<b>" + esc(T("pat.lp.infeas")) + '</b><span class="s">' + esc(T("pat.lp.infeas.why", { z: zn(r.t) })) + "</span>";
      h += "</div>";
    });
    $("lps").innerHTML = h;
    var off = so.lp0.list.filter(function (r) { return !r.ok; }).map(function (r) { return r.t; });
    $("lp-note").innerHTML = T("pat.lp.note", {
      k: so.nOk, cov: tuple(so.o.c), diff: sci(so.diff),
      z: zn(best.t), ha: ha(best.ha), ms: num(so.lp0.ms, 1)
    }) + (off.length ? " " + T("pat.lp.note.off", { z: zl(off), u: cop(so.o.U) }) : "");
  }
  function renderTies() {
    var so = sol(S.m), r = so.r, rob = so.rob, rn = so.rnd.r;
    $("tie-intro").innerHTML = T("pat.tie.intro", { k: r.tie.length, z: zl(r.tie), u: cop(so.o.U) });
    var rows = [
      [T("pat.tie.fav"), r.fav, r.loss, "acc"],
      [T("pat.tie.adv"), r.adv, r.lossAdv, "hot"],
      [T("pat.tie.rob", { d: cop(DELTA) }), rob.fav, rob.loss, ""],
      [T("pat.tie.rnd"), rn.fav, rn.loss, ""]
    ];
    var h = "<thead><tr><th>" + esc(T("pat.tie.rule")) + "</th><th>" + esc(T("pat.log.zone")) + '</th><th class="num">' + esc(T("pat.log.ha")) + "</th></tr></thead><tbody>";
    rows.forEach(function (q) { h += "<tr><td>" + esc(q[0]) + "</td><td>" + zn(q[1]) + '</td><td class="num ' + q[3] + '">' + esc(ha(q[2])) + "</td></tr>"; });
    $("ties").innerHTML = h + "</tbody>";
    var second = rob.u.slice().sort(function (a, b) { return b - a; })[1];
    $("tie-note").innerHTML = T("pat.tie.note", {
      fav: ha(r.loss), adv: ha(r.lossAdv), diff: ha(r.lossAdv - r.loss),
      z: zn(rob.fav), g: num(rob.max - second, 2), cost: ha(rob.loss - r.loss), rob: ha(rob.loss),
      zr: zn(rn.fav), har: ha(rn.loss), used: num(so.rnd.used, 3)
    });
  }
  function renderOpt() {
    if (!S.shown) return;
    renderCmp(); drawWater(); renderWfFormula(); renderLPs(); renderTies();
  }

  /* ===================================================================================== part 3: tomorrow's patrol */
  var yearCache = null, yRaf = 0;
  function srcCov() { return S.src === "opt" ? sol(S.m).o.c : cUser(); }
  function year() {
    var key = S.m + ":" + S.src + ":" + (S.src === "you" ? S.q.join(",") : "");
    if (yearCache && yearCache.key === key) return yearCache;
    yearCache = replay(srcCov(), S.m); yearCache.key = key;
    return yearCache;
  }
  function drawComb(c, u) {
    var m = S.m, W = boxW("comb", 300, 760), narrow = W < 520, H = 112, ml = 10, mr = 10, top = 40, hh = 36;
    var X = function (v) { return ml + v / m * (W - ml - mr); };
    var cb = comb(c, m, u), g = '<defs><pattern id="pat-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch" x1="0" y1="0" x2="0" y2="6"/></pattern></defs>';
    cb.segs.forEach(function (sg, i) {
      var w = X(sg.b) - X(sg.a);
      if (w <= 0.01) return;
      var hitT = cb.hit.indexOf(sg.t) >= 0 && sg.t >= 0;
      g += rect(X(sg.a), top, w, hh, sg.t < 0 ? "idle" : hitT ? "segH" : i % 2 ? "seg1" : "seg0");
      var lab = sg.t < 0 ? T("pat.d.idle.short") : zn(sg.t);
      ctxMeasure.font = font(700, 12);
      if (w > ctxMeasure.measureText(lab).width + 6) g += txt(X(sg.a) + w / 2, top + hh / 2 + 4, lab, sg.t < 0 ? "m" : "i", "middle");
    });
    for (var k = 0; k <= m; k++) { g += line(X(k), top + hh, X(k), top + hh + 6, "ax"); g += txt(X(k), top + hh + 19, String(k), "m", k === 0 ? "start" : k === m ? "end" : "middle"); }
    for (var j = 0; j < m; j++) {
      var x = X(u + j);
      g += line(x, top - 14, x, top + hh + 2, "tooth");
      g += '<path class="fA" d="M' + (x - 6).toFixed(1) + "," + (top - 26) + " L" + (x + 6).toFixed(1) + "," + (top - 26) + " L" + x.toFixed(1) + "," + (top - 14) + ' Z"/>';
      g += txt(x, top - 30, String(j + 1), "a", "middle");
    }
    $("comb").innerHTML = svg(W, H, g, T("pat.d.comb.aria", { u: num(u, 2), z: zl(cb.hit.filter(function (t) { return t >= 0; })) }));
    return cb;
  }
  var ctxMeasure = document.createElement("canvas").getContext("2d");
  function renderDay() {
    var c = srcCov(), m = S.m, us = seqU(m), u = us[(S.day - 1) % DAYS], cb = drawComb(c, u);
    var r = respond(c), zones = cb.hit.filter(function (t) { return t >= 0; }), idle = cb.hit.length - zones.length;
    var caught = zones.indexOf(r.fav) >= 0;
    dayMap.day({ hit: cb.hit, target: r.fav, caught: caught });
    var read = T("pat.d.read", { d: S.day, u: num(u, 2), z: zl(zones.slice().sort(function (a, b) { return a - b; })) });
    if (idle) read += " " + T("pat.d.idle", { k: idle });
    read += " " + T(caught ? "pat.d.caught" : "pat.d.cut", { z: zn(r.fav), ha: ha(L[r.fav]) });
    $("d-read").innerHTML = read;
    $("d-lg-idle").hidden = cb.total >= m - 1e-9;
    $("day-stage").setAttribute("aria-label", T("pat.d.map.aria", { z: zl(zones), t: zn(r.fav) }));
    kpis("d-kpis", [
      [T("pat.d.k.day"), String(S.day)],
      [T("pat.d.k.u"), num(u, 3)],
      [T("pat.d.k.target", { z: zn(r.fav) }), pct(c[r.fav]), "accent"],
      [T("pat.d.k.exp"), ha(r.loss)]
    ]);
  }
  function renderYear() {
    var c = srcCov(), m = S.m, Y = year(), d = S.days, cnt = Y.cnt[d - 1];
    var W = boxW("year", 300, 760), narrow = W < 520, H = narrow ? 220 : 240, ml = narrow ? 42 : 46, mr = 8, mt = 14, mb = 26;
    var Yp = function (v) { return mt + (1 - v) * (H - mt - mb); };
    var cw = (W - ml - mr) / N, Xc = function (t) { return ml + (t + 0.5) * cw; }, bw = Math.min(30, cw * 0.38), band = Math.min(46, cw * 0.7);
    var g = "", inside = 0, gap = 0, gapT = 0;
    [0, 0.25, 0.5, 0.75, 1].forEach(function (v) { g += line(ml, Yp(v), W - mr, Yp(v), v === 0 ? "ax" : "gr"); g += txt(ml - 5, Yp(v) + 4, pct(v, 0), "m", "end"); });
    for (var t = 0; t < N; t++) {
      var x = Xc(t), f = cnt[t] / d, sd = Math.sqrt(c[t] * (1 - c[t]) / d), a = clamp(c[t] - 2 * sd, 0, 1), b = clamp(c[t] + 2 * sd, 0, 1);
      if (Math.abs(f - c[t]) <= 2 * sd + 1e-12) inside++;
      if (Math.abs(f - c[t]) > gap) { gap = Math.abs(f - c[t]); gapT = t; }
      g += rect(x - band / 2, Yp(b), band, Math.max(1, Yp(a) - Yp(b)), "band");
      g += rect(x - bw / 2, Yp(f), bw, Yp(0) - Yp(f), "fI2");
      g += line(x - band / 2 - 2, Yp(c[t]), x + band / 2 + 2, Yp(c[t]), "lnA");
      g += txt(x, H - 8, zn(t), "i", "middle");
    }
    $("year").innerHTML = svg(W, H, g, T("pat.y.aria", { d: d }));
    $("y-d").value = d;
    $("y-dv").textContent = T("pat.y.days.v", { d: d });
    var per = Y.per.slice(0, d), lo = Math.min.apply(null, per), hi = Math.max.apply(null, per);
    var caught = Y.caught[d - 1] / d;
    kpis("y-kpis", [
      [T("pat.y.k.in"), T("pat.y.k.in.v", { k: inside })],
      [T("pat.y.k.gap"), T("pat.y.k.gap.v", { v: num(100 * gap, 1), z: zn(gapT) })],
      [T("pat.y.k.per"), lo === hi ? T("pat.y.k.per.one", { a: lo }) : T("pat.y.k.per.two", { a: lo, b: hi })],
      [T("pat.y.k.caught", { z: zn(Y.target) }), T("pat.y.k.caught.v", { f: pct(caught), c: pct(c[Y.target]) }), "accent"]
    ]);
    $("y-note").textContent = T("pat.y.note", { d: d, w: num(200 * Math.sqrt(0.25 / d), 1) });
  }
  function playYear() {
    cancelAnimationFrame(yRaf);
    if (REDUCE) { S.days = 365; renderYear(); return; }
    var t0 = performance.now(), dur = 3200;
    (function f(now) {
      var u = clamp((now - t0) / dur, 0, 1);
      S.days = Math.max(1, Math.round(365 * ease.inOut(u)));
      renderYear();
      if (u < 1) yRaf = requestAnimationFrame(f);
    })(t0);
  }

  /* ===================================================================================== notes */
  function renderNotes() {
    var so = sol(S.m), b = so.base, m = S.m, rob = so.rob, rn = so.rnd.r, Y = (S.src === "opt") ? year() : replay(so.o.c, m);
    var c = so.o.c, d = 365, cnt = Y.cnt[d - 1], inside = 0;
    for (var t = 0; t < N; t++) { var sd = Math.sqrt(c[t] * (1 - c[t]) / d); if (Math.abs(cnt[t] / d - c[t]) <= 2 * sd + 1e-12) inside++; }
    $("pat-n1").innerHTML = T("pat.n.p1", { m: m, big: ha(b.big.r.loss), bz: zn(b.big.r.fav), rich: ha(b.rich.r.loss), rz: zn(b.rich.r.fav), even: ha(b.even.r.loss), opt: ha(so.r.loss) });
    $("pat-n2").innerHTML = T("pat.n.p2", { k: so.nOk, u: cop(so.o.U), n: so.r.tie.length });
    $("pat-n3").innerHTML = T("pat.n.p3", { fav: ha(so.r.loss), adv: ha(so.r.lossAdv), z: zn(so.r.fav), za: zn(so.r.adv), rob: ha(rob.loss), rz: zn(rn.fav), rnd: ha(rn.loss) });
    $("pat-n4").innerHTML = T("pat.n.p4", { grid: ha(so.grid.loss), gap: ha(so.grid.loss - so.r.loss), used: num(so.grid.used, 2), m: m, z: zn(so.grid.t) });
    $("pat-n5").innerHTML = T("pat.n.p5", { m: m, k: inside, w: num(200 * Math.sqrt(0.25 / d), 1) });
  }

  /* ===================================================================================== wiring */
  function setM(m) {
    if (m === S.m) return;
    var tot = sum(S.q);
    if (tot > 100 * m + 1e-9) { var k = 100 * m / tot; S.q = S.q.map(function (v) { return Math.floor(v * k); }); }
    S.m = m; S.rounds = []; S.hit = null; S.pulse = null; S.read = null; S.level = null; S.day = 1; yearCache = null;
    cancelAnimationFrame(wfRaf);
    document.querySelectorAll("#m-seg button").forEach(function (o) { o.setAttribute("aria-pressed", String(+o.getAttribute("data-m") === m)); });
    renderAll();
  }
  function renderAll() {
    renderGame(); renderOpt(); renderDay(); renderYear(); renderNotes();
  }
  document.querySelectorAll("#m-seg button").forEach(function (b) { b.addEventListener("click", function () { setM(+b.getAttribute("data-m")); }); });
  $("g-decide").addEventListener("click", decide);
  $("g-same").addEventListener("click", function () { preset("same"); });
  $("g-even").addEventListener("click", function () { preset("even"); });
  $("g-clear").addEventListener("click", function () { preset("clear"); });
  $("g-new").addEventListener("click", newGame);
  $("g-show").addEventListener("click", function () { reveal(true); });
  $("opt-show").addEventListener("click", function () { reveal(false); });
  $("wf-lv").addEventListener("input", function () {
    cancelAnimationFrame(wfRaf);
    S.level = +$("wf-lv").value;
    if (Math.abs(S.level - sol(S.m).o.U) < 0.005) S.level = null;
    drawWater();
  });
  $("wf-drop").addEventListener("click", dropWater);
  $("wf").addEventListener("pointerdown", function (ev) {
    if (!ev.target.classList || !ev.target.classList.contains("grab")) return;
    cancelAnimationFrame(wfRaf);
    wfDrag = true; $("wf").classList.add("drag"); $("wf").setPointerCapture(ev.pointerId); wfFromEvent(ev); ev.preventDefault();
  });
  $("wf").addEventListener("pointermove", function (ev) { if (wfDrag) wfFromEvent(ev); });
  ["pointerup", "pointercancel"].forEach(function (e) { $("wf").addEventListener(e, function () { wfDrag = false; $("wf").classList.remove("drag"); }); });
  document.querySelectorAll("#src-seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      var v = b.getAttribute("data-src");
      if (v === S.src) return;
      S.src = v; S.day = 1;
      document.querySelectorAll("#src-seg button").forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      renderDay(); renderYear();
    });
  });
  $("d-draw").addEventListener("click", function () { S.day = S.day % DAYS + 1; renderDay(); });
  $("y-d").addEventListener("input", function () { cancelAnimationFrame(yRaf); S.days = +$("y-d").value; renderYear(); });
  $("y-play").addEventListener("click", playYear);

  function redrawMaps() { gameMap.fit(); dayMap.fit(); drawGame(); renderDay(); }
  var lastW = window.innerWidth, rz = 0;
  window.addEventListener("resize", function () {
    clearTimeout(rz);
    rz = setTimeout(function () {
      redrawMaps();
      if (window.innerWidth === lastW) return;
      lastW = window.innerWidth;
      if (S.shown) drawWater();
      renderYear();
    }, 120);
  });
  if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redrawMaps);
  new MutationObserver(redrawMaps).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  buildSliders();
  I18N.onChange(function () {
    labelSliders();
    renderAll();
  });
})();
</script>
</body>
