<script>
(function () {
  "use strict";
  var T = I18N.t;
  var MINUS = "−";
  var fmt = function (v, d) { d = d == null ? 2 : d; if (Math.abs(v) < 0.5 * Math.pow(10, -d)) v = 0; return I18N.fmt(v, d, d); };
  var SUP = { "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹", "-": "⁻" };
  function sci(v, tight) {                           // 1.3 × 10⁸ (always positive input)
    var e = Math.floor(Math.log10(v)), m = v / Math.pow(10, e);
    if (Math.round(m * 10) >= 100) { m /= 10; e += 1; }
    var ex = String(e).split("").map(function (c) { return SUP[c]; }).join("");
    return fmt(m, 1) + (tight ? "×10" : " × 10") + ex;
  }
  var num = function (v, d) { var m = fmt(Math.abs(v), d); return m === fmt(0, d) ? m : (v < 0 ? MINUS : "") + m; };
  var texNum = function (v, d) { var m = fmt(Math.abs(v), d); return m === fmt(0, d) ? m : (v < 0 ? "-" : "") + m; };
  var pct = function (v, d) { return T("learn.pct", { v: fmt(v * 100, d == null ? 1 : d) }); };
  var int = function (v) { return I18N.fmt(v, 0, 0); };
  var etaS = function (v) { return I18N.fmt(v, 2, 0); };
  function lossStr(v, tight) {                       // a loss value: 4 decimals, or 10ⁿ notation once it explodes
    if (!isFinite(v)) return "∞";
    if (v >= 1e4) return sci(v, tight);
    if (v >= 10) return fmt(v, 1);
    return fmt(v, 4);
  }
  function r2Str(v, tight) {
    if (!isFinite(v)) return MINUS + "∞";
    if (v <= -1e4) return MINUS + sci(-v, tight);
    return num(v, 3);
  }

  /* =====================================================================================
     The data: three small illustrative sets drawn in sequence from Anim.rng(SEED).
       1. 40 coffee farms: altitude (m) and yield (t/ha of green coffee), yield falling with altitude.
       2. 80 loan applicants: installment as % of monthly income, years of credit history, repaid or not.
       3. 120 points on two interleaved half moons with noise (a standard nonlinear test set).
     Then the random starting weights of the network. Illustrative.
     ===================================================================================== */
  var SEED = 7, NR = 40, NC = 80, NM = 120, NH = 6;
  var rd = function (v, d) { var f = Math.pow(10, d); return Math.round(v * f) / f; };
  var D = (function () {
    var r = Anim.rng(SEED), i;
    var z = function () { var u1 = r(), u2 = r(); return Math.sqrt(-2 * Math.log(1 - u1)) * Math.cos(2 * Math.PI * u2); };
    var reg = [], cls = [], moon = [];
    for (i = 0; i < NR; i++) {
      var alt = Math.round((1200 + 800 * r()) / 10) * 10;
      reg.push({ alt: alt, y: rd(1.30 - 0.07 * (alt - 1600) / 100 + 0.09 * z(), 2) });
    }
    for (i = 0; i < NC; i++) {
      var s = Math.round(10 + 50 * r()), h = rd(15 * r(), 1);
      var p = 1 / (1 + Math.exp(-(1.0 - 2.2 * (s - 35) / 15 + 1.6 * (h - 7.5) / 4.3)));
      cls.push({ s: s, h: h, y: r() < p ? 1 : 0 });
    }
    for (i = 0; i < NM; i++) {
      var c = i % 2, th = Math.PI * r();
      var px = c === 0 ? Math.cos(th) : 1 - Math.cos(th), py = c === 0 ? Math.sin(th) : 0.5 - Math.sin(th);
      // class 1 is the first (upper) moon
      moon.push({ a: rd(px + 0.3 * z(), 3), b: rd(py + 0.3 * z(), 3), y: c === 0 ? 1 : 0 });
    }
    var W = [], V = [];
    for (i = 0; i < NH; i++) W.push([z(), z()]);
    for (i = 0; i < NH; i++) V.push(z() / Math.sqrt(NH));
    return { reg: reg, cls: cls, moon: moon, W: W, V: V };
  })();
  function stats(arr, f) {
    var m = 0, v = 0; arr.forEach(function (o) { m += f(o); }); m /= arr.length;
    arr.forEach(function (o) { v += (f(o) - m) * (f(o) - m); });
    return { m: m, s: Math.sqrt(v / arr.length) };
  }
  // features: altitude in hundreds of metres from 1,600 m; the classification inputs standardized
  var XR = D.reg.map(function (o) { return (o.alt - 1600) / 100; }), YR = D.reg.map(function (o) { return o.y; });
  var SC1 = stats(D.cls, function (o) { return o.s; }), SC2 = stats(D.cls, function (o) { return o.h; });
  var ZC = D.cls.map(function (o) { return [(o.s - SC1.m) / SC1.s, (o.h - SC2.m) / SC2.s]; }), YC = D.cls.map(function (o) { return o.y; });
  var SM1 = stats(D.moon, function (o) { return o.a; }), SM2 = stats(D.moon, function (o) { return o.b; });
  var ZM = D.moon.map(function (o) { return [(o.a - SM1.m) / SM1.s, (o.b - SM2.m) / SM2.s]; }), YM = D.moon.map(function (o) { return o.y; });

  /* =====================================================================================
     Training: full-batch gradient descent, every iterate stored so render(t) only reads.
     ===================================================================================== */
  var MODELS = ["lin", "log", "nn"];
  var K = { lin: 60, log: 200, nn: 1500 };
  var ETA = {
    small: { lin: 0.02, log: 0.15, nn: 0.2 },
    good:  { lin: 0.1, log: 3, nn: 2 },
    large: { lin: 0.25, log: 20, nn: 10 }
  };
  // Not 40 or more for the network: from about η = 12 its path is chaotic, so a change in the last digit of the
  // arithmetic (another browser, another math library) changes the numbers. At η = 10 the zigzag is stable and
  // every value shown is reproducible. ETA_CHAOS is only named in the notes.
  var ETA_CHAOS = 40;
  var SCS = ["small", "good", "large"];
  var LIN0 = [0.8, 0.1];                              // starting line: intercept 0.8 t/ha, slope +0.1 t/ha per 100 m
  var SSTR = (function () { var m = 0, s = 0; YR.forEach(function (y) { m += y; }); m /= NR; YR.forEach(function (y) { s += (y - m) * (y - m); }); return s; })();
  function softplus(q) { return q > 0 ? q + Math.log1p(Math.exp(-q)) : Math.log1p(Math.exp(q)); }
  function sigm(q) { return 1 / (1 + Math.exp(-q)); }

  function linEval(b, w) {                          // mean squared error, R² and gradient
    var s = 0, gb = 0, gw = 0;
    for (var i = 0; i < NR; i++) { var e = b + w * XR[i] - YR[i]; s += e * e; gb += e; gw += e * XR[i]; }
    return { L: s / NR, r2: 1 - s / SSTR, gb: 2 * gb / NR, gw: 2 * gw / NR };
  }
  function trainLin(eta) {
    var n = K.lin, P = new Float64Array(2 * (n + 1)), L = new Float64Array(n + 1), M = new Float64Array(n + 1);
    var b = LIN0[0], w = LIN0[1];
    for (var k = 0; k <= n; k++) {
      var ev = linEval(b, w);
      P[2 * k] = b; P[2 * k + 1] = w; L[k] = ev.L; M[k] = ev.r2;
      b -= eta * ev.gb; w -= eta * ev.gw;
    }
    return { P: P, L: L, M: M, np: 2, K: n, eta: eta };
  }
  function logEval(w) {
    var s = 0, g = [0, 0, 0], ok = 0;
    for (var i = 0; i < NC; i++) {
      var z = ZC[i], q = w[0] + w[1] * z[0] + w[2] * z[1], y = YC[i];
      s += softplus(q) - y * q;
      var d = sigm(q) - y;
      g[0] += d; g[1] += d * z[0]; g[2] += d * z[1];
      if ((q >= 0 ? 1 : 0) === y) ok++;
    }
    return { L: s / NC, acc: ok / NC, g: g.map(function (v) { return v / NC; }) };
  }
  function trainLog(eta) {
    var n = K.log, P = new Float64Array(3 * (n + 1)), L = new Float64Array(n + 1), M = new Float64Array(n + 1);
    var w = [0, 0, 0];
    for (var k = 0; k <= n; k++) {
      var ev = logEval(w);
      P[3 * k] = w[0]; P[3 * k + 1] = w[1]; P[3 * k + 2] = w[2]; L[k] = ev.L; M[k] = ev.acc;
      for (var j = 0; j < 3; j++) w[j] -= eta * ev.g[j];
    }
    return { P: P, L: L, M: M, np: 3, K: n, eta: eta };
  }
  // network parameters in one array: W (6 × 2, row by row), a (6), v (6), c
  var NP = 4 * NH + 1, OA = 2 * NH, OV = 3 * NH, OC = 4 * NH;
  function nnQ(th, o, z1, z2, hbuf) {
    var q = th[o + OC];
    for (var j = 0; j < NH; j++) {
      var h = Math.tanh(th[o + 2 * j] * z1 + th[o + 2 * j + 1] * z2 + th[o + OA + j]);
      if (hbuf) hbuf[j] = h;
      q += th[o + OV + j] * h;
    }
    return q;
  }
  function trainNN(eta) {
    var n = K.nn, P = new Float64Array(NP * (n + 1)), L = new Float64Array(n + 1), M = new Float64Array(n + 1);
    var th = new Float64Array(NP), g = new Float64Array(NP), hb = new Float64Array(NH), i, j, k;
    for (j = 0; j < NH; j++) { th[2 * j] = D.W[j][0]; th[2 * j + 1] = D.W[j][1]; th[OA + j] = 0; th[OV + j] = D.V[j]; }
    th[OC] = 0;
    for (k = 0; k <= n; k++) {
      P.set(th, NP * k);
      g.fill(0);
      var s = 0, ok = 0;
      for (i = 0; i < NM; i++) {
        var z = ZM[i], y = YM[i], q = nnQ(th, 0, z[0], z[1], hb);
        s += softplus(q) - y * q;
        if ((q >= 0 ? 1 : 0) === y) ok++;
        var d = (sigm(q) - y) / NM;
        g[OC] += d;
        for (j = 0; j < NH; j++) {
          g[OV + j] += d * hb[j];
          var dh = d * th[OV + j] * (1 - hb[j] * hb[j]);
          g[2 * j] += dh * z[0]; g[2 * j + 1] += dh * z[1]; g[OA + j] += dh;
        }
      }
      L[k] = s / NM; M[k] = ok / NM;
      for (j = 0; j < NP; j++) th[j] -= eta * g[j];
    }
    return { P: P, L: L, M: M, np: NP, K: n, eta: eta };
  }

  /* ---------- the reference answers ---------- */
  // least squares: the normal equations [1 x̄; x̄ mean(x²)] (b, w) = (ȳ, mean(xy)), solved exactly
  var CF = (function () {

    var sub = T("learn.cap" + (ci + 1) + ".sub", { h: NH });
    if (m && ci < 3 && t >= WIN[m][1]) sub = T("learn.cap.oc." + run(m).oc);
    if (ci === 3 && t >= WIN.land[1]) sub = T("learn.cap4.oc." + run("lin").oc);
    return [T("learn.cap" + (ci + 1)), sub];
  }
  function drawCaption(t) {
    var ci = chapterAt(t);
    var a = ci === 0 ? seg(t, 0.4, 1.1) : seg(t, CH[ci] + 0.15, CH[ci] + 0.8);
    if (ci < CH.length - 1) a *= 1 - seg(t, CH[ci + 1] - 0.45, CH[ci + 1] - 0.05);
    if (t >= DUR - 1e-6) a = 1;
    if (a <= 0) return;
    var lines = captions(t), x = L.capX, y = L.capY, maxW = L.capW - 12;
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = C.accent; ctx.fillRect(x, y - L.ft + 2, 3, L.ft + 1);
    ctx.font = font(700, L.ft); ctx.fillStyle = C.ink; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    var tl = wrap(lines[0], maxW);
    tl.forEach(function (s, k) { ctx.fillText(s, x + 10, y + k * (L.ft + 3), maxW); });
    y += (tl.length - 1) * (L.ft + 3) + L.fs + 6;
    ctx.font = font(400, L.fs + (L.portrait ? 0 : 1)); ctx.fillStyle = C.ink2;
    wrap(lines[1], maxW).forEach(function (s) { ctx.fillText(s, x + 10, y, maxW); y += L.fs + 5; });
    ctx.restore();
  }

  /* ---------- HUD chips ---------- */
  var chips = [0, 1, 2, 3].map(function (i) {
    var el = document.getElementById("learn-c" + i);
    return { el: el, b: el.querySelector("b"), s: el.querySelector("span"), v: null, l: null, o: null, k: null };
  });
  function setChip(i, val, lab, op, kind) {       // lab: [full label, short label]; the short one when the full one does not fit
    var c = chips[i], key = lab.join("|") + "|" + (L.portrait ? 1 : 0) + hudEl.offsetWidth;
    op = Math.round(clamp(op, 0, 1) * 20) / 20;
    if (c.v !== val) { c.b.textContent = val; c.v = val; }
    if (c.l !== key) {
      c.l = key;
      c.s.textContent = L.portrait ? lab[1] : lab[0];
      if (!L.portrait && c.s.scrollWidth > c.s.clientWidth + 1) c.s.textContent = lab[1];
    }
    if (c.o !== op) { c.el.style.opacity = op; c.o = op; }
    if (c.k !== kind) { c.el.classList.toggle("hot", kind === "hot"); c.k = kind; }
  }
  function hud(t) {
    var ci = chapterAt(t), op = seg(t, 0.6, 1.2), tight = L.portrait;
    var K_ = function (k, v) { return [T(k, v), T(k + ".s", v)]; };
    if (ci === 4) {
      var rl = run("lin"), rg = run("log"), rn = run("nn");
      setChip(0, r2Str(rl.M[rl.K], tight), K_("learn.k.r2l"), 1, "");
      setChip(1, pct(rg.M[rg.K]), K_("learn.k.accl"), 1, "");
      setChip(2, pct(rn.M[rn.K]), K_("learn.k.accn"), 1, "");
      setChip(3, T("learn.sc." + state.sc + ".s"), K_("learn.k.step"), 1, "hot");
      return;
    }
    var m = ci === 1 ? "log" : ci === 2 ? "nn" : "lin", r = run(m);
    var kf = ci === 3 ? kAt("land", r.K, t) : kAt(m, r.K, t), k = Math.floor(kf + 1e-9);
    setChip(0, int(k), K_("learn.k.it", { K: int(r.K) }), op, "");
    setChip(1, lossStr(r.L[k], tight), K_("learn.k." + (m === "lin" ? "mse" : "ll")), op, "hot");
    if (ci === 3) {
      var dd = Math.hypot(r.P[2 * k] - CF.b, r.P[2 * k + 1] - CF.w);
      setChip(2, dd >= 1e4 ? sci(dd, tight) : dd >= 10 ? fmt(dd, 1) : fmt(dd, 4), K_("learn.k.dist"), op, "");
    } else setChip(2, m === "lin" ? r2Str(r.M[k], tight) : pct(r.M[k]), K_(m === "lin" ? "learn.k.r2" : "learn.k.acc"), op, "");
    setChip(3, etaS(r.eta), K_("learn.k.eta"), op, "");
  }

  /* ---------- the frame ---------- */
  function chapterAlpha(t, ci) {
    var a = ci === 0 ? 1 : seg(t, CH[ci] + 0.05, CH[ci] + 0.6);
    if (ci < 4) a *= 1 - seg(t, CH[ci + 1] - 0.5, CH[ci + 1] - 0.02);
    if (t >= DUR - 1e-6) a = ci === 4 ? 1 : 0;
    return a;
  }
  function render(t) {
    C = A_.colors();
    HOT = C.accent.toLowerCase() === C["mit-bright"].toLowerCase() ? C.crit : C["mit-bright"];
    if (hudKey !== cv.w + "x" + cv.h + ":" + hudEl.offsetHeight + ":" + hudEl.offsetWidth + ":" + state.sc) layout();
    hud(t);
    ctx.clearRect(0, 0, L.W, L.H);
    ctx.fillStyle = C.surface; ctx.fillRect(0, 0, L.W, L.H);
    ctx.lineCap = "butt"; ctx.lineJoin = "round"; ctx.setLineDash([]); ctx.globalAlpha = 1;
    var ci = chapterAt(t), a = chapterAlpha(t, ci);
    if (a > 0.01) {
      if (ci === 0) drawReg(t, a, mainBox(), false);
      else if (ci === 1) drawCls("log", t, a, mainBox(), false);
      else if (ci === 2) drawCls("nn", t, a, mainBox(), false);
      else if (ci === 3) drawLand(t, a);
      else drawRecipe(t, a);
    }
    ctx.globalAlpha = 1;
    drawLossPanel(t, ci);
    drawCaption(t);
  }

  var player = A_.create({
    root: root,
    duration: DUR,
    chapters: CH.map(function (c, k) { return { t: c, key: "learn.ch" + (k + 1) }; }),
    onResize: function () { cv.fit(); layout(); },
    render: render
  });

  /* =====================================================================================
     Page text: status line, data, results, step sizes, notes
     ===================================================================================== */
  function metricTxt(m, v) { return m === "lin" ? T("learn.st.r2", { v: r2Str(v) }) : T("learn.st.acc", { v: pct(v) }); }
  function ocTxt(m, r) {
    var ref = REF[m], v = { m: T("learn.m." + m), v: lossStr(r.L[r.K]), k: int(r.K), r: ref != null ? lossStr(ref) : "", top: lossStr(r.top),
      ref: T(m === "lin" ? "learn.ref.cf" : "learn.ref.newton") };
    var key = "learn.st." + r.oc + (r.cycle2 ? "2" : "");
    return T(key, v) + " " + metricTxt(m, r.M[r.K]);
  }
  function renderScenText() {
    var R_ = RUN[state.sc];
    document.getElementById("learn-status").innerHTML = "<b>" + T("learn.sc." + state.sc) + ".</b> " +
      MODELS.map(function (m) { return ocTxt(m, R_[m]); }).join(" ");
    stage.setAttribute("aria-label", T("learn.anim.aria") + " " + T("learn.anim.aria.nums", {
      s: T("learn.sc." + state.sc), l: lossStr(R_.lin.L[R_.lin.K]), r2: r2Str(R_.lin.M[R_.lin.K]), cf: lossStr(CF.L),
      g: lossStr(R_.log.L[R_.log.K]), ga: pct(R_.log.M[R_.log.K]), n: lossStr(R_.nn.L[R_.nn.K]), na: pct(R_.nn.M[R_.nn.K])
    }));
  }
  function renderData() {
    document.getElementById("learn-data").textContent = T("learn.data.p", {
      seed: SEED, nr: NR, nc: NC, nm: NM, a0: int(1200), a1: int(2000), b0: fmt(LIN0[0], 1), w0: fmt(LIN0[1], 1), rep: int(YC.reduce(function (s, y) { return s + y; }, 0)), h: NH, np: NP
    });
  }
  function ocCell(m, r) {
    var bad = r.oc === "div" || r.oc === "bounce";
    return "<span class='oc" + (bad ? " bad" : "") + "'>" + T("learn.oc." + r.oc + (r.cycle2 ? "2" : "")) + "</span>";
  }
  function renderSolution() {
    var R_ = RUN[state.sc];
    document.getElementById("learn-sol-title").textContent = T("learn.sol.title", { s: T("learn.sc." + state.sc) });
    var h = "<thead><tr><th class='rowh'>" + T("learn.sol.model") + "</th><th class='num'>η</th><th class='num wide'>" + T("learn.sol.steps") +
      "</th><th class='num wide'>" + T("learn.sol.start") + "</th><th class='num'>" + T("learn.sol.end") + "</th><th class='num'>" + T("learn.sol.ref") +
      "</th><th class='num'>" + T("learn.sol.metric") + "</th></tr></thead><tbody>";
    MODELS.forEach(function (m) {
      var r = R_[m], ref = REF[m];
      h += "<tr><td class='rowh'>" + T("learn.m." + m) + "</td><td class='num'>" + etaS(r.eta) + "</td><td class='num wide'>" + int(r.K) +
        "</td><td class='num wide'>" + lossStr(r.L[0]) + "</td><td class='num" + (r.oc === "conv" ? " best" : "") + "'>" + lossStr(r.L[r.K]) + ocCell(m, r) +
        "</td><td class='num" + (ref == null ? " dim" : "") + "'>" + (ref == null ? T("learn.sol.none") : lossStr(ref)) + "</td><td class='num'>" +
        (m === "lin" ? "R² " + r2Str(r.M[r.K]) : pct(r.M[r.K])) + "</td></tr>";
    });
    document.getElementById("learn-sol").innerHTML = h + "</tbody>";
    // least squares: the normal equations with their numbers
    document.getElementById("learn-cf-p").innerHTML = T("learn.sol.cf.p", { n: NR });
    var A = CF.A;
    var tex = "\\begin{aligned}& \\begin{pmatrix} " + texNum(A[0][0], 0) + " & " + texNum(A[0][1], 4) + " \\\\ " + texNum(A[1][0], 4) + " & " + texNum(A[1][1], 4) +
      " \\end{pmatrix}\\begin{pmatrix} b \\\\ w \\end{pmatrix} = \\begin{pmatrix} " + texNum(CF.rhs[0], 4) + " \\\\ " + texNum(CF.rhs[1], 4) +
      " \\end{pmatrix} \\\\[4pt] & \\Rightarrow\\; \\begin{pmatrix} b^{*} \\\\ w^{*} \\end{pmatrix} = \\begin{pmatrix} " + texNum(CF.b, 4) + " \\\\ " + texNum(CF.w, 4) + " \\end{pmatrix}\\end{aligned}";
    var plain = "[" + num(A[0][0], 0) + "  " + num(A[0][1], 4) + "; " + num(A[1][0], 4) + "  " + num(A[1][1], 4) + "] (b; w) = (" + num(CF.rhs[0], 4) + "; " +
      num(CF.rhs[1], 4) + ")  →  b* = " + num(CF.b, 4) + "; w* = " + num(CF.w, 4);
    TeX.set(document.getElementById("learn-cf"), tex, plain);
    var rl = R_.lin, bK = rl.P[2 * rl.K], wK = rl.P[2 * rl.K + 1], gap = Math.max(Math.abs(bK - CF.b), Math.abs(wK - CF.w));
    var gapS = !isFinite(gap) ? "∞" : gap >= 1e4 ? sci(gap) : gap < 1e-4 ? sciSmall(gap) : fmt(gap, 4);
    document.getElementById("learn-cf-check").innerHTML = T("learn.sol.cf.check", {
      b: num(CF.b, 4), w: num(CF.w, 4), w100: num(CF.w * 1000, 0), L: lossStr(CF.L), r2: r2Str(CF.r2), k: int(rl.K), eta: etaS(rl.eta),
      bk: Math.abs(bK) >= 1e4 ? (bK < 0 ? MINUS : "") + sci(Math.abs(bK)) : num(bK, 4), wk: Math.abs(wK) >= 1e4 ? (wK < 0 ? MINUS : "") + sci(Math.abs(wK)) : num(wK, 4), gap: gapS
    });
    var rg = R_.log;
    document.getElementById("learn-newton").innerHTML = T("learn.sol.newton", {
      it: NEWTON.it, L: lossStr(NEWTON.L), acc: pct(NEWTON.acc), w0: num(NEWTON.w[0], 3), w1: num(NEWTON.w[1], 3), w2: num(NEWTON.w[2], 3),
      k: int(rg.K), eta: etaS(rg.eta), g: lossStr(rg.L[rg.K]), ga: pct(rg.M[rg.K])
    });
    var rn = R_.nn;
    document.getElementById("learn-net").innerHTML = T("learn.sol.net", {
      np: NP, h: NH, k: int(rn.K), eta: etaS(rn.eta), l0: lossStr(rn.L[0]), l: lossStr(rn.L[rn.K]), acc: pct(rn.M[rn.K]), top: lossStr(rn.top)
    });
  }
  function sciSmall(v) {                            // 3.2 × 10⁻⁹ for tiny gaps
    if (v === 0) return "0";
    var e = Math.floor(Math.log10(v)), m = v / Math.pow(10, e);
    if (Math.round(m * 10) >= 100) { m /= 10; e += 1; }
    return fmt(m, 1) + " × 10" + String(e).split("").map(function (c) { return SUP[c]; }).join("");
  }
  function renderLevels() {
    var h = "<thead><tr><th class='rowh'>" + T("learn.lv.step") + "</th>" + MODELS.map(function (m) { return "<th class='num'>" + T("learn.m." + m) + "</th>"; }).join("") +
      "</tr></thead><tbody>";
    SCS.forEach(function (sc) {
      h += "<tr" + (sc === state.sc ? " class='on'" : "") + "><td class='rowh'>" + T("learn.sc." + sc) + "</td>";
      MODELS.forEach(function (m) {
        var r = RUN[sc][m];
        h += "<td class='num'>η = " + etaS(r.eta) + "<br>" + lossStr(r.L[r.K]) + ocCell(m, r) + "</td>";
      });
      h += "</tr>";
    });
    h += "<tr><td class='rowh'>" + T("learn.lv.ref") + "</td><td class='num'>" + lossStr(CF.L) + "</td><td class='num'>" + lossStr(NEWTON.L) +
      "</td><td class='num dim'>" + T("learn.sol.none") + "</td></tr>";
    document.getElementById("learn-lv").innerHTML = h + "</tbody>";
    document.getElementById("learn-lv-note").textContent = T("learn.lv.note", {
      lmax: fmt(CF.lmax, 3), emax: fmt(CF.etaMax, 3), le: fmt(NEWTON.lmax, 4), ee: fmt(NEWTON.etaMax, 2),
      e1: etaS(ETA.large.lin), e2: etaS(ETA.large.log)
    });
  }
  function renderNotes() {
    var R_ = RUN[state.sc], rl = RUN.good.lin, rn = RUN.good.nn, rnL = RUN.large.nn;
    document.getElementById("learn-n1").textContent = T("learn.n.p1", {
      b: num(CF.b, 3), w: num(CF.w * 1000, 0), r2: r2Str(CF.r2), L: lossStr(CF.L), k: int(rl.K), eta: etaS(rl.eta)
    });
    document.getElementById("learn-n2").textContent = T("learn.n.p2", {
      it: NEWTON.it, L: lossStr(NEWTON.L), acc: pct(NEWTON.acc), g: lossStr(RUN.good.log.L[K.log]), k: int(K.log)
    });
    document.getElementById("learn-n3").textContent = T("learn.n.p3", {
      np: NP, h: NH, l: lossStr(rn.L[K.nn]), acc: pct(rn.M[K.nn]), top: lossStr(rnL.top), k: int(K.nn), accL: pct(rnL.M[K.nn]),
      lL: lossStr(rnL.L[K.nn]), eL: etaS(rnL.eta), eC: etaS(ETA_CHAOS)
    });
    document.getElementById("learn-n4").textContent = T("learn.n.p4");
    void R_;
  }

  var segBtns = document.querySelectorAll("#learn-seg button");
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      if (state.sc === b.getAttribute("data-sc")) return;
      state.sc = b.getAttribute("data-sc");
      segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      layout();
      renderScenText(); renderSolution(); renderLevels(); renderNotes();
      if (A_.reducedMotion) { player.seek(DUR); return; }
      var ci = chapterAt(player.time);
      if (player.time < 1.5 || ci === 4) player.refresh();
      else { player.seek(CH[ci] + 0.001); player.play(); }
    });
  });

  function renderPage() {
    renderScenText(); renderData(); renderSolution(); renderLevels(); renderNotes();
    hudKey = "";
    player.refresh();
  }
  I18N.onChange(renderPage);
  renderPage();
})();
</script>
</body>
</html>
