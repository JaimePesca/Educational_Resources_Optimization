<style>
  [hidden] { display: none !important; }
  /* new or urgent cues: bright red, or the crit shade where dark mode makes the accent that same red */
  :root { --hot: var(--mit-bright); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --hot: var(--crit); } }
  :root[data-theme="dark"] { --hot: var(--crit); }

  /* ---- masthead extras and part index ---- */
  .series { margin: 12px 0 0; font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .series a { font-weight: 600; }
  .case-nav { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 900px) { .case-nav { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 480px) { .case-nav { grid-template-columns: minmax(0, 1fr); } }
  .case-nav a {
    display: flex; gap: 9px; align-items: baseline; padding: 10px 12px; min-width: 0;
    background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--accent); border-radius: 3px;
    color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14px; line-height: 1.3;
  }
  .case-nav a:hover { background: var(--surface2); }
  .case-nav .n, .case-num { font-family: var(--font-mono); color: var(--accent-text); font-weight: 600; }
  .case-num { display: block; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }
  section.block { scroll-margin-top: 70px; grid-template-columns: minmax(0, 1fr); }
  section.block > * { min-width: 0; }

  /* ---- controls ---- */
  .ctl-row { display: flex; flex-wrap: wrap; gap: 12px 26px; align-items: flex-end; }
  .ctl-group { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .ctl-group .lbl { font-size: 13px; color: var(--ink2); font-weight: 600; }
  button.btn {
    font: 600 13px var(--font-sans); color: var(--on-solid); background: var(--accent); border: 1px solid var(--accent); border-radius: 2px;
    padding: 8px 12px; cursor: pointer;
  }
  button.btn:hover { filter: brightness(1.1); }
  button.btn:disabled { opacity: 0.45; cursor: default; filter: none; }
  button.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--border); }
  .btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .rng { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; align-items: baseline; min-width: 200px; flex: 1 1 240px; max-width: 380px; }
  .rng label { font-size: 13px; color: var(--ink2); font-weight: 600; }
  .rng output { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
  .rng input[type="range"] { flex: 1 1 100%; width: 100%; accent-color: var(--accent); margin: 4px 0 0; }
  .seg.wrapseg { display: flex; }
  @media (max-width: 560px) {
    .seg.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .seg.grid2 button { border-left: none; border-top: 1px solid var(--border); padding: 8px 6px; }
    .seg.grid2 button:nth-child(-n+2) { border-top: none; }
    .seg.grid2 button:nth-child(2n) { border-left: 1px solid var(--border); }
    .ctl-row > .ctl-group { flex: 1 1 100%; }
  }
  @media (min-width: 561px) and (max-width: 900px) {
    .seg.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .seg.grid4 button { border-left: none; border-top: 1px solid var(--border); }
    .seg.grid4 button:nth-child(-n+4) { border-top: none; }
    .seg.grid4 button:not(:nth-child(4n+1)) { border-left: 1px solid var(--border); }
  }

  /* ---- live numbers ---- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 8px; margin-top: 14px; }
  @media (max-width: 460px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .kpi { border: 1px solid var(--border); border-radius: 3px; padding: 8px 11px; background: var(--surface); min-width: 0; }
  .kpi b { display: block; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); letter-spacing: -0.01em; line-height: 1.2; overflow-wrap: anywhere; }
  .kpi span { display: block; font-size: 12.5px; color: var(--ink2); line-height: 1.3; margin-top: 2px; }
  .kpi.accent { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .kpi.accent b { color: var(--accent-text); }
  @media (max-width: 460px) { .kpi b { font-size: 16px; } .kpi span { font-size: 12px; } }
  .verdict { margin: 14px 0 0; padding: 10px 14px; border-radius: 3px; font-size: 14.5px; border: 1px solid var(--border); border-left: 3px solid var(--ink2); background: var(--surface2); color: var(--ink2); }
  .verdict b { color: var(--ink); }
  .verdict.ok { border-left-color: var(--accent); }
  .verdict.bad { border-color: var(--hot); border-left-color: var(--hot); background: var(--sel); }
  .verdict:empty { display: none; }

  /* ---- layout helpers ---- */
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px 24px; align-items: start; margin-top: 6px; }
  @media (max-width: 860px) { .two { grid-template-columns: minmax(0, 1fr); } }
  .two > div { min-width: 0; }
  .two.wide-l { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); }
  @media (max-width: 860px) { .two.wide-l { grid-template-columns: minmax(0, 1fr); } }
  .subhead { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
  .mhead { margin: 16px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-text); }
  .mhead:first-child { margin-top: 0; }
  .mtext { font-size: 14px; color: var(--ink2); margin: 6px 0 0; max-width: 80ch; }
  .mtext b { color: var(--ink); }
  .chartbox { margin-top: 8px; min-width: 0; }
  .chartbox svg { display: block; width: 100%; max-width: 760px; height: auto; overflow: visible; }
  #fp-sq svg { max-width: 300px; margin: 0 auto; }
  #fp-band svg { max-width: 480px; }
  #x-sq svg { max-width: 380px; margin: 0 auto; }
  .chart-title { margin: 14px 0 0; font-size: 13px; font-weight: 600; color: var(--ink2); }
  .tabnote { font-size: 13px; color: var(--muted); margin: 6px 0 0; max-width: 80ch; }
  .readline { font-size: 13.5px; color: var(--ink2); margin: 10px 0 0; min-height: 2.6em; }
  .readline b { color: var(--ink); }

  /* ---- SVG charts (colours from the tokens) ---- */
  .chartbox svg text { font-family: var(--font-sans); font-size: 12px; fill: var(--ink2); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
  .chartbox svg text.m { fill: var(--muted); font-size: 11px; }
  .chartbox svg .a { fill: var(--accent-text); font-weight: 700; }
  .chartbox svg .i { fill: var(--ink); font-weight: 700; }
  .chartbox svg text.h { fill: var(--hot); font-weight: 700; }
  .chartbox svg text.mono { font-family: var(--font-mono); }
  .chartbox svg .ax { stroke: var(--axis); stroke-width: 1; fill: none; }
  .chartbox svg .gr { stroke: var(--grid); stroke-width: 1; fill: none; }
  .chartbox svg .frame { stroke: var(--ink2); stroke-width: 1.2; fill: none; }
  .chartbox svg .reg { fill: var(--region); stroke: none; }
  .chartbox svg .band { fill: var(--region); stroke: var(--mit-silver); stroke-width: 1; }
  .chartbox svg .lnA { stroke: var(--accent); fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .chartbox svg .lnI { stroke: var(--ink); fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chartbox svg .lnS { stroke: var(--mit-silver); fill: none; stroke-width: 1.2; }
  .chartbox svg .lnH { stroke: var(--hot); fill: none; stroke-width: 2; }
  .chartbox svg .thin { stroke-width: 1.4; }
  .chartbox svg .dash { stroke-dasharray: 5 4; }
  .chartbox svg .dotA { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
  .chartbox svg .dotI { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
  .chartbox svg .dotO { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
  .chartbox svg .fA { fill: var(--accent); }
  .chartbox svg .fI { fill: var(--ink); }
  .chartbox svg .fS { fill: var(--mit-silver); }
  .chartbox svg .grab { cursor: ew-resize; touch-action: none; }

  /* ---- part 1: the game ---- */
  .moves { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 10px; margin-top: 14px; max-width: 520px; }
  .moves button {
    font: 700 18px var(--font-sans); padding: 16px 10px; border-radius: 3px; cursor: pointer;
    background: var(--surface); color: var(--ink); border: 2px solid var(--ink);
  }
  .moves button:hover { background: var(--surface2); }
  .moves button:active { transform: translateY(1px); }
  .moves button:disabled { opacity: 0.4; cursor: default; }
  .moves button small { display: block; font: 400 11px var(--font-mono); color: var(--muted); margin-top: 3px; }
  .strip { display: grid; grid-template-columns: repeat(30, minmax(0, 1fr)); gap: 3px; margin-top: 14px; }
  @media (max-width: 620px) { .strip { grid-template-columns: repeat(15, minmax(0, 1fr)); } }
  .strip span {
    height: 26px; border: 1px solid var(--border); border-radius: 2px; display: grid; place-items: center;
    font: 600 10.5px var(--font-mono); color: var(--muted); background: var(--surface2); min-width: 0; overflow: hidden;
  }
  .strip span.w { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .strip span.l { background: var(--accent); color: var(--on-solid); border-color: var(--accent); }
  .strip span.d { background: var(--mit-silver); color: #000; border-color: var(--mit-silver); }
  .strip span.next { border: 2px dashed var(--accent); background: var(--surface); }
  .anim-legend i.s-w { background: var(--ink); }
  .anim-legend i.s-l { background: var(--accent); }
  .anim-legend i.s-d { background: var(--mit-silver); }
  .anim-legend i.s-band { background: var(--region); border: 1px solid var(--mit-silver); }
  .anim-legend i.s-line { width: 18px; height: 3px; background: var(--accent); }

  /* ---- optimization strips ---- */
  .optstrip {
    border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 3px; background: var(--surface);
    padding: 10px 14px; display: grid; gap: 4px;
  }
  .optstrip .kicker { margin: 0; color: var(--accent-text); }
  .optstrip p { margin: 0; font-size: 14px; color: var(--ink2); max-width: 86ch; }
  .optstrip p b { color: var(--ink); }
  .optstrip .formula { margin: 4px 0 0; }

  /* ---- part 2: animation ---- */
  #gtm-p2 .anim-hud {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px;
    top: 12px; left: 12px; width: min(290px, max(214px, 34%)); max-width: none;
  }
  #gtm-p2 .anim-hud .chip-stat { opacity: 0; min-width: 0; }
  #gtm-p2 .anim-hud .chip-stat span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #gtm-p2 .anim-hud .chip-stat.hot b { color: var(--hot); }
  @media (min-width: 621px) and (max-width: 820px) {
    #gtm-p2 .anim-hud .chip-stat { padding: 4px 7px; font-size: 11px; }
    #gtm-p2 .anim-hud .chip-stat b { font-size: 15px; }
  }
  @media (max-width: 620px) {
    #gtm-p2 .anim-hud { grid-template-columns: repeat(3, minmax(0, 1fr)); top: 8px; left: 8px; right: 8px; width: auto; gap: 4px; }
    #gtm-p2 .anim-hud .chip-stat { padding: 3px 6px; font-size: 11px; }
    #gtm-p2 .anim-hud .chip-stat b { font-size: 14px; }
  }
  #gtm-p2 .anim-legend i.lg-row { width: 18px; height: 4px; background: var(--accent); }
  #gtm-p2 .anim-legend i.lg-col { width: 18px; height: 2.5px; background: var(--ink); }
  #gtm-p2 .anim-legend i.lg-guide { width: 18px; height: 0; border-top: 1.6px dashed var(--ink2); }
  #gtm-p2 .anim-legend i.lg-dash { width: 18px; height: 0; border-top: 2px dashed var(--ink2); }
  #gtm-p2 .anim-legend i.lg-eq { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--accent); }
  #gtm-p2 .anim-legend i.lg-hot { background: var(--hot); }
  .scen-status {
    background: var(--surface2); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 3px; padding: 9px 13px; font-size: 14px; color: var(--ink2); margin: 0;
  }
  .scen-status b { color: var(--ink); }

  /* ---- part 3: 2 x 2 explorer ---- */
  table.bim { border-collapse: collapse; margin-top: 12px; }
  table.bim th { font-size: 12.5px; font-weight: 700; padding: 6px 8px; color: var(--ink); text-align: center; }
  table.bim th.rh { text-align: right; color: var(--accent-text); }
  table.bim th.ch { color: var(--ink); }
  table.bim th.corner { font-weight: 600; font-size: 11.5px; color: var(--muted); text-align: left; line-height: 1.25; }
  table.bim th.corner .r { color: var(--accent-text); display: block; }
  table.bim td { border: 1px solid var(--axis); padding: 6px; text-align: center; white-space: nowrap; }
  table.bim td.eq { box-shadow: inset 0 0 0 2px var(--accent); }
  table.bim input {
    width: 4.6em; font: 600 13px var(--font-mono); padding: 5px 4px; border: 1px solid var(--border); border-radius: 2px;
    background: var(--surface2); text-align: right;
  }
  table.bim input.ra { color: var(--accent-text); }
  table.bim input.cb { color: var(--ink); }
  table.bim input:invalid, table.bim input.bad { border-color: var(--hot); }
  @media (max-width: 460px) { table.bim input { width: 3.9em; font-size: 12px; } table.bim th { padding: 4px; } table.bim td { padding: 4px; } }
  .eqlist { margin-top: 10px; }
  table.data { min-width: 0; margin-top: 8px; }
  table.data th.num, table.data td.num { text-align: right; }
  table.data td.num { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
  table.data td.acc { color: var(--accent-text); font-weight: 700; }
  table.data td.mut { color: var(--muted); }
  @media (max-width: 560px) {
    table.data .wide { display: none; }
    table.data th, table.data td { padding-inline: 5px; font-size: 12px; }
    table.data td.num { font-size: 11.5px; }
  }
  .readout-box { border: 1px solid var(--border); border-left: 3px solid var(--ink2); background: var(--surface2); border-radius: 3px; padding: 9px 13px; font-size: 14px; color: var(--ink2); margin: 12px 0 0; }
  .readout-box b { color: var(--ink); }
  .readout-box.pk { border-left-color: var(--accent); }

  /* ---- part 4: zero-sum ---- */
  table.zs { border-collapse: collapse; margin-top: 12px; }
  table.zs th { font-size: 12px; font-weight: 700; padding: 5px 6px; color: var(--ink2); text-align: center; white-space: nowrap; }
  table.zs th.rh { text-align: right; color: var(--accent-text); }
  table.zs td { border: 1px solid var(--axis); padding: 4px; text-align: center; }
  table.zs td.mm, table.zs th.mm { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); border: none; padding: 4px 8px; white-space: nowrap; }
  table.zs td.mm.best { color: var(--accent-text); font-weight: 700; }
  table.zs td.mm.bestc { color: var(--ink); font-weight: 700; }
  table.zs td.sad { box-shadow: inset 0 0 0 2px var(--accent); }
  table.zs input {
    width: 3.8em; font: 600 13px var(--font-mono); padding: 5px 3px; border: 1px solid var(--border); border-radius: 2px;
    background: var(--surface2); color: var(--ink); text-align: right;
  }
  table.zs input.bad { border-color: var(--hot); }
  @media (max-width: 460px) { table.zs input { width: 3.3em; font-size: 12px; padding: 4px 2px; } table.zs th, table.zs td { padding: 3px; } table.zs td.mm { padding: 3px 4px; font-size: 11.5px; } }
  .lp2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 18px; }
  @media (max-width: 860px) { .lp2 { grid-template-columns: minmax(0, 1fr); } }
  .lp2 > div { min-width: 0; }

  /* ---- model ---- */
  .model-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 22px; align-items: start; }
  @media (max-width: 860px) { .model-grid { grid-template-columns: minmax(0, 1fr); } }
  .model-grid > div { min-width: 0; }
  details.box { margin: 0; }
  details.box .body { max-width: none; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="backlink" href="index.html" data-keep-lang><span aria-hidden="true">←</span> <span data-i18n="gtm.back"></span></a>
    <div class="lang" data-lang-switcher></div>
  </div>
</header>

<div class="wrap">
  <header class="masthead">
    <p class="eyebrow" data-i18n-html="gtm.eyebrow"></p>
    <h1 data-i18n="gtm.title"></h1>
    <p class="lede" data-i18n-html="gtm.lede"></p>
    <p class="series"><a href="read-the-table.html" data-keep-lang data-i18n="gtm.prev"></a><a href="move-by-move.html" data-keep-lang data-i18n="gtm.next"></a></p>
  </header>

  <nav class="case-nav" data-i18n-attr="aria-label:gtm.nav.aria">
    <a href="#gtm-p1"><span class="n">1</span><span data-i18n="gtm.p1.title"></span></a>
    <a href="#gtm-p2"><span class="n">2</span><span data-i18n="nav.animation"></span></a>
    <a href="#gtm-p3"><span class="n">3</span><span data-i18n="gtm.p3.title"></span></a>
    <a href="#gtm-p4"><span class="n">4</span><span data-i18n="gtm.p4.title"></span></a>
    <a href="#gtm-p5"><span class="n">5</span><span data-i18n="gtm.p5.title"></span></a>
  </nav>

  <!-- =================================================================== part 1: beat the machine -->
  <section class="block" id="gtm-p1" aria-labelledby="gtm-p1-h">
    <h2 class="section-title" id="gtm-p1-h"><span class="case-num" data-i18n="gtm.part1"></span><span data-i18n="gtm.p1.title"></span></h2>
    <p class="section-intro" data-i18n-html="gtm.p1.intro"></p>
    <div class="card" id="g-card">
      <div class="ctl-row">
        <div class="ctl-group">
          <span class="lbl" id="g-mode-lbl" data-i18n="gtm.g.mode"></span>
          <div class="seg" role="group" aria-labelledby="g-mode-lbl" id="g-mode">
            <button type="button" data-v="ht" aria-pressed="true" data-i18n="gtm.g.ht"></button>
            <button type="button" data-v="rps" aria-pressed="false" data-i18n="gtm.g.rps"></button>
          </div>
        </div>
      </div>
      <div class="moves" id="g-moves"></div>
      <div class="btnrow">
        <button type="button" class="btn ghost" id="g-auto"></button>
        <button type="button" class="btn ghost" id="g-new" data-i18n="gtm.g.new"></button>
      </div>
      <div class="strip" id="g-strip" aria-hidden="true"></div>
      <div class="anim-legend" style="margin-top:8px">
        <span><i class="s-w"></i><span data-i18n="gtm.g.lg.w"></span></span>
        <span><i class="s-l"></i><span data-i18n="gtm.g.lg.l"></span></span>
        <span id="g-lg-d"><i class="s-d"></i><span data-i18n="gtm.g.lg.d"></span></span>
      </div>
      <div class="kpis" id="g-kpis"></div>
      <p class="readline" id="g-read" aria-live="polite"></p>
      <p class="chart-title" id="g-chart-title"></p>
      <div class="chartbox" id="g-chart" role="img"></div>

    [0, 0.25, 0.5, 0.75, 1].forEach(function (p) { b += txt(GX(p), H - 12, num(p, 2), "m", "middle"); });
    // the shaded region under the lower envelope (row view) or over the upper envelope (column view)
    var ep = []; for (var s = 0; s <= 200; s++) ep.push([GX(s / 200), GY(env(s / 200))]);
    var base = rowView ? GY(lo) : GY(hi);
    b += '<polygon class="reg" points="' + [[GX(0), base]].concat(ep, [[GX(1), base]]).map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ") + '"/>';
    // lines with their names at the right end (spread when they would touch)
    var ends = Ls.map(function (Lq) { return { y: GY(Lq.b), name: Lq.name }; }).sort(function (u, w) { return u.y - w.y; });
    for (var e = 1; e < ends.length; e++) if (ends[e].y - ends[e - 1].y < 14) ends[e].y = ends[e - 1].y + 14;
    Ls.forEach(function (Lq) { b += line(GX(0), GY(Lq.a), GX(1), GY(Lq.b), "lnS"); });
    ends.forEach(function (en) { b += txt(GX(1) + 8, en.y + 4, T(rowView ? "gtm.z.g.vsC" : "gtm.z.g.vsR", { s: en.name }), "m", "start"); });
    b += poly(ep, rowView ? "lnA" : "lnI");
    // the optimum and the dragged point
    var popt = rowView ? Z.x[0] : Z.y[0];
    b += line(GX(popt), GY(Z.v), GX(popt), GY(lo), "lnI thin dash") + dot(GX(popt), GY(Z.v), 6.5, "dotA");
    b += txt(GX(popt), GY(Z.v) - 12, "v = " + nice(Z.v, 3), "a", "middle");
    var gv = env(pv);
    b += line(GX(pv), GY(hi), GX(pv), GY(lo), "lnH thin") + dot(GX(pv), GY(gv), 5, "dotO");
    b += '<rect class="grab" x="' + GX(0) + '" y="' + mt + '" width="' + (GX(1) - GX(0)) + '" height="' + (H - mt - mb) + '" fill="transparent"/>';
    box.innerHTML = svg(W, H, b, T("gtm.z.g.aria"));
    ZS.geo = { W: W, x0: GX(0), x1: GX(1) };
    $("z-g-note").textContent = T(rowView ? "gtm.z.g.noteR" : "gtm.z.g.noteC", { p: num(pv, 2), g: nice(gv, 3), po: nice(popt, 3), v: nice(Z.v, 3) });
  }
  // dragging on the chart moves the mix (the listeners sit on the container, which survives every redraw)
  var zDrag = false;
  function zSetFrom(ev) {
    var s = $("z-graph").querySelector("svg"), G = ZS.geo;
    if (!s || !G) return;
    var r = s.getBoundingClientRect(), sx = (ev.clientX - r.left) / r.width * G.W;
    $("z-p").value = String(clamp(Math.round((sx - G.x0) / (G.x1 - G.x0) * 100) / 100, 0, 1));
    renderGraph(ZS.last);
  }
  function niceTicks(lo, hi, n) {
    var span = hi - lo, step = Math.pow(10, Math.floor(Math.log10(span / n))), err = span / n / step;
    if (err >= 7.5) step *= 10; else if (err >= 3.5) step *= 5; else if (err >= 1.5) step *= 2;
    var out = [];
    for (var v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(Math.round(v / step) * step);
    return out;
  }
  function runSim(N) {
    var Z = ZS.last || solveZS(ZS.A);
    ZS.run++;
    var seed = 500 + ZS.run, rng = AN.rng(seed), A = Z.A;
    var cum = function (v) { var c = [], s = 0; v.forEach(function (x) { s += x; c.push(s); }); return c; };
    var cx = cum(Z.x), cy = cum(Z.y);
    var pick = function (c, u) { for (var k = 0; k < c.length; k++) if (u < c[k]) return k; return c.length - 1; };
    var sum = 0, pts = [], nextLog = 1;
    for (var t = 1; t <= N; t++) {
      var i = pick(cx, rng() * cx[cx.length - 1]), j = pick(cy, rng() * cy[cy.length - 1]);
      sum += A[i][j];
      if (t >= nextLog || t === N) { pts.push([t, sum / t]); nextLog = Math.max(t + 1, Math.ceil(t * 1.015)); }
    }
    ZS.sim = { N: N, seed: seed, avg: sum / N, pts: pts, v: Z.v, sigma: Z.sigma };
    renderSim(Z);
  }
  function renderSim(Z) {
    var box = $("z-sim"), sm = ZS.sim;
    $("z-sim-lg").hidden = !sm;
    if (!sm) { box.innerHTML = ""; $("z-sim-note").textContent = T("gtm.z.sim.wait"); return; }
    var W = boxW("z-sim", 300, 760), H = 240, ml = 52, mr = 14, mt = 12, mb = 30, LN = Math.log(sm.N), b = "";
    var h10 = 1.96 * sm.sigma / Math.sqrt(10), lo = sm.v - Math.max(h10, 0.5), hi = sm.v + Math.max(h10, 0.5);
    var SX = function (t) { return ml + Math.log(t) / LN * (W - ml - mr); }, SY = function (v) { return mt + (hi - clamp(v, lo, hi)) / (hi - lo) * (H - mt - mb); };
    niceTicks(lo, hi, 5).forEach(function (v) { b += line(ml, SY(v), W - mr, SY(v), "gr") + txt(ml - 6, SY(v) + 4, nice(v, 2), "m", "end"); });
    [1, 10, 100, 1000, 10000, 100000].forEach(function (t) { if (t <= sm.N) b += txt(SX(t), H - 10, I18N.fmt(t, 0), "m", "middle"); });
    var up = [], dn = [];
    for (var t = 1; t <= sm.N; t = Math.ceil(t * 1.05)) { var hh = 1.96 * sm.sigma / Math.sqrt(t); up.push([SX(t), SY(sm.v + hh)]); dn.push([SX(t), SY(sm.v - hh)]); }
    var hN = 1.96 * sm.sigma / Math.sqrt(sm.N);
    up.push([SX(sm.N), SY(sm.v + hN)]); dn.push([SX(sm.N), SY(sm.v - hN)]);
    b += '<polygon class="band" points="' + up.concat(dn.slice().reverse()).map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ") + '"/>';
    b += line(ml, SY(sm.v), W - mr, SY(sm.v), "lnI thin dash");
    if (Math.abs(sm.v) > 1e-9 && sm.v - lo > 0 && hi - 0 > 0 && lo < 0) b += line(ml, SY(0), W - mr, SY(0), "lnS");
    b += poly(sm.pts.map(function (p) { return [SX(p[0]), SY(p[1])]; }), "lnA thin");
    b += txt(W - mr, SY(sm.v) - 6, "v = " + nice(sm.v, 3), "i", "end");
    box.innerHTML = svg(W, H, b, T("gtm.z.sim.aria", { n: I18N.fmt(sm.N, 0), a: num(sm.avg, 3) }));
    var vis = Math.abs(sm.v) > 1e-9 ? T(hN < Math.abs(sm.v) ? "gtm.z.sim.vis" : "gtm.z.sim.hid", { h: num(hN, 3), v: nice(sm.v, 3) }) : "";
    $("z-sim-note").textContent = T("gtm.z.sim.res", { n: I18N.fmt(sm.N, 0), a: num(sm.avg, 3), v: nice(sm.v, 3), h: num(hN, 3), seed: sm.seed }) + (vis ? " " + vis : "");
  }

  /* ===================================================================================== part 5: correlated equilibrium by LP */
  var CE0 = { a: [[6, 2], [7, 0]], b: [[6, 7], [2, 0]] };
  var CES = { a: null, b: null };
  function ceReset() { CES.a = CE0.a.map(function (r) { return r.slice(); }); CES.b = CE0.b.map(function (r) { return r.slice(); }); ceBuild(); renderCE(); }
  function ceBuild() {
    var st = "yield", h = '<tr><th class="corner"><span class="r">' + esc(T("gtm.pl.row")) + "</span>" + esc(T("gtm.pl.col")) + "</th>";
    [0, 1].forEach(function (j) { h += '<th class="ch">' + esc(stName(st, j)) + "</th>"; });
    h += "</tr>";
    [0, 1].forEach(function (i) {
      h += '<tr><th class="rh">' + esc(stName(st, i)) + "</th>";
      [0, 1].forEach(function (j) {
        h += '<td><input class="ra" type="number" step="any" id="ce-a' + i + j + '" value="' + CES.a[i][j] + '" aria-label="' + esc(T("gtm.x.inA", { p: T("gtm.pl.row"), r: stName(st, i), c: stName(st, j) })) + '"> ' +
          '<input class="cb" type="number" step="any" id="ce-b' + i + j + '" value="' + CES.b[i][j] + '" aria-label="' + esc(T("gtm.x.inA", { p: T("gtm.pl.col"), r: stName(st, i), c: stName(st, j) })) + '"></td>';
      });
      h += "</tr>";
    });
    $("ce-tab").innerHTML = h;
    [0, 1].forEach(function (i) { [0, 1].forEach(function (j) { ["a", "b"].forEach(function (w) {
      var el = $("ce-" + w + i + j);
      el.addEventListener("input", function () {
        var v = parseFloat(el.value);
        if (!isFinite(v) || Math.abs(v) > 1e6) { el.classList.add("bad"); return; }
        el.classList.remove("bad"); CES[w][i][j] = v; renderCE();
      });
    }); }); });
  }
  function solveCE(a, b) {
    // variables pi_11, pi_12, pi_21, pi_22; each incentive row: obeying the device pays at least as much as deviating
    var rows = [
      { a: [a[0][0] - a[1][0], a[0][1] - a[1][1], 0, 0], op: ">=", b: 0 },
      { a: [0, 0, a[1][0] - a[0][0], a[1][1] - a[0][1]], op: ">=", b: 0 },
      { a: [b[0][0] - b[0][1], 0, b[1][0] - b[1][1], 0], op: ">=", b: 0 },
      { a: [0, b[0][1] - b[0][0], 0, b[1][1] - b[1][0]], op: ">=", b: 0 },
      { a: [1, 1, 1, 1], op: "=", b: 1 }
    ];
    var c = [a[0][0] + b[0][0], a[0][1] + b[0][1], a[1][0] + b[1][0], a[1][1] + b[1][1]];
    var R = LP.solve({ sense: "max", c: c, rows: rows });
    return { R: R, rows: rows, c: c };
  }
  function renderCE() {
    var a = CES.a, b = CES.b, st = "yield", CE = solveCE(a, b), R = CE.R;
    var nm = function (i) { return stName(st, i); };
    if (R.status !== "optimal") { $("ce-note").textContent = T("gtm.ce.fail"); return; }
    var pi = R.x, u1 = 0, u2 = 0, k;
    for (k = 0; k < 4; k++) { u1 += pi[k] * a[k >> 1][k & 1]; u2 += pi[k] * b[k >> 1][k & 1]; }
    var h = "<thead><tr><th></th><th class='num'>" + esc(nm(0)) + "</th><th class='num'>" + esc(nm(1)) + "</th></tr></thead><tbody>";
    [0, 1].forEach(function (i) { h += "<tr><td>" + esc(nm(i)) + "</td><td class='num acc'>" + esc(nice(pi[2 * i], 3)) + "</td><td class='num acc'>" + esc(nice(pi[2 * i + 1], 3)) + "</td></tr>"; });
    $("ce-pi").innerHTML = h + "</tbody>";
    // comparisons: the best Nash equilibrium by total payoff, the mixed one, and the device that draws the three cells other than the worst equally
    var S = solve2(a, b);
    var tot = [0, 1, 2, 3].map(function (q) { return a[q >> 1][q & 1] + b[q >> 1][q & 1]; }), worst = tot.indexOf(Math.min.apply(null, tot));
    var dev = [0, 1, 2, 3].map(function (q) { return q === worst ? 0 : 1 / 3; }), d1 = 0, d2 = 0;
    for (k = 0; k < 4; k++) { d1 += dev[k] * a[k >> 1][k & 1]; d2 += dev[k] * b[k >> 1][k & 1]; }
    var devOk = CE.rows.slice(0, 4).every(function (r) { return r.a.reduce(function (s, v, q) { return s + v * dev[q]; }, 0) >= -1e-9; });
    var kp = [[T("gtm.ce.k.ce"), pair(u1, u2, 3), "accent"]];
    if (S.mix) kp.push([T("gtm.ce.k.mix"), pair(S.mix.u, S.mix.v, 3), ""]);
    kp.push([T(devOk ? "gtm.ce.k.dev" : "gtm.ce.k.devno"), pair(d1, d2, 3), ""]);
    $("ce-kpis").innerHTML = kp.map(function (q) { return '<div class="kpi ' + q[2] + '"><b>' + esc(q[1]) + "</b><span>" + esc(q[0]) + "</span></div>"; }).join("");
    // incentive rows with slack and the value of relaxing them (minus the dual)
    var names = [T("gtm.ce.r1", { p: T("gtm.pl.row"), s: nm(0), d: nm(1) }), T("gtm.ce.r1", { p: T("gtm.pl.row"), s: nm(1), d: nm(0) }),
      T("gtm.ce.r1", { p: T("gtm.pl.col"), s: nm(0), d: nm(1) }), T("gtm.ce.r1", { p: T("gtm.pl.col"), s: nm(1), d: nm(0) })];
    h = "<thead><tr><th>" + esc(T("gtm.ce.t.row")) + "</th><th class='num'>" + esc(T("gtm.ce.t.gain")) + "</th><th class='num'>" + esc(T("gtm.ce.t.dual")) + "</th></tr></thead><tbody>";
    for (k = 0; k < 4; k++) {
      var lhs = CE.rows[k].a.reduce(function (s, v, q) { return s + v * pi[q]; }, 0);
      h += "<tr><td>" + esc(names[k]) + "</td><td class='num" + (Math.abs(lhs) < 1e-7 ? " acc" : "") + "'>" + esc(nice(lhs, 3)) + "</td><td class='num'>" + esc(nice(Math.max(0, -R.duals[k]), 3)) + "</td></tr>";
    }
    $("ce-inc").innerHTML = h + "</tbody>";
    $("ce-note").textContent = T("gtm.ce.note", { ce: pair(u1, u2, 3), t: nice(u1 + u2, 3), mx: S.mix ? pair(S.mix.u, S.mix.v, 3) : "·", dv: pair(d1, d2, 3) });
    var vars = ["\\pi_{11}", "\\pi_{12}", "\\pi_{21}", "\\pi_{22}"];
    var lin = function (co) {
      var s = "", first = true;
      co.forEach(function (cf, q) {
        if (Math.abs(cf) < 1e-12) return;
        var mag = Math.abs(cf), cc = Math.abs(mag - 1) < 1e-12 ? "" : texNum(mag) + "\\,";
        if (first) s += cf < 0 ? "{-" + cc + vars[q] + "}" : cc + vars[q]; else s += (cf < 0 ? " - " : " + ") + cc + vars[q];
        first = false;
      });
      return s || "0";
    };
    var tex = "\\begin{aligned} \\max\\;& " + lin(CE.c) + " && \\text{" + T("gtm.tex.total") + "} \\\\ ";
    for (k = 0; k < 4; k++) tex += (k ? "& " : "\\text{ST}\\;& ") + lin(CE.rows[k].a) + " \\ge 0 && \\text{" + T("gtm.tex.inc", { k: k + 1 }) + "} \\\\ ";
    tex += "& " + lin([1, 1, 1, 1]) + " = 1,\\; \\pi \\ge 0 && \\text{" + T("gtm.tex.dev") + "} \\end{aligned}";
    TeX.set($("ce-lp"), tex, T("gtm.ce.lp.plain", { ce: pair(u1, u2, 3) }));
  }

  /* ===================================================================================== notes */
  function renderNotes() {
    var bos = anim.scen("bos").S, pk = PRE.pk(), Spk = solve2(pk.a, pk.b);
    var oe = solveZS(ZPRE.oe.A), ce = solveCE(CE0.a, CE0.b), ceS = solve2(CE0.a, CE0.b), u1 = 0;
    for (var k = 0; k < 4; k++) u1 += ce.R.x[k] * CE0.a[k >> 1][k & 1];
    $("gtm-n1").innerHTML = T("gtm.n.p1");
    $("gtm-n2").innerHTML = T("gtm.n.p2", { p: nice(bos.mix.p), q: nice(bos.mix.q) });
    $("gtm-n3").innerHTML = T("gtm.n.p3", { k: pct(Spk.mix.p, 1), g: pct(Spk.mix.q, 1), s: T("gtm.pct", { v: num(Spk.mix.u, 1) }) });
    $("gtm-n4").innerHTML = T("gtm.n.p4", { v: nice(oe.v), x: tuple(oe.x.map(function (v) { return nice(v); })), s: num(oe.sigma, 2),
      h1: num(1.96 * oe.sigma / Math.sqrt(1000), 2), h3: num(1.96 * oe.sigma / Math.sqrt(100000), 3) });
    $("gtm-n5").innerHTML = T("gtm.n.p5", { ce: nice(u1, 3), mx: nice(ceS.mix.u, 3) });
  }

  /* ===================================================================================== wiring */
  document.querySelectorAll("#g-mode button").forEach(function (b) {
    b.addEventListener("click", function () {
      if (GM.mode === b.getAttribute("data-v")) return;
      GM.mode = b.getAttribute("data-v");
      document.querySelectorAll("#g-mode button").forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      newGame();
    });
  });
  $("g-new").addEventListener("click", newGame);
  $("g-auto").addEventListener("click", autoPlay);
  $("g-card").addEventListener("keydown", function (ev) {
    if (ev.target.tagName === "INPUT") return;
    var k = parseInt(ev.key, 10);
    if (k >= 1 && k <= kOpts() && !GM.timer) { play(k - 1); ev.preventDefault(); }
  });
  $("fp-t").addEventListener("input", renderFP);
  document.querySelectorAll("#x-pre button").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll("#x-pre button").forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      loadPreset(b.getAttribute("data-v")); renderX();
    });
  });
  $("x-s").addEventListener("input", function () { XS.a[0][0] = +$("x-s").value; renderX(); });
  $("x-v").addEventListener("input", function () { XS.V = +$("x-v").value; loadPreset("hawk"); renderX(); });
  $("x-c").addEventListener("input", function () { XS.C = +$("x-c").value; loadPreset("hawk"); renderX(); });
  $("x-k").addEventListener("input", function () { XS.K = +$("x-k").value; loadPreset("chicken"); renderX(); });
  $("x-x0").addEventListener("input", function () { renderPop(solve2(XS.a, XS.b)); });
  document.querySelectorAll("#z-pre button").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll("#z-pre button").forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      zLoad(b.getAttribute("data-v")); renderZ();
    });
  });
  $("z-addr").addEventListener("click", function () { zResize(1, 0); });
  $("z-delr").addEventListener("click", function () { zResize(-1, 0); });
  $("z-addc").addEventListener("click", function () { zResize(0, 1); });
  $("z-delc").addEventListener("click", function () { zResize(0, -1); });
  $("z-p").addEventListener("input", function () { renderGraph(ZS.last); });
  $("z-graph").addEventListener("pointerdown", function (ev) {
    if (!ev.target.classList || !ev.target.classList.contains("grab")) return;
    zDrag = true; $("z-graph").setPointerCapture(ev.pointerId); zSetFrom(ev); ev.preventDefault();
  });
  $("z-graph").addEventListener("pointermove", function (ev) { if (zDrag) zSetFrom(ev); });
  $("z-graph").addEventListener("pointerup", function () { zDrag = false; });
  $("z-graph").addEventListener("pointercancel", function () { zDrag = false; });
  document.querySelectorAll("#z-sim-btns button").forEach(function (b) { b.addEventListener("click", function () { runSim(+b.getAttribute("data-n")); }); });
  $("ce-reset").addEventListener("click", ceReset);
  var lastW = window.innerWidth, rz = 0;
  window.addEventListener("resize", function () {
    clearTimeout(rz);
    rz = setTimeout(function () {
      if (window.innerWidth === lastW) return;
      lastW = window.innerWidth;
      drawGameChart(); renderFP(); renderPop(solve2(XS.a, XS.b)); if (ZS.last) { renderGraph(ZS.last); renderSim(ZS.last); }
    }, 150);
  });

  GM.rng = AN.rng(gameSeed());
  $("g-card").setAttribute("data-seed", String(gameSeed()));
  loadPreset("bos");
  zLoad("oe");
  CES.a = CE0.a.map(function (r) { return r.slice(); }); CES.b = CE0.b.map(function (r) { return r.slice(); });
  var first = true;
  I18N.onChange(function () {
    if (first) { buildMoves(); first = false; }
    buildBim(); zBuild(); ceBuild();
    renderGame(); renderFP(); renderX(); renderZ(); renderCE(); renderNotes();
    anim.refresh();
  });
})();
</script>
