<script>
(function () {
  "use strict";
  var T = I18N.t;
  var MINUS = "−";
  var fmt = function (v, d) { d = d == null ? 2 : d; if (Math.abs(v) < 0.5 * Math.pow(10, -d)) v = 0; return I18N.fmt(v, d, d); };
  var num = function (v, d) { var m = fmt(Math.abs(v), d); return m === fmt(0, d) ? m : (v < 0 ? MINUS : "") + m; };
  var sgn = function (v, d) { var m = fmt(Math.abs(v), d); return m === fmt(0, d) ? m : (v < 0 ? MINUS : "+") + m; };
  var texNum = function (v, d) { var m = fmt(Math.abs(v), d); return m === fmt(0, d) ? m : (v < 0 ? "-" : "") + m; };
  var pct = function (v, d) { return T("cvar.pct", { v: num(v, d == null ? 2 : d) }); };
  var ppt = function (v, d) { return T("cvar.pp", { v: sgn(v, d == null ? 2 : d) }); };   // a change in percentage points

  /* =====================================================================================
     The data: S equally likely monthly scenarios of returns (in %) for three assets, drawn from a
     two regime mixture (calm months and stress months) with Anim.rng(SEED). Illustrative.
     ===================================================================================== */
  var SEED = 42, S = 200, RMIN = 0.4, PSTRESS = 0.08, NA = 3;
  var ASSETS = ["stocks", "tes", "usd"];
  var REG = {                                   // mean, std dev and correlation with stocks of each asset
    calm:   { m: [1.5, 0.8, -0.2], s: [4.4, 0.6, 2.8], c: [0.25, -0.4] },
    stress: { m: [-9, -6, 6.5],    s: [3.5, 2.0, 2.8], c: [0.5, -0.5] }
  };
  var ALPHA = { a90: 0.90, a95: 0.95, a99: 0.99 };
  var KEYS = ["a90", "a95", "a99"];

  var R = (function () {
    var r = Anim.rng(SEED), out = [];
    var z = function () { var u1 = r(), u2 = r(); return Math.sqrt(-2 * Math.log(1 - u1)) * Math.cos(2 * Math.PI * u2); };
    var rd = function (v) { return Math.round(v * 100) / 100; };
    for (var s = 0; s < S; s++) {
      var g = r() < PSTRESS ? REG.stress : REG.calm, z1 = z(), z2 = z(), z3 = z();
      var e = g.m[0] + g.s[0] * z1;
      var b = g.m[1] + g.s[1] * (g.c[0] * z1 + Math.sqrt(1 - g.c[0] * g.c[0]) * z2);
      var d = g.m[2] + g.s[2] * (g.c[1] * z1 + Math.sqrt(1 - g.c[1] * g.c[1]) * z3);
      out.push([rd(e), rd(b), rd(d)]);
    }
    return out;
  })();
  var MU = [0, 1, 2].map(function (i) { var a = 0; R.forEach(function (r) { a += r[i]; }); return a / S; });
  var SIG = [0, 1, 2].map(function (i) {        // covariance of the scenarios (equally likely, divide by S)
    return [0, 1, 2].map(function (j) { var a = 0; R.forEach(function (r) { a += (r[i] - MU[i]) * (r[j] - MU[j]); }); return a / S; });
  });
  var ASTAT = [0, 1, 2].map(function (i) {
    var w = Infinity, b = -Infinity; R.forEach(function (r) { w = Math.min(w, r[i]); b = Math.max(b, r[i]); });
    return { mu: MU[i], sd: Math.sqrt(SIG[i][i]), worst: w, best: b };
  });
  var CORR = [0, 1, 2].map(function (i) { return [0, 1, 2].map(function (j) { return SIG[i][j] / Math.sqrt(SIG[i][i] * SIG[j][j]); }); });

  function lossOf(x) { return R.map(function (r) { return -(r[0] * x[0] + r[1] * x[1] + r[2] * x[2]); }); }
  function varOf(x) { var v = 0; for (var i = 0; i < NA; i++) for (var j = 0; j < NA; j++) v += x[i] * SIG[i][j] * x[j]; return v; }
  function retOf(x) { return MU[0] * x[0] + MU[1] * x[1] + MU[2] * x[2]; }
  // VaR, CVaR and the order of the losses of one portfolio at level alpha (alpha S is an integer here)
  function risk(L, alpha) {
    var m = Math.round((1 - alpha) * S), k = S - m;
    var order = L.map(function (v, i) { return i; }).sort(function (a, b) { return L[a] - L[b] || a - b; });
    var rank = new Array(S); order.forEach(function (s, j) { rank[s] = j; });
    var VaR = L[order[k - 1]], tail = 0;
    for (var j = k; j < S; j++) tail += L[order[j]];
    var ru = 0; L.forEach(function (v) { ru += Math.max(0, v - VaR); });
    return { L: L, m: m, k: k, order: order, rank: rank, VaR: VaR, CVaR: tail / m, ru: VaR + ru / m,
      worst: L[order[S - 1]], best: L[order[0]] };
  }
  function F(L, m, eta) { var a = 0; for (var s = 0; s < S; s++) if (L[s] > eta) a += L[s] - eta; return eta + a / m; }

  // Gaussian elimination with partial pivoting
  function linsolve(A, b) {
    var n = b.length, M = A.map(function (row, i) { return row.concat([b[i]]); }), i, j, k;
    for (k = 0; k < n; k++) {
      var p = k; for (i = k + 1; i < n; i++) if (Math.abs(M[i][k]) > Math.abs(M[p][k])) p = i;
      if (Math.abs(M[p][k]) < 1e-12) return null;
      var tmp = M[k]; M[k] = M[p]; M[p] = tmp;
      for (i = k + 1; i < n; i++) { var f = M[i][k] / M[k][k]; for (j = k; j <= n; j++) M[i][j] -= f * M[k][j]; }
    }
    var x = new Array(n);
    for (i = n - 1; i >= 0; i--) { var s = M[i][n]; for (j = i + 1; j < n; j++) s -= M[i][j] * x[j]; x[i] = s / M[i][i]; }
    return x;
  }
  /* Minimum variance: min x'Σx s.t. sum x = 1, mu'x >= R, x >= 0. For every guess of the active set
     (assets at zero, return constraint tight or not) solve the KKT linear system
       [2Σ_F  -1  -mu_F; 1' 0 0; mu_F' 0 0] [x_F; λ; γ] = [0; 1; R]
     and keep the guess whose solution meets every KKT sign condition (x_F >= 0, γ >= 0, ν >= 0). */
  var MV = (function () {
    var best = null;
    for (var mask = 1; mask < 8; mask++) {
      for (var ret = 0; ret < 2; ret++) {
        var Fs = [0, 1, 2].filter(function (i) { return mask & (1 << i); }), k = Fs.length, n = k + 1 + ret;
        var A = [], b = [], i, j;
        for (i = 0; i < k; i++) {
          var row = Fs.map(function (fj) { return 2 * SIG[Fs[i]][fj]; });
          row.push(-1); if (ret) row.push(-MU[Fs[i]]);
          A.push(row); b.push(0);
        }
        var r1 = Fs.map(function () { return 1; }).concat([0]); if (ret) r1.push(0);
        A.push(r1); b.push(1);
        if (ret) { A.push(Fs.map(function (fj) { return MU[fj]; }).concat([0, 0])); b.push(RMIN); }
        var sol = linsolve(A, b);
        if (!sol) continue;
        var x = [0, 0, 0]; Fs.forEach(function (fi, q) { x[fi] = sol[q]; });
        var lam = sol[k], gam = ret ? sol[k + 1] : 0;
        var nu = [0, 1, 2].map(function (q) {
          if (Fs.indexOf(q) >= 0) return 0;
          var g = 0; for (j = 0; j < NA; j++) g += 2 * SIG[q][j] * x[j];
          return g - lam - gam * MU[q];
        });
        var ok = x.every(function (v) { return v >= -1e-10; }) && gam >= -1e-10 && nu.every(function (v) { return v >= -1e-10; }) &&
          retOf(x) >= RMIN - 1e-10;
        if (ok) {
          var v = varOf(x);
          if (!best || v < best.v - 1e-12) best = { x: x, v: v, lam: lam, gam: gam, nu: nu, F: Fs, ret: !!ret, A: A, b: b, sol: sol };
        }
      }
    }
    return best;
  })();
  var LMV = lossOf(MV.x);

  /* Minimum CVaR (Rockafellar and Uryasev 2000) as an LP over the S scenarios:
       min eta + (1/m) sum u_s  s.t. u_s >= -r_s'x - eta, u_s >= 0, sum x = 1, mu'x >= R, x >= 0,
     with m = (1 - alpha) S and eta free (eta = eta+ - eta-). Solved in the browser with LP.solve, in a
     Web Worker when one can be started (each solve takes a noticeable fraction of a second, so it stays off
     the page's main thread), else on the main thread after the first paint. */
  function cvarProblem(alpha) {
    var m = Math.round((1 - alpha) * S), N = NA + 2 + S, c = new Array(N).fill(0), rows = [], s, i;
    c[NA] = 1; c[NA + 1] = -1;
    for (s = 0; s < S; s++) c[NA + 2 + s] = 1 / m;
    for (s = 0; s < S; s++) {
      var a = new Array(N).fill(0);
      for (i = 0; i < NA; i++) a[i] = -R[s][i];
      a[NA] = -1; a[NA + 1] = 1; a[NA + 2 + s] = -1;
      rows.push({ a: a, op: "<=", b: 0 });          // -r_s'x - eta - u_s <= 0
    }
    var ab = new Array(N).fill(0), ar = new Array(N).fill(0);
    for (i = 0; i < NA; i++) { ab[i] = 1; ar[i] = MU[i]; }
    rows.push({ a: ab, op: "=", b: 1 });
    rows.push({ a: ar, op: ">=", b: RMIN });
    return { sense: "min", c: c, rows: rows };
  }
  function cvarRead(p, res) {
    if (!res || res.status !== "optimal") return null;
    var x = res.x.slice(0, NA), sx = x[0] + x[1] + x[2];
    return { x: x.map(function (v) { return v / sx; }), eta: res.x[NA] - res.x[NA + 1], z: res.z, it: res.iterations,
      nv: p.c.length, nr: p.rows.length, retDual: res.duals[S + 1] };
  }
  var solveLP = (function () {
    var w = null, jobs = [], lpSrc = (document.querySelector('script[src*="assets/lp.js"]') || {}).src;
    function local() {                               // main thread fallback, one solve per task
      if (!jobs.length) return;
      var j = jobs.shift();
      setTimeout(function () { j.cb(LP.solve(j.p)); local(); }, 30);

  function renderLevels() {
    var h = "<thead><tr><th class='rowh'>α</th><th class='num'>" + T("cvar.lv.mvVaR") + "</th><th class='num'>" + T("cvar.lv.mvCVaR") + "</th><th class='num'>" +
      T("cvar.lv.mcVaR") + "</th><th class='num'>" + T("cvar.lv.mcCVaR") + "</th><th class='num'>" + T("cvar.lv.w") + "</th><th class='num wide'>" + T("cvar.lv.sd") +
      "</th></tr></thead><tbody>";
    KEYS.forEach(function (k) {
      var S_ = cache[k];
      if (!S_) { h += "<tr><td class='rowh'>" + fmt(ALPHA[k], 2) + "</td><td class='num dim' colspan='6'>…</td></tr>"; return; }
      h += "<tr" + (k === state.sc ? " class='on'" : "") + "><td class='rowh'>" + fmt(S_.alpha, 2) + "</td><td class='num'>" + pct(S_.A.VaR) + "</td><td class='num'>" +
        pct(S_.A.CVaR) + "</td><td class='num'>" + pct(S_.B.VaR) + "</td><td class='num best'>" + pct(S_.B.CVaR) + "</td><td class='num wcell'>" + wStr(S_.xB) +
        "</td><td class='num wide'>" + pct(S_.sdB) + "</td></tr>";
    });
    document.getElementById("cvar-lv").innerHTML = h + "</tbody>";
    var all = KEYS.every(function (k) { return cache[k]; });
    var note = document.getElementById("cvar-lv-note");
    if (!all) { note.textContent = ""; return; }
    var up = KEYS.filter(function (k) { return cache[k].B.VaR > cache[k].A.VaR + 1e-9; }).map(function (k) { return fmt(ALPHA[k], 2); });
    note.textContent = T("cvar.lv.note", { sd: pct(Math.sqrt(MV.v)), x: wStr(MV.x) }) + (up.length ? " " + T("cvar.lv.up", { a: andList(up) }) : "");
  }
  function renderNotes() {
    var S_ = scen(state.sc);
    if (!S_) return;
    var A = S_.A, B = S_.B;
    document.getElementById("cvar-n1").textContent = T("cvar.n.p1", { k: A.k, S: S, v: pct(A.VaR), m: S_.m, c: pct(A.CVaR), w: pct(A.worst), a: fmt(S_.alpha, 2) });
    document.getElementById("cvar-n2").textContent = T("cvar.n.p2", { S: S, nv: S_.lp.nv, nr: S_.lp.nr, it: S_.lp.it, eta: pct(S_.lp.eta), v: pct(B.VaR) });
    document.getElementById("cvar-n3").textContent = T("cvar.n.p3", {
      t0: pct(S_.xA[1] * 100, 1), t1: pct(S_.xB[1] * 100, 1), d0: pct(S_.xA[2] * 100, 1), d1: pct(S_.xB[2] * 100, 1),
      e0: pct(S_.xA[0] * 100, 1), e1: pct(S_.xB[0] * 100, 1), c0: pct(A.CVaR), c1: pct(B.CVaR), s0: pct(S_.sdA), s1: pct(S_.sdB),
      tw: pct(ASTAT[1].worst), R: pct(RMIN)
    });
    var up = B.VaR > A.VaR + 1e-9;
    document.getElementById("cvar-n4").textContent = T(up ? "cvar.n.p4.up" : "cvar.n.p4.down", { a: fmt(S_.alpha, 2), v0: pct(A.VaR), v1: pct(B.VaR) });
  }

  var segBtns = document.querySelectorAll("#cvar-seg button"), first = true;
  function showScen() {                            // the chosen level is solved: lay it out and play it
    layout();
    renderScenText(); renderSolution(); renderLevels(); renderNotes();
    if (first) { first = false; if (!A_.reducedMotion && player.time < 1.2) player.seek(0); else player.refresh(); return; }
    if (A_.reducedMotion) { player.seek(DUR); return; }
    if (player.time < CH[1]) player.refresh();
    else { player.seek(CH[1] + 0.001); player.play(); }
  }
  function solved(key) {
    renderLevels();
    if (key === state.sc) showScen();
  }
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      if (state.sc === b.getAttribute("data-sc")) return;
      state.sc = b.getAttribute("data-sc");
      segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      if (scen(state.sc)) showScen();
      else { request(state.sc); renderLevels(); player.refresh(); }
    });
  });

  function renderPage() {
    renderSeg(); renderScenText(); renderData(); renderSolution(); renderLevels(); renderNotes();
    hudKey = "";
    player.refresh();
  }
  I18N.onChange(renderPage);
  renderSeg(); renderData(); renderLevels();
  // the chosen level first, then the other two (solveLP runs them one after another, off the main thread)
  request(state.sc);
  KEYS.forEach(request);
})();
</script>
</body>
</html>
