<style>
  [hidden] { display: none !important; }
  /* ---- part index ---- */
  .case-nav { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 560px) { .case-nav { grid-template-columns: minmax(0, 1fr); } }
  .case-nav a {
    display: flex; gap: 9px; align-items: baseline; padding: 10px 12px; min-width: 0;
    background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--accent); border-radius: 3px;
    color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14px; line-height: 1.3;
  }
  .case-nav a:hover { background: var(--surface2); }
  .case-nav .n, .case-num { font-family: var(--font-mono); color: var(--accent-text); font-weight: 600; }
  .case-num { display: block; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }
  section.block { scroll-margin-top: 70px; grid-template-columns: minmax(0, 1fr); }
  section.block > * { min-width: 0; }

  /* ---- controls ---- */
  .ctl-row { display: flex; flex-wrap: wrap; gap: 12px 26px; align-items: flex-end; }
  .ctl-group { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .ctl-group .lbl { font-size: 13px; color: var(--ink2); font-weight: 600; }
  button.btn {
    font: 600 13px var(--font-sans); color: var(--on-solid); background: var(--accent); border: 1px solid var(--accent); border-radius: 2px;
    padding: 8px 12px; cursor: pointer; white-space: normal; text-align: left;
  }
  button.btn:hover { filter: brightness(1.1); }
  button.btn:disabled { opacity: 0.45; cursor: default; filter: none; }
  button.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--border); }
  .rng { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; align-items: baseline; min-width: 200px; flex: 1 1 240px; max-width: 360px; }
  .rng label { font-size: 13px; color: var(--ink2); font-weight: 600; }
  .rng output { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
  .rng input[type="range"] { flex: 1 1 100%; width: 100%; accent-color: var(--accent); margin: 4px 0 0; }
  .seg.terms button { padding: 7px 10px; }
  @media (max-width: 560px) {
    .seg.terms { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .seg.terms button { border-left: none; border-top: 1px solid var(--border); padding: 7px 4px; }
    .seg.terms button:nth-child(-n+3) { border-top: none; }
    .seg.terms button:not(:nth-child(3n+1)) { border-left: 1px solid var(--border); }
    .ctl-row > .ctl-group { flex: 1 1 100%; }
  }

  /* ---- pairwise sliders (part 1) ---- */
  .pairs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; margin-top: 14px; }
  @media (max-width: 760px) { .pairs { grid-template-columns: minmax(0, 1fr); } }
  .pair {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 8px; min-width: 0;
    border: 1px solid var(--border); border-radius: 3px; padding: 8px 11px 9px; background: var(--surface);
  }
  .pair .pa, .pair .pb { font-size: 13.5px; font-weight: 600; color: var(--ink); min-width: 0; }
  .pair .pb { text-align: right; }
  .pair input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 6px 0 0; }
  .pair .ticks { grid-column: 1 / -1; display: flex; justify-content: space-between; padding: 0 5px; font: 10.5px var(--font-mono); color: var(--muted); }
  .pair .ticks span { width: 12px; text-align: center; }
  .pair output { grid-column: 1 / -1; font-size: 13px; color: var(--ink2); margin-top: 4px; min-height: 2.6em; line-height: 1.3; }
  .pair output b { color: var(--ink); }
  .pair output .av { font-family: var(--font-mono); color: var(--ink); font-weight: 600; white-space: nowrap; }
  .pair.flag { border-color: var(--mit-bright); box-shadow: inset 3px 0 0 var(--mit-bright); }
  .pair .flagtxt { color: var(--accent-text); font-weight: 700; }

  /* ---- live numbers ---- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 14px; }
  @media (max-width: 460px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .kpi { border: 1px solid var(--border); border-radius: 3px; padding: 8px 11px; background: var(--surface); min-width: 0; }
  .kpi b { display: block; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); letter-spacing: -0.01em; line-height: 1.2; overflow-wrap: anywhere; }
  .kpi span { display: block; font-size: 12.5px; color: var(--ink2); line-height: 1.3; margin-top: 2px; }
  .kpi.accent { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .kpi.accent b { color: var(--accent-text); }
  .kpi.warn { border-color: var(--mit-bright); box-shadow: inset 3px 0 0 var(--mit-bright); }
  .kpi.warn b { color: var(--accent-text); }
  @media (max-width: 460px) { .kpi b { font-size: 16.5px; } .kpi span { font-size: 12px; } }
  .verdict { margin: 14px 0 0; padding: 10px 14px; border-radius: 3px; font-size: 14.5px; border: 1px solid var(--border); border-left: 3px solid var(--ink2); background: var(--surface2); color: var(--ink2); }
  .verdict b { color: var(--ink); }
  .verdict.ok { border-left-color: var(--accent); }
  .verdict.bad { border-color: var(--mit-bright); border-left-color: var(--mit-bright); background: var(--sel); }
  .verdict.bad b { color: var(--accent-text); }
  .verdict .btn { margin-top: 8px; display: inline-block; }

  /* ---- layout helpers ---- */
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px 24px; align-items: start; margin-top: 6px; }
  @media (max-width: 860px) { .two { grid-template-columns: minmax(0, 1fr); } }
  .two > div { min-width: 0; }
  .mhead { margin: 18px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-text); }
  .mhead .nt { text-transform: none; }
  .mtext { font-size: 14px; color: var(--ink2); margin: 6px 0 0; max-width: 80ch; }
  .mtext b { color: var(--ink); }
  .chartbox { margin-top: 8px; min-width: 0; }
  .chartbox svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chartbox svg text { font-family: var(--font-sans); }
  .chart-title { margin: 12px 0 0; font-size: 13px; font-weight: 600; color: var(--ink2); }

  /* ---- tables ---- */
  table.data { min-width: 0; margin-top: 8px; }
  table.data th.num, table.data td.num { text-align: right; }
  table.data td.num { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
  table.data td.best { color: var(--accent-text); font-weight: 700; }
  table.data td.flag { outline: 2px solid var(--mit-bright); outline-offset: -2px; color: var(--accent-text); font-weight: 700; }
  table.data td.diag { color: var(--muted); }
  table.data td.nw { white-space: nowrap; }
  table.data th small { display: block; font-weight: 400; color: var(--muted); letter-spacing: 0; }
  table.data td.tfn { font-family: var(--font-mono); font-size: 11.5px; line-height: 1.35; white-space: nowrap; text-align: right; }
  table.data td.tfn i { font-style: normal; color: var(--muted); }
  table.data td.tfn b { color: var(--ink); font-weight: 600; }
  table.data td .cell-bar { display: block; height: 5px; background: var(--grid); margin-top: 3px; }
  table.data td .cell-bar i { display: block; height: 100%; background: var(--ink2); }
  table.data td.best .cell-bar i { background: var(--accent); }
  @media (max-width: 560px) {
    table.data .wide { display: none; }
    table.data th, table.data td { padding-inline: 5px; font-size: 12px; }
    table.data td.num { font-size: 11.5px; }
    table.data td.tfn { font-size: 10.5px; }
  }
  @media (max-width: 860px) { table.data .wide2 { display: none; } }
  .tabnote { font-size: 13px; color: var(--muted); margin: 6px 0 0; }

  /* ---- criteria swatches (as in the weights bar) ---- */
  .sw4 { width: 12px; height: 12px; flex: none; border: 1px solid var(--ink2); display: inline-block; vertical-align: -1px; }
  .sw4.k0, .wseg.k0 { background: var(--ink2); }
  .sw4.k1, .wseg.k1 { background: repeating-linear-gradient(135deg, var(--ink2) 0 2px, transparent 2px 5px); }
  .sw4.k2, .wseg.k2 { background: var(--mit-silver); }
  .sw4.k3, .wseg.k3 { background: repeating-linear-gradient(45deg, var(--mit-silver) 0 2px, transparent 2px 5px); }
  .sw4.k2, .sw4.k3 { border-color: var(--mit-silver); }

  /* ---- ranking bars ---- */
  .rank { display: grid; gap: 8px; margin-top: 8px; }
  .rrow { display: grid; grid-template-columns: 150px minmax(0, 1fr) 56px; gap: 10px; align-items: center; }
  @media (max-width: 560px) { .rrow { grid-template-columns: minmax(0, 1fr) 52px; gap: 2px 8px; } .rrow .rbar { grid-column: 1 / -1; grid-row: 2; } }
  .rrow .nm { font-size: 14px; font-weight: 600; color: var(--ink); min-width: 0; line-height: 1.2; }
  .rrow .nm small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  .rrow .rbar { display: flex; height: 22px; background: var(--surface2); border: 1px solid var(--border); overflow: hidden; }
  .rrow .wseg { height: 100%; transition: width 0.2s ease-out; }
  .rrow .wseg + .wseg { box-shadow: -2px 0 0 var(--surface); }
  .rrow .val { font-family: var(--font-mono); font-size: 14px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .rrow.win .nm, .rrow.win .val { color: var(--accent-text); }
  .rrow.win .rbar { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

  /* ---- experts (part 3) ---- */
  .xgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
  @media (max-width: 900px) { .xgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 600px) { .xgrid { grid-template-columns: minmax(0, 1fr); } }
  .xpair { border: 1px solid var(--border); border-radius: 3px; padding: 8px 10px 10px; background: var(--surface); min-width: 0; display: grid; gap: 5px; }
  .xpair h4 { margin: 0 0 2px; font-size: 13.5px; font-weight: 700; color: var(--ink); }
  .xpair label { display: grid; gap: 1px; font-size: 12px; color: var(--muted); min-width: 0; }
  .xpair select {
    width: 100%; min-width: 0; font: 13px var(--font-sans); color: var(--ink); background: var(--surface2);
    border: 1px solid var(--border); border-radius: 2px; padding: 5px 6px;
  }
  .xpair select.edited { border-color: var(--accent); }
  .xpair .agg { font: 11.5px var(--font-mono); color: var(--ink2); margin-top: 2px; }

  /* ---- legends ---- */
  .anim-legend { margin-top: 8px; }
  .anim-legend i.t-a { width: 18px; height: 3px; background: var(--accent); }
  .anim-legend i.t-b { width: 18px; height: 2px; background: var(--ink); }
  .anim-legend i.t-o { width: 18px; height: 2px; background: var(--mit-silver); }
  .anim-legend i.t-x { width: 18px; height: 0; border-top: 1.5px dashed var(--ink2); }
  .anim-legend i.t-cut { width: 18px; height: 5px; background: var(--accent); }
  .anim-legend i.t-c { width: 2px; height: 12px; background: var(--ink); }
  .anim-legend i.t-g { width: 0; height: 12px; border-left: 2px dotted var(--ink); }
  .anim-legend i.t-ov { width: 14px; height: 11px; background: repeating-linear-gradient(135deg, var(--mit-bright) 0 2px, transparent 2px 5px); border: 1px solid var(--mit-bright); }
  .anim-legend i.t-v { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--mit-bright); background: var(--surface); }

  .ops { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 18px; }
  @media (max-width: 820px) { .ops { grid-template-columns: minmax(0, 1fr); } }
  .ops > div { min-width: 0; }
  .ops .chart-title { margin-top: 10px; }
  .ops .chart-title b { font-family: var(--font-mono); font-weight: 600; color: var(--ink); font-size: 12px; }

  .spreadwin { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
  .spreadwin div { border: 1px solid var(--border); border-radius: 3px; padding: 6px 9px; font-size: 12.5px; color: var(--ink2); min-width: 0; background: var(--surface); }
  .spreadwin div b { display: block; color: var(--ink); font-size: 14px; overflow-wrap: anywhere; }
  .spreadwin div.on { border-color: var(--accent); }
  .spreadwin div.flip b { color: var(--accent-text); }

  .limits {
    border-left: 3px solid var(--mit-silver); background: var(--surface2); border-radius: 2px;
    padding: 10px 14px; font-size: 14px; color: var(--ink2); margin: 0; max-width: 92ch;
  }
  .limits b { color: var(--ink); }
  details.ref { margin-top: 14px; }
  details.ref .body { max-width: none; }
  .altgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 22px; }
  @media (max-width: 700px) { .altgrid { grid-template-columns: minmax(0, 1fr); } }
  .altgrid > div { min-width: 0; }
  .altgrid h4 { margin: 10px 0 0; font-size: 13.5px; color: var(--ink); }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="backlink" href="index.html" data-keep-lang><span aria-hidden="true">←</span> <span data-i18n="fahp.back"></span></a>
    <div class="lang" data-lang-switcher></div>
  </div>
</header>

<div class="wrap">
  <header class="masthead">
    <p class="eyebrow" data-i18n-html="fahp.eyebrow"></p>
    <h1 data-i18n="fahp.title"></h1>
    <p class="lede" data-i18n-html="fahp.lede"></p>
  </header>

  <nav class="case-nav" data-i18n-attr="aria-label:fahp.nav.aria">
    <a href="#p1"><span class="n">1</span><span data-i18n="fahp.p1.title"></span></a>
    <a href="#p2"><span class="n">2</span><span data-i18n="fahp.p2.title"></span></a>
    <a href="#p3"><span class="n">3</span><span data-i18n="fahp.p3.title"></span></a>
  </nav>

  <!-- =================================================================== part 1: AHP -->
  <section class="block" id="p1" aria-labelledby="p1-h">
    <h2 class="section-title" id="p1-h"><span class="case-num" data-i18n="fahp.part1"></span><span data-i18n="fahp.p1.title"></span></h2>
    <p class="section-intro" data-i18n-html="fahp.p1.intro"></p>
    <div class="card">
      <div class="ctl-row">
        <div class="ctl-group">
          <span class="lbl" id="p1-pre-lbl" data-i18n="fahp.p1.pre"></span>
          <div class="seg" role="group" aria-labelledby="p1-pre-lbl" id="p1-pre">
            <button type="button" data-v="roaster" aria-pressed="true" data-i18n="fahp.p1.pre.roaster"></button>
            <button type="button" data-v="price" aria-pressed="false" data-i18n="fahp.p1.pre.price"></button>
            <button type="button" data-v="contra" aria-pressed="false" data-i18n="fahp.p1.pre.contra"></button>
          </div>
        </div>
      </div>
      <div class="pairs" id="p1-pairs"></div>
      <div class="kpis" id="p1-kpis"></div>
      <div class="verdict" id="p1-verdict" aria-live="polite"></div>

      <div class="two">
        <div>
          <p class="chart-title" data-i18n="fahp.p1.mx"></p>
          <div class="tblwrap"><table class="data" id="p1-mx"></table></div>
          <p class="tabnote" data-i18n="fahp.p1.mx.note"></p>
        </div>
        <div>
          <p class="chart-title" data-i18n="fahp.p1.wt"></p>
          <div class="tblwrap"><table class="data" id="p1-wt"></table></div>
          <p class="tabnote" id="p1-lls"></p>
        </div>
      </div>

      <p class="chart-title" id="p1-rank-title" data-i18n="fahp.p1.rank"></p>
      <div class="rank" id="p1-rank" role="img"></div>
      <div class="anim-legend" id="p1-legend"></div>

      <details class="ref">
        <summary data-i18n="fahp.p1.alt.title"></summary>
        <div class="body">
          <p data-i18n-html="fahp.p1.alt.p"></p>
          <div class="altgrid" id="p1-alt"></div>
        </div>
      </details>

      <p class="mhead" data-i18n="fahp.p1.model.head"></p>
      <div class="formula" data-fx="fahp.p1.model" data-i18n="fahp.p1.model.formula"></div>
      <p class="mhead" data-i18n="fahp.p1.lls.head"></p>
      <p class="mtext" data-i18n-html="fahp.p1.lls.p"></p>
      <div class="formula" data-fx="fahp.p1.lls" data-i18n="fahp.p1.lls.formula"></div>
    </div>
  </section>

  <!-- =================================================================== part 2: fuzzy sets -->
  <section class="block" id="p2" aria-labelledby="p2-h">
    <h2 class="section-title" id="p2-h"><span class="case-num" data-i18n="fahp.part2"></span><span data-i18n="fahp.p2.title"></span></h2>
    <p class="section-intro" data-i18n-html="fahp.p2.intro"></p>
    <div class="card">
      <div class="ctl-row">
        <div class="ctl-group">
          <span class="lbl" id="p2-sp-lbl" data-i18n="fahp.spread"></span>
          <div class="seg spread-seg" role="group" aria-labelledby="p2-sp-lbl">
            <button type="button" data-v="narrow" aria-pressed="false" data-i18n="fahp.spread.narrow"></button>
            <button type="button" data-v="usual" aria-pressed="true" data-i18n="fahp.spread.usual"></button>
            <button type="button" data-v="wide" aria-pressed="false" data-i18n="fahp.spread.wide"></button>
          </div>
        </div>
        <div class="rng">
          <label for="p2-alpha" data-i18n="fahp.p2.alpha"></label><output id="p2-alpha-out" for="p2-alpha"></output>
          <input type="range" id="p2-alpha" min="0" max="1" step="0.05" value="0.5">
        </div>
      </div>
      <div class="ctl-row" style="margin-top:12px">
        <div class="ctl-group">
          <span class="lbl" id="p2-a-lbl" data-i18n="fahp.p2.termA"></span>
          <div class="seg terms" role="group" aria-labelledby="p2-a-lbl" id="p2-a"></div>
        </div>
        <div class="ctl-group">
          <span class="lbl" id="p2-b-lbl" data-i18n="fahp.p2.termB"></span>
          <div class="seg terms" role="group" aria-labelledby="p2-b-lbl" id="p2-b"></div>
        </div>
      </div>
      <div class="kpis" id="p2-kpis"></div>

      <p class="chart-title" data-i18n="fahp.p2.plot"></p>
      <div class="chartbox" id="p2-plot" role="img"></div>
      <div class="anim-legend">
        <span><i class="t-a"></i><span data-i18n="fahp.p2.lg.a"></span></span>
        <span><i class="t-b"></i><span data-i18n="fahp.p2.lg.b"></span></span>
        <span><i class="t-o"></i><span data-i18n="fahp.p2.lg.o"></span></span>
        <span><i class="t-cut"></i><span data-i18n="fahp.p2.lg.cut"></span></span>
      </div>

      <div class="ops">
        <div><p class="chart-title" id="p2-sum-t"></p><div class="chartbox" id="p2-sum" role="img"></div></div>
        <div><p class="chart-title" id="p2-prod-t"></p><div class="chartbox" id="p2-prod" role="img"></div></div>
        <div><p class="chart-title" id="p2-rec-t"></p><div class="chartbox" id="p2-rec" role="img"></div></div>
      </div>
      <div class="anim-legend">
        <span><i class="t-a"></i><span data-i18n="fahp.p2.lg.res"></span></span>

    // verdict

    var says = fsa(o.vals[w.k]), implied = fmt(w.implied, 2), near = fsa(w.nearest);
    var detail = T("fahp.p1.worst", { a: cname(pi[0]), b: cname(pi[1]), says: says, implied: implied, near: near, e: fmt(w.e, 2) });

  /* ===================================================================================== part 2 */

    // operations

  /* ===================================================================================== part 3 */
  // tier 0: full criterion names; 1: short names; 2: short names without "more important" (narrow selects)
  function optText(k, t, tier) {
    var p = PAIRS[k], c = t > 0 ? p[0] : p[1];
    if (t === 0) return T("fahp.p3.opt.eq");
    return T(tier === 2 ? "fahp.p3.opt.s" : "fahp.p3.opt", { c: tier ? cshort(c) : cname(c), t: T("fahp.tl." + TERMS[Math.abs(t)]) });
  }
  // pick, per pair, the longest option wording that fits the width of its selects
  var measureCtx = null;
  function fitExperts() {

      var s0 = $("p3-x0-" + k);

      var cs = getComputedStyle(s0);
      measureCtx.font = cs.fontStyle + " " + cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
      var avail = s0.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 22, tier;
      for (tier = 0; tier < 2; tier++) {
        var fits = true;
        for (var t = 4; t >= -4 && fits; t--) if (measureCtx.measureText(optText(k, t, tier)).width > avail) fits = false;
        if (fits) break;
      }
      EXPERTS.forEach(function (_, e) {
        var s = $("p3-x" + e + "-" + k);
        [].forEach.call(s.options, function (o) { var txt = optText(k, +o.value, tier); if (o.textContent !== txt) o.textContent = txt; });
      });
    });
  }
  function buildExperts() {

        h += "</select></label>";
      });

    }).join("");
    PAIRS.forEach(function (_, k) {
      EXPERTS.forEach(function (_, e) {

    { stroke: "var(--mit-silver)", sw: 2.2, dash: "2 3" }
  ];
  function renderP3(p1) {
    var d = SPREAD[state.spread], f = fahp(state.ex, d);
    var all = { narrow: fahp(state.ex, SPREAD.narrow), usual: fahp(state.ex, SPREAD.usual), wide: fahp(state.ex, SPREAD.wide) };
    // controls
    var match = null;
    Object.keys(P3PRE).forEach(function (key) { if (P3PRE[key].every(function (r, e) { return r.every(function (v, k) { return v === state.ex[e][k]; }); })) match = key; });
    segShow($("p3-pre"), match);
    var base = P3PRE.cup;
    PAIRS.forEach(function (_, k) {
      EXPERTS.forEach(function (_, e) {

    });

      d: tv(d), mod: ttfn(term(1, d)), str: ttfn(term(2, d)), vst: ttfn(term(3, d)), ext: ttfn(term(4, d))
    }));

    kpis($("p3-kpis"), [
      { v: sname(top), l: T("fahp.p3.k.top", { s: fmt(f.Sc[top], sd) }), cls: "accent" },
      { v: sname(sec), l: T("fahp.p3.k.sec", { s: fmt(f.Sc[sec], sd) }) },
      { v: fmt(V, 2), l: T("fahp.p3.k.v"), cls: V >= 0.5 ? "warn" : "" },
      { v: T("fahp.p3.lvl." + level), l: T("fahp.p3.k.lvl") }
    ]);
    var vd = $("p3-verdict");
    vd.className = "verdict " + (V >= 0.5 ? "bad" : "ok");
    setHTML(vd, T("fahp.p3.v." + level, { a: sname(top), b: sname(sec), v: fmt(V, 2), sa: fmt(f.Sc[top], sd), sb: fmt(f.Sc[sec], sd), ma: fmt(f.S[top][1], sd), mb: fmt(f.S[sec][1], sd) }));
    setHTML($("p3-spreadwin"), ["narrow", "usual", "wide"].map(function (k) {
      var g = all[k], flip = g.top !== all.narrow.top;
      return "<div class='" + (k === state.spread ? "on" : "") + (flip ? " flip" : "") + "'>" + T("fahp.p3.winat", { s: T("fahp.spread." + k) }) +
        "<b>" + sname(g.top) + "</b>" + T("fahp.p3.winat.v", { v: fmt(g.V, 2) }) + "</div>";
    }).join(""));
    // fuzzy weights plot
    var wmax = Math.max.apply(null, f.w.map(function (x) { return x[2]; }));
    var P = frame($("p3-wplot"), 0, Math.max(0.2, wmax * 1.05), { top: 44, h: $("p3-wplot").clientWidth < 480 ? 200 : 220 });
    f.w.forEach(function (a, j) { tri(P, a, WSTY[j]); });
    peakLabels(P, order(f.W).map(function (j) { return { x: P.X(f.w[j][1]), text: cshort(j), fill: "var(--ink)", bold: j === argmax(f.W) }; }));
    f.w.forEach(function (a, j) {
      var cx = P.X(f.c[j]);
      el("line", { x1: cx, x2: cx, y1: P.Y(0) - 8, y2: P.Y(0) + 5, stroke: "var(--ink)", "stroke-width": 2 }, P.top);
    });
    $("p3-wplot").setAttribute("aria-label", T("fahp.p3.wplot.aria", { list: CRIT.map(function (_, j) { return cname(j) + " " + ftfn(f.w[j], 3); }).join("; ") }));
    setHTML($("p3-wlegend"), CRIT.map(function (_, j) {
      var s = WSTY[j];
      return "<span><i style='width:18px;height:0;border-top:2.5px " + (s.dash ? (s.dash.charAt(0) === "2" ? "dotted" : "dashed") : "solid") + " " + s.stroke + "'></i><span>" + cname(j) + "</span></span>";
    }).join("") + "<span><i class='t-c'></i><span data-i18n='fahp.p3.lg.c'>" + T("fahp.p3.lg.c") + "</span></span>");
    // weights table: fuzzy weight, centroid, crisp, part 1 AHP
    var bw = argmax(f.W), ba = argmax(p1.e.w);
    h = "<thead><tr><th>" + T("fahp.p1.th.c") + "</th><th class='num wide2'>" + T("fahp.p3.th.r") + "</th><th class='num'>" + T("fahp.p3.th.w") +
      "</th><th class='num wide'>" + T("fahp.p3.th.c") + "</th><th class='num'>" + T("fahp.p3.th.W") + "</th><th class='num'>" + T("fahp.p3.th.ahp") + "</th></tr></thead><tbody>";
    CRIT.forEach(function (_, j) {
      h += "<tr><td class='nw'><i class='sw4 k" + j + "'></i> " + cshort(j) + "</td><td class='num wide2'>" + ftfn(f.r[j], 3) + "</td><td class='num'>" + ftfn(f.w[j], 3) +
        "</td><td class='num wide'>" + fmt(f.c[j], 3) + "</td><td class='num" + (j === bw ? " best" : "") + "'>" + fmt(f.W[j], 3) +
        "<span class='cell-bar'><i style='width:" + (100 * f.W[j]).toFixed(1) + "%'></i></span></td><td class='num" + (j === ba ? " best" : "") + "'>" + fmt(p1.e.w[j], 3) +
        "<span class='cell-bar'><i style='width:" + (100 * p1.e.w[j]).toFixed(1) + "%'></i></span></td></tr>";
    });
    h += "<tr><td>" + T("fahp.p3.sumrow") + "</td><td class='num wide2'>" + ftfn(f.rs, 3) + "</td><td class='num'></td><td class='num wide'>" + fmt(sum(f.c), 3) +
      "</td><td class='num'>" + fmt(sum(f.W), 3) + "</td><td class='num'>" + fmt(sum(p1.e.w), 3) + "</td></tr>";
    setHTML($("p3-wt"), h + "</tbody>");
    var gap = 0; CRIT.forEach(function (_, j) { gap = Math.max(gap, Math.abs(f.W[j] - p1.e.w[j])); });
    setHTML($("p3-wnote"), T("fahp.p3.wnote", { g: fmt(gap, 3), m: fmt(sum(f.w.map(function (x) { return x[1]; })), 3) }));
    // scores plot
    var smax = Math.max.apply(null, f.S.map(function (x) { return x[2]; })), smin = Math.min.apply(null, f.S.map(function (x) { return x[0]; }));
    var st0 = niceStep(smax - smin, 5), x0 = Math.max(0, Math.floor(smin / st0) * st0), x1 = Math.ceil(smax * 1.02 / st0) * st0;
    var Q = frame($("p3-splot"), x0, x1, { top: 34, h: $("p3-splot").clientWidth < 480 ? 200 : 230 });
    // overlap of the top two: the region under both membership functions
    var A2 = f.S[top], B2 = f.S[sec], lo = Math.max(A2[0], B2[0]), hi = Math.min(A2[2], B2[2]);
    if (hi > lo) {
      var pts = [], n = 120;
      for (var s = 0; s <= n; s++) { var x = lo + (hi - lo) * s / n; pts.push(Q.X(x).toFixed(1) + " " + Q.Y(Math.min(mu(A2, x), mu(B2, x))).toFixed(1)); }
      el("path", { d: "M" + Q.X(lo).toFixed(1) + " " + Q.Y(0) + "L" + pts.join("L") + "L" + Q.X(hi).toFixed(1) + " " + Q.Y(0) + "Z", fill: Q.hatch, stroke: "none" }, Q.layer);
    }
    var third = f.o[2];
    tri(Q, f.S[third], { stroke: "var(--mit-silver)", sw: 2 });
    tri(Q, B2, { stroke: "var(--ink)", sw: 2.2, fill: "var(--ink)", fo: 0.05 });
    tri(Q, A2, { stroke: "var(--accent)", sw: 2.8, fill: "var(--accent)", fo: 0.1 });
    // alpha levels 0.5 and 1: the cuts of the top two
    [0.5].forEach(function (al) {
      el("line", { x1: Q.m.l, x2: Q.W - Q.m.r, y1: Q.Y(al), y2: Q.Y(al), stroke: "var(--ink2)", "stroke-dasharray": "3 3", "stroke-opacity": 0.7 }, Q.layer);
    });
    // centroids
    f.o.forEach(function (k, r) {
      var cx = Q.X(f.Sc[k]);
      el("line", { x1: cx, x2: cx, y1: Q.Y(0) - 9, y2: Q.Y(0) + 5, stroke: r === 0 ? "var(--accent)" : (r === 1 ? "var(--ink)" : "var(--mit-silver)"), "stroke-width": 2.2 }, Q.top);
    });
    // the height of the intersection V
    if (V > 1e-12 && V < 1 - 1e-12) {
      var xv = A2[0] + V * (A2[1] - A2[0]);
      el("line", { x1: Q.X(xv), x2: Q.X(xv), y1: Q.Y(V), y2: Q.Y(0), stroke: "var(--mit-bright)", "stroke-dasharray": "2 2" }, Q.top);
      el("circle", { cx: Q.X(xv), cy: Q.Y(V), r: 4.5, fill: "var(--surface)", stroke: "var(--mit-bright)", "stroke-width": 2 }, Q.top);
      var vt = el("text", { x: Q.X(xv) - 8, y: Q.Y(V) + (V > 0.85 ? 18 : 4), "text-anchor": "end", "font-size": 11.5, "font-weight": 700, fill: "var(--accent-text)", stroke: "var(--surface)", "stroke-width": 4, "paint-order": "stroke", "stroke-linejoin": "round" }, Q.top, "V = " + fmt(V, 2));
      var bb = vt.getBBox();
      if (bb.x < Q.m.l + 2) { vt.setAttribute("text-anchor", "start"); vt.setAttribute("x", Q.X(xv) + 8); }
    }
    peakLabels(Q, [
      { x: Q.X(A2[1]), text: sname(top), fill: "var(--accent-text)", bold: true },
      { x: Q.X(B2[1]), text: sname(sec), fill: "var(--ink)" },
      { x: Q.X(f.S[third][1]), text: sname(third), fill: "var(--muted)" }
    ]);
    $("p3-splot").setAttribute("aria-label", T("fahp.p3.splot.aria", { list: f.o.map(function (k) { return sname(k) + " " + ftfn(f.S[k], 3); }).join("; "), v: fmt(V, 2) }));
    // cuts table
    h = "<thead><tr><th>α</th><th class='num'>" + sname(top) + "</th><th class='num'>" + sname(sec) + "</th><th>" + T("fahp.p3.th.ov") + "</th></tr></thead><tbody>";
    [0, 0.5, 1].forEach(function (al) {
      var ca = cut(A2, al), cb = cut(B2, al), ov = ca[0] <= cb[1] + 1e-12 && cb[0] <= ca[1] + 1e-12;
      h += "<tr><td>" + (al === 0.5 ? fmt(0.5, 1) : String(al)) + "</td><td class='num'>" + fint(ca, 3) + "</td><td class='num'>" + fint(cb, 3) + "</td><td" + (ov ? " class='best'" : "") + ">" +
        T(ov ? "fahp.p3.ov.yes" : "fahp.p3.ov.no") + "</td></tr>";
    });
    setHTML($("p3-cuts"), h + "</tbody>");
    // scores table
    h = "<thead><tr><th>" + T("fahp.p3.th.s") + "</th><th class='num'>" + T("fahp.p3.th.fs") + "</th><th class='num'>" + T("fahp.p3.th.sc") +
      "</th><th class='num wide'>" + T("fahp.p3.th.sm") + "</th><th class='num wide'>" + T("fahp.p3.th.ahps") + "</th></tr></thead><tbody>";
    var p1w = argmax(p1.S);
    f.o.forEach(function (k) {
      h += "<tr><td>" + sname(k) + "</td><td class='num'>" + ftfn(f.S[k], 3) + "</td><td class='num" + (k === top ? " best" : "") + "'>" + fmt(f.Sc[k], sd) +
        "</td><td class='num wide'>" + fmt(f.S[k][1], 3) + "</td><td class='num wide" + (k === p1w ? " best" : "") + "'>" + fmt(p1.S[k], 3) + "</td></tr>";
    });
    setHTML($("p3-st"), h + "</tbody>");
    return { f: f, all: all };
  }

  /* ===================================================================================== what to notice (fixed states) */
  function renderNotes() {
    var r = solveP1(P1PRE.roaster), c = solveP1(P1PRE.contra), w0 = argmax(r.S), o = order(r.S);
    var gapw = 0; CRIT.forEach(function (_, j) { gapw = Math.max(gapw, Math.abs(r.e.w[j] - r.g[j])); });
    $("fahp-n1").innerHTML = T("fahp.n.p1", { cr: fmt(r.e.CR, 3), cup: fmt(r.e.w[1], 3), a: sname(w0), s: fmt(r.S[w0], 3), b: sname(o[1]), s2: fmt(r.S[o[1]], 3), gap: fmt(gapw, 3) });
    // press the fix button until CR is at most 0.10
    var cw = c.worst, cur = c, seq = [];
    for (var n = 0; n < 8 && cur.e.CR > 0.1; n++) {
      var v2 = cur.vals.slice(); v2[cur.worst.k] = cur.worst.nearest;
      cur = solveP1(v2); seq.push(fmt(cur.e.CR, 3));
    }
    $("fahp-n2").innerHTML = T("fahp.n.p2", { cr: fmt(c.e.CR, 3), a: cname(PAIRS[cw.k][0]), b: cname(PAIRS[cw.k][1]), says: fsa(c.vals[cw.k]), implied: fmt(cw.implied, 2), near: fsa(cw.nearest),
      cr2: seq[0], n: seq.length, seq: seq.join(T("fahp.sep")) });
    var A = term(2, 1), B = term(3, 1), ex = [cut(A, 0.5)[0] * cut(B, 0.5)[0], cut(A, 0.5)[1] * cut(B, 0.5)[1]], ap = cut(fmul(A, B), 0.5);
    $("fahp-n3").innerHTML = T("fahp.n.p3", { a: ftfn(A, 0), b: ftfn(B, 0), p: ftfn(fmul(A, B), 0), ex: fint(ex, 2), ap: fint(ap, 2), rc: ftfn(recip(term(1, 1)), 3) });
    var g = ["narrow", "usual", "wide"].map(function (k) { return fahp(P3PRE.cup, SPREAD[k]); });
    $("fahp-n4").innerHTML = T("fahp.n.p4", { a: sname(g[1].top), b: sname(g[1].sec), v0: fmt(g[0].V, 2), v1: fmt(g[1].V, 2), v2: fmt(g[2].V, 2), wl: fmt(g[1].w[1][0], 3), wu: fmt(g[1].w[1][2], 3) });
    var sp = ["narrow", "usual", "wide"].map(function (k) { return fahp(P3PRE.split, SPREAD[k]); });
    $("fahp-n5").innerHTML = T("fahp.n.p5", { a: sname(sp[0].top), b: sname(sp[2].top), v0: fmt(Math.min(sp[0].V, sp[1].V, sp[2].V), 2), sa: fmt(sp[0].Sc[sp[0].top], 3), sb: fmt(sp[0].Sc[sp[0].sec], 3),
      wa: fmt(sp[2].Sc[sp[2].top], 3), wb: fmt(sp[2].Sc[sp[2].sec], 3) });
  }

  /* ===================================================================================== wiring */
  var pending = 0;
  function schedule() { if (pending) return; pending = requestAnimationFrame(function () { pending = 0; update(); }); }
  function update() {
    var p1 = solveP1(state.p1.map(valOfPos));
    renderP1(p1);
    document.querySelectorAll(".spread-seg").forEach(function (s) { segShow(s, state.spread); });
    renderP2();
    renderP3(p1);
  }
  segPick($("p1-pre"), function (v) { state.p1 = P1PRE[v].map(posOfVal); update(); });
  document.querySelectorAll(".spread-seg").forEach(function (s) { segPick(s, function (v) { state.spread = v; update(); }); });
  segPick($("p2-a"), function (v) { state.ta = +v; update(); });
  segPick($("p2-b"), function (v) { state.tb = +v; update(); });
  $("p2-alpha").addEventListener("input", function () { state.alpha = +$("p2-alpha").value; schedule(); });
  segPick($("p3-pre"), function (v) { state.ex = P3PRE[v].map(function (r) { return r.slice(); }); update(); });
  /* formulas: on narrow boxes each comment moves to its own row, so the formula keeps a readable size */
  var fxNarrow = null;
  function narrowTeX(tex) {
    return tex.replace(/\s*&&\s*(.*?)(?=\\\\|\\end\{aligned\})/g, function (m, c) { return " \\\\[-3pt] & \\quad {\\small " + c + "}"; });
  }
  function renderFormulas(force) {
    var nar = document.querySelector(".wrap").clientWidth < 600;
    if (!force && nar === fxNarrow) return;
    fxNarrow = nar;
    document.querySelectorAll("[data-fx]").forEach(function (e) {
      var k = e.getAttribute("data-fx"), tex = T(k + ".tex");
      TeX.set(e, nar ? narrowTeX(tex) : tex, T(k + ".formula"));
    });
  }
  function renderPage() {
    renderFormulas(true);
    buildPairs(); buildTerms(); buildExperts(); renderAlt(); renderNotes();
    update();
    fitExperts();
  }
  var rsz = 0, lastW = window.innerWidth;
  window.addEventListener("resize", function () {
    clearTimeout(rsz);
    rsz = setTimeout(function () { if (window.innerWidth !== lastW) { lastW = window.innerWidth; renderFormulas(false); update(); fitExperts(); } }, 120);
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitExperts);
  I18N.onChange(renderPage);
})();
</script>
</body>
</html>
