<!doctype html>
<html lang="en" data-title-key="toll.title" data-i18n-bundles="lab/lab-tolls">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="32x32">

<link rel="manifest" href="/site.webmanifest">
<title>Price the Road</title>
<!-- Speed (invisible): open the connections the page needs early -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
<!-- /Speed -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="../assets/site.css?v=__BUILD__">
<link rel="stylesheet" href="../assets/research.css?v=__BUILD__">
<style>
  [hidden] { display: none !important; }
  /* new or urgent cues: bright red, or the crit shade where dark mode makes the accent that same red */
  :root { --hot: var(--mit-bright); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --hot: var(--crit); } }
  :root[data-theme="dark"] { --hot: var(--crit); }

  /* ---- part index ---- */
  .case-nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 760px) { .case-nav { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 420px) { .case-nav { grid-template-columns: minmax(0, 1fr); } }
  .case-nav a {
    display: flex; gap: 9px; align-items: baseline; padding: 10px 12px; min-width: 0;
    background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--accent); border-radius: 3px;
    color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14px; line-height: 1.3;
  }
  .case-nav a:hover { background: var(--surface2); }
  .case-nav .n, .case-num { font-family: var(--font-mono); color: var(--accent-text); font-weight: 600; }
  .case-num { display: block; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }
  section.block { scroll-margin-top: 70px; grid-template-columns: minmax(0, 1fr); }
  section.block > * { min-width: 0; }

  /* ---- controls ---- */
  .ctl-row { display: flex; flex-wrap: wrap; gap: 12px 26px; align-items: flex-end; }
  .ctl-group { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .ctl-group .lbl { font-size: 13px; color: var(--ink2); font-weight: 600; }
  button.btn {
    font: 600 13px var(--font-sans); color: var(--on-solid); background: var(--accent); border: 1px solid var(--accent); border-radius: 2px;
    padding: 8px 12px; cursor: pointer; text-align: left;
  }
  button.btn:hover { filter: brightness(1.1); }
  button.btn:disabled { opacity: 0.45; cursor: default; filter: none; }
  button.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--border); }
  button.btn.ghost[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .rng { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; align-items: baseline; min-width: 0; }
  .rng label { font-size: 13px; color: var(--ink2); font-weight: 600; }
  .rng output { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent-text); }
  .rng input[type="range"] { flex: 1 1 100%; width: 100%; accent-color: var(--accent); margin: 4px 0 0; }
  .sliders2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 26px; margin-top: 14px; }
  @media (max-width: 560px) { .sliders2 { grid-template-columns: minmax(0, 1fr); } }

  /* ---- live numbers ---- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 14px; }
  @media (max-width: 460px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .kpi { border: 1px solid var(--border); border-radius: 3px; padding: 8px 11px; background: var(--surface); min-width: 0; }
  .kpi b { display: block; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); letter-spacing: -0.01em; line-height: 1.2; overflow-wrap: anywhere; }
  .kpi span { display: block; font-size: 12.5px; color: var(--ink2); line-height: 1.3; margin-top: 2px; }
  .kpi.accent { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .kpi.accent b { color: var(--accent-text); }
  .kpi.hot b { color: var(--hot); }
  @media (max-width: 460px) { .kpi b { font-size: 16px; } .kpi span { font-size: 12px; } }
  .readline { font-size: 14px; color: var(--ink2); margin: 12px 0 0; min-height: 2.6em; max-width: 92ch; }
  .readline b { color: var(--ink); }
  .verdict { margin: 14px 0 0; padding: 10px 14px; border-radius: 3px; font-size: 14.5px; border: 1px solid var(--border); border-left: 3px solid var(--accent); background: var(--surface2); color: var(--ink2); }
  .verdict b { color: var(--ink); }
  .verdict:empty { display: none; }

  /* ---- layout helpers ---- */
  .subhead { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
  .mhead { margin: 16px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-text); }
  .mhead:first-child { margin-top: 0; }
  .mtext { font-size: 14px; color: var(--ink2); margin: 6px 0 0; max-width: 84ch; }
  .mtext b { color: var(--ink); }
  .tabnote { font-size: 13px; color: var(--muted); margin: 6px 0 0; max-width: 84ch; }
  .tabnote b { color: var(--ink2); }

  /* ---- part 1: the game ---- */
  .game-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px 22px; align-items: start; margin-top: 14px; }
  @media (max-width: 860px) { .game-grid { grid-template-columns: minmax(0, 1fr); } }
  .game-grid > div { min-width: 0; }
  .stage-title { margin: 0 0 6px; font-size: 13px; font-weight: 700; color: var(--ink2); }
  .stage { position: relative; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 3px; overflow: hidden; }
  .map-stage { aspect-ratio: 4 / 3; }
  .plane-stage { aspect-ratio: 1 / 1; cursor: crosshair; touch-action: pan-y; }
  .plane-stage.drag { touch-action: none; }
  .g-legend { margin-top: 8px; }
  .g-legend i.lg-road { width: 18px; height: 6px; background: var(--ink2); border-radius: 2px; }
  .g-legend i.lg-pay { border-radius: 50%; background: var(--accent); width: 9px; height: 9px; }
  .g-legend i.lg-free { border-radius: 50%; background: var(--mit-silver); width: 9px; height: 9px; }
  .g-legend i.lg-flash { width: 18px; height: 4px; background: var(--hot); }
  .g-legend i.lg-plaza { width: 5px; height: 14px; background: var(--accent); }
  .g-legend i.lg-you { border-radius: 50%; border: 2.5px solid var(--ink); background: var(--surface); width: 12px; height: 12px; }
  .g-legend i.lg-best { border-radius: 50%; border: 2px dashed var(--ink); background: transparent; width: 12px; height: 12px; }
  .g-legend i.lg-alone { background: var(--surface); border: 2px solid var(--ink2); }
  .g-legend i.lg-trail { width: 18px; height: 0; border-top: 2.5px dotted var(--ink); }
  .g-legend i.lg-opt { width: 13px; height: 13px; background: var(--ink); clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  .g-legend i.lg-border { width: 18px; height: 0; border-top: 1.5px solid var(--ink2); }
  .g-legend i.lg-fog { background: repeating-linear-gradient(45deg, var(--axis) 0 1px, var(--surface2) 1px 4px); border: 1px solid var(--border); }
  .heatbar { display: inline-flex; align-items: center; gap: 6px; font: 400 11.5px var(--font-mono); color: var(--muted); }
  .heatbar i { width: 64px !important; height: 9px !important; border: 1px solid var(--border); background: linear-gradient(90deg, var(--surface), var(--accent)); }
  table.data { min-width: 0; margin-top: 10px; }
  table.data th.num, table.data td.num { text-align: right; }
  table.data td.num { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
  table.data td.code { font-family: var(--font-mono); font-size: 12.5px; }
  table.data td.code small { display: block; font-family: var(--font-sans); font-size: 11.5px; color: var(--muted); }
  table.data td.acc { color: var(--accent-text); font-weight: 700; }
  table.data td.mut { color: var(--muted); }
  table.data tr.opt td { background: var(--sel); font-weight: 600; }
  table.data tr.tot td { border-top: 1px solid var(--axis); font-weight: 700; }
  @media (max-width: 560px) {
    table.data .wide { display: none; }
    table.data th, table.data td { padding-inline: 5px; font-size: 12px; }
    table.data td.num, table.data td.code { font-size: 11.5px; }
  }

  /* ---- part 2: the exact answer ---- */
  .locked { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .locked p { margin: 0; color: var(--ink2); font-size: 14.5px; max-width: 64ch; }
  .lpgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  @media (max-width: 760px) { .lpgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .lpc {
    border: 1px solid var(--border); border-radius: 3px; padding: 8px 10px; background: var(--surface); min-width: 0;
    display: grid; gap: 2px; text-align: left; font: inherit; color: inherit; cursor: pointer;
  }
  .lpc:hover { background: var(--surface2); }
  .lpc .h { font: 600 11.5px var(--font-mono); color: var(--ink2); line-height: 1.35; }
  .lpc .pn { float: right; margin-left: 6px; font-weight: 400; color: var(--muted); }
  .lpc b { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); line-height: 1.25; }
  .lpc .s { font: 400 11.5px var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
  .lpc.best { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); background: var(--sel); }
  .lpc.best b { color: var(--accent-text); }
  .lpc.off { background: var(--surface2); cursor: default; }
  .lpc.off b { text-decoration: line-through; text-decoration-thickness: 1.5px; color: var(--muted); }
  .lpc[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: -2px; }
  .tiebox { border: 1px solid var(--border); border-left: 3px solid var(--hot); border-radius: 3px; background: var(--surface); padding: 12px 14px; }
  .optstrip {
    border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 3px; background: var(--surface);
    padding: 10px 14px; display: grid; gap: 4px;
  }
  .optstrip .kicker { margin: 0; color: var(--accent-text); }
  .optstrip p { margin: 0; font-size: 14px; color: var(--ink2); max-width: 86ch; }
  .optstrip p b { color: var(--ink); }

  /* ---- part 3: under the hood ---- */
  #hood > summary { font-size: 15.5px; }
  #hood .body { max-width: none; }
  #hood .body > p { max-width: 84ch; }
  .hood-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px 22px; align-items: start; margin-top: 12px; }
  @media (max-width: 860px) { .hood-grid { grid-template-columns: minmax(0, 1fr); } }
  .hood-grid > div { min-width: 0; }
  .treebox { border: 1px solid var(--border); border-radius: 3px; background: var(--surface); padding: 8px; min-height: 120px; }
  .treebox svg { display: block; width: 100%; height: auto; max-height: 330px; }
  .treebox svg .e { stroke: var(--axis); stroke-width: 1.3; fill: none; }
  .treebox svg .e1 { stroke: var(--ink2); }
  .treebox svg .nd { stroke-width: 1.6; }
  .treebox svg .nd.open { fill: var(--surface); stroke: var(--ink2); stroke-dasharray: 2.5 2; }
  .treebox svg .nd.branch { fill: var(--surface); stroke: var(--ink); }
  .treebox svg .nd.int { fill: var(--accent); stroke: var(--accent); }
  .treebox svg .nd.prune { fill: var(--mit-silver); stroke: var(--mit-silver); }
  .treebox svg .nd.inf { fill: var(--surface); stroke: var(--mit-silver); }
  .treebox svg .x { stroke: var(--mit-silver); stroke-width: 1.6; }
  .treebox svg .cur { fill: none; stroke: var(--hot); stroke-width: 2.4; }
  .treebox svg text { font: 600 10px var(--font-mono); fill: var(--muted); }
  .mini-stage { aspect-ratio: 1 / 1; max-width: 380px; }
  .tlegend i.t-branch { border-radius: 50%; border: 1.6px solid var(--ink); background: var(--surface); }
  .tlegend i.t-int { border-radius: 50%; background: var(--accent); }
  .tlegend i.t-prune { border-radius: 50%; background: var(--mit-silver); }
  .tlegend i.t-inf { border-radius: 50%; border: 1.6px solid var(--mit-silver); background: var(--surface); }
  .tlegend i.t-cur { border-radius: 50%; border: 2.4px solid var(--hot); background: transparent; }
  .tlegend i.t-reg { background: var(--accent); opacity: 0.35; border: 1.5px solid var(--accent); }
  .tlegend i.t-pt { border-radius: 50%; background: var(--ink); }
  .solv-log {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 8px 12px 6px; margin-top: 12px;
    font-family: var(--font-mono); font-size: 12.5px; color: var(--ink2); max-height: 300px; overflow: auto;
  }
  .solv-log .log-title { font: 700 11px var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
  .solv-log table { width: 100%; border-collapse: collapse; }
  .solv-log th, .solv-log td { padding: 1px 6px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; vertical-align: top; }
  .solv-log th { font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--axis); font-size: 11.5px; position: sticky; top: -8px; background: var(--surface2); }
  .solv-log td.l, .solv-log th.l { text-align: left; }
  .solv-log td.msg { text-align: left; color: var(--ink); font-family: var(--font-sans); font-size: 12.5px; white-space: normal; }
  .solv-log td.fx { white-space: nowrap; }
  .solv-log tr.now td { background: var(--sel); }
  .solv-log td.inc { color: var(--accent-text); font-weight: 600; }
  @media (max-width: 560px) {
    .solv-log { padding: 6px 6px 4px; font-size: 11px; }
    .solv-log th { font-size: 10px; }
    .solv-log th, .solv-log td { padding: 1px 3px; }
    .solv-log td.msg { font-size: 11px; }
    .solv-log .wide { display: none; }
  }
  .chartbox { margin-top: 8px; min-width: 0; }
  .chartbox svg { display: block; width: 100%; max-width: 640px; height: auto; overflow: visible; }
  .chartbox svg text { font-family: var(--font-sans); font-size: 12px; fill: var(--ink2); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
  .chartbox svg text.m { fill: var(--muted); font-size: 11px; }
  .chartbox svg text.a { fill: var(--accent-text); font-weight: 700; }
  .chartbox svg .ax { stroke: var(--axis); stroke-width: 1; fill: none; }
  .chartbox svg .gr { stroke: var(--grid); stroke-width: 1; fill: none; }
  .chartbox svg .lnA { stroke: var(--accent); fill: none; stroke-width: 2.6; stroke-linecap: round; }
  .chartbox svg .lnS { stroke: var(--mit-silver); fill: none; stroke-width: 1.2; stroke-dasharray: 4 3; }
  .chartbox svg .dotA { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
  .chartbox svg .dotO { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }

  /* ---- model ---- */
  .model-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 22px; align-items: start; margin-top: 16px; }
  @media (max-width: 860px) { .model-grid { grid-template-columns: minmax(0, 1fr); } }
  .model-grid > div { min-width: 0; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="backlink" href="index.html" data-keep-lang><span aria-hidden="true">←</span> <span data-i18n="toll.back"></span></a>
    <div class="lang" data-lang-switcher></div>
  </div>
</header>

<div class="wrap">
  <header class="masthead">
    <p class="eyebrow" data-i18n-html="toll.eyebrow"></p>
    <h1 data-i18n="toll.title"></h1>
    <p class="lede" data-i18n-html="toll.lede"></p>
  </header>

  <nav class="case-nav" data-i18n-attr="aria-label:toll.nav.aria">
    <a href="#toll-p1"><span class="n">1</span><span data-i18n="toll.p1.title"></span></a>
    <a href="#toll-p2"><span class="n">2</span><span data-i18n="toll.p2.title"></span></a>
    <a href="#toll-p3"><span class="n">3</span><span data-i18n="toll.p3.title"></span></a>
    <a href="#toll-model"><span class="n">4</span><span data-i18n="toll.m.title"></span></a>
  </nav>

  <!-- =================================================================== part 1: the game -->
  <section class="block" id="toll-p1" aria-labelledby="toll-p1-h">
    <h2 class="section-title" id="toll-p1-h"><span class="case-num" data-i18n="toll.part1"></span><span data-i18n="toll.p1.title"></span></h2>
    <p class="section-intro" id="p1-intro"></p>
    <div class="card" id="g-card">
      <div class="ctl-row">
        <div class="ctl-group">
          <span class="lbl" id="sc-lbl" data-i18n="toll.sc.lbl"></span>
          <div class="seg" role="group" aria-labelledby="sc-lbl" id="sc-seg">
            <button type="button" data-lh="800" aria-pressed="true"></button>
            <button type="button" data-lh="80" aria-pressed="false"></button>
          </div>
        </div>
      </div>
      <div class="game-grid">
        <div>
          <p class="stage-title" data-i18n="toll.map.title"></p>
          <div class="stage map-stage" id="map-stage" role="img"></div>
          <div class="anim-legend g-legend">
            <span><i class="lg-road"></i><span data-i18n="toll.lg.road"></span></span>
            <span><i class="lg-pay"></i><span data-i18n="toll.lg.pay"></span></span>
            <span><i class="lg-free"></i><span data-i18n="toll.lg.free"></span></span>
            <span><i class="lg-plaza"></i><span data-i18n="toll.lg.plaza"></span></span>
            <span><i class="lg-flash"></i><span data-i18n="toll.lg.flash"></span></span>
          </div>
        </div>
        <div>
          <p class="stage-title" data-i18n="toll.plane.title"></p>
          <div class="stage plane-stage" id="plane-stage" role="img"></div>
          <div class="anim-legend g-legend">
            <span class="heatbar"><span id="hb-lo"></span><i></i><span id="hb-hi"></span></span>
            <span><i class="lg-you"></i><span data-i18n="toll.lg.you"></span></span>
            <span id="lg-best" hidden><i class="lg-best"></i><span data-i18n="toll.lg.best"></span></span>
            <span id="lg-alone" hidden><i class="lg-alone"></i><span data-i18n="toll.lg.alone"></span></span>
            <span id="lg-trail" hidden><i class="lg-trail"></i><span data-i18n="toll.lg.trail"></span></span>
            <span id="lg-opt" hidden><i class="lg-opt"></i><span data-i18n="toll.lg.opt"></span></span>
            <span id="lg-border" hidden><i class="lg-border"></i><span data-i18n="toll.lg.border"></span></span>
            <span id="lg-fog"><i class="lg-fog"></i><span data-i18n="toll.lg.fog"></span></span>
          </div>
        </div>
      </div>
      <div class="sliders2">
        <div class="rng"><label for="t1" data-i18n="toll.s.t1"></label><output id="t1v" for="t1"></output><input type="range" id="t1" min="0" max="90" step="1" value="0"></div>
        <div class="rng"><label for="t2" data-i18n="toll.s.t2"></label><output id="t2v" for="t2"></output><input type="range" id="t2" min="0" max="90" step="1" value="0"></div>
      </div>
      <div class="btnrow">
        <button type="button" class="btn ghost" id="b-alone" data-i18n="toll.b.alone"></button>
        <button type="button" class="btn ghost" id="b-max" data-i18n="toll.b.max"></button>
        <button type="button" class="btn ghost" id="b-climb" data-i18n="toll.b.climb"></button>
        <button type="button" class="btn ghost" id="b-fog" aria-pressed="false" data-i18n="toll.b.fog"></button>
        <button type="button" class="btn ghost" id="b-zero" data-i18n="toll.b.zero"></button>
        <button type="button" class="btn" id="b-solve" data-i18n="toll.b.solve"></button>
      </div>
      <div class="kpis" id="g-kpis"></div>
      <p class="readline" id="g-read" aria-live="polite"></p>
      <div class="tblwrap"><table class="data" id="g-routes"></table></div>
      <p class="tabnote" id="g-unit"></p>

    mini.draw({
      full: true, borders: true, fade: 0.55, region: reg, pt: cur.x ? [cur.x[0], cur.x[1]] : null,
      opt: bb.done && inc ? [inc.x[0], inc.x[1]] : null, empty: reg.length < 3 && cur.status === "inf" ? T("toll.h.empty") : null
    });
    $("mini-stage").setAttribute("aria-label", T("toll.h.plane.aria", { id: cur.id, pt: cur.x ? pt([cur.x[0], cur.x[1]]) : T("toll.h.res.inf") }));
    // read line
    var rd;
    if (bb.done) rd = T("toll.h.done", { n: bb.solved, ms: I18N.fmt(bb.ms, 1, 1), r: mday(inc.z), pt: pt([inc.x[0], inc.x[1]]), root: mday(bb.root.z) });
    else if (bb.cur === bb.root && bb.root.status === "open") rd = T("toll.h.ready", { root: mday(bb.root.z), opt: mday(s.lps.best.z) });
    else rd = T("toll.h.at", { id: cur.id, fix: fixLabel(cur), res: resText(cur) });
    $("h-read").innerHTML = rd;
    // log
    var h = "<thead><tr><th>" + esc(T("toll.h.log.node")) + '</th><th class="wide">' + esc(T("toll.h.log.depth")) + '</th><th class="l">' + esc(T("toll.h.log.fix")) +
      "</th><th>" + esc(T("toll.h.log.bound")) + '</th><th class="l">' + esc(T("toll.h.log.res")) + "</th></tr></thead><tbody>";
    bb.nodes.forEach(function (nd) {
      h += '<tr class="' + (nd === cur ? "now" : "") + '"><td>' + nd.id + '</td><td class="wide">' + nd.depth + '</td><td class="l fx">' + esc(fixLabel(nd)) +
        "</td><td" + (nd.status === "int" ? ' class="inc"' : "") + ">" + (nd.z != null ? I18N.fmt(nd.z / 1000, 2, 2) : "") + '</td><td class="msg">' + esc(resText(nd)) + "</td></tr>";
    });
    $("h-logt").innerHTML = h + "</tbody>";
    var row = $("h-logt").querySelector("tr.now"), box = $("h-log");
    if (row && $("hood").open) {
      var top = row.offsetTop - box.clientHeight / 2;
      box.scrollTop = Math.max(0, top);
    }
    $("h-run").disabled = !!bbTimer;
    $("h-step").disabled = bb.done || !!bbTimer;
    // self-check (brute force, pattern LPs, MILP)
    var full = bbFull(S.lh, "path"), okAll = Math.abs(full.inc.z - s.lps.best.z) < 1e-6 && Math.abs(s.grid.r - s.lps.best.z) < 1e-6;
    $("h-check").innerHTML = T(okAll ? "toll.h.check.ok" : "toll.h.check.bad", { g: GN, rg: mday(s.grid.r), rl: mday(s.lps.best.z), rm: mday(full.inc.z) });
  }
  function shownNode(bb) { return bb.done && bb.inc ? bb.inc : bb.cur; }   // when finished, show the incumbent
  function resText(nd) {
    if (nd.status === "open") return T("toll.h.res.open");
    if (nd.status === "inf") return T("toll.h.res.inf");
    if (nd.status === "prune") return T("toll.h.res.prune");
    if (nd.status === "int") return T("toll.h.res.int");
    return T("toll.h.res.branch", { p: pname(nd.bj), v: I18N.fmt(nd.bv, 2, 2) });
  }
  var rootCache = {};
  function bbRoot(lh, mode) {
    var key = lh + ":" + mode;
    if (rootCache[key] == null) rootCache[key] = BB(lh, mode).root.z;
    return rootCache[key];
  }

  // ties for you or against you: revenue along both tolls moved together around the optimum
  function renderTieRule() {
    var s = sol(S.lh), o = s.opt, pess = S.tie === "pess", eta = s.eta;
    var W = Math.round(clamp(($("tie-chart").clientWidth || 600), 280, 640)), narrow = W < 460, H = narrow ? 210 : 230;
    var ml = narrow ? 40 : 46, mr = 12, mt = 14, mb = 34, lo = -3, hi = 3, vmax = Math.ceil(s.hmax / 1000 / 20) * 20;
    var X = function (d) { return ml + (d - lo) / (hi - lo) * (W - ml - mr); }, Y = function (v) { return mt + (1 - v / vmax) * (H - mt - mb); };
    var g = "", k;
    for (k = 0; k <= vmax; k += vmax / 4) { g += '<line class="' + (k ? "gr" : "ax") + '" x1="' + ml + '" x2="' + (W - mr) + '" y1="' + Y(k).toFixed(1) + '" y2="' + Y(k).toFixed(1) + '"/>'; g += '<text class="m" x="' + (ml - 6) + '" y="' + (Y(k) + 4).toFixed(1) + '" text-anchor="end">' + I18N.fmt(k, 0) + "</text>"; }
    for (k = lo; k <= hi; k++) g += '<text class="m" x="' + X(k).toFixed(1) + '" y="' + (H - mb + 16) + '" text-anchor="middle">' + (k > 0 ? "+" : k < 0 ? MINUS : "") + Math.abs(k) + "</text>";
    g += '<text class="m" x="' + ((ml + W - mr) / 2).toFixed(1) + '" y="' + (H - 4) + '" text-anchor="middle">' + esc(T("toll.h.tie.axis", { pt: pt(o) })) + "</text>";
    // left and right pieces (open at 0), then the value at 0 under the chosen rule
    function seg(a, b) {
      var d = "", n = 60;
      for (var i = 0; i <= n; i++) { var x = lerp(a, b, i / n), v = revAt(o[0] + x, o[1] + x, eta, pess) / 1000; d += (i ? "L" : "M") + X(x).toFixed(1) + "," + Y(v).toFixed(1); }
      return '<path class="lnA" d="' + d + '"/>';
    }
    g += seg(lo, -1e-6) + seg(1e-6, hi);
    var vL = revAt(o[0] - 1e-6, o[1] - 1e-6, eta, pess) / 1000, vR = revAt(o[0] + 1e-6, o[1] + 1e-6, eta, pess) / 1000, v0 = revAt(o[0], o[1], eta, pess) / 1000;
    g += '<line class="lnS" x1="' + X(0).toFixed(1) + '" x2="' + X(0).toFixed(1) + '" y1="' + Y(vmax).toFixed(1) + '" y2="' + Y(0).toFixed(1) + '"/>';
    [vL, vR].forEach(function (v) { if (Math.abs(v - v0) > 1e-9) g += '<circle class="dotO" cx="' + X(0).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="5"/>'; });
    g += '<circle class="dotA" cx="' + X(0).toFixed(1) + '" cy="' + Y(v0).toFixed(1) + '" r="5.5"/>';
    g += '<text class="a" x="' + (X(0) + 9).toFixed(1) + '" y="' + (Y(v0) + (v0 > vmax * 0.8 ? 14 : -8)).toFixed(1) + '">' + esc(mcop(v0 * 1000)) + "</text>";
    $("tie-chart").innerHTML = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(T("toll.h.tie.aria", { pt: pt(o), r: mcop(v0 * 1000) })) + '">' + g + "</svg>";
    var e = [o[0] - 0.01, o[1] - 0.01];
    $("tie-read").innerHTML = T(pess ? "toll.h.tie.pess.text" : "toll.h.tie.opt.text", {
      pt: pt(o), r: mday(revAt(o[0], o[1], eta)), p: mday(revAt(o[0], o[1], eta, true)), pe: pt(e), e: mday(revAt(e[0], e[1], eta, true))
    });
  }

  /* ===================================================================================== notes */
  function renderNotes() {
    var s = sol(S.lh), o = s.opt, a = sol(800), b = sol(80);
    var r1 = revAt(Math.min(o[0] + 1, TMAX), o[1], s.eta), r2 = revAt(o[0], Math.min(o[1] + 1, TMAX), s.eta);
    $("toll-n1").innerHTML = T("toll.n.p1", { pt: pt(o), r: mday(s.lps.best.z), r1: mday(r1), r2: mday(r2) });
    $("toll-n2").innerHTML = T(gapOf(s.aloneR.rev, s) < 1e-9 ? "toll.n.p2.alone" : "toll.n.p2.climb", {
      c0: pt(s.climb0.end), r0: mday(s.climb0.r), a: pt(s.alone), ra: mday(s.climbA.r), ca: pt(s.climbA.end), gap: pct(gapOf(s.climb0.r, s)), lh: trucks(S.lh), z: pt([0, 0])
    });
    // revenue at each scenario's optimum as a function of the long-haul trucks n: A + B n
    function lin(t) {
      var r = respond(t, 0), paid = respond(t, 1).rev - r.rev;
      return { A: r.rev, B: paid };
    }
    var la = lin(a.opt), lb = lin(b.opt), th = (lb.A - la.A) / (la.B - lb.B);
    function expr(l) { return l.B ? trucks(l.A) + " + " + trucks(l.B) + " × <i>n</i>" : trucks(l.A); }
    $("toll-n3").innerHTML = T("toll.n.p3", {
      pa: pt(a.opt), ra: mday(a.lps.best.z), ga: pct(gapOf(a.aloneR.rev, a)), pb: pt(b.opt), rb: mday(b.lps.best.z),
      ea: expr(la), eb: expr(lb), th: trucks(th), na: trucks(SCEN[0]), nb: trucks(SCEN[1])
    });
    $("toll-n4").innerHTML = T("toll.n.p4", { n: PATTERNS.length, k: s.lps.nOk, m: PATTERNS.length - s.lps.nOk, a: CLS[0].length, b: CLS[1].length, c: CLS[2].length });
    var fp = bbFull(S.lh, "path"), fk = bbFull(S.lh, "od");
    $("toll-n5").innerHTML = T("toll.n.p5", { np: fp.solved, nk: fk.solved, rp: mday(fp.root.z), rk: mday(fk.root.z), opt: mday(s.lps.best.z) });
  }

  /* ===================================================================================== wiring */
  function setScenario(lh) {
    if (lh === S.lh) return;
    stopClimb(); clearTimeout(bbTimer); bbTimer = 0;
    S.lh = lh; S.best = null; S.trail = null; S.aloneOn = false; S.hl = null; S.prev = null; S.flash = [null, null, null];
    S.read = { k: "start" }; S.bb = null;
    fog.fill(0); heatDirty = true;
    document.querySelectorAll("#sc-seg button").forEach(function (o) { o.setAttribute("aria-pressed", String(+o.getAttribute("data-lh") === lh)); });
    renderIntro();
    setT(S.t, "button");
    renderOpt(); renderHood(); renderTieRule(); renderNotes();
  }
  document.querySelectorAll("#sc-seg button").forEach(function (b) { b.addEventListener("click", function () { setScenario(+b.getAttribute("data-lh")); }); });
  ["t1", "t2"].forEach(function (id, w) {
    $(id).addEventListener("input", function () {
      stopClimb(); S.hl = null;
      var t = S.t.slice(); t[w] = +$(id).value;
      setT(t, "hand");
      if (S.shown) renderLPs();
    });
  });
  var dragging = false;
  function planeMove(ev) { stopClimb(); S.hl = null; setT(plane.toT(ev), "hand"); }
  plane.el.addEventListener("pointerdown", function (ev) {
    dragging = true; $("plane-stage").classList.add("drag");
    try { plane.el.setPointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
    planeMove(ev);
    if (S.shown) renderLPs();
  });
  plane.el.addEventListener("pointermove", function (ev) { if (dragging) planeMove(ev); });
  ["pointerup", "pointercancel"].forEach(function (n) {
    plane.el.addEventListener(n, function () { if (dragging && S.shown) renderLPs(); dragging = false; $("plane-stage").classList.remove("drag"); });
  });
  $("b-alone").addEventListener("click", function () { stopClimb(); S.hl = null; S.aloneOn = true; S.read = { k: "alone" }; setT(sol(S.lh).alone, "button"); if (S.shown) renderLPs(); });
  $("b-max").addEventListener("click", function () { stopClimb(); S.hl = null; S.read = { k: "max" }; setT([TMAX, TMAX], "button"); if (S.shown) renderLPs(); });
  $("b-climb").addEventListener("click", function () { S.hl = null; doClimb(); if (S.shown) renderLPs(); });
  $("b-fog").addEventListener("click", function () { S.fogOff = !S.fogOff; heatDirty = true; renderGame(); });
  $("b-zero").addEventListener("click", function () {
    stopClimb(); S.hl = null; S.trail = null; S.aloneOn = false; S.best = null; S.read = { k: "start" };
    if (!S.shown) { S.fogOff = false; fog.fill(0); }
    heatDirty = true; setT([0, 0], "button"); if (S.shown) renderLPs();
  });
  $("b-solve").addEventListener("click", function () { reveal2(true); });
  $("opt-show").addEventListener("click", function () { reveal2(false); });
  document.querySelectorAll("#m-seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      var v = b.getAttribute("data-m");
      if (v === S.mode) return;
      S.mode = v;
      document.querySelectorAll("#m-seg button").forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      bbNew();
    });
  });
  $("h-run").addEventListener("click", bbRun);
  $("h-step").addEventListener("click", function () { if (!S.bb || S.bb.done) S.bb = BB(S.lh, S.mode); S.bb.step(); renderHood(); });
  $("h-reset").addEventListener("click", bbNew);
  $("hood").addEventListener("toggle", function () { if ($("hood").open) { mini.fit(); renderHood(); renderTieRule(); } });
  document.querySelectorAll("#tie-seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      var v = b.getAttribute("data-tie");
      if (v === S.tie) return;
      S.tie = v;
      document.querySelectorAll("#tie-seg button").forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      renderTieRule();
    });
  });

  function redraw() { COL = null; heatDirty = true; map.fit(); plane.fit(); mini.fit(); renderGame(); if ($("hood").open) renderHood(); }
  var lastW = window.innerWidth, rz = 0;
  window.addEventListener("resize", function () {
    clearTimeout(rz);
    rz = setTimeout(function () {
      redraw();
      if (window.innerWidth !== lastW) { lastW = window.innerWidth; renderTieRule(); }
    }, 120);
  });
  if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw);
  new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  reveal(S.t);
  I18N.onChange(function () {
    renderIntro();
    S.prev = S.prev || respond(S.t, S.lh);
    renderGame(); renderOpt(); renderHood(); renderTieRule(); renderNotes();
  });
})();
</script>
</body>
</html>
