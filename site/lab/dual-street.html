<script>
(function () {

  var MINUS = "−";

  var num = function (v, d) { var m = fmt(Math.abs(v), d); return m === fmt(0, d) ? m : (v < 0 ? MINUS : "") + m; };
  var texNum = function (v, d) { var m = fmt(Math.abs(v), d); return m === fmt(0, d) ? m : (v < 0 ? "-" : "") + m; };
  var cFmt = function (c) { return isFinite(c) ? I18N.fmt(Number(c.toPrecision(2)), 2, 0) : "∞"; };   // C with two significant digits
  var intFmt = function (v) { return I18N.fmt(v, 0, 0); };
  function sup(k) { return String(k).split("").map(function (ch) { return "⁰¹²³⁴⁵⁶⁷⁸⁹"[+ch] || (ch === "-" ? "⁻" : ch); }).join(""); }
  function gapFmt(g) {                             // the duality gap: 3 decimals, then a power of ten, then 0 below 10^-9
    if (g < 1e-9) return fmt(0, 0);
    if (g >= 0.001) return fmt(g, 3);
    var e = Math.floor(Math.log10(g)), m = g / Math.pow(10, e);
    if (m >= 9.95) { m = 1; e++; }
    return I18N.fmt(m, 1, 1) + " × 10" + sup(e);
  }

  /* =====================================================================================
     The data: the same 24 coffee lots as level 1 (The Widest Street), without its odd lot:
     12 specialty and 12 standard lots from two normal clouds drawn with Anim.rng(112). Illustrative.
     Model units: x1 = altitude in hundreds of meters, x2 = bean density in tens of g/L.
     ===================================================================================== */
  var SEED = 112, NPER = 12;
  var CLOUD = { spec: { m: [18.0, 71.5] }, std: { m: [14.6, 67.8] }, sd: [1.1, 1.4] };
  var DATA = (function () {
    var r = Anim.rng(SEED), X = [], Y = [];
    var z = function () { var u1 = r(), u2 = r(); return Math.sqrt(-2 * Math.log(1 - u1)) * Math.cos(2 * Math.PI * u2); };
    for (var i = 0; i < 2 * NPER; i++) {
      var y = i % 2 === 0 ? 1 : -1, m = y > 0 ? CLOUD.spec.m : CLOUD.std.m;
      var a = Math.round((m[0] + CLOUD.sd[0] * z()) * 10) / 10, d = Math.round((m[1] + CLOUD.sd[1] * z()) * 10) / 10;
      X.push([a, d]); Y.push(y);
    }
    return { X: X, Y: Y };
  })();
  var X = DATA.X, Y = DATA.Y, N = Y.length;
  var MX = 0, MY = 0;
  X.forEach(function (p) { MX += p[0] / N; MY += p[1] / N; });
  var Z = X.map(function (p) { return [p[0] - MX, p[1] - MY]; });   // centred traits: w and the dual value do not change
  var KG = [], KMAX = 0;                                              // the Gram matrix x_i'x_j of the centred traits
  for (var i0 = 0; i0 < N; i0++) {
    KG.push(new Float64Array(N));
    for (var j0 = 0; j0 < N; j0++) { KG[i0][j0] = Z[i0][0] * Z[j0][0] + Z[i0][1] * Z[j0][1]; KMAX = Math.max(KMAX, Math.abs(KG[i0][j0])); }
  }

  /* ---------- the primal value of the street built from a vector of multipliers:
     w = sum a_i y_i x_i, the best intercept for that w, and the hinge loss (a feasible primal point) ---------- */
  function primalAt(al, C) {
    var w0 = 0, w1 = 0, t, q, s = new Float64Array(N);
    for (t = 0; t < N; t++) { w0 += al[t] * Y[t] * Z[t][0]; w1 += al[t] * Y[t] * Z[t][1]; }
    for (t = 0; t < N; t++) s[t] = w0 * Z[t][0] + w1 * Z[t][1];
    var best = Infinity, bb = 0;
    for (q = 0; q < N; q++) {                        // the hinge sum is convex and piecewise linear in b: its minimum is at a kink
      var cand = Y[q] - s[q], h = 0;
      for (t = 0; t < N; t++) h += Math.max(0, 1 - Y[t] * (s[t] + cand));
      if (h < best - 1e-14) { best = h; bb = cand; }
    }
    var half = 0.5 * (w0 * w0 + w1 * w1);
    return { w: [w0, w1], bc: bb, P: half + C * best, half: half };
  }

  /* ---------- SMO (Platt 1998) on the dual, linear kernel, with the maximal violating pair:
     i = argmax over I_up of -y_t G_t, j = argmin over I_low; stop when the violation is below 1e-12.
     Every iterate is recorded: multipliers, dual value, primal value of its street, the pair. ---------- */
  var EPS = 1e-12;
  function smo(C, record) {
    var n = N, i, j, t, al = new Float64Array(n), G = new Float64Array(n).fill(-1), it = 0, gmax = 0, gmin = 0;
    var Q = function (a, b) { return Y[a] * Y[b] * KG[a][b]; };
    var up = function (t) { return (Y[t] > 0 && al[t] < C) || (Y[t] < 0 && al[t] > 0); };
    var low = function (t) { return (Y[t] < 0 && al[t] < C) || (Y[t] > 0 && al[t] > 0); };
    var tr = { A: [], D: [], P: [], PB: [], W: [], B: [], NSV: [], NB: [], pair: [] }, tol = 1e-9 * (isFinite(C) ? Math.max(1, C) : 1);
    function rec() {
      if (!record) return;
      var p = primalAt(al, C), sal = 0, nsv = 0, nb = 0;
      for (var q = 0; q < n; q++) { sal += al[q]; if (al[q] > tol) nsv++; if (al[q] >= C - tol) nb++; }
      var k = tr.A.length;
      tr.A.push(Float64Array.from(al)); tr.D.push(sal - p.half); tr.P.push(p.P);
      tr.PB.push(k ? Math.min(tr.PB[k - 1], p.P) : p.P);
      tr.W.push(p.w); tr.B.push(p.bc - (p.w[0] * MX + p.w[1] * MY)); tr.NSV.push(nsv); tr.NB.push(nb);
    }
    rec();
    for (; it < 200000; it++) {
      var ii = -1, jj = -1;
      gmax = -Infinity; gmin = Infinity;
      for (t = 0; t < n; t++) if (up(t) && -Y[t] * G[t] > gmax) { gmax = -Y[t] * G[t]; ii = t; }
      for (t = 0; t < n; t++) if (low(t) && -Y[t] * G[t] < gmin) { gmin = -Y[t] * G[t]; jj = t; }
      if (gmax - gmin < EPS || ii < 0 || jj < 0) break;
      i = ii; j = jj;
      var oi = al[i], oj = al[j], quad, delta, diff, sum;
      if (Y[i] !== Y[j]) {
        quad = Q(i, i) + Q(j, j) + 2 * Q(i, j); if (quad <= 0) quad = 1e-12;
        delta = (-G[i] - G[j]) / quad; diff = al[i] - al[j];
        al[i] += delta; al[j] += delta;
        if (diff > 0) { if (al[j] < 0) { al[j] = 0; al[i] = diff; } } else if (al[i] < 0) { al[i] = 0; al[j] = -diff; }
        if (diff > 0) { if (al[i] > C) { al[i] = C; al[j] = C - diff; } } else if (al[j] > C) { al[j] = C; al[i] = C + diff; }

      var sa = scat * (t < T_REB[0] ? 1 - reb : 1);
      drawStreet(st, sa, t >= T_REB[0] ? uu : null);
    }
    /* the pair of this step: a dashed link */
    if (pair && pairA > 0.01) {
      var p1 = lotPos(pair[0], t), p2 = lotPos(pair[1], t);
      ctx.globalAlpha = pairA * scat; ctx.strokeStyle = HOT; ctx.lineWidth = 1.8; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    /* halos: the size of each multiplier */
    if (smoOn) for (i = 0; i < N; i++) {
      var al = alphaAt(S, K, i);
      if (al <= 1e-12) continue;
      P = lotPos(i, t);
      var gr = S.grp[i], hc = grpA > 0 && gr === 2 ? HOT : C.accent, ha = scat * (1 - 0.35 * ghost * (gr === 0 ? 1 : 0));
      ctx.globalAlpha = ha * (isDark() ? 0.26 : 0.18); ctx.fillStyle = hc; circle(P[0], P[1], haloR(S, al)); ctx.fill();
      ctx.globalAlpha = ha * 0.55; ctx.strokeStyle = hc; ctx.lineWidth = 1; ctx.stroke(); ctx.globalAlpha = 1;
    }
    /* the lots */
    for (i = 0; i < N; i++) {
      P = lotPos(i, t);
      if (P[2] <= 0) continue;
      var a = seg(P[2], 0, 0.35) * scat;
      if (S.grp[i] === 0) a *= 1 - 0.55 * grpA - 0.27 * ghost;
      drawLot(i, P[0], P[1], a, C.ink);
    }
    /* chapter 5: the KKT groups: rings on the edges (0 < a < C), dashed rings and slack at the bound (a = C) */
    if (grpA > 0) {
      for (i = 0; i < N; i++) if (S.grp[i] === 2) slackSeg(i, st, grpA * scat);
      for (i = 0; i < N; i++) {
        if (S.grp[i] === 0) continue;
        P = lotPos(i, t);
        var rr = haloR(S, S.alpha[i]) + 1;
        ctx.globalAlpha = grpA; ctx.strokeStyle = S.grp[i] === 1 ? C.accent : HOT; ctx.lineWidth = 2; ctx.setLineDash(S.grp[i] === 2 ? [3, 2.5] : []);
        circle(P[0], P[1], rr); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
        pulse(P[0], P[1], t, T_GRP[0] + 0.12 * i / N * 4, S.grp[i] === 1 ? C.accent : HOT, rr);
        if (t >= T_REB[0]) pulse(P[0], P[1], t, T_REB[0] + 0.25 * (i % 4), C.accent, rr);
      }
    }
    /* the pair: rings and lot numbers */
    if (pair && pairA > 0.01) pair.forEach(function (j) {
      var Q = lotPos(j, t), rq = haloR(S, alphaAt(S, K, j)) + 2;
      ctx.globalAlpha = pairA; ctx.strokeStyle = HOT; ctx.lineWidth = 2.2; circle(Q[0], Q[1], rq); ctx.stroke(); ctx.globalAlpha = 1;
      if (!K.fast) label("#" + (j + 1), Q[0] + rq + 3, Q[1] - rq, "left", HOT, font(700, L.portrait ? 10 : 11.5), pairA);
    });
    drawAlphaLabels(t, S, seg(t, T_ALAB[0], T_ALAB[1]));
    ctx.restore();

    /* chapter 1: threads from each lot to its slot in the strip */
    if (t >= T_THR[0] && t < T_THR[1] + 1.2) {
      var g = stripGeo(), fa = 1 - seg(t, T_THR[1] + 0.4, T_THR[1] + 1.2);
      for (i = 0; i < N; i++) {
        var c = S.col[i], t0 = T_THR[0] + c / N * (T_THR[1] - T_THR[0] - 0.8), u = seg(t, t0, t0 + 0.8);
        if (u <= 0) continue;
        P = lotPos(i, t);
        var ex = colX(g, c), ey = g.base, mx = (P[0] + ex) / 2 + (ex - P[0]) * 0.15, my = Math.max(P[1], ey) - 0.35 * Math.abs(ey - P[1]);
        var e = E.inOut(u), bz = function (s) { var q = 1 - s; return [q * q * P[0] + 2 * q * s * mx + s * s * ex, q * q * P[1] + 2 * q * s * my + s * s * ey]; };
        ctx.lineWidth = 1.2; ctx.strokeStyle = C.accent;
        for (var sgm = 0; sgm < 12; sgm++) {
          var s0 = e * sgm / 12, s1 = e * (sgm + 1) / 12, A0 = bz(s0), A1 = bz(s1);
          ctx.globalAlpha = fa * 0.55 * (0.2 + 0.8 * (sgm + 1) / 12);
          ctx.beginPath(); ctx.moveTo(A0[0], A0[1]); ctx.lineTo(A1[0], A1[1]); ctx.stroke();
        }
        var hd = bz(e);
        ctx.globalAlpha = fa * (u < 1 ? 1 : 0.6); ctx.fillStyle = C.accent; circle(hd[0], hd[1], 2.6); ctx.fill(); ctx.globalAlpha = 1;
        if (u >= 1) pulse(ex, ey, t, t0 + 0.8, C.accent, 3);
      }
    }
    /* the strip and the chart */
    drawStrip(t, S, K, grpA, pair, pairA);
    var chA = seg(t, T_CHART[0], T_CHART[1]) * (L.chartRight ? 1 - hA : 1);
    drawChart(t, S, K, chA);
    drawHeat(t, S, hA);
    drawCaption(t);
  }

  layout();
  var player = A_.create({
    root: root,
    duration: DUR,
    chapters: CH.map(function (c, k) { return { t: c, key: "svmd.ch" + (k + 1) }; }),
    onResize: function () { cv.fit(); layout(); },
    render: render
  });

  /* =====================================================================================
     Page text: status line, data, solution, comparison, lots, notes
     ===================================================================================== */
  function grpName(g) { return T(["svmd.grp.zero", "svmd.grp.free", "svmd.grp.bound"][g]); }
  function renderSeg() {
    document.querySelectorAll("#svmd-seg button").forEach(function (b) {
      var key = b.getAttribute("data-sc");
      b.textContent = T("svmd.sc." + key, { c: cFmt(CS[key]) });
    });
  }
  function renderScenText() {
    var S = SC[state.sc];
    var v = { c: cFmt(S.C), n: S.it, s: S.nsv, f: S.nfree, b: S.nbound, w: fmt(S.width), o: fmt(S.D, 3) };
    stage.setAttribute("aria-label", T("svmd.anim.aria") + " " + T("svmd.anim.aria.nums", v));
    document.getElementById("svmd-status").innerHTML = T("svmd.st", v);
  }
  function renderData() {
    document.getElementById("svmd-data").innerHTML = T("svmd.data.p", {
      n: N, k: NPER, seed: SEED, ma: intFmt(CLOUD.spec.m[0] * 100), md: intFmt(CLOUD.spec.m[1] * 10), sa: intFmt(CLOUD.std.m[0] * 100), sd: intFmt(CLOUD.std.m[1] * 10),
      ea: intFmt(CLOUD.sd[0] * 100), ed: intFmt(CLOUD.sd[1] * 10), mx: intFmt(MX * 100), my: fmt(MY * 10, 1)
    });
  }
  function fx(S, tex) {                             // f(x) = w1 x1 + w2 x2 + b as text
    var sp = " ", m = tex ? "-" : MINUS, x1 = tex ? "\\,x_1" : " x₁", x2 = tex ? "\\,x_2" : " x₂";
    return (tex ? texNum : num)(S.w[0], 3) + x1 + sp + (S.w[1] < 0 ? m : "+") + sp + fmt(Math.abs(S.w[1]), 3) + x2 + sp + (S.b < 0 ? m : "+") + sp + fmt(Math.abs(S.b), 3);
  }
  function renderSolution() {
    var S = SC[state.sc];
    document.getElementById("svmd-sol-title").textContent = T("svmd.sol.title", { c: cFmt(S.C) });
    document.getElementById("svmd-sn").textContent = String(S.it);
    document.getElementById("svmd-snl").textContent = T("svmd.sol.stepsl", { g: "10" + sup(Math.round(Math.log10(EPS))) });
    document.getElementById("svmd-sval").textContent = fmt(S.D, 3);
    document.getElementById("svmd-svall").textContent = T("svmd.sol.vall", { g: gapFmt(Math.max(0, S.P - S.D)) });
    document.getElementById("svmd-ssv").textContent = String(S.nsv);
    document.getElementById("svmd-ssvl").textContent = T("svmd.sol.svl", { f: S.nfree, b: S.nbound, z: N - S.nsv });
    document.getElementById("svmd-swd").textContent = fmt(S.width, 3);
    document.getElementById("svmd-swdl").textContent = T("svmd.sol.widthl", { w1: num(S.w[0], 3), w2: num(S.w[1], 3), b: num(S.b, 3) });
    document.getElementById("svmd-sol-p").innerHTML = T("svmd.sol.p", { n: N, it: S.it, s: S.nsv });
    var v = { f: fx(S, true), w1: texNum(S.w[0], 3), w2: texNum(S.w[1], 3), s: S.s0 + 1, bs: texNum(S.bs, 3), a: texNum(S.sal, 3), h: texNum(S.half, 3), d: texNum(S.D, 3),
      c: cFmt(S.C), x: texNum(S.sxi, 3), o: texNum(S.P, 3), k: S.nsv };
    var vp = { f: fx(S, false), w1: num(S.w[0], 3), w2: num(S.w[1], 3), s: S.s0 + 1, bs: num(S.bs, 3), a: num(S.sal, 3), h: num(S.half, 3), d: num(S.D, 3),
      c: cFmt(S.C), x: num(S.sxi, 3), o: num(S.P, 3), k: S.nsv };
    TeX.set(document.getElementById("svmd-inst"), T("svmd.inst.tex", v), T("svmd.inst.formula", vp));
    document.getElementById("svmd-sol-q").innerHTML = T("svmd.sol.q", {
      g: gapFmt(Math.max(0, S.P - S.D)), ok: T(S.allOk ? "svmd.sol.allok" : "svmd.sol.notok"), e: S.err, v: S.viol
    });
  }
  function renderCompare() {
    var h = "<thead><tr><th class='rowh'>C</th><th class='num'>" + T("svmd.cmp.steps") + "</th><th class='num'>" + T("svmd.cmp.sv") + "</th><th class='num wide'>" +
      T("svmd.cmp.free") + "</th><th class='num wide'>" + T("svmd.cmp.bound") + "</th><th class='num'>" + T("svmd.cmp.width") + "</th><th class='num wide'>Σα</th><th class='num'>" +
      T("svmd.cmp.val") + "</th><th class='num'>" + T("svmd.cmp.err") + "</th></tr></thead><tbody>";
    KEYS.forEach(function (key) {
      var s = SC[key];
      h += "<tr" + (key === state.sc ? " class='on'" : "") + "><td class='rowh'>" + cFmt(s.C) + "</td><td class='num'>" + s.it + "</td><td class='num'>" + s.nsv +
        "</td><td class='num wide'>" + s.nfree + "</td><td class='num wide" + (s.nbound ? " hot" : "") + "'>" + s.nbound + "</td><td class='num acc'>" + fmt(s.width, 3) +
        "</td><td class='num wide'>" + fmt(s.sal, 3) + "</td><td class='num'>" + fmt(s.D, 3) + "</td><td class='num" + (s.err ? " hot" : "") + "'>" + s.err + "</td></tr>";
    });
    document.getElementById("svmd-cmp").innerHTML = h + "</tbody>";
    var a = SC.small, c = SC.large;
    document.getElementById("svmd-cmp-note").textContent = T("svmd.cmp.note", {
      c0: cFmt(a.C), c1: cFmt(c.C), n0: a.it, n1: c.it, b0: a.nbound, s0: a.nsv, s1: c.nsv, b1: c.nbound, w1: fmt(c.width, 3), hw: fmt(HARD.width, 3), hs: HARD.nsv
    });
  }
  function renderLots() {
    var S = SC[state.sc];
    document.getElementById("svmd-lots-title").textContent = T("svmd.lots.title", { n: N, c: cFmt(S.C) });
    document.getElementById("svmd-lots-p").textContent = T("svmd.lots.p", { c: cFmt(S.C) });
    var h = "<thead><tr><th class='num'>#</th><th class='num wide'>" + T("svmd.lots.alt") + "</th><th class='num wide'>" + T("svmd.lots.den") + "</th><th class='rowh'>" +
      T("svmd.lots.cls") + "</th><th class='num'>α</th><th class='num'>y f(x)</th><th class='num wide'>ξ</th><th class='rowh'>" + T("svmd.lots.grp") + "</th><th class='rowh'>" +
      T("svmd.lots.kkt") + "</th></tr></thead><tbody>";
    var order = X.map(function (p, i) { return i; }).sort(function (p, q) { return S.m[p] - S.m[q] || p - q; });
    order.forEach(function (i) {
      var g = S.grp[i], cls = g === 1 ? " acc" : g === 2 ? " hot" : " dim";
      h += "<tr><td class='num'>" + (i + 1) + "</td><td class='num wide'>" + intFmt(X[i][0] * 100) + "</td><td class='num wide'>" + intFmt(X[i][1] * 10) +
        "</td><td class='rowh'>" + T(Y[i] > 0 ? "svmd.cls.spec" : "svmd.cls.std") + "</td><td class='num" + (g ? cls : "") + "'>" + fmt(S.alpha[i], 3) + "</td><td class='num'>" +
        num(S.m[i], 3) + "</td><td class='num wide'>" + fmt(S.xi[i], 3) + "</td><td class='rowh" + cls + "'>" + grpName(g) + "</td><td class='rowh'>" +
        T(S.ok[i] ? "svmd.lots.yes" : "svmd.lots.no") + "</td></tr>";
    });
    document.getElementById("svmd-lots").innerHTML = h + "</tbody>";
  }
  function renderNotes() {
    var S = SC[state.sc], a = SC.small, c = SC.large;
    document.getElementById("svmd-n1").innerHTML = T("svmd.n.p1", { c0: cFmt(a.C), n0: a.it, b0: a.nbound, c1: cFmt(c.C), n1: c.it });
    document.getElementById("svmd-n2").innerHTML = T("svmd.n.p2", { c: cFmt(S.C), o: fmt(S.D, 3) });
    document.getElementById("svmd-n3").innerHTML = T("svmd.n.p3", {
      c: cFmt(S.C), z: N - S.nsv, f: S.nfree, b: S.nbound, s: S.nsv, c1: cFmt(c.C), b1: c.nbound, w1: fmt(c.width, 3), hw: fmt(HARD.width, 3)
    });
    document.getElementById("svmd-n4").innerHTML = T("svmd.n.p4", { m: intFmt(N * N), s: S.nsv });
  }

  var segBtns = document.querySelectorAll("#svmd-seg button");
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      if (state.sc === b.getAttribute("data-sc")) return;
      state.sc = b.getAttribute("data-sc");
      segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      renderScenText(); renderSolution(); renderCompare(); renderLots(); renderNotes();
      hudKey = "";
      if (A_.reducedMotion) { player.seek(DUR); return; }
      if (player.time < CH[2]) player.refresh();
      else { player.seek(CH[2] + 0.001); player.play(); }
    });
  });

  function renderPage() {
    renderSeg(); renderScenText(); renderData(); renderSolution(); renderCompare(); renderLots(); renderNotes();
    hudKey = "";
    player.refresh();
  }
  I18N.onChange(renderPage);
})();
</script>
