<meta charset="utf-8">

<link rel="stylesheet" href="../assets/research.css?v=__BUILD__">
<style>
  [hidden] { display: none !important; }
  /* bright red for new or urgent cues; where the dark theme makes the accent that same red, the crit shade */
  :root { --hot: var(--mit-bright); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --hot: var(--crit); } }
  :root[data-theme="dark"] { --hot: var(--crit); }

  section.block { grid-template-columns: minmax(0, 1fr); scroll-margin-top: 70px; }
  section.block > * { min-width: 0; }
  .case-num { display: block; font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-text); margin-bottom: 4px; }
  .mhead { margin: 14px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-text); }
  .mhead:first-child { margin-top: 0; }
  .mtext { font-size: 14px; color: var(--ink2); margin: 6px 0 0; max-width: 80ch; }
  .mtext b { color: var(--ink); }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 26px; align-items: start; }
  @media (max-width: 860px) { .two { grid-template-columns: minmax(0, 1fr); } }
  .two > div { min-width: 0; }

  /* ---- animation ---- */
  #gtt-sec .anim-hud {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px;
    top: 12px; left: 12px; width: min(300px, max(222px, 30%)); max-width: none;
  }
  #gtt-sec .anim-hud .chip-stat { opacity: 0; min-width: 0; }
  #gtt-sec .anim-hud .chip-stat span { display: block; line-height: 1.2; }
  #gtt-sec .anim-hud .chip-stat.hot b { color: var(--hot); }
  #gtt-sec .anim-hud .chip-stat.long b { font-size: 15px; }
  @media (min-width: 621px) and (max-width: 820px) {
    #gtt-sec .anim-hud .chip-stat { padding: 4px 7px; font-size: 11px; }
    #gtt-sec .anim-hud .chip-stat b { font-size: 15px; }
    #gtt-sec .anim-hud .chip-stat.long b { font-size: 13px; }
  }
  @media (max-width: 620px) {
    #gtt-sec .anim-hud { grid-template-columns: repeat(3, minmax(0, 1fr)); top: 8px; left: 8px; right: 8px; width: auto; gap: 4px; }
    #gtt-sec .anim-hud .chip-stat { padding: 3px 6px; font-size: 10.5px; }
    #gtt-sec .anim-hud .chip-stat b { font-size: 14px; }
    #gtt-sec .anim-hud .chip-stat.long b { font-size: 11.5px; }
  }
  .anim-legend i.lg-ne { width: 14px; height: 12px; border: 2.5px solid var(--accent); border-radius: 2px; }
  .anim-legend i.lg-best { width: 14px; height: 12px; border: 2.5px solid var(--hot); border-radius: 2px; }
  .anim-legend i.lg-cut { width: 18px; height: 0; border-top: 2px solid var(--hot); }
  .anim-legend i.lg-arrow { width: 20px; height: 10px; position: relative; background: none; }
  .anim-legend i.lg-arrow::before { content: ""; position: absolute; left: 0; right: 5px; top: 4px; height: 2px; background: var(--accent); }
  .anim-legend i.lg-arrow::after { content: ""; position: absolute; right: 0; top: 0; border-left: 7px solid var(--accent); border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
  .anim-legend i.lg-front { width: 18px; height: 0; border-top: 2px solid var(--ink); }
  .anim-legend i.lg-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink2); }
  .scen-status {
    background: var(--surface2); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 3px; padding: 9px 13px; font-size: 14px; color: var(--ink2); margin: 0;
  }
  .scen-status b { color: var(--ink); }

  /* ---- controls ---- */
  .ctl-row { display: flex; flex-wrap: wrap; gap: 12px 26px; align-items: flex-end; }
  .ctl-group { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .ctl-group .lbl, label.lbl { font-size: 13px; color: var(--ink2); font-weight: 600; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  button.btn {
    font: 600 13px var(--font-sans); color: var(--on-solid); background: var(--accent); border: 1px solid var(--accent); border-radius: 2px;
    padding: 8px 12px; cursor: pointer;
  }
  button.btn:hover { filter: brightness(1.1); }
  button.btn:disabled { opacity: 0.45; cursor: default; filter: none; }
  button.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--border); }
  .rng { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; align-items: baseline; min-width: 0; flex: 1 1 200px; max-width: 340px; }
  .rng label { font-size: 13px; color: var(--ink2); font-weight: 600; }
  .rng output { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
  .rng input[type="range"] { flex: 1 1 100%; width: 100%; accent-color: var(--accent); margin: 4px 0 0; }
  select.sel {
    font: 13.5px var(--font-sans); color: var(--ink); background: var(--surface2); max-width: 100%;
    border: 1px solid var(--border); border-radius: 2px; padding: 7px 8px;
  }
  .src-panel { margin-top: 14px; }
  .src-panel .ctl-row { align-items: flex-end; }
  .sliders { display: flex; flex-wrap: wrap; gap: 10px 22px; flex: 1 1 100%; }
  .sliders .rng { flex: 1 1 150px; max-width: 220px; }
  @media (max-width: 560px) {
    .ctl-row > .ctl-group { flex: 1 1 100%; }
    .seg.wide { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .seg.wide button { border-left: none; border-top: 1px solid var(--border); }
    .seg.wide button:nth-child(-n+2) { border-top: none; }
    .seg.wide button:nth-child(2n) { border-left: 1px solid var(--border); }
    .sliders .rng { flex: 1 1 130px; }
  }
  .story { font-size: 14px; color: var(--ink2); margin: 14px 0 0; max-width: 84ch; }
  .story b { color: var(--ink); }

  /* ---- the payoff table ---- */
  .bim-wrap { margin-top: 10px; max-width: 100%; overflow-x: auto; }
  table.bim { border-collapse: collapse; }
  table.bim th { font-size: 13px; font-weight: 600; color: var(--ink2); padding: 4px 8px; text-align: center; white-space: nowrap; }
  table.bim thead th { vertical-align: bottom; }
  table.bim th.rh { text-align: right; padding-right: 10px; }
  table.bim th.corner { text-align: left; font-weight: 400; font-size: 11.5px; color: var(--muted); line-height: 1.25; padding: 0 8px 4px 0; white-space: normal; max-width: 110px; }
  table.bim th.out { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--hot); text-decoration-thickness: 2px; }
  table.bim td { border: 1px solid var(--axis); padding: 0; background: var(--surface); }
  table.bim td.hl { background: var(--sel); }
  .cell {
    position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: 1fr 1fr;
    width: 96px; height: 58px; padding: 4px 7px; font-variant-numeric: tabular-nums;
  }
  .cell .u1, .cell .u2 { font-size: 15px; line-height: 1.15; white-space: nowrap; color: var(--ink); background: none; border: 0; padding: 0 1px; font-family: inherit; }
  .cell .u1 { grid-area: 2 / 1; justify-self: start; align-self: end; font-weight: 700; }
  .cell .u2 { grid-area: 1 / 2; justify-self: end; align-self: start; color: var(--ink2); }
  .cell .ar { font-size: 16px; line-height: 1; color: var(--accent-text); font-weight: 700; }
  .cell .ar-v { grid-area: 1 / 1; justify-self: start; align-self: start; }
  .cell .ar-h { grid-area: 2 / 2; justify-self: end; align-self: end; }
  .cell .br { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2.5px; text-underline-offset: 3px; }
  td.ne .cell::after { content: ""; position: absolute; inset: 2px; border: 2.5px solid var(--accent); border-radius: 3px; pointer-events: none; }
  td.best .cell::before { content: ""; position: absolute; inset: 5px; border: 2px dashed var(--hot); border-radius: 2px; pointer-events: none; }
  td.out .cell { opacity: 0.38; }
  td.out-r .cell { background-image: linear-gradient(to bottom, transparent calc(50% - 1px), var(--hot) calc(50% - 1px), var(--hot) calc(50% + 1px), transparent calc(50% + 1px)); }
  td.out-c .cell { background-image: linear-gradient(to right, transparent calc(50% - 1px), var(--hot) calc(50% - 1px), var(--hot) calc(50% + 1px), transparent calc(50% + 1px)); }
  td.out-r.out-c .cell { background-image: linear-gradient(to bottom, transparent calc(50% - 1px), var(--hot) calc(50% - 1px), var(--hot) calc(50% + 1px), transparent calc(50% + 1px)), linear-gradient(to right, transparent calc(50% - 1px), var(--hot) calc(50% - 1px), var(--hot) calc(50% + 1px), transparent calc(50% + 1px)); }
  td.cmp .u1.big, td.cmp .u2.big { color: var(--accent-text); }
  /* try mode: the payoffs are buttons */
  .cell button.u1, .cell button.u2 { cursor: pointer; border-radius: 2px; outline-offset: 1px; }
  .cell button.u1:hover, .cell button.u2:hover { background: var(--surface2); }
  .cell button[aria-pressed="true"] { text-decoration: underline; text-decoration-color: var(--ink); text-decoration-thickness: 2.5px; text-underline-offset: 3px; }
  .cell button.ok { text-decoration-color: var(--accent); color: var(--accent-text); }
  .cell button.wrong { text-decoration: line-through; text-decoration-color: var(--hot); text-decoration-thickness: 2px; }
  .cell button.miss { box-shadow: inset 0 0 0 2px var(--hot); }
  /* free mode: the payoffs are inputs */
  .cell.edit { grid-template-columns: minmax(0, 1fr); gap: 3px; padding: 4px 5px; height: auto; }
  .cell.edit input {
    width: 100%; min-width: 0; font: 600 13.5px var(--font-sans); color: var(--ink); background: var(--surface2);
    border: 1px solid var(--border); border-radius: 2px; padding: 3px 5px; text-align: right;
  }
  .cell.edit input.i1 { grid-area: 2 / 1; }
  .cell.edit input.i2 { grid-area: 1 / 1; color: var(--ink2); font-weight: 400; }
  .cell.edit .ar { display: none; }
  @media (max-width: 560px) {
    .cell { width: 64px; height: 50px; padding: 3px 5px; }
    .cell .u1, .cell .u2 { font-size: 13px; }
    .cell .ar { font-size: 14px; }
    table.bim th { font-size: 12px; padding: 3px 5px; }
    table.bim th.corner { max-width: 70px; font-size: 10.5px; }
    .cell.edit input { font-size: 12.5px; padding: 2px 3px; }
  }
  .tabkey { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
  .cellinfo { font-size: 13.5px; color: var(--ink2); margin: 6px 0 0; min-height: 2.7em; max-width: 84ch; }
  .cellinfo b { color: var(--ink); }

  /* ---- live numbers ---- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
  @media (max-width: 460px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .kpi { border: 1px solid var(--border); border-radius: 3px; padding: 8px 11px; background: var(--surface); min-width: 0; }
  .kpi b { display: block; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); letter-spacing: -0.01em; line-height: 1.2; overflow-wrap: anywhere; }
  .kpi span { display: block; font-size: 12.5px; color: var(--ink2); line-height: 1.3; margin-top: 2px; }
  .kpi.accent { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .kpi.accent b { color: var(--accent-text); }
  .kpi.hot { border-color: var(--hot); box-shadow: inset 3px 0 0 var(--hot); }
  @media (max-width: 460px) { .kpi b { font-size: 15.5px; } .kpi span { font-size: 12px; } }
  .verdict { margin: 12px 0 0; padding: 10px 14px; border-radius: 3px; font-size: 14px; border: 1px solid var(--border); border-left: 3px solid var(--ink2); background: var(--surface2); color: var(--ink2); max-width: 92ch; }
  .verdict b { color: var(--ink); }
  .verdict.ok { border-left-color: var(--accent); }
  .verdict.bad { border-left-color: var(--hot); }

  /* ---- lenses ---- */
  .lens-panel { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
  .chart-title { margin: 16px 0 0; font-size: 13px; font-weight: 700; color: var(--ink); }
  .chart-title:first-child { margin-top: 0; }
  .elog { margin: 10px 0 0; padding-left: 22px; font-size: 13.5px; color: var(--ink2); max-width: 92ch; }
  .elog li { margin: 3px 0; }
  .elog li b { color: var(--ink); }
  .elog li.next { color: var(--muted); list-style-type: circle; }
  .pairs2 { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pairs2 .pc { font-size: 12.5px; border: 1px solid var(--border); border-radius: 2px; padding: 4px 8px; color: var(--ink2); background: var(--surface); }
  .pairs2 .pc b { color: var(--ink); }
  .pairs2 .pc.strict { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .pairs2 .pc.strict b { color: var(--accent-text); }
  .pairs2 .pc.weak { border-style: dashed; border-color: var(--ink2); }
  .pairs2 .pc.none { color: var(--muted); }
  .pairs2 .who { flex-basis: 100%; font-size: 12.5px; font-weight: 600; color: var(--ink2); margin-top: 4px; }
  .chartbox { margin-top: 8px; min-width: 0; }
  .chartbox svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chartbox svg text { font-family: var(--font-sans); font-size: 12px; fill: var(--ink2); }
  .chartbox svg text.b { font-weight: 700; fill: var(--ink); }
  .chartbox svg text.acc { font-weight: 700; fill: var(--accent-text); }
  .chartbox svg text.hot { font-weight: 700; fill: var(--hot); }
  .chartbox svg text.mut { fill: var(--muted); }
  .sv-ax { stroke: var(--axis); stroke-width: 1; fill: none; }
  .sv-grid { stroke: var(--grid); stroke-width: 1; fill: none; }
  .sv-ink { stroke: var(--ink); stroke-width: 2; fill: none; }
  .sv-ink2 { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .sv-acc { stroke: var(--accent); stroke-width: 3; fill: none; }
  .sv-sil { stroke: var(--mit-silver); stroke-width: 1.6; fill: none; }
  .sv-hot { stroke: var(--hot); stroke-width: 2; fill: none; }
  .sv-dash { stroke-dasharray: 5 4; }
  .sv-reg { fill: var(--region); stroke: var(--mit-silver); stroke-width: 1; }
  .sv-quad { fill: var(--sel); stroke: none; }
  .sv-dot { fill: var(--ink2); }
  .sv-dot.eff { fill: var(--ink); }
  .sv-ring { fill: none; stroke: var(--accent); stroke-width: 2.5; }
  .sv-hring { fill: none; stroke: var(--hot); stroke-width: 2.5; }
  .sv-fhot { fill: var(--hot); }
  .sv-facc { fill: var(--accent); }
  .sv-fsurf { fill: var(--surface); }
  .sv-halo { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
  .legend2 { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink2); margin-top: 6px; }
  .legend2 span { display: inline-flex; align-items: center; gap: 6px; }
  .legend2 i { display: inline-block; flex: none; }
  .legend2 i.l-reg { width: 14px; height: 11px; background: var(--region); border: 1px solid var(--mit-silver); }
  .legend2 i.l-front { width: 18px; height: 0; border-top: 2px solid var(--ink); }
  .legend2 i.l-env { width: 18px; height: 0; border-top: 3px solid var(--accent); }
  .legend2 i.l-ne { width: 12px; height: 12px; border-radius: 50%; border: 2.5px solid var(--accent); }
  .legend2 i.l-best { width: 12px; height: 12px; border-radius: 50%; border: 2.5px solid var(--hot); }
  .legend2 i.l-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink); }
  .legend2 i.l-ink { width: 18px; height: 0; border-top: 2px solid var(--ink); }
  .legend2 i.l-acc { width: 18px; height: 0; border-top: 3px solid var(--accent); }
  .legend2 i.l-sil { width: 18px; height: 0; border-top: 2px dashed var(--mit-silver); }
  .legend2 i.l-dash { width: 18px; height: 0; border-top: 2px dashed var(--ink); }
  details.sub { margin-top: 16px; }
  details.sub .body { max-width: none; }
  .bars { display: grid; gap: 5px; margin-top: 10px; max-width: 560px; }
  .bar { display: grid; grid-template-columns: 74px minmax(0, 1fr) 62px; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink2); }
  .bar .tr { height: 12px; background: var(--surface2); border: 1px solid var(--border); position: relative; }
  .bar .tr i { position: absolute; inset: 0 auto 0 0; background: var(--ink2); }
  .bar.first .tr i { background: var(--accent); }
  .bar output { font-family: var(--font-mono); font-size: 12px; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
  .mc { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
  @media (max-width: 460px) { .mc { grid-template-columns: minmax(0, 1fr); } }
  .cls-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 18px; margin-top: 8px; }
  .cls-grid .rng { max-width: none; }
  .fam { font-size: 20px; font-weight: 700; color: var(--accent-text); margin: 10px 0 0; }

  /* ---- price of going alone ---- */
  .alone-card .ctl-row { margin-top: 2px; }

  /* ---- model ---- */
  .model-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 22px; align-items: start; }
  @media (max-width: 860px) { .model-grid { grid-template-columns: minmax(0, 1fr); } }
  .model-grid > div { min-width: 0; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="backlink" href="index.html" data-keep-lang><span aria-hidden="true">←</span> <span data-i18n="gtt.back"></span></a>
    <div class="lang" data-lang-switcher></div>
  </div>
</header>

<div class="wrap">
  <header class="masthead">
    <p class="eyebrow" data-i18n-html="gtt.eyebrow"></p>
    <h1 data-i18n="gtt.title"></h1>
    <p class="lede" data-i18n-html="gtt.lede"></p>
  </header>

  <!-- =================================================================== what a game is -->
  <div class="card">
    <h2><span class="kicker" data-i18n="gtt.what.kicker"></span><span data-i18n="gtt.what.title"></span></h2>
    <div class="two">
      <div>
        <p class="mtext" style="margin-top:0" data-i18n-html="gtt.what.p1"></p>
        <p class="mtext" data-i18n-html="gtt.what.p2"></p>
        <p class="mtext" data-i18n-html="gtt.what.p3"></p>
      </div>
      <div>
        <p class="mhead" data-i18n="gtt.what.head"></p>
        <div class="formula" data-tex="gtt.what.tex" data-i18n="gtt.what.formula"></div>
        <p class="mtext" data-i18n-html="gtt.what.p4"></p>
      </div>
    </div>
  </div>

  <!-- =================================================================== 1. animation -->
  <section class="block" id="gtt-sec" aria-labelledby="h-anim">
    <h2 class="section-title" id="h-anim"><span class="case-num" data-i18n="gtt.part1"></span><span data-i18n="nav.animation"></span></h2>
    <p class="section-intro" data-i18n-html="gtt.anim.intro"></p>
    <div class="anim-controls">
      <span class="ctl-label" id="gtt-menu-lbl" data-i18n="gtt.anim.ctl"></span>
      <div class="seg" role="group" aria-labelledby="gtt-menu-lbl" id="gtt-seg">
        <button type="button" data-sc="m2" aria-pressed="false"></button>
        <button type="button" data-sc="m3" aria-pressed="true"></button>
        <button type="button" data-sc="m4" aria-pressed="false"></button>
      </div>
    </div>
    <div class="anim" id="gtt-anim">
      <div class="anim-stage" role="img">
        <div class="anim-hud" id="gtt-hud">
          <div class="chip-stat" id="gtt-c0"><b></b><span></span></div>

      b: profile(G, S.best.i, S.best.j), vb: and2(pv(S.best.a), pv(S.best.b)), l: pv(tot - S.ne.a - S.ne.b), tot: pv(tot)
    });
    stage.setAttribute("aria-label", T("gtt.anim.aria") + " " + T("gtt.anim.aria.nums", {
      menu: menuName(ast.menu), n: S.rounds.length, x: profile(G, S.ne.i, S.ne.j), v: and2(pv(S.ne.a), pv(S.ne.b)), b: profile(G, S.best.i, S.best.j), vb: and2(pv(S.best.a), pv(S.best.b))
    }));
  }
  function renderModel() {
    $("gtt-mdata").innerHTML = T("gtt.m.data", { a: fmt(A_), b: fmt(B_), c: fmt(C_) });
  }
  function renderNotes() {
    var S3 = scen("m3"), S2 = scen("m2"), S4 = scen("m4"), G3 = S3.G;
    var r1 = S3.rounds[0].rows[0], r2 = S3.rounds[1].rows[0];
    $("gtt-n1").innerHTML = T("gtt.n.p1", {
      s1: fmt(S3.qs[r1.s]), by1: fmt(S3.qs[r1.by]), c1: cmpText(G3, 1, r1.by, r1.s, r1.O),
      s2: fmt(S3.qs[r2.s]), by2: fmt(S3.qs[r2.by]), c2: cmpText(G3, 1, r2.by, r2.s, r2.O), x: profile(G3, S3.ne.i, S3.ne.j), n: S3.rounds.length
    });
    var d = S2.pd, br30 = brInfo(G3, allR(G3), allC(G3)).b1[0][0];
    $("gtt-n2").innerHTML = T("gtt.n.p2", {
      b: profile(G3, S3.best.i, S3.best.j), vb: pv(S3.best.a), ve: pv(S3.ne.a), br: fmt(S3.qs[br30]), vbr: pv(G3.A[br30][0]), c0: fmt(S3.qs[0]),
      pa: fmt(S2.qs[0]), pb: fmt(S2.qs[1]),
      T: pv(d.T), R: pv(d.R), P: pv(d.P), S: pv(d.S), r2: pv(2 * d.R), ts: pv(d.T + d.S)
    });
    var t4 = S4.rounds[0].ties[0];
    $("gtt-n3").innerHTML = T("gtt.n.p3", { n: S4.rounds.length, menu: menuName("m4"), s: fmt(S4.qs[t4.s]), k: fmt(S4.qs[t4.k]), j: fmt(S4.qs[t4.j]), v: pv(t4.v),
      first: fmt(S4.qs[S4.rounds[0].rows[0].s]) });
    var W0 = classicGame("weak"), a = iewds(W0, "top"), b = iewds(W0, "bottom"), Gi = classicGame("gib"), gi = iesds(Gi);
    var pays = function (G, R, C) { var o = []; R.forEach(function (i) { C.forEach(function (j) { var s = pp(G.A[i][j], G.B[i][j]); if (o.indexOf(s) < 0) o.push(s); }); }); return joinL(o); };
    $("gtt-n4").innerHTML = T("gtt.n.p4", { a: pays(W0, a.R, a.C), b: pays(W0, b.R, b.C), g: profile(Gi, gi.R[0], gi.C[0]), gp: pp(Gi.A[gi.R[0]][gi.C[0]], Gi.B[gi.R[0]][gi.C[0]]), gn: gi.rounds.length });
    var B = belief(G3, allR(G3), 0, 2), never = allR(G3).filter(function (i) { return !B.some[i]; });
    $("gtt-n5").innerHTML = T("gtt.n.p5", { a: fmt(S3.qs[0]), b: fmt(S3.qs[2]), t: fmt(B.sw[0].t, 3), from: fmt(S3.qs[B.sw[0].from]), to: fmt(S3.qs[B.sw[0].to]),
      never: joinL(never.map(function (i) { return fmt(S3.qs[i]); })) });
    var e2 = exactNE(2, 2), e3 = exactNE(3, 3);
    $("gtt-n6").innerHTML = T("gtt.n.p6", { a0: T("gtt.pct", { v: fmt(100 * e2[0], 1) }), a1: T("gtt.pct", { v: fmt(100 * e2[1], 1) }), a2: T("gtt.pct", { v: fmt(100 * e2[2], 1) }),
      b0: T("gtt.pct", { v: fmt(100 * e3[0], 1) }) });
    var l2 = lake(2, 0), l10 = lake(10, 0), O = lakeOpt(), p1 = pigou(1), p2 = pigou(2);
    $("gtt-n7").innerHTML = T("gtt.n.p7", { X2: fmt(l2.X, 1), W2: fmt(l2.W, 0), Wo: fmt(O.W, 0), Xo: fmt(O.X, 0), r2: fmt(O.W / l2.W, 3), r10: fmt(O.W / l10.W, 3), f2: fmt(feeStar(2), 1),
      c1: fmt(p1.Copt, 3), poa1: fmt(p1.poa, 3), poa2: fmt(p2.poa, 3) });
  }

  /* ---------- the menu control of the animation ---------- */
  var segBtns = document.querySelectorAll("#gtt-seg button");
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      if (ast.menu === b.getAttribute("data-sc")) return;
      ast.menu = b.getAttribute("data-sc");
      segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      hudKey = "";
      renderStatus(); renderStrip1();
      if (AN.reducedMotion) { player.seek(DUR); return; }
      if (player.time < CH[1]) player.refresh();
      else { player.seek(CH[1] + 0.001); player.play(); }
    });
  });

  function renderPage() {
    renderSeg(); renderStatus(); renderStrip1(); renderModel(); renderNotes();
    buildMarketSliders(); buildClassicSelect(); buildCls();
    if (!WB.G) setGame(currentGame(), false);
    refreshAll(true);
    showInfo(null);
    renderBeauty();
    renderAlone();
    hudKey = "";
    player.refresh();
  }
  var rsz = 0;
  window.addEventListener("resize", function () {
    clearTimeout(rsz);
    rsz = setTimeout(function () { if (WB.G) { renderBench(); renderAlone(); } }, 120);
  });
  I18N.onChange(renderPage);
})();
</script>
