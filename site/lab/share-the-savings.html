<html lang="en" data-title-key="gtc.title" data-i18n-bundles="lab/lab-gtb-share">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="stylesheet" href="../assets/research.css?v=__BUILD__">
<style>
  [hidden] { display: none !important; }
  /* bright red for new or urgent cues; where the dark theme makes the accent that same red, the crit shade */
  :root { --hot: var(--mit-bright); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --hot: var(--crit); } }
  :root[data-theme="dark"] { --hot: var(--crit); }

  section.block { grid-template-columns: minmax(0, 1fr); scroll-margin-top: 70px; }
  section.block > * { min-width: 0; }
  .case-num { display: block; font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-text); margin-bottom: 4px; }
  .mhead { margin: 14px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-text); }
  .mhead:first-child { margin-top: 0; }
  .mtext { font-size: 14px; color: var(--ink2); margin: 6px 0 0; max-width: 80ch; }
  .mtext b, .mtext strong { color: var(--ink); }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 26px; align-items: start; }
  @media (max-width: 860px) { .two { grid-template-columns: minmax(0, 1fr); } }
  .two > div { min-width: 0; }

  /* ---- animation ---- */
  #gtc-sec .anim-hud {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px;
    top: 12px; left: 12px; width: min(310px, max(232px, 30%)); max-width: none;
  }
  #gtc-sec .anim-hud .chip-stat { opacity: 0; min-width: 0; }
  #gtc-sec .anim-hud .chip-stat span { display: block; line-height: 1.2; }
  #gtc-sec .anim-hud .chip-stat.hot b { color: var(--hot); }
  #gtc-sec .anim-hud .chip-stat.long b { font-size: 14.5px; white-space: nowrap; }
  @media (min-width: 621px) and (max-width: 820px) {
    #gtc-sec .anim-hud .chip-stat { padding: 4px 7px; font-size: 11px; }
    #gtc-sec .anim-hud .chip-stat b { font-size: 15px; }
    #gtc-sec .anim-hud .chip-stat.long b { font-size: 12.5px; }
  }
  @media (max-width: 620px) {
    #gtc-sec .anim-hud { top: 8px; left: 8px; right: 8px; width: auto; gap: 4px; }
    #gtc-sec .anim-hud .chip-stat { padding: 3px 6px; font-size: 10.5px; }
    #gtc-sec .anim-hud .chip-stat b { font-size: 14px; }
    #gtc-sec .anim-hud .chip-stat.long b { font-size: 12px; }
  }
  .anim-legend i.lg-core { width: 14px; height: 11px; background: var(--sel); border: 2px solid var(--accent); }
  .anim-legend i.lg-reg { width: 14px; height: 11px; background: var(--region); border: 1px solid var(--mit-silver); }
  .anim-legend i.lg-in { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .anim-legend i.lg-out { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--hot); }
  .anim-legend i.lg-web { width: 18px; height: 0; border-top: 2px dashed var(--ink); }
  .anim-legend i.lg-shap { width: 10px; height: 10px; background: var(--ink); transform: rotate(45deg); margin: 0 2px; }
  .anim-legend i.lg-nuc { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--accent); margin: 0 3px; }
  .scen-status {
    background: var(--surface2); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 3px; padding: 9px 13px; font-size: 14px; color: var(--ink2); margin: 0;
  }
  .scen-status b { color: var(--ink); }

  /* ---- controls ---- */
  .ctl-row { display: flex; flex-wrap: wrap; gap: 12px 26px; align-items: flex-end; }
  .ctl-group { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .ctl-group .lbl, label.lbl { font-size: 13px; color: var(--ink2); font-weight: 600; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  button.btn {
    font: 600 13px var(--font-sans); color: var(--on-solid); background: var(--accent); border: 1px solid var(--accent); border-radius: 2px;
    padding: 7px 11px; cursor: pointer;
  }
  button.btn:hover { filter: brightness(1.1); }
  button.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--border); }
  button.btn.ghost[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  .rng { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; align-items: baseline; min-width: 0; flex: 1 1 200px; max-width: 360px; }
  .rng label { font-size: 13px; color: var(--ink2); font-weight: 600; }
  .rng output { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
  .rng input[type="range"] { flex: 1 1 100%; width: 100%; accent-color: var(--accent); margin: 4px 0 0; }
  select.sel {
    font: 13.5px var(--font-sans); color: var(--ink); background: var(--surface2); max-width: 100%;
    border: 1px solid var(--border); border-radius: 2px; padding: 6px 8px;
  }
  /* a segmented control laid out as a grid (eight data sets) */
  .seg.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); }
  .seg.grid button { border: 0 !important; padding: 8px 10px; }
  @media (max-width: 560px) {
    .seg.grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .ctl-row > .ctl-group { flex: 1 1 100%; }
  }
  .src-panel { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .sliders { display: flex; flex-wrap: wrap; gap: 10px 22px; flex: 1 1 100%; }
  .sliders .rng { flex: 1 1 160px; max-width: 240px; }
  .num-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; max-width: 640px; }
  @media (max-width: 620px) { .num-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .num-grid label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ink2); font-weight: 600; min-width: 0; }
  input.num {
    width: 100%; min-width: 0; font: 600 13.5px var(--font-sans); color: var(--ink); background: var(--surface2);
    border: 1px solid var(--border); border-radius: 2px; padding: 5px 6px; text-align: right; font-variant-numeric: tabular-nums;
  }
  .story { font-size: 14px; color: var(--ink2); margin: 14px 0 0; max-width: 92ch; }
  .story b { color: var(--ink); }
  .regime { margin-top: 10px; max-width: 640px; }
  .regime svg { display: block; width: 100%; height: auto; overflow: visible; }
  .regime svg text { font-family: var(--font-sans); font-size: 11px; fill: var(--ink2); }

  /* ---- live numbers ---- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 12px; }
  @media (max-width: 460px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .kpi { border: 1px solid var(--border); border-radius: 3px; padding: 8px 11px; background: var(--surface); min-width: 0; }
  .kpi b { display: block; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); letter-spacing: -0.01em; line-height: 1.2; overflow-wrap: anywhere; }
  .kpi span { display: block; font-size: 12.5px; color: var(--ink2); line-height: 1.3; margin-top: 2px; }
  .kpi.accent { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .kpi.accent b { color: var(--accent-text); }
  .kpi.hot { border-color: var(--hot); box-shadow: inset 3px 0 0 var(--hot); }
  .kpi.hot b { color: var(--hot); }
  @media (max-width: 460px) { .kpi b { font-size: 15.5px; } .kpi span { font-size: 12px; } }
  .verdict { margin: 12px 0 0; padding: 10px 14px; border-radius: 3px; font-size: 14px; border: 1px solid var(--border); border-left: 3px solid var(--ink2); background: var(--surface2); color: var(--ink2); max-width: 92ch; }
  .verdict b { color: var(--ink); }
  .verdict.ok { border-left-color: var(--accent); }
  .verdict.bad { border-left-color: var(--hot); }

  /* ---- triangle and coalition table ---- */
  .tri-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 14px 26px; margin-top: 14px; align-items: start; }
  @media (max-width: 900px) { .tri-grid { grid-template-columns: minmax(0, 1fr); } }
  .tri-grid > div { min-width: 0; }
  .chart-title { margin: 0; font-size: 13px; font-weight: 700; color: var(--ink); }
  .chartbox { margin-top: 8px; min-width: 0; }
  .chartbox svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: none; }
  .chartbox svg text { font-family: var(--font-sans); font-size: 12px; fill: var(--ink2); }
  .chartbox svg text.b { font-weight: 700; fill: var(--ink); }
  .chartbox svg text.acc { font-weight: 700; fill: var(--accent-text); }
  .chartbox svg text.hot { font-weight: 700; fill: var(--hot); }
  .chartbox svg text.mut { fill: var(--muted); }
  .sv-halo { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
  .nontri { font-size: 13.5px; color: var(--ink2); margin: 8px 0 0; padding: 12px 14px; border: 1px dashed var(--border); border-radius: 3px; }
  .legend2 { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink2); margin-top: 6px; }
  .legend2 span { display: inline-flex; align-items: center; gap: 6px; }
  .legend2 i { display: inline-block; flex: none; }
  .legend2 i.l-core { width: 14px; height: 11px; background: var(--sel); border: 2px solid var(--accent); }
  .legend2 i.l-reg { width: 14px; height: 11px; background: var(--region); border: 1px solid var(--mit-silver); }
  .legend2 i.l-you { width: 12px; height: 12px; border-radius: 50%; border: 2.5px solid var(--ink); }
  .legend2 i.l-shap { width: 9px; height: 9px; background: var(--ink); transform: rotate(45deg); margin: 0 2px; }
  .legend2 i.l-nuc { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .legend2 i.l-owen { width: 10px; height: 10px; background: var(--surface); border: 2.5px solid var(--accent); }
  .legend2 i.l-web { width: 18px; height: 0; border-top: 2px dashed var(--ink); }
  .legend2 i.l-eps { width: 18px; height: 0; border-top: 2.5px dashed var(--accent); }
  .legend2 i.l-rule { width: 9px; height: 9px; border-radius: 50%; background: var(--mit-silver); }
  .tri-help { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
  .tblwrap { overflow-x: auto; margin-top: 8px; }
  table.data { min-width: 0; }
  table.data td, table.data th { white-space: nowrap; }
  table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.data td.bad { color: var(--hot); font-weight: 700; }
  table.data td.good { color: var(--ink2); }
  table.data td.mut { color: var(--muted); }
  table.data tr.grand td { border-top: 1px solid var(--axis); font-weight: 600; }
  table.data tr.sel td { background: var(--sel); }
  table.data.compact { font-size: 13px; }
  .lens-panel table.data.compact, #gtc-pooltab, #gtc-links, #gtc-ws-own { width: auto; min-width: min(100%, 340px); }
  .lens-panel #gtc-board { width: 100%; }
  #gtc-board th { white-space: normal; vertical-align: bottom; min-width: 80px; }
  #gtc-coal th { white-space: normal; vertical-align: bottom; }
  #gtc-board td { white-space: normal; min-width: 64px; }
  #gtc-board td:first-child { min-width: 120px; }
  #gtc-board td:nth-child(2) { white-space: nowrap; }
  #gtc-board td:nth-child(n+3) { min-width: 96px; }
  #gtc-lattice svg, #gtc-map svg { max-width: 440px; }
  #gtc-verts-box { margin-top: 16px; }
  table.data.compact td, table.data.compact th { padding: 5px 8px; }
  .tsel { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 8px; }
  .tsel label { font-size: 13px; color: var(--ink2); font-weight: 600; }

  /* ---- lenses ---- */
  .lens-panel { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
  .lens-panel .chart-title { margin-top: 16px; }
  .lens-panel .chart-title:first-child { margin-top: 0; }
  .gauge { display: grid; gap: 5px; margin-top: 10px; max-width: 560px; }
  .gbar { display: grid; grid-template-columns: 120px minmax(0, 1fr) 70px; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink2); }
  .gbar .tr { height: 13px; background: var(--surface2); border: 1px solid var(--border); position: relative; }
  .gbar .tr i { position: absolute; inset: 0 auto 0 0; background: var(--ink2); }
  .gbar.z .tr i { background: var(--accent); }
  .gbar.z.bad .tr i { background: var(--hot); }
  .gbar output { font-family: var(--font-mono); font-size: 12px; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
  @media (max-width: 460px) { .gbar { grid-template-columns: 92px minmax(0, 1fr) 60px; } }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chips .pc { font-size: 12.5px; border: 1px solid var(--border); border-radius: 2px; padding: 4px 8px; color: var(--ink2); background: var(--surface); }
  .chips .pc b { color: var(--ink); }
  .chips .pc.on { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .chips .pc.on b { color: var(--accent-text); }
  .elog { margin: 10px 0 0; padding-left: 22px; font-size: 13.5px; color: var(--ink2); max-width: 92ch; }
  .elog li { margin: 3px 0; }
  .elog li b { color: var(--ink); }
  .cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 18px; }
  @media (max-width: 860px) { .cols3 { grid-template-columns: minmax(0, 1fr); } }
  .cols3 > div, .cols2 > div { min-width: 0; }
  .cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 22px; }
  @media (max-width: 760px) { .cols2 { grid-template-columns: minmax(0, 1fr); } }
  .yes { color: var(--accent-text); font-weight: 700; }
  .no { color: var(--hot); font-weight: 700; }
  .na { color: var(--muted); }
  .paths { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 14px; margin-top: 10px; }
  @media (max-width: 760px) { .paths { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .paths svg { display: block; width: 100%; height: auto; overflow: visible; }
  .paths svg text { font-family: var(--font-sans); font-size: 11px; fill: var(--ink2); }
  .paths .pt { font-size: 12.5px; font-weight: 700; color: var(--ink); margin: 0; }
  .map-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 22px; align-items: start; }
  @media (max-width: 760px) { .map-grid { grid-template-columns: minmax(0, 1fr); } }
  .map-grid > div { min-width: 0; }
  #gtc-map circle.drag { cursor: grab; }
  #gtc-lattice g.node { cursor: pointer; }
  #gtc-lattice g.node:focus { outline: none; }
  #gtc-lattice g.node:focus-visible rect { stroke: var(--ink); stroke-width: 2.5; }
  .own-tbl input.num { max-width: 84px; }

  /* ---- model ---- */
  .model-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 22px; align-items: start; }
  @media (max-width: 860px) { .model-grid { grid-template-columns: minmax(0, 1fr); } }
  .model-grid > div { min-width: 0; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="backlink" href="index.html" data-keep-lang><span aria-hidden="true">←</span> <span data-i18n="gtc.back"></span></a>
    <div class="lang" data-lang-switcher></div>
  </div>
</header>

<div class="wrap">
  <header class="masthead">
    <p class="eyebrow" data-i18n-html="gtc.eyebrow"></p>
    <h1 data-i18n="gtc.title"></h1>
    <p class="lede" id="gtc-lede"></p>
  </header>

  <!-- =================================================================== contracts change the game -->
  <div class="card">
    <h2><span class="kicker" data-i18n="gtc.what.kicker"></span><span data-i18n="gtc.what.title"></span></h2>
    <div class="two">
      <div>
        <p class="mtext" style="margin-top:0" data-i18n-html="gtc.what.p1"></p>
        <p class="mtext" id="gtc-what-pw"></p>
        <p class="mtext" data-i18n-html="gtc.what.p3"></p>
      </div>
      <div>
        <p class="mhead" data-i18n="gtc.what.head"></p>
        <div class="formula" data-tex="gtc.what.tex" data-i18n="gtc.what.formula"></div>
        <p class="mtext" data-i18n-html="gtc.what.p4"></p>
      </div>
    </div>
  </div>

  <!-- =================================================================== 1. animation -->
  <section class="block" id="gtc-sec" aria-labelledby="h-anim">
    <h2 class="section-title" id="h-anim"><span class="case-num" data-i18n="gtc.part1"></span><span data-i18n="nav.animation"></span></h2>
    <p class="section-intro" id="gtc-anim-intro"></p>
    <div class="anim-controls">
      <span class="ctl-label" id="gtc-sc-lbl" data-i18n="gtc.anim.ctl"></span>
      <div class="seg" role="group" aria-labelledby="gtc-sc-lbl" id="gtc-seg">
        <button type="button" data-sc="weak" aria-pressed="false"></button>
        <button type="button" data-sc="mid" aria-pressed="true"></button>
        <button type="button" data-sc="strong" aria-pressed="false"></button>
      </div>
    </div>
    <div class="anim" id="gtc-anim">
      <div class="anim-stage" role="img">
        <div class="anim-hud" id="gtc-hud">
          <div class="chip-stat" id="gtc-c0"><b></b><span></span></div>
          <div class="chip-stat" id="gtc-c1"><b></b><span></span></div>
          <div class="chip-stat" id="gtc-c2"><b></b><span></span></div>
          <div class="chip-stat" id="gtc-c3"><b></b><span></span></div>
          <div class="chip-stat" id="gtc-c4"><b></b><span></span></div>
          <div class="chip-stat" id="gtc-c5"><b></b><span></span></div>
        </div>
      </div>
    </div>
    <div class="anim-legend">
      <span><i class="lg-core"></i><span data-i18n="gtc.lg.core"></span></span>
      <span><i class="lg-reg"></i><span data-i18n="gtc.lg.reg"></span></span>
      <span><i class="lg-in"></i><span data-i18n="gtc.lg.in"></span></span>
      <span><i class="lg-out"></i><span data-i18n="gtc.lg.out"></span></span>
      <span><i class="lg-web"></i><span data-i18n="gtc.lg.web"></span></span>
      <span><i class="lg-shap"></i><span data-i18n="gtc.lg.shap"></span></span>
      <span><i class="lg-nuc"></i><span data-i18n="gtc.lg.nuc"></span></span>
    </div>
    <p class="scen-status" id="gtc-status" aria-live="polite"></p>
    <p class="mhead" data-i18n="gtc.s1.head"></p>
    <div class="formula" id="gtc-s1"></div>
    <p class="mtext" id="gtc-s1-note"></p>
  </section>

  <!-- =================================================================== 2. your alliance -->
  <section class="block" id="gtc-bench" aria-labelledby="h-bench">
    <h2 class="section-title" id="h-bench"><span class="case-num" data-i18n="gtc.part2"></span><span data-i18n="gtc.b.title"></span></h2>
    <p class="section-intro" data-i18n-html="gtc.b.intro"></p>
    <div class="card">
      <div class="ctl-row">
        <div class="ctl-group" style="flex:1 1 420px;max-width:640px">
          <span class="lbl" id="gtc-ds-lbl" data-i18n="gtc.b.ds"></span>
          <div class="seg grid" role="group" aria-labelledby="gtc-ds-lbl" id="gtc-ds">
            <button type="button" data-v="dc" aria-pressed="true" data-i18n="gtc.ds.dc"></button>

      esc(T(cost ? "gtc.tb.pays" : "gtc.tb.gets")) + '</th><th class="num">' + esc(T("gtc.tb.comp")) + "</th></tr></thead><tbody>"];

  /* ---------- KPIs and the story line ---------- */
  function kpi(v, l, cls) { return '<div class="kpi' + (cls ? " " + cls : "") + '"><b>' + v + "</b><span>" + esc(l) + "</span></div>"; }

  /* ---------- lens: core (core LP, Bondareva and Shapley certificate, vertices, Owen) ---------- */

  function renderCoreLens() {

  /* ---------- lens: Shapley (subsets, orders, dividends) ---------- */

      A.orders.forEach(function (o) {

    } else {
      oh.push("<tbody><tr><td>" + esc(T("gtc.ls.many", { k: num(TU.FACT[n], 0), x: triD(show(G, A.sh.xOrders)) })) + "</td></tr></tbody>");

    var arr = cost ? G.c : G.v, d = TU.dividends({ n: n, N: G.N, v: arr }), dh = ["<thead><tr><th>" + esc(T("gtc.tb.S")) + '</th><th class="num">' + esc(T("gtc.ls.div")) + '</th><th class="num">' + esc(T("gtc.ls.each")) + "</th></tr></thead><tbody>"];

    var nIn = A.orders ? A.orders.filter(function (o) { return o.inCore; }).length : null, el = $("gtc-shapnote");

  /* ---------- lens: nucleolus (LP rounds, epsilon core, sorted complaints) ---------- */
  function epsSpan() { var lo = A.nu.least; return { lo: lo, hi: lo + Math.max(A.G.sur, 1e-3) * 0.9 }; }
  function epsNow() {
    var sp = epsSpan();
    if (WB.epsU == null) WB.epsU = sp.lo < 0 ? clamp(-0.5 * sp.lo / (sp.hi - sp.lo), 0, 1) : 0.15;
    return lerp(sp.lo, sp.hi, WB.epsU);
  }
  function renderNucLens() {
    var G = A.G, nu = A.nu, cost = G.kind === "cost";
    if (!nu) { $("gtc-rounds").innerHTML = "<li>" + esc(T("gtc.ln.none")) + "</li>"; $("gtc-sorted").innerHTML = ""; $("gtc-nucnote").innerHTML = ""; return; }

    }).join("") + "<li>" + T(cost ? "gtc.ln.final.c" : "gtc.ln.final.p", { x: triD(show(G, nu.x)), l: num(nu.lps, 0) }) + "</li>";
    var e = epsNow(), inp = $("gtc-eps");

    var cols = [{ id: "nuc", x: nu.x }, { id: "shap", x: A.sh.x }];

    cols.push({ id: pr.id, x: pr.x });
    var lists = cols.map(function (c) { return TU.sortedExcess(G, c.x); }), rows = Math.min(lists[0].length, A.n === 3 ? 6 : 10);
    var h = ['<thead><tr><th class="num">#</th>' + cols.map(function (c) { return "<th>" + esc(ruleName(c.id)) + "</th>"; }).join("") + "</tr></thead><tbody>"];
    for (var k = 0; k < rows; k++) {

  }

  /* ---------- lens: rules (board of rules by properties) ---------- */
  function ruleOn(id, G, pl) {
    switch (id) {
      case "eq": return TU.rEqual(G);
      case "prop": return TU.rProp(G);
      case "scrb": return TU.rSCRB(G);
      case "shap": return TU.shapley(G).x;
      case "nuc": var nu = TU.nucleolus(G); return nu ? nu.x : null;
    }
    var o = ownRules(G, pl).filter(function (r) { return r.id === id; })[0];
    return o ? o.x : null;
  }
  function perturbed(G, m, d) {
    if (G.kind === "cost") { var c = G.c.slice(); c[m] -= d; return TU.fromCost(G.n, c); }
    var v = G.v.slice(); v[m] += d; return TU.fromProfit(G.n, v);
  }
  // coalitional monotonicity: when one coalition's cost falls (or its worth rises), none of its members is worse off
  function coalMono(r) {
    var G = A.G, d = 0.01 * Math.max(1, Math.abs(G.v[G.N]), G.kind === "cost" ? Math.abs(G.c[G.N]) : 0), tol = 1e-6 * G.scale;
    var base = show(G, r.x);
    for (var m = 1; m <= G.N; m++) {
      var G2 = perturbed(G, m, d), x2 = ruleOn(r.id, G2, null);
      if (!x2) continue;
      var y2 = show(G2, x2), ids = TU.mem(m, G.n);
      for (var q = 0; q < ids.length; q++) {
        var i = ids[q], worse = G.kind === "cost" ? y2[i] > base[i] + tol : y2[i] < base[i] - tol;
        if (worse) return { ok: false, m: m, i: i };
      }
    }
    return { ok: true };
  }
  // population monotonicity: as the group grows, no member is worse off (checked on every smaller group of two or more)
  function popMono(r) {
    var G = A.G, tol = 1e-6 * G.scale, alloc = {};
    var get = function (S) {
      if (S === G.N) return show(G, r.x);
      if (alloc[S]) return alloc[S];
      var ids = TU.mem(S, G.n), Gs = r.tu ? TU.restrict(G, S) : make(ids), x = ruleOn(r.id, Gs, ids);
      var full = []; if (x) { var y = show(Gs, x); ids.forEach(function (i, j) { full[i] = y[j]; }); }
      alloc[S] = x ? full : null; return alloc[S];
    };
    for (var T2 = 1; T2 <= G.N; T2++) {
      if (TU.pc(T2) < 3) continue;
      for (var S = (T2 - 1) & T2; S > 0; S = (S - 1) & T2) {
        if (TU.pc(S) < 2) continue;
        var a = get(S), b = get(T2);
        if (!a || !b) continue;
        var ids = TU.mem(S, G.n);
        for (var q = 0; q < ids.length; q++) {
          var i = ids[q], worse = G.kind === "cost" ? b[i] > a[i] + tol : b[i] < a[i] - tol;
          if (worse) return { ok: false, S: S, T: T2, i: i };
        }
      }
    }
    return { ok: true };
  }
  var CNT = { eq: function () { return 1; }, prop: function (n) { return n + 1; }, propc: function () { return 0; }, scrb: function (n) { return 2 * n + 1; },
    shap: function (n) { return (1 << n) - 1; }, nuc: function (n) { return (1 << n) - 1; }, owen: function () { return 1; }, seg: function () { return 0; },
    bird: function () { return 1; }, soc: function (n) { return n + 1; }, dem: function () { return 1; }, tal: function () { return 0; }, cea: function () { return 0; }, cel: function () { return 0; } };
  function renderRules() {
    var G = A.G, n = A.n, small = n <= 4;
    if (!A.props) {
      A.props = {};
      A.rules.forEach(function (r) {
        A.props[r.id] = { core: TU.inCore(G, r.x), w: TU.worst(G, r.x),
          cm: small && r.tu ? coalMono(r) : null, pm: small && (r.tu || r.sub) && n >= 3 ? popMono(r) : null };
      });
    }
    var yes = '<span class="yes">' + esc(T("gtc.yes")) + "</span>", na = '<span class="na">' + esc(T("gtc.na")) + "</span>";
    var h = ["<thead><tr><th>" + esc(T("gtc.lr.rule")) + "</th><th>" + esc(T(G.kind === "cost" ? "gtc.lr.bills" : "gtc.lr.pay")) + "</th><th>" + esc(T("gtc.lr.core")) + "</th><th>" + esc(T("gtc.lr.cm")) + "</th><th>" + esc(T("gtc.lr.pm")) + '</th><th class="num">' + esc(T("gtc.lr.cnt")) + "</th></tr></thead><tbody>"];
    A.rules.forEach(function (r) {
      var p = A.props[r.id], tol = Math.max(G.tol, 1e-7 * G.scale);
      var core = p.core ? yes : '<span class="no">' + esc(T("gtc.lr.blocked", { s: cn(p.w.m), e: valD(p.w.e) })) + "</span>";
      var cm = p.cm == null ? na : p.cm.ok ? yes : '<span class="no">' + esc(T("gtc.lr.cmno", { s: cn(p.cm.m), i: A.names[p.cm.i] })) + "</span>";
      var pm = p.pm == null ? na : p.pm.ok ? yes : '<span class="no">' + esc(T("gtc.lr.pmno", { s: cn(p.pm.S), t: cn(p.pm.T), i: A.names[p.pm.i] })) + "</span>";
      h.push("<tr" + (r.id === WB.test ? ' class="sel"' : "") + "><td>" + esc(ruleName(r.id)) + "</td><td>" + triD(show(G, r.x)) + "</td><td>" + core + "</td><td>" + cm + "</td><td>" + pm + '</td><td class="num">' + num(CNT[r.id](n), 0) + "</td></tr>");
    });
    $("gtc-board").innerHTML = h.join("") + "</tbody>";
    var stable = A.rules.filter(function (r) { return A.props[r.id].core; }).map(function (r) { return ruleName(r.id); });
    $("gtc-young").innerHTML = (small ? "" : T("gtc.lr.big", { n: n }) + " ") + T("gtc.lr.young", { k: stable.length, t: A.rules.length });
  }

        h.push("<tr" + (m === G.N ? ' class="grand"' : "") + "><td>" + cname(m) + '</td><td class="num">' + num(p.lam, 1) + '</td><td class="num">' + num(p.s, 0) + '</td><td class="num">' + T("gtc.pct", { v: fmt(100 * p.B, 2) }) + '</td><td class="num">' + valD(G.c[m]) + "</td></tr>");
      }
    }
    $("gtc-pooltab").innerHTML = h.join("") + "</tbody>";
  }

  /* ---------- the optimization strips ---------- */
  function texVars(m, n, nm) { return TU.mem(m, n).map(function (i) { return "x_{" + texText(nm[i]) + "}"; }).join(" + "); }
  // on narrow screens the formulas drop their comment column, so they stay readable without scrolling
  var narrowTex = false;
  function cmt(key, vars) { return narrowTex ? "" : texText(T(key, vars)); }
  function setNarrow() { narrowTex = ($("gtc-s1").clientWidth || 800) < 560; }
  function renderStrip1() {
    setNarrow();
    var S = scen(ast.sc), G = S.G, cl = S.cl, L1 = [];
    L1.push("z^* = \\min\\;& x_{A} + x_{B} + x_{C} && " + cmt("gtc.s1.obj"));
    [3, 5, 6].forEach(function (m, k) {
      L1.push((k ? "& " : "\\text{ST}\\;& ") + texVars(m, 3, N3) + " \\ge " + texNum(G.v[m]) + " && \\lambda_{" + cname(m) + "} = " + texNum(cl.lam[m], 3));
    });
    L1.push("& x_{A},\\ x_{B},\\ x_{C} \\ge 0 &&");
    L1.push("& z^* = " + texNum(cl.z) + (cl.nonempty ? " \\le " : " > ") + "v(N) = " + texNum(G.v[7]) + " && " + cmt(cl.nonempty ? "gtc.s1.ok" : "gtc.s1.bad"));
    TeX.set($("gtc-s1"), "\\begin{aligned}" + L1.join(" \\\\ ") + "\\end{aligned}", T("gtc.s1.formula", { z: num(cl.z), v: num(G.v[7]) }));
    $("gtc-s1-note").innerHTML = T("gtc.s1.note", { ab: num(G.v[3]), ac: num(G.v[5]), bc: num(G.v[6]), z: num(cl.z), v: num(G.v[7]), s: num(G.v[7] - cl.z) });
  }
  function renderStrip2() {
    var G = A.G, n = A.n, nm = A.names, el = $("gtc-s2"), note = $("gtc-s2-note"), L2 = [];
    if (WB.lens === "core") {
      var cl = A.cl;
      L2.push("z^* = \\min\\;& \\textstyle\\sum_{i} x_i && " + cmt("gtc.s2.core.obj"));
      if (n === 3) {
        [3, 5, 6].forEach(function (m, k) {
          L2.push((k ? "& " : "\\text{ST}\\;& ") + texVars(m, 3, nm) + " \\ge " + texNum(G.v[m]) + " && \\lambda_{" + texText(cn(m)) + "} = " + texNum(cl.lam[m], 3));
        });
        L2.push("& " + [0, 1, 2].map(function (i) { return "x_{" + texText(nm[i]) + "} \\ge " + texNum(G.vi[i]); }).join(",\\ ") + " &&");
      } else {
        L2.push("\\text{ST}\\;& x(S) \\ge v(S) && " + cmt("gtc.s2.core.rows", { k: G.N - 1 }));
      }
      L2.push("& z^* = " + texNum(cl.z) + (cl.nonempty ? " \\le " : " > ") + "v(N) = " + texNum(G.v[G.N]) + " && " + cmt(cl.nonempty ? "gtc.s1.ok" : "gtc.s1.bad"));
      TeX.set(el, "\\begin{aligned}" + L2.join(" \\\\ ") + "\\end{aligned}", T("gtc.s1.formula", { z: num(cl.z), v: num(G.v[G.N]) }));
      note.innerHTML = T("gtc.s2.core.note");
    } else if (WB.lens === "shap") {
      var f = Math.min(WB.firm, n - 1), bit = 1 << f, cost = G.kind === "cost", terms = [], tot = 0, sym = cost ? "c" : "v";
      for (var S = 0; S <= G.N; S++) {
        if (S & bit) continue;
        var s = TU.pc(S), w = TU.FACT[s] * TU.FACT[n - s - 1] / TU.FACT[n], mc = cost ? G.c[S | bit] - (S ? G.c[S] : 0) : G.v[S | bit] - G.v[S];
        tot += w * mc;
        if (n <= 3) { var nu0 = Math.round(w * TU.FACT[n]), de = TU.FACT[n], g0 = gcd(nu0, de); terms.push("\\tfrac{" + nu0 / g0 + "}{" + de / g0 + "}\\," + texNum(mc)); }
      }
      var lhs = (cost ? "\\text{bill}" : "\\varphi") + "_{" + texText(nm[f]) + "}";
      L2.push(lhs + " &= \\sum_{S \\subseteq N \\setminus \\{" + texText(nm[f]) + "\\}} \\frac{|S|!\\,(n-|S|-1)!}{n!}\\,\\big[" + sym + "(S \\cup \\{" + texText(nm[f]) + "\\}) - " + sym + "(S)\\big]");
      if (terms.length) L2.push("&= " + terms.join(" + ") + " = " + texNum(tot));
      else L2.push("&= " + texNum(tot));
      TeX.set(el, "\\begin{aligned}" + L2.join(" \\\\ ") + "\\end{aligned}", T("gtc.s2.shap.formula", { f: nm[f], v: num(tot) }));
      note.innerHTML = T("gtc.s2.shap.note");
    } else if (WB.lens === "nuc" && A.nu) {
      var R = A.nu.rounds, last = R.length;
      L2.push("\\varepsilon_k = \\min\\;& \\varepsilon && " + cmt("gtc.s2.nuc.obj"));
      L2.push("\\text{ST}\\;& x(S) + \\varepsilon \\ge v(S) && " + cmt("gtc.s2.nuc.free"));
      L2.push("& x(S) + \\varepsilon_j = v(S) && " + cmt("gtc.s2.nuc.fixed"));
      L2.push("& x(N) = v(N),\\quad x_i \\ge v(i) &&");
      L2.push("& " + R.map(function (r, k) { return "\\varepsilon_{" + (k + 1) + "} = " + texNum(r.eps); }).join(",\\ ") + " && " + cmt("gtc.s2.nuc.lps", { l: A.nu.lps }));
      TeX.set(el, "\\begin{aligned}" + L2.join(" \\\\ ") + "\\end{aligned}", T("gtc.s2.nuc.formula", { e: joinL(R.map(function (r) { return num(r.eps); })) }));
      note.innerHTML = T("gtc.s2.nuc.note", { k: last });
    } else {
      var cost2 = G.kind === "cost", vN = G.v[G.N], Ms = [], rs = [];
      for (var i = 0; i < n; i++) { Ms.push(vN - G.v[G.N & ~(1 << i)]); rs.push(Ms[i] - G.vi[i]); }
      var x = TU.rSCRB(G);
      if (n <= 4) {
        L2.push("x_i &= v(i) + \\frac{M_i - v(i)}{\\sum_j \\big(M_j - v(j)\\big)}\\Big(v(N) - \\sum_j v(j)\\Big), \\quad M_i = v(N) - v(N \\setminus i)");
        L2.push("M &= (" + Ms.map(function (v) { return texNum(v); }).join(",\\ ") + "), \\quad x = (" + x.map(function (v) { return texNum(v); }).join(",\\ ") + ")");
      } else L2.push("x_i &= v(i) + \\frac{M_i - v(i)}{\\sum_j (M_j - v(j))}\\Big(v(N) - \\sum_j v(j)\\Big)");
      TeX.set(el, "\\begin{aligned}" + L2.join(" \\\\ ") + "\\end{aligned}", T("gtc.s2.rules.formula", { x: triD(x) }));
      note.innerHTML = T(cost2 ? "gtc.s2.rules.note.c" : "gtc.s2.rules.note.p", { b: triD(show(G, x)) });
    }
  }

  /* =====================================================================================
     Wiring: one refresh recomputes the game and every view of it
     ===================================================================================== */
  function renderLens() {
    if (WB.lens === "core") renderCoreLens();
    else if (WB.lens === "shap") renderShapLens();
    else if (WB.lens === "nuc") renderNucLens();
    else renderRules();
  }
  function renderViews() {
    ["core", "shap", "nuc", "rules"].forEach(function (k) { $("gtc-l-" + k).hidden = k !== WB.lens; });
    renderTestSelect(); renderTri(); renderCoal(); renderLens(); renderStrip2();
  }
  function refresh() {
    A = analyze();
    ["dc", "ws", "maj", "glv", "air", "bk", "net", "pool"].forEach(function (k) { $("gtc-p-" + k).hidden = k !== WB.ds; });
    if (WB.ds === "dc") { syncDcInputs(); renderRegime(); }
    if (WB.ds === "ws") renderWs();
    if (WB.ds === "maj") renderMaj();
    if (WB.ds === "bk") { syncBk(); renderPaths(); }
    if (WB.ds === "net") renderNet();
    if (WB.ds === "pool") renderPoolTab();
    renderStory(); renderKpis();
    renderViews();
  }
  function renderSplit() {
    renderTri(); renderCoal();
    if (WB.lens === "rules") renderRules();
  }
  function pressSeg(box, val) { box.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-v") === String(val))); }); }

  $("gtc-ds").addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    WB.ds = b.getAttribute("data-v"); WB.user = null; WB.test = "nuc"; WB.epsU = null; WB.firm = 0;
    pressSeg($("gtc-ds"), WB.ds); refresh();
  });
  $("gtc-lens").addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    WB.lens = b.getAttribute("data-v"); pressSeg($("gtc-lens"), WB.lens); renderViews();
  });
  $("gtc-test").addEventListener("change", function () {
    WB.test = this.value;
    if (WB.test === "user" && !WB.user) WB.user = (A.nu ? A.nu.x : A.sh.x).slice();
    renderSplit();
  });
  $("gtc-dc-ab").addEventListener("input", function () { WB.dc[3] = +this.value; refresh(); });
  $("gtc-dc-pre").addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    var v = b.getAttribute("data-v");
    if (v === "reset") WB.dc = DC0.slice(); else WB.dc[3] = +v;
    WB.user = null; if (WB.test === "user") WB.test = "nuc";
    refresh();
  });
  $("gtc-cap").addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    WB.ws.cap = +b.getAttribute("data-v"); pressSeg($("gtc-cap"), WB.ws.cap); refresh();
  });
  $("gtc-ws-reset").addEventListener("click", function () {
    WB.ws.own = OWN0.map(function (r) { return r.slice(); }); WB.ws.cap = 40; pressSeg($("gtc-cap"), 40); refresh();
  });
  $("gtc-maj").addEventListener("input", function () { WB.maj = +this.value; refresh(); });
  $("gtc-gl").addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    WB.glv.L = +b.getAttribute("data-v"); pressSeg($("gtc-gl"), WB.glv.L); WB.user = null; WB.test = "nuc"; WB.epsU = null; WB.firm = 0; refresh();
  });
  $("gtc-gr").addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    WB.glv.R = +b.getAttribute("data-v"); pressSeg($("gtc-gr"), WB.glv.R); WB.user = null; WB.test = "nuc"; WB.epsU = null; WB.firm = 0; refresh();
  });
  $("gtc-bk-pre").addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    var v = b.getAttribute("data-v");
    WB.bk.d = BK0.slice(); WB.bk.E = v === "reset" ? 200 : +v; WB.user = null; if (WB.test === "user") WB.test = "nuc";
    refresh();
  });
  $("gtc-net-reset").addEventListener("click", function () { WB.net.pos = null; WB.net.moved = [false, false, false]; refresh(); });
  $("gtc-pm").addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    WB.pool.mode = b.getAttribute("data-v"); pressSeg($("gtc-pm"), WB.pool.mode); WB.user = null; WB.test = "nuc"; buildPool(); refresh();
  });
  $("gtc-eps").addEventListener("input", function () { WB.epsU = +this.value / 1000; renderTri(); renderNucLens(); });
  $("gtc-sf").addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    WB.firm = +b.getAttribute("data-v"); renderShapLens(); renderStrip2();
  });

  /* ---------- texts with live numbers ---------- */
  function renderTexts() {
    var S = scen("mid"), G = S.G, pw = priceWars();
    $("gtc-lede").innerHTML = T("gtc.lede", { s: num(G.v[7], 0) });
    $("gtc-what-pw").innerHTML = T("gtc.what.p2", { c: fmt(pw.cour, 0), m: fmt(pw.mono, 0), g: fmt(pw.gain, 1), a: fmt(PW.a, 0), b: fmt(PW.b, 0), cc: fmt(PW.c, 0) });
    var t = { a: num(DC0[1], 0), b: num(DC0[2], 0), c: num(DC0[4], 0), ac: num(DC0[5], 0), bc: num(DC0[6], 0), n: num(DC0[7], 0), s: num(G.v[7], 0) };
    $("gtc-anim-intro").innerHTML = T("gtc.anim.intro", t);
    $("gtc-dc-intro").innerHTML = T("gtc.dc.intro", t);
    var gp = GEN.GP;
    $("gtc-ws-intro").innerHTML = T("gtc.ws.intro", { p1: fmt(gp.p[0], 0), p2: fmt(gp.p[1], 0), f1: fmt(gp.A[0][0], 0), f2: fmt(gp.A[0][1], 0), c1: fmt(gp.A[1][0], 0), c2: fmt(gp.A[1][1], 0) });
    $("gtc-maj-intro").innerHTML = T("gtc.maj.intro", { a: num(60, 0), n: num(110, 0) });
    $("gtc-net-intro").innerHTML = T("gtc.net.intro");
    document.querySelectorAll("#gtc-seg button").forEach(function (b) { b.textContent = T("gtc.sc." + b.getAttribute("data-sc"), { v: fmt(SCV[b.getAttribute("data-sc")], 0) }); });
  }
  function renderStatus() {
    var S = scen(ast.sc), G = S.G, R = S.nu.rounds;
    var v = { c: num(S.cab, 0), shape: shapeName(S.core), k: S.nIn, x: tri(S.bill(S.sh.x)), y: tri(S.bill(S.nu.x)), r: R.length, s: cname(S.shW.m),
      rr: T(R.length === 1 ? "gtc.rounds.1" : "gtc.rounds.n", { r: R.length }) };
    $("gtc-status").innerHTML = T(S.shIn ? "gtc.st.in" : "gtc.st.out", v);
    stage.setAttribute("aria-label", T("gtc.anim.aria") + " " + T("gtc.anim.aria.nums", v));
  }
  function renderModel() {
    $("gtc-mdata").innerHTML = T("gtc.m.cls.data", { r: tri(AIR0, 0), d: tri(BK0, 0),
      T: fmt(SP.T, 2), h: fmt(SP.h, 0), p: fmt(SP.p, 0) });
  }
  function renderNotes() {
    var M = scen("mid"), W = scen("weak"), St = scen("strong"), G = M.G;
    var eq = M.bill(TU.rEqual(G)), pr = M.bill(TU.rProp(G)), sc = M.bill(TU.rSCRB(G));
    $("gtc-n1").innerHTML = T("gtc.n.p1", { e: num(eq[0]), eab: num(eq[0] + eq[1]), c: num(G.c[3], 0), ge: num(eq[0] + eq[1] - G.c[3]), p: tri(pr), pab: num(pr[0] + pr[1]), gp: num(pr[0] + pr[1] - G.c[3]), s: tri(sc) });
    var Gm = GEN.majGame(70), cm = TU.coreLP(Gm), nm = TU.nucleolus(Gm);
    $("gtc-n2").innerHTML = T("gtc.n.p2", { z: num(M.cl.z), v: num(G.v[7], 0), zm: num(cm.z), vm: num(Gm.v[7], 0), g: num(cm.gap), l: num(nm.least), lam: fr(cm.lam[3]) });
    var bills = St.bill(St.sh.x), w = St.shW, pay = 0; TU.mem(w.m, 3).forEach(function (i) { pay += bills[i]; });
    $("gtc-n3").innerHTML = T("gtc.n.p3", { kw: W.nIn, km: M.nIn, x: tri(M.bill(M.sh.x)), xs: tri(bills), s: cname(w.m), p: num(pay), c: num(St.c[w.m], 0), cw: num(W.cab, 0), cm: num(M.cab, 0), cs: num(St.cab, 0),
      ins: M.orders.filter(function (o) { return o.inCore; }).map(function (o) { return o.perm.map(function (i) { return N3[i]; }).join(""); }).join(T("gtc.sep")) });
    $("gtc-n4").innerHTML = T("gtc.n.p4", { e: num(M.nu.rounds[0].eps), x: tri(M.bill(M.nu.x)), e1: num(St.nu.rounds[0].eps), e2: num(St.nu.rounds[1].eps), y: tri(St.bill(St.nu.x)), cm: num(M.cab, 0), cs: num(St.cab, 0) });
    var Gw = GEN.wsGame(OWN0), y = Gw.plans[7].y, sh = TU.shapley(Gw).x, nu = TU.nucleolus(Gw).x, core = TU.core(Gw);
    var own10 = OWN0.map(function (r) { return [r[0], r[1], r[2] / 4]; }), G10 = GEN.wsGame(own10), y10 = G10.plans[7].y;
    var lo = Math.min(core[0][0], core[core.length - 1][0]), hi = Math.max(core[0][0], core[core.length - 1][0]);
    $("gtc-n5").innerHTML = T("gtc.n.p5", { v: tri([1, 2, 4, 3, 5, 6, 7].map(function (m) { return Gw.v[m]; }), 0), y: tri(y, 0), o: tri(Gw.owen), x3: num(core[0][2], 0), lo: num(lo, 0), hi: num(hi, 0),
      s: tri(sh), ab: num(sh[0] + sh[1]), vab: num(Gw.v[3], 0), n: tri(nu), y10: tri(y10, 0), o10: tri(G10.owen) });
    var gl = GEN.gloveGame([true, false, false], [0, 1, 2]), gsh = TU.shapley(gl).x, gnu = TU.nucleolus(gl).x;
    var air = GEN.airGame(AIR0), ash = TU.shapley(air).x, anu = TU.nucleolus(air);
    var bk = GEN.bkGame(BK0, 200), bsh = TU.shapley(bk).x, bnu = TU.nucleolus(bk).x, tal = GEN.talmud(BK0, 200);
    var net = GEN.netGame(NET0), nsh = TU.shapley(net).x, nnu = TU.nucleolus(net).x;
    var bill = function (Gx, x) { return x.map(function (v, i) { return Gx.c[1 << i] - v; }); };
    $("gtc-n6").innerHTML = T("gtc.n.p6", { gc: tri(gnu, 0), gs: tri(gsh, 3), as: tri(air.segment), an: tri(bill(air, anu.x)), ae: joinL(anu.rounds.map(function (r) { return num(r.eps); })),
      bt: tri(tal), bn: tri(bnu), bs: tri(bsh), nb: tri(net.bird, 0), ns: tri(bill(net, nsh), 0), nn: tri(bill(net, nnu), 0) });
    var sp = GEN.spareGame([1, 2, 4], SP), ssh = TU.shapley(sp).x, snu = TU.nucleolus(sp).x, cv = TU.convex(sp), ssh2 = TU.shapley(sp);
    var outC = ssh2.orders.filter(function (o) { return !TU.inCore(sp, o.m); }).map(function (o) { return o.perm.map(function (i) { return N3[i]; }).join(""); });
    var dem = TU.rDriver(sp, [1, 2, 4]);
    $("gtc-n7").innerHTML = T("gtc.n.p7", { s1: sp.pool[1].s, s2: sp.pool[2].s, s3: sp.pool[4].s, sn: sp.pool[7].s, a: num(sp.c[1] + sp.c[2] + sp.c[4]), n: num(sp.c[7]),
      sh: tri(bill(sp, ssh)), nu: tri(bill(sp, snu)), d: tri(bill(sp, dem)), l: num(cv.lhs), r: num(cv.rhs), S: cname(cv.S), Tt: cname(cv.T), U: cname(cv.S | cv.T), I: cname(cv.S & cv.T), out: joinL(outC) });
  }

  // the scenario control of the animation
  var segBtns = document.querySelectorAll("#gtc-seg button");
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      if (ast.sc === b.getAttribute("data-sc")) return;
      ast.sc = b.getAttribute("data-sc");
      segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      hudKey = "";
      renderStatus(); renderStrip1();
      if (AN.reducedMotion) { player.seek(DUR); return; }
      if (player.time < CH[1]) player.refresh();
      else { player.seek(CH[1] + 0.001); player.play(); }
    });
  });

  function renderPage() {
    renderTexts(); renderStatus(); renderStrip1(); renderModel(); renderNotes();
    buildDcInputs(); buildWs(); buildAir(); buildBk(); buildPool();
    refresh();
    hudKey = "";
    player.refresh();
  }
  var rsz = 0, lastW = window.innerWidth;
  window.addEventListener("resize", function () {
    clearTimeout(rsz);
    rsz = setTimeout(function () {
      if (A && window.innerWidth !== lastW) {
        lastW = window.innerWidth; renderTri();
        var was = narrowTex; setNarrow();
        if (was !== narrowTex) { renderStrip1(); renderStrip2(); }
        if (WB.ds === "dc") renderRegime();
      }
    }, 120);
  });
  I18N.onChange(renderPage);
})();
</script>
