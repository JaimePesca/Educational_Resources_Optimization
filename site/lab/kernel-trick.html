<script>
(function () {
  "use strict";
  var T = I18N.t;
  var MINUS = "−";
  var fmt = function (v, d) { d = d == null ? 2 : d; if (Math.abs(v) < 0.5 * Math.pow(10, -d)) v = 0; return I18N.fmt(v, d, d); };
  var num = function (v, d) { var m = fmt(Math.abs(v), d); return m === fmt(0, d) ? m : (v < 0 ? MINUS : "") + m; };
  var texNum = function (v, d) { var m = fmt(Math.abs(v), d); return m === fmt(0, d) ? m : (v < 0 ? "-" : "") + m; };
  var intFmt = function (v) { return I18N.fmt(v, 0, 0); };
  var gFmt = function (g) { return I18N.fmt(g, 2, 0); };
  var pct = function (v) { return T("kern.pct", { v: I18N.fmt(100 * v, 1, 1) }); };

  /* =====================================================================================
     The data: coffee lots at the end of drying, two traits: moisture (% wet basis) and grain
     temperature (°C). A lot is good when it sits near an ideal point. Illustrative, drawn with
     Anim.rng: good lots uniformly inside the ideal ellipse, bad lots in a ring around it, more of
     them on the wet and hot side, and a few labels flipped near the edge (graders disagree there).
     ===================================================================================== */
  var SEED = 3, TSEED = 1003, NTR = 72, NTE = 80, CPEN = 1;
  var IDEAL = [11.0, 40.0], SPREAD = [1.8, 5.0];
  var BAD = { r0: 1.08, dr: 1.25, th0: 0.6, span: 0.8 }, FLIP = { band: 0.28, p: 0.3 };
  function gen(seed, n) {
    var r = Anim.rng(seed), X = [], Y = [];
    for (var i = 0; i < n; i++) {
      var good = i % 2 === 0, rad, ang;
      if (good) { rad = Math.sqrt(r()); ang = 2 * Math.PI * r(); }
      else { rad = BAD.r0 + BAD.dr * r(); ang = BAD.th0 + (r() - 0.5) * 2 * Math.PI * BAD.span; }
      var y = good ? 1 : -1;
      if (Math.abs(rad - 1) < FLIP.band && r() < FLIP.p) y = -y;
      X.push([Math.round((IDEAL[0] + SPREAD[0] * rad * Math.cos(ang)) * 10) / 10, Math.round((IDEAL[1] + SPREAD[1] * rad * Math.sin(ang)) * 10) / 10]);
      Y.push(y);
    }
    return { X: X, Y: Y };
  }
  var TR = gen(SEED, NTR), TE = gen(TSEED, NTE), Y = TR.Y, YT = TE.Y, N = NTR;
  // standardized with the mean and standard deviation of the training lots
  var MU = [0, 0], SD = [0, 0];
  TR.X.forEach(function (p) { MU[0] += p[0] / N; MU[1] += p[1] / N; });
  TR.X.forEach(function (p) { SD[0] += (p[0] - MU[0]) * (p[0] - MU[0]) / N; SD[1] += (p[1] - MU[1]) * (p[1] - MU[1]) / N; });
  SD = [Math.sqrt(SD[0]), Math.sqrt(SD[1])];
  var scale = function (p) { return [(p[0] - MU[0]) / SD[0], (p[1] - MU[1]) / SD[1]]; };
  var Z = TR.X.map(scale), ZT = TE.X.map(scale);
  var R2 = Z.map(function (p) { return p[0] * p[0] + p[1] * p[1]; });
  var NGOOD = Y.filter(function (y) { return y > 0; }).length, NGOODT = YT.filter(function (y) { return y > 0; }).length;

  /* ---------- kernels ---------- */
  var KER = {
    lin: function (a, b) { return a[0] * b[0] + a[1] * b[1]; },
    lift: function (a, b) { return a[0] * b[0] + a[1] * b[1] + (a[0] * a[0] + a[1] * a[1]) * (b[0] * b[0] + b[1] * b[1]); },
    poly: function (a, b) { var d = 1 + a[0] * b[0] + a[1] * b[1]; return d * d; },
    rbf: function (g) { return function (a, b) { var dx = a[0] - b[0], dy = a[1] - b[1]; return Math.exp(-g * (dx * dx + dy * dy)); }; }
  };
  function gram(k) {
    var K = [];
    for (var i = 0; i < N; i++) { K.push(new Float64Array(N)); for (var j = 0; j < N; j++) K[i][j] = k(Z[i], Z[j]); }
    return K;
  }

  /* ---------- the dual QP, solved by SMO (Platt 1998) with the second order working set selection of
     Fan, Chen and Lin (2005): deterministic pair choice, closed form step, KKT gap below EPS ---------- */
  var EPS = 1e-10;
  function smo(K, C) {
    var n = N, i, j, t, Q = [];
    for (i = 0; i < n; i++) { Q.push(new Float64Array(n)); for (j = 0; j < n; j++) Q[i][j] = Y[i] * Y[j] * K[i][j]; }
    var al = new Float64Array(n), G = new Float64Array(n).fill(-1), it = 0, TINY = 1e-12, gmax = 0, gmin = 0;
    var up = function (t) { return (Y[t] > 0 && al[t] < C) || (Y[t] < 0 && al[t] > 0); };
    var low = function (t) { return (Y[t] < 0 && al[t] < C) || (Y[t] > 0 && al[t] > 0); };
    for (; it < 500000; it++) {
      var ii = -1, jj = -1, obmin = Infinity;
      gmax = -Infinity; gmin = Infinity;
      for (t = 0; t < n; t++) if (up(t) && -Y[t] * G[t] >= gmax) { gmax = -Y[t] * G[t]; ii = t; }
      for (t = 0; t < n; t++) if (low(t)) {
        var v = -Y[t] * G[t];
        if (v < gmin) gmin = v;
        var bb = gmax - v;
        if (bb > 0) {
          var aa = Q[ii][ii] + Q[t][t] - 2 * Y[ii] * Y[t] * Q[ii][t];
          if (aa <= 0) aa = TINY;
          if (-(bb * bb) / aa <= obmin) { jj = t; obmin = -(bb * bb) / aa; }
        }
      }
      if (gmax - gmin < EPS || jj < 0) break;
      i = ii; j = jj;
      var oi = al[i], oj = al[j], quad, delta, diff, sum;
      if (Y[i] !== Y[j]) {
        quad = Q[i][i] + Q[j][j] + 2 * Q[i][j]; if (quad <= 0) quad = TINY;
        delta = (-G[i] - G[j]) / quad; diff = al[i] - al[j];
        al[i] += delta; al[j] += delta;
        if (diff > 0) { if (al[j] < 0) { al[j] = 0; al[i] = diff; } } else if (al[i] < 0) { al[i] = 0; al[j] = -diff; }
        if (diff > 0) { if (al[i] > C) { al[i] = C; al[j] = C - diff; } } else if (al[j] > C) { al[j] = C; al[i] = C + diff; }
      } else {
        quad = Q[i][i] + Q[j][j] - 2 * Q[i][j]; if (quad <= 0) quad = TINY;
        delta = (G[i] - G[j]) / quad; sum = al[i] + al[j];
        al[i] -= delta; al[j] += delta;
        if (sum > C) { if (al[i] > C) { al[i] = C; al[j] = sum - C; } } else if (al[j] < 0) { al[j] = 0; al[i] = sum; }
        if (sum > C) { if (al[j] > C) { al[j] = C; al[i] = sum - C; } } else if (al[i] < 0) { al[i] = 0; al[j] = sum; }
      }
      var di = al[i] - oi, dj = al[j] - oj;
      for (t = 0; t < n; t++) G[t] += Q[t][i] * di + Q[t][j] * dj;
    }
    // b from the free support vectors (0 < alpha < C), else the middle of its feasible interval
    var nf = 0, sf = 0, ub = Infinity, lb = -Infinity;
    for (t = 0; t < n; t++) {
      var yg = Y[t] * G[t];
      if (al[t] > 0 && al[t] < C) { nf++; sf += yg; }
      else if ((al[t] >= C && Y[t] < 0) || (al[t] <= 0 && Y[t] > 0)) ub = Math.min(ub, yg);
      else lb = Math.max(lb, yg);

      else { player.seek(CH[5] + 0.001); player.play(); }
    });
  });

  function renderPage() {
    renderSeg(); renderScenText(); renderData(); renderSolution(); renderCheck(); renderCompare(); renderNotes();
    hudKey = "";
    player.refresh();
  }
  I18N.onChange(renderPage);
})();
</script>
