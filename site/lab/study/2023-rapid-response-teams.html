<script>
(function () {
  "use strict";
  var t = I18N.t;

  /* ---- the Stackelberg protection location game of the article, solved live (no hard-coded results) ----
     Positions on [0, 1], speed v = 1, damage rate f continuous and piecewise linear (knots xs, values ys). */
  // RR-START
  var RR = (function () {
    function make(xs, ys) { return { xs: xs.slice(), ys: ys.slice() }; }
    function at(F, a) {
      var xs = F.xs, ys = F.ys, k = 1;
      if (a <= 0) return ys[0];
      if (a >= 1) return ys[ys.length - 1];
      while (k < xs.length - 1 && xs[k] < a) k++;
      return ys[k - 1] + (ys[k] - ys[k - 1]) * (a - xs[k - 1]) / (xs[k] - xs[k - 1]);
    }
    // max over a in [lo, hi] of f(a) * s * (a - t): f is linear between knots, so on every piece the objective is a
    // quadratic in a and its maximum is at an end of the piece or at the vertex of the parabola
    function maxOn(F, lo, hi, t, s) {
      var best = { v: 0, a: s > 0 ? lo : hi };
      if (!(hi > lo)) return best;
      var xs = F.xs, p = lo, k = 0;
      while (k < xs.length && xs[k] <= lo) k++;
      while (p < hi) {
        var q = k < xs.length && xs[k] < hi ? xs[k] : hi;
        var fp = at(F, p), fq = at(F, q), al = (fq - fp) / (q - p), be = fp - al * p;
        var cand = [p, q];
        if (al !== 0) { var vx = (al * t - be) / (2 * al); if (vx > p && vx < q) cand.push(vx); }
        for (var c = 0; c < cand.length; c++) {
          var a = cand[c], v = (al * a + be) * s * (a - t);
          if (v > best.v + 1e-15) best = { v: v, a: a };
        }
        p = q; k++;
      }
      return best;
    }
    // the local damage problems of Section 4.1: left of team 1, between two teams (the nearer one responds), right of team n
    function L(F, d1) { return maxOn(F, 0, d1, d1, -1); }
    function R(F, dn) { return maxOn(F, dn, 1, dn, 1); }
    function I(F, di, dj) {
      if (!(dj > di)) return { v: 0, a: di };
      var m = (di + dj) / 2, x = maxOn(F, di, m, di, 1), y = maxOn(F, m, dj, dj, -1);
      return y.v > x.v + 1e-15 ? y : x;
    }
    // the n + 1 local damages of a plan; their maximum is the follower's best response, eq. (2)
    function locals(F, d) {
      var n = d.length, out = [], l = L(F, d[0]), r = R(F, d[n - 1]);
      out.push({ v: l.v, a: l.a, lo: 0, hi: d[0] });
      for (var i = 0; i < n - 1; i++) { var b = I(F, d[i], d[i + 1]); out.push({ v: b.v, a: b.a, lo: d[i], hi: d[i + 1] }); }
      out.push({ v: r.v, a: r.a, lo: d[n - 1], hi: 1 });
      return out;
    }
    function damage(F, d, a) {
      var m = Infinity;
      for (var i = 0; i < d.length; i++) m = Math.min(m, Math.abs(d[i] - a));
      return at(F, a) * m;
    }
    // largest y in [lo, cap] with g(y) <= z, for g non-decreasing and continuous with g(lo) <= z
    function largestLE(g, lo, cap, z) {
      if (g(cap) <= z) return cap;
      var a = lo, b = cap;
      for (var it = 0; it < 46; it++) { var m = (a + b) / 2; if (g(m) <= z) a = m; else b = m; }
      return a;
    }
    // sweep at a target damage z: each team as far right as possible while the local damage on its left stays <= z
    // (monotone by Lemma 4.2); cap keeps the teams at or left of a point (used for L^i)
    function sweep(F, k, z, cap) {
      var d = [];
      if (k <= 0) return d;
      d.push(largestLE(function (y) { return L(F, y).v; }, 0, cap, z));
      for (var i = 1; i < k; i++) {
        var prev = d[i - 1];
        d.push(largestLE(function (y) { return I(F, prev, y).v; }, prev, cap, z));
      }
      return d;
    }
    // independent check: the least target damage z for which the sweep also keeps the right end <= z
    function optimum(F, n) {
      var hi = R(F, 0).v, lo = 0;
      if (hi <= 1e-15) return { P: 0, d: sweep(F, n, 0, 1) };
      for (var it = 0; it < 52; it++) {
        var z = (lo + hi) / 2, d = sweep(F, n, z, 1);
        if (R(F, d[n - 1]).v <= z) hi = z; else lo = z;
      }
      return { P: hi, d: sweep(F, n, hi, 1) };
    }
    // L^i(x) of eq. (5): the least damage to the left of team i at x when teams 1..i-1 are placed optimally in [0, x]
    function Li(F, i, x) {
      if (i === 1) return L(F, x).v;
      var hi = I(F, 0, x).v, lo = 0;
      if (hi <= 0) return 0;
      for (var it = 0; it < 44; it++) {
        var z = (lo + hi) / 2, d = sweep(F, i - 1, z, x);
        if (I(F, d[i - 2], x).v <= z) hi = z; else lo = z;
      }
      return hi;
    }
    // root of a non-decreasing continuous phi on [lo, hi] with phi(lo) <= 0 <= phi(hi)
    function root(phi, lo, hi) {
      var a = lo, b = hi;
      for (var it = 0; it < 40; it++) { var m = (a + b) / 2; if (phi(m) < 0) a = m; else b = m; }
      return (a + b) / 2;
    }
    // a solution of system (7), built as in the proof of Lemma 4.4: team n where L^n = R (a crossing of a non-decreasing
    // and a non-increasing function), then each earlier team where L^{i-1}(d_{i-1}) = I^{i-1}(d_{i-1}, d_i);
    // by Lemmas 4.5 and 4.6 it is optimal and balanced
    function construct(F, n) {
      var d = new Array(n);
      d[n - 1] = root(function (x) { return Li(F, n, x) - R(F, x).v; }, 0, 1);
      for (var i = n - 1; i >= 1; i--) {
        var right = d[i];
        d[i - 1] = root(function (y) { return Li(F, i, y) - I(F, y, right).v; }, 0, right);
      }
      return d;
    }
    // the longest response time to any point of the line (the p-center objective)
    function maxResp(d) {
      var m = Math.max(d[0], 1 - d[d.length - 1]);
      for (var i = 0; i < d.length - 1; i++) m = Math.max(m, (d[i + 1] - d[i]) / 2);
      return m;
    }
    // interior peaks of f: knots where f rises before and falls after
    function peaks(F) {
      var out = [];
      for (var k = 1; k < F.xs.length - 1; k++) if (F.ys[k] > F.ys[k - 1] && F.ys[k] > F.ys[k + 1]) out.push({ x: F.xs[k], y: F.ys[k] });
      return out;
    }
    return { make: make, at: at, L: L, R: R, I: I, locals: locals, damage: damage, sweep: sweep, optimum: optimum,
      Li: Li, construct: construct, maxResp: maxResp, peaks: peaks };
  })();
  // RR-END

  // ---- damage rate functions of the article (knots) and the plans it discusses ----
  var RATES = {
    uni: [[0, 1], [1, 1]],                                   // uniform, c = 1 (Theorem 5.1, Figure 5)
    lin: [[0, 0], [1, 2]],                                   // linearly increasing, c = 2 (Theorem 5.3, Figure 6)
    tri: [[0, 0], [0.5, 2], [1, 0]],                         // triangular, c = 4, beta = 1/2 (Theorem 5.6, Figure 8)
    ex6: [[0, 0], [0.25, 0.2], [0.5, 0], [0.75, 0.2], [1, 0]],                                   // Example 6
    ex5: [[0, 0], [0.05, 1], [0.1, 0], [0.4, 0], [0.45, 0.05], [0.5, 0], [0.55, 0.05], [0.6, 0], [0.9, 0], [0.95, 1], [1, 0]], // Example 5
    blv: [[0, 0], [0.1, 0.1], [0.2, 0.1], [0.3, 0.3], [0.4, 0.1], [0.5, 0.1], [0.55, 0.2], [0.6, 0.1], [0.7, 0.1],
      [0.75, 0.25], [0.8, 0.1], [0.85, 0.2], [1, 0]]                                           // boulevard, eq. (9)
  };
  var START = { uni: [2, "ex13"], lin: [2, "opt"], tri: [3, "opt"], ex6: [2, "opt"], ex5: [4, "ex5dp"], blv: [4, "crowd"], cus: [3, "opt"] };
  var CUSX = [0, 0.25, 0.5, 0.75, 1], cus = [0.2, 1, 0.1, 0.6, 1.2], NMAX = 6, NBARS = 8;
  // plans printed in the article (positions as printed; the closed forms are evaluated here)
  function articlePlans(fk, n) {
    var out = [], i, d;
    if (fk === "uni") {
      if (n === 2) { out.push({ id: "ex13", d: [0.2, 0.8] }); out.push({ id: "ex4", d: [4 / 15, 0.8] }); }
      d = []; for (i = 1; i <= n; i++) d.push((2 * i - 1) / (2 * n));
      out.push({ id: "th51", d: d, dmg: 1 / (2 * n) });
    } else if (fk === "lin") {
      d = []; for (i = 1; i <= n; i++) d.push(2 * Math.sqrt(i) * (Math.sqrt(n + 1) - Math.sqrt(n)));
      out.push({ id: "th53", d: d, dmg: 2 / Math.pow(Math.sqrt(n + 1) + Math.sqrt(n), 2) });
    } else if (fk === "tri" && n % 2 === 1) {
      var k = (n + 1) / 2, beta = 0.5;
      d = [];
      for (i = 1; i <= n; i++) {
        if (i < k) d.push(Math.sqrt(i / k) * beta);
        else if (i === k) d.push(beta);
        else d.push(1 - Math.sqrt((n + 1 - i) / (n + 1 - k)) * (1 - beta));
      }
      out.push({ id: "th56", d: d, dmg: 4 * k / (4 * (n + 1) * (n + 1)), k: k });
    } else if (fk === "ex6" && (n === 2 || n === 3)) {
      out.push({ id: "ex6", d: n === 2 ? [0.25, 0.75] : [0.25, 0.5, 0.75] });
    } else if (fk === "ex5" && n === 4) {
      out.push({ id: "ex5d", d: [0.05, 0.2, 0.8, 0.95] }); out.push({ id: "ex5dp", d: [0.05, 0.4, 0.6, 0.95] });
    } else if (fk === "blv" && n === 4) {
      out.push({ id: "s54", d: [7 / 30, 1 / 3, 3 / 5, 4 / 5] });
    }
    return out;
  }

  var st = { f: "uni", n: 2, plan: "ex13", d: [0.2, 0.8] };
  var cache = {}, pending = false, view = null;
  var $ = function (id) { return document.getElementById(id); };
  var NS = "http://www.w3.org/2000/svg";
  function svg(tag, attrs, text) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }
  function h(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  function rateKey() { return st.f === "cus" ? "cus:" + cus.join(",") : st.f; }
  function rate() {
    var k = st.f === "cus" ? CUSX.map(function (x, i) { return [x, cus[i]]; }) : RATES[st.f];
    return RR.make(k.map(function (p) { return p[0]; }), k.map(function (p) { return p[1]; }));
  }
  // the leader's optimum for the current rate and n: the construction of Lemma 4.4, checked by the sweep (cached)
  function optimum(F) {
    var key = rateKey() + "|" + st.n;
    if (!cache[key]) {
      var d = RR.construct(F, st.n), loc = RR.locals(F, d), Pc = 0, lo = Infinity;
      loc.forEach(function (l) { Pc = Math.max(Pc, l.v); lo = Math.min(lo, l.v); });
      var sw = RR.optimum(F, st.n);
      cache[key] = { d: d, Pc: Pc, spread: Pc - lo, Ps: sw.P, P: Math.min(Pc, sw.P) };
    }
    return cache[key];
  }
  function bars(F) {
    var key = rateKey() + "|bars";
    if (!cache[key]) { var v = []; for (var n = 1; n <= NBARS; n++) v.push(RR.optimum(F, n).P); cache[key] = v; }
    return cache[key];
  }
  function crowd(F) {
    var pk = RR.peaks(F).sort(function (a, b) { return b.y - a.y || a.x - b.x; }), n = st.n;
    if (pk.length < n || (pk.length > n && pk[n - 1].y - pk[n].y < 1e-12)) return null;
    return pk.slice(0, n).map(function (p) { return p.x; }).sort(function (a, b) { return a - b; });
  }
  function equal() { var d = []; for (var i = 1; i <= st.n; i++) d.push((2 * i - 1) / (2 * st.n)); return d; }
  function plans(F) {
    var out = [{ id: "opt", d: optimum(F).d }].concat(articlePlans(st.f, st.n));
    var c = crowd(F);
    if (c) out.push({ id: "crowd", d: c });
    out.push({ id: "equal", d: equal() });
    return out;
  }

  // ---- number formats ----
  function sig(v, s) {
    if (!(v > 0)) return I18N.fmt(0, 0);
    var dec = s ? Math.max(0, s - 1 - Math.floor(Math.log10(v))) : Math.max(3, 3 - Math.floor(Math.log10(v)));
    return I18N.fmt(v, Math.min(dec, 8), Math.min(dec, 8));
  }
  function pos(v) { return I18N.fmt(v, 4, 4); }
  function frac(v) {
    if (!(v > 0)) return "";
    for (var q = 1; q <= 400; q++) { var p = Math.round(v * q); if (p > 0 && Math.abs(v - p / q) <= 1e-9 * v) return p + "/" + q; }
    return "";
  }
  function withFrac(v) { var f = frac(v); return sig(v) + (f && f.indexOf("/") > 0 ? " (" + f + ")" : ""); }
  function intName(k, n) {
    if (k === 0) return t("strrt.w.int.L");
    if (k === n) return t("strrt.w.int.R", { n: n });
    return t("strrt.w.int.I", { i: k, j: k + 1 });
  }
  function intSym(k, n) { return k === 0 ? "ℒ" : k === n ? "ℛ" : "ℐ<sup>" + k + "</sup>"; }

  function schedule() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(function () { pending = false; update(); });
  }

  // ---- controls ----
  function buildKnots() {
    var host = $("rr-knots"); host.textContent = "";
    CUSX.forEach(function (x, i) {
      var box = h("div", "st-rng"), id = "rr-k" + i, lab = h("label"), out = h("output"), inp = document.createElement("input");
      lab.htmlFor = id; out.htmlFor = id; lab.setAttribute("data-x", String(x));
      inp.type = "range"; inp.id = id; inp.min = "0"; inp.max = "2"; inp.step = "0.05"; inp.value = String(cus[i]);
      inp.addEventListener("input", function () { cus[i] = +this.value; schedule(); });
      box.append(lab, out, inp); host.appendChild(box);
    });
  }
  function buildTeams() {
    var host = $("rr-teams"); host.textContent = "";
    for (var i = 0; i < NMAX; i++) {
      var box = h("div", "st-rng"), id = "rr-d" + i, lab = h("label"), out = h("output"), inp = document.createElement("input");
      lab.htmlFor = id; out.htmlFor = id;
      inp.type = "range"; inp.id = id; inp.min = "0"; inp.max = "1"; inp.step = "0.001";
      (function (k) { inp.addEventListener("input", function () { move(k, +this.value); }); })(i);
      box.append(lab, out, inp); host.appendChild(box);
    }
  }
  // a team moves between its neighbours (positions stay ordered, D^n)
  function move(k, a) {
    var d = st.d.slice(), lo = k > 0 ? d[k - 1] : 0, hi = k < d.length - 1 ? d[k + 1] : 1;
    d[k] = Math.min(hi, Math.max(lo, Math.round(a * 1000) / 1000));
    if (d[k] < lo) d[k] = lo;
    if (d[k] > hi) d[k] = hi;
    st.d = d; st.plan = "own"; schedule();
  }

  // ---- chart: damage rate (top), teams (middle), damage of an attack at every point (bottom) ----
  function boxWidth(id) { var w = $(id).clientWidth; return Math.max(300, Math.min(1000, w || 640)); }
  function drawChart(F, res) {
    var host = $("rr-chart"); host.textContent = "";
    var W = boxWidth("rr-chart"), small = W < 520, ML = small ? 38 : 46, MR = small ? 10 : 14;
    var MT = 18, H1 = small ? 80 : 100, AX = MT + H1 + 26, T2 = AX + 36, H2 = small ? 150 : 180, H = T2 + H2 + 34;
    var d = st.d, n = d.length;
    function X(a) { return ML + (W - ML - MR) * a; }
    var fmax = 0; F.ys.forEach(function (y) { fmax = Math.max(fmax, y); }); if (!(fmax > 0)) fmax = 1;
    function Yf(v) { return MT + H1 * (1 - v / (fmax * 1.08)); }
    var ytop = Math.max(res.z, res.opt.P, 1e-12) * 1.2;
    function Yd(v) { return T2 + H2 * (1 - v / ytop); }
    var s = svg("svg", { viewBox: "0 0 " + W + " " + H, width: W, height: H, "aria-hidden": "true" });
    // grid and axes
    [0, 0.25, 0.5, 0.75, 1].forEach(function (a) {
      s.appendChild(svg("line", { "class": "grid", x1: X(a), x2: X(a), y1: MT, y2: T2 + H2 }));
      s.appendChild(svg("text", { "class": "tick", x: X(a), y: T2 + H2 + 15, "text-anchor": "middle" }, I18N.fmt(a, 2)));
    });
    s.appendChild(svg("line", { "class": "axis", x1: X(0), x2: X(1), y1: Yf(0), y2: Yf(0) }));
    s.appendChild(svg("line", { "class": "axis", x1: X(0), x2: X(1), y1: AX, y2: AX }));
    s.appendChild(svg("line", { "class": "axis", x1: X(0), x2: X(1), y1: Yd(0), y2: Yd(0) }));
    s.appendChild(svg("text", { "class": "tick", x: ML - 6, y: Yf(fmax) + 4, "text-anchor": "end" }, sig(fmax).replace(/0+$/, "").replace(/[.,]$/, "")));
    s.appendChild(svg("text", { "class": "tick", x: ML - 6, y: Yf(0) + 4, "text-anchor": "end" }, "0"));
    s.appendChild(svg("text", { "class": "lab", x: ML + 6, y: MT - 4 }, t("strrt.w.ax.f")));
    s.appendChild(svg("text", { "class": "lab", x: ML + 6, y: T2 - 6 }, t("strrt.w.ax.D")));
    s.appendChild(svg("text", { "class": "tick", x: ML - 6, y: Yd(0) + 4, "text-anchor": "end" }, "0"));
    s.appendChild(svg("text", { "class": "lab", x: X(1), y: H - 3, "text-anchor": "end" }, t("strrt.w.ax.a")));
    // damage rate f
    var pf = "M" + X(0) + " " + Yf(0);
    F.xs.forEach(function (x, k) { pf += "L" + X(x).toFixed(1) + " " + Yf(F.ys[k]).toFixed(1); });
    s.appendChild(svg("path", { "class": "farea", d: pf + "L" + X(1) + " " + Yf(0) + "Z" }));
    var pl = ""; F.xs.forEach(function (x, k) { pl += (k ? "L" : "M") + X(x).toFixed(1) + " " + Yf(F.ys[k]).toFixed(1); });
    s.appendChild(svg("path", { "class": "fline", d: pl }));
    // team lines
    d.forEach(function (x) { s.appendChild(svg("line", { "class": "tline", x1: X(x), x2: X(x), y1: MT, y2: T2 + H2 })); });
    // damage of an attack at every point: exact at knots, teams, midpoints and the local maxima, dense in between
    var pts = [], N = 600, k;
    for (k = 0; k <= N; k++) pts.push(k / N);
    F.xs.forEach(function (x) { pts.push(x); });
    d.forEach(function (x, i) { pts.push(x); if (i < n - 1) pts.push((x + d[i + 1]) / 2); });
    res.loc.forEach(function (l) { pts.push(l.a); });
    pts.sort(function (a, b) { return a - b; });
    var pd = "";
    pts.forEach(function (a, i) { pd += (i ? "L" : "M") + X(a).toFixed(2) + " " + Yd(RR.damage(F, d, a)).toFixed(2); });
    s.appendChild(svg("path", { "class": "darea", d: pd + "L" + X(1) + " " + Yd(0) + "L" + X(0) + " " + Yd(0) + "Z" }));
    s.appendChild(svg("path", { "class": "dline", d: pd }));
    // the optimal damage P
    if (res.opt.P > 0) {
      s.appendChild(svg("line", { "class": "popt", x1: X(0), x2: X(1), y1: Yd(res.opt.P), y2: Yd(res.opt.P) }));
      s.appendChild(svg("line", { "class": "popt", x1: X(1) - 4, x2: X(1) - 22, y1: T2 - 10, y2: T2 - 10 }));
      s.appendChild(svg("text", { "class": "popt-t", x: X(1) - 28, y: T2 - 6, "text-anchor": "end" }, t("strrt.w.lbl.P", { v: sig(res.opt.P) })));
    }
    // local maxima, attack points and their values
    res.loc.forEach(function (l, j) {
      var hot = res.atk.indexOf(j) >= 0, x = X(l.a), y = Yd(l.v);
      if (hot) {
        s.appendChild(svg("line", { "class": "atkline", x1: x, x2: x, y1: y, y2: Yf(RR.at(F, l.a)) }));
        s.appendChild(svg("circle", { "class": "atk", cx: x, cy: y, r: 5.5 }));
      } else s.appendChild(svg("circle", { "class": "lmax", cx: x, cy: y, r: 3.5 }));
      var wpx = X(l.hi) - X(l.lo);
      if (wpx >= (small ? 44 : 50) && l.v > 0) {
        var lx = Math.min(X(1) - 22, Math.max(X(0) + 22, x));
        s.appendChild(svg("text", { "class": "lv" + (hot ? " hot" : ""), x: lx, y: y - 9, "text-anchor": "middle" }, sig(l.v)));
      }
    });
    // teams (drag them)
    d.forEach(function (x, i) {
      var g = svg("g", {});
      g.appendChild(svg("circle", { "class": "team", cx: X(x), cy: AX, r: 9.5 }));
      g.appendChild(svg("text", { "class": "team-t", x: X(x), y: AX + 4, "text-anchor": "middle" }, String(i + 1)));
      var hit = svg("circle", { "class": "thit", cx: X(x), cy: AX, r: 17, "data-i": i });
      g.appendChild(hit);
      s.appendChild(g);
    });
    host.appendChild(s);
    view = { W: W, ML: ML, MR: MR };
    var leg = $("rr-legend"); leg.textContent = "";
    [["f", "strrt.w.leg.f"], ["d", "strrt.w.leg.D"], ["team", "strrt.w.leg.team"], ["atk", "strrt.w.leg.atk"], ["p", "strrt.w.leg.P"]].forEach(function (L) {
      var sp = h("span"), i = h("i", L[0]); sp.append(i, document.createTextNode(t(L[1]))); leg.appendChild(sp);
    });
  }
  // dragging a team on the chart
  var drag = null;
  $("rr-chart").addEventListener("pointerdown", function (e) {
    var tgt = e.target;
    if (!tgt || !tgt.classList || !tgt.classList.contains("thit")) return;
    e.preventDefault();
    drag = +tgt.getAttribute("data-i");
    $("rr-chart").classList.add("is-drag");
  });
  window.addEventListener("pointermove", function (e) {
    if (drag == null || !view) return;
    var svgEl = $("rr-chart").querySelector("svg"); if (!svgEl) return;
    var r = svgEl.getBoundingClientRect(), sc = view.W / r.width;
    var a = ((e.clientX - r.left) * sc - view.ML) / (view.W - view.ML - view.MR);
    move(drag, Math.min(1, Math.max(0, a)));
  });
  function endDrag() { if (drag != null) { drag = null; $("rr-chart").classList.remove("is-drag"); } }
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);

  // ---- bars: the optimal damage for 1 to 8 teams (as in Figures 5, 6 and 8) ----
  function drawBars(vals) {
    var host = $("rr-bars"); host.textContent = "";
    var W = boxWidth("rr-bars"), H = 150, ML = 10, MR = 10, MT = 22, MB = 22, n = vals.length;
    var top = Math.max.apply(null, vals.concat([1e-12]));
    var s = svg("svg", { viewBox: "0 0 " + W + " " + H, width: W, height: H, "aria-hidden": "true" });
    var slot = (W - ML - MR) / n, bw = Math.min(56, slot * 0.62), tight = slot < 64;
    s.appendChild(svg("line", { "class": "axis", x1: ML, x2: W - MR, y1: H - MB, y2: H - MB }));
    vals.forEach(function (v, i) {
      var cx = ML + slot * (i + 0.5), hgt = (H - MT - MB) * v / top, cur = i + 1 === st.n;
      s.appendChild(svg("rect", { "class": "bar" + (cur ? " cur" : ""), x: cx - bw / 2, y: H - MB - hgt, width: bw, height: Math.max(0, hgt) }));
      s.appendChild(svg("text", { "class": "bar-t" + (cur ? " cur" : "") + (tight ? " tight" : ""), x: cx, y: H - MB - hgt - 5, "text-anchor": "middle" }, sig(v, tight && !cur ? 2 : 0)));
      s.appendChild(svg("text", { "class": "bar-n", x: cx, y: H - 6, "text-anchor": "middle" }, "n = " + (i + 1)));
    });
    host.appendChild(s);
  }

  function kpi(label, value, cls) {
    var d = h("div", "st-kpi" + (cls ? " " + cls : "")), b = h("b"); b.innerHTML = value;
    d.append(b, h("span", null, label)); return d;
  }

  function update() {
    var F = rate(), n = st.n, list = plans(F), cur = null;
    list.forEach(function (p) { if (p.id === st.plan) cur = p; });
    if (st.plan !== "own") {
      if (!cur) { st.plan = "opt"; cur = list[0]; }
      st.d = cur.d.slice();
    }
    var opt = optimum(F), loc = RR.locals(F, st.d), z = 0, lo = Infinity;
    loc.forEach(function (l) { z = Math.max(z, l.v); lo = Math.min(lo, l.v); });
    var tol = 1e-9 * z + 1e-15, atk = [];
    if (z > 0) loc.forEach(function (l, j) { if (l.v >= z - tol) atk.push(j); });
    var res = { loc: loc, z: z, lo: lo, atk: atk, opt: opt, balanced: z - lo <= tol, optimal: z <= opt.P * (1 + 1e-9) + 1e-15 };

    // controls
    document.querySelectorAll("#rr-f button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-f") === st.f)); });
    document.querySelectorAll("#rr-n button").forEach(function (b) { b.setAttribute("aria-pressed", String(+b.getAttribute("data-n") === n)); });
    $("rr-knots").hidden = st.f !== "cus";
    $("rr-knots").querySelectorAll(".st-rng").forEach(function (box, i) {
      box.querySelector("label").textContent = t("strrt.w.knot", { x: I18N.fmt(CUSX[i], 2) });
      box.querySelector("output").textContent = I18N.fmt(cus[i], 2, 2);
    });
    var ph = $("rr-plan"); ph.textContent = "";
    list.forEach(function (p) {
      var b = h("button", "st-btn", t("strrt.w.pl." + p.id)); b.type = "button";
      b.setAttribute("aria-pressed", String(p.id === st.plan));
      b.addEventListener("click", function () { st.plan = p.id; schedule(); });
      ph.appendChild(b);
    });
    $("rr-teams").querySelectorAll(".st-rng").forEach(function (box, i) {
      box.hidden = i >= n;
      if (i < n) {
        box.querySelector("label").textContent = t("strrt.w.team", { i: i + 1 });
        box.querySelector("output").textContent = pos(st.d[i]);
        var inp = box.querySelector("input");
        if (Math.abs(+inp.value - st.d[i]) > 0.0005) inp.value = String(st.d[i]);
      }
    });

    drawChart(F, res);

    // numbers
    var k = $("rr-kpis"); k.textContent = "";
    var gap = opt.P > 0 ? (z / opt.P - 1) * 100 : 0;
    var aTxt = atk.length === 0 ? t("strrt.w.k.none") : atk.length > 1 ? t("strrt.w.k.ties", { k: atk.length }) : "a = " + pos(loc[atk[0]].a);
    k.append(kpi(t("strrt.w.k.z"), withFrac(z), "accent"), kpi(t("strrt.w.k.P"), withFrac(opt.P)),
      kpi(t("strrt.w.k.gap"), res.optimal ? t("strrt.w.k.isopt") : t("strrt.w.pct", { v: I18N.fmt(gap, 1, 1) }), res.optimal ? null : "warn"),
      kpi(t("strrt.w.k.atk"), aTxt), kpi(t("strrt.w.k.resp"), pos(RR.maxResp(st.d))),
      kpi(t("strrt.w.k.bal"), t(res.balanced ? "strrt.w.yes" : "strrt.w.no")));

    // verdict
    var v = $("rr-verdict"), cls = "ok", txt;
    if (opt.P <= 1e-15) { txt = t("strrt.w.v.zero"); }
    else if (res.balanced) txt = t("strrt.w.v.bal", { k: n + 1, z: sig(z) });
    else if (res.optimal) {
      var jl = 0; loc.forEach(function (l, j) { if (l.v < loc[jl].v) jl = j; });
      txt = t("strrt.w.v.optnb", { z: sig(z), lo: sig(loc[jl].v), int: intName(jl, n) });
    } else {
      cls = "bad";
      txt = t("strrt.w.v.bad", { a: pos(loc[atk[0]].a), int: intName(atk[0], n), z: sig(z), pct: I18N.fmt(gap, 1, 1), P: sig(opt.P) });
    }
    var extra = [];
    if (cur && cur.dmg != null) extra.push(t("strrt.w.th." + cur.id, { v: sig(cur.dmg), k: cur.k }));
    if (st.f === "tri" && n % 2 === 0) extra.push(t("strrt.w.th.th56no"));
    if (st.f === "ex6") extra.push(t("strrt.w.th.ex6"));
    if (st.plan === "crowd" || st.plan === "equal") extra.push(t("strrt.w.th." + st.plan, { r: pos(RR.maxResp(st.d)), ro: pos(RR.maxResp(opt.d)) }));
    v.className = "st-verdict " + cls;
    v.innerHTML = [txt].concat(extra).join(" ");
    var same = Math.abs(opt.Pc - opt.Ps) <= 1e-9 * Math.max(opt.Pc, 1e-12) + 1e-14;
    $("rr-how").innerHTML = opt.P <= 1e-15 ? "" : t(same ? "strrt.w.how" : "strrt.w.how.diff", { P: sig(opt.Pc), Ps: sig(opt.Ps), d: "(" + opt.d.map(pos).join(t("strrt.w.sep")) + ")" });

    // the n + 1 local damage problems
    var tb = h("table"), thead = h("thead"), tr = h("tr");
    [["strrt.w.t.int", ""], ["strrt.w.t.span", "num"], ["strrt.w.t.v", "num"], ["strrt.w.t.a", "num"], ["strrt.w.t.f", "num wide"], ["strrt.w.t.time", "num wide"]].forEach(function (c) {
      tr.appendChild(h("th", c[1], t(c[0])));
    });
    thead.appendChild(tr); tb.appendChild(thead);
    var tbody = h("tbody");
    loc.forEach(function (l, j) {
      var row = h("tr", atk.indexOf(j) >= 0 ? "is-atk" : null), c0 = h("td");
      c0.innerHTML = intSym(j, n);
      if (atk.indexOf(j) >= 0) c0.appendChild(h("span", "atk-tag", t("strrt.w.t.atk")));
      var fa = RR.at(F, l.a), tm = fa > 0 ? l.v / fa : Math.min.apply(null, st.d.map(function (x) { return Math.abs(x - l.a); }));
      row.append(c0, h("td", "num", "[" + pos(l.lo) + t("strrt.w.sep") + pos(l.hi) + "]"), h("td", "num", sig(l.v)), h("td", "num", pos(l.a)),
        h("td", "num wide", sig(fa)), h("td", "num wide", pos(tm)));
      tbody.appendChild(row);
    });
    tb.appendChild(tbody);
    var host = $("rr-tbl"); host.textContent = ""; host.appendChild(tb);

    drawBars(bars(F));
  }

  // events
  document.querySelectorAll("#rr-f button").forEach(function (b) {
    b.addEventListener("click", function () {
      st.f = b.getAttribute("data-f"); st.n = START[st.f][0]; st.plan = START[st.f][1]; schedule();
    });
  });
  document.querySelectorAll("#rr-n button").forEach(function (b) {
    b.addEventListener("click", function () {
      st.n = +b.getAttribute("data-n");
      if (st.plan === "own") st.plan = "equal";
      schedule();
    });
  });

  buildKnots();
  buildTeams();
  I18N.onChange(update);
  var resizeTimer, lastW = 0;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var w = $("rr-chart").clientWidth;
      if (w !== lastW) { lastW = w; update(); }
    }, 120);
  });
})();
</script>
