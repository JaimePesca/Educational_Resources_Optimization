<script>
(function () {

  var t = I18N.t;
  var $ = function (id) { return document.getElementById(id); };
  var NS = "http://www.w3.org/2000/svg";

  // ---- the data of the article: Table 2 (Example 1) and Table 4 (Example 3) ----
  // D[i]; Q[p][i] and c[p][i] per leg p; TS[p][i][j] = [t_ij^p, s_ij^p], fixed and variable cost of a transfer from
  // carrier i (row, sender) to carrier j (column, receiver) at point p. Internal transfers (i = j) are free in both tables.
  var DATA = {
    ex1: {
      D: [6, 4, 3], Q: [[7, 8, 7], [7, 6, 7]], c: [[6, 1, 9], [9, 2, 4]],
      TS: [[[[0, 0], [4, 2], [6, 1]], [[9, 4], [0, 0], [7, 1]], [[5, 4], [5, 3], [0, 0]]],
           [[[0, 0], [6, 4], [9, 4]], [[5, 4], [0, 0], [5, 3]], [[9, 3], [5, 2], [0, 0]]]]
    },
    ex3: {
      D: [3, 3, 6], Q: [[7, 7, 9], [6, 5, 9]], c: [[9, 7, 2], [2, 8, 6]],
      TS: [[[[0, 0], [9, 4], [5, 1]], [[7, 2], [0, 0], [7, 2]], [[8, 1], [8, 2], [0, 0]]],
           [[[0, 0], [7, 2], [8, 4]], [[5, 1], [0, 0], [8, 4]], [[4, 1], [7, 2], [0, 0]]]]
    }
  };
  // the article's core allocation of Example 2 (Example 1 with lambda = 1), checked live against the computed game
  var PAPER_U = [80, 5, 35];
  var NC = 3, NP = 2, TOL = 1e-7, LMAX = 30, LN = Math.log1p(LMAX);
  var ORDER = [7, 3, 5, 6, 1, 2, 4];              // coalitions shown: N, the pairs, the single carriers

  function members(m) { var S = []; for (var k = 0; k < NC; k++) if (m >> k & 1) S.push(k); return S; }
  function zeros(n) { var a = []; for (var k = 0; k < n; k++) a.push(0); return a; }
  function ind(m) { var a = []; for (var k = 0; k < NC; k++) a.push(m >> k & 1); return a; }

  // ---- Problem (2) of coalition S for a fixed set of open transfers between different carriers ----
  // Variables x_ji^p: volume handed from j to i at point p and carried by i on leg p; the cost per unit is c_i^p + s_ji^p.
  // Internal transfers x_ii^p are always allowed (no fixed cost in either example). Relaxed form of Observation 1.
  function flowLP(d, S, open) {
    var vars = [], p;
    for (p = 0; p < NP; p++) S.forEach(function (j) { S.forEach(function (i) { if (i === j || open[p * 9 + j * 3 + i]) vars.push([p, j, i]); }); });
    var c = vars.map(function (v) { return d.c[v[0]][v[2]] + d.TS[v[0]][v[1]][v[2]][1]; });
    var rows = [];
    S.forEach(function (i) {
      for (var q = 0; q < NP; q++) rows.push({ a: vars.map(function (v) { return v[0] === q && v[2] === i ? 1 : 0; }), op: "<=", b: d.Q[q][i] });   // (2b)
      for (q = 0; q < NP - 1; q++) rows.push({ a: vars.map(function (v) { return (v[0] === q && v[2] === i ? 1 : 0) - (v[0] === q + 1 && v[1] === i ? 1 : 0); }), op: "<=", b: 0 }); // (2c)
      rows.push({ a: vars.map(function (v) { return v[0] === 0 && v[1] === i ? 1 : 0; }), op: ">=", b: d.D[i] });  // (2d)
    });
    var r = LP.solve({ sense: "min", c: c, rows: rows }), x = [];
    if (r.status !== "optimal") return null;
    vars.forEach(function (v, k) { if (r.x[k] > 1e-9) x.push({ p: v[0], j: v[1], i: v[2], v: r.x[k] }); });
    return { z: r.z, x: x };
  }

  // every choice of open transfers (z = 1) for every coalition: the LP cost and the fixed cost of the choice
  function precompute(d) {
    var pats = {};
    for (var m = 1; m < 8; m++) {
      var S = members(m), arcs = [], list = [];
      for (var p = 0; p < NP; p++) S.forEach(function (j) { S.forEach(function (i) { if (i !== j) arcs.push([p, j, i]); }); });
      for (var b = 0; b < (1 << arcs.length); b++) {
        var open = {}, T = 0, n = 0;
        arcs.forEach(function (a, k) {
          if (b >> k & 1) { open[a[0] * 9 + a[1] * 3 + a[2]] = true; T += d.TS[a[0]][a[1]][a[2]][0]; n++; }
        });
        var r = flowLP(d, S, open);
        if (r) list.push({ lp: r.z, T: T, n: n, x: r.x });
      }
      pats[m] = list;
    }
    return pats;
  }

  // C(S) at factor lambda: the cheapest choice (ties: fewer open transfers, then lower fixed cost), so every open
  // transfer of the chosen solution carries volume
  function values(pats, lam) {
    var C = [0], pat = [null];
    for (var m = 1; m < 8; m++) {
      var bv = Infinity, bp = null;
      pats[m].forEach(function (q) {
        var v = q.lp + lam * q.T;
        if (v < bv - 1e-9 || (Math.abs(v - bv) <= 1e-9 && (q.n < bp.n || (q.n === bp.n && q.T < bp.T)))) { bv = v; bp = q; }
      });
      C.push(bv); pat.push(bp);
    }
    return { C: C, pat: pat };
  }

  // ---- core by LP (allocations are free in sign: u = u+ - u-) ----
  function coreRows(C, withEps) {
    var rows = [];
    for (var m = 1; m < 7; m++) {
      var a = ind(m);
      rows.push({ a: a.concat(a.map(function (v) { return -v; }), withEps ? [1, -1] : []), op: "<=", b: C[m] });
    }
    rows.push({ a: [1, 1, 1, -1, -1, -1].concat(withEps ? [0, 0] : []), op: "=", b: C[7] });
    return rows;
  }
  // the largest margin eps with u(S) + eps <= C(S) for every proper coalition: the core is non-empty iff eps >= 0
  function margin(C) {
    var r = LP.solve({ sense: "max", c: [0, 0, 0, 0, 0, 0, 1, -1], rows: coreRows(C, true) });
    return { eps: r.x[6] - r.x[7], u: [r.x[0] - r.x[3], r.x[1] - r.x[4], r.x[2] - r.x[5]] };
  }
  // smallest and largest share of each carrier over the core (null when the core is empty)
  function ranges(C) {
    var rows = coreRows(C, false), out = [];
    for (var i = 0; i < NC; i++) {
      var c = zeros(6); c[i] = 1; c[i + 3] = -1;
      var lo = LP.solve({ sense: "min", c: c, rows: rows }), hi = LP.solve({ sense: "max", c: c, rows: rows });
      if (lo.status !== "optimal" || hi.status !== "optimal") return null;
      out.push([lo.z, hi.z]);
    }
    return out;
  }

  // ---- the dual (4) of the grand coalition without fixed costs, and the Owen allocation u_i = D_i eta_i - sum Q gamma ----
  function owen(d) {
    var nE = NC, nG = NC * NP, nv = nE + nG + NC * (NP - 1);
    function G(i, p) { return nE + i * NP + p; }
    function F(i, p) { return nE + nG + i * (NP - 1) + p; }
    var c = zeros(nv), rows = [], i, j, p;
    for (i = 0; i < NC; i++) { c[i] = d.D[i]; for (p = 0; p < NP; p++) c[G(i, p)] = -d.Q[p][i]; }
    for (p = 0; p < NP; p++) for (i = 0; i < NC; i++) for (j = 0; j < NC; j++) {
      // one constraint per variable x_ji^p (from j to i at point p): (4d) at the first point, (4b) in between, (4c) at the last
      var a = zeros(nv);
      if (p === 0) a[j] += 1; else a[F(j, p - 1)] += 1;
      if (p < NP - 1) a[F(i, p)] -= 1;
      a[G(i, p)] -= 1;
      rows.push({ a: a, op: "<=", b: d.c[p][i] + d.TS[p][j][i][1] });
    }
    var r = LP.solve({ sense: "max", c: c, rows: rows });
    if (r.status !== "optimal") return null;
    var u = [], eta = [], gam = [];
    for (i = 0; i < NC; i++) {
      var ui = d.D[i] * r.x[i];
      eta.push(r.x[i]);
      for (p = 0; p < NP; p++) { ui -= d.Q[p][i] * r.x[G(i, p)]; if (r.x[G(i, p)] > 1e-9) gam.push({ i: i, p: p, v: r.x[G(i, p)] }); }
      u.push(ui);
    }
    return { u: u, eta: eta, gam: gam, z: r.z };
  }

  // Proposition 2 holds when lambda t_ij^p > D_i sum_q (c_i^q + s_ii^q) + lambda sum_q t_ii^q for every i != j and p
  function utcThreshold(d) {
    var th = 0;
    for (var i = 0; i < NC; i++) {
      var A = 0, Tii = 0, p;
      for (p = 0; p < NP; p++) { A += d.D[i] * (d.c[p][i] + d.TS[p][i][i][1]); Tii += d.TS[p][i][i][0]; }
      for (p = 0; p < NP; p++) for (var j = 0; j < NC; j++) {
        if (j === i) continue;
        var g = d.TS[p][i][j][0] - Tii;
        if (g <= 0) return Infinity;
        th = Math.max(th, A / g);
      }
    }
    return th;
  }

  function ucetc(d, lam) {
    var DN = d.D.reduce(function (s, v) { return s + v; }, 0), qmin = Infinity, eq = true;
    for (var p = 0; p < NP; p++) {
      for (var i = 0; i < NC; i++) {
        qmin = Math.min(qmin, d.Q[p][i]);
        for (var j = 0; j < NC; j++) {
          if (Math.abs(lam * d.TS[p][i][j][0] - lam * d.TS[p][0][0][0]) > 1e-12 || d.TS[p][i][j][1] !== d.TS[p][0][0][1]) eq = false;
        }
      }
    }
    return { cap: qmin > DN, eq: eq, qmin: qmin, DN: DN };
  }

  // breakpoints of the lower envelope of the lines lp + lambda T on (0, hi]
  function breaks(list, hi) {
    var out = [], lam = 0, cur = null;
    list.forEach(function (q) { if (!cur || q.lp < cur.lp - 1e-9 || (Math.abs(q.lp - cur.lp) <= 1e-9 && q.T < cur.T)) cur = q; });
    for (var guard = 0; guard < 200; guard++) {

      var ok = m === 7 ? Math.abs(us - C[7]) < 1e-6 : us <= C[m] + 1e-6;
      var row = h("tr", m === 7 ? "grand" : null), cell = h("td", "num", f2(us) + " ");
      cell.appendChild(h("span", ok ? "ok" : "bad", t(ok ? "stctt.w.yes" : "stctt.w.no")));
      var xs = S.pat[m].x.filter(function (e) { return e.i !== e.j; }).map(function (e) {
        return t("stctt.w.tr.item", { a: e.j + 1, b: e.i + 1, p: e.p + 1, v: f2(e.v) });
      });
      row.append(h("td", null, setName(m)), h("td", "num", f2(C[m])), h("td", "num", f2(al)), h("td", "num", f2(al - C[m])), cell,
        h("td", "wide", xs.length ? xs.join(t("stctt.w.list")) : t("stctt.w.tr.none")));
      b2.appendChild(row);
    });
    tc.appendChild(b2);
    var hk = $("fc-coa"); hk.textContent = ""; hk.appendChild(tc);
  }

  function dataTables() {
    var d = S.d, host = $("fc-data"); host.textContent = "";
    var t1 = h("table"), hd = h("thead"), r0 = h("tr");
    [t("stctt.w.d.car"), "D", "Q¹", "Q²", "c¹", "c²"].forEach(function (x, k) { r0.appendChild(h("th", k ? "num" : "", x)); });
    hd.appendChild(r0); t1.appendChild(hd);
    var b1 = h("tbody");
    for (var i = 0; i < NC; i++) {
      var r = h("tr");
      [String(i + 1), d.D[i], d.Q[0][i], d.Q[1][i], d.c[0][i], d.c[1][i]].forEach(function (x, k) { r.appendChild(h("td", k ? "num" : "", String(x))); });
      b1.appendChild(r);
    }
    t1.appendChild(b1); host.appendChild(t1);
    for (var p = 0; p < NP; p++) {
      var tp = h("table"), cap = h("caption", null, t("stctt.w.d.pt", { p: p + 1 })), hp = h("thead"), rp = h("tr");
      tp.appendChild(cap);
      ["", "1", "2", "3"].forEach(function (x, k) { rp.appendChild(h("th", k ? "num" : "", x)); });
      hp.appendChild(rp); tp.appendChild(hp);
      var bp = h("tbody");
      for (i = 0; i < NC; i++) {
        var rr = h("tr"); rr.appendChild(h("td", null, String(i + 1)));
        for (var j = 0; j < NC; j++) rr.appendChild(h("td", "num", d.TS[p][i][j][0] + ", " + d.TS[p][i][j][1]));
        bp.appendChild(rr);
      }
      tp.appendChild(bp); host.appendChild(tp);
    }
  }

  function update() {
    compute();
    document.querySelectorAll("#fc-inst button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-inst") === inst)); });
    document.querySelectorAll("#fc-snaps button").forEach(function (b) {
      var k = b.getAttribute("data-snap");
      b.setAttribute("aria-pressed", String(k === "nf" ? lam === 0 : k === "paper" ? lam === 1 : S.utc));
    });
    var sl = $("fc-l"), want = Math.round(1000 * Math.log1p(lam) / LN);
    if (snapLam(Math.expm1(+sl.value / 1000 * LN)) !== lam) sl.value = String(want);
    $("fc-l-out").textContent = "λ = " + f2(lam);
    // coalition buttons
    var cb = $("fc-coal");
    if (!cb.children.length) {
      ORDER.forEach(function (m) {
        var b = h("button", null, setName(m).replace(/, /g, ",")); b.type = "button"; b.setAttribute("data-m", String(m));
        b.addEventListener("click", function () { selMask = m; drawFlow(); markCoal(); });
        cb.appendChild(b);
      });
    }
    markCoal();
    var k = $("fc-kpis"); k.textContent = "";
    var cond = S.nf ? "stctt.w.cond.nf" : S.utc ? "stctt.w.cond.utc" : S.uc.cap && S.uc.eq ? "stctt.w.cond.ucetc" : "stctt.w.cond.none";
    k.append(kpi(t("stctt.w.k.alone"), f2(S.alone)), kpi(t("stctt.w.k.cn"), f2(S.C[7]), "accent"), kpi(t("stctt.w.k.sav"), f2(S.sav)),
      kpi(t("stctt.w.k.core"), t(S.st === "empty" ? "stctt.w.core.no" : "stctt.w.core.yes"), S.st === "empty" ? "warn" : null),
      kpi(t("stctt.w.k.eps"), f2(S.eps), S.eps < -TOL ? "warn" : null), kpi(t("stctt.w.k.cond"), t(cond)));
    drawChart();
    verdict();
    conds();
    drawFlow();
    tables();
    dataTables();
  }
  function markCoal() {
    document.querySelectorAll("#fc-coal button").forEach(function (b) { b.setAttribute("aria-pressed", String(+b.getAttribute("data-m") === selMask)); });
  }
  function schedule() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(function () { pending = false; update(); });
  }

  document.querySelectorAll("#fc-inst button").forEach(function (b) {
    b.addEventListener("click", function () { inst = b.getAttribute("data-inst"); schedule(); });
  });
  document.querySelectorAll("#fc-snaps button").forEach(function (b) {
    b.addEventListener("click", function () {
      var k = b.getAttribute("data-snap"), th = cache[inst] ? cache[inst].th : utcThreshold(DATA[inst]);
      if (k === "nf") lam = 0;
      else if (k === "paper") lam = 1;
      else lam = STOPS.filter(function (s) { return s > th + 1e-9; })[0] || LMAX;
      schedule();
    });
  });
  $("fc-l").addEventListener("input", function () { lam = snapLam(Math.expm1(+this.value / 1000 * LN)); schedule(); });

  I18N.onChange(update);
  var resizeTimer, lastW = 0;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var w = $("fc-chart").clientWidth;
      if (S && w !== lastW) { lastW = w; drawChart(); drawFlow(); }
    }, 120);
  });
})();
</script>
