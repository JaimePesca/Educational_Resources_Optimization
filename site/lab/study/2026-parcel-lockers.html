<script>
(function () {

  var EPS = 1e-9;

  // ---- the LL game of the article, solved live (no hard-coded results) ----
  var Lockers = (function () {
    function cmp(a, b) { for (var i = 0; i < Math.min(a.length, b.length); i++) if (a[i] !== b[i]) return a[i] - b[i]; return a.length - b.length; }
    function zeros(n) { var a = []; for (var i = 0; i < n; i++) a.push(0); return a; }
    function sum(a) { var s = 0; a.forEach(function (x) { s += x; }); return s; }

    // LLP_S (6a)-(6e): enumeration of the binary locker sets (by Lemma 1 binary lockers are enough); every optimal plan,
    function llp(inst, c, Cs) {
      var L = inst.L, best = -Infinity, plans = [];
      for (var m = 0; m < (1 << L.length); m++) {
        var open = L.filter(function (_, i) { return m & (1 << i); });
        var served = Cs.filter(function (k) { return inst.Lk[k].some(function (j) { return open.indexOf(j) >= 0; }); });
        var val = 0;
        served.forEach(function (k) { val += inst.p[k]; });
        open.forEach(function (j) { val -= c[j]; });

        else if (Math.abs(val - best) <= EPS) plans.push({ open: open, served: served });
      }
      // most customers served first (Example 1 opens location 9 and serves everybody), then fewest lockers
      plans.sort(function (a, b) { return b.served.length - a.served.length || a.open.length - b.open.length || cmp(a.open, b.open); });
      return { v: best, plans: plans };

    // RLLP_S: the linear relaxation (y_j >= 0 real), by LP.solve
    function rllp(inst, c, Cs) {
      if (!Cs.length) return 0;
      var L = inst.L, nC = Cs.length, nL = L.length, rows = [];
      Cs.forEach(function (k, i) {
        var a = zeros(nC + nL); a[i] = 1;
        inst.Lk[k].forEach(function (j) { a[nC + L.indexOf(j)] = -1; });
        rows.push({ a: a, op: "<=", b: 0 });
        var a2 = zeros(nC + nL); a2[i] = 1;
        rows.push({ a: a2, op: "<=", b: 1 });
      });
      var obj = Cs.map(function (k) { return inst.p[k]; }).concat(L.map(function (j) { return -c[j]; }));
      return LP.solve({ sense: "max", c: obj, rows: rows }).z;
    }

    // rows of the dual (8b)-(8d) of RLLP_N; variables alpha_k (k in C) then beta_k
    function dualRows(inst, c) {
      var C = inst.C, n = C.length, rows = [];
      C.forEach(function (k, i) { var a = zeros(2 * n); a[i] = 1; a[n + i] = 1; rows.push({ a: a, op: ">=", b: inst.p[k] }); });
      inst.L.forEach(function (j) {
        var a = zeros(2 * n);
        C.forEach(function (k, i) { if (inst.Lk[k].indexOf(j) >= 0) a[i] = 1; });
        rows.push({ a: a, op: "<=", b: c[j] });
      });
      return rows;
    }

    // square submatrices of the connection matrix (entries -1 as in (5)): total unimodularity and a witness
    function det(m) {
      var n = m.length;
      if (n === 1) return m[0][0];
      var d = 0;
      for (var j = 0; j < n; j++) {
        if (!m[0][j]) continue;
        var sub = m.slice(1).map(function (r) { return r.filter(function (_, q) { return q !== j; }); });
        d += (j % 2 ? -1 : 1) * m[0][j] * det(sub);

    function combos(arr, q) {
      var out = [];
      (function rec(start, acc) {

        for (var i = start; i < arr.length; i++) { acc.push(arr[i]); rec(i + 1, acc); acc.pop(); }
      })(0, []);

    }
    function tu(inst) {
      var C = inst.C, L = inst.L, count = 0;
      for (var q = 1; q <= Math.min(C.length, L.length); q++) {
        var rs = combos(C, q), cs = combos(L, q);

      return { tu: true, count: count };
    }
    function tree(inst) {
      var V = inst.C.length + inst.L.length, E = 0, seen = {}, stack = ["c" + inst.C[0]];
      inst.C.forEach(function (k) { E += inst.Lk[k].length; });
      while (stack.length) {
        var x = stack.pop();
        if (seen[x]) continue;
        seen[x] = true;
        var id = +x.slice(1);
        if (x[0] === "c") inst.Lk[id].forEach(function (j) { stack.push("l" + j); });
        else inst.C.forEach(function (k) { if (inst.Lk[k].indexOf(id) >= 0) stack.push("c" + k); });
      }

      inst.L.forEach(function (j) { c[j] = lam * inst.c[j]; });
      var N = [];
      inst.C.forEach(function (k) { if (N.indexOf(own[k]) < 0) N.push(own[k]); });
      N.sort(function (a, b) { return a - b; });

      var minTotal = vN, weights = [], core = null, coreRange = null;

      var dSol = LP.solve({ sense: "min", c: zeros(nC).concat(C.map(function () { return 1; })), rows: dRows });

      var dualRange = N.map(function (i) {
        var e = zeros(nC).concat(C.map(function (k) { return own[k] === i ? 1 : 0; }));

      var rowsX = face.concat(res.map(function (x) {

    }), { eps: null, ok: res.someDualInCore, coreText: t(res.someDualInCore ? "stplk.w.some" : "stplk.w.noneof") });
    if (res.gap > 0) row(t("stplk.w.r.du", { r: fv(res.rN) }), res.dualU, { eps: res.eps(res.dualU), ok: res.inCore(res.dualU) });
    var shown = propIndex();
    res.props.forEach(function (q, z) {
      row(t("stplk.w.r.pr", { plans: plansName(q.plans.map(function (ix) { return res.grand.plans[ix]; })) }), q.u,
        { eps: res.eps(q.u), ok: res.inCore(q.u), cls: res.props.length > 1 && z === shown ? "shown" : null });
    });
    tb.appendChild(body);
    var host = $("pl-rules"); host.textContent = ""; host.appendChild(tb);

    // coalitions
    var pr = res.props[shown] || res.props[0];
    var tc = h("table"), th2 = h("thead"), tr2 = h("tr");
    [["stplk.w.t.S", ""], ["stplk.w.t.CS", "wide"], ["stplk.w.t.plans", "wide"], ["stplk.w.t.v", "num"], ["stplk.w.t.r", "num wide"],
      ["stplk.w.t.sh", "num"], ["stplk.w.t.sd", "num"], ["stplk.w.t.pr", "num"]].forEach(function (c) { tr2.appendChild(hh("th", c[1], t(c[0]))); });
    th2.appendChild(tr2); tc.appendChild(th2);
    var b2 = h("tbody");
    res.coal.forEach(function (x, z) {
      var grand = z === res.coal.length - 1, r = h("tr", grand ? "grand" : null);
      function cell(u) {
        var s = res.share(u, x.S), td = h("td", "num", fv(s));
        if (!grand) mark(td, s >= x.v - 1e-7);
        return td;
      }
      r.append(h("td", null, setName(x.S)), h("td", "wide", setName(x.C)), h("td", "wide", plansName(x.plans)), h("td", "num", fv(x.v)),
        h("td", "num wide", fv(x.r)), cell(res.phi), cell(res.sigma), pr ? cell(pr.u) : h("td", "num", t("stplk.w.dash")));
      b2.appendChild(r);
    });
    tc.appendChild(b2);
    var hc = $("pl-coal"); hc.textContent = ""; hc.appendChild(tc);
  }

  function plansBox() {
    var plans = res.grand.plans, box = $("pl-plans-box"), seg = $("pl-plans");
    box.hidden = plans.length < 2;
    seg.textContent = "";
    if (plans.length < 2) return;
    plans.forEach(function (pl, z) {
      var b = h("button", null, planName(pl)); b.type = "button";
      b.setAttribute("aria-pressed", String(z === planIdx));
      b.addEventListener("click", function () { planIdx = z; drawAll(); });
      seg.appendChild(b);
    });
  }

  function drawAll() {
    plansBox();
    drawNet();
    drawBars();
    tables();
  }

  function update() {
    res = Lockers.solve(inst, own, lam);
    var sig = res.grand.plans.map(planName).join("|");
    if (sig !== planSig) { planIdx = 0; planSig = sig; }
    document.querySelectorAll("#pl-presets button").forEach(function (b) {
      var P = PRESETS[b.getAttribute("data-preset")];
      b.setAttribute("aria-pressed", String(P === inst && sameOwn(P.own, own) && Math.abs(lam - 1) < 1e-9));
    });
    $("pl-l").value = String(lam);
    $("pl-l-out").textContent = t("stplk.w.lam.out", { l: I18N.fmt(lam, 2, 2) });
    var alone = 0; res.floors.forEach(function (x) { alone += x; });
    var k = $("pl-kpis"); k.textContent = "";
    k.append(kpi(t("stplk.w.k.alone"), fv(alone)), kpi(t("stplk.w.k.vN"), fv(res.vN), "accent"), kpi(t("stplk.w.k.rN"), fv(res.rN)),
      kpi(t("stplk.w.k.gap"), fv(res.gap)),
      kpi(t("stplk.w.k.core"), t(res.coreNonEmpty ? "stplk.w.core.yes" : "stplk.w.core.no"), res.coreNonEmpty ? null : "warn"),
      kpi(t("stplk.w.k.gamma"), res.gamma > 0 && res.vN > 1e-9 ? fv(res.gamma) + " (" + pct(res.gamma / res.vN) + ")" : fv(res.gamma), res.gamma > 0 ? "warn" : null));
    chain();
    verdict();
    drawAll();
  }

  // events
  document.querySelectorAll("#pl-presets button").forEach(function (b) {
    b.addEventListener("click", function () {
      key = b.getAttribute("data-preset"); inst = PRESETS[key]; own = Object.assign({}, inst.own); lam = 1; planSig = ""; schedule();
    });
  });
  $("pl-l").addEventListener("input", function () { lam = +this.value; schedule(); });

  I18N.onChange(update);
  var resizeTimer, lastW = 0;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var w = $("pl-net").clientWidth;
      if (res && w !== lastW) { lastW = w; drawNet(); drawBars(); }
    }, 120);
  });
})();
</script>
