<script>
(function () {
  "use strict";
  var t = I18N.t;
  var TOL = 1e-9;
  function near(a, b) { return Math.abs(a - b) <= TOL * Math.max(1, Math.abs(a), Math.abs(b)); }
  function add(s, v) { return s + v; }

  // ---- the streaming platform game of the article (Section 3), computed live ----
  var Game = (function () {
    function bits(m) { var c = 0; while (m) { c += m & 1; m >>= 1; } return c; }
    function members(mask, n) { var a = []; for (var i = 0; i < n; i++) if (mask & (1 << i)) a.push(i); return a; }

    // Section 3.2: the users S reaches (U^S), what each would pay for S's platform (t^S_j), and the fees that maximize
    // p |Q^S(p)|. The maximum sits at one of the t^S_j, so every candidate is checked and every optimal fee is kept (P^S).
    function own(V, r, S) {
      var m = r.length, tS = [], reach = [], j;
      for (j = 0; j < m; j++) {
        var s = 0; S.forEach(function (i) { s += V[i][j]; });
        tS.push(s > 0 ? r[j] * s : 0);
        if (s > 0) reach.push(j);
      }
      var cands = [];
      reach.forEach(function (j) { if (!cands.some(function (c) { return near(c.p, tS[j]); })) cands.push({ p: tS[j] }); });
      cands.forEach(function (c) {
        c.subs = reach.filter(function (k) { return tS[k] >= c.p || near(tS[k], c.p); });
        c.rev = c.p * c.subs.length;
      });
      cands.sort(function (a, b) { return a.p - b.p; });
      var best = Math.max.apply(null, cands.map(function (c) { return c.rev; }));
      cands.forEach(function (c) { c.opt = near(c.rev, best); });
      var P = cands.filter(function (c) { return c.opt; });
      return { t: tS, reach: reach, cands: cands, best: best, P: P, keepsAll: P.some(function (c) { return c.subs.length === m; }) };
    }

    function analyse(V, r) {
      var n = V.length, m = r.length, full = (1 << n) - 1, i, j;
      // the existing platform: the largest fee at which every user stays, p^N = min_j r_j sum_i V_ij
      var stay = [];
      for (j = 0; j < m; j++) { var s = 0; for (i = 0; i < n; i++) s += V[i][j]; stay.push(r[j] * s); }
      var pN = Math.min.apply(null, stay), vN = pN * m;
      var masks = []; for (var k = 1; k <= full; k++) masks.push(k);
      masks.sort(function (a, b) { return bits(a) - bits(b) || a - b; });
      var coal = masks.map(function (mask) {
        var S = members(mask, n), o = own(V, r, S);
        o.mask = mask; o.S = S; o.grand = mask === full; o.v = o.grand ? vN : o.best;
        return o;
      });
      var byMask = {}; coal.forEach(function (c) { byMask[c.mask] = c; });
      var proper = coal.filter(function (c) { return !c.grand; });

      // ---- the four market types of Section 4.2 (every optimal fee is checked) ----
      var homogeneous = stay.every(function (w) { return near(w, pN); });
      var inclFail = proper.filter(function (c) { return !c.keepsAll; })[0] || null;
      var singles = proper.filter(function (c) { return c.S.length === 1; });
      var semiFail = singles.filter(function (c) { return !c.keepsAll; })[0] || null;
      var disjoint = null, split = null;
      proper.forEach(function (c) {
        if (disjoint) return;
        var d = byMask[full ^ c.mask];
        if (c.reach.some(function (q) { return d.reach.indexOf(q) >= 0; })) return;
        var common = c.P.filter(function (a) { return d.P.some(function (b) { return near(a.p, b.p); }); });
        if (!common.length) disjoint = { S: c, T: d };
        else if (!split) split = { S: c, T: d, p: common[0].p };
      });

      // ---- the core (Section 4.1): least total that pays every coalition its own revenue, by LP (x >= 0) ----
      var ones = [], zeros = [];
      for (i = 0; i < n; i++) { ones.push(1); zeros.push(0); }
      function ind(S) { return ones.map(function (o, q) { return S.indexOf(q) >= 0 ? 1 : 0; }); }
      var lpA = LP.solve({ sense: "min", c: ones, rows: proper.map(function (c) { return { a: ind(c.S), op: ">=", b: c.v }; }) });
      var need = lpA.z, stable = need <= vN + 1e-7 * Math.max(1, vN);
      var weights = proper.map(function (c, q) { return { c: c, w: lpA.duals[q] }; }).filter(function (w) { return w.w > 1e-9; });
      // a core allocation that keeps the smallest surplus over all coalitions as large as possible
      var lpx = null, eps = null;
      if (stable) {
        var rows = proper.map(function (c) { return { a: ind(c.S).concat([-1, 1]), op: ">=", b: c.v }; });
        rows.push({ a: ones.concat([0, 0]), op: "=", b: vN });
        var lpB = LP.solve({ sense: "max", c: zeros.concat([1, -1]), rows: rows });
        if (lpB.status === "optimal") { lpx = lpB.x.slice(0, n); eps = lpB.x[n] - lpB.x[n + 1]; }
      }

      // ---- allocations: the two constructions of the proofs and the two rules of ref. [6] ----
      function check(x) {
        var tot = x.reduce(add, 0), eff = Math.abs(tot - vN) <= 1e-7 * Math.max(1, vN), worst = null;
        proper.forEach(function (c) {
          var xs = 0; c.S.forEach(function (q) { xs += x[q]; });
          var gap = c.v - xs;
          if (gap > 1e-7 * Math.max(1, c.v) && (!worst || gap > worst.gap)) worst = { c: c, xs: xs, gap: gap };
        });
        var neg = x.some(function (v) { return v < -1e-9; });
        return { x: x, sum: tot, eff: eff, worst: worst, neg: neg, core: eff && !worst && !neg };
      }
      // Proposition 2: any user j* who pays exactly p^N to stay; every such user is tried, the first in the core is shown
      var p2 = [];
      for (j = 0; j < m; j++) if (near(stay[j], pN)) {
        var c2 = check(V.map(function (row) { return r[j] * row[j] * m; })); c2.j = j; p2.push(c2);
      }
      var prop2 = p2.filter(function (c) { return c.core; })[0] || p2[0];
      var prop4 = check(V.map(function (row) { return row.reduce(function (s, v, q) { return s + r[q] * v; }, 0); }));
      var total = 0, col = [];
      for (j = 0; j < m; j++) { var cs = 0; for (i = 0; i < n; i++) cs += V[i][j]; col.push(cs); total += cs; }
      var prorata = check(V.map(function (row) { return vN * row.reduce(add, 0) / total; }));
      var usercentric = check(V.map(function (row) { return row.reduce(function (s, v, q) { return s + pN * v / col[q]; }, 0); }));

      return {
        n: n, m: m, full: full, stay: stay, pN: pN, vN: vN, coal: coal, byMask: byMask, proper: proper,
        homogeneous: homogeneous, inclusive: !inclFail, inclFail: inclFail, semi: !semiFail, semiFail: semiFail,
        disjoint: disjoint, split: split, need: need, stable: stable, weights: weights, lp: lpx ? check(lpx) : null, eps: eps,
        prop2: prop2, prop2all: p2, prop4: prop4, prorata: prorata, usercentric: usercentric,
        alone: singles.map(function (c) { return c.v; }).reduce(add, 0)
      };
    }
    return { own: own, analyse: analyse };
  })();

  // ---- Section 5: V^{alpha,beta} with alpha = k/20 and beta = 40 b, so every entry is an integer ----
  function pathV(k, b) {
    var beta = 40 * b;
    return [[beta * (20 + k) / 40, 200 - 10 * k], [beta * (20 - k) / 40, 200 + 10 * k]];
  }
  function pathPoint(k, b) {
    var V = pathV(k, b), r = [1, 1];
    var a = Game.own(V, r, [0]), c = Game.own(V, r, [1]);
    var stay = [V[0][0] + V[1][0], V[0][1] + V[1][1]], vN = Math.min(stay[0], stay[1]) * 2;
    // two creators: the core is non-empty exactly when v({i1}) + v({i2}) <= v(N)
    return { k: k, v1: a.best, v2: c.best, sum: a.best + c.best, vN: vN, stable: a.best + c.best <= vN + TOL };
  }

  // ---- the widget ----
  var PRESETS = {
    ex1: { V: [[2, 2, 0], [4, 0, 4], [6, 4, 0]], r: [1, 2, 3], sel: 3 },   // Example 1 (pp. 3-4)

  // ---- the revenue p |Q^S(p)| of the selected coalition's own platform (the figure of Example 1, p. 3) ----

  function drawPath() {

    var host = $("sp-pchart"); host.textContent = "";
    var W = boxWidth("sp-pchart"), H = W < 520 ? 210 : 240, ML = 46, MR = 16, MT = 16, MB = 34;
    var vN = pts[0].vN, lo = Math.min(vN, Math.min.apply(null, pts.map(function (p) { return p.sum; })));

    var s = svg("svg", { viewBox: "0 0 " + W + " " + H, width: W, height: H, "aria-hidden": "true" });
    for (var v = y0; v <= y1 + 1e-9; v += tk.step) {
      s.appendChild(svg("line", { "class": "grid", x1: X(0), x2: X(20), y1: Y(v), y2: Y(v) }));
      s.appendChild(svg("text", { "class": "tick", x: ML - 7, y: Y(v) + 4, "text-anchor": "end" }, fv(v)));
    }
    [0, 5, 10, 15, 20].forEach(function (q) {
      s.appendChild(svg("text", { "class": "tick", x: X(q), y: H - MB + 16, "text-anchor": "middle" }, I18N.fmt(q / 20, 2)));
    });
    s.appendChild(svg("text", { "class": "lab", x: X(20), y: H - 2, "text-anchor": "end" }, "α"));
    s.appendChild(svg("line", { "class": "guide", x1: X(pk), x2: X(pk), y1: MT, y2: H - MB }));
    s.appendChild(svg("line", { "class": "vn", x1: X(0), x2: X(20), y1: Y(vN), y2: Y(vN) }));
    var vlab = svg("text", { "class": "vn-t", x: X(0) + 4, y: Y(vN) + 16 }, "v(N) = " + fv(vN));
    s.appendChild(svg("polyline", { "class": "pline", points: pts.map(function (p) { return X(p.k) + "," + Y(p.sum); }).join(" ") }));
    pts.forEach(function (p) { s.appendChild(svg("circle", { "class": p.stable ? "st" : "un", cx: X(p.k), cy: Y(p.sum), r: 4.5 })); });
    s.appendChild(svg("circle", { "class": "cur", cx: X(pk), cy: Y(pts[pk].sum), r: 9 }));
    s.appendChild(vlab);
    s.addEventListener("click", function (e) {
      var rect = s.getBoundingClientRect(), x = (e.clientX - rect.left) * W / rect.width;
      var k2 = Math.max(0, Math.min(20, Math.round((x - ML) / (W - ML - MR) * 20)));
      if (k2 !== pk) { pk = k2; $("sp-alpha").value = String(pk); V = pathV(pk, pb); r = [1, 1]; pathMode = true; buildMatrix(); schedule(); }
    });
    host.appendChild(s);
    var leg = $("sp-plegend"); leg.textContent = "";
    [["st", t("ststr.w.leg.stable")], ["un", t("ststr.w.leg.unstable")], ["vn", t("ststr.w.leg.vN")]].forEach(function (L) {
      var sp = h("span"); sp.append(h("i", L[0]), h("span", null, L[1])); leg.appendChild(sp);
    });
    var cur = pts[pk], sw = 0;
    for (var q = 1; q <= 20; q++) if (pts[q].stable !== pts[q - 1].stable) sw++;
    var a = I18N.fmt(pk / 20, 2), b = fv(40 * pb);
    var cap = t(cur.stable ? "ststr.w.path.st" : "ststr.w.path.un", { a: a, b: b, v1: fv(cur.v1), v2: fv(cur.v2), s: fv(cur.sum), vN: fv(cur.vN) });
    cap += " " + (sw === 0 ? t(pts[0].stable ? "ststr.w.path.sw0st" : "ststr.w.path.sw0un") : sw === 1 ? t("ststr.w.path.sw1") : t("ststr.w.path.swN", { k: sw }));
    $("sp-pcap").innerHTML = cap;
    $("sp-alpha-out").textContent = a;
    $("sp-beta-out").textContent = b;
  }

  function update() {
    // controls
    document.querySelectorAll("#sp-n button").forEach(function (b) { b.setAttribute("aria-pressed", String(+b.getAttribute("data-n") === V.length)); });
    document.querySelectorAll("#sp-m button").forEach(function (b) { b.setAttribute("aria-pressed", String(+b.getAttribute("data-m") === r.length)); });
    document.querySelectorAll("#sp-presets button").forEach(function (b) {
      var name = b.getAttribute("data-preset");
      b.setAttribute("aria-pressed", String(name === "path" ? pathMode : !pathMode && same(PRESETS[name])));
    });
    $("sp-path").hidden = !pathMode;
    $("sp-alpha-lbl").innerHTML = t("ststr.w.alpha");
    $("sp-beta-lbl").innerHTML = t("ststr.w.beta");
    // keep the inputs in step with the state, except the one being typed in
    inputs.forEach(function (q) {
      if (q.el === document.activeElement) return;
      var val = q.kind === "r" ? r[q.b] : V[q.a][q.b];
      if (+q.el.value !== val) q.el.value = String(val);
    });
    if (pathMode) drawPath();
    var err = validity();
    $("sp-err").hidden = !err; $("sp-err").innerHTML = err || "";
    $("sp-out").hidden = !!err;
    for (var j = 0; j < r.length; j++) {
      var cell = $("sp-pay" + j); if (!cell) continue;
      var s = 0; for (var i = 0; i < V.length; i++) s += V[i][j];
      cell.textContent = fv(r[j] * s);
      cell.className = "";
    }
    if (err) { res = null; return; }
    res = Game.analyse(V, r);
    res.stay.forEach(function (w, q) { var c = $("sp-pay" + q); if (c && near(w, res.pN)) c.className = "min"; });
    if (!res.byMask[sel]) sel = 1;
    var k = $("sp-kpis"); k.textContent = "";
    k.append(kpi(t("ststr.w.k.pN"), fv(res.pN)), kpi(t("ststr.w.k.vN"), fv(res.vN), "accent"),
      kpi(t("ststr.w.k.alone"), fv(res.alone), res.alone > res.vN + TOL ? "warn" : null),
      kpi(t("ststr.w.k.core"), t(res.stable ? "ststr.w.core.yes" : "ststr.w.core.no"), res.stable ? null : "warn"));
    verdict();
    conditions();
    coalButtons();
    drawRevenue();
    tables();
  }

  // events
  document.querySelectorAll("#sp-presets button").forEach(function (b) {
    b.addEventListener("click", function () { load(b.getAttribute("data-preset")); });
  });
  document.querySelectorAll("#sp-n button").forEach(function (b) {
    b.addEventListener("click", function () { resize(+b.getAttribute("data-n"), r.length); });
  });
  document.querySelectorAll("#sp-m button").forEach(function (b) {
    b.addEventListener("click", function () { resize(V.length, +b.getAttribute("data-m")); });
  });
  $("sp-alpha").addEventListener("input", function () { pk = +this.value; V = pathV(pk, pb); r = [1, 1]; pathMode = true; buildMatrix(); schedule(); });
  $("sp-beta").addEventListener("input", function () { pb = +this.value; V = pathV(pk, pb); r = [1, 1]; pathMode = true; buildMatrix(); schedule(); });

  var started = false;
  I18N.onChange(function () {
    if (!started) { started = true; var p = PRESETS.ex1; V = p.V.map(function (row) { return row.slice(); }); r = p.r.slice(); sel = p.sel; }
    buildMatrix();
    update();
  });
  var resizeTimer, lastW = 0;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var w = $("sp-chart").clientWidth;
      if (res && w !== lastW) { lastW = w; drawRevenue(); if (pathMode) drawPath(); }
    }, 120);
  });
  window.StreamGame = Game; // for checks from the console
})();
</script>
