<script>
(function () {
  "use strict";
  var t = I18N.t;

  // ---- the choice-based resource allocation model of the article, solved live (no hard-coded results) ----
  // Instance I: attractiveness a[i] of the locations, sensitivity bc to one central resource, sensitivities bL[j] to the
  // local resources, budget R, central share g of the CLE and CELP rules, and mu, a factor on the thief's utilities
  // (mu = 1 is the article; in a logit model it is the same as dividing the random error by mu).
  var PK = (function () {
    function lse(z) {
      var m = -Infinity, s = 0;
      z.forEach(function (v) { if (v > m) m = v; });
      if (m === -Infinity) return m;
      z.forEach(function (v) { s += Math.exp(v - m); });
      return m + Math.log(s);
    }
    function softmax(z) { var l = lse(z); return z.map(function (v) { return Math.exp(v - l); }); }
    function sum(a) { return a.reduce(function (s, v) { return s + v; }, 0); }
    function sums(I) { var b = sum(I.bL); return { b: b, S: b + I.bc }; }

    // the four allocations: x = { xc: central budget, X[i][j]: local resource j at location i, w: location weights }
    function rule(I, name) {
      var n = I.a.length, m = I.bL.length, s = sums(I), w;
      if (name === "opt" || name === "fair") {
        // Theorem 2 (eqs. 7, 8) for the thief with utilities mu V, and Theorem 3 (eqs. 10, 11)
        w = softmax(I.a.map(function (ai) { return name === "opt" ? I.mu * ai / (1 + I.mu * s.b) : ai / s.b; }));
        return {
          xc: I.bc * I.R / s.S, w: w,
          X: w.map(function (wi) { return I.bL.map(function (bj) { return bj * I.R / s.S * wi; }); })
        };
      }
      // CLE (eq. 13) and CELP (eq. 14): a share g to the central resource, the rest equally over the local resources,
      // then equally over the locations (CLE) or in proportion to alpha_i (CELP)
      var sa = sum(I.a);
      w = I.a.map(function (ai) { return name === "cle" ? 1 / n : ai / sa; });
      return { xc: I.g * I.R, w: w, X: w.map(function (wi) { return I.bL.map(function () { return (1 - I.g) * I.R / m * wi; }); }) };
    }

    // the thief's answer (eqs. 2, 3), in logs so that very large or very small utilities stay exact
    function evaluate(I, x) {
      var V = I.a.map(function (ai, i) {
        var v = ai - I.bc * Math.log(x.xc);
        I.bL.forEach(function (bj, j) { v -= bj * Math.log(x.X[i][j]); });
        return v;
      });
      var z = V.map(function (v) { return I.mu * v; });
      var L0 = lse([0].concat(z)), lnB = lse(z);
      return {
        V: V, z: z, lnB: lnB, lnP: lnB - L0, P: Math.exp(lnB - L0), P0: Math.exp(-L0),
        Pi: z.map(function (v) { return Math.exp(v - L0); }), maxV: Math.max.apply(null, V)
      };
    }

    // Theorem 1 at Theorem 2's allocation: every partial derivative of B (in logs) against the multiplier of the proof,
    // lambda = -Z^(1+b) S^(1+S) / (R^(1+S) prod beta^beta), all with the scaled parameters mu alpha, mu beta
    function stationarity(I, x, e) {
      var mb = I.bL.map(function (v) { return I.mu * v; }), mc = I.mu * I.bc, b = sum(mb), S = b + mc;
      var Z = lse(I.a.map(function (ai) { return I.mu * ai / (1 + b); }));
      var lnLam = (1 + b) * Z + (1 + S) * Math.log(S) - (1 + S) * Math.log(I.R) - mc * Math.log(mc);
      mb.forEach(function (v) { lnLam -= v * Math.log(v); });
      var dev = Math.abs(Math.log(mc) + e.lnB - Math.log(x.xc) - lnLam), k = 1;
      I.a.forEach(function (ai, i) {
        mb.forEach(function (bj, j) { k++; dev = Math.max(dev, Math.abs(Math.log(bj) + e.z[i] - Math.log(x.X[i][j]) - lnLam)); });
      });
      return { lnLam: lnLam, dev: Math.expm1(dev), k: k };
    }

    // independent check of Theorem 2: Newton's method with backtracking on ln B over every split of the budget,
    // x = R softmax(y), from the equal split (ln B is convex in y; no formula of the article is used)
    function search(I) {
      var n = I.a.length, m = I.bL.length, s = sums(I), d = 1 + n * m, lnR = Math.log(I.R), r, c;
      var beta = [I.bc], own = [-1];
      I.a.forEach(function (ai, i) { I.bL.forEach(function (bj) { beta.push(bj); own.push(i); }); });
      function F(y) {
        var ly = lse(y), q = y.map(function (v) { return Math.exp(v - ly); });
        var z = I.a.map(function (ai, i) {
          var v = ai - I.bc * (lnR + y[0] - ly);
          I.bL.forEach(function (bj, j) { v -= bj * (lnR + y[1 + i * m + j] - ly); });
          return I.mu * v;
        });
        var lz = lse(z), p = z.map(function (v) { return Math.exp(v - lz); });
        // probability that resource r enters the chosen location's utility, under the weights p
        var sh = own.map(function (o) { return o < 0 ? 1 : p[o]; });
        var g = y.map(function (v, k) { return I.mu * (s.S * q[k] - beta[k] * sh[k]); });
        return { f: lz, g: g, q: q, p: p, sh: sh };
      }
      function hessian(st) {
        var H = [];
        for (r = 0; r < d; r++) {
          H.push([]);
          for (c = 0; c < d; c++) {
            var both = r === 0 ? st.sh[c] : c === 0 ? st.sh[r] : own[r] === own[c] ? st.p[own[r]] : 0;
            var cov = I.mu * I.mu * beta[r] * beta[c] * (both - st.sh[r] * st.sh[c]);
            H[r].push(I.mu * s.S * ((r === c ? st.q[r] : 0) - st.q[r] * st.q[c]) + cov);
          }
        }
        return H;
      }
      function solveLin(A, bb) {   // Gaussian elimination with partial pivoting
        var M = A.map(function (row, k) { return row.concat([bb[k]]); }), N = bb.length, i, j, k;
        for (k = 0; k < N; k++) {
          var piv = k;
          for (i = k + 1; i < N; i++) if (Math.abs(M[i][k]) > Math.abs(M[piv][k])) piv = i;
          var tmp = M[k]; M[k] = M[piv]; M[piv] = tmp;
          for (i = k + 1; i < N; i++) { var fct = M[i][k] / M[k][k]; for (j = k; j <= N; j++) M[i][j] -= fct * M[k][j]; }
        }
        var x = new Array(N);
        for (i = N - 1; i >= 0; i--) { var acc = M[i][N]; for (j = i + 1; j < N; j++) acc -= M[i][j] * x[j]; x[i] = acc / M[i][i]; }
        return x;
      }
      var y = [], it;
      for (r = 0; r < d; r++) y.push(0);
      var cur = F(y);
      for (it = 0; it < 200; it++) {
        var H = hessian(cur), tr = 0;
        for (r = 0; r < d; r++) tr += H[r][r];
        for (r = 0; r < d; r++) H[r][r] += 1e-12 * tr;   // ln B does not change when y shifts by a constant
        var step = solveLin(H, cur.g.map(function (v) { return -v; })), dec = 0;
        step.forEach(function (v, k) { dec -= v * cur.g[k]; });
        if (!(dec > 1e-20)) break;
        var tt = 1, next = null, yn = null;
        for (var bt = 0; bt < 60; bt++) {
          yn = y.map(function (v, k) { return v + tt * step[k]; });
          next = F(yn);
          if (next.f <= cur.f - 0.25 * tt * dec) break;
          tt /= 2;
        }
        if (!(next.f <= cur.f)) break;
        y = yn; cur = next;
      }
      var ly = lse(y), x = { xc: I.R * Math.exp(y[0] - ly), X: [] };
      I.a.forEach(function (ai, i) { x.X.push(I.bL.map(function (bj, j) { return I.R * Math.exp(y[1 + i * m + j] - ly); })); });
      return { x: x, it: it };
    }

    // independent check of Theorems 3 and 4: the deterministic thief (eq. 12). Bisection on the best utility t: for a
    // given t and central budget, each location needs sum_j beta_j ln x_ij >= alpha_i - t - beta_c ln x_c, whose cheapest
    // split is x_ij = beta_j lambda_i (one Lagrange condition per location); the central budget is chosen by golden
    // section search, and t is lowered until the cheapest such plan costs exactly R.
    function minmax(I) {
      var s = sums(I), b = s.b, K = 0;
      I.bL.forEach(function (bj) { K += bj * Math.log(bj); });
      function cost(tt, u) { var c = Math.exp(u); I.a.forEach(function (ai) { c += b * Math.exp((ai - tt - I.bc * u - K) / b); }); return c; }
      function cheapest(tt) {
        var lo = Math.log(I.R) - 60, hi = Math.log(I.R) + 1, q = (Math.sqrt(5) - 1) / 2;
        var c = hi - q * (hi - lo), d = lo + q * (hi - lo), fc = cost(tt, c), fd = cost(tt, d);
        for (var it = 0; it < 160; it++) {
          if (fc < fd) { hi = d; d = c; fd = fc; c = hi - q * (hi - lo); fc = cost(tt, c); }
          else { lo = c; c = d; fc = fd; d = lo + q * (hi - lo); fd = cost(tt, d); }
        }
        var u = (lo + hi) / 2;
        return { u: u, c: cost(tt, u) };
      }
      // bracket: the equal split is feasible, so its best utility is attainable; go down until the plan costs too much
      var eq = { xc: I.R / (1 + I.a.length * I.bL.length), X: I.a.map(function () { return I.bL.map(function () { return I.R / (1 + I.a.length * I.bL.length); }); }) };
      var tHi = evaluate(I, eq).maxV, tLo = tHi - 1;
      while (cheapest(tLo).c <= I.R) tLo -= 2 * (tHi - tLo);
      for (var k = 0; k < 200; k++) {
        var mid = (tLo + tHi) / 2;
        if (cheapest(mid).c > I.R) tLo = mid; else tHi = mid;
      }
      var best = cheapest(tHi), u = best.u, x = { xc: Math.exp(u), X: [] };
      I.a.forEach(function (ai) {
        var lam = Math.exp((ai - tHi - I.bc * u - K) / b);
        x.X.push(I.bL.map(function (bj) { return bj * lam; }));
      });
      return { t: tHi, x: x };
    }

    function gap(x, y) {
      var d = Math.abs(x.xc - y.xc);
      x.X.forEach(function (row, i) { row.forEach(function (v, j) { d = Math.max(d, Math.abs(v - y.X[i][j])); }); });
      return d;
    }
    function weightsAt(I, mu) { var b = sum(I.bL); return softmax(I.a.map(function (ai) { return mu * ai / (1 + mu * b); })); }

    return { rule: rule, evaluate: evaluate, stationarity: stationarity, search: search, minmax: minmax, gap: gap, weightsAt: weightsAt, sums: sums };
  })();

  // ---- the widget ----
  var L16 = Math.log(16), L4 = Math.log(4);
  var PRESETS = {
    paris: { a: [L16, L4], bc: 1, bL: [0.5, 0.5], R: 60, g: 0.5 },          // Examples 1, 2 and 4 (pp. 584-586)
    ex3: { a: [L4, L16], bc: 1, bL: [2], R: 5, g: 0.5 },                     // Example 3 (p. 586): L = {3}, C = {4}

      s.out.innerHTML = sliderText(s);
      var v = s.get();
      if (Math.abs(+s.inp.value - v) > +s.inp.step / 2 + 1e-12) s.inp.value = String(v);
    });
    var mi = $("pk-mu-in"), lm = Math.log10(I.mu);
    if (Math.abs(+mi.value - lm) > 0.006) mi.value = String(lm);
    $("pk-mu-out").textContent = I18N.fmt(I.mu, I.mu < 10 ? 2 : 1, I.mu < 10 ? 2 : 1);
    $("pk-mu-reset").disabled = Math.abs(I.mu - 1) < 1e-12;
    // numbers
    var k = $("pk-kpis"); k.textContent = "";
    k.append(kpi(t("stpkp.w.k.opt"), pct(res.rules.opt.e.P), "accent"), kpi(t("stpkp.w.k.fair"), pct(res.rules.fair.e.P)),
      kpi(t("stpkp.w.k.cost"), "+" + share(res.cost)),
      kpi(t("stpkp.w.k.cle", { g: I18N.fmt(I.g, 2, 2) }), pct(res.rules.cle.e.P)),
      kpi(t("stpkp.w.k.celp", { g: I18N.fmt(I.g, 2, 2) }), pct(res.rules.celp.e.P)));
    verdict();
    drawBudget();
    drawRisk();
    table();
    drawMu();
    checks();
  }

  // events
  document.querySelectorAll("#pk-presets button").forEach(function (b) {
    b.addEventListener("click", function () { I = load(b.getAttribute("data-preset")); schedule(); });
  });
  document.querySelectorAll("#pk-n button").forEach(function (b) {
    b.addEventListener("click", function () {
      var n = +b.getAttribute("data-n");
      if (n === 3 && I.a.length === 2) I.a.push(1);
      if (n === 2 && I.a.length === 3) I.a.pop();
      schedule();
    });
  });
  document.querySelectorAll("#pk-m button").forEach(function (b) {
    b.addEventListener("click", function () {
      var m = +b.getAttribute("data-m");
      if (m === 2 && I.bL.length === 1) I.bL.push(0.5);
      if (m === 1 && I.bL.length === 2) I.bL.pop();
      schedule();
    });
  });
  $("pk-mu-in").addEventListener("input", function () { I.mu = Math.pow(10, +this.value); if (Math.abs(+this.value) < 0.015) I.mu = 1; schedule(); });
  $("pk-mu-reset").addEventListener("click", function () { I.mu = 1; schedule(); });

  I18N.onChange(function () { shape = ""; update(); });
  var resizeTimer, lastW = 0;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var w = $("pk-budget").clientWidth;
      if (res && w !== lastW) { lastW = w; drawBudget(); drawRisk(); drawMu(); }
    }, 120);
  });
  window.PKmodel = PK;   // exposed for the page's own checks
})();
</script>
