<script>
(function () {
  "use strict";
  var t = I18N.t;

  /* ---- the time-dependent Stackelberg protection location game, solved live (no hard-coded results) ----
     Positions on [0, 1], speed 1, damage of an attack = ∫_0^{min_i |d_i - a|} h(a, t) dt. */
  // TP-START
  var TP = (function () {
    /* A damage rate h(a, t) of class Θ^J: H(a, τ) is the damage ∫_0^τ h(a, t) dt in closed form, jumps lists the jump
       curves t = p(a) = α + β a, h0(a) = h(a, 0) is the rate at the start (the time-constant model that ignores the
       time effect), tvar says whether h changes with t between jumps. */
    function police(k) {
      return {
        id: "police", k: k, tvar: false, jumps: [[1, -1]],
        h: function (a, t) { return t <= 1 - a ? a : k * a; },
        H: function (a, tau) { var p = 1 - a; return tau <= p ? a * tau : a * p + k * a * (tau - p); },
        h0: function (a) { return a; }
      };
    }
    function constant(c) {
      return { id: "ex3", tvar: false, jumps: [], h: function () { return c; }, H: function (a, tau) { return c * tau; }, h0: function () { return c; } };
    }
    function ex4() {
      return { id: "ex4", tvar: true, jumps: [], h: function (a, t) { return 1 - t; },
        H: function (a, tau) { return tau - tau * tau / 2; }, h0: function () { return 1; } };
    }
    function ex5() {
      return { id: "ex5", tvar: true, jumps: [[0.3, 0]], h: function (a, t) { return t <= 0.3 ? 1 - t : 0; },
        H: function (a, tau) { var s = Math.min(tau, 0.3); return s - s * s / 2; }, h0: function () { return 1; } };
    }
    // the time-constant model of the same situation: ĥ(a) = h(a, 0) for all t (a situation of class Θ^C)
    function frozen(rate) {
      return { id: rate.id + "0", tvar: false, jumps: [], h: function (a) { return rate.h0(a); },
        H: function (a, tau) { return rate.h0(a) * tau; }, h0: rate.h0 };
    }

    // damage of an attack at a against the plan d: the rate integrated until the closest team arrives
    function resp(d, a) { var m = Infinity; for (var i = 0; i < d.length; i++) m = Math.min(m, Math.abs(d[i] - a)); return m; }
    function damage(rate, d, a) { return rate.H(a, resp(d, a)); }

    /* max over a in [lo, hi] of H(a, s (a - c)): the closest team sits at c (s = 1: team on the left, s = -1: team on the
       right). Between the jump crossings the damage is a polynomial of degree at most 2 in a for every rate on this page,
       so its maximum on each piece is at an end or at the vertex, which three exact evaluations locate. */
    function maxSide(rate, lo, hi, c, s) {
      function g(a) { return rate.H(a, Math.max(0, s * (a - c))); }
      var best = { v: g(s > 0 ? lo : hi), a: s > 0 ? lo : hi };
      if (!(hi > lo)) return best;
      var cuts = [lo, hi];
      rate.jumps.forEach(function (J) {          // s (a - c) = α + β a
        if (s - J[1] !== 0) { var x = (J[0] + s * c) / (s - J[1]); if (x > lo && x < hi) cuts.push(x); }
      });
      cuts.sort(function (x, y) { return x - y; });
      function consider(a) { var v = g(a); if (v > best.v + 1e-15) best = { v: v, a: a }; }
      for (var k = 0; k + 1 < cuts.length; k++) {
        var p = cuts[k], q = cuts[k + 1];
        if (q - p < 1e-13) continue;
        var m = (p + q) / 2, hh = (q - p) / 2, gp = g(p), gm = g(m), gq = g(q);
        consider(p); consider(q); consider(m);
        var A = (gp - 2 * gm + gq) / (2 * hh * hh), slope = (gq - gp) / (2 * hh);
        if (A < -1e-12) { var x = m - slope / (2 * A); if (x > p && x < q) consider(x); }
      }
      return best;
    }
    // the n + 1 local damage problems of Section 3
    function L(rate, d1) { return maxSide(rate, 0, d1, d1, -1); }
    function R(rate, dn) { return maxSide(rate, dn, 1, dn, 1); }
    function I(rate, di, dj) {
      if (!(dj > di)) return { v: 0, a: di };
      var m = (di + dj) / 2, x = maxSide(rate, di, m, di, 1), y = maxSide(rate, m, dj, dj, -1);
      return y.v > x.v + 1e-15 ? y : x;
    }
    function locals(rate, d) {
      var n = d.length, out = [], l = L(rate, d[0]), r = R(rate, d[n - 1]);
      out.push({ kind: "L", v: l.v, a: l.a, lo: 0, hi: d[0] });
      for (var i = 0; i < n - 1; i++) { var b = I(rate, d[i], d[i + 1]); out.push({ kind: "I", i: i + 1, v: b.v, a: b.a, lo: d[i], hi: d[i + 1] }); }
      out.push({ kind: "R", v: r.v, a: r.a, lo: d[n - 1], hi: 1 });
      return out;
    }
    // the follower's best response: the largest local damage (every attack point lies in one of the n + 1 intervals)
    function worst(rate, d) {
      var loc = locals(rate, d), w = loc[0];
      loc.forEach(function (x) { if (x.v > w.v) w = x; });
      return { v: w.v, a: w.a, loc: loc };
    }

    // largest y in [lo, cap] with g(y) <= z (g non-decreasing, g(lo) <= z); smallest y with g(y) >= z
    function largestLE(g, lo, cap, z) {
      if (g(cap) <= z) return cap;
      var a = lo, b = cap;
      for (var it = 0; it < 56; it++) { var m = (a + b) / 2; if (g(m) <= z) a = m; else b = m; }
      return a;
    }
    function smallestGE(g, lo, cap, z) {
      if (g(lo) >= z) return lo;
      if (g(cap) < z) return cap;
      var a = lo, b = cap;
      for (var it = 0; it < 56; it++) { var m = (a + b) / 2; if (g(m) >= z) b = m; else a = m; }
      return b;
    }
    /* sweeps at a target damage z, from left to right. "far": each team as far right as the local damage on its left
       allows (<= z); "near": each team at the first point where that local damage reaches z. By Lemma 3.7 (L
       non-decreasing, I^i non-increasing in d_i and non-decreasing in d_{i+1}) the far sweep places every team at least as
       far right as any plan whose local damages are all <= z, so z is reachable exactly when the far sweep also keeps the
       right end R(d_n) <= z. */
    function sweep(rate, n, z, far) {
      var d = [], pick = far ? largestLE : smallestGE;
      d.push(pick(function (y) { return L(rate, y).v; }, 0, 1, z));
      for (var i = 1; i < n; i++) {
        var prev = d[i - 1];
        d.push(pick(function (y) { return I(rate, prev, y).v; }, prev, 1, z));
      }
      return d;
    }
    function spread(loc) {
      var mx = -Infinity, mn = Infinity;
      loc.forEach(function (x) { mx = Math.max(mx, x.v); mn = Math.min(mn, x.v); });
      return { max: mx, min: mn, rel: mx > 0 ? (mx - mn) / mx : 0 };
    }
    // the leader's problem (2): 𝒫* by bisection on z, then a balanced optimal plan (Theorem 3.8 says one exists)
    function optimum(rate, n) {
      var zeros = []; for (var i = 0; i < n; i++) zeros.push(0);
      var hi = worst(rate, zeros).v, lo = 0;
      for (var it = 0; it < 64; it++) {
        var z = (lo + hi) / 2, d = sweep(rate, n, z, true);
        if (R(rate, d[n - 1]).v <= z) hi = z; else lo = z;
      }
      var P = hi, far = sweep(rate, n, P, true), near = sweep(rate, n, P * (1 - 1e-11), false);
      var wn = worst(rate, near), wf = worst(rate, far);
      // prefer the plan whose local damages agree best; both must reach the optimum
      var sn = spread(wn.loc).rel, sf = spread(wf.loc).rel;
      var use = (wn.v <= P * (1 + 1e-8) && sn <= sf) ? { d: near, w: wn, s: sn } : { d: far, w: wf, s: sf };
      return { P: P, d: use.d, worst: use.w, spread: use.s, far: far, near: near };
    }
    // the plan of a planner who ignores the time effect: optimal for ĥ(a) = h(a, 0), then evaluated in the true model
    function ignoring(rate, n) {
      var f = frozen(rate), o = optimum(f, n);
      return { d: o.d, Pmodel: o.P, worst: worst(rate, o.d) };
    }
    return { police: police, constant: constant, ex4: ex4, ex5: ex5, frozen: frozen, resp: resp, damage: damage,
      maxSide: maxSide, L: L, R: R, I: I, locals: locals, worst: worst, sweep: sweep, spread: spread,
      optimum: optimum, ignoring: ignoring };
  })();
  // TP-END

  // ---- the widget ----
  var NMAX = 6, TOL = 1e-9;
  var ART = { ex3: [0.2, 0.8], ex4: [0.2, 0.8], ex5: [0, 0.8] };   // Examples 1 to 5 (n = 2, attack at a = 0.4)
  var st = { h: "police", k: 0.5, n: 4, plan: "opt", d: null, a: 0.5, userA: false };
  var cache = {}, pending = false, view = null, cur = null;
  var $ = function (id) { return document.getElementById(id); };
  var NS = "http://www.w3.org/2000/svg";
  function svg(tag, attrs, text) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }
  function h(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  function rateOf() {
    return st.h === "police" ? TP.police(st.k) : st.h === "ex3" ? TP.constant(1) : st.h === "ex4" ? TP.ex4() : TP.ex5();
  }
  // the leader's optimum and the plan that ignores the time effect, for the current rate and n teams (cached)
  function solved(n) {
    var key = st.h + (st.h === "police" ? ":" + st.k : "") + "|" + n;
    if (!cache[key]) { var r = rateOf(); cache[key] = { opt: TP.optimum(r, n), ign: TP.ignoring(r, n) }; }
    return cache[key];
  }
  function artPlan() { return st.n === 2 && ART[st.h] ? ART[st.h] : null; }
  function plan() {
    var S = solved(st.n);

      for (i = 1; i <= n; i++) { d41.push(Math.sqrt((2 + n) * i) - Math.sqrt(n * i)); d53.push(2 * Math.sqrt(i) * (Math.sqrt(n + 1) - Math.sqrt(n))); }
      var v41 = 0.5 * (1 + n - Math.sqrt(2 * n + n * n)), v53 = Math.pow(Math.sqrt(n + 1) - Math.sqrt(n), 2);
      if (rate.k === 0.5) {
        var e1 = Math.max(agree(d41, S.opt.d), Math.abs(v41 - S.opt.P) / v41);
        out.push(t("sttpl.w.chk.th41", { d: vec(d41), v: f4(v41) }) + " " + (e1 < 1e-9 ? t("sttpl.w.chk.agree") : t("sttpl.w.chk.differ", { x: e1.toExponential(1) })));
      } else out.push(t("sttpl.w.chk.noth", { k: kfmt(rate.k) }));
      var e2 = Math.max(agree(d53, S.ign.d), Math.abs(v53 - S.ign.Pmodel) / v53);
      out.push(t("sttpl.w.chk.th53", { d: vec(d53), v: f4(v53), w: f4(S.ign.worst.v) }) + " " + (e2 < 1e-9 ? t("sttpl.w.chk.agree") : t("sttpl.w.chk.differ", { x: e2.toExponential(1) })));
    } else {
      if (rate.id === "ex3" && n === 2) out.push(t("sttpl.w.chk.ex2", { d: vec(S.opt.d), v: f4(S.opt.P) }));
      out.push(t(rate.id === "ex3" ? "sttpl.w.chk.none" : "sttpl.w.chk.same"));
    }
    $("tp-check").innerHTML = out.join(" ");
  }

  function update() {
    var rate = rateOf(), S = solved(st.n), d = plan(), W = TP.worst(rate, d), spr = TP.spread(W.loc);
    var res = { d: d, v: W.v, a: W.a, loc: W.loc, P: S.opt.P, spr: spr };
    res.optimal = W.v <= S.opt.P * (1 + TOL) + 1e-15;
    res.balanced = spr.rel <= TOL;
    res.inc = S.ign.worst.v / S.opt.P - 1;
    if (!st.userA) st.a = W.a;
    cur = { rate: rate, res: res };
    // controls
    document.querySelectorAll("#tp-h button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-h") === st.h)); });
    document.querySelectorAll("#tp-n button").forEach(function (b) { b.setAttribute("aria-pressed", String(+b.getAttribute("data-n") === st.n)); });
    $("tp-k-box").hidden = st.h !== "police";
    document.querySelectorAll("#tp-k button").forEach(function (b) {
      var k = +b.getAttribute("data-k");
      b.textContent = kfmt(k); b.setAttribute("aria-pressed", String(k === st.k));
    });
    var art = artPlan();
    document.querySelectorAll("#tp-plan button").forEach(function (b) {
      var p = b.getAttribute("data-plan");
      if (p === "art") { b.hidden = !art; if (art) b.textContent = t("sttpl.w.plan.art." + st.h, { d: short(art) }); }
      b.setAttribute("aria-pressed", String(p === st.plan));
    });
    var sl = $("tp-teams").children;
    for (var i = 0; i < NMAX; i++) {
      var box = sl[i], on = i < st.n; box.hidden = !on;
      if (!on) continue;
      box.querySelector("label").textContent = t("sttpl.w.team", { i: i + 1 });
      box.querySelector("output").textContent = f4(d[i]);
      var inp = box.querySelector("input"); if (Math.abs(+inp.value - d[i]) > 0.0005) inp.value = String(d[i]);
    }
    var ai = $("tp-a"); if (Math.abs(+ai.value - st.a) > 0.0005) ai.value = String(st.a);
    $("tp-a-out").textContent = f4(st.a);
    // numbers
    var k = $("tp-kpis"); k.textContent = "";
    k.append(kpi(t("sttpl.w.k.plan"), f4(W.v), res.optimal ? "accent" : "warn"), kpi(t("sttpl.w.k.opt"), f4(S.opt.P)),
      kpi(t("sttpl.w.k.atk"), "a = " + f4(W.a)), kpi(t("sttpl.w.k.bal"), t(res.balanced ? "sttpl.w.yes" : "sttpl.w.no"), res.balanced ? null : "warn"),
      kpi(t("sttpl.w.k.ign"), res.inc > TOL ? "+" + pct(res.inc) : pct(0), res.inc > TOL ? "warn" : null));
    drawProfile(rate, d, res);
    verdict(rate, res, S);
    checks(rate, S);
    drawArea(rate, d);
    attackText(rate, res);
    table(rate, res);
    var bars = [];
    for (var m = 1; m <= NMAX; m++) { var Sm = solved(m); bars.push(Math.max(0, Sm.ign.worst.v / Sm.opt.P - 1)); }
    drawBars(bars);
  }

  // events
  document.querySelectorAll("#tp-h button").forEach(function (b) {
    b.addEventListener("click", function () {
      st.h = b.getAttribute("data-h");
      if (st.plan === "art" && !artPlan()) st.plan = "opt";
      st.userA = false; schedule();
    });
  });
  document.querySelectorAll("#tp-n button").forEach(function (b) {
    b.addEventListener("click", function () {
      st.n = +b.getAttribute("data-n");
      if (st.plan === "own" || (st.plan === "art" && !artPlan())) st.plan = "opt";
      st.userA = false; schedule();
    });
  });
  document.querySelectorAll("#tp-k button").forEach(function (b) {
    b.addEventListener("click", function () { st.k = +b.getAttribute("data-k"); st.userA = false; schedule(); });
  });
  document.querySelectorAll("#tp-plan button").forEach(function (b) {
    b.addEventListener("click", function () {
      var p = b.getAttribute("data-plan");
      if (p === "own") { st.d = plan(); st.plan = "own"; st.userA = false; }
      else if (p === "art") { st.plan = "art"; st.a = 0.4; st.userA = true; }       // the attack of Examples 1, 3, 4 and 5
      else { st.plan = p; st.userA = false; }
      schedule();
    });
  });
  $("tp-a").addEventListener("input", function () { st.a = +this.value; st.userA = true; schedule(); });
  $("tp-a-best").addEventListener("click", function () { st.userA = false; schedule(); });

  buildTeams();
  I18N.onChange(update);
  var resizeTimer, lastW = 0;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var w = $("tp-prof").clientWidth;
      if (cur && w !== lastW) { lastW = w; update(); }
    }, 120);
  });
})();
</script>
