<script>
(function () {
  "use strict";
  var t = I18N.t;

  // ---- core start: the two bodyguard games of the article, solved live (no hard-coded results) ----
  var BG = (function () {
    var TOL = 1e-9;
    // damage g_i(z) for integer z: constant from b_i on
    function gz(gi, b, z) { return gi[Math.min(z, b)]; }
    // h_i(x): expected damage of a consistent strategy, the interpolation of g_i between floor(x) and ceil(x)
    function h(gi, b, x) {
      if (x >= b) return gi[b];
      var lo = Math.floor(x + 1e-10), f = x - lo;
      if (f < 1e-10) return gi[Math.min(lo, b)];
      return (1 - f) * gi[lo] + f * gi[lo + 1];
    }
    // smallest x with h_i(x) <= r (the water level r reached at target i)
    function level(gi, b, r) {
      if (r >= gi[0]) return 0;
      for (var j = 0; j < b; j++) if (gi[j + 1] <= r) return j + (gi[j] - r) / (gi[j] - gi[j + 1]);
      return Infinity;
    }
    // rows "v >= every affine piece of h_i" and "v >= g_i(b_i)" (LP (9) and LP (14)); x_i at column i, v at column V
    function damageRows(G, B, nv, V) {
      var rows = [];
      G.forEach(function (gi, i) {
        for (var j = 0; j < B[i]; j++) {
          var s = gi[j + 1] - gi[j], a = new Array(nv).fill(0);
          a[V] = 1; a[i] = -s;
          rows.push({ a: a, op: ">=", b: gi[j] - s * j });
        }
        var a2 = new Array(nv).fill(0); a2[V] = 1;
        rows.push({ a: a2, op: ">=", b: gi[B[i]] });
      });
      return rows;
    }
    // LP (9): min v over the expected allocations x with sum x = k
    function lp9(G, B, k) {
      var n = G.length, nv = n + 1, rows = damageRows(G, B, nv, n), a = new Array(nv).fill(0);
      for (var i = 0; i < n; i++) a[i] = 1;
      rows.push({ a: a, op: "=", b: k });
      var c = new Array(nv).fill(0); c[n] = 1;
      var r = LP.solve({ sense: "min", c: c, rows: rows });
      return { v: r.z, x: r.x.slice(0, n), rows: rows.length, vars: nv, status: r.status };
    }
    // value of a matrix game (rows: attacker targets, columns: defender pure strategies), attacker side
    function gameValue(A) {
      var n = A.length, C = A[0].length, rows = [];
      for (var c = 0; c < C; c++) {
        var a = []; for (var i = 0; i < n; i++) a.push(-A[i][c]); a.push(1);
        rows.push({ a: a, op: "<=", b: 0 });
      }
      var one = []; for (var i2 = 0; i2 < n; i2++) one.push(1); one.push(0);
      rows.push({ a: one, op: "=", b: 1 });
      var cc = new Array(n + 1).fill(0); cc[n] = 1;
      var r = LP.solve({ sense: "max", c: cc, rows: rows });
      return { v: r.z, p: r.x.slice(0, n) };
    }
    // the defender's optimal mix of a matrix game
    function gameMix(A) {
      var n = A.length, C = A[0].length, rows = [];
      for (var i = 0; i < n; i++) {
        var a = A[i].slice(); a.push(-1);
        rows.push({ a: a, op: "<=", b: 0 });
      }
      var one = new Array(C).fill(1); one.push(0);
      rows.push({ a: one, op: "=", b: 1 });
      var cc = new Array(C + 1).fill(0); cc[C] = 1;
      var r = LP.solve({ sense: "min", c: cc, rows: rows });
      return { v: r.z, q: r.x.slice(0, C) };
    }
    // every way to put k bodyguards on n targets (one target per bodyguard)
    function allocations(n, k) {
      var out = [];
      (function rec(pre, left, i) {
        if (i === n - 1) { out.push(pre.concat([left])); return; }
        for (var z = left; z >= 0; z--) rec(pre.concat([z]), left - z, i + 1);
      })([], k, 0);
      return out;
    }
    function binom(a, b) { var r = 1; for (var i = 1; i <= b; i++) r = r * (a - b + i) / i; return Math.round(r); }

    // ---- the allocation game G (Section 3) ----
    function alloc(G, B, k) {
      var n = G.length, i;
      var lp = lp9(G, B, k);
      // the greedy (water-filling) solution of (2): bisection on the common damage level
      var rlo = 0, rhi = 0;
      for (i = 0; i < n; i++) { rlo = Math.max(rlo, G[i][B[i]]); rhi = Math.max(rhi, G[i][0]); }
      function X(r) { var s = 0; for (var q = 0; q < n; q++) s += level(G[q], B[q], r); return s; }
      var r, spare = 0;
      if (X(rlo) <= k + TOL) { r = rlo; spare = k - X(rlo); }
      else {
        var a = rlo, b = rhi;
        for (var it = 0; it < 200; it++) { var m = (a + b) / 2; if (X(m) > k) a = m; else b = m; }
        r = (a + b) / 2;
      }
      var x = G.map(function (gi, q) { return level(gi, B[q], r); });
      if (spare > TOL) {
        // not all bodyguards are needed (endnote 2): the spare ones go to targets 1, 2, ... up to b_i, any placement is optimal
        var left = spare;
        for (i = 0; i < n && left > TOL; i++) { var add = Math.min(left, Math.max(0, B[i] - x[i])); x[i] += add; left -= add; }
        if (left > TOL) x[0] += left;
      }
      var T = [], m = [], y = [], D = [], sat = false;
      for (i = 0; i < n; i++) {
        var mi = Math.floor(x[i] + 1e-9), yi = x[i] - mi;
        if (yi < 1e-9) yi = 0;
        m.push(mi); y.push(yi);
        D.push(gz(G[i], B[i], mi) - gz(G[i], B[i], mi + 1));
        if (x[i] > 1e-9) { T.push(i); if (D[i] < 1e-12) sat = true; }
      }
      var regular = spare <= TOL && !sat && T.length > 0;
      var lam = null, s = null, r6 = null, p = new Array(n).fill(0), i0 = 0;
      if (regular) {
        var inv = 0, sg = 0, sm = 0;
        T.forEach(function (q) { inv += 1 / D[q]; sg += gz(G[q], B[q], m[q]) / D[q]; sm += m[q]; });
        lam = 1 / inv; s = Math.round(k - sm); r6 = (sg - s) * lam;
        T.forEach(function (q) { p[q] = lam / D[q]; });
      } else {
        for (i = 1; i < n; i++) if (G[i][B[i]] > G[i0][B[i0]] + 1e-12) i0 = i;
        p[i0] = 1;
      }
      // the full matrix game over every pure allocation, and the defender's best reply to p
      var pures = allocations(n, k), A = [];
      for (i = 0; i < n; i++) A.push(pures.map(function (z) { return gz(G[i], B[i], z[i]); }));
      var full = gameValue(A);
      var best = Infinity, bestN = 0;
      pures.forEach(function (z, c) {
        var e = 0; for (var q = 0; q < n; q++) e += p[q] * A[q][c];
        if (e < best - 1e-12) { best = e; bestN = 1; } else if (Math.abs(e - best) <= 1e-12) bestN++;
      });
      // the one-draw construction of p. 337: intervals of lengths x_i on [0, k], points u, u+1, ..., u+k-1
      var mix = draw(x, k);
      var hx = x.map(function (xi, q) { return h(G[q], B[q], xi); });
      var mixDamage = G.map(function (gi, q) {
        var e = 0; mix.forEach(function (o) { e += o.p * gz(gi, B[q], o.z[q]); }); return e;
      });
      // special cases of Section 3.5
      var homog = G.every(function (gi, q) { return B[q] === B[0] && gi.every(function (v, j) { return Math.abs(v - G[0][j]) < 1e-12; }); });
      var r12 = null;
      if (homog) {
        var fl = Math.floor(k / n), g0 = gz(G[0], B[0], fl), g1 = gz(G[0], B[0], fl + 1);
        r12 = g0 - (k / n - fl) * (g0 - g1);
      }
      var r11 = null, cand11 = null;
      if (B.every(function (bb) { return bb === 1; })) {
        var order = G.map(function (gi, q) { return q; }).sort(function (u, v) { return G[v][0] - G[u][0] || u - v; });
        var mg1 = Math.max.apply(null, G.map(function (gi) { return gi[1]; }));
        cand11 = [];
        var sInv = 0, sG = 0;
        order.forEach(function (q) {
          var d = G[q][0] - G[q][1];
          if (d < 1e-12) { cand11.push(null); return; }
          sInv += 1 / d; sG += G[q][0] / d;
          cand11.push((sG - k) / sInv);
        });
        r11 = Math.max.apply(null, [mg1].concat(cand11.filter(function (v) { return v != null; })));
        cand11 = { g1: mg1, list: cand11 };
      }
      return {
        n: n, k: k, r: r, lp: lp, x: x, m: m, y: y, D: D, T: T, s: s, lam: lam, r6: r6, p: p, regular: regular,
        spare: spare, i0: i0, full: full, nPure: pures.length, best: best, bestN: bestN, mix: mix, hx: hx,
        mixDamage: mixDamage, homog: homog, r12: r12, r11: r11, cand11: cand11,
        matrixRows: binom(k + n - 1, n - 1), lpRows: lp.rows, lpVars: lp.vars
      };
    }

    // pure allocations produced by the one-draw construction, with their probabilities
    function draw(x, k) {
      var n = x.length, cum = [0], i;

  function drawRuler() {
    var R = resA, host = $("bg-a-ruler"); host.textContent = "";
    var W = boxWidth("bg-a-ruler"), H = 92, L = 14, Rm = 14, Y0 = 30, BH = 24;
    function X(v) { return L + (W - L - Rm) * v / R.k; }
    var s = svg("svg", { viewBox: "0 0 " + W + " " + H, width: W, height: H, "aria-hidden": "true" });
    var cum = 0;
    for (var i = 0; i < R.n; i++) {
      var a = cum, b = cum + R.x[i]; cum = b;
      if (R.x[i] < 1e-9) continue;
      s.appendChild(svg("rect", { "class": "iv c" + (i + 1), x: X(a), y: Y0, width: Math.max(1, X(b) - X(a)), height: BH }));
      if (X(b) - X(a) > 14) s.appendChild(svg("text", { "class": "iv-t", x: (X(a) + X(b)) / 2, y: Y0 + BH / 2 + 4, "text-anchor": "middle" }, String(i + 1)));
    }
    s.appendChild(svg("line", { "class": "axis", x1: X(0), x2: X(R.k), y1: Y0 + BH, y2: Y0 + BH }));
    for (var j = 0; j <= R.k; j++) {
      s.appendChild(svg("line", { "class": "cut", x1: X(j), x2: X(j), y1: Y0 + BH, y2: Y0 + BH + 5 }));
      s.appendChild(svg("text", { "class": "tick", x: X(j), y: Y0 + BH + 18, "text-anchor": "middle" }, String(j)));
    }
    var u = state.a.u;
    for (j = 0; j < R.k; j++) {
      var px = X(u + j);
      s.appendChild(svg("line", { "class": "pin", x1: px, x2: px, y1: Y0 - 6, y2: Y0 + BH }));
      s.appendChild(svg("path", { "class": "pin-h", d: "M" + (px - 5) + " " + (Y0 - 12) + "h10l-5 7z" }));
      s.appendChild(svg("text", { "class": "pin-t", x: px, y: Y0 - 16, "text-anchor": "middle" }, j ? "u+" + j : "u"));
    }
    host.appendChild(s);
  }

  function drawPanelA() {
    var R = resA, u = state.a.u;
    $("bg-u-out").textContent = I18N.fmt(u, 3, 3);
    var cum = [0];
    for (var i = 0; i < R.n; i++) cum.push(cum[i] + R.x[i]);
    var z = BG.realize(cum, u, R.k), who = [];
    for (var j = 0; j < R.k; j++) {
      var t0 = u + j, c = 0;
      for (var q = 0; q < R.n; q++) { if (R.x[q] > 1e-12) { c = q; if (t0 < cum[q + 1] - 1e-12) break; } }
      who.push(c + 1);
    }
    $("bg-a-at").innerHTML = t("stbgd.w.a.at", { u: I18N.fmt(u, 3, 3), who: list(who.map(String)), z: "<b>" + vec(z) + "</b>" });
    drawRuler();
    // the pure allocations of the construction, with their probabilities, and the damage they give
    var rows = R.mix.map(function (o) {
      var hit = o.z.join(",") === z.join(",");
      return { cls: hit ? "is-pick" : null, cells: [[vec(o.z)], [pct(o.p) + (frac(o.p) ? " <span class='wide'>(" + frac(o.p) + ")</span>" : ""), "num"]] };
    });
    rows.push({ cls: "grand", cells: [[t("stbgd.w.a.mixdmg")], ["(" + listD(R.mixDamage.map(f4)) + ")", "num"]] });
    table($("bg-a-mix"), [[t("stbgd.w.t.alloc")], [t("stbgd.w.t.prob"), "num"]], rows);
  }

  // ======================= the scheduling game =======================
  function arcsOn() {
    var S = SCHED[state.s.inst];
    return allowedArcs(S.times).filter(function (e) { return !state.s.off[e[0] + ">" + e[1]]; });
  }
  function solveS() {
    var S = SCHED[state.s.inst], I = S.make(state.s.k), arcs = arcsOn();
    resS = BG.sched(I.G, I.B, state.s.k, arcs);
    resS.G = I.G; resS.B = I.B; resS.arcs = arcs; resS.times = S.times; resS.allowed = allowedArcs(S.times);
  }

  function drawS() {
    var R = resS, host = $("bg-s-chart"); host.textContent = "";
    var W = boxWidth("bg-s-chart"), n = R.n, RH = 40, MT = 12, MB = 30, L = 14, Rm = 18;
    var H = MT + n * RH + MB;
    var t0 = Math.min.apply(null, R.times.map(function (p) { return p[0]; })) - 0.5;
    var t1 = Math.max.apply(null, R.times.map(function (p) { return p[1]; })) + 0.5;
    function X(v) { return L + (W - L - Rm) * (v - t0) / (t1 - t0); }
    function Yc(i) { return MT + i * RH + RH / 2; }
    var s = svg("svg", { viewBox: "0 0 " + W + " " + H, width: W, height: H, "aria-hidden": "true" });
    var every = (X(t0 + 1) - X(t0)) < 34 ? 2 : 1;
    for (var hr = Math.ceil(t0); hr <= t1; hr++) {
      s.appendChild(svg("line", { "class": "grid", x1: X(hr), x2: X(hr), y1: MT, y2: MT + n * RH }));
      if ((hr - Math.ceil(t0)) % every === 0) s.appendChild(svg("text", { "class": "tick", x: X(hr), y: MT + n * RH + 17, "text-anchor": "middle" }, hour(hr)));
    }
    s.appendChild(svg("line", { "class": "axis", x1: X(t0), x2: X(t1), y1: MT + n * RH, y2: MT + n * RH }));
    // transfer arcs: from the end of i to the start of j
    R.allowed.forEach(function (e) {
      var on = R.arcs.some(function (a) { return a[0] === e[0] && a[1] === e[1]; }), cls = on ? "on" : "off";
      var x1 = X(R.times[e[0]][1]), y1 = Yc(e[0]), x2 = X(R.times[e[1]][0]) - 1, y2 = Yc(e[1]), dx = Math.max(18, (x2 - x1) / 2);
      s.appendChild(svg("path", { "class": "arc " + cls, d: "M" + x1 + " " + y1 + "C" + (x1 + dx) + " " + y1 + " " + (x2 - dx) + " " + y2 + " " + (x2 - 6) + " " + y2 }));
      s.appendChild(svg("path", { "class": "head " + cls, d: "M" + (x2 - 8) + " " + (y2 - 4.5) + "L" + x2 + " " + y2 + "L" + (x2 - 8) + " " + (y2 + 4.5) + "z" }));
    });
    for (var i = 0; i < n; i++) {
      var a = X(R.times[i][0]), b = X(R.times[i][1]);
      s.appendChild(svg("rect", { "class": "bar", x: a, y: Yc(i) - 11, width: b - a, height: 22, rx: 2 }));
      var lab = b - a > 84 ? t("stbgd.w.target", { i: i + 1 }) : String(i + 1);
      s.appendChild(svg("text", { "class": "bar-t", x: a + 7, y: Yc(i) + 4 }, lab));
    }
    host.appendChild(s);
    var leg = $("bg-s-leg"); leg.textContent = "";
    [["on", t("stbgd.w.s.leg.on", { k: R.k })], ["off", t("stbgd.w.s.leg.off")]].forEach(function (L2) {
      var sp = h("span"); sp.append(h("i", L2[0]), document.createTextNode(L2[1])); leg.appendChild(sp);
    });
  }

  function arcButtons() {
    var host = $("bg-arcs"); host.textContent = "";
    var all = allowedArcs(SCHED[state.s.inst].times);
    all.forEach(function (e) {
      var key = e[0] + ">" + e[1], b = h("button", "st-btn", (e[0] + 1) + " → " + (e[1] + 1));
      b.type = "button";
      b.setAttribute("aria-pressed", String(!state.s.off[key]));
      b.setAttribute("aria-label", t("stbgd.w.s.arc.aria", { i: e[0] + 1, j: e[1] + 1 }));
      b.addEventListener("click", function () { state.s.off[key] = !state.s.off[key]; schedule(); });
      host.appendChild(b);
    });
  }

  function kpisS() {
    var R = resS, k = $("bg-s-kpis"); k.textContent = "";
    var st = R.star;
    k.append(
      kpi(t("stbgd.w.s.k.noT"), numF(R.noTransfer)),
      kpi(t("stbgd.w.s.k.lp"), numF(R.lp.v)),
      kpi(t("stbgd.w.s.k.exact", { f: I18N.fmt(R.nAll, 0), all: I18N.fmt(R.nScreen, 0) }), numF(R.exact), "accent"),
      kpi(t("stbgd.w.s.k.star", { f: I18N.fmt(R.feas.length, 0), c: I18N.fmt(R.nCand, 0) }), st ? numF(st.v) : t("stbgd.w.dash"), st ? null : "warn")
    );
  }

  function verdictS() {
    var R = resS, v = $("bg-s-verdict"), parts = [], cls = "ok", st = R.star;
    if (!st) {
      cls = "bad";
      parts.push(t("stbgd.w.s.v.none", { c: I18N.fmt(R.nCand, 0), ex: f4(R.exact) }));
    } else if (Math.abs(st.v - R.lp.v) < 1e-7) {
      parts.push(t("stbgd.w.s.v.meet", { lp: f4(R.lp.v), f: I18N.fmt(R.feas.length, 0), c: I18N.fmt(R.nCand, 0), all: I18N.fmt(R.nAll, 0), ex: f4(R.exact) }));
    } else if (Math.abs(st.v - R.exact) < 1e-7) {
      parts.push(t("stbgd.w.s.v.conj", { lp: f4(R.lp.v), ex: f4(R.exact), all: I18N.fmt(R.nAll, 0) }));
    } else {
      cls = "bad";
      parts.push(t("stbgd.w.s.v.gap", { lp: f4(R.lp.v), ex: f4(R.exact), up: f4(st.v) }));
    }
    if (!R.arcs.length) parts.push(t("stbgd.w.s.v.noarcs"));
    else if (R.noTransfer - R.exact > 1e-9) parts.push(t("stbgd.w.s.v.cut", { g: f4(R.noTransfer), ex: f4(R.exact), pct: pct((R.noTransfer - R.exact) / R.noTransfer) }));
    else parts.push(t("stbgd.w.s.v.nocut", { g: f4(R.noTransfer) }));
    if (st) {
      var reuse = st.mix.filter(function (o) { return o.z.reduce(function (a, b) { return a + b; }, 0) > R.k; });
      if (reuse.length) parts.push(t("stbgd.w.s.v.reuse", { k: R.k }));
    }
    v.className = "st-verdict " + cls;
    v.innerHTML = parts.join(" ");
  }

  function tablesS() {
    var R = resS, st = R.star, rows = [];
    for (var i = 0; i < R.n; i++) {
      rows.push({ cells: [[String(i + 1)], [hour(R.times[i][0]) + "-" + hour(R.times[i][1]), "num wide"], [f3(R.G[i][0]), "num wide"],
        [num(R.lp.x[i]) + (frac(R.lp.x[i]) ? " <span class='wide'>(" + frac(R.lp.x[i]) + ")</span>" : ""), "num"],
        [R.opts[i].join(t("stbgd.w.or")), "num"],
        [st ? f3(st.Ez[i]) : t("stbgd.w.dash"), "num"], [st ? f4(st.dmg[i]) : t("stbgd.w.dash"), "num"]] });
    }
    table($("bg-s-tbl"), [[t("stbgd.w.t.target")], [t("stbgd.w.t.time"), "num wide"], [t("stbgd.w.t.g0"), "num wide"], [t("stbgd.w.t.x14"), "num"],
      [t("stbgd.w.t.cand"), "num"], [t("stbgd.w.t.Ez"), "num"], [t("stbgd.w.t.dmg"), "num"]], rows);
    var mrows = [];
    if (st) st.mix.forEach(function (o) {
      var sum = o.z.reduce(function (a, b) { return a + b; }, 0);
      mrows.push({ cells: [[vec(o.z)], [String(sum) + (sum > R.k ? " &gt; " + R.k : ""), "num"], [pct(o.p) + (frac(o.p) ? " <span class='wide'>(" + frac(o.p) + ")</span>" : ""), "num"]] });
    });
    table($("bg-s-mix"), [[t("stbgd.w.t.z")], [t("stbgd.w.t.sum"), "num"], [t("stbgd.w.t.prob"), "num"]], mrows);
  }

  // ======================= controls =======================
  function update() {
    var m = state.mode;
    document.querySelectorAll("#bg-mode button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-mode") === m)); });
    var cur = m === "alloc" ? state.a : state.s, kmax = m === "alloc" ? 6 : 4;
    document.querySelectorAll("#bg-k button").forEach(function (b) {
      var kk = +b.getAttribute("data-k");
      b.hidden = kk > kmax;
      b.setAttribute("aria-pressed", String(kk === cur.k));
    });
    document.querySelectorAll("#bg-inst button").forEach(function (b) {
      b.hidden = b.getAttribute("data-mode") !== m;
      b.setAttribute("aria-pressed", String(b.getAttribute("data-inst") === cur.inst));
    });
    $("bg-alloc").hidden = m !== "alloc";
    $("bg-sched").hidden = m !== "sched";
    if (m === "alloc") {
      solveA(); drawA(); kpisA(); verdictA(); tableA(); drawPanelA();
    } else {
      solveS(); arcButtons(); drawS(); kpisS(); verdictS(); tablesS();
    }
  }

  document.querySelectorAll("#bg-mode button").forEach(function (b) {
    b.addEventListener("click", function () { state.mode = b.getAttribute("data-mode"); schedule(); });
  });
  document.querySelectorAll("#bg-k button").forEach(function (b) {
    b.addEventListener("click", function () { (state.mode === "alloc" ? state.a : state.s).k = +b.getAttribute("data-k"); schedule(); });
  });
  document.querySelectorAll("#bg-inst button").forEach(function (b) {
    b.addEventListener("click", function () {
      var id = b.getAttribute("data-inst");
      if (state.mode === "alloc") { state.a.inst = id; state.a.k = ALLOC[id].k; }
      else { state.s.inst = id; state.s.k = SCHED[id].k; state.s.off = {}; }
      schedule();
    });
  });
  $("bg-u").addEventListener("input", function () { state.a.u = +this.value; if (resA) drawPanelA(); });

  I18N.onChange(update);
  var resizeTimer, lastW = 0;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var w = $("study-try").clientWidth;
      if (w !== lastW) { lastW = w; if (state.mode === "alloc" && resA) { drawA(); drawRuler(); } else if (resS) drawS(); }
    }, 120);
  });
})();
</script>
