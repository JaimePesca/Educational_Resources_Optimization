<script>
(function () {
  "use strict";
  var t = I18N.t;

  // ---- the transport choice (TC) game of the article, solved live (no hard-coded results) ----
  var TC = (function () {
    function add(s, v) { return s + v; }
    function cmpSets(a, b) {
      for (var i = 0; i < Math.min(a.length, b.length); i++) if (a[i] !== b[i]) return a[i] - b[i];
      return a.length - b.length;
    }
    // every non-empty coalition, by size and then lexicographic; the grand coalition is last
    function coalitions(n) {
      var out = [];
      for (var m = 1; m < (1 << n); m++) {
        var S = [];
        for (var i = 0; i < n; i++) if (m & (1 << i)) S.push(i);
        out.push({ S: S, mask: m });
      }
      out.sort(function (a, b) { return a.S.length - b.S.length || cmpSets(a.S, b.S); });
      return out;
    }
    // D^M(x) = sum over i in M of e^(alpha_i - beta x_i)
    function D(M, x, a, b) { var s = 0; for (var k = 0; k < M.length; k++) s += Math.exp(a[M[k]] - b * x[M[k]]); return s; }
    // Theorem 2: v(M) = D^M(p) / (beta (D^N(p) + 1)) ln(D^M(c) / D^M(p))
    function vClosed(M, p, c, a, b, DNp) { var Dp = D(M, p, a, b), Dc = D(M, c, a, b); return Dp / (b * (DNp + 1)) * Math.log(Dc / Dp); }

    // Problem (5) solved directly, as an independent check of Theorem 2: the coalition chooses the market shares of its
    // members (their sum fixed at the initial one); the prices follow by inverting the logit model with the outsiders at
    // their initial prices, and the joint profit is maximized by golden section searches that move share between two
    // members at a time (the profit is concave in the shares, so these pairwise moves reach the optimum)
    function vSearch(M, p, c, a, b) {
      var n = p.length, O = 0, DNp = 0, j, k;
      for (j = 0; j < n; j++) { var e = Math.exp(a[j] - b * p[j]); DNp += e; if (M.indexOf(j) < 0) O += e; }
      var s = M.map(function (i) { return Math.exp(a[i] - b * p[i]) / (1 + DNp); });
      var tot = s.reduce(add, 0), U = tot * (1 + O) / (1 - tot), K = 1 + U + O;
      function term(k2, sh) { var x = (a[M[k2]] - Math.log(sh * K)) / b; return (x - c[M[k2]]) * sh; }
      function obj(sh) { var z = 0; for (var q = 0; q < sh.length; q++) z += term(q, sh[q]); return z; }
      var z = obj(s), G = (Math.sqrt(5) - 1) / 2;
      for (var sweep = 0; sweep < 300 && M.length > 1; sweep++) {
        var before = z;
        for (j = 0; j < M.length; j++) for (k = j + 1; k < M.length; k++) {
          var si = s[j], sk = s[k], rest = z - term(j, si) - term(k, sk);
          var g = function (tt) { return term(j, si + tt) + term(k, sk - tt); };
          var lo = -si * (1 - 1e-12), hi = sk * (1 - 1e-12);
          var x1 = hi - G * (hi - lo), x2 = lo + G * (hi - lo), f1 = g(x1), f2 = g(x2);
          for (var it = 0; it < 120 && hi - lo > 1e-15 * (1 + Math.abs(lo) + Math.abs(hi)); it++) {
            if (f1 > f2) { hi = x2; x2 = x1; f2 = f1; x1 = hi - G * (hi - lo); f1 = g(x1); }
            else { lo = x1; x1 = x2; f1 = f2; x2 = lo + G * (hi - lo); f2 = g(x2); }
          }
          var tb = (lo + hi) / 2, cand = rest + g(tb);
          if (cand > z) { s[j] = si + tb; s[k] = sk - tb; z = obj(s); }
        }
        if (z - before <= 1e-15 * (1 + Math.abs(z))) break;
      }
      return z;
    }

    // Shapley value from a value table indexed by bit mask
    function shapley(val, n) {
      var fact = [1]; for (var q = 1; q <= n; q++) fact[q] = fact[q - 1] * q;
      var sv = [];
      for (var i = 0; i < n; i++) {
        var s = 0;
        for (var m = 0; m < (1 << n); m++) {
          if (m & (1 << i)) continue;
          var size = 0; for (var k = 0; k < n; k++) if (m & (1 << k)) size++;
          s += fact[size] * fact[n - 1 - size] / fact[n] * (val[m | (1 << i)] - val[m]);
        }
        sv.push(s);
      }
      return sv;
    }

    // core test by LP: the least total that satisfies every proper coalition (allocations can be negative, so each
    // x_i is written as x_i+ - x_i-); the duals are balancing weights that prove an empty core. The values are divided
    // by their largest size first, so the LP's fixed tolerances also work when all profits are tiny
    function coreLP(coal, val, n, scale) {
      var rows = [];
      coal.slice(0, -1).forEach(function (C) {
        var a1 = [];
        for (var i = 0; i < n; i++) a1.push(C.S.indexOf(i) >= 0 ? 1 : 0);
        rows.push({ a: a1.concat(a1.map(function (v) { return -v; })), op: ">=", b: val[C.mask] / scale });
      });
      var cc = []; for (var i = 0; i < n; i++) cc.push(1);
      var r = LP.solve({ sense: "min", c: cc.concat(cc.map(function () { return -1; })), rows: rows });
      if (r.status === "optimal") r.z *= scale;
      return r;
    }
    // the size of the game: tolerances are relative to it (all profits can be tiny when the prices are high)
    function scaleOf(val, coal) {
      var s = 0; coal.forEach(function (C) { s = Math.max(s, Math.abs(val[C.mask])); });
      return s > 0 && isFinite(s) ? s : 1;
    }
    function deltaVal(val, coal, d) {
      var out = val.slice();
      coal.forEach(function (C) { if (C.S.length >= 2) out[C.mask] = (1 - d) * val[C.mask]; });
      return out;
    }
    function violations(x, coal, val, tol) {
      var bad = [];
      coal.slice(0, -1).forEach(function (C) {
        var s = 0; C.S.forEach(function (i) { s += x[i]; });
        if (!(s >= val[C.mask] - tol)) bad.push(C.S);
      });
      return bad;
    }

    // principal branch of the Lambert W function for x >= 0 (Halley's method)
    function lambertW(x) {
      if (x === 0) return 0;
      var w = Math.log(1 + x);
      if (x > 3) { var L1 = Math.log(x), L2 = Math.log(L1); w = L1 - L2 + L2 / L1; }
      for (var k = 0; k < 60; k++) {
        var ew = Math.exp(w), f = w * ew - x;
        var wn = w - f / (ew * (w + 1) - (w + 2) * f / (2 * w + 2));
        if (Math.abs(wn - w) <= 1e-15 * (1 + Math.abs(wn))) { w = wn; break; }
        w = wn;
      }
      return w;
    }
    // Eq. (3): the best response of every operator to the others' prices
    function bestResponse(p, c, a, b) {
      var n = p.length, q = [];
      for (var i = 0; i < n; i++) {
        var others = 1;
        for (var j = 0; j < n; j++) if (j !== i) others += Math.exp(a[j] - b * p[j]);
        q.push((1 + lambertW(Math.exp(a[i] - 1 - b * c[i]) / others)) / b + c[i]);
      }
      return q;
    }
    // Nash prices by fixed-point iteration of Eq. (3), started at margins 1/beta
    function nash(c, a, b) {
      var p = c.map(function (ci) { return ci + 1 / b; });
      for (var it = 0; it < 10000; it++) {
        var q = bestResponse(p, c, a, b), diff = 0;
        for (var i = 0; i < p.length; i++) diff = Math.max(diff, Math.abs(q[i] - p[i]));
        p = q;
        if (diff < 1e-12) return { p: p, ok: true };
      }
      return { p: p, ok: false };
    }

    // everything the widget shows for one situation theta = (N, p, c, alpha, beta), payback delta and benchmark margin k/beta
    function solve(p, c, a, b, d, k) {
      var n = p.length, i, N = [];
      for (i = 0; i < n; i++) N.push(i);
      var coal = coalitions(n), grand = coal[coal.length - 1];
      var ep = p.map(function (pi, j) { return Math.exp(a[j] - b * pi); });
      var DNp = ep.reduce(add, 0), DNc = D(N, c, a, b);
      var S = ep.map(function (e) { return e / (1 + DNp); }), T = DNp / (1 + DNp);
      var prof0 = S.map(function (s, j) { return (p[j] - c[j]) * s; });
      // Theorem 1
      var markup = Math.log(DNc / DNp) / b;
      var pstar = c.map(function (cj) { return cj + markup; });
      var es = pstar.map(function (x, j) { return Math.exp(a[j] - b * x); }), DNs = es.reduce(add, 0);
      var Sstar = es.map(function (e) { return e / (1 + DNs); });
      var prof1 = Sstar.map(function (s, j) { return (pstar[j] - c[j]) * s; });
      // Theorem 2 for every coalition
      var val = [0];
      coal.forEach(function (C) { val[C.mask] = vClosed(C.S, p, c, a, b, DNp); });
      var vN = val[grand.mask], sing = N.map(function (j) { return val[1 << j]; });
      var alone = sing.reduce(add, 0);
      // MSE: phi from the benchmark theta-hat with cost prices p_i - k/beta (k = 1 in the article)
      function mseFor(kk) {
        var chat = p.map(function (pi) { return pi - kk / b; });
        var vhat = vClosed(N, p, chat, a, b, DNp), phi = (vN - vhat) / T;
        return { phi: phi, x: N.map(function (j) { return prof1[j] - phi * (Sstar[j] - S[j]); }) };
      }
      var m1 = mseFor(1), mk = k === 1 ? m1 : mseFor(k);
      // the game that is played: TC game (delta = 0) or TC-delta game
      var vd = deltaVal(val, coal, d), vdN = vd[grand.mask];
      var scale = scaleOf(val, coal), tol = 1e-9 * scale;
      // Remark 4: the gain is zero exactly when all initial margins are equal (the joint optimum is unique)
      var marg = p.map(function (pi, j) { return pi - c[j]; });
      var mMax = Math.max.apply(null, marg), mMin = Math.min.apply(null, marg);
      var eqMargins = mMax - mMin <= 1e-9 * (1 + Math.max(Math.abs(mMax), Math.abs(mMin)));
      var rules = {
        iprop: sing.map(function (s) { return s / alone * vdN; }),
        mprop: S.map(function (s) { return s / T * vdN; }),
        sv: shapley(vd, n),
        mse: mk.x.map(function (x) { return (1 - d) * x; })
      };

      res.rules[r].forEach(function (x) { row.appendChild(h("td", "num", isFinite(x) ? f3(x) : t("stcbp.w.dash"))); });
      var bad = res.viol[r], td = h("td", "lbl");
      if (!bad.length) td.appendChild(h("span", "ok", t("stcbp.w.yes")));
      else {
        td.appendChild(h("span", "bad", t("stcbp.w.no")));
        // the first coalition that leaves, and how many more do
        td.appendChild(document.createTextNode(" " + setName(bad[0])));
        if (bad.length > 1) td.appendChild(h("span", "cb-more", " +" + (bad.length - 1)));
      }
      row.appendChild(td);
      body.appendChild(row);
    });
    tb.appendChild(body);
    var host = $("cb-rtbl"); host.textContent = ""; host.appendChild(tb);
  }

  function coalTable() {
    var x = res.rules[st.rule], vals = res.vd;
    // the rule name keeps its case (the heading is uppercase, and an uppercase δ would read as a different symbol)
    var head = $("cb-ctbl-h"), parts = t("stcbp.w.coal.h").split("{rule}");
    head.textContent = "";
    head.append(document.createTextNode(parts[0]), h("span", st.rule === "mse" && st.d > 0 ? "cb-nc" : null, ruleName(st.rule)), document.createTextNode(parts[1] || ""));
    var ex = res.coal.map(function (C) { var s = 0; C.S.forEach(function (i) { s += x[i]; }); return s - vals[C.mask]; });
    var big = Math.max.apply(null, ex.map(function (e) { return isFinite(e) ? Math.abs(e) : 0; }).concat([1e-12]));
    var tb = h("table"), thead = h("thead"), tr = h("tr");
    [["stcbp.w.t.M", ""], [st.d > 0 ? "stcbp.w.t.vdM" : "stcbp.w.t.vM", "num"], ["stcbp.w.t.xM", "num"], ["stcbp.w.t.ex", "num"]].forEach(function (c) {
      tr.appendChild(h("th", c[1], t(c[0])));
    });
    thead.appendChild(tr); tb.appendChild(thead);
    var body = h("tbody");
    res.coal.forEach(function (C, k) {
      var grand = k === res.coal.length - 1, row = h("tr", grand ? "grand" : null), e = ex[k];
      var cell = h("td", "num");
      if (!grand) {
        var bar = h("span", "cb-bar"), fill = h("i", e < -res.tol ? "neg" : "pos"), frac = isFinite(e) ? Math.abs(e) / big : 1;
        fill.style.width = (50 * frac) + "%";
        fill.style.left = e < 0 ? (50 - 50 * frac) + "%" : "50%";
        bar.append(fill, h("b"));
        cell.append(bar, document.createTextNode(isFinite(e) ? f4(e) + " " : ""), h("span", e >= -res.tol ? "ok" : "bad", t(e >= -res.tol ? "stcbp.w.yes" : "stcbp.w.no")));
      } else cell.textContent = f4(e);
      row.append(h("td", "lbl", setName(C.S)), h("td", "num", f3(vals[C.mask])), h("td", "num", isFinite(e) ? f3(e + vals[C.mask]) : t("stcbp.w.dash")), cell);
      body.appendChild(row);
    });
    tb.appendChild(body);
    var host = $("cb-ctbl"); host.textContent = ""; host.appendChild(tb);
  }

  // the direct numerical check of Theorem 2 runs a moment after the last change, so slider drags stay smooth
  var checkTimer = null;
  function scheduleCheck() {
    clearTimeout(checkTimer);
    $("cb-check").textContent = "";
    checkTimer = setTimeout(function () {
      var d = TC.check(st.p, st.c, st.a, st.b);
      $("cb-check").innerHTML = t("stcbp.w.check", { d: fsmall(d) });
    }, 160);
  }

  function update() {
    res = TC.solve(st.p, st.c, st.a, st.b, st.d, st.k);
    document.querySelectorAll("#cb-n button").forEach(function (b) { b.setAttribute("aria-pressed", String(+b.getAttribute("data-n") === res.n)); });
    document.querySelectorAll("#cb-presets button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-preset") === preset)); });
    document.querySelectorAll("#cb-rule button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-rule") === st.rule));
      if (b.getAttribute("data-rule") === "mse") b.textContent = ruleName("mse");
    });
    document.querySelectorAll("#cb-k button").forEach(function (b) { b.setAttribute("aria-pressed", String(+b.getAttribute("data-k") === st.k)); });
    cards.forEach(function (cd, i) {
      cd.card.hidden = i >= res.n;
      if (i >= res.n) return;
      cd.name.textContent = t("stcbp.w.op", { i: i + 1 });
      syncSlider(cd.p, st.p[i], t("stcbp.w.s.p"), f3(st.p[i]));
      syncSlider(cd.c, st.c[i], t("stcbp.w.s.c"), f3(st.c[i]));
      syncSlider(cd.a, st.a[i], t("stcbp.w.s.a"), I18N.fmt(st.a[i], 2, 2));
    });
    market.name.textContent = t("stcbp.w.mkt");
    syncSlider(market.b, st.b, t("stcbp.w.s.b"), I18N.fmt(st.b, 2, 2));
    syncSlider(market.d, st.d, t("stcbp.w.s.d"), f3(st.d));
    var k = $("cb-kpis"); k.textContent = "";
    k.append(kpi(t("stcbp.w.k.T"), f3(res.T)), kpi(t("stcbp.w.k.alone"), f3(res.alone)), kpi(t("stcbp.w.k.vN"), f3(res.vN), "accent"),
      kpi(t("stcbp.w.k.mk"), f3(res.markup)), kpi(t(st.k === 1 ? "stcbp.w.k.phi" : "stcbp.w.k.phi2"), f3(res.phi)),
      kpi(t(st.d > 0 ? "stcbp.w.k.cored" : "stcbp.w.k.core"), t(res.coreNonEmpty ? "stcbp.w.core.yes" : "stcbp.w.core.no"), res.coreNonEmpty ? null : "warn"));
    drawChart();
    verdict();
    opTable();
    rulesTable();
    coalTable();
    drawRuler();
    scheduleCheck();
  }

  // ---- the simulation of Section 6, in chunks so the page stays responsive ----
  var sim = { seed: 2022, running: false, out: null };
  function simTable() {
    var host = $("cb-sim-tbl"); host.textContent = "";
    if (!sim.out) return;
    var tb = h("table"), thead = h("thead"), tr = h("tr");
    tr.appendChild(h("th", null, t("stcbp.w.t.rule")));
    [3, 4, 5].forEach(function (n) { tr.appendChild(h("th", "num", t("stcbp.w.sim.col", { n: n }))); });
    thead.appendChild(tr); tb.appendChild(thead);
    var body = h("tbody");
    ["iprop", "mprop", "sv", "mse"].forEach(function (r) {
      var row = h("tr");
      row.appendChild(h("td", "lbl", t("stcbp.w.r." + r)));
      [3, 4, 5].forEach(function (n) {
        var o = sim.out[n];
        row.appendChild(h("td", "num", o && o.done ? I18N.fmt(o[r] / o.done, 4, 4) : ""));
      });
      body.appendChild(row);
    });
    tb.appendChild(body);
    host.appendChild(tb);
  }
  function simStatus() {
    var el = $("cb-sim-status"), btn = $("cb-sim-run");
    btn.textContent = t(sim.out && !sim.running ? "stcbp.w.sim.again" : "stcbp.w.sim.run");
    btn.disabled = sim.running;
    if (!sim.out) { el.textContent = t("stcbp.w.sim.idle"); return; }
    var done = 0, conv = 0;
    [3, 4, 5].forEach(function (n) { done += sim.out[n].done; conv += sim.out[n].conv; });
    el.innerHTML = sim.running ? t("stcbp.w.sim.running", { done: I18N.fmt(done, 0), total: I18N.fmt(30000, 0) })
      : t("stcbp.w.sim.done", { seed: sim.out.seed, total: I18N.fmt(done, 0), conv: I18N.fmt(conv, 0) });
  }
  function runSim() {
    if (sim.running) return;
    sim.running = true;
    var rnd = TC.mulberry32(sim.seed), sizes = [3, 4, 5], si = 0, RUNS = 10000;
    sim.out = { seed: sim.seed };
    sizes.forEach(function (n) { sim.out[n] = { done: 0, conv: 0, iprop: 0, mprop: 0, sv: 0, mse: 0 }; });
    sim.seed++;
    function chunk() {
      var t0 = performance.now();
      while (si < sizes.length && performance.now() - t0 < 30) {
        var n = sizes[si], o = sim.out[n];
        for (var q = 0; q < 100 && o.done < RUNS; q++) {
          var r = TC.simOne(rnd, n);
          o.done++; if (r.ok) o.conv++;
          ["iprop", "mprop", "sv", "mse"].forEach(function (k) { if (r.inCore[k]) o[k]++; });
        }
        if (o.done >= RUNS) si++;
      }
      if (si >= sizes.length) sim.running = false;
      simTable(); simStatus();
      if (sim.running) setTimeout(chunk, 0);
    }
    simStatus();
    setTimeout(chunk, 0);
  }

  // events
  document.querySelectorAll("#cb-n button").forEach(function (b) {
    b.addEventListener("click", function () { setN(+b.getAttribute("data-n")); schedule(); });
  });
  document.querySelectorAll("#cb-presets button").forEach(function (b) {
    b.addEventListener("click", function () { loadPreset(b.getAttribute("data-preset")); schedule(); });
  });
  document.querySelectorAll("#cb-rule button").forEach(function (b) {
    b.addEventListener("click", function () { st.rule = b.getAttribute("data-rule"); schedule(); });
  });
  document.querySelectorAll("#cb-k button").forEach(function (b) {
    b.addEventListener("click", function () { st.k = +b.getAttribute("data-k"); schedule(); });
  });
  $("cb-sim-run").addEventListener("click", runSim);

  buildSliders();
  I18N.onChange(function () { update(); simTable(); simStatus(); });
  // the drawings use the real pixel width of their box: redraw when that width changes (also when the widget is first shown)
  var resizeTimer, lastW = 0;
  function redraw() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var w = $("cb-chart").clientWidth;
      if (res && w && w !== lastW) { lastW = w; drawChart(); drawRuler(); }
    }, 60);
  }
  if (window.ResizeObserver) new ResizeObserver(redraw).observe($("cb-chart"));
  window.addEventListener("resize", redraw);
})();
</script>
