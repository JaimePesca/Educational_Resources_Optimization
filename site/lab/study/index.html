<script>
(function () {
  "use strict";
  var t = I18N.t, S = window.Study;
  var LINES = S.lines, filter = "all";
  var grid = document.getElementById("tl-grid"), scroller = document.getElementById("tl-scroll");

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function count(n) { return n === 1 ? t("sth.count.one") : t("sth.count.many", { n: n }); }

  // the three lines, with their number of papers (also the legend of the timeline colours)
  function renderLines() {
    var host = document.getElementById("sth-lines"); host.textContent = "";
    LINES.forEach(function (line) {
      var n = S.papers.filter(function (p) { return p.line === line; }).length;
      var box = el("div", "sth-line line-" + line); box.setAttribute("role", "listitem");
      var h = el("h3"); h.append(el("span", null, S.lineName(line)), el("span", "n", count(n)));
      box.append(h, el("p", null, t("stu.line." + line + ".desc")));
      host.appendChild(box);
    });
  }

  function renderFilter() {
    var host = document.getElementById("sth-filter"); host.textContent = "";
    ["all"].concat(LINES).forEach(function (f) {
      var b = el("button", f === "all" ? null : "line-" + f); b.type = "button";
      if (f !== "all") b.appendChild(el("i"));
      b.appendChild(document.createTextNode(f === "all" ? t("sth.filter.all") : S.lineName(f)));
      b.setAttribute("aria-pressed", String(filter === f));
      b.addEventListener("click", function () { filter = f; renderFilter(); renderTimeline(); scroller.scrollLeft = 0; });
      host.appendChild(b);
    });
  }

  // Columns: every card spans two columns; a card starts at least one column after the previous paper (any line) and two
  // columns after the previous paper of its own line, so the order reads left to right and cards in a lane never overlap.
  function renderTimeline() {
    grid.textContent = "";
    var shown = S.papers.filter(function (p) { return filter === "all" || p.line === filter; });
    var lanes = LINES.filter(function (l) { return shown.some(function (p) { return p.line === l; }); });
    var prev = 1, lastIn = {}, maxC = 2;
    var pos = shown.map(function (p) {
      var c = Math.max(prev + 1, (lastIn[p.line] || 0) + 2);
      prev = c; lastIn[p.line] = c; maxC = Math.max(maxC, c);
      return c;
    });
    grid.style.setProperty("--cols", String(maxC));
    grid.appendChild(el("div", "tl-axis"));
    lanes.forEach(function (l, k) {
      var lane = el("div", "tl-lane line-" + l); lane.style.setProperty("--r", String(k + 2));
      lane.append(el("i"), el("b", null, t("stu.line." + l + ".lane")));
      var rail = el("div", "tl-rail line-" + l); rail.style.setProperty("--r", String(k + 2));
      grid.append(lane, rail);
    });
    var lastYear = null;
    shown.forEach(function (p, k) {
      var y = p.date.slice(0, 4);
      if (y !== lastYear) {
        var ye = el("p", "tl-year", y); ye.style.setProperty("--c", String(pos[k]));
        grid.appendChild(ye); lastYear = y;
      }
      var card;
      if (p.ready) { card = el("a", "tl-card line-" + p.line); card.href = p.href; card.setAttribute("data-keep-lang", ""); }
      else card = el("div", "tl-card line-" + p.line);
      card.style.setProperty("--c", String(pos[k]));
      card.style.setProperty("--r", String(lanes.indexOf(p.line) + 2));
      var top = el("span", "tl-card-top");
      top.append(el("span", "tl-date", S.fmtDate(p, true)), el("span", "tl-n", (S.indexOf(p.slug) + 1) + "/" + S.papers.length));
      var title = el("h3", "tl-title", S.shortTitle(p));
      var venue = el("span", "tl-venue", p.venue); venue.lang = "en";
      card.append(top, title, venue, el("p", "tl-sum", S.summary(p)));
      if (p.ready) card.appendChild(el("span", "tl-go", t("sth.open")));
      else card.appendChild(el("span", "st-soon", t("stu.soon")));
      grid.appendChild(card);
    });
    S.keepLang(grid);
    updateButtons();
  }

  var earlier = document.getElementById("sth-earlier"), later = document.getElementById("sth-later");
  var fade = document.querySelector(".tl-fade.r");
  function updateButtons() {
    var max = scroller.scrollWidth - scroller.clientWidth;
    earlier.disabled = scroller.scrollLeft <= 2;
    later.disabled = scroller.scrollLeft >= max - 2;
    fade.hidden = later.disabled;
  }
  earlier.addEventListener("click", function () { scroller.scrollBy({ left: -scroller.clientWidth * 0.8 }); });
  later.addEventListener("click", function () { scroller.scrollBy({ left: scroller.clientWidth * 0.8 }); });
  scroller.addEventListener("scroll", updateButtons, { passive: true });
  window.addEventListener("resize", updateButtons);

  I18N.onChange(function () { renderLines(); renderFilter(); renderTimeline(); });
})();
</script>
