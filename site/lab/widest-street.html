<script>
(function () {
  "use strict";
  var T = I18N.t;
  var MINUS = "−";
  var fmt = function (v, d) { d = d == null ? 2 : d; if (Math.abs(v) < 0.5 * Math.pow(10, -d)) v = 0; return I18N.fmt(v, d, d); };
  var num = function (v, d) { var m = fmt(Math.abs(v), d); return m === fmt(0, d) ? m : (v < 0 ? MINUS : "") + m; };
  var texNum = function (v, d) { var m = fmt(Math.abs(v), d); return m === fmt(0, d) ? m : (v < 0 ? "-" : "") + m; };
  var cFmt = function (c) { return isFinite(c) ? I18N.fmt(Number(c.toPrecision(2)), 2, 0) : "∞"; };   // C with two significant digits
  var intFmt = function (v) { return I18N.fmt(v, 0, 0); };

  /* =====================================================================================
     The data: 24 coffee lots (12 specialty, 12 standard), each with two measured traits, drawn from two
     normal clouds with Anim.rng(SEED), plus one standard lot from a high farm (the outlier). Illustrative.
     Model units: x1 = altitude in hundreds of meters, x2 = bean density in tens of g/L.
     ===================================================================================== */
  var SEED = 112, NPER = 12;
  var CLOUD = { spec: { m: [18.0, 71.5] }, std: { m: [14.6, 67.8] }, sd: [1.1, 1.4] };
  var OUTLIER = [18.8, 72.1];
  var DATA = (function () {
    var r = Anim.rng(SEED), X = [], Y = [];
    var z = function () { var u1 = r(), u2 = r(); return Math.sqrt(-2 * Math.log(1 - u1)) * Math.cos(2 * Math.PI * u2); };
    for (var i = 0; i < 2 * NPER; i++) {
      var y = i % 2 === 0 ? 1 : -1, m = y > 0 ? CLOUD.spec.m : CLOUD.std.m;
      var a = Math.round((m[0] + CLOUD.sd[0] * z()) * 10) / 10, d = Math.round((m[1] + CLOUD.sd[1] * z()) * 10) / 10;
      X.push([a, d]); Y.push(y);
    }
    return { X: X, Y: Y };
  })();
  var X1 = DATA.X, Y1 = DATA.Y, N1 = Y1.length;             // the separable data (chapters 1 and 2)
  var X2 = X1.concat([OUTLIER]), Y2 = Y1.concat([-1]), N2 = Y2.length, IOUT = N2 - 1;

  /* ---------- the QP, solved exactly: the dual by SMO (Platt 1998) with the second order working set
     selection of Fan, Chen and Lin (2005), linear kernel, on centred data, to a KKT gap below 1e-12 ---------- */
  var EPS = 1e-12;
  function svm(X, Y, C) {
    var n = Y.length, i, j, t, mx = 0, my = 0;
    X.forEach(function (p) { mx += p[0]; my += p[1]; }); mx /= n; my /= n;
    var Z = X.map(function (p) { return [p[0] - mx, p[1] - my]; }), Q = [];
    for (i = 0; i < n; i++) { Q.push(new Float64Array(n)); for (j = 0; j < n; j++) Q[i][j] = Y[i] * Y[j] * (Z[i][0] * Z[j][0] + Z[i][1] * Z[j][1]); }
    var al = new Float64Array(n), G = new Float64Array(n).fill(-1), it = 0, TINY = 1e-12, gmax = 0, gmin = 0;
    var up = function (t) { return (Y[t] > 0 && al[t] < C) || (Y[t] < 0 && al[t] > 0); };
    var low = function (t) { return (Y[t] < 0 && al[t] < C) || (Y[t] > 0 && al[t] > 0); };
    for (; it < 200000; it++) {
      var ii = -1, jj = -1, obmin = Infinity;
      gmax = -Infinity; gmin = Infinity;
      for (t = 0; t < n; t++) if (up(t) && -Y[t] * G[t] >= gmax) { gmax = -Y[t] * G[t]; ii = t; }
      for (t = 0; t < n; t++) if (low(t)) {
        var v = -Y[t] * G[t];
        if (v < gmin) gmin = v;
        var bb = gmax - v;
        if (bb > 0) {
          var aa = Q[ii][ii] + Q[t][t] - 2 * Y[ii] * Y[t] * Q[ii][t];
          if (aa <= 0) aa = TINY;
          if (-(bb * bb) / aa <= obmin) { jj = t; obmin = -(bb * bb) / aa; }
        }
      }
      if (gmax - gmin < EPS || jj < 0) break;
      i = ii; j = jj;
      var oi = al[i], oj = al[j], quad, delta, diff, sum;
      if (Y[i] !== Y[j]) {
        quad = Q[i][i] + Q[j][j] + 2 * Q[i][j]; if (quad <= 0) quad = TINY;
        delta = (-G[i] - G[j]) / quad; diff = al[i] - al[j];
        al[i] += delta; al[j] += delta;
        if (diff > 0) { if (al[j] < 0) { al[j] = 0; al[i] = diff; } } else if (al[i] < 0) { al[i] = 0; al[j] = -diff; }
        if (diff > 0) { if (al[i] > C) { al[i] = C; al[j] = C - diff; } } else if (al[j] > C) { al[j] = C; al[i] = C + diff; }
      } else {
        quad = Q[i][i] + Q[j][j] - 2 * Q[i][j]; if (quad <= 0) quad = TINY;
        delta = (G[i] - G[j]) / quad; sum = al[i] + al[j];
        al[i] -= delta; al[j] += delta;
        if (sum > C) { if (al[i] > C) { al[i] = C; al[j] = sum - C; } } else if (al[j] < 0) { al[j] = 0; al[i] = sum; }
        if (sum > C) { if (al[j] > C) { al[j] = C; al[i] = sum - C; } } else if (al[i] < 0) { al[i] = 0; al[j] = sum; }
      }
      var di = al[i] - oi, dj = al[j] - oj;
      for (t = 0; t < n; t++) G[t] += Q[t][i] * di + Q[t][j] * dj;
    }
    var w = [0, 0];
    for (t = 0; t < n; t++) { w[0] += al[t] * Y[t] * Z[t][0]; w[1] += al[t] * Y[t] * Z[t][1]; }
    // b from the free support vectors (0 < alpha < C), else the middle of its feasible interval
    var nf = 0, sf = 0, ub = Infinity, lb = -Infinity;
    for (t = 0; t < n; t++) {
      var yg = Y[t] * G[t];
      if (al[t] > 0 && al[t] < C) { nf++; sf += yg; }
      else if ((al[t] >= C && Y[t] < 0) || (al[t] <= 0 && Y[t] > 0)) ub = Math.min(ub, yg);
      else lb = Math.max(lb, yg);
    }
    var b = -(nf ? sf / nf : (ub + lb) / 2) - (w[0] * mx + w[1] * my);
    var nw2 = w[0] * w[0] + w[1] * w[1], nw = Math.sqrt(nw2), m = [], xi = [], role = [], sxi = 0, sal = 0, tol = 1e-9 * (isFinite(C) ? Math.max(1, C) : 1);
    var nsv = 0, nmar = 0, viol = 0, err = 0;
    for (t = 0; t < n; t++) {
      m[t] = Y[t] * (w[0] * X[t][0] + w[1] * X[t][1] + b);
      xi[t] = Math.max(0, 1 - m[t]); if (xi[t] < 1e-9) xi[t] = 0;
      sxi += xi[t]; sal += al[t];
      // role: 0 outside the street, 1 support vector on the edge, 2 inside the street, 3 on the wrong side
      role[t] = al[t] <= tol ? 0 : (xi[t] === 0 ? 1 : (m[t] < 0 ? 3 : 2));
      if (al[t] > tol) nsv++;
      if (role[t] === 1) nmar++;
      if (xi[t] > 0) viol++;
      if (m[t] < 0) err++;
    }
    var th = Math.atan2(w[1], w[0]);
    return { C: C, w: w, b: b, nw: nw, alpha: Array.from(al), m: m, xi: xi, role: role, it: it, gap: gmax - gmin,
      width: 2 / nw, half: 0.5 * nw2, sxi: sxi, sal: sal, obj: 0.5 * nw2 + (isFinite(C) ? C * sxi : 0), dual: sal - 0.5 * nw2,
      nsv: nsv, nmar: nmar, viol: viol, err: err, st: streetOf(w, b) };
  }
  // a street for drawing: normal angle, a point of the boundary near the data, half width
  var GX = 0, GY = 0;
  X2.forEach(function (p) { GX += p[0] / N2; GY += p[1] / N2; });
  function streetOf(w, b) {
    var nw = Math.hypot(w[0], w[1]), nx = w[0] / nw, ny = w[1] / nw, d = -b / nw, s = nx * GX + ny * GY - d;
    return { th: Math.atan2(ny, nx), px: GX - s * nx, py: GY - s * ny, h: 1 / nw };
  }

  /* ---------- is the hard margin feasible? y_i (w'x_i + b) >= 1 for all i, as an LP (w, b free) ---------- */
  function lpCheck(X, Y) {
    var n = Y.length, mx = 0, my = 0;
    X.forEach(function (p) { mx += p[0] / n; my += p[1] / n; });

    var h = "<thead><tr><th class='num'>#</th><th class='num'>" + T("svm.lots.alt") + "</th><th class='num'>" + T("svm.lots.den") + "</th><th class='rowh'>" +
      T("svm.lots.cls") + "</th><th class='num'>y f(x)</th><th class='num wide'>ξ</th><th class='num wide'>α</th><th class='rowh'>" + T("svm.lots.role") + "</th></tr></thead><tbody>";
    var order = X2.map(function (p, i) { return i; }).sort(function (p, q) { return S.m[p] - S.m[q] || p - q; });
    order.forEach(function (i) {
      var rl = S.role[i], cls = rl === 3 ? " hot" : rl === 1 ? " acc" : rl === 2 ? " hot" : " dim";
      h += "<tr><td class='num'>" + (i + 1) + (i === IOUT ? "*" : "") + "</td><td class='num'>" + intFmt(X2[i][0] * 100) + "</td><td class='num'>" + intFmt(X2[i][1] * 10) +
        "</td><td class='rowh'>" + T(Y2[i] > 0 ? "svm.cls.spec" : "svm.cls.std") + "</td><td class='num'>" + num(S.m[i], 3) + "</td><td class='num wide'>" + fmt(S.xi[i], 3) +
        "</td><td class='num wide'>" + fmt(S.alpha[i], 3) + "</td><td class='rowh" + cls + "'>" + roleName(rl) + "</td></tr>";
    });
    document.getElementById("svm-lots").innerHTML = h + "</tbody>";
  }
  function renderNotes() {
    var S = SOFT[state.sc], a = SOFT.small, c = SOFT.large;
    document.getElementById("svm-n1").innerHTML = T("svm.n.p1", { k: NTRY, b: fmt(2 * BEST.h), w: fmt(HARD.width), s: HARD.nsv, n: N1 });
    document.getElementById("svm-n2").innerHTML = T("svm.n.p2", { n: N2 });
    document.getElementById("svm-n3").innerHTML = T("svm.n.p3", {
      c0: cFmt(a.C), c1: cFmt(c.C), w0: fmt(a.width), w1: fmt(c.width), s0: a.nsv, s1: c.nsv, v0: a.viol, v1: c.viol, e0: a.err, e1: c.err
    });
    document.getElementById("svm-n4").innerHTML = T("svm.n.p4", { c: cFmt(S.C), s: S.nsv, n: N2 });
  }

  var segBtns = document.querySelectorAll("#svm-seg button");
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      if (state.sc === b.getAttribute("data-sc")) return;
      state.sc = b.getAttribute("data-sc");
      segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      renderScenText(); renderSolution(); renderCompare(); renderLots(); renderNotes();
      hudKey = "";
      if (A_.reducedMotion) { player.seek(DUR); return; }
      if (player.time < CH[3]) player.refresh();
      else { player.seek(CH[3] + 0.001); player.play(); }
    });
  });

  function renderPage() {
    renderSeg(); renderScenText(); renderData(); renderSolution(); renderCompare(); renderLots(); renderNotes();
    hudKey = "";
    player.refresh();
  }
  I18N.onChange(renderPage);
})();
</script>
</body>
</html>
