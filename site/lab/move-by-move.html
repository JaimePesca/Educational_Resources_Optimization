<style>
  [hidden] { display: none !important; }
  /* bright red for new or urgent cues; where the dark theme makes the accent that same red, the crit shade */
  :root { --hot: var(--mit-bright); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --hot: var(--crit); } }
  :root[data-theme="dark"] { --hot: var(--crit); }

  section.block { grid-template-columns: minmax(0, 1fr); scroll-margin-top: 70px; }
  section.block > * { min-width: 0; }
  .case-num { display: block; font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-text); margin-bottom: 4px; }
  .mhead { margin: 14px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-text); }
  .mhead:first-child { margin-top: 0; }
  .mtext { font-size: 14px; color: var(--ink2); margin: 6px 0 0; max-width: 80ch; }
  .mtext b { color: var(--ink); }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 26px; align-items: start; }
  @media (max-width: 860px) { .two { grid-template-columns: minmax(0, 1fr); } }
  .two > div { min-width: 0; }

  /* ---- animation ---- */
  #gts-sec .anim-hud {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px;
    top: 12px; left: 12px; width: min(300px, max(222px, 28%)); max-width: none;
  }
  #gts-sec .anim-hud .chip-stat { opacity: 0; min-width: 0; }
  #gts-sec .anim-hud .chip-stat span { display: block; line-height: 1.2; }
  #gts-sec .anim-hud .chip-stat.hot b { color: var(--hot); }
  #gts-sec .anim-hud .chip-stat.long b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #gts-c0 { order: 1; } #gts-c2 { order: 2; } #gts-c1 { order: 3; grid-column: 1 / -1; } #gts-c3 { order: 4; } #gts-c4 { order: 5; }
  @media (min-width: 621px) and (max-width: 820px) {
    #gts-sec .anim-hud .chip-stat { padding: 4px 7px; font-size: 11px; }
    #gts-sec .anim-hud .chip-stat b { font-size: 15px; }
    #gts-sec .anim-hud .chip-stat.long b { font-size: 13px; }
  }
  @media (max-width: 620px) {
    #gts-sec .anim-hud { grid-template-columns: repeat(3, minmax(0, 1fr)); top: 8px; left: 8px; right: 8px; width: auto; gap: 4px; }
    #gts-sec .anim-hud .chip-stat { padding: 3px 6px; font-size: 10.5px; }
    #gts-sec .anim-hud .chip-stat b { font-size: 14px; }
    #gts-sec .anim-hud .chip-stat.long b { font-size: 12.5px; }
    #gts-c1 { order: 1; grid-column: span 2; } #gts-c2 { order: 2; } #gts-c0 { order: 3; } #gts-c3 { order: 4; } #gts-c4 { order: 5; }
  }
  .anim-legend span[hidden] { display: none; }
  .anim-legend i.lg-p1, .legend2 i.l-p1 { width: 12px; height: 12px; background: var(--ink); }
  .anim-legend i.lg-p2, .legend2 i.l-p2 { width: 12px; height: 12px; background: var(--surface); border: 2px solid var(--ink); }
  .anim-legend i.lg-leaf, .legend2 i.l-leaf { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 9px solid var(--ink2); }
  .anim-legend i.lg-best, .legend2 i.l-best { width: 20px; height: 0; border-top: 3px solid var(--accent); }
  .anim-legend i.lg-drop, .legend2 i.l-drop { width: 20px; height: 0; border-top: 1.5px solid var(--mit-silver); }
  .anim-legend i.lg-path, .legend2 i.l-path { width: 20px; height: 6px; background: var(--accent); box-shadow: 0 0 0 3px var(--sel); }
  .anim-legend i.lg-threat, .legend2 i.l-threat { width: 20px; height: 0; border-top: 2.5px dashed var(--hot); }
  .anim-legend i.lg-ne { width: 12px; height: 12px; border: 2.5px solid var(--accent); border-radius: 2px; }
  .anim-legend i.lg-nc { width: 12px; height: 12px; border: 2.5px solid var(--hot); border-radius: 2px; }
  .anim-legend i.lg-spe { width: 12px; height: 12px; background: var(--accent); border-radius: 2px; }
  .scen-status {
    background: var(--surface2); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 3px; padding: 9px 13px; font-size: 14px; color: var(--ink2); margin: 0;
  }
  .scen-status b { color: var(--ink); }

  /* ---- controls ---- */
  .ctl-row { display: flex; flex-wrap: wrap; gap: 12px 26px; align-items: flex-end; }
  .ctl-group { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .ctl-group .lbl, label.lbl { font-size: 13px; color: var(--ink2); font-weight: 600; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  button.btn {
    font: 600 13px var(--font-sans); color: var(--on-solid); background: var(--accent); border: 1px solid var(--accent); border-radius: 2px;
    padding: 8px 12px; cursor: pointer;
  }
  button.btn:hover { filter: brightness(1.1); }
  button.btn:disabled { opacity: 0.45; cursor: default; filter: none; }
  button.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--border); }
  .rng { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; align-items: baseline; min-width: 0; flex: 1 1 200px; max-width: 340px; }
  .rng label { font-size: 13px; color: var(--ink2); font-weight: 600; }
  .rng output { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
  .rng input[type="range"] { flex: 1 1 100%; width: 100%; accent-color: var(--accent); margin: 4px 0 0; }
  .sliders { display: flex; flex-wrap: wrap; gap: 10px 22px; }
  .sliders .rng { flex: 1 1 150px; max-width: 230px; }
  .src-panel { margin-top: 12px; }
  .story { font-size: 14px; color: var(--ink2); margin: 0 0 10px; max-width: 84ch; }
  .story b { color: var(--ink); }
  .tabkey { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button {
    font: 600 13px var(--font-sans); min-width: 46px; padding: 7px 10px; cursor: pointer; border-radius: 2px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink2); font-variant-numeric: tabular-nums;
  }
  .chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-solid); }
  .leafgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px 16px; max-width: 760px; }
  .leafbox { border: 1px solid var(--border); border-radius: 3px; padding: 8px 10px; background: var(--surface2); min-width: 0; }
  .leafbox .lt { font-size: 13px; font-weight: 700; color: var(--ink); margin: 0 0 6px; }
  .leafbox .li { display: grid; grid-template-columns: minmax(0, 1fr) 76px; gap: 4px 8px; align-items: center; font-size: 12.5px; color: var(--ink2); }
  .leafbox input {
    width: 100%; min-width: 0; font: 600 13.5px var(--font-sans); color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 2px; padding: 4px 6px; text-align: right; font-variant-numeric: tabular-nums;
  }

  /* ---- live numbers ---- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 12px; }
  @media (max-width: 460px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .kpi { border: 1px solid var(--border); border-radius: 3px; padding: 8px 11px; background: var(--surface); min-width: 0; }
  .kpi b { display: block; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); letter-spacing: -0.01em; line-height: 1.2; overflow-wrap: anywhere; }
  .kpi span { display: block; font-size: 12.5px; color: var(--ink2); line-height: 1.3; margin-top: 2px; }
  .kpi.accent { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .kpi.accent b { color: var(--accent-text); }
  .kpi.hot { border-color: var(--hot); box-shadow: inset 3px 0 0 var(--hot); }
  .kpi.hot b { color: var(--hot); }
  @media (max-width: 460px) { .kpi b { font-size: 15.5px; } .kpi span { font-size: 12px; } }
  .verdict { margin: 12px 0 0; padding: 10px 14px; border-radius: 3px; font-size: 14px; border: 1px solid var(--border); border-left: 3px solid var(--ink2); background: var(--surface2); color: var(--ink2); max-width: 92ch; }
  .verdict b { color: var(--ink); }
  .verdict.ok { border-left-color: var(--accent); }
  .verdict.bad { border-left-color: var(--hot); }
  .chart-title { margin: 16px 0 0; font-size: 13px; font-weight: 700; color: var(--ink); }
  .chart-title:first-child { margin-top: 0; }
  h3.chart-title { font-size: 15px; }

  /* ---- drawings ---- */
  .treebox { margin-top: 8px; max-width: 100%; overflow-x: auto; overflow-y: hidden; }
  .treebox svg { display: block; height: auto; margin: 0 auto; }
  .chartbox { margin-top: 8px; min-width: 0; }
  .chartbox svg { display: block; width: 100%; height: auto; overflow: visible; }
  .treebox svg text, .chartbox svg text { font-family: var(--font-sans); font-size: 12px; fill: var(--ink2); }
  svg text.b { font-weight: 700; fill: var(--ink); }
  svg text.acc { font-weight: 700; fill: var(--accent-text); }
  svg text.hot { font-weight: 700; fill: var(--hot); }
  svg text.mut { fill: var(--muted); }
  svg text.on { fill: var(--on-solid); font-weight: 700; }
  svg text.ink { fill: var(--ink); }
  svg text.sm { font-size: 11px; }
  .sv-ax { stroke: var(--axis); stroke-width: 1; fill: none; }
  .sv-grid { stroke: var(--grid); stroke-width: 1; fill: none; }
  .sv-edge { stroke: var(--ink2); stroke-width: 1.6; fill: none; }
  .sv-ink { stroke: var(--ink); stroke-width: 2; fill: none; }
  .sv-ink2 { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .sv-acc { stroke: var(--accent); stroke-width: 3; fill: none; }
  .sv-path { stroke: var(--accent); stroke-width: 4.5; fill: none; stroke-linecap: round; }
  .sv-glow { stroke: var(--sel); stroke-width: 13; fill: none; stroke-linecap: round; }
  .sv-sil { stroke: var(--mit-silver); stroke-width: 1.4; fill: none; }
  .sv-hot { stroke: var(--hot); stroke-width: 2.4; fill: none; }
  .sv-dash { stroke-dasharray: 6 4; }
  .sv-reg { fill: var(--region); stroke: var(--mit-silver); stroke-width: 1; }
  .sv-sus { fill: var(--sel); stroke: var(--accent); stroke-width: 2; }
  .sv-susf { fill: var(--sel); stroke: none; }
  .sv-suse { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; }
  .sv-n1 { fill: var(--ink); }
  .sv-n2 { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
  .sv-leaf { fill: var(--ink2); }
  .sv-tag { fill: var(--surface); stroke: var(--accent); stroke-width: 1.3; }
  .sv-bar { fill: var(--ink2); }
  .sv-bar.acc { fill: var(--accent); }
  .sv-bar.sil { fill: var(--mit-silver); }
  .sv-bar.hot { fill: var(--hot); }
  .sv-fsurf { fill: var(--surface); }
  .sv-facc { fill: var(--accent); }
  .sv-fhot { fill: var(--hot); }
  .sv-ring { fill: none; stroke: var(--accent); stroke-width: 2.5; }
  .sv-hring { fill: none; stroke: var(--hot); stroke-width: 2.5; }
  .sv-halo { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
  .sv-hit { fill: transparent; }
  .chartbox.edit .sv-hit { cursor: ns-resize; }
  .chartbox.edit svg { touch-action: none; }
  .sv-hit:focus { outline: none; }
  .sv-hit:focus-visible + rect, .sv-hit:hover + rect { stroke: var(--ink); stroke-width: 1.5; }
  .legend2 { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink2); margin-top: 6px; }
  .legend2 span { display: inline-flex; align-items: center; gap: 6px; }
  .legend2 span[hidden] { display: none; }
  .legend2 i { display: inline-block; flex: none; }
  .legend2 i.l-reg { width: 14px; height: 11px; background: var(--region); border: 1px solid var(--mit-silver); }
  .legend2 i.l-sus { width: 14px; height: 11px; background: var(--sel); border: 2px solid var(--accent); }
  .legend2 i.l-dot { width: 10px; height: 10px; border-radius: 50%; border: 2.5px solid var(--ink); }
  .legend2 i.l-acc { width: 18px; height: 0; border-top: 3px solid var(--accent); }
  .legend2 i.l-hot { width: 18px; height: 0; border-top: 2.5px solid var(--hot); }
  .legend2 i.l-ink2 { width: 18px; height: 0; border-top: 2px solid var(--ink2); }
  .legend2 i.l-sil { width: 18px; height: 0; border-top: 2px dashed var(--mit-silver); }

  /* ---- tables ---- */
  .tblwrap { margin-top: 10px; }
  table.data td.num, table.data th.num { text-align: right; }
  table.data td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.data.small { min-width: 0; width: auto; }
  table.data tr.spe td { background: var(--sel); font-weight: 600; }
  table.data td.acc { color: var(--accent-text); font-weight: 700; }
  table.data td.hot { color: var(--hot); font-weight: 600; }
  table.data td.bar { width: 30%; min-width: 60px; }
  @media (max-width: 560px) { #gts-r-table td.bar, #gts-r-table th.bar { display: none; } #gts-r-table { min-width: 0; } }
  table.data td.bar i { display: block; height: 10px; background: var(--ink2); }
  table.data tr.top td.bar i { background: var(--accent); }
  table.nf { border-collapse: collapse; margin-top: 8px; }
  table.nf th { font-size: 12.5px; font-weight: 600; color: var(--ink2); padding: 4px 8px; text-align: center; white-space: nowrap; }
  table.nf th.rh { text-align: right; }
  table.nf td { border: 1px solid var(--axis); padding: 0; background: var(--surface); }
  table.nf td.ne { box-shadow: inset 0 0 0 2.5px var(--accent); }
  table.nf td.ne.nc { box-shadow: inset 0 0 0 2.5px var(--hot); }
  table.nf td.ne.spe { background: var(--sel); }
  .nfc { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: 1fr 1fr; width: 84px; height: 46px; padding: 4px 7px; font-variant-numeric: tabular-nums; }
  .nfc .u1 { grid-area: 2 / 1; justify-self: start; align-self: end; font-weight: 700; color: var(--ink); font-size: 14px; }
  .nfc .u2 { grid-area: 1 / 2; justify-self: end; align-self: start; color: var(--ink2); font-size: 14px; }
  @media (max-width: 560px) { .nfc { width: 66px; height: 42px; padding: 3px 5px; } .nfc .u1, .nfc .u2 { font-size: 12.5px; } table.nf th { font-size: 11.5px; padding: 3px 5px; } }

  /* ---- ultimatum ---- */
  .tokens { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; min-height: 30px; }
  .tok { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font: 700 12px var(--font-sans); font-variant-numeric: tabular-nums; }
  .tok.yes { background: var(--accent); color: var(--on-solid); }
  .tok.no { background: var(--surface); color: var(--hot); box-shadow: inset 0 0 0 2px var(--hot); }

  /* ---- repeated game ---- */
  .unravel { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
  .unravel .rd { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
  .unravel .rd b { display: inline-flex; width: 30px; height: 26px; align-items: center; justify-content: center; border-radius: 2px; font-size: 13px; color: var(--on-solid); background: var(--hot); }
  .mdp td.num.best { color: var(--accent-text); font-weight: 700; }

  /* ---- model ---- */
  .model-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 22px; align-items: start; }
  @media (max-width: 860px) { .model-grid { grid-template-columns: minmax(0, 1fr); } }
  .model-grid > div { min-width: 0; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="backlink" href="index.html" data-keep-lang><span aria-hidden="true">←</span> <span data-i18n="gts.back"></span></a>
    <div class="lang" data-lang-switcher></div>
  </div>
</header>

<div class="wrap">
  <header class="masthead">
    <p class="eyebrow" data-i18n-html="gts.eyebrow"></p>
    <h1 data-i18n="gts.title"></h1>
    <p class="lede" data-i18n-html="gts.lede"></p>
  </header>

  <!-- =================================================================== games in turns -->
  <div class="card">
    <h2><span class="kicker" data-i18n="gts.what.kicker"></span><span data-i18n="gts.what.title"></span></h2>
    <div class="two">
      <div>
        <p class="mtext" style="margin-top:0" data-i18n-html="gts.what.p1"></p>
        <p class="mtext" data-i18n-html="gts.what.p2"></p>
        <p class="mtext" data-i18n-html="gts.what.p3"></p>
      </div>
      <div>
        <p class="mhead" data-i18n="gts.what.head"></p>
        <div class="formula" data-tex="gts.what.tex" data-i18n="gts.what.formula"></div>
        <p class="mtext" id="gts-what-p4"></p>
      </div>
    </div>
  </div>

  <!-- =================================================================== 1. animation -->
  <section class="block" id="gts-sec" aria-labelledby="h-anim">
    <h2 class="section-title" id="h-anim"><span class="case-num" data-i18n="gts.part1"></span><span data-i18n="nav.animation"></span></h2>
    <p class="section-intro" data-i18n-html="gts.anim.intro"></p>
    <div class="anim-controls">
      <span class="ctl-label" id="gts-sc-lbl" data-i18n="gts.anim.ctl"></span>
      <div class="seg" role="group" aria-labelledby="gts-sc-lbl" id="gts-seg">
        <button type="button" data-sc="entry" aria-pressed="true" data-i18n="gts.sc.entry"></button>
        <button type="button" data-sc="leader" aria-pressed="false" data-i18n="gts.sc.leader"></button>
        <button type="button" data-sc="cent" aria-pressed="false" data-i18n="gts.sc.cent"></button>
      </div>
    </div>
    <div class="anim" id="gts-anim">
      <div class="anim-stage" role="img">
        <div class="anim-hud" id="gts-hud">
          <div class="chip-stat" id="gts-c0"><b></b><span></span></div>
          <div class="chip-stat long" id="gts-c1"><b></b><span></span></div>
          <div class="chip-stat" id="gts-c2"><b></b><span></span></div>
          <div class="chip-stat" id="gts-c3"><b></b><span></span></div>
          <div class="chip-stat" id="gts-c4"><b></b><span></span></div>
        </div>
      </div>
    </div>
    <div class="anim-legend">
      <span><i class="lg-p1"></i><span data-i18n="gts.lg.p1"></span></span>
      <span><i class="lg-p2"></i><span data-i18n="gts.lg.p2"></span></span>
      <span><i class="lg-leaf"></i><span data-i18n="gts.lg.leaf"></span></span>
      <span><i class="lg-best"></i><span data-i18n="gts.lg.best"></span></span>
      <span><i class="lg-drop"></i><span data-i18n="gts.lg.drop"></span></span>
      <span><i class="lg-path"></i><span data-i18n="gts.lg.path"></span></span>
      <span id="gts-lg-threat"><i class="lg-threat"></i><span data-i18n="gts.lg.threat"></span></span>
      <span id="gts-lg-spe"><i class="lg-spe"></i><span data-i18n="gts.lg.spe"></span></span>
      <span id="gts-lg-nc"><i class="lg-nc"></i><span data-i18n="gts.lg.nc"></span></span>
    </div>
    <p class="scen-status" id="gts-status" aria-live="polite"></p>
    <p class="mhead" data-i18n="gts.s1.head"></p>

    $("gts-n3").innerHTML = T("gts.n.p3", { p: upair(Gc, Sc.sol.leaf.u), end: upair(Gc, endL.u), r: fmt(endL.u[0] / t1.u[0], 1), thr: pct(rep.thr, 1),
      num: fv(Gc, rep.take1 - rep.taken), den: fv(Gc, rep.best - rep.taken) });
    if (!UR) UR = analyse(UG);
    $("gts-n4").innerHTML = T("gts.n.p4", { ne: fmt(UR.nf.ne, 0), spe: UR.spe.list.length });
    var th = thresholds(), tr = pdValid() && tourCache.res ? tourCache.res : null, top = "";
    if (tr) { var sc = tr.score, bi = sc.indexOf(Math.max.apply(null, sc)); top = T("gts.r.s." + STRATS[bi]); }
    $("gts-n5").innerHTML = pdValid() ? T("gts.n.p5", { g: fmt(th.grim, 2, 2), t: fmt(th.tft, 2, 2), w: fmt(rp.w, 2, 2), top: top }) : T("gts.r.notpd");
    $("gts-n6").innerHTML = T("gts.n.p6");
  }

  function renderPage() {
    syncChapterNames();
    renderScenText();
    buildEntryInputs();
    renderEditor();
    renderUltAll();
    renderRep();
    renderModel();
    renderNotes();
    hudKey = "";
    SCN.entry && (SCN.entry.lay = null); SCN.leader && (SCN.leader.lay = null); SCN.cent && (SCN.cent.lay = null);
    player.refresh();
  }
  I18N.onChange(renderPage);
})();
</script>
