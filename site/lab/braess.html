     The network (stylized and illustrative): five roads, t_e(x) = a_e + b_e x minutes for x cars per hour.
     Roads: 0 O->A, 1 A->D, 2 O->B, 3 B->D, 4 A->B (the connector). Routes: via A, via B and the zigzag O, A, B, D.
     ===================================================================================== */
  var LA = [5, 45, 45, 5, 2], LB = [0.01, 0, 0, 0.01, 0];
  var ENDS = [["O", "A"], ["A", "D"], ["O", "B"], ["B", "D"], ["A", "B"]];
  var PATHS = [[0, 1], [2, 3], [0, 4, 3]];
  var NODE_SEQ = [["O", "A", "D"], ["O", "B", "D"], ["O", "A", "B", "D"]];
  var DEMANDS = [2000, 4000, 8000];             // the three mornings of the animation (illustrative)
  var S0 = 0.75;                                // share via A on the first morning, before drivers adjust (illustrative)
  var VOT = 15000;                              // value of time, COP per hour (illustrative)
  var DMAX = 10000;
  var Z5 = [0, 0, 0, 0, 0];

  function linkFlows(f) {
    var x = [0, 0, 0, 0, 0];
    PATHS.forEach(function (p, i) { p.forEach(function (e) { x[e] += f[i] || 0; }); });
    return x;
  }
  // everything that follows from route flows f (and tolls tau): road flows and times, route times, totals
  function evalFlows(f, tau) {
    tau = tau || Z5;
    var x = linkFlows(f), t = x.map(function (v, e) { return LA[e] + LB[e] * v; });
    var c = PATHS.map(function (p) { return p.reduce(function (s, e) { return s + t[e]; }, 0); });

      if (state.d === d) return;
      state.d = d;
      segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      chapterKeys(); renderStatus(); renderTable();
      hudKey = "";
      if (A.reducedMotion) { player.seek(DUR); return; }
      if (player.time < CH[2]) player.refresh();
      else { player.seek(CH[2] + 0.001); player.play(); }
    });
  });

  function renderPage() {
    renderSeg(); renderIntro(); chapterKeys(); renderStatus(); renderModel(); renderTable(); renderNotes(); renderPlan();
    hudKey = "";
    player.refresh();
  }
  I18N.onChange(renderPage);
  window.__brs = { scen: scen, SW: SW, solve: solve, plan: plan, player: player };   // for the page checks
})();
</script>
