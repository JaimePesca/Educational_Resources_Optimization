<!doctype html>
<html lang="en" data-title-key="mlai.title" data-i18n-bundles="lab/lab-ml-ai-cases">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23750014%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27Helvetica,Arial,sans-serif%27 font-size=%2716%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3Ex*%3C/text%3E%3C/svg%3E">
<title>ML + AI in Optimization</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="../assets/site.css?v=__BUILD__">
<link rel="stylesheet" href="../assets/research.css?v=__BUILD__">
<style>
  [hidden] { display: none !important; }
  /* ---- case index ---- */
  .case-nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 760px) { .case-nav { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .case-nav a {
    display: flex; gap: 9px; align-items: baseline; padding: 10px 12px; min-width: 0;
    background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--accent); border-radius: 3px;
    color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14px; line-height: 1.3;
  }
  .case-nav a:hover { background: var(--surface2); }
  .case-nav .n, .case-num { font-family: var(--font-mono); color: var(--accent-text); font-weight: 600; }
  .case-num { display: block; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }
  section.block { scroll-margin-top: 70px; grid-template-columns: minmax(0, 1fr); }
  section.block > * { min-width: 0; }

  /* ---- controls ---- */
  .ctl-row { display: flex; flex-wrap: wrap; gap: 12px 26px; align-items: flex-end; }
  .ctl-group { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .ctl-group .lbl { font-size: 13px; color: var(--ink2); font-weight: 600; }
  .ctl-inline { display: flex; flex-wrap: wrap; gap: 6px; }
  .chk {
    display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--ink); cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); padding: 7px 10px; border-radius: 2px; user-select: none;
  }
  .chk input { accent-color: var(--accent); margin: 0; width: 15px; height: 15px; }
  .chk:has(input:checked) { border-color: var(--accent); }
  .chk:has(input:disabled) { cursor: default; opacity: 0.75; }
  button.btn {
    font: 600 13px var(--font-sans); color: var(--on-solid); background: var(--accent); border: 1px solid var(--accent); border-radius: 2px;
    padding: 8px 12px; cursor: pointer; white-space: nowrap;
  }
  button.btn:hover { filter: brightness(1.1); }
  button.btn:disabled { opacity: 0.45; cursor: default; filter: none; }
  button.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--border); }
  .rng { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; min-width: 220px; flex: 1 1 240px; max-width: 360px; }
  .rng label { font-size: 13px; color: var(--ink2); font-weight: 600; }
  .rng output { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); text-align: right; }
  .rng input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 0; }
  .status { font-size: 13px; color: var(--muted); margin: 10px 0 0; min-height: 1.4em; }
  .status b { color: var(--ink2); }

  /* ---- live numbers ---- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 14px; }
  @media (max-width: 460px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .kpi { border: 1px solid var(--border); border-radius: 3px; padding: 8px 11px; background: var(--surface); min-width: 0; }
  .kpi b { display: block; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); letter-spacing: -0.01em; line-height: 1.2; }
  .kpi span { display: block; font-size: 12.5px; color: var(--ink2); line-height: 1.3; margin-top: 2px; }
  .kpi.accent { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .kpi.accent b { color: var(--accent-text); }
  @media (max-width: 460px) { .kpi b { font-size: 17px; } .kpi span { font-size: 12px; } }

  /* ---- charts ---- */
  .chartbox { margin-top: 14px; min-width: 0; }
  .chartbox svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart-title { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--ink2); }
  .anim-legend { margin-top: 8px; }
  .anim-legend i.sw-mf { background: var(--mit-silver); }
  .anim-legend i.sw-ln { background: var(--accent); }
  .anim-legend i.sw-sb { background: var(--ink); }
  .anim-legend i.ln { width: 18px; height: 3px; }
  .anim-legend i.ln-ink { background: var(--ink); }
  .anim-legend i.ln-dash { background: repeating-linear-gradient(90deg, var(--ink) 0 5px, transparent 5px 8px); }
  .anim-legend i.ln-red { background: var(--accent); }
  .anim-legend i.ln-gray { background: var(--ink2); }
  .anim-legend i.ln-silver { background: var(--mit-silver); }
  .anim-legend i.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mit-silver); }
  .anim-legend i.ave { width: 18px; height: 5px; background: var(--mit-silver); }
  .anim-legend i.side { width: 18px; height: 2px; background: var(--axis); }

  /* ---- tables ---- */
  table.data { min-width: 0; margin-top: 14px; }
  table.data th.num, table.data td.num { text-align: right; }
  table.data td.num { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
  table.data td.best { color: var(--accent-text); font-weight: 700; }
  table.data tr.avg td { border-top: 1px solid var(--axis); font-weight: 700; }
  @media (max-width: 560px) {
    table.data .wide { display: none; }
    table.data th, table.data td { padding-inline: 5px; font-size: 12px; }
    table.data td.num { font-size: 11.5px; }
  }

  /* ---- limits ---- */
  .limits {
    border-left: 3px solid var(--mit-silver); background: var(--surface2); border-radius: 2px;
    padding: 10px 14px; font-size: 14px; color: var(--ink2); margin: 0; max-width: 92ch;
  }
  .limits b { color: var(--ink); }
  .mhead { margin: 16px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-text); }

  /* ---- case 3 ---- */
  .rl-grid { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 18px; align-items: start; margin-top: 14px; }
  @media (max-width: 820px) { .rl-grid { grid-template-columns: minmax(0, 1fr); } }
  .rl-grid .chartbox { margin-top: 0; }
  #c3-map { max-width: 440px; }

  /* ---- case 4 ---- */
  .c4-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 860px) { .c4-grid { grid-template-columns: minmax(0, 1fr); } }
  .c4-grid > div { min-width: 0; }
  .statement { margin: 0; font-size: 14.5px; color: var(--ink); background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 12px 14px; }
  .proposal { margin-top: 14px; border: 1px solid var(--border); border-radius: 3px; background: var(--surface); }
  .proposal-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .proposal-head b { font-size: 14px; }
  .badge {
    font: 600 11px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink2); border: 1px dashed var(--mit-silver); padding: 2px 7px; border-radius: 2px;
  }
  .proposal .formula { margin: 8px 10px 10px; }
  .proposal-note { margin: 0 12px 10px; font-size: 13px; color: var(--muted); }
  .checks { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
  .checks li {
    display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start;
    border: 1px solid var(--border); border-radius: 3px; padding: 9px 12px; background: var(--surface);
    transition: opacity 0.25s, transform 0.25s;
  }
  .checks li.wait { opacity: 0; transform: translateY(4px); }
  .checks .mark {
    width: 24px; height: 24px; border-radius: 2px; display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: var(--on-solid); background: var(--ink);
  }
  .checks li.fail { border-color: var(--accent); }
  .checks li.fail .mark { background: var(--accent); }
  .checks .t { display: block; font-weight: 600; font-size: 14px; color: var(--ink); }
  .checks .d { display: block; font-size: 13px; color: var(--ink2); margin-top: 2px; }
  .verdict { margin: 12px 0 0; padding: 10px 14px; border-radius: 3px; font-size: 14.5px; border: 1px solid var(--border); background: var(--surface2); color: var(--ink); }
  .verdict.fail { border-color: var(--accent); background: var(--sel); }
  .verdict b { color: var(--ink); }
  .verdict.fail b { color: var(--accent-text); }
  #c4-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  details.ref { margin-top: 14px; }
  details.ref .body { max-width: none; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="backlink" href="index.html" data-keep-lang><span aria-hidden="true">←</span> <span data-i18n="mlai.back"></span></a>
    <div class="lang" data-lang-switcher></div>
  </div>
</header>

<div class="wrap">
  <header class="masthead">
    <p class="eyebrow" data-i18n-html="mlai.eyebrow"></p>
    <h1 data-i18n="mlai.title"></h1>
    <p class="lede" data-i18n-html="mlai.lede"></p>
  </header>

  <nav class="case-nav" data-i18n-attr="aria-label:mlai.nav.aria">
    <a href="#c1"><span class="n">1</span><span data-i18n="mlai.c1.title"></span></a>
    <a href="#c2"><span class="n">2</span><span data-i18n="mlai.c2.title"></span></a>
    <a href="#c3"><span class="n">3</span><span data-i18n="mlai.c3.title"></span></a>
    <a href="#c4"><span class="n">4</span><span data-i18n="mlai.c4.title"></span></a>
  </nav>

  <!-- =================================================================== case 1 -->
  <section class="block" id="c1" aria-labelledby="c1-h">
    <h2 class="section-title" id="c1-h"><span class="case-num" data-i18n="mlai.case1"></span><span data-i18n="mlai.c1.title"></span></h2>
    <p class="section-intro" data-i18n-html="mlai.c1.intro"></p>
    <div class="card">
      <div class="ctl-row">
        <div class="ctl-group" role="group" aria-labelledby="c1-feat-lbl">
          <span class="lbl" id="c1-feat-lbl" data-i18n="mlai.c1.feat"></span>
          <div class="ctl-inline">
            <label class="chk"><input type="checkbox" data-f="1" checked><span data-i18n="mlai.c1.f.frac"></span></label>
            <label class="chk"><input type="checkbox" data-f="2" checked><span data-i18n="mlai.c1.f.val"></span></label>
            <label class="chk"><input type="checkbox" data-f="3" checked><span data-i18n="mlai.c1.f.size"></span></label>
          </div>
        </div>
        <div class="ctl-group">
          <span class="lbl" id="c1-tr-lbl" data-i18n="mlai.c1.train"></span>
          <div class="seg" role="group" aria-labelledby="c1-tr-lbl" id="c1-tr">
            <button type="button" data-n="1" aria-pressed="false">1</button>
            <button type="button" data-n="3" aria-pressed="false">3</button>
            <button type="button" data-n="10" aria-pressed="true">10</button>
          </div>
        </div>
        <div class="ctl-group">
          <button type="button" class="btn ghost" id="c1-new" data-i18n="mlai.c1.new"></button>
        </div>
      </div>
      <p class="status" id="c1-status" aria-live="polite"></p>
      <div class="kpis" id="c1-kpis"></div>
      <div class="chartbox" id="c1-chart" role="img"></div>
      <div class="anim-legend">
        <span><i class="sw-mf"></i><span data-i18n="mlai.c1.r.mf"></span></span>
        <span><i class="sw-ln"></i><span data-i18n="mlai.c1.r.ln"></span></span>
        <span><i class="sw-sb"></i><span data-i18n="mlai.c1.r.sb"></span></span>
      </div>
      <div class="tblwrap"><table class="data" id="c1-table"></table></div>
      <p class="mhead" data-i18n="mlai.c1.model.head"></p>
      <div class="formula" data-tex="mlai.c1.model.tex" data-i18n="mlai.c1.model.formula"></div>
      <p class="mhead" data-i18n="mlai.c1.fit.head"></p>
      <div class="formula" id="c1-fit"></div>
    </div>
    <p class="limits" data-i18n-html="mlai.c1.limits"></p>
  </section>

  <!-- =================================================================== case 2 -->
  <section class="block" id="c2" aria-labelledby="c2-h">
    <h2 class="section-title" id="c2-h"><span class="case-num" data-i18n="mlai.case2"></span><span data-i18n="mlai.c2.title"></span></h2>
    <p class="section-intro" data-i18n-html="mlai.c2.intro"></p>
    <div class="card">
      <div class="ctl-row">
        <div class="rng">
          <label for="c2-cu" data-i18n="mlai.c2.cu"></label><output id="c2-cu-out" for="c2-cu"></output>
          <input type="range" id="c2-cu" min="500" max="6000" step="250" value="4000">
        </div>
        <div class="rng">
          <label for="c2-k" data-i18n="mlai.c2.k"></label><output id="c2-k-out" for="c2-k"></output>
          <input type="range" id="c2-k" min="0.5" max="2" step="0.25" value="1">
        </div>
        <div class="ctl-group">
          <span class="lbl" id="c2-n-lbl" data-i18n="mlai.c2.n"></span>
          <div class="seg" role="group" aria-labelledby="c2-n-lbl" id="c2-n">
            <button type="button" data-n="20" aria-pressed="false">20</button>
            <button type="button" data-n="60" aria-pressed="true">60</button>
            <button type="button" data-n="200" aria-pressed="false">200</button>
          </div>
        </div>
      </div>
      <p class="status" id="c2-status" aria-live="polite"></p>
      <div class="kpis" id="c2-kpis"></div>
      <div class="chartbox" id="c2-chart" role="img"></div>
      <div class="anim-legend">
        <span><i class="dot"></i><span data-i18n="mlai.c2.lg.data"></span></span>
        <span><i class="ln ln-dash"></i><span data-i18n="mlai.c2.p.or"></span></span>
        <span><i class="ln ln-gray"></i><span data-i18n="mlai.c2.p.ls"></span></span>
        <span><i class="ln ln-red"></i><span data-i18n="mlai.c2.p.qr"></span></span>
      </div>
      <div class="tblwrap"><table class="data" id="c2-table"></table></div>
      <p class="mhead" data-i18n="mlai.c2.model.head"></p>
      <div class="formula" data-tex="mlai.c2.model.tex" data-i18n="mlai.c2.model.formula"></div>
      <p class="mhead" data-i18n="mlai.c2.fit.head"></p>
      <div class="formula" id="c2-fit"></div>
    </div>
    <p class="limits" id="c2-limits"></p>
  </section>

  <!-- =================================================================== case 3 -->
  <section class="block" id="c3" aria-labelledby="c3-h">
    <h2 class="section-title" id="c3-h"><span class="case-num" data-i18n="mlai.case3"></span><span data-i18n="mlai.c3.title"></span></h2>
    <p class="section-intro" data-i18n-html="mlai.c3.intro"></p>
    <div class="card">
      <div class="ctl-row">
        <div class="ctl-group">
          <span class="lbl" id="c3-sc-lbl" data-i18n="mlai.c3.sc"></span>
          <div class="seg" role="group" aria-labelledby="c3-sc-lbl" id="c3-sc">
            <button type="button" data-v="off" aria-pressed="true" data-i18n="mlai.c3.sc.off"></button>
            <button type="button" data-v="rush" aria-pressed="false" data-i18n="mlai.c3.sc.rush"></button>
          </div>
        </div>
        <div class="rng">
          <label for="c3-ep" data-i18n="mlai.c3.ep"></label><output id="c3-ep-out" for="c3-ep"></output>
          <input type="range" id="c3-ep" min="100" max="3000" step="100" value="1500">
        </div>
        <div class="ctl-group">
          <span class="lbl" id="c3-eps-lbl" data-i18n="mlai.c3.eps"></span>
          <div class="seg" role="group" aria-labelledby="c3-eps-lbl" id="c3-eps">
            <button type="button" data-v="0.05" aria-pressed="false"></button>
            <button type="button" data-v="0.1" aria-pressed="true"></button>
            <button type="button" data-v="0.3" aria-pressed="false"></button>
          </div>
        </div>
        <div class="ctl-group">
          <button type="button" class="btn ghost" id="c3-seed"></button>
        </div>
      </div>
      <p class="status" id="c3-status" aria-live="polite"></p>
      <div class="kpis" id="c3-kpis"></div>
      <div class="rl-grid">
        <div>
          <p class="chart-title" data-i18n="mlai.c3.map"></p>
          <div class="chartbox" id="c3-map" role="img"></div>
          <div class="anim-legend">
            <span><i class="ave"></i><span data-i18n="mlai.c3.lg.ave"></span></span>
            <span><i class="side"></i><span data-i18n="mlai.c3.lg.side"></span></span>
            <span><i class="ln ln-dash"></i><span data-i18n="mlai.c3.lg.dp"></span></span>
            <span><i class="ln ln-red"></i><span data-i18n="mlai.c3.lg.q"></span></span>
          </div>
        </div>
        <div>
          <p class="chart-title" data-i18n="mlai.c3.curve"></p>
          <div class="chartbox" id="c3-chart" role="img"></div>
          <div class="anim-legend">
            <span><i class="ln ln-silver"></i><span data-i18n="mlai.c3.lg.avg"></span></span>
            <span><i class="ln ln-red"></i><span data-i18n="mlai.c3.lg.greedy"></span></span>
            <span><i class="ln ln-dash"></i><span data-i18n="mlai.c3.lg.opt"></span></span>
          </div>
        </div>
      </div>
      <p class="mhead" data-i18n="mlai.c3.model.head"></p>
      <div class="formula" data-tex="mlai.c3.model.tex" data-i18n="mlai.c3.model.formula"></div>
    </div>
    <p class="limits" id="c3-limits"></p>
  </section>

  <!-- =================================================================== case 4 -->
  <section class="block" id="c4" aria-labelledby="c4-h">
    <h2 class="section-title" id="c4-h"><span class="case-num" data-i18n="mlai.case4"></span><span data-i18n="mlai.c4.title"></span></h2>
    <p class="section-intro" data-i18n-html="mlai.c4.intro"></p>
    <div class="card">
      <div class="c4-grid">
        <div>
          <p class="mhead" style="margin-top:0" data-i18n="mlai.c4.stmt.head"></p>
          <p class="statement" data-i18n="mlai.c4.stmt"></p>
          <div class="ctl-row" style="margin-top:14px">
            <div class="ctl-group">
              <span class="lbl" id="c4-pick-lbl" data-i18n="mlai.c4.pick"></span>
              <div class="seg" role="group" aria-labelledby="c4-pick-lbl" id="c4-pick">
                <button type="button" data-v="A" aria-pressed="true"></button>
                <button type="button" data-v="B" aria-pressed="false"></button>
              </div>
            </div>
            <div class="ctl-group">
              <button type="button" class="btn" id="c4-run" data-i18n="mlai.c4.run"></button>
            </div>
          </div>
          <div class="proposal">
            <div class="proposal-head"><b id="c4-cand-name"></b><span class="badge" data-i18n="mlai.c4.badge"></span></div>
            <div class="formula" id="c4-cand"></div>
            <p class="proposal-note" data-i18n="mlai.c4.units.note"></p>
          </div>
        </div>
        <div>
          <p class="mhead" style="margin-top:0" data-i18n="mlai.c4.check.head"></p>
          <ol class="checks" id="c4-checks"></ol>
          <p class="verdict" id="c4-verdict" aria-live="polite"></p>
          <div class="kpis" id="c4-kpis"></div>
        </div>
      </div>
      <details class="ref">
        <summary data-i18n="mlai.c4.ref.title"></summary>
        <div class="body">
          <p data-i18n="mlai.c4.ref.p"></p>
          <div class="formula" id="c4-ref"></div>
          <p id="c4-ref-sol"></p>
        </div>
      </details>
    </div>
    <p class="limits" data-i18n-html="mlai.c4.limits"></p>
  </section>

  <section>
    <details open>
      <summary data-i18n="mlai.n.title"></summary>
      <div class="body">
        <p id="mlai-n1"></p>
        <p id="mlai-n2"></p>
        <p id="mlai-n3"></p>
        <p id="mlai-n4"></p>
      </div>
    </details>
  </section>

  <p class="note further" data-further="2.1" data-refs="mlai.refs"></p>

  /* =====================================================================================

    run.checks.forEach(function (c) { if (c.cost != null) hi = Math.max(hi, c.cost); });
    hi = Math.min(hi, c3.dp.cost * 3.2);
    var st = niceStep(hi - lo, 4); lo = Math.floor(lo / st) * st; hi = Math.ceil(hi / st) * st;
    var X = function (e) { return ml + e / N * pw; }, Y = function (v) { return mt + ph - (Math.min(v, hi) - lo) / (hi - lo) * ph; };
    var o = [];
    for (var v = lo; v <= hi + 1e-9; v += st) { o.push(line(ml, Y(v), W - mr, Y(v), "var(--grid)")); o.push(txt(ml - 6, Y(v) + 3.5, fmt(v, 0), { anchor: "end", mono: true, size: 10 })); }
    var xs = niceStep(N, W < 520 ? 3 : 5);
    for (var e = 0; e <= N + 1e-9; e += xs) o.push(txt(X(e), H - mb + 14, fmt(e, 0), { anchor: e === 0 ? "start" : "middle", mono: true, size: 10 }));
    o.push(line(ml, Y(lo), W - mr, Y(lo), "var(--axis)"));
    o.push(txt(ml + pw / 2, H - 4, T("mlai.c3.ax.x"), { anchor: "middle", size: 11, fill: "var(--ink2)" }));
    o.push(txt(ml, mt - 3, T("mlai.c3.ax.y"), { size: 11, fill: "var(--ink2)" }));
    var stride = Math.max(1, Math.floor(N / 400)), d = "";
    for (i = 0; i < N; i += stride) d += (i ? "L" : "M") + X(i + 1).toFixed(1) + " " + Y(mov[i]).toFixed(1);
    d += "L" + X(N).toFixed(1) + " " + Y(mov[N - 1]).toFixed(1);
    o.push('<path d="' + d + '" fill="none" stroke="var(--mit-silver)" stroke-width="1.8"/>');
    var gd = "", pen = false;
    run.checks.forEach(function (c) {
      if (c.cost == null) { pen = false; return; }
      gd += (pen ? "L" : "M") + X(c.ep).toFixed(1) + " " + Y(c.cost).toFixed(1); pen = true;
    });
    o.push('<path d="' + gd + '" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>');
    o.push(line(ml, Y(c3.dp.cost), W - mr, Y(c3.dp.cost), "var(--ink)", 1.6, ' stroke-dasharray="6 4"'));
    host.setAttribute("aria-label", T("mlai.c3.chart.aria", { n: fmt(N, 0), dp: fmt(c3.dp.cost, 1) }));
    host.innerHTML = '<svg viewBox="0 0 ' + W + " " + H + '" width="' + W + '" height="' + H + '" aria-hidden="true">' + o.join("") + "</svg>";
  }
  segPick("c3-sc", "data-v", function (v) { c3.scn = v; c3update(); });
  segPick("c3-eps", "data-v", function (v) { c3.eps = +v; c3update(); });
  $("c3-ep").addEventListener("input", function () { c3.ep = +this.value; c3update(); });
  $("c3-seed").addEventListener("click", function () { c3.seed++; c3update(); });

  /* =====================================================================================
     Case 4. Checking a formulation. The two candidates are PREWRITTEN examples of what a language agent
     might propose (no AI service is called). The checker is real: it solves each candidate with
     LP.solve and runs five tests against the statement and a reference model written by a person.
     Profits in thousands of pesos. Illustrative data.
     ===================================================================================== */
  var REF = {
    c: [50, 130],
    rows: [
      { id: "carp", a: [0.75, 2], b: 80 },
      { id: "fin", a: [0.5, 1], b: 50 },
      { id: "wood", a: [3, 8], b: 340 },
      { id: "sales", a: [0, 1], b: 30 }
    ]
  };
  var PLAN = [40, 20];
  var CAND = {
    A: { c: [50, 130], rows: [
      { id: "carp", a: [45, 120], b: 4800, u: ["min", "min"], ub: "min" },
      { id: "fin", a: [30, 60], b: 3000, u: ["min", "min"], ub: "min" },
      { id: "wood", a: [3, 8], b: 340, u: ["board", "board"], ub: "board" },
      { id: "sales", a: [0, 1], b: 30, u: ["table", "table"], ub: "table" }
    ] },
    B: { c: [50, 130], rows: [
      { id: "carp", a: [45, 2], b: 80, u: ["min", "h"], ub: "h" },
      { id: "fin", a: [0.5, 1], b: 50, u: ["h", "h"], ub: "h" },
      { id: "wood", a: [3, 8], b: 340, u: ["board", "board"], ub: "board" },
      { id: "sales", a: [0, 1], b: 30, u: ["table", "table"], ub: "table" }
    ] }
  };
  function lpOf(M) { return { sense: "max", c: M.c, rows: M.rows.map(function (r) { return { a: r.a, op: "<=", b: r.b }; }) }; }
  function dot(a, x) { return a[0] * x[0] + a[1] * x[1]; }
  var c4ref = LP.solve(lpOf(REF));
  function c4check(key) {
    var M = CAND[key], sol = LP.solve(lpOf(M)), tests = [];
    tests.push({ id: "solve", ok: sol.status === "optimal", status: sol.status });
    var badU = M.rows.filter(function (r) { return r.u.some(function (u, j) { return r.a[j] !== 0 && u !== r.ub; }); });
    tests.push({ id: "units", ok: !badU.length, rows: badU });
    var badP = M.rows.filter(function (r) { return dot(r.a, PLAN) > r.b + 1e-9; });
    tests.push({ id: "plan", ok: !badP.length, rows: badP });
    var x = sol.status === "optimal" ? sol.x : null;
    var badR = x ? REF.rows.filter(function (r) { return dot(r.a, x) > r.b + 1e-7; }) : [];
    tests.push({ id: "ref", ok: !!x && !badR.length, rows: badR, x: x });
    var zx = x ? dot(REF.c, x) : null;
    tests.push({ id: "obj", ok: !!x && Math.abs(zx - c4ref.z) <= 1e-6 * Math.max(1, Math.abs(c4ref.z)), z: zx });
    return { key: key, M: M, sol: sol, tests: tests, zx: zx };
  }
  var c4 = { key: "A", res: null, timers: [] };
  function unitName(u) { return T("mlai.c4.u." + u); }
  function c4tex(M, withUnits) {
    var lines = ["\\max\\;& " + termTex(M.c) + " && \\text{(" + T("mlai.c4.obj") + ")}"];
    M.rows.forEach(function (r, i) {
      var cm = "\\text{(" + T("mlai.c4.row." + r.id) + ")}";
      if (withUnits) cm = "\\text{(" + T("mlai.c4.row." + r.id) + ": " + r.u.filter(function (_, j) { return r.a[j] !== 0; }).map(unitName).join(", ") +
        "} \\le \\text{" + unitName(r.ub) + ")}";
      lines.push((i === 0 ? "\\text{ST}\\;" : "") + "& " + termTex(r.a) + " \\le " + texNum(r.b, r.b % 1 ? 2 : 0) + " && " + cm);
    });
    lines.push("& x_1,\\ x_2 \\ge 0 &&");
    return "\\begin{aligned}" + lines.join("\\\\") + "\\end{aligned}";
  }
  function termTex(a) {
    var s = "";
    [0, 1].forEach(function (j) {
      if (a[j] === 0) return;
      var coef = a[j] === 1 ? "" : texNum(a[j], a[j] % 1 ? (a[j] * 10) % 1 ? 2 : 1 : 0);
      s += (s ? " + " : "") + coef + "x_" + (j + 1);
    });
    return s;
  }
  function c4plain(M) {
    return T("mlai.c4.plain.max") + " " + M.c[0] + " x1 + " + M.c[1] + " x2; " + M.rows.map(function (r) {
      return T("mlai.c4.row." + r.id) + ": " + [0, 1].filter(function (j) { return r.a[j] !== 0; }).map(function (j) { return fmt(r.a[j], r.a[j] % 1 ? (r.a[j] * 10) % 1 ? 2 : 1 : 0) + " x" + (j + 1); }).join(" + ") + " ≤ " + fmt(r.b, 0);
    }).join("; ");
  }
  function rowNames(rows) { return rows.map(function (r) { return T("mlai.c4.row." + r.id); }).join(", "); }
  function c4render(animate) {
    var R = c4.res = c4check(c4.key), M = R.M;
    setText($("c4-cand-name"), T("mlai.c4.cand", { k: c4.key }));
    TeX.set($("c4-cand"), c4tex(M, true), c4plain(M));
    var html = R.tests.map(function (t) {
      var d;
      if (t.id === "solve") d = T(t.ok ? "mlai.c4.t.solve.ok" : "mlai.c4.t.solve.no", { s: T("mlai.c4.st." + t.status), it: R.sol.iterations });
      else if (t.id === "units") d = t.ok ? T("mlai.c4.t.units.ok") : T("mlai.c4.t.units.no", { rows: rowNames(t.rows), detail: t.rows.map(function (r) {
        return T("mlai.c4.t.units.row", { r: T("mlai.c4.row." + r.id), u: r.u.filter(function (_, j) { return r.a[j] !== 0; }).map(unitName).join(", "), b: unitName(r.ub) });
      }).join("; ") });
      else if (t.id === "plan") d = t.ok ? T("mlai.c4.t.plan.ok", { x1: PLAN[0], x2: PLAN[1] }) : T("mlai.c4.t.plan.no", { x1: PLAN[0], x2: PLAN[1], detail: t.rows.map(function (r) {
        return T("mlai.c4.t.plan.row", { r: T("mlai.c4.row." + r.id), lhs: fmt(dot(r.a, PLAN), 0), b: fmt(r.b, 0) });
      }).join("; ") });
      else if (t.id === "ref") d = !t.x ? T("mlai.c4.t.skip") : t.ok ? T("mlai.c4.t.ref.ok", { x1: fmt(t.x[0], 2), x2: fmt(t.x[1], 2) }) : T("mlai.c4.t.ref.no", { x1: fmt(t.x[0], 2), x2: fmt(t.x[1], 2), rows: rowNames(t.rows) });
      else d = t.z == null ? T("mlai.c4.t.skip") : T(t.ok ? "mlai.c4.t.obj.ok" : "mlai.c4.t.obj.no", { z: fmt(t.z, 2), ref: fmt(c4ref.z, 2), e: pctS((t.z / c4ref.z - 1) * 100, 1) });
      return '<li class="' + (t.ok ? "pass" : "fail") + (animate && !reduce ? " wait" : "") + '"><span class="mark" aria-hidden="true">' + (t.ok ? "✓" : "✗") + '</span><div><span class="t">' +
        T("mlai.c4.t." + t.id) + '</span><span class="d">' + d + '</span></div></li>';
    }).join("");
    c4.timers.forEach(clearTimeout); c4.timers = [];
    var list = $("c4-checks");
    list.innerHTML = html; list._h = null;
    var nfail = R.tests.filter(function (t) { return !t.ok; }).length;
    var v = $("c4-verdict");
    v.className = "verdict" + (nfail ? " fail" : "");
    v.innerHTML = nfail ? T("mlai.c4.v.no", { n: nfail, names: R.tests.filter(function (t) { return !t.ok; }).map(function (t) { return T("mlai.c4.t." + t.id); }).join(", ") }) : T("mlai.c4.v.ok");
    if (animate && !reduce) {
      v.style.opacity = "0";
      Array.prototype.forEach.call(list.children, function (li, q) { c4.timers.push(setTimeout(function () { li.classList.remove("wait"); }, 140 + 220 * q)); });
      c4.timers.push(setTimeout(function () { v.style.opacity = ""; }, 140 + 220 * list.children.length));
    } else v.style.opacity = "";
    var x = R.sol.x || [0, 0];
    kpis($("c4-kpis"), [
      { v: fmt(x[0], 2), l: T("mlai.c4.k.x1") },
      { v: fmt(x[1], 2), l: T("mlai.c4.k.x2") },
      { v: R.zx == null ? T("mlai.na") : fmt(R.zx, 2), l: T("mlai.c4.k.z"), accent: !!nfail },
      { v: fmt(c4ref.z, 2), l: T("mlai.c4.k.ref") }
    ]);
  }
  function c4static() {
    document.querySelectorAll("#c4-pick button").forEach(function (b) { b.textContent = T("mlai.c4.cand", { k: b.getAttribute("data-v") }); });
    var refM = { c: REF.c, rows: REF.rows };
    TeX.set($("c4-ref"), c4tex(refM, false), c4plain(refM));
    setText($("c4-ref-sol"), T("mlai.c4.ref.sol", { x1: fmt(c4ref.x[0], 2), x2: fmt(c4ref.x[1], 2), z: fmt(c4ref.z, 2), dc: fmt(c4ref.duals[0], 2), df: fmt(c4ref.duals[1], 2) }));
  }
  segPick("c4-pick", "data-v", function (v) { c4.key = v; c4render(true); notice(); });
  $("c4-run").addEventListener("click", function () { c4render(true); });

  /* ===================================================================================== what to notice */
  function notice() {
    if (c1.ready) {
      var s = c1stats();
      setHTML($("mlai-n1"), T("mlai.n.p1", { mf: fmt(s.mf, 1), ln: fmt(s.ln, 1), sb: fmt(s.sb, 1), lp: fmt(s.sblp, 1), g: s.gap == null ? T("mlai.na") : pct(s.gap, 0) }));
    } else setText($("mlai-n1"), T("mlai.c1.busy"));
    if (c2res) {
      var E = c2res.E;
      setHTML($("mlai-n2"), T("mlai.n.p2", { tau: fmt(c2res.tau, 3), ls: pctS((E.ls.cost / E.or.cost - 1) * 100), qr: pctS((E.qr.cost / E.or.cost - 1) * 100), out: pct(E.ls.out * 100, 1), outq: pct(E.qr.out * 100, 1) }));
    }
    if (c3.run) {
      var gp = c3.greedy.cost == null ? T("mlai.c3.noroute") : T("mlai.min", { v: fmt(c3.greedy.cost, 1) });
      setHTML($("mlai-n3"), T("mlai.n.p3", { dp: T("mlai.min", { v: fmt(c3.dp.cost, 1) }), q: gp, last: T("mlai.min", { v: fmt(c3last(100), 1) }), ep: fmt(c3.ep, 0) }));
    }
    var a = c4check("A"), b = c4check("B");
    setHTML($("mlai-n4"), T("mlai.n.p4", { za: fmt(a.zx, 2), zb: fmt(b.zx, 2), ref: fmt(c4ref.z, 2), fb: b.tests.filter(function (t) { return !t.ok; }).length }));
  }

  /* ===================================================================================== language + resize */
  function renderAll() {
    document.querySelectorAll("#c3-eps button").forEach(function (b) { b.textContent = T("mlai.c3.eps.v", { e: fmt(+b.getAttribute("data-v"), 2) }); });
    c1render(); c2update(); c3update(); c4static(); c4render(false); notice();
  }
  var started = false;
  I18N.onChange(function () {
    renderAll();
    if (!started) { started = true; setTimeout(c1compute, 30); }
  });
  var rt = 0, lastW = window.innerWidth;
  window.addEventListener("resize", function () {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth;
    clearTimeout(rt);
    rt = setTimeout(function () { if (c1.ready) c1chart(c1stats()); if (c2res) c2chart(); if (c3.run) { c3map(); c3chart(); } }, 120);
  });
})();
</script>
