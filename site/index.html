<style>
  html { scroll-behavior: smooth; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px); }
  .wrap { max-width: 1080px; gap: 0; }

  /* ---- hero ---- */
  .hero { padding-block: 44px 34px; display: grid; gap: 14px; }
  .hero h1 { font-size: clamp(40px, 8vw, 76px); margin: 0; }
  .hero h1 .opt { color: var(--accent-text); }
  .hero .lede { font-size: 17px; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 6px 0 0; padding: 0; list-style: none; }
  .facts li {
    font-family: var(--font-mono); font-size: 12.5px; color: var(--ink2);
    font-variant-numeric: tabular-nums;
  }
  .facts b { color: var(--ink); font-weight: 600; font-size: 15px; margin-right: 5px; }

  /* ---- division headers ---- */
  .division { padding-block: 34px 10px; border-top: 1px solid var(--axis); display: grid; gap: 20px; }
  .division-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 8px 32px; align-items: end; }
  @media (max-width: 760px) { .division-head { grid-template-columns: 1fr; } }
  .division-head h2 {
    font-family: var(--font-sans); font-weight: 700;
    font-size: clamp(28px, 4.4vw, 40px); line-height: 1.05; margin: 0; letter-spacing: -0.01em;
  }
  .division-head p { margin: 0; color: var(--ink2); max-width: 60ch; }

  /* ---- research projects ---- */
  .projects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 760px) { .projects { grid-template-columns: 1fr; } }
  .project {
    background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
    padding: 18px; display: flex; flex-direction: column; gap: 12px; scroll-margin-top: 80px;
  }
  .project-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .project h3 {
    font-family: var(--font-sans); font-weight: 600;
    font-size: 21px; line-height: 1.15; margin: 0; text-wrap: balance;
  }
  .project p.sum { margin: 0; color: var(--ink2); font-size: 14.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
    padding: 3px 8px; border-radius: 6px; background: var(--surface2); border: 1px solid var(--border);
    color: var(--ink2); white-space: nowrap;
  }
  .pindex {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted);
  }
  .case {
    display: grid; gap: 4px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 3px; padding: 10px 12px;
  }
  .case-label {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--accent-text); font-weight: 600;
  }
  .case-place { font-weight: 600; font-size: 14px; }
  .case-facts { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 2px 14px; }
  .case-facts li { font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }
  .planned-block { display: grid; gap: 8px; margin-top: 6px; }
  .planned-head {
    margin: 0; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--muted);
  }
  .planned-list {
    margin: 0; padding: 0; list-style: none; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px;
  }
  .planned-list li {
    border: 1.5px dashed var(--axis); border-radius: 4px; padding: 12px 14px; display: grid; gap: 5px; align-content: start;
  }
  .pl-head { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
  .pl-title { font-family: var(--font-sans); font-weight: 600; font-size: 16px; line-height: 1.2; }
  .pl-type {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted);
  }
  .pl-sum { margin: 0; font-size: 13px; color: var(--ink2); }
  .planned-list .rfrom { font-size: 12.5px; color: var(--muted); }
  .planned-list .rfrom b { color: var(--pine-text); font-weight: 600; }

  .case-link {
    margin-top: auto; align-self: flex-start; display: inline-flex; gap: 8px; align-items: center;
    font-weight: 700; font-size: 14.5px; text-decoration: none; color: var(--on-solid);
    background: var(--accent); padding: 9px 14px; border-radius: 2px;
  }
  .case-link:hover { filter: brightness(1.12); }
  .project.soon { opacity: 0.55; border-style: dashed; justify-content: center; min-height: 140px; }
  .project.soon h3 { color: var(--ink2); }

  /* ---- learning path ---- */
  .ladder { display: grid; gap: 0; }
  .level {
    display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 0 22px;
    padding-block: 22px; border-top: 1px solid var(--border); scroll-margin-top: 80px;
  }
  .level:first-child { border-top: none; padding-top: 4px; }
  @media (max-width: 620px) { .level { grid-template-columns: 1fr; gap: 6px; } }
  .lnum {
    font-family: var(--font-sans); font-weight: 700;
    font-size: 76px; line-height: 0.85; color: var(--accent-text); font-variant-numeric: tabular-nums;
    display: flex; flex-direction: column; gap: 8px;
  }
  .lnum small {
    font-family: var(--font-mono); font-weight: 400; font-size: 10.5px;
    letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); line-height: 1.2;
  }
  @media (max-width: 620px) { .lnum { flex-direction: row; align-items: baseline; font-size: 48px; } }
  .lbody { display: grid; gap: 10px; }
  .lbody h3 {
    font-family: var(--font-sans); font-weight: 600;
    font-size: 24px; line-height: 1.1; margin: 0;
  }
  .lbody p.sum { margin: 0; color: var(--ink2); max-width: 70ch; }
  .rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin-top: 4px; }
  .rcard {
    display: flex; flex-direction: column; gap: 6px; padding: 14px 15px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
    text-decoration: none; color: var(--ink); transition: border-color 0.15s, transform 0.15s;
  }
  .rcard:hover { border-color: var(--accent); transform: translateY(-1px); }
  .rcard .rtype {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--accent-text); font-weight: 600;
  }
  .rcard .rtitle { font-family: var(--font-sans); font-weight: 600; font-size: 18px; line-height: 1.15; }
  .rcard .rsum { font-size: 13.5px; color: var(--ink2); }
  .rcard .rfrom { margin-top: auto; padding-top: 4px; font-size: 12.5px; color: var(--muted); }
  .rcard .rfrom b { color: var(--pine-text); font-weight: 600; }
  .soon-box {
    border: 1.5px dashed var(--axis); border-radius: 4px; padding: 13px 15px;
    font-size: 13.5px; color: var(--muted); margin-top: 4px;
  }

  footer.foot { border-top: 1px solid var(--axis); margin-top: 26px; padding-top: 16px; display: grid; gap: 6px; }

  /* ---- door to the proposals lab: invisible, bottom right, in the gap just above the black footer bar.
     Out of the flow, so it moves nothing; hover shows a faint dot, keyboard focus the standard outline. ---- */
  .wrap { position: relative; }
  .lab-door {
    /* -34px = 28px door + 6px, inside the 40px margin-top of .site-footer (site.css); change both together */
    position: absolute; right: 0; bottom: -34px; width: 28px; height: 28px;
    display: block; background: transparent; border-radius: 2px; cursor: pointer;
  }
  .lab-door::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
    border-radius: 50%; background: var(--mit-silver); opacity: 0; transition: opacity 0.25s;
  }
  .lab-door:hover::after, .lab-door:focus-visible::after { opacity: 0.35; }
  /* ---- decoration (assets/home-art.js): drawn in code with the tokens, no text changes ---- */
  .hero { position: relative; }
  .hero > * { position: relative; }
  .hero::before {
    content: ""; position: absolute; top: 0; right: -16px; width: 52%; height: 78%; pointer-events: none;
    background-image: radial-gradient(circle, var(--axis) 1px, transparent 1.4px); background-size: 16px 16px;
    -webkit-mask-image: radial-gradient(ellipse at 82% 28%, #000 0, transparent 68%);
    mask-image: radial-gradient(ellipse at 82% 28%, #000 0, transparent 68%); opacity: 0.6;
  }
  .levels-band {
    margin-top: 12px; height: 270px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
    overflow: hidden; background-image: radial-gradient(circle, var(--grid) 1px, transparent 1.3px); background-size: 14px 14px;
  }
  .levels-band canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .band-links { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .band-link {
    display: flex; flex-direction: column; gap: 3px; align-self: start; padding: 12px 14px 8px; text-decoration: none;
    border-top: 3px solid transparent; height: 100%;
  }
  .band-link.on { border-top-color: var(--accent); }
  .band-n { font: 600 11px/1.2 var(--font-mono); letter-spacing: 0.12em; color: var(--accent-text); }
  .band-t { font-size: 12.5px; line-height: 1.25; font-weight: 600; color: var(--ink); opacity: 0.55; transition: opacity 0.2s; }
  .band-link.on .band-t, .band-link:hover .band-t { opacity: 1; }
  .band-link:focus-visible { outline-offset: -3px; }
  .band-picks { display: none; }
  .levels-band.phone { height: 300px; }
  .levels-band.phone .band-links { grid-template-columns: 1fr; }
  .levels-band.phone .band-link { display: none; padding-right: 150px; }
  .levels-band.phone .band-link.on { display: flex; }
  .levels-band.phone .band-picks { display: flex; gap: 4px; position: absolute; top: 12px; right: 10px; }
  .band-pick {
    width: 26px; height: 26px; padding: 0; cursor: pointer; border-radius: 2px;
    font: 600 11.5px var(--font-mono); color: var(--ink2); background: var(--surface); border: 1px solid var(--border);
  }
  .band-pick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-solid); }
  .lglyph { display: block; width: 92px; height: 72px; margin-top: 10px; }
  @media (max-width: 620px) { .lglyph { width: 64px; height: 48px; margin: 0 0 0 auto; align-self: center; } }
  .ticon { width: 13px; height: 13px; vertical-align: -2px; margin-right: 6px; fill: none; stroke: currentColor; stroke-width: 1.4; }
  .ticon .f { fill: currentColor; stroke: none; }
  .p-banner {
    margin: -18px -18px 2px; height: 112px; overflow: hidden; border-bottom: 1px solid var(--border);
    background: var(--surface2); border-radius: 4px 4px 0 0;
  }
  .p-banner svg { display: block; width: 100%; height: 100%; transition: transform 0.6s ease; }
  .project:hover .p-banner svg { transform: scale(1.04); }
  .project.soon .p-banner { opacity: 0.8; }
  .ha-pulse, .ha-fire { transform-box: fill-box; transform-origin: center; }
  .ha-pulse { animation: ha-pulse 3.4s ease-in-out infinite; }
  .ha-pulse.d1 { animation-delay: -1.1s; } .ha-pulse.d2 { animation-delay: -2.2s; }
  @keyframes ha-pulse { 0%, 100% { transform: scale(0.82); } 50% { transform: scale(1.12); } }
  .ha-flow { animation: ha-flow 1.4s linear infinite; }
  @keyframes ha-flow { to { stroke-dashoffset: -12; } }
  .ha-fire { animation: ha-fire 2.6s ease-in-out infinite; }
  @keyframes ha-fire { 0%, 100% { transform: scale(0.96); } 50% { transform: scale(1.05); } }
  .ha-drop { animation: ha-drop 4.5s ease-in-out infinite; }
  @keyframes ha-drop {
    0% { transform: translateY(-46px); opacity: 0; } 12% { opacity: 1; }
    40%, 90% { transform: none; opacity: 1; } 100% { transform: none; opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .ha-pulse, .ha-flow, .ha-fire, .ha-drop { animation: none; } .p-banner svg { transition: none; } }

</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#top"><span class="brand-mark" aria-hidden="true">x*</span><span data-i18n="site.name"></span></a>
    <nav class="topnav" data-i18n-attr="aria-label:nav.sections">
      <a href="#learn" data-i18n="nav.learn"></a>
      <a href="#research" data-i18n="nav.research"></a>
    </nav>
    <div class="lang" data-lang-switcher></div>
  </div>
</header>

<div class="wrap" id="top">
  <section class="hero">
    <p class="eyebrow" data-i18n="home.eyebrow"></p>
    <h1 data-i18n-html="home.title"></h1>
    <p class="lede" data-i18n="home.lede"></p>
    <ul class="facts" id="facts"></ul>
    <div class="levels-band" id="levels-band"><canvas aria-hidden="true"></canvas><nav class="band-links" data-i18n-attr="aria-label:nav.learn"></nav><div class="band-picks"></div></div>
  </section>

  <section class="division" id="learn" aria-labelledby="learn-h">
    <div class="division-head">
      <div>
        <p class="eyebrow" data-i18n="home.learn.eyebrow"></p>
        <h2 id="learn-h" data-i18n="nav.learn"></h2>
      </div>
      <p data-i18n="home.learn.intro"></p>
    </div>
    <div class="ladder" id="ladder"></div>
  </section>

  <section class="division" id="research" aria-labelledby="research-h">
    <div class="division-head">
      <div>
        <p class="eyebrow" data-i18n="home.research.eyebrow"></p>
        <h2 id="research-h" data-i18n="nav.research"></h2>
      </div>
      <p data-i18n="home.research.intro"></p>
    </div>
    <div class="projects" id="projects"></div>
  </section>

  <footer class="foot">
    <p class="note" id="langnote"></p>
    <p class="note" data-i18n="home.footer"></p>
  </footer>
  <a class="lab-door" href="lab/index.html" data-keep-lang data-i18n-attr="aria-label:lab.door"></a>
</div>

<script src="assets/i18n.js?v=__BUILD__" charset="utf-8"></script>
<script src="assets/site.js?v=__BUILD__" charset="utf-8"></script>
<script src="locales/en.js?v=__BUILD__" charset="utf-8"></script>
<script src="assets/catalog.js?v=__BUILD__" charset="utf-8"></script>
<script src="assets/home-art.js?v=__BUILD__" charset="utf-8"></script>
<script>
(function () {
  "use strict";
  var t = I18N.t, C = window.CATALOG;

  function h(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function published(r) { return !!r.href; }
  function byLevel(id) { return C.education.filter(function (r) { return r.level === id; }); }

  function renderFacts() {
    var ul = document.getElementById("facts"); ul.textContent = "";
    var live = C.education.filter(published).length;
    [[C.levels.length, "home.facts.levels"], [live, "home.facts.resources"],
     [C.education.length - live, "home.facts.planned"], [C.research.filter(published).length, "home.facts.projects"],
     [I18N.languages.length, "home.facts.languages"]]
      .forEach(function (f) {
        var li = h("li"); var b = h("b", null, f[0]);
        li.append(b, document.createTextNode(t(f[1])));
        ul.appendChild(li);
      });
  }

  function renderProjects() {
    var host = document.getElementById("projects"); host.textContent = "";
    C.research.forEach(function (p, i) {
      var card = h("article", "project"); card.id = "project-" + p.id;
      card.appendChild(HomeArt.banner(p.id));
      if (!p.href) { // placeholder for a coming project: same card, dimmed, title only, no link
        card.classList.add("soon");
        card.appendChild(h("h3", null, t("project." + p.id + ".title")));
        host.appendChild(card);
        return;
      }

      var top = h("div", "project-top");
      top.appendChild(h("span", "pindex", t("home.projectN", { n: i + 1 })));

      var kase = h("div", "case");
      kase.append(h("span", "case-label", t("home.case")), h("span", "case-place", t("project." + p.id + ".place")));
      var facts = h("ul", "case-facts");
      t("project." + p.id + ".facts").split("|").forEach(function (s) { facts.appendChild(h("li", null, s.trim())); });
      kase.appendChild(facts);

      var chips = h("div", "chips");
      p.methods.forEach(function (m) { chips.appendChild(h("span", "chip", t("method." + m))); });

      var cta = h("a", "case-link"); cta.href = I18N.href(p.href);
      cta.append(document.createTextNode(t("home.exploreCase") + " "), h("span", null, "\u2192"));

      card.append(top, h("h3", null, t("project." + p.id + ".title")),
        h("p", "sum", t("project." + p.id + ".summary")), kase, chips, cta);
      host.appendChild(card);
    });
  }

  function creditLine(r) {
    if (!r.author) return null;
    var from = h("span", "rfrom");
    from.append(document.createTextNode(t("home.byAuthor") + " "), h("b", null, r.author));
    return from;
  }

  function renderLadder() {
    var host = document.getElementById("ladder"); host.textContent = "";
    C.levels.forEach(function (l) {
      var res = byLevel(l.id);
      var live = res.filter(published), planned = res.filter(function (r) { return !published(r); });
      var row = h("article", "level"); row.id = "level-" + l.id;

      var num = h("div", "lnum");
      num.append(h("small", null, t("home.level")), document.createTextNode(l.n));
      var art = HomeArt.glyph(l.n - 1); num.appendChild(art);
      row.addEventListener("mouseenter", function () { art.play(); });

      var body = h("div", "lbody");
      body.appendChild(h("h3", null, t("level." + l.id + ".title")));
      body.appendChild(h("p", "sum", t("level." + l.id + ".summary")));
      var chips = h("div", "chips");
      t("level." + l.id + ".topics").split("|").forEach(function (s) { chips.appendChild(h("span", "chip", s.trim())); });
      body.appendChild(chips);

      if (live.length) {
        var grid = h("div", "rgrid");
        live.forEach(function (r) {
          var a = h("a", "rcard"); a.href = I18N.href(r.href);
          var rt = h("span", "rtype", t("type." + r.type)); rt.prepend(HomeArt.typeIcon(r.type));
          a.append(rt, h("span", "rtitle", t("resource." + r.id + ".title")),
            h("span", "rsum", t("resource." + r.id + ".summary")));
          var c = creditLine(r); if (c) a.appendChild(c);
          grid.appendChild(a);
        });
        body.appendChild(grid);
      } else {
        body.appendChild(h("div", "soon-box", t("home.level.empty")));
      }

      if (planned.length) {
        var wrap = h("div", "planned-block");
        wrap.appendChild(h("p", "planned-head", t("home.plannedHead")));
        var ul = h("ul", "planned-list");
        planned.forEach(function (r) {
          var li = h("li");
          var head = h("div", "pl-head");
          head.append(h("span", "pl-title", t("resource." + r.id + ".title")), h("span", "pl-type", t("type." + r.type)));
          li.append(head, h("p", "pl-sum", t("resource." + r.id + ".summary")));
          ul.appendChild(li);
        });
        wrap.appendChild(ul);
        body.appendChild(wrap);
      }

      row.append(num, body);
      host.appendChild(row);
    });
  }

  function renderLangNote() {
    var names = I18N.languages.map(function (l) { return l.name; });
    document.getElementById("langnote").textContent = t("home.langnote", { list: names.join(" \u00b7 ") });
  }

  // "Lab" link in the top menu, only when CATALOG.labInNav is true. Created once after the existing
  // links and relabelled on every language switch, so it is never duplicated.
  function renderLabNav() {
    var nav = document.querySelector(".topnav");
    if (!nav) return;
    var a = nav.querySelector("a[data-nav-lab]");
    if (!C.labInNav) { if (a) a.remove(); return; }
    if (!a) {
      a = h("a");
      a.setAttribute("data-nav-lab", "");
      a.setAttribute("data-keep-lang", "");
      a.setAttribute("data-i18n", "nav.lab");
      a.dataset.baseHref = "lab/index.html";
      nav.appendChild(a);
    }
    a.setAttribute("href", I18N.href(a.dataset.baseHref));
    a.textContent = t("nav.lab");
  }

  var band = null;
  function renderBand() {
    if (band) band.relabel(); else band = HomeArt.band(document.getElementById("levels-band"), C.levels);
  }

  I18N.onChange(function () { renderFacts(); renderProjects(); renderLadder(); renderLangNote(); renderLabNav(); renderBand(); });
})();
</script>
</body>
</html>
