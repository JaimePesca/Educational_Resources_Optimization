<style>
  .ab-head { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 12px 32px; align-items: center; }

  .ab-role { margin: 0; font: 600 13px var(--font-mono); letter-spacing: 0.06em; color: var(--ink2); }
  .ab-sec { border-top: 1px solid var(--axis); padding-top: 22px; display: grid; gap: 14px; }
  .ab-sec h2 { margin: 0; font-family: var(--font-sans); font-weight: 700; font-size: clamp(22px, 3.4vw, 28px); line-height: 1.1; }
  .ab-sec > p { margin: 0; color: var(--ink2); max-width: 72ch; }
  .ab-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .ab-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 15px 16px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .ab-when { font: 600 10.5px var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-text); }
  .ab-t { font-weight: 600; font-size: 17px; line-height: 1.2; }
  .ab-org { font-size: 14px; color: var(--ink); }
  .ab-d { margin: 0; font-size: 13.5px; color: var(--ink2); }
  .ab-status {
    align-self: flex-start; font: 600 10px var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 2px; border: 1.5px solid var(--accent); color: var(--accent-text);
  }
  .ab-status.pub { background: var(--accent); color: var(--on-solid); }
  .ab-go {
    margin-top: auto; align-self: flex-start; display: inline-flex; gap: 6px; font-weight: 700; font-size: 14px;
    text-decoration: none; color: var(--on-solid); background: var(--accent); padding: 7px 12px; border-radius: 2px;
  }
  .ab-go:hover { filter: brightness(1.12); }
  .ab-pubs { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  .ab-pubs li { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 13px 16px; display: grid; gap: 6px; font-size: 14px; color: var(--ink2); }
  .ab-pubs li b { color: var(--ink); }
  .ab-pubs .ab-status { justify-self: start; }
  .ab-skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .ab-skills h3 { margin: 0 0 6px; font: 600 10.5px var(--font-mono); letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.02em; padding: 3px 8px; border-radius: 6px;
    background: var(--surface2); border: 1px solid var(--border); color: var(--ink2);
  }
  .ab-links { display: flex; flex-wrap: wrap; gap: 10px; }
  .ab-links a {
    display: inline-flex; gap: 8px; align-items: center; padding: 9px 14px; border-radius: 2px; text-decoration: none; font-weight: 600;

  .ab-bul { margin: 0; padding-left: 18px; color: var(--ink2); display: grid; gap: 4px; font-size: 14.5px; }

<script>
(function () {
  "use strict";
  var t = I18N.t, C = window.CATALOG;

  // Public profiles. An empty url is not shown: fill in ORCID, Google Scholar, ResearchGate or LinkedIn when available
  // (and add the same urls to "sameAs" in tools/seo_gen.py).
  var PROFILES = [
    { key: "ab.link.web", url: "https://jaimepesca.com", ga: "jaimepesca_click" },
    { key: "ab.link.github", url: "https://github.com/JaimePesca", ga: "github_click" },
    { key: "ab.link.orcid", url: "https://orcid.org/0009-0003-8221-0924" },
    { key: "ab.link.scholar", url: "" },
    { key: "ab.link.researchgate", url: "" },
    { key: "ab.link.linkedin", url: "https://www.linkedin.com/in/jaime-pesca/" }
  ];
  // Status of each study, in the order they are listed (from the CV)
  var STUDIES = [
    { id: "nanostores", status: "pub" },
    { id: "markets", status: "rev" },
    { id: "wildfire", status: "rev" },
    { id: "pallets", status: "prep" }
  ];

  function h(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  // items ab.<group>.<n>.{when,t,org,d} until a key is missing
  function items(group) {
    var out = [];
    for (var n = 1; n < 20; n++) {
      var k = "ab." + group + "." + n;
      if (t(k + ".t") === k + ".t") break;
      out.push(k);
    }
    return out;
  }
  function card(k) {
    var li = h("li", "ab-item");
    if (t(k + ".when") !== k + ".when") li.appendChild(h("span", "ab-when", t(k + ".when")));
    li.appendChild(h("span", "ab-t", t(k + ".t")));
    if (t(k + ".org") !== k + ".org") li.appendChild(h("span", "ab-org", t(k + ".org")));
    if (t(k + ".d") !== k + ".d") li.appendChild(h("p", "ab-d", t(k + ".d")));
    return li;
  }
  function fill(id, group) {
    var ul = document.getElementById(id); ul.textContent = "";
    items(group).forEach(function (k) { ul.appendChild(card(k)); });
  }
  function bullets(id, key) {
    var ul = document.getElementById(id); ul.textContent = "";
    t(key).split("|").forEach(function (s) { ul.appendChild(h("li", null, s.trim())); });
  }

  function render() {
    fill("ab-teach", "teach");
    fill("ab-work", "work");
    fill("ab-edu", "edu");

    // research lines: the four cases of the site, with their methods and status
    var cases = document.getElementById("ab-cases"); cases.textContent = "";
    STUDIES.forEach(function (s) {
      var p = C.research.filter(function (r) { return r.id === s.id; })[0];
      if (!p || !p.href) return;
      var li = h("li", "ab-item");
      li.append(h("span", "ab-status" + (s.status === "pub" ? " pub" : ""), t("ab.status." + s.status)),
        h("span", "ab-t", t("project." + s.id + ".title")), h("span", "ab-org", t("project." + s.id + ".place")));
      var chips = h("div", "chips");
      p.methods.forEach(function (m) { chips.appendChild(h("span", "chip", t("method." + m))); });
      var go = h("a", "ab-go"); go.href = I18N.href(p.href);
      go.append(document.createTextNode(t("home.exploreCase") + " "), h("span", null, "→"));
      li.append(chips, go);
      cases.appendChild(li);
    });

    // publications and working papers: the citations shown on each research page
    var pubs = document.getElementById("ab-pubs"); pubs.textContent = "";
    STUDIES.forEach(function (s) {
      var p = C.research.filter(function (r) { return r.id === s.id; })[0];
      var li = h("li");
      li.appendChild(h("span", "ab-status" + (s.status === "pub" ? " pub" : ""), t("ab.status." + s.status)));
      var c = h("span"); c.innerHTML = t("r." + s.id + ".cite"); li.appendChild(c);
      if (t("ab.note." + s.id) !== "ab.note." + s.id) li.appendChild(h("span", "ab-d", t("ab.note." + s.id)));
      if (p && p.paper) { var a = h("a", null, p.paper.replace("https://", "")); a.href = p.paper; a.rel = "noopener"; li.appendChild(a); }
      pubs.appendChild(li);
    });

    // methods and tools
    var sk = document.getElementById("ab-skills"); sk.textContent = "";
    ["opt", "dec", "tools", "lang"].forEach(function (g) {
      var box = h("div"); box.appendChild(h("h3", null, t("ab.skill." + g + ".h")));
      var chips = h("div", "chips");
      t("ab.skill." + g).split("|").forEach(function (s) { chips.appendChild(h("span", "chip", s.trim())); });
      box.appendChild(chips); sk.appendChild(box);
    });

    bullets("ab-mem", "ab.mem");
    bullets("ab-awards", "ab.awards");

    var links = document.getElementById("ab-links"); links.textContent = "";
    PROFILES.filter(function (p) { return p.url; }).forEach(function (p) {
      var a = h("a", null, t(p.key) + " ↗"); a.href = p.url; a.target = "_blank"; a.rel = "noopener me";
      if (p.ga) { a.setAttribute("data-ga-event", p.ga); a.setAttribute("data-ga-location", "about_profile"); }
      links.appendChild(a);
    });
    var lp = h("a", null, t("nav.learn") + " →"); lp.href = I18N.href("index.html#learn"); links.appendChild(lp);
  }

  // the same drawing as level 1 on the home page: the simplex path reaching x*
  function drawArt() {
    var cv = document.getElementById("ab-art"), r = cv.getBoundingClientRect();
    if (!r.width || !window.HomeArt) return;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    var ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    HomeArt.paint(ctx, 0, 1, { x: 0, y: 0, w: r.width, h: r.height }, 1);
  }

  I18N.onChange(function () { render(); drawArt(); });
  window.addEventListener("resize", drawArt);
})();
</script>
