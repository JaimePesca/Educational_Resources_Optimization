  var PARKS = [[4.64393,-74.19698],[4.63547,-74.20983],[4.64334,-74.18546],[4.63323,-74.20128],[4.62614,-74.21147],[4.63253,-74.19558],[4.63568,-74.18593],[4.62259,-74.20903],[4.6195,-74.20865],[4.62651,-74.19296],[4.61544,-74.20315],[4.63036,-74.1791],[4.60787,-74.20534],[4.61611,-74.1953],[4.61896,-74.18849],[4.62396,-74.17494],[4.60196,-74.20027],[4.60516,-74.19833],[4.61004,-74.19358],[4.61199,-74.18823],[4.61175,-74.18087],[4.60456,-74.18084],[4.60305,-74.15857],[4.59981,-74.19054],[4.59963,-74.1736]];
  var COMP = [[4.60481,-74.19724],[4.60289,-74.19995],[4.6049,-74.20046],[4.59964,-74.19267],[4.59949,-74.19181],[4.61115,-74.20941],[4.61159,-74.20072],[4.60481,-74.18726],[4.60625,-74.18562],[4.60788,-74.17899],[4.61886,-74.1889],[4.62121,-74.1897],[4.6215,-74.18857],[4.63455,-74.18924],[4.63362,-74.19639],[4.64235,-74.19139],[4.63538,-74.19757],[4.62679,-74.20834],[4.62642,-74.20858],[4.59951,-74.19195],[4.59983,-74.193],[4.59972,-74.18365],[4.60467,-74.18286],[4.60484,-74.18462],[4.60492,-74.1874],[4.60667,-74.19953],[4.60788,-74.19587],[4.61069,-74.19902],[4.62423,-74.1958],[4.62221,-74.19262],[4.6203,-74.18887],[4.61719,-74.18816],[4.62448,-74.18634],[4.62726,-74.18791],[4.62873,-74.18533],[4.63026,-74.19398],[4.6352,-74.18676],[4.63628,-74.19211],[4.6323,-74.20487],[4.64164,-74.19507],[4.63636,-74.19219],[4.63531,-74.1867],[4.63679,-74.18416],[4.59974,-74.18374]];

  // Table 2 criteria; top: the three the manuscript names as most important
  var CRIT = [
    { k: "pop", top: true }, { k: "strat" }, { k: "roads" }, { k: "side" }, { k: "morph" },
    { k: "serv" }, { k: "land", top: true }, { k: "traffic" }, { k: "trans", top: true }, { k: "house" }
  ];
  // Table 3 fuzzy scale

             { n: 7, l: 6, m: 7, u: 8 }, { n: 9, l: 9, m: 9, u: 9 } ];

  /* ---------- helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function col(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function svgEl(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var a in attrs) if (Object.prototype.hasOwnProperty.call(attrs, a) && attrs[a] != null) e.setAttribute(a, attrs[a]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function txt(parent, x, y, s, attrs) {
    var a = attrs || {};

  }
  function tip(node, s) { var ti = svgEl("title", {}, node); ti.textContent = s; }
  function newSvg(host, w, h, ariaKey) {

    var s = svgEl("svg", { viewBox: "0 0 " + w + " " + h, width: w, height: h, role: "img", "aria-label": t(P + ariaKey), "class": "chart" }, host);
    s.style.maxWidth = "100%";

  }
  function widthOf(host) { return Math.max(260, Math.floor(host.clientWidth || 320)); }
  function find(s) {
    for (var i = 0; i < SC.length; i++) {

      if (c.m === s.m && c.b === s.b && c.f === s.f && c.d === s.d) return c;
    }

  }
  function rowLabel(c) {
    var v = c.row === "days" ? fmt(c.m) : fmt(c.b);

  }
  function optLabel(k, v) {
    if (k === "m") return t(P + "sc.m.val", { v: fmt(v) });
    if (k === "b") return t(P + "sc.b.val", { v: fmt(v) });
    if (k === "f") return t(P + (v ? "sc.f.on" : "sc.f.off"));
    return t(P + "sc.d." + v);
  }
  function dayName(i) { return t(P + "day." + i); }

  /* ---------- panel 1: scenario explorer ---------- */
  function buildSegs() {
    document.querySelectorAll("#p-sc .seg[data-key]").forEach(function (seg) {
      var k = seg.getAttribute("data-key");
      seg.innerHTML = "";
      OPTS[k].forEach(function (v) {
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = optLabel(k, v);
        var probe = { m: state.m, b: state.b, f: state.f, d: state.d };
        probe[k] = v;
        var ok = !!find(probe);
        b.disabled = !ok;
        if (!ok) b.title = t(P + "sc.disabledTip");
        b.setAttribute("aria-pressed", state[k] === v ? "true" : "false");
        b.addEventListener("click", function () { state[k] = v; renderScenario(); });
        seg.appendChild(b);
      });
    });
    $("reset").disabled = find(state) === BASE;
  }

  function renderScenario() {
    buildSegs();
    var c = find(state) || BASE;
    $("k-kg").textContent = fmt(c.kg, 0);
    $("k-share").textContent = fmt(100 * c.kg / TOTAL, 1, 1) + "%";
    var dk = c.kg - BASE.kg;
    $("k-delta").textContent = c === BASE ? "0" : (dk > 0 ? "+" : "−") + fmt(Math.abs(dk), 0) + " (" + (dk > 0 ? "+" : "−") + fmt(Math.abs(100 * dk / BASE.kg), 1, 1) + "%)";
    $("k-src").textContent = t(P + "sc.src." + c.src);
    var pair = "";
    if (c.src === "t5" || c === BASE) {
      var other = find({ m: c.m, b: c.b, f: c.f ? 0 : 1, d: c.d });
      if (other) {
        var withF = c.f ? c : other, noF = c.f ? other : c;
        var diff = noF.kg - withF.kg;
        pair = c.f ? t(P + "sc.pair", { kg: fmt(diff, 0), pct: fmt(100 * diff / withF.kg, 1, 1) })
                   : t(P + "sc.pairOff", { kg: fmt(diff, 0), pct: fmt(100 * diff / noF.kg, 1, 1) });
      }
    }
    if (c === BASE) pair = t(P + "sc.basecase") + " " + pair;
    $("sc-pair").textContent = pair;
    drawSplit(c);
    drawAll(c);
  }

  function drawSplit(c) {
    var host = $("c-split");
    var W = widthOf(host);
    var rows = [];
    if (c !== BASE) rows.push({ label: t(P + "split.sel"), segs: [
      { k: "sm", kg: c.kg, c: "--accent" }, { k: "rest", kg: TOTAL - c.kg, c: "--grid", rest: true } ] });
    rows.push({ label: t(P + "split.base"), segs: SPLIT });
    var rowH = 78, top = 6;
    var H = top + rows.length * rowH;
    var svg = newSvg(host, W, H, "split.aria");
    var ink = col("--ink"), ink2 = col("--ink2"), axis = col("--axis");
    var bw = W - 2;
    rows.forEach(function (r, ri) {
      var y0 = top + ri * rowH;
      txt(svg, 0, y0 + 12, r.label, { fill: ink, "font-size": 13, "font-weight": 600 });
      var x = 1, by = y0 + 20, bh = 26;
      r.segs.forEach(function (s, si) {
        var w = bw * s.kg / TOTAL;
        var gap = si < r.segs.length - 1 ? 2 : 0;
        var rect = svgEl("rect", { x: x, y: by, width: Math.max(1, w - gap), height: bh, rx: 2,
          fill: col(s.c), stroke: s.rest ? axis : "none", "stroke-dasharray": s.rest ? "4 3" : null }, svg);
        tip(rect, t(P + "cat." + s.k) + ": " + fmt(s.kg, 0) + " kg (" + fmt(100 * s.kg / TOTAL, 1, 1) + "%)");
        var pct = fmt(100 * s.kg / TOTAL, 1, 1) + "%";
        if (w > 44) {
          txt(svg, x + w / 2, by + bh + 16, pct, { fill: ink2, "font-size": 12, "text-anchor": "middle", "font-variant-numeric": "tabular-nums" });
        } else {
          txt(svg, x + 2, by + bh + 16, pct, { fill: ink2, "font-size": 12 });
        }
        if (w > 90 && s.k === "sm") {
          txt(svg, x + 6, by + 17, fmt(s.kg, 0) + " kg", { fill: col("--on-solid"), "font-size": 12, "font-weight": 600 });
        }
        x += w;
      });
    });
    // legend
    var lg = $("lg-split");
    lg.innerHTML = "";
    var items = SPLIT.slice();
    if (c !== BASE) items.push({ k: "rest", c: "--grid", rest: true });
    items.forEach(function (s) {
      var sp = document.createElement("span");
      var sw = document.createElement("i");
      sw.className = "sw" + (s.rest ? " rest" : "");
      if (!s.rest) sw.style.background = "var(" + s.c + ")";
      sp.appendChild(sw);
      sp.appendChild(document.createTextNode(t(P + "cat." + s.k)));
      lg.appendChild(sp);
    });
  }

  function drawAll(sel) {
    var host = $("c-all");
    var W = widthOf(host);
    var rowH = 30, top = 4, bottom = 44, left = 0, right = 58;
    var H = top + SC.length * rowH + bottom;
    var svg = newSvg(host, W, H, "all.aria");
    var ink = col("--ink"), ink2 = col("--ink2"), muted = col("--muted"), grid = col("--grid"), axis = col("--axis");
    var acc = col("--accent"), sil = col("--mit-silver");
    var xmax = 100000, pw = W - left - right;
    var X = function (v) { return left + pw * v / xmax; };
    var plotB = top + SC.length * rowH;
    [0, 25000, 50000, 75000, 100000].forEach(function (v) {
      svgEl("line", { x1: X(v), x2: X(v), y1: top, y2: plotB, stroke: v === 0 ? axis : grid, "stroke-width": 1 }, svg);
      txt(svg, X(v), plotB + 15, fmt(v / 1000, 0) + "k", { fill: muted, "font-size": 11.5, "text-anchor": v === 0 ? "start" : (v === xmax ? "end" : "middle") });
    });
    txt(svg, left + pw / 2, plotB + 36, t(P + "all.axis"), { fill: ink2, "font-size": 12, "text-anchor": "middle" });
    SC.forEach(function (c, i) {
      var y = top + i * rowH;

      txt(g, X(0) + 1, y + 11, rowLabel(c), { fill: on ? ink : ink2, "font-size": 11.5, "font-weight": on ? 700 : 400 });
      svgEl("rect", { x: X(0), y: y + 15, width: Math.max(2, X(c.kg) - X(0)), height: 10, rx: 2, fill: on ? acc : sil, opacity: on ? 1 : (c.f ? 0.85 : 0.5) }, g);
      txt(g, X(c.kg) + 5, y + 24, fmt(c.kg, 0), { fill: on ? ink : ink2, "font-size": 11.5, "font-weight": on ? 700 : 400, "font-variant-numeric": "tabular-nums" });
      tip(g, t(P + "tip.kg", { label: rowLabel(c), kg: fmt(c.kg, 0) }));
      g.addEventListener("click", function () { state = { m: c.m, b: c.b, f: c.f, d: c.d }; renderScenario(); });
    });

  /* ---------- panel 2: schedule + map ---------- */
  function buildDaySeg() {
    var seg = $("seg-day");
    seg.innerHTML = "";
    [-1, 0, 1, 2, 3, 4, 5, 6].forEach(function (d) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = d < 0 ? t(P + "sch.all") : dayName(d);
      b.setAttribute("aria-pressed", d === day ? "true" : "false");
      b.addEventListener("click", function () { day = d; renderSchedule(); });
      seg.appendChild(b);
    });
  }

  function renderSchedule() {
    buildDaySeg();
    var tb = $("t-sched");
    var h = "<thead><tr><th>" + t(P + "sch.park") + "</th>";
    for (var d = 0; d < 7; d++) h += "<th" + (d === day ? " class=\"hl\"" : "") + ">" + dayName(d) + "</th>";
    h += "</tr></thead><tbody>";
    var counts = [0, 0, 0, 0, 0, 0, 0];
    SCHED.forEach(function (p) {
      var on = day < 0 || p.days.indexOf(day) >= 0;
      h += "<tr" + (day >= 0 && on ? " class=\"on\"" : "") + "><td>ST" + (p.n < 10 ? "0" : "") + p.n + "</td>";
      for (var d = 0; d < 7; d++) {
        var open = p.days.indexOf(d) >= 0;
        if (open) counts[d]++;
        h += "<td" + (d === day ? " class=\"hl\"" : "") + ">" + (open ? "<span class=\"mk\" aria-hidden=\"true\"></span><span class=\"sr-only\">" + t(P + "sch.open") + "</span>" : "") + "</td>";
      }
      h += "</tr>";
    });
    h += "</tbody><tfoot><tr><td>" + t(P + "sch.count") + "</td>";
    for (d = 0; d < 7; d++) h += "<td" + (d === day ? " class=\"hl\"" : "") + "><b>" + fmt(counts[d]) + "</b></td>";
    h += "</tr><tr><td>" + t(P + "sch.cap") + "</td>";
    for (d = 0; d < 7; d++) h += "<td" + (d === day ? " class=\"hl\"" : "") + ">≤ " + fmt(d < 5 ? 0.2 * MD : 0.3 * MD) + "</td>";
    h += "</tr></tfoot>";
    tb.innerHTML = h;

    // rules, computed from the schedule
    var total = counts.reduce(function (a, b) { return a + b; }, 0);
    var wd = counts.slice(0, 5).reduce(function (a, b) { return a + b; }, 0);
    var maxWd = Math.max.apply(null, counts.slice(0, 5));
    var minGap = 99;
    SCHED.forEach(function (p) {
      for (var i = 1; i < p.days.length; i++) minGap = Math.min(minGap, p.days[i] - p.days[i - 1]);
    });
    var rules = [
      t(P + "rule.total", { v: fmt(total) }),
      t(P + "rule.weekday", { v: fmt(wd) }),
      t(P + "rule.capWd", { v: fmt(maxWd) }),
      t(P + "rule.capWe", { sat: fmt(counts[5]), sun: fmt(counts[6]) }),
      t(P + "rule.gap", { v: fmt(minGap) })
    ];
    var ok = [total === MD, wd === 0.4 * MD, maxWd <= 0.2 * MD, counts[5] <= 0.3 * MD && counts[6] <= 0.3 * MD, minGap >= 3];
    var ul = $("rules");
    ul.innerHTML = "";
    rules.forEach(function (r, i) {
      var li = document.createElement("li");
      var b = document.createElement("span");
      b.className = "ok";
      b.textContent = ok[i] ? t(P + "rule.ok") : "×";
      var s = document.createElement("span");
      s.textContent = r;
      li.appendChild(b); li.appendChild(s);
      ul.appendChild(li);
    });
    drawMap();
  }

  function drawMap() {
    var host = $("c-map");
    var W = widthOf(host);
    var lat0 = 4.62, kx = Math.cos(lat0 * Math.PI / 180) * 111.32, ky = 110.57;
    var all = PARKS.concat(COMP);
    var minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity;
    all.forEach(function (p) {
      minLat = Math.min(minLat, p[0]); maxLat = Math.max(maxLat, p[0]);
      minLon = Math.min(minLon, p[1]); maxLon = Math.max(maxLon, p[1]);
    });
    var wKm = (maxLon - minLon) * kx, hKm = (maxLat - minLat) * ky;
    var pad = 26;
    var s = (W - 2 * pad) / wKm;
    var H = Math.round(hKm * s + 2 * pad + 18);
    var svg = newSvg(host, W, H, "map.aria");
    var ink = col("--ink"), muted = col("--muted"), grid = col("--grid"), acc = col("--accent"),
        sil = col("--mit-silver"), surf = col("--surface"), halo = col("--halo"), border = col("--axis");
    function X(lon) { return pad + (lon - minLon) * kx * s; }
    function Y(lat) { return pad + (maxLat - lat) * ky * s; }
    svgEl("rect", { x: 0.5, y: 0.5, width: W - 1, height: H - 1, fill: "none", stroke: border, rx: 3 }, svg);
    // 1 km grid
    for (var gx = 0; gx <= wKm + 0.01; gx += 1) svgEl("line", { x1: pad + gx * s, x2: pad + gx * s, y1: pad - 8, y2: H - pad - 10, stroke: grid }, svg);
    for (var gy = 0; gy <= hKm + 0.01; gy += 1) svgEl("line", { x1: pad - 8, x2: W - pad + 8, y1: pad + gy * s, y2: pad + gy * s, stroke: grid }, svg);
    // competitors
    COMP.forEach(function (p) {
      var x = X(p[1]), y = Y(p[0]);
      var g = svgEl("g", {}, svg);
      svgEl("path", { d: "M" + (x - 3) + " " + (y - 3) + "L" + (x + 3) + " " + (y + 3) + "M" + (x - 3) + " " + (y + 3) + "L" + (x + 3) + " " + (y - 3), stroke: muted, "stroke-width": 1.5 }, g);
      tip(g, t(P + "map.compTip"));
    });
    // candidates
    var openBy = {};
    SCHED.forEach(function (p) { openBy[p.n] = p.days; });
    PARKS.forEach(function (p, i) {
      var n = i + 1;
      if (openBy[n]) return;
      var c = svgEl("circle", { cx: X(p[1]), cy: Y(p[0]), r: 4.5, fill: surf, stroke: sil, "stroke-width": 1.8 }, svg);
      tip(c, t(P + "map.parkTip", { n: n }));
    });
    // opened parks
    SCHED.forEach(function (p) {
      var q = PARKS[p.n - 1], x = X(q[1]), y = Y(q[0]);
      var active = day < 0 || p.days.indexOf(day) >= 0;
      var g = svgEl("g", {}, svg);
      svgEl("circle", { cx: x, cy: y, r: 8, fill: active ? acc : surf, stroke: acc, "stroke-width": 2.5 }, g);
      var lab = "ST" + (p.n < 10 ? "0" : "") + p.n;
      txt(g, x + 11, y + 4, lab, { fill: active ? ink : muted, "font-size": 12, "font-weight": 700, stroke: halo, "stroke-width": 3, "paint-order": "stroke" });
      tip(g, t(P + "map.openTip", { n: (p.n < 10 ? "0" : "") + p.n, days: p.days.map(dayName).join(", ") }));
    });
    // scale bar and north
    var sbY = H - 14;
    svgEl("line", { x1: pad, x2: pad + s, y1: sbY, y2: sbY, stroke: ink, "stroke-width": 2 }, svg);
    svgEl("line", { x1: pad, x2: pad, y1: sbY - 4, y2: sbY + 1, stroke: ink, "stroke-width": 2 }, svg);
    svgEl("line", { x1: pad + s, x2: pad + s, y1: sbY - 4, y2: sbY + 1, stroke: ink, "stroke-width": 2 }, svg);
    txt(svg, pad + s + 6, sbY + 4, t(P + "map.km"), { fill: ink, "font-size": 11.5 });
    svgEl("path", { d: "M" + (W - 18) + " 10 L" + (W - 23) + " 22 L" + (W - 13) + " 22 Z", fill: ink }, svg);
    txt(svg, W - 18, 34, "N", { fill: ink, "font-size": 11, "text-anchor": "middle", "font-weight": 700 });

    var lg = $("lg-map");
    lg.innerHTML = "";
    [["dot", "map.opened", "--accent"], ["ring", "map.openedOther"], ["cand", "map.cand"], ["x", "map.comp"]].forEach(function (it) {
      var sp = document.createElement("span");
      var sw = document.createElement("i");
      sw.className = "sw " + it[0];
      if (it[0] === "dot") sw.style.background = "var(--accent)";
      if (it[0] === "x") { sw.textContent = "×"; sw.style.cssText = "color:var(--muted);font-style:normal;font-weight:700;line-height:12px;text-align:center"; }
      sp.appendChild(sw);
      sp.appendChild(document.createTextNode(t(P + it[1])));
      lg.appendChild(sp);
    });
  }

  /* ---------- panel 3: criteria ---------- */
  function renderCriteria() {
    var h = "<thead><tr><th>" + t(P + "cr.th.c") + "</th><th>" + t(P + "cr.th.i") + "</th><th>" + t(P + "cr.th.s") + "</th></tr></thead><tbody>";
    CRIT.forEach(function (c) {
      h += "<tr" + (c.top ? " class=\"on\"" : "") + "><td>" + t(P + "cr." + c.k) + (c.top ? "<span class=\"badge\">" + t(P + "cr.top") + "</span>" : "") +
           "</td><td>" + t(P + "cr." + c.k + ".i") + "</td><td>" + t(P + "cr." + c.k + ".s") + "</td></tr>";
    });
    $("t-crit").innerHTML = h + "</tbody>";
    drawFuzzy();
  }

  function drawFuzzy() {
    var host = $("c-fz");
    var W = widthOf(host), H = 170;
    var svg = newSvg(host, W, H, "fz.aria");
    var ink = col("--ink"), ink2 = col("--ink2"), muted = col("--muted"), grid = col("--grid"), axis = col("--axis"), acc = col("--accent");
    var L = 30, R = 10, T = 18, B = 40;
    var X = function (v) { return L + (W - L - R) * v / 10; };
    var Y = function (m) { return T + (H - T - B) * (1 - m); };
    [0, 0.5, 1].forEach(function (m) {
      svgEl("line", { x1: L, x2: W - R, y1: Y(m), y2: Y(m), stroke: m === 0 ? axis : grid }, svg);
      txt(svg, L - 5, Y(m) + 4, fmt(m, 1), { fill: muted, "font-size": 11, "text-anchor": "end" });
    });
    for (var v = 0; v <= 10; v++) {
      txt(svg, X(v), Y(0) + 15, fmt(v), { fill: muted, "font-size": 11, "text-anchor": "middle" });
    }
    txt(svg, L + (W - L - R) / 2, H - 6, t(P + "fz.axis"), { fill: ink2, "font-size": 12, "text-anchor": "middle" });
    FZ.forEach(function (f) {
      var g = svgEl("g", {}, svg);
      if (f.l === f.u) {
        svgEl("line", { x1: X(f.m), x2: X(f.m), y1: Y(0), y2: Y(1), stroke: acc, "stroke-width": 2 }, g);
        svgEl("circle", { cx: X(f.m), cy: Y(1), r: 3.5, fill: acc }, g);
      } else {

    ctx.beginPath();

      ctx.globalAlpha = 0.8 * aRes;
      ctx.drawImage(uc, 0, 0, W, Hh);

    }

    // ---- chapter 4: today's walking circles ----

    if (inWeek || (t >= TW && t < T5 + 0.5)) {

        if (t < e.t0 || t > e.t1 + 0.5) return;
        var grow = ease.out(seg(t, e.t0, e.t0 + 0.7)), fade = 1 - seg(t, e.t1, e.t1 + 0.5);
        var q = K[e.n - 1], x = X(q), y = Y(q);

      });
    }

    // ---- chapter 2 and 3: pull toward the nearest competitor ----
    var aFlow = seg(t, T2, T2 + 0.5) * lerp(1, 0.28, seg(t, T3, T3 + 1.5)) * (1 - seg(t, T4, T4 + 1.2));

  function drawStrip(t, c, alpha) {

    FLASH.forEach(function (f) {

        if (f.k === "quota") quotaFlash = fl;

    });
    for (var d = 0; d < 7; d++) {
      var x = S.x + d * (S.bw + S.gap), y = S.y;
      var we = d >= 5, cap = we ? 0.3 * MD : 0.2 * MD;

      if (isCur) { ctx.fillStyle = c.accent; ctx.fillRect(x, y, S.bw * ap, 3); }
      ctx.font = font(L.phone ? 10.5 : 12, isCur ? 700 : 600);
      ctx.fillStyle = isCur ? c.ink : past ? c.ink2 : c.muted;
      ctx.textAlign = "center";
      ctx.fillText(dayName(d), x + S.bw / 2, y + (L.phone ? 15 : 18));
      // slots: the daily cap (0.2 Md on weekdays, 0.3 Md on weekend days)
      var ss = Math.min(10, (S.bw - 10) / 3 - 3), sg = 3;
      var sw = cap * ss + (cap - 1) * sg, sx = x + (S.bw - sw) / 2, sy = y + S.bh - ss - (L.phone ? 7 : 10);
      var dayEv = EV.filter(function (e) { return e.d === d; });
      for (var i = 0; i < cap; i++) {

    // weekly quota bars: 0.4 Md on weekdays, the rest on the weekend
    var by = S.y + S.bh + 6, bh = 4;
    function bar(x0, x1, n, filled, flash) {

      if (flash) {
        ctx.strokeStyle = c["mit-bright"]; ctx.lineWidth = 1.5 + flash;
        ctx.strokeRect(x0 - 2, by - 2, x1 - x0 + 4, bh + 4);
      }
    }
    bar(S.x, S.x + 5 * S.bw + 4 * S.gap, 0.4 * MD, wdOpened, quotaFlash);
    bar(S.x + 5 * (S.bw + S.gap), S.x + 7 * S.bw + 6 * S.gap, 0.6 * MD, weOpened, 0);

    // the schedule (Table 4) filling in, one row per opened park
    var rh = S.rh, cs = Math.max(5, Math.min(rh - 4, S.bw * 0.45));
    if (cur >= 0) {
      ctx.fillStyle = c.sel;
      ctx.fillRect(S.x + cur * (S.bw + S.gap), S.my - 3, S.bw, OPEN.length * rh + 6);
    }
    ctx.font = font(L.phone ? 9.5 : 11, 600);
    OPEN.forEach(function (o, r) {
      var yc = S.my + r * rh + rh / 2;
      var anyOpen = EV.some(function (e) { return e.n === o.n && t >= e.t0; });
      ctx.textAlign = "right"; ctx.fillStyle = anyOpen ? c.ink : c.muted;
      ctx.fillText("ST" + (o.n < 10 ? "0" : "") + o.n, S.x - 7, yc + (L.phone ? 3.5 : 4));
      for (var d2 = 0; d2 < 7; d2++) {
        var xc = S.x + d2 * (S.bw + S.gap) + S.bw / 2;
        var ev = null;
        EV.forEach(function (e) { if (e.n === o.n && e.d === d2) ev = e; });
        var u2 = ev ? seg(t, ev.t0, ev.t0 + 0.45) : 0, f2 = ease.back(u2);
        if (u2 > 0) {
          var z2 = cs * f2;
          ctx.fillStyle = c.accent;
          ctx.fillRect(xc - z2 / 2, yc - z2 / 2, z2, z2);
        } else {
          ctx.fillStyle = c.grid;
          ctx.fillRect(xc - 1.5, yc - 1.5, 3, 3);
        }
      }
    });
    // a rule-breaking attempt at an opened park shows as a red cross in its row
    FLASH.forEach(function (f) {
      if (!openSet[f.n]) return;
      var ds = TW + f.d * DL, u = seg(t, ds + 0.42 * DL, ds + 0.92 * DL);
      if (u <= 0 || u >= 1) return;
      var r = 0;
      OPEN.forEach(function (o, i) { if (o.n === f.n) r = i; });
      var xc = S.x + f.d * (S.bw + S.gap) + S.bw / 2, yc = S.my + r * rh + rh / 2, z = cs / 2;
      ctx.globalAlpha = alpha * seg(u, 0.05, 0.2) * (1 - seg(u, 0.8, 1));
      ctx.strokeStyle = c["mit-bright"]; ctx.lineWidth = 2; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(xc - z, yc - z); ctx.lineTo(xc + z, yc + z); ctx.moveTo(xc - z, yc + z); ctx.lineTo(xc + z, yc - z); ctx.stroke();
      ctx.lineCap = "butt";
    });
    ctx.restore();
  }

  function drawDonut(t, c, alpha) {
    var D = L.donut, res = RES[buf], fmt = I18N.fmt;
    ctx.save();
    ctx.globalAlpha = alpha;
    var p = ease.inOut(seg(t, T5 + 0.5, T5 + 3));
    var th = D.r * 0.3, rr = D.r - th / 2;
    ctx.lineWidth = th;
    ctx.beginPath(); ctx.arc(D.cx, D.cy, rr, 0, Math.PI * 2); ctx.strokeStyle = c.surface2; ctx.stroke();
    var a0 = -Math.PI / 2, acc = 0;
    res.segs.forEach(function (sg, i) {
      var f0 = acc / TOTAL, f1 = (acc + sg.kg) / TOTAL;
      acc += sg.kg;
      var e = Math.min(f1, p);
      if (e <= f0) return;
      var gapA = 0.012;
      ctx.beginPath();
      ctx.arc(D.cx, D.cy, rr + (i === 0 ? th * 0.12 : 0), a0 + f0 * 2 * Math.PI + gapA, a0 + e * 2 * Math.PI - (e >= f1 ? gapA : 0));
      ctx.lineWidth = i === 0 ? th * 1.24 : th;
      ctx.strokeStyle = c[sg.c]; ctx.stroke();
    });
    // centre: share captured by street markets
    var pv = seg(t, T5 + 0.6, T5 + 3);
    ctx.textAlign = "center";
    ctx.fillStyle = c.accent;
    ctx.font = font(Math.round(D.r * 0.42), 700);
    ctx.fillText(I18N.t(P + "pct", { v: fmt(Math.round(res.segs[0].pct * ease.out(pv))) }), D.cx, D.cy + D.r * 0.12);
    ctx.font = font(L.phone ? 10 : 11, 600); ctx.fillStyle = c.ink2;
    var cap2 = I18N.t(P + "cat.sm");
    if (ctx.measureText(cap2).width < (D.r - th) * 1.8) ctx.fillText(cap2, D.cx, D.cy + D.r * 0.12 + (L.phone ? 13 : 16));
    // legend
    var rows = res.segs.length, rh = L.phone ? 19 : 23;
    var y0 = D.cy - (rows - 1) * rh / 2 - (res.derived ? rh / 2 : 0);
    res.segs.forEach(function (sg, i) {
      var la = seg(t, T5 + 1 + i * 0.3, T5 + 1.6 + i * 0.3);
      if (la <= 0) return;
      var y = y0 + i * rh, x = L.legX + 6 * (1 - la);
      ctx.globalAlpha = alpha * la;
      ctx.fillStyle = c[sg.c]; ctx.fillRect(x, y - 5, 10, 10);
      if (sg.k === "rest") { ctx.strokeStyle = c.axis; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y - 4.5, 9, 9); }
      var pctTxt = I18N.t(P + "pct", { v: fmt(sg.pct) });
      ctx.font = font(L.phone ? 11 : 12.5, 700);
      var room = L.legX + L.legW - ctx.measureText(pctTxt).width - 8 - (x + 16);
      // long category names (e.g. "Mercados campesinos") shrink, then truncate, so they never touch the value
      var fs = L.phone ? 11 : 12.5, lab = I18N.t(P + "cat." + sg.k);
      ctx.font = font(fs, i === 0 ? 700 : 600);
      while (ctx.measureText(lab).width > room && fs > 9) { fs -= 0.5; ctx.font = font(fs, i === 0 ? 700 : 600); }
      while (ctx.measureText(lab).width > room && lab.length > 3) lab = lab.slice(0, -2) + "…";
      ctx.fillStyle = i === 0 ? c.ink : c.ink2; ctx.textAlign = "left";
      ctx.fillText(lab, x + 16, y + 4);
      ctx.textAlign = "right"; ctx.fillStyle = i === 0 ? c.accent : c.ink;
      ctx.font = font(L.phone ? 11 : 12.5, 700);
      ctx.fillText(pctTxt, L.legX + L.legW, y + 4);
    });
    if (res.derived) {
      var la2 = seg(t, T5 + 2, T5 + 2.6);
      ctx.globalAlpha = alpha * la2;
      ctx.font = font(L.phone ? 9.5 : 10.5, 600); ctx.fillStyle = c.muted; ctx.textAlign = "left";
      ctx.fillText(I18N.t(P + "derived"), L.legX, y0 + rows * rh + 2);
    }
    ctx.restore();
  }

  /* ---------- scenario control ---------- */
  var segEl = document.getElementById("anim-seg");
  var player = null;
  function buildSeg() {
    segEl.innerHTML = "";
    [750, 2000].forEach(function (b) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = I18N.t("r.markets.sc.b.val", { v: I18N.fmt(b) });
      btn.setAttribute("aria-pressed", b === buf ? "true" : "false");
      btn.addEventListener("click", function () {
        if (buf === b) return;
        buf = b;
        computeCoverage();
        buildSeg();
        if (player) {
          if (player.time >= T5) { player.seek(T5); player.play(); }
          else player.refresh();
        }
      });
      segEl.appendChild(btn);
    });
  }

  I18N.onChange(function () {
    buildSeg();
    hudCache = {};
    if (!player) {
      layout();
      player = Anim.create({
        root: document.getElementById("anim"),
        duration: DUR,
        chapters: [{ t: 0, key: P + "ch1" }, { t: T2, key: P + "ch2" }, { t: T3, key: P + "ch3" },
                   { t: T4, key: P + "ch4" }, { t: T5, key: P + "ch5" }],
        onResize: function () { cv.fit(); layout(); },
        render: render
      });
      window.__marketsAnim = player;
    } else {
      layout();
    }
  });
})();
</script>
