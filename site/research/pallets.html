    <div class="model">
      <div><div class="math"><p class="math-head" data-i18n="r.pallets.model.h1"></p>
        <script type="text/x-tex">\begin{aligned}
\max\;& \sum_{i}\sum_{j}\left(m_i+v_i\right)x_{ij}-\rho\sum_{i} u_i && \rho=10\\[4pt]
\text{ST}\;& \sum_{j} x_{ij}+u_i=1 && \forall\, i\in I\\
& \sum_{i} v_i\, x_{ij}\le \hat V_j\, y_j && \forall\, j\in J\\
& \sum_{i} m_i\, x_{ij}\le C_j\,\lambda_j\, y_j && \forall\, j\in J\\
& \sum_{i}\sum_{j} m_i\, x_{ij}\le P && P=65\,000\ \mathrm{kg}\\
& \left|\sum_{i}\sum_{j\in L} m_i\, x_{ij}-\sum_{i}\sum_{j\in R} m_i\, x_{ij}\right|\le \Delta && \Delta=500\ \mathrm{kg}\\
& x_{ij},\ y_j,\ u_i\in\{0,1\}
\end{aligned}</script></div>
      <div class="math"><p class="math-head" data-i18n="r.pallets.model.h2"></p>
        <script type="text/x-tex">\max\;(\cdots)-\mu\sum_{t}\sum_{j} z_{tj},\qquad X_{tj}\le n_t\, z_{tj}</script></div>
      <div class="math"><p class="math-head" data-i18n="r.pallets.model.h3"></p>
        <script type="text/x-tex">\begin{aligned}
\hat V_j &= \min\!\left(V_j,\ \hat u_j\, V_j^{\,\mathrm{prism}}\right)\\
\hat V_j^{(t+1)} &= \min\!\left(\hat V_j^{(t)},\ \hat u_j\, V_j^{\,\mathrm{prism}}\right)
\end{aligned}</script></div>
      <div class="math"><p class="math-head" data-i18n="r.pallets.model.h4"></p>
        <script type="text/x-tex">W_t=\left(b_t,\dots,b_{t+k-1}\right),\quad k=7,\qquad \sigma(b)>\alpha=0.5</script></div>

      var tt = t - k * 0.045;
      if (tt < o.t0) break;
      var p = posAt(tt);
      P(p[0], p[1], p[2]);
      if (prev) {
        ctx.globalAlpha = 0.55 * (1 - k / (n + 1));
        ctx.strokeStyle = color; ctx.lineWidth = Math.max(1, cam.s * 0.14 * (1 - k / (n + 2)));
        ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(_x, _y); ctx.stroke();
      }
      prev = [_x, _y];
    }
    ctx.globalAlpha = 1; ctx.lineCap = "butt";
  }

  function heapVisible(h, t) { return t >= h.tin && !(state.ff && t >= h.tout); }
  function drawHeap(t) {
    for (var i = 0; i < HEAP_ORD.length; i++) {
      var h = HEAP_ORD[i];
      if (!heapVisible(h, t)) continue;
      box(h.x0, h.y0, h.z0, h.x1, h.y1, h.z1, C.heapTint, C.bright, 1);
    }
    if (!state.ff && t > CH[4] + 0.5) {
      var a = 0.35 + 0.35 * Math.sin((t - CH[4]) * 4);
      ring(-8.95, 2.4, 0.3, 6.3, 0, 0.1 + 0.05 * Math.sin((t - CH[4]) * 4), C.bright, a * seg(t, CH[4] + 0.5, CH[4] + 1.2), 2);
    }
  }

  function levels(q, t) {
    var g = q.P * E.inOut(seg(t, 10.4 + 0.8 * q.ord, 17.2 + 0.4 * q.ord));
    var s = q.R * E.inOut(seg(t, 36.4 + 2.2 * q.ord, 38.6 + 2.2 * q.ord));
    if (state.ff) {
      g += (q.P2 - q.P) * E.inOut(seg(t, 45.6 + 1.4 * q.ord, 47.2 + 1.4 * q.ord));
      s += (q.R2 - q.R) * E.inOut(seg(t, 47.8 + 1.6 * q.ord, 52.4 + 1.2 * q.ord));
    }
    return [g, s];
  }
  function drawPos(q, t, dim) {
    var pu = seg(t, 8.4 + 1.8 * q.ord, 8.9 + 1.8 * q.ord);
    if (pu <= 0) return;
    var pop = E.back(pu);
    var z0 = q.z0, zt = z0 + q.h * pop, lv = levels(q, t);
    ctx.globalAlpha = dim;
    box(q.x0 - 0.03, q.y0 - 0.03, z0, q.x1 + 0.03, q.y1 + 0.03, z0 + 0.06, C.plate, null);
    ctx.strokeStyle = C.axis; ctx.lineWidth = 1;
    cage(q.x0, q.y0, z0 + 0.06, q.x1, q.y1, zt, false);
    var zs = z0 + 0.06 + (q.h - 0.06) * lv[1], zg = z0 + 0.06 + (q.h - 0.06) * lv[0];
    if (lv[1] > 0.005) { box(q.x0 + 0.04, q.y0 + 0.04, z0 + 0.06, q.x1 - 0.04, q.y1 - 0.04, zs, C.solid, C.edge, 1); seams(q.x0 + 0.04, q.y0 + 0.04, z0 + 0.06, q.x1 - 0.04, q.y1 - 0.04, zs, 0.27); }
    if (zg > zs + 0.01) {
      var gp = 1;
      if (!state.ff && t > CH[4] + 0.3) gp = 1 + 0.9 * (0.5 + 0.5 * Math.sin((t - CH[4]) * 4 - q.ord * 3)) * seg(t, CH[4] + 0.3, CH[4] + 1.2);
      ctx.globalAlpha = dim * Math.min(1, 0.55 * gp);
      box(q.x0 + 0.04, q.y0 + 0.04, zs, q.x1 - 0.04, q.y1 - 0.04, zg, C.ghost, null);
      ctx.globalAlpha = dim;
      ctx.strokeStyle = gp > 1 ? C.bright : C.accent; ctx.lineWidth = gp > 1 ? 1.5 + (gp - 1) : 1.5;
      poly([[q.x0 + 0.04, q.y0 + 0.04], [q.x1 - 0.04, q.y0 + 0.04], [q.x1 - 0.04, q.y1 - 0.04], [q.x0 + 0.04, q.y1 - 0.04]], zg); ctx.stroke();
    }
    ctx.globalAlpha = dim * 0.9;
    ctx.strokeStyle = C.axis; ctx.lineWidth = 1;
    cage(q.x0, q.y0, z0 + 0.06, q.x1, q.y1, zt, true);
    ctx.globalAlpha = 1;
  }
  function drawAircraft(t) {
    var a = E.out(seg(t, 7.8, 9.2));
    if (a <= 0) return;
    var dim = a * (1 - 0.72 * seg(t, 19.6, 20.8) * (1 - seg(t, 35.4, 36.8)));
    ctx.globalAlpha = dim;
    ctx.fillStyle = C.tray2; ctx.strokeStyle = C.axis; ctx.lineWidth = 1;
    poly(LOW_TRAY, 0, LOWY); ctx.fill(); ctx.stroke();
    for (var i = 0; i < LOWER.length; i++) drawPos(LOWER[i], t, dim);
    ctx.globalAlpha = dim * 0.6; ctx.fillStyle = C.region;
    if (!LOWY) { poly(WING_L, 2.6); ctx.fill(); poly(WING_R, 2.6); ctx.fill(); }
    ctx.globalAlpha = dim * 0.8; ctx.strokeStyle = C.axis; ctx.setLineDash([3, 4]); ctx.beginPath();
    line3(3.4, LOWY - 1.95, 0, 4.6, -2.75, ZM); line3(35.4, LOWY - 1.95, 0, 35.8, -2.75, ZM); line3(3.4, LOWY + 1.95, 0, 4.6, 2.75, ZM); line3(35.4, LOWY + 1.95, 0, 35.8, 2.75, ZM); line3(39.3, LOWY, 0, 41.6, 0, ZM);
    ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha = dim; ctx.fillStyle = C.tray; ctx.strokeStyle = C.axis;
    poly(MAIN_TRAY, ZM); ctx.fill(); ctx.stroke();
    ctx.beginPath(); line3(4.8, 0, ZM, 35.6, 0, ZM); ctx.setLineDash([3, 4]); ctx.stroke(); ctx.setLineDash([]);
    for (i = 0; i < MAIN.length; i++) drawPos(MAIN[i], t, dim);
    ctx.globalAlpha = 1;
    // Stage 1 highlight of the position replayed on the ramp
    var hl = seg(t, 18.0, 18.4) * (1 - seg(t, 20.6, 21.2));
    if (hl > 0) {
      var ph = ((t - 18) % 0.9) / 0.9;
      ring(R3.x0, R3.y0, R3.x1, R3.y1, R3.z0 + R3.h, ph * 0.5, C.accent, hl * (1 - ph), 2.5);
      ring(R3.x0, R3.y0, R3.x1, R3.y1, R3.z0 + R3.h, 0, C.accent, hl, 2.5);
    }
    // feedback pulses
    if (state.ff) {
      for (i = 0; i < POS.length; i++) {
        var q = POS[i], pu = seg(t, 45.3 + 1.4 * q.ord, 46.3 + 1.4 * q.ord);
        if (pu > 0 && pu < 1) {
          var lv = levels(q, t), zr = q.z0 + 0.06 + (q.h - 0.06) * lv[1];
          ring(q.x0, q.y0, q.x1, q.y1, zr, pu * 0.6, C.accent, (1 - pu) * dim, 2);
          P(q.cx, q.cy, zr + pu * 2.4); var yy = _y; P(q.cx, q.cy, zr);
          ctx.globalAlpha = (1 - pu) * dim; ctx.strokeStyle = C.accent; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(_x, _y); ctx.lineTo(_x, yy); ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }
    }
  }

  function arcAt(o, tt, x0, y0, z0, x1, y1, z1) {
    var u = clamp((tt - o.t0) / (o.t1 - o.t0), 0, 1), e = E.inOut(u);
    return [lerp(x0, x1, e), lerp(y0, y1, e), lerp(z0, z1, u) + o.arc * 4 * u * (1 - u)];
  }
  function drawParticles(t) {
    var i, o, u, p, ty;
    if (t < 7.5) {
      for (i = 0; i < RAIN.length; i++) {
        o = RAIN[i];
        if (t < o.t0 || t >= o.t1) continue;
        u = (t - o.t0) / (o.t1 - o.t0); ty = o.ty;
        var zt = pileH(o.c, o.t1), e = E.in(u);
        var cx = o.c.cx + o.dx * (1 - E.out(u)), cy = o.c.cy + o.dy * (1 - E.out(u)), cz = lerp(o.zs, zt, e);
        P(cx, cy, cz + ty[2] + 0.05); var sx = _x, sy = _y; P(cx, cy, cz + ty[2] + 0.3 + 1.3 * e);
        var gr = ctx.createLinearGradient(sx, sy, _x, _y); gr.addColorStop(0, C.silver); gr.addColorStop(1, C.surface);
        ctx.globalAlpha = Math.min(1, u * 4) * 0.7; ctx.strokeStyle = gr; ctx.lineWidth = Math.max(1, cam.s * 0.06);
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(_x, _y); ctx.stroke();
        ctx.globalAlpha = Math.min(1, u * 4);
        box(cx - ty[0] / 2, cy - ty[1] / 2, cz, cx + ty[0] / 2, cy + ty[1] / 2, cz + ty[2], C.fam[o.c.fam], C.edge, 1);
        ctx.globalAlpha = 1;
      }
    }
    if (t > 10 && t < 18.5) {
      for (i = 0; i < STREAM.length; i++) {
        o = STREAM[i];
        if (t < o.t0 || t >= o.t1) continue;
        (function (o) {
          var zs = pileH(o.c, o.t0), q = o.q, zt = q.z0 + q.h * q.P * 0.85;
          var f = function (tt) { return arcAt(o, tt, o.c.cx, o.c.cy, zs, q.cx + o.dx, q.cy + o.dy, zt); };
          trail(t, o, f, C.accent);
          var pp = f(t), ty2 = o.ty;
          box(pp[0] - ty2[0] / 2, pp[1] - ty2[1] / 2, pp[2], pp[0] + ty2[0] / 2, pp[1] + ty2[1] / 2, pp[2] + ty2[2], C.fam[o.c.fam], C.edge, 1);
        })(o);
      }
    }
    if (t > 36.5 && t < 44) {
      for (i = 0; i < SPILL.length; i++) {
        o = SPILL[i];
        if (t < o.t0 || t >= o.t1) continue;
        (function (o) {
          var q = o.q, h = o.h, lv = levels(q, o.t0), zs = q.z0 + q.h * Math.max(lv[1], 0.3);
          var f = function (tt) { return arcAt(o, tt, q.cx, q.cy, zs, (h.x0 + h.x1) / 2, (h.y0 + h.y1) / 2, h.z0); };
          trail(t, o, f, C.bright);
          var pp = f(t), ty2 = h.ty;
          box(pp[0] - ty2[0] / 2, pp[1] - ty2[1] / 2, pp[2], pp[0] + ty2[0] / 2, pp[1] + ty2[1] / 2, pp[2] + ty2[2], C.heapTint, C.bright, 1.5);
        })(o);
      }
    }
    if (state.ff && t > 47 && t < 54.5) {
      for (i = 0; i < BACK.length; i++) {
        o = BACK[i];
        if (t < o.t0 || t >= o.t1) continue;
        (function (o) {
          var q = o.q, h = o.h, zt = q.z0 + q.h * q.R2 * 0.9;
          var f = function (tt) { return arcAt(o, tt, (h.x0 + h.x1) / 2, (h.y0 + h.y1) / 2, h.z0, q.cx, q.cy, zt); };
          trail(t, o, f, C.accent);
          var pp = f(t), ty2 = h.ty;
          box(pp[0] - ty2[0] / 2, pp[1] - ty2[1] / 2, pp[2], pp[0] + ty2[0] / 2, pp[1] + ty2[1] / 2, pp[2] + ty2[2], C.fam[h.fam], C.accent, 1.5);
        })(o);
      }
    }
  }

  function drawLabels(t) {
    var a;
    a = seg(t, 1.2, 2.2) * (1 - seg(t, 8.6, 9.4));
    if (a > 0) { ctx.globalAlpha = a; P(-24.6, -5.9, 2.3); label(T("r.pallets.anim.lbl.yard"), _x, _y - 10, "center", C.ink); ctx.globalAlpha = 1; }
    a = seg(t, 9.2, 10.2) * (1 - seg(t, 19.4, 20.2) * (1 - seg(t, 36.2, 37.4)));
    if (a > 0) {
      ctx.globalAlpha = a;
      P(2.4, -2.75, ZM + 2.2); label(T("r.pallets.deck.main"), _x - 4, _y, "end", C.ink2, FONT_S);
      P(9, LOWY + 1.95, 0); label(T("r.pallets.deck.lower"), _x, _y + 13, "start", C.ink2, FONT_S);
      P(41.6, 0, ZM); label("A330-200F", _x, _y - 14, "end", C.muted, FONT_S);
      ctx.globalAlpha = 1;
    }
    a = seg(t, 18.0, 18.4) * (1 - seg(t, 20.6, 21.2));
    if (a > 0) { ctx.globalAlpha = a; P(R3.cx, R3.y1, R3.z0 + R3.h); label("R3", _x, _y + 14, "center", C.accent); ctx.globalAlpha = 1; }
    a = seg(t, 20.4, 21.2) * (1 - seg(t, 35.2, 36));
    if (a > 0) {
      ctx.globalAlpha = a;
      P(beltSlotX(3), -0.66, BELT_Z + 0.85); label(T("r.pallets.anim.lbl.window"), _x, _y - 6, "center", C.accent);
      P(PX + PL / 2, PY, PZ + PH + 0.1); label("R3", _x, _y - 12, "center", C.ink2);
      P(PX + PL, PY + PW, PZ + PLAN_H); label(T("r.pallets.anim.lbl.plan"), _x + 8, _y, "start", C.accent, FONT_S);
      ctx.globalAlpha = 1;
    }
    a = seg(t, 22.0, 23.0);
    if (a > 0 && t > DIVERTED[0].t1 - 0.2) {
      var hx = -3.2, hy = lerp(4.2, 6.4, seg(t, 35.6, 37.8));
      ctx.globalAlpha = a * seg(t, DIVERTED[0].t1 - 0.2, DIVERTED[0].t1 + 0.3);
      P(hx, hy, 0); label(T("r.pallets.anim.lbl.ground"), _x, _y + 13, "center", C.crit);
      ctx.globalAlpha = 1;
    }
    a = seg(t, CH[4] + 0.4, CH[4] + 1.2);
    if (a > 0) {
      ctx.globalAlpha = a;
      P(20, -2.75, ZM + 3.2);
      label(T(state.ff ? "r.pallets.anim.lbl.ff" : "r.pallets.anim.lbl.gap"), _x, _y - 4, "center", state.ff ? C.accent : C.crit);
      ctx.globalAlpha = 1;
    }
  }

  function drawInstruments(t) {
    var a = seg(t, 9.4, 10.2);
    if (a <= 0) return;
    var bx = inst.bx, by = inst.by, bw = inst.bw, bh = 8, M = 70;
    var X = function (v) { return bx + bw * v / M; };
    ctx.globalAlpha = a;
    ctx.fillStyle = C.surface2; ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = C.border || C.axis; ctx.lineWidth = 1; ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
    var plan = PLAN_KG / 1000 * E.inOut(seg(t, 10.2, 17.8));
    ctx.fillStyle = C.accent; ctx.globalAlpha = a * 0.18; ctx.fillRect(bx, by, X(plan) - bx, bh);
    ctx.globalAlpha = a; ctx.strokeStyle = C.accent; ctx.lineWidth = 1.5; ctx.strokeRect(bx + 0.75, by + 0.75, Math.max(0, X(plan) - bx - 1.5), bh - 1.5);
    var real = realised(t) / 1000;
    if (real > 0) { ctx.fillStyle = C.accent; ctx.fillRect(bx, by, X(real) - bx, bh); }
    // limit and manual marks
    var pulse = seg(t, 17.6, 18.2) * (1 - seg(t, 19.4, 20));
    ctx.strokeStyle = C.crit; ctx.lineWidth = 2 + 2 * pulse * (0.5 + 0.5 * Math.sin(t * 12)); ctx.setLineDash([3, 2]);
    ctx.beginPath(); ctx.moveTo(X(65), by - 5); ctx.lineTo(X(65), by + bh + 5); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X(MANUAL / 1000), by - 6); ctx.lineTo(X(MANUAL / 1000), by + bh + 3); ctx.stroke();
    label(T("r.pallets.ch.manual"), X(MANUAL / 1000) - 3, by - 11, "end", C.ink, FONT_S);
    label(T("r.pallets.solo.limit"), X(65) + (portrait ? 0 : 4), by + bh + 11, portrait ? "end" : "start", C.crit, FONT_S);
    label(T("r.pallets.solo.axis"), bx, by + bh + 11, "start", C.muted, FONT_S);
    ctx.globalAlpha = 1;
    // lateral balance gauge (Stage 1 plan)
    var g = seg(t, 9.6, 10.4) * (1 - seg(t, 19.8, 20.6));
    if (g > 0) {
      var u = seg(t, 10.2, 18.4);
      var v = IMB * E.out(u) + 260 * Math.sin(u * 17) * Math.pow(1 - u, 2) * (u > 0 ? 1 : 0);
      v = clamp(v, -490, 490);
      var gx = inst.gx, gy = inst.gy, r = inst.gr;
      ctx.globalAlpha = g;
      ctx.lineWidth = 5; ctx.strokeStyle = C.surface2; ctx.beginPath(); ctx.arc(gx, gy, r, Math.PI, 2 * Math.PI); ctx.stroke();
      ctx.lineWidth = 2; ctx.strokeStyle = C.crit;
      ctx.beginPath(); ctx.moveTo(gx - r - 4, gy); ctx.lineTo(gx - r + 5, gy); ctx.moveTo(gx + r - 5, gy); ctx.lineTo(gx + r + 4, gy); ctx.stroke();
      var ang = -Math.PI / 2 + (v / DELTA) * Math.PI / 2;
      ctx.strokeStyle = C.accent; ctx.lineWidth = 2.5; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + Math.cos(ang) * (r - 3), gy + Math.sin(ang) * (r - 3)); ctx.stroke(); ctx.lineCap = "butt";
      ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(gx, gy, 3, 0, 2 * Math.PI); ctx.fill();
      label(T("r.pallets.deck.left"), gx - r - 9, gy - 2, "end", C.muted, FONT_S);
      label(T("r.pallets.deck.right"), gx + r + 9, gy - 2, "start", C.muted, FONT_S);
      label(T("r.pallets.anim.lbl.balance", { v: fmt(Math.abs(v), 0) }), portrait ? 10 : gx, gy - r - 12, portrait ? "start" : "center", C.ink2, FONT_S);
      ctx.globalAlpha = 1;
    }
  }

  function stackedFrac(t) { return placedBy(t) / PLACED.length; }
  function realised(t) {
    if (t < 20.6) return 0;
    var r = LOAD[0] * stackedFrac(t);
    if (state.ff) r = lerp(r, LOAD[1], E.inOut(seg(t, 47.8, 53.6)));
    return r;
  }

  /* ---------- HUD ---------- */
  var hudCache = {};
  function setText(id, s) { if (hudCache[id] !== s) { hudCache[id] = s; document.getElementById(id).textContent = s; } }
  function show(id, on) { var k = id + ":on"; if (hudCache[k] !== on) { hudCache[k] = on; document.getElementById(id).classList.toggle("off", !on); } }
  function hud(t) {
    if (t < 9.8) {
      setText("pa-v1", fmt(Math.round(N_MAN * E.out(seg(t, 0.6, 6.8))), 0));
      setText("pa-l1", T("r.pallets.anim.k.manifest"));
    } else {
      setText("pa-v1", fmt(Math.round(N_PLAN * E.inOut(seg(t, 10.2, 17.8))), 0));
      setText("pa-l1", T("r.pallets.anim.k.plan"));
    }
    show("pa-c2", t >= 20.6);
    var rate = RATE[0] * stackedFrac(t);
    if (state.ff) rate = lerp(rate, RATE[1], E.inOut(seg(t, 47.8, 53.6)));
    setText("pa-v2", T("r.pallets.anim.k.pct", { v: fmt(rate, 1, 1) }));
    setText("pa-l2", T("r.pallets.anim.k.stacked"));
    show("pa-c3", t >= 9.8);
    if (t < 20.6) {
      setText("pa-v3", fmt(PLAN_KG / 1000 * E.inOut(seg(t, 10.2, 17.8)), 1, 1) + " t");
      setText("pa-l3", T("r.pallets.anim.k.planned"));
    } else {
      setText("pa-v3", fmt(realised(t) / 1000, 1, 1) + " t");
      setText("pa-l3", T("r.pallets.anim.k.loaded"));
    }
    show("pa-c4", t >= 38.6);
    var cost = state.ff ? lerp(COST[0], COST[1], E.inOut(seg(t, 47.8, 53.6))) : COST[0];
    setText("pa-v4", T("r.pallets.anim.k.costV", { v: fmt(cost, 3, 3) }));
    setText("pa-l4", T("r.pallets.anim.k.cost", { v: fmt(COST_MAN, 3, 3) }));
  }

  /* ---------- frame ---------- */
  function render(t) {
    pal();
    ctx.clearRect(0, 0, cv.w, cv.h);
    ctx.fillStyle = C.surface; ctx.fillRect(0, 0, cv.w, cv.h);
    setCam(t);
    ctx.lineJoin = "round";
    drawGround(t);
    drawYard(t);
    drawRamp(t, 0);
    drawHeap(t);
    drawRamp(t, 1);
    drawAircraft(t);
    drawParticles(t);
    drawLabels(t);
    drawInstruments(t);
    hud(t);
  }

  layout();
  var player = A.create({
    root: document.getElementById("anim"),
    duration: DUR,
    chapters: [{ t: CH[0], key: "r.pallets.anim.ch1" }, { t: CH[1], key: "r.pallets.anim.ch2" }, { t: CH[2], key: "r.pallets.anim.ch3" },
      { t: CH[3], key: "r.pallets.anim.ch4" }, { t: CH[4], key: "r.pallets.anim.ch5" }],
    onResize: function () { cv.fit(); layout(); },
    render: render
  });
  window.__palletsAnim = player;

  var segBtns = document.querySelectorAll("#pal-anim-seg button");
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      state.ff = b.getAttribute("data-ff") === "1";
      segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      if (A.reducedMotion) { player.seek(DUR); return; }
      if (player.time < CH[3]) player.refresh();
      else { player.seek(CH[4] - 0.4); player.play(); }
    });
  });
})();
