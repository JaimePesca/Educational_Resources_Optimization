    <div class="model">
      <div class="math"><script type="text/x-tex">\begin{aligned}
\max\; g \;&= \sum_{p\in P}\sum_{i\in I}\left(p_{ip}-c_{ip}\right) q_{ip}-\sum_{i\in I} f_i\, x_i\\[4pt]
\text{ST}\quad q_{ip} &= \sum_{j\in J}\delta_{jp}\, y_{jip} && \forall\, i\in I,\ p\in P\\
y_{jip} &= \frac{e^{V_{jip}}\, z_{ip}\, a_{ji}}{\sum_{i'\in I} e^{V_{ji'p}}\, z_{i'p}\, a_{ji'}+\sum_{r\in R\setminus I} e^{V_{jrp}}\, a_{jr}} && \forall\, j,\ i,\ p\\
V_{jrp} &= \beta^{0}_{rp}+\beta^{\mathrm{dist}}_{rp}\,\gamma_{jr}+\beta^{\mathrm{price}}_{rp}\, p_{rp}\\
d_{\min}+\left(\mathit{Max}_{ji}-d_{ik}\right)x_i+\left(\mathit{Max}_{ji}-d_{ik}\right)x_k &\le 2\,\mathit{Max}_{ji}-d_{ik} && \forall\, i<k\in I,\ j\in J\\
z_{ip} &\le x_i && \forall\, i\in I,\ p\in P\\
\sum_{p\in P} q_{ip} &\ge nd_{ip}\, x_i && \forall\, i\in I\\
x_i,\ z_{ip}\in\{0,1\},\quad y_{jip}&\in[0,1],\quad q_{ip}\ge 0
\end{aligned}</script></div>

    if (w <= 0) return "";
    return "M" + x + "," + y + "H" + (x + w - r) + "Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) +
      "V" + (y + h - r) + "Q" + (x + w) + "," + (y + h) + " " + (x + w - r) + "," + (y + h) + "H" + x + "Z";
  }

  /* ---- horizontal bar chart (competitors, logit shares) ---- */
  function drawHBars(svgId, boxId, rows, maxV, tickStep, tickFmt, ariaLabel) {
    var svg = $(svgId), W = boxWidth(boxId);
    var C = { ink: css("--ink"), ink2: css("--ink2"), muted: css("--muted"), grid: css("--grid"), axis: css("--axis"), acc: css("--accent"), sil: css("--mit-silver") };
    var rowH = 30, top = 6, bottom = 26;
    var labW = Math.min(170, Math.round(W * 0.44)), right = 46;
    var plotW = W - labW - right, H = top + rows.length * rowH + bottom;
    var sx = function (v) { return labW + (v / maxV) * plotW; };
    var o = [];
    for (var tv = 0; tv <= maxV + 1e-9; tv += tickStep) {
      var gx = sx(tv);
      o.push('<line x1="' + gx + '" x2="' + gx + '" y1="' + top + '" y2="' + (H - bottom) + '" stroke="' + (tv === 0 ? C.axis : C.grid) + '" stroke-width="1"/>');
      o.push('<text x="' + gx + '" y="' + (H - bottom + 16) + '" text-anchor="middle" font-size="11" fill="' + C.muted + '">' + esc(tickFmt(tv)) + "</text>");
    }
    rows.forEach(function (r, i) {
      var y = top + i * rowH, bh = 18, by = y + (rowH - bh) / 2, w = Math.max(0, sx(r.v) - labW);
      o.push("<g><title>" + esc(r.label + ": " + r.text) + "</title>");
      o.push('<rect x="0" y="' + y + '" width="' + W + '" height="' + rowH + '" fill="transparent"/>');
      o.push('<text x="' + (labW - 8) + '" y="' + (by + bh / 2 + 4) + '" text-anchor="end" font-size="12" fill="' + (r.hi ? C.ink : C.ink2) + '"' + (r.hi ? ' font-weight="600"' : "") + ">" + esc(r.label) + "</text>");
      o.push('<path d="' + hbar(labW, by, w, bh) + '" fill="' + (r.hi ? C.acc : C.sil) + '"/>');
      o.push('<text x="' + (labW + w + 6) + '" y="' + (by + bh / 2 + 4) + '" font-size="12" font-weight="600" fill="' + C.ink + '">' + esc(r.text) + "</text>");
      o.push("</g>");
    });
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("width", W);
    svg.setAttribute("height", H);
    svg.setAttribute("aria-label", ariaLabel);
    svg.innerHTML = o.join("");
  }

  function drawComp() {
    var rows = COMP.map(function (c) { return { label: tk("type." + c.k), v: c.v, text: fmt(c.v, 0), hi: c.k === "nano" }; });
    drawHBars("compChart", "compBox", rows, 90, 20, function (v) { return fmt(v, 0); }, tk("comp.aria"));
  }

  /* ---- scenario explorer ---- */
  var METRIC = {
    profit: { get: function (s) { return s.obj; }, f: function (v) { return fmt(v, 0); } },
    kg:     { get: function (s) { return s.kg; },  f: function (v) { return fmt(v, 0); } },
    stores: { get: function (s) { return s.st; },  f: function (v) { return fmt(v, 0); } },
    time:   { get: function (s) { return s.h; },   f: function (v) { return fmt(v, 2, 2); } }
  };

  function drawScenarioChart(cur) {
    var svg = $("scChart"), W = boxWidth("scBox"), H = 270, M = METRIC[state.metric];
    var C = { ink: css("--ink"), ink2: css("--ink2"), muted: css("--muted"), grid: css("--grid"), axis: css("--axis"), acc: css("--accent"), sil: css("--mit-silver") };
    var ml = 56, mr = 8, mt = 34, mb = 44, pw = W - ml - mr, ph = H - mt - mb;
    var vmax = Math.max.apply(null, SC.map(M.get));
    var step = niceStep(vmax / 4), ymax = Math.ceil(vmax / step) * step;
    if (ymax < vmax * 1.08) ymax += step;
    var sy = function (v) { return mt + ph - (v / ymax) * ph; };
    var o = [];
    o.push('<text x="0" y="14" font-size="12" font-weight="600" fill="' + C.ink2 + '">' + esc(tk("metric." + state.metric + ".axis")) + "</text>");
    for (var v = 0; v <= ymax + 1e-9; v += step) {
      var y = sy(v);
      o.push('<line x1="' + ml + '" x2="' + (W - mr) + '" y1="' + y + '" y2="' + y + '" stroke="' + (v === 0 ? C.axis : C.grid) + '"/>');
      o.push('<text x="' + (ml - 6) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="' + C.muted + '">' + esc(state.metric === "time" ? fmt(v, 2) : fmt(v, 0)) + "</text>");
    }
    var slot = pw / SC.length, bw = Math.min(64, slot * 0.62);
    SC.forEach(function (s, i) {
      var val = M.get(s), cx = ml + slot * i + slot / 2, y = sy(val), on = s === cur;
      o.push('<g class="hit" data-sc="' + s.id + '"><title>' + esc(scName(s) + " (" + condLabel(s) + "): " + M.f(val)) + "</title>");
      o.push('<rect x="' + (cx - slot / 2) + '" y="' + mt + '" width="' + slot + '" height="' + (ph + mb) + '" fill="transparent"/>');
      o.push('<path d="' + vbar(cx - bw / 2, y, bw, mt + ph - y) + '" fill="' + (on ? C.acc : C.sil) + '"/>');
      o.push('<text x="' + cx + '" y="' + (y - 6) + '" text-anchor="middle" font-size="11.5" font-weight="600" fill="' + C.ink + '">' + esc(M.f(val)) + "</text>");
      o.push('<text x="' + cx + '" y="' + (mt + ph + 17) + '" text-anchor="middle" font-size="12" font-weight="' + (on ? 700 : 400) + '" fill="' + (on ? C.ink : C.ink2) + '">' + esc(scShort(s)) + "</text>");
      o.push('<text x="' + cx + '" y="' + (mt + ph + 33) + '" text-anchor="middle" font-size="11" fill="' + C.muted + '">' + esc(condLabel(s)) + "</text>");
      o.push("</g>");
    });
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("width", W);
    svg.setAttribute("height", H);
    svg.setAttribute("aria-label", tk("sc.aria", { metric: tk("metric." + state.metric), name: scName(cur) }));
    svg.innerHTML = o.join("");
  }

  function renderScenario() {
    var cur = find(state.d, state.dem);
    document.querySelectorAll("#segDist button").forEach(function (b) {
      var d = +b.getAttribute("data-d"), ok = !!find(d, state.dem);
      b.textContent = tk("sc.m", { v: fmt(d, 0) });
      b.disabled = !ok;
      b.setAttribute("aria-pressed", String(d === state.d));
    });
    document.querySelectorAll("#segDem button").forEach(function (b) {
      var dem = +b.getAttribute("data-dem"), ok = !!find(state.d, dem);
      b.disabled = !ok;
      b.setAttribute("aria-pressed", String(dem === state.dem));
    });
    document.querySelectorAll("#segMetric button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-m") === state.metric));
    });
    $("scShowing").innerHTML = tk("sc.showing", { name: esc(scName(cur)), d: fmt(cur.d, 0), dem: esc(demLabel(cur.dem)) });
    $("tStores").textContent = fmt(cur.st, 0);
    $("tProfit").textContent = fmt(cur.obj, 0);
    $("tKg").textContent = fmt(cur.kg, 0);
    $("tPct").textContent = fmt(cur.pct, 0) + "%";
    $("tTime").textContent = fmt(cur.h, 2, 2);
    var rows = SC.map(function (s) {
      return '<tr class="clickable' + (s === cur ? " on" : "") + '" data-sc="' + s.id + '"><td>' + esc(scName(s)) + '</td><td class="num">' + fmt(s.d, 0) +
        '</td><td class="num">' + esc(s.dem === 0 ? "0%" : demLabel(s.dem)) + '</td><td class="num">' + fmt(s.obj, 0) + '</td><td class="num">' + fmt(s.h, 2, 2) +
        '</td><td class="num">' + fmt(s.st, 0) + '</td><td class="num">' + fmt(s.kg, 0) + '</td><td class="num">' + fmt(s.pct, 0) + "%</td></tr>";
    });
    document.querySelector("#scTable tbody").innerHTML = rows.join("");
    drawScenarioChart(cur);
  }

  function selectScenario(id) {
    var s = SC.filter(function (x) { return x.id === id; })[0];
    if (!s) return;
    state.d = s.d; state.dem = s.dem;
    renderScenario();
  }

  /* ---- logit panel ---- */
  function renderLogit() {
    var d = +$("lgDist").value, p = +$("lgPrice").value, mult = state.loc === "edge" ? 2 : 1;
    var rows = CH.map(function (c) {
      var isNew = c.k === "newnano";
      var dist = isNew ? d : c.d * mult, price = isNew ? p : c.p;
      var V = c.b0 + BD * dist + BP * price;
      return { k: c.k, b0: c.b0, dist: dist, price: price, V: V, e: Math.exp(V), isNew: isNew };
    });
    var sum = rows.reduce(function (a, r) { return a + r.e; }, 0);
    rows.forEach(function (r) { r.P = r.e / sum; });
    var nw = rows[0];

    $("lgDistOut").textContent = tk("lg.km", { v: fmt(d, 2, 2) });
    $("lgPriceOut").textContent = tk("lg.usd", { v: fmt(p, 2, 2) });
    document.querySelectorAll("#segLoc button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-loc") === state.loc));
    });
    $("lgReadout").innerHTML = tk("lg.readout", {
      b0: fmt(nw.b0, 1, 1), bd: fmt(BD, 1, 1), d: fmt(d, 2, 2), bp: fmt(BP, 1, 1), p: fmt(p, 2, 2),
      v: fmt(nw.V, 2, 2), share: fmt(nw.P * 100, 1, 1)
    });
    $("lgCoef").innerHTML = tk("lg.coef", { bd: fmt(BD, 1, 1), bp: fmt(BP, 1, 1) });

    var chartRows = rows.map(function (r) {
      return { label: tk("type." + r.k), v: r.P * 100, text: fmt(r.P * 100, 1, 1) + "%", hi: r.isNew };
    });
    drawHBars("lgChart", "lgBox", chartRows, 100, 25, function (v) { return fmt(v, 0) + "%"; }, tk("lg.aria", { share: fmt(nw.P * 100, 1, 1) }));

    document.querySelector("#lgTable tbody").innerHTML = rows.map(function (r) {
      return "<tr" + (r.isNew ? ' class="on"' : "") + "><td>" + esc(tk("type." + r.k)) + '</td><td class="num">' + fmt(r.b0, 1, 1) +
        '</td><td class="num">' + fmt(r.dist, 2, 2) + '</td><td class="num">' + fmt(r.price, 2, 2) + '</td><td class="num">' + fmt(r.V, 2, 2) +
        '</td><td class="num">' + fmt(r.P * 100, 1, 1) + "%</td></tr>";
    }).join("");
  }

  function renderStats() {
    $("stHouse").textContent = fmt(537, 0);
    $("stSplit").textContent = fmt(288, 0) + " / " + fmt(249, 0);
    $("stRet").textContent = fmt(188, 0);
    $("stCand").textContent = fmt(50, 0);
    $("stProd").textContent = fmt(3, 0);
    $("stScen").textContent = fmt(5, 0);
  }

  function drawCharts() { drawComp(); renderScenario(); renderLogit(); }
  function render() { renderStats(); drawCharts(); }

  /* ---- events ---- */
  $("segDist").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b || b.disabled) return;
    state.d = +b.getAttribute("data-d"); renderScenario();
  });
  $("segDem").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b || b.disabled) return;
    state.dem = +b.getAttribute("data-dem"); renderScenario();
  });
  $("segMetric").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.metric = b.getAttribute("data-m"); renderScenario();
  });
  $("scChart").addEventListener("click", function (e) {
    var g = e.target.closest("[data-sc]"); if (g) selectScenario(g.getAttribute("data-sc"));
  });
  document.querySelector("#scTable tbody").addEventListener("click", function (e) {
    var tr = e.target.closest("tr[data-sc]"); if (tr) selectScenario(tr.getAttribute("data-sc"));
  });
  $("segLoc").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.loc = b.getAttribute("data-loc"); renderLogit();
  });
  $("lgDist").addEventListener("input", renderLogit);
  $("lgPrice").addEventListener("input", renderLogit);

  var raf = 0;
  window.addEventListener("resize", function () {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(drawCharts);
  });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawCharts);

  I18N.onChange(render); // runs once the language is ready and on every language switch
})();
</script>
<script src="../assets/anim.js?v=__BUILD__" charset="utf-8"></script>
<script>
/* "See it in motion": the real case of Chía and Cajicá animated.
 * Real figures: 537 households (288 Chía, 249 Cajicá), 188 competitors by type, 50 candidate sites and the
 * Table 3 results for 500, 750 and 1,000 m. The paper publishes no coordinates, so the towns are stylized and
 * every position below is illustrative (fixed seeds, identical on every load). */
(function () {
  "use strict";
  var A = window.Anim, E = A.ease, seg = A.seg, lerp = A.lerp, clamp = A.clamp;
  var K = "r.nanostores.";
  function tk(k, v) { return I18N.t(K + k, v); }
  function fmt(v, mx, mn) { return I18N.fmt(v, mx == null ? 0 : mx, mn); }
  var FONT = "Helvetica Neue, Helvetica, Arimo, Arial, sans-serif";

  /* ---- real data (Section 2 and Table 3 of the manuscript) ---- */
  var SCEN = {
    500:  { st: 32, obj: 42643, kg: 108210, pct: 27 },
    750:  { st: 21, obj: 30886, kg: 77844,  pct: 19 },
    1000: { st: 17, obj: 26254, kg: 65954,  pct: 16 }
  };
  var TYPES = [
    { k: "nano", n: 81 }, { k: "fruver", n: 60 }, { k: "butcher", n: 17 },
    { k: "super", n: 13 }, { k: "hd", n: 9 }, { k: "conv", n: 8 }
  ];
  var N_HH = [288, 249], N_CAND = 50;
  var dmin = 1000;

  /* ---- timeline (seconds) ---- */
  var DUR = 55, T2 = 9.5, T3 = 18.5, T4 = 25, T5 = 47;
  var HH0 = 2.8, HH1 = 8.4;            // household pops
  var CT0 = 9.9, CTSTEP = 0.78;        // competitor groups
  var LN0 = 14.4, LN1 = 17.2;          // purchase lines
  var CD0 = 18.9, CD1 = 22.4;          // candidates
  var OPEN1 = 26.5, OPEN2 = 31.2, OPEN_END = 45.2;

  /* ---- stylized geography (world units are km, y grows southwards) ---- */
  var TOWNS = [
    { cx: 0, cy: 0, R: 2.5, ph: [0.4, 1.9, 3.1], amp: [0.10, 0.06, 0.035], sx: 0.95, sy: 1.05,
      core: { x: 0.2, y: -0.15, r: 0.75 }, cand: 28, key: "anim.chia", side: -1 },
    { cx: 3.6, cy: -3.9, R: 2.0, ph: [2.2, 0.3, 4.4], amp: [0.09, 0.07, 0.04], sx: 1, sy: 1,
      core: { x: 3.5, y: -3.8, r: 0.6 }, cand: 22, key: "anim.cajica", side: 1 }
  ];
  function townR(T, th) {
    return T.R * (1 + T.amp[0] * Math.sin(2 * th + T.ph[0]) + T.amp[1] * Math.sin(3 * th + T.ph[1]) + T.amp[2] * Math.sin(5 * th + T.ph[2]));
  }
  function inTown(T, x, y, k) {
    var dx = (x - T.cx) / T.sx, dy = (y - T.cy) / T.sy;
    return Math.hypot(dx, dy) < townR(T, Math.atan2(dy, dx)) * k;
  }
  function polyOf(T) {
    var p = [];
    for (var i = 0; i < 120; i++) {
      var th = i / 120 * Math.PI * 2, r = townR(T, th);
      p.push(T.cx + Math.cos(th) * r * T.sx, T.cy + Math.sin(th) * r * T.sy);
    }
    return p;
  }
  function corePoly(T, seed) {
    var R = A.rng(seed), a = R() * 6, b = R() * 6, p = [];
    for (var i = 0; i < 60; i++) {
      var th = i / 60 * Math.PI * 2, r = T.core.r * (1 + 0.12 * Math.sin(2 * th + a) + 0.08 * Math.sin(3 * th + b));
      p.push(T.core.x + Math.cos(th) * r, T.core.y + Math.sin(th) * r);
    }
    return p;
  }
  function bez(p0, p1, p2, p3, n) {
    var o = [];
    for (var i = 0; i <= n; i++) {
      var u = i / n, v = 1 - u;
      o.push(v * v * v * p0[0] + 3 * v * v * u * p1[0] + 3 * v * u * u * p2[0] + u * u * u * p3[0],
             v * v * v * p0[1] + 3 * v * v * u * p1[1] + 3 * v * u * u * p2[1] + u * u * u * p3[1]);
    }
    return o;
  }
  var ROADS = [
    bez([0.2, -0.15], [1.1, -1.8], [2.2, -2.9], [3.5, -3.8], 40),      // Chía to Cajicá
    bez([0.2, -0.15], [0.6, 1.4], [1.6, 2.4], [2.4, 4.4], 30),          // south, towards Bogotá
    bez([3.5, -3.8], [3.8, -5.0], [4.4, -6.0], [4.7, -7.6], 30),        // north
    bez([0.2, -0.15], [-1.1, -0.45], [-2.2, -0.2], [-3.8, -1.1], 30)    // west
  ];
  function polyLen(p) {
    var L = [0];
    for (var i = 2; i < p.length; i += 2) L.push(L[L.length - 1] + Math.hypot(p[i] - p[i - 2], p[i + 1] - p[i - 1]));
    return L;
  }
  var ROADLEN = ROADS.map(polyLen);

  /* ---- illustrative but deterministic positions ---- */
  var W = { towns: [], hh: [], comp: [], cand: [] };
  (function build() {
    TOWNS.forEach(function (T, i) { W.towns.push({ poly: polyOf(T), core: corePoly(T, 71 + i) }); });

    // households: part spread over the town, part denser around downtown
    var R = A.rng(20200537);
    TOWNS.forEach(function (T, ti) {
      var n = 0;
      while (n < N_HH[ti]) {
        var x, y;
        if (R() < 0.55) {
          var th = R() * Math.PI * 2, rr = Math.sqrt(R()) * townR(T, th) * 0.95;
          x = T.cx + Math.cos(th) * rr * T.sx; y = T.cy + Math.sin(th) * rr * T.sy;
        } else {
          var g1 = Math.sqrt(-2 * Math.log(R() + 1e-9)), g2 = R() * Math.PI * 2, s = T.R * 0.3;
          x = T.core.x + Math.cos(g2) * g1 * s; y = T.core.y + Math.sin(g2) * g1 * s;
        }
        if (!inTown(T, x, y, 0.95)) continue;
        var dc = Math.hypot(x - T.core.x, y - T.core.y) / T.R;
        W.hh.push({ x: x, y: y, town: ti, pop: dc + R() * 0.35, ph: R(), lr: R() });
        n++;
      }
    });
    var mx = 0, mn = 1e9;
    W.hh.forEach(function (h) { mx = Math.max(mx, h.pop); mn = Math.min(mn, h.pop); });
    W.hh.forEach(function (h) { h.pop = HH0 + (h.pop - mn) / (mx - mn) * (HH1 - HH0 - 0.5); });

    // competitors, concentrated downtown
    R = A.rng(188);
    TYPES.forEach(function (ty, k) {
      for (var i = 0; i < ty.n; i++) {
        var ti = R() < 0.55 ? 0 : 1, T = TOWNS[ti], x, y, ok = false, tries = 0;
        while (!ok && tries++ < 60) {
          var s = T.R * (R() < 0.72 ? 0.2 : 0.42);
          var g1 = Math.sqrt(-2 * Math.log(R() + 1e-9)), g2 = R() * Math.PI * 2;
          x = T.core.x + Math.cos(g2) * g1 * s; y = T.core.y + Math.sin(g2) * g1 * s;
          ok = inTown(T, x, y, 0.88) && W.comp.every(function (c) { return Math.hypot(c.x - x, c.y - y) > 0.07; });
        }
        W.comp.push({ x: x, y: y, type: k, pop: CT0 + k * CTSTEP + (i / ty.n) * 0.6 + R() * 0.05 });
      }
    });

    // where each household shops today: one of its nearest competitors
    R = A.rng(4217);
    W.hh.forEach(function (h) {
      var near = W.comp.map(function (c, i) { return { i: i, d: Math.hypot(c.x - h.x, c.y - h.y) }; })
        .sort(function (a, b) { return a.d - b.d; }).slice(0, 4);
      var tot = 0;
      near.forEach(function (n) { n.w = 1 / Math.pow(n.d + 0.12, 2); tot += n.w; });
      var r = R() * tot, pick = near[0];
      for (var i = 0; i < near.length; i++) { r -= near[i].w; if (r <= 0) { pick = near[i]; break; } }
      h.store = pick.i;
      h.line = LN0 + h.lr * (LN1 - LN0 - 0.7);
    });

    // 50 candidate sites, mostly on the outskirts; the score favors sites far from downtown
    R = A.rng(1870);
    TOWNS.forEach(function (T, ti) {
      var n = 0, guard = 0;
      while (n < T.cand && guard++ < 20000) {
        var th = R() * Math.PI * 2, f = R() < 0.82 ? 0.62 + 0.33 * R() : 0.22 + 0.38 * R(), rr = townR(T, th) * f;
        var x = T.cx + Math.cos(th) * rr * T.sx, y = T.cy + Math.sin(th) * rr * T.sy;
        if (W.cand.some(function (c) { return Math.hypot(c.x - x, c.y - y) < 0.42; })) continue;
        W.cand.push({ x: x, y: y, town: ti, s: f + 0.15 * R() });
        n++;
      }
    });
    R = A.rng(50);
    var order = W.cand.map(function (c, i) { return { i: i, k: R() }; }).sort(function (a, b) { return a.k - b.k; });
    order.forEach(function (o, j) { W.cand[o.i].pop = CD0 + j / N_CAND * (CD1 - CD0 - 0.6); });

    // world bounds
    var b = { x0: 1e9, x1: -1e9, y0: 1e9, y1: -1e9 };
    W.towns.forEach(function (t) {

      ctx.beginPath(); ctx.moveTo(x0 + Math.cos(ang) * ng * 1.4, y0 + Math.sin(ang) * ng * 1.4); ctx.lineTo(x1, y1);
      ctx.strokeStyle = C["accent-text"]; ctx.lineWidth = 1.4; ctx.stroke();
      ctx.beginPath(); ctx.arc(x1, y1, 2.4, 0, TAU); ctx.fillStyle = C["accent-text"]; ctx.fill();
      label(tk("sc.m", { v: fmt(dmin) }), (x0 + x1) / 2 + Math.sin(ang) * 16, (y0 + y1) / 2 - Math.cos(ang) * 16, "center", C["accent-text"], 13, 700);
      ctx.globalAlpha = 1;
    }

    /* overlay: competitor type readout (chapter 2) */
    for (k = 0; k < TYPES.length; k++) {
      var a0 = CT0 + k * CTSTEP, a1 = a0 + CTSTEP;
      var oa = seg(t, a0, a0 + 0.18) * (1 - (k === TYPES.length - 1 ? seg(t, 16.2, 16.8) : seg(t, a1 - 0.22, a1 - 0.04)));
      if (oa <= 0) continue;
      var cnt = Math.round(TYPES[k].n * clamp(seg(t, a0, a0 + 0.6), 0, 1));
      var tx, ty2, al;
      if (L.phone) { tx = 14; ty2 = 96; al = "left"; } else { tx = w - 18; ty2 = h - 46; al = "right"; }
      ctx.globalAlpha = oa;
      var num = fmt(cnt), nm = tk("type." + TYPES[k].k);
      label(num, tx, ty2, al, C.ink, 28, 700);
      ctx.font = "600 12.5px " + FONT;
      var nmw = ctx.measureText(nm).width;
      label(nm, al === "left" ? tx + 18 : tx, ty2 + 25, al, C.ink2, 12.5, 600);
      var gxp = al === "left" ? tx + 6 : tx - nmw - 12, gg = 5;
      ctx.beginPath(); glyph(k, gxp, ty2 + 25, gg);
      if (STROKED[k]) { ctx.strokeStyle = typeStyle(C, k); ctx.lineWidth = k === 5 ? 2.2 : 1.6; ctx.stroke(); }
      else { ctx.fillStyle = typeStyle(C, k); ctx.fill(); }
      ctx.globalAlpha = 1;
    }

    /* overlay: captured share (chapter 5) */
    var pa = E.out(seg(t, T5 + 0.3, T5 + 1.3));
    if (pa > 0) {
      var pw = L.phone ? w - 24 : Math.min(270, w * 0.3), ph = L.phone ? 62 : 78;
      var pxp = L.phone ? 12 : w - pw - 16, pyp = h - ph - 12 + (1 - pa) * 12;
      ctx.globalAlpha = pa;
      ctx.beginPath(); rrect(pxp, pyp, pw, ph, 3);
      ctx.fillStyle = C.surface; ctx.fill(); ctx.strokeStyle = C.border; ctx.lineWidth = 1; ctx.stroke();
      var bu = E.inOut(seg(t, T5 + 0.9, T5 + 2.6)), pct = S.sc.pct * bu;
      var bx = pxp + 12, bwid = pw - 24, byy = pyp + ph - (L.phone ? 16 : 22), bht = L.phone ? 8 : 10;
      ctx.font = "700 " + (L.phone ? 24 : 32) + "px " + FONT;
      ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.fillStyle = C["accent-text"];
      var ptxt = fmt(Math.round(pct)) + "%";
      ctx.fillText(ptxt, bx, byy - (L.phone ? 10 : 14));
      var ptw = ctx.measureText(ptxt).width;
      ctx.font = "600 12px " + FONT; ctx.fillStyle = C.ink2;
      ctx.fillText(tk("tile.pct"), bx + ptw + 8, byy - (L.phone ? 12 : 17));
      ctx.beginPath(); rrect(bx, byy, bwid, bht, bht / 2); ctx.fillStyle = C.surface2; ctx.fill();
      if (pct > 0) { ctx.beginPath(); rrect(bx, byy, Math.max(bht, bwid * pct / 100), bht, bht / 2); ctx.fillStyle = acc; ctx.fill(); }
      // where the other two distances land
      [500, 750, 1000].forEach(function (dd) {
        if (dd === dmin) return;
        var xx = bx + bwid * SCEN[dd].pct / 100;
        ctx.beginPath(); ctx.moveTo(xx, byy - 3); ctx.lineTo(xx, byy + bht + 3);
        ctx.strokeStyle = C.muted; ctx.lineWidth = 1.5; ctx.stroke();
      });
      ctx.globalAlpha = 1;
    }

    /* HUD counters */
    var early = t < T4;
    chip("Hh", early, fmt(popped));
    chip("Comp", early && t >= T2, fmt(compN));
    chip("Cand", early && t >= T3, fmt(candN));
    var prog = 0;
    if (!early) for (j = 0; j < W.hh.length; j++) if (S.swT[j] < t) prog += seg(t, S.swT[j], S.swT[j] + 0.6);
    var fr = S.M ? prog / S.M : 0;
    chip("Stores", !early, fmt(opened));
    chip("Kg", !early, fmt(Math.round(S.sc.kg * fr)));
    chip("Profit", !early, fmt(Math.round(S.sc.obj * fr)));
  }

  function aria() {
    cv.el.setAttribute("aria-label", tk("anim.aria", {
      d: fmt(dmin), n: fmt(S.sc.st), kg: fmt(S.sc.kg), usd: fmt(S.sc.obj), pct: fmt(S.sc.pct)
    }));
  }

  layout();
  var player = A.create({
    root: root,
    duration: DUR,
    chapters: [
      { t: 0, key: K + "anim.ch1" }, { t: T2, key: K + "anim.ch2" }, { t: T3, key: K + "anim.ch3" },
      { t: T4, key: K + "anim.ch4" }, { t: T5, key: K + "anim.ch5" }
    ],
    onResize: function () { cv.fit(); layout(); },
    render: render
  });

  /* scenario control: minimum distance between new stores */
  var segEl = document.getElementById("anSeg");
  function syncSeg() {
    segEl.querySelectorAll("button").forEach(function (b) {
      var d = +b.getAttribute("data-d");
      b.textContent = tk("sc.m", { v: fmt(d) });
      b.setAttribute("aria-pressed", String(d === dmin));
    });
    aria();
  }
  segEl.addEventListener("click", function (ev) {
    var b = ev.target.closest("button");
    if (!b) return;
    var d = +b.getAttribute("data-d");
    if (d === dmin) return;
    dmin = d; solve(); syncSeg();
    if (player.time > T4) { player.seek(T4 + 0.001); player.play(); } else player.refresh();
  });
  I18N.onChange(syncSeg);
})();
</script>
</body>
</html>
