    <div class="model">
      <div><div class="math"><script type="text/x-tex">\begin{aligned}
\mathrm{cyc}_{fk} &= 2\,\tau^{\mathrm{fw}}_{fk}+\delta\\
d_{ifk} &= \max\!\left(0,\ \left\lfloor \frac{W-\tau^{\mathrm{bf}}_{if}}{\mathrm{cyc}_{fk}} \right\rfloor\right)\\
L_{ifk} &= d_{ifk}\, Q\\
R_f &= c\, A_0\, e^{\rho_f\, t^{\mathrm{arr}}_f}
\end{aligned}</script></div>
      <div class="math"><script type="text/x-tex">\begin{aligned}
\min\;& (1-\lambda)\sum_{s} p_s\,\ell_s+\lambda\left[\eta+\frac{1}{1-\alpha}\sum_{s} p_s\, t_s\right]\\[6pt]
\text{ST}\;& \sum_{i} c^{\mathrm{base}}_i\, y_i+\sum_{i} c^{\mathrm{air}}\, n_i+\sum_{k} c^{\mathrm{wat}}_k\, w_k\le B\\
& n_i\le M\, y_i && \forall\, i\\
& z_{fks}\le w_k && \forall\, f,\ k,\ s\\
& \sum_{k} z_{fks}\le 1 && \forall\, f,\ s\\
& \sum_{f} x_{ifs}\le n_i && \forall\, i,\ s\\
& q_{fs}=\sum_{i}\sum_{k} L_{ifk}\, x_{ifs}\, z_{fks} && \forall\, f,\ s\\
& q_{fs}\ge R_f\left(1-e_{fs}\right) && \forall\, f,\ s\\
& \ell_s=\sum_{f} D_f\, e_{fs} && \forall\, s\\
& t_s\ge \ell_s-\eta,\quad t_s\ge 0 && \forall\, s\\
& y_i,\ w_k,\ z_{fks},\ e_{fs}\in\{0,1\},\qquad n_i,\ x_{ifs}\in\mathbb{Z}_{+}
\end{aligned}</script></div></div>

  /* ---- panel 1: calculator ---- */
  function renderCalc() {
    var tb = state.dbf / V, cycH = 2 * state.dfw / V + DELTA;
    var n = drops(state.dbf, state.dfw, state.w);
    var deliv = n * Q, req = required(state.dbf);

    document.getElementById("dbf-o").textContent = t("r.wildfire.unit.km", { v: fmt(state.dbf, 0) });

    segButtons(document.getElementById("w-seg"), [1, 2, 4, 8].map(function (v) {

    segButtons(document.getElementById("rho-seg"), [0.5, 1, 2].map(function (v) {
      return { value: v, label: t("r.wildfire.unit.perh", { v: fmt(v, 1) }) };

    var out = document.getElementById("calc-out");

    function row(label, val, sub) {
      var d = h("div");

      var v = h("span", null, val);

      d.appendChild(v);

    }
    row(t("r.wildfire.out.arr"), t("r.wildfire.out.min", { v: fmt(tb * 60, 1) }));
    row(t("r.wildfire.out.cyc"), t("r.wildfire.out.min", { v: fmt(cycH * 60, 2) }));
    row(t("r.wildfire.out.drops"), fmt(n, 0), t("r.wildfire.out.dropsf", {
      w: t("r.wildfire.unit.h", { v: fmt(state.w, 0) }),

      cy: t("r.wildfire.unit.h", { v: fmt(cycH, 3) }), n: fmt(n, 0)
    }));
    row(t("r.wildfire.out.deliv"), t("r.wildfire.out.l", { v: fmt(deliv, 0) }));
    row(t("r.wildfire.out.req"), t("r.wildfire.out.l", { v: fmt(req, 0) }));

    vd.appendChild(h("span", null, t("r.wildfire.out.margin", { p: fmt(req > 0 ? 100 * deliv / req : 0, 0) })));

    // largest contained base distance (scan 0 to 300 km)
    var reachMax = -1, allOk = true;
    for (var d = 0; d <= XMAX; d += 0.5) {

    var reachTxt = reachMax < 0 ? t("r.wildfire.out.noreach")
      : allOk ? t("r.wildfire.out.allreach")

    document.getElementById("reach").textContent = reachTxt;

    drawCycleChart(n, deliv, req, ok);
    drawSchematic(tb, cycH, n);
  }

  function drawCycleChart(nNow, delivNow, reqNow, okNow) {
    var svg = document.getElementById("cyc-chart");
    clear(svg);
    var W = 560, H = 330, m = { l: 58, r: 22, t: 16, b: 46 };
    var pw = W - m.l - m.r, ph = H - m.t - m.b;
    var cInk2 = css("--ink2"), cGrid = css("--grid"), cAxis = css("--axis"), cBlue = css("--c-blue"),
        cAcc = css("--accent"), cInk = css("--ink"), cReg = css("--region"), cMuted = css("--muted");

    var ymaxData = Math.max(drops(0, state.dfw, state.w) * Q, required(0)) * 1.15;
    var step = niceStep(ymaxData / 1000, 5) * 1000;
    var ymax = Math.ceil(ymaxData / step) * step;
    function X(d) { return m.l + pw * d / XMAX; }
    function Y(v) { return m.t + ph * (1 - Math.min(v, ymax) / ymax); }

    // contained zones (shaded where delivered >= required)
    var inZone = false, z0 = 0;
    for (var d = 0; d <= XMAX + 0.25; d += 0.5) {
      var okd = d <= XMAX && drops(d, state.dfw, state.w) * Q >= required(d);
      if (okd && !inZone) { inZone = true; z0 = d; }
      if (!okd && inZone) {
        inZone = false;
        svg.appendChild(el("rect", { x: X(z0), y: m.t, width: Math.max(1, X(d - 0.5) - X(z0)), height: ph, fill: cReg }));
      }
    }

    // grid + y axis
    for (var v = 0; v <= ymax + 1e-6; v += step) {
      svg.appendChild(el("line", { x1: m.l, x2: m.l + pw, y1: Y(v), y2: Y(v), stroke: cGrid, "stroke-width": 1 }));
      svg.appendChild(el("text", { x: m.l - 6, y: Y(v) + 4, "text-anchor": "end", "font-size": 11, fill: cInk2, "font-family": css("--font-mono") }, fmt(v / 1000, 0)));
    }
    for (var xk = 0; xk <= XMAX; xk += 50) {
      svg.appendChild(el("line", { x1: X(xk), x2: X(xk), y1: m.t + ph, y2: m.t + ph + 4, stroke: cAxis }));
      svg.appendChild(el("text", { x: X(xk), y: m.t + ph + 17, "text-anchor": "middle", "font-size": 11, fill: cInk2, "font-family": css("--font-mono") }, fmt(xk, 0)));
    }
    svg.appendChild(el("line", { x1: m.l, x2: m.l + pw, y1: m.t + ph, y2: m.t + ph, stroke: cAxis }));
    svg.appendChild(el("text", { x: m.l + pw / 2, y: H - 8, "text-anchor": "middle", "font-size": 12, fill: cInk2 }, t("r.wildfire.chart.x")));
    svg.appendChild(el("text", { x: 14, y: m.t + ph / 2, "text-anchor": "middle", "font-size": 12, fill: cInk2, transform: "rotate(-90 14 " + (m.t + ph / 2) + ")" }, t("r.wildfire.chart.y")));

    // delivered step function
    var pts = [], prev = null;
    for (var d2 = 0; d2 <= XMAX; d2 += 0.25) {
      var L = drops(d2, state.dfw, state.w) * Q;
      if (prev !== null && L !== prev) pts.push(X(d2).toFixed(1) + "," + Y(prev).toFixed(1));
      pts.push(X(d2).toFixed(1) + "," + Y(L).toFixed(1));
      prev = L;
    }
    svg.appendChild(el("polyline", { points: pts.join(" "), fill: "none", stroke: cBlue, "stroke-width": 2, "stroke-linejoin": "miter" }));

    // required curve (clipped at the top)
    var rp = [];
    for (var d3 = 0; d3 <= XMAX; d3 += 2) {
      var R = required(d3);
      if (R > ymax) { rp.push(X(d3).toFixed(1) + "," + Y(ymax).toFixed(1)); break; }
      rp.push(X(d3).toFixed(1) + "," + Y(R).toFixed(1));
    }
    svg.appendChild(el("polyline", { points: rp.join(" "), fill: "none", stroke: cAcc, "stroke-width": 2, "stroke-dasharray": "6 4" }));

    // current setting marker
    var cx = X(state.dbf);
    svg.appendChild(el("line", { x1: cx, x2: cx, y1: m.t, y2: m.t + ph, stroke: cMuted, "stroke-width": 1, "stroke-dasharray": "2 3" }));
    svg.appendChild(el("circle", { cx: cx, cy: Y(delivNow), r: 5, fill: cBlue, stroke: css("--surface"), "stroke-width": 1.5 }));
    svg.appendChild(el("circle", { cx: cx, cy: Y(reqNow), r: 5, fill: cAcc, stroke: css("--surface"), "stroke-width": 1.5 }));
    var lblRight = cx < m.l + pw * 0.7;

      "font-size": 11.5, "font-weight": 600, fill: cInk

    var lg = document.getElementById("cyc-legend");

    legendItem(lg, cBlue, t("r.wildfire.chart.deliv"));
    legendItem(lg, cAcc, t("r.wildfire.chart.req"), true);
    legendItem(lg, cReg, t("r.wildfire.chart.ok"));

  function drawSchematic(tb, cycH, n) {

    col = {
      c: c, dark: surfL < inkL,
      bright: hexRgb(c["mit-bright"]), silver: hexRgb(c["mit-silver"]), acc: hexRgb(c.accent), inkRgb: ink,
      core: inkL > surfL ? c.ink : c.surface

    return col;
  }
  function rgba(rgb, a) { return "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + "," + a + ")"; }

  /* ---- drawing helpers ---- */
  function pathPts(pts, closed) {
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var X = SX(pts[i][0]), Y = SY(pts[i][1]);
      if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
    }
    if (closed) ctx.closePath();
  }
  function label(txt, X, Y, align, color, alpha, font) {
    if (alpha <= 0.01) return;
    ctx.globalAlpha = alpha;
    ctx.font = font || FONT_S;
    ctx.textAlign = align;
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = col.c.surface;
    ctx.strokeText(txt, X, Y);
    ctx.fillStyle = color;
    ctx.fillText(txt, X, Y);
    ctx.globalAlpha = 1;
  }
  function circle(X, Y, r) { ctx.beginPath(); ctx.arc(X, Y, Math.max(0, r), 0, TAU); }

  var ST = { fireApp: 0, baseApp: 0, waterApp: 0, baseLeft: 0, waterLeft: 0 };
  // point cloud with staggered fade in (a) and fade out (v); returns [appeared, still present]
  function drawCloud(set, t, fill, size, mul, skipFixed) {
    var hs = size / 2, app = 0, left = 0, i, a, X, Y;
    ctx.fillStyle = fill;
    ctx.globalAlpha = mul;
    ctx.beginPath();
    for (i = 0; i < set.n; i++) {
      if (set.a[i] <= t) app++;
      if (set.v[i] > t) left++;
      if (i < skipFixed) continue;
      a = seg(t, set.a[i], set.a[i] + 0.5) * (1 - seg(t, set.v[i], set.v[i] + 0.4));
      if (a >= 1) ctx.rect(SX(set.x[i]) - hs, SY(set.y[i]) - hs, size, size);
    }
    ctx.fill();
    for (i = skipFixed; i < set.n; i++) {
      a = seg(t, set.a[i], set.a[i] + 0.5) * (1 - seg(t, set.v[i], set.v[i] + 0.4));
      if (a <= 0 || a >= 1) continue;
      X = SX(set.x[i]); Y = SY(set.y[i]);
      var s = size * (0.4 + 0.6 * a) + (1 - a) * size * 0.8;
      ctx.globalAlpha = a * mul;
      ctx.fillRect(X - s / 2, Y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
    ST.app = app; ST.left = left;
  }

  function drawHeli(X, Y, ang, s, t, alpha, seed) {
    if (alpha <= 0 || s <= 0) return;
    var c = col.c;
    ctx.save();
    ctx.translate(X, Y);
    ctx.rotate(ang);
    ctx.scale(s, s);
    ctx.globalAlpha = alpha * 0.16;
    ctx.fillStyle = c.ink;
    circle(0.5, 0, 10.5); ctx.fill();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = c.ink;
    ctx.lineWidth = 1.7;
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(-12, 0); ctx.stroke();
    ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(-12, -3); ctx.lineTo(-12, 3); ctx.stroke();
    ctx.fillStyle = c.ink;
    ctx.beginPath(); ctx.ellipse(1, 0, 5.6, 3.3, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = c.accent;
    ctx.beginPath(); ctx.ellipse(3.6, 0, 1.9, 1.6, 0, 0, TAU); ctx.fill();
    // spinning rotor
    var r = t * 38 + seed;
    ctx.strokeStyle = c.ink;
    ctx.lineWidth = 1.2;
    ctx.globalAlpha = alpha * 0.85;
    ctx.beginPath();
    ctx.moveTo(1 + Math.cos(r) * 10, Math.sin(r) * 10); ctx.lineTo(1 - Math.cos(r) * 10, -Math.sin(r) * 10);
    ctx.moveTo(1 + Math.cos(r + 1.57) * 10, Math.sin(r + 1.57) * 10); ctx.lineTo(1 - Math.cos(r + 1.57) * 10, -Math.sin(r + 1.57) * 10);
    ctx.stroke();
    ctx.restore();
  }

  function drawFlame(X, Y, r, inten, t, seed) {
    if (inten <= 0.01 || r <= 0) return;
    var g = ctx.createRadialGradient(X, Y, 0, X, Y, r * 3.4);
    var gl = col.dark ? 0.62 : 0.5;
    g.addColorStop(0, rgba(col.bright, gl * inten));
    g.addColorStop(0.35, rgba(col.bright, 0.2 * inten));
    g.addColorStop(1, rgba(col.bright, 0));
    ctx.fillStyle = g;
    circle(X, Y, r * 3.4); ctx.fill();
    ctx.fillStyle = col.c["mit-bright"];
    ctx.globalAlpha = Math.min(1, inten * 1.1);
    for (var i = 0; i < 5; i++) {
      var an = seed + i * 1.2566 + t * 0.9;
      var rr = r * (0.52 + 0.16 * Math.sin(t * 7.3 + i * 2.1 + seed));
      circle(X + Math.cos(an) * r * 0.36, Y + Math.sin(an) * r * 0.3 - r * 0.12, rr);
      ctx.fill();
    }
    ctx.fillStyle = col.core;
    ctx.globalAlpha = inten * 0.8;
    circle(X, Y - r * 0.05, r * 0.3 * (1 + 0.18 * Math.sin(t * 11 + seed))); ctx.fill();
    // embers
    ctx.fillStyle = col.c["mit-bright"];
    for (var e = 0; e < 10; e++) {
      var ph = t * 0.6 + e * 0.1 + seed * 0.13, p = ph - Math.floor(ph);
      var ex = X + Math.sin(e * 2.7 + seed + t * 1.4) * r * 0.9 * (0.4 + p);
      var ey = Y - r * 0.3 - p * r * 3.4;
      var es = 0.7 + 1.5 * (1 - p);
      ctx.globalAlpha = (1 - p) * inten * 0.9;
      ctx.fillRect(ex - es / 2, ey - es / 2, es, es);
    }
    ctx.globalAlpha = 1;
  }

  var tmp = { x: 0, y: 0, m: 0 }, tmp2 = { x: 0, y: 0, m: 0 };

  /* ---- the frame ---- */
  function render(t) {
    palette();
    var c = col.c, w = cv.w, h = cv.h, n = SCEN[state.bud].n;
    setCam(t);
    ctx.clearRect(0, 0, w, h);
    ctx.lineCap = "butt"; ctx.lineJoin = "round"; ctx.setLineDash([]);

    /* territory */
    var draw = ease.inOut(seg(t, 0.1, 2.5)), fillA = ease.out(seg(t, 0.9, 2.7));
    if (fillA > 0) {
      ctx.save();
      ctx.translate(0, 3);
      pathPts(OUTLINE, true);
      ctx.fillStyle = c.ink; ctx.globalAlpha = 0.05 * fillA; ctx.fill();
      ctx.restore();
      pathPts(OUTLINE, true);
      ctx.fillStyle = c.surface2; ctx.globalAlpha = fillA; ctx.fill();
      ctx.save();
      ctx.clip();
      // Magdalena valley to the west, a flat savanna in the middle, relief contours elsewhere
      var gx0 = SX(-95), gx1 = SX(-52);
      var gr = ctx.createLinearGradient(gx0, 0, gx1, 0);
      gr.addColorStop(0, rgba(col.silver, 0.26 * fillA)); gr.addColorStop(1, rgba(col.silver, 0));
      ctx.globalAlpha = 1; ctx.fillStyle = gr; ctx.fillRect(gx0, 0, gx1 - gx0, h);
      pathPts(SAVANNA, true);
      ctx.fillStyle = c.surface; ctx.globalAlpha = 0.4 * fillA; ctx.fill();
      var ca = ease.out(seg(t, 1.5, 3.6));
      if (ca > 0) {
        ctx.strokeStyle = c["mit-silver"]; ctx.lineWidth = 0.8;
        for (var ci = 0; ci < CONTOURS.length; ci++) {
          ctx.globalAlpha = ca * (0.22 + 0.06 * CONTOURS[ci].lvl);
          pathPts(CONTOURS[ci].pts, true); ctx.stroke();
        }
        pathPts(SAVANNA, true);
        ctx.setLineDash([2, 3]); ctx.globalAlpha = ca * 0.45; ctx.stroke(); ctx.setLineDash([]);
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }
    if (draw > 0) {
      pathPts(OUTLINE, true);
      ctx.strokeStyle = c.ink2; ctx.lineWidth = 1.4;
      if (draw < 1) ctx.setLineDash([outlineLen * camZ * draw, outlineLen * camZ + 10]);
      ctx.stroke(); ctx.setLineDash([]);
    }
    // Magdalena river
    var rv = ease.inOut(seg(t, 1.1, 3.2));
    if (rv > 0) {
      pathPts(RIVER, false);
      ctx.strokeStyle = c["mit-silver"]; ctx.lineWidth = 2.2; ctx.globalAlpha = 0.9;
      if (rv < 1) ctx.setLineDash([riverLen * camZ * rv, riverLen * camZ + 10]);
      ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    // Bogotá
    var bg = ease.back(seg(t, 1.8, 2.6));
    if (bg > 0) {
      ctx.save();
      ctx.translate(SX(0), SY(0)); ctx.scale(bg, bg); ctx.translate(-SX(0), -SY(0));
      pathPts(BOGBLOB, true);
      ctx.fillStyle = c["mit-silver"]; ctx.globalAlpha = 0.55; ctx.fill();
      ctx.restore(); ctx.globalAlpha = 1;
    }

    /* chapters 1 and 2: candidate sets */
    if (t < 18.5) {
      var fd = 1 - seg(t, 9, 10.4);
      if (t >= 2.4 && fd > 0) { drawCloud(FDUST, t, c["mit-bright"], 1.6, 0.55 * fd, 0); ST.fireApp = ST.app; }
      else ST.fireApp = t < 2.4 ? 0 : FDUST.n;
      if (t >= 5.5) {
        drawCloud(WDUST, t, c["mit-silver"], 1.5, 0.8, t > 13.6 ? 6 : 0);
        ST.waterApp = ST.app; ST.waterLeft = ST.left;
      } else ST.waterApp = 0;
      if (t >= 3.9) {
        drawCloud(BDUST, t, c.ink, 3.4 * us, 0.85, 1);
        ST.baseApp = ST.app; ST.baseLeft = ST.left;
      } else ST.baseApp = 0;
    }

    /* the plan: Cerritos base */
    var bx = SX(BASE.x), by = SY(BASE.y);
    var baseOn = ease.back(seg(t, 12.2, 12.9));
    if (t >= 3.9 && t < 12.2) {
      var ba = seg(t, BDUST.a[0], BDUST.a[0] + 0.5);
      ctx.fillStyle = c.ink; ctx.globalAlpha = 0.85 * ba;
      ctx.fillRect(bx - 1.7 * us, by - 1.7 * us, 3.4 * us, 3.4 * us); ctx.globalAlpha = 1;
    }
    if (baseOn > 0) {
      var pp = ((t - 12.2) / 1.7) % 1;
      ctx.strokeStyle = c.accent; ctx.lineWidth = 1.6;
      ctx.globalAlpha = (1 - pp) * 0.7 * clamp(baseOn, 0, 1);
      circle(bx, by, 6 * us + pp * 18 * us); ctx.stroke();
      ctx.globalAlpha = 1;
      var bs = 10 * us * baseOn;
      ctx.fillStyle = c.accent;
      ctx.fillRect(bx - bs / 2, by - bs / 2, bs, bs);
      ctx.fillStyle = col.core; ctx.globalAlpha = 0.9;
      ctx.fillRect(bx - bs * 0.16, by - bs * 0.16, bs * 0.32, bs * 0.32);
      ctx.globalAlpha = 1;
    }
    // 79 km to Bogotá
    var dl = ease.inOut(seg(t, 15.2, 16.6)) * (1 - seg(t, 18.2, 19.4));
    if (dl > 0) {
      var ex0 = bx + 9 * us, ey0 = by, ex1 = SX(-9), ey1 = SY(0);
      ctx.strokeStyle = c.accent; ctx.lineWidth = 1.4; ctx.setLineDash([4, 4]);
      ctx.globalAlpha = Math.min(1, dl * 1.5);
      ctx.beginPath(); ctx.moveTo(ex0, ey0); ctx.lineTo(lerp(ex0, ex1, Math.min(1, dl * 1.4)), lerp(ey0, ey1, Math.min(1, dl * 1.4))); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
      label(tr("r.wildfire.unit.km", { v: fmt(79) }), (ex0 + ex1) / 2, (ey0 + ey1) / 2 - 11, "center", c.accent, seg(dl, 0.6, 1), FONT_B);
    }

    /* people (chapter 3 on); exposed when inside an escaped fire's halo */
    var popA = ease.out(seg(t, 17.6, 19.2));
    if (popA > 0) {
      var ps = 1.8 * Math.max(1, Math.sqrt(camZ) * us), hp = ps / 2;
      var esc = [];
      for (var fi = 0; fi < FIRES.length; fi++) if (t >= FIRES[fi].Te) esc.push(FIRES[fi]);
      ctx.fillStyle = c.ink2; ctx.globalAlpha = 0.5 * popA;
      ctx.beginPath();
      var exposed = [];
      for (var q = 0; q < POP.n; q++) {
        var px = POP.x[q], py = POP.y[q], hit = false;
        for (var e2 = 0; e2 < esc.length; e2++) {
          var hk = haloKm(esc[e2], t), ddx = px - esc[e2].x, ddy = py - esc[e2].y;
          if (ddx * ddx + ddy * ddy < hk * hk) { hit = true; break; }
        }
        if (hit) exposed.push(q); else ctx.rect(SX(px) - hp, SY(py) - hp, ps, ps);
      }
      ctx.fill();
      if (exposed.length) {
        ctx.fillStyle = c["mit-bright"]; ctx.globalAlpha = popA;
        ctx.beginPath();
        for (var x2 = 0; x2 < exposed.length; x2++) ctx.rect(SX(POP.x[exposed[x2]]) - hp - 0.3, SY(POP.y[exposed[x2]]) - hp - 0.3, ps + 0.6, ps + 0.6);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    /* water points of the plan */
    for (var wi = 0; wi < WATER.length; wi++) {
      var wp = WATER[wi], wa = ease.back(seg(t, 13.2 + wi * 0.3, 13.9 + wi * 0.3));
      if (wa <= 0) continue;
      var wx = SX(wp.x), wy = SY(wp.y), wr = 5.2 * us * Math.sqrt(camZ);
      var rp = ((t - 13.2 - wi * 0.4) / 2.6) % 1;
      ctx.strokeStyle = c.ink2; ctx.lineWidth = 1;
      ctx.globalAlpha = (1 - rp) * 0.45 * Math.min(1, wa);
      circle(wx, wy, wr + rp * 12 * us); ctx.stroke();
      ctx.globalAlpha = Math.min(1, wa);
      ctx.fillStyle = c.surface; circle(wx, wy, wr * wa); ctx.fill();
      ctx.lineWidth = 1.8; ctx.strokeStyle = c.ink2; ctx.stroke();
      ctx.fillStyle = c["mit-silver"]; circle(wx, wy, wr * 0.45 * wa); ctx.fill();
      ctx.globalAlpha = 1;
    }

    /* fires */
    var nCont = 0, nEsc = 0, fi2, f;
    // halos and scars under everything else
    for (fi2 = 0; fi2 < FIRES.length; fi2++) {
      f = FIRES[fi2];
      if (t < f.ign) continue;
      var X = SX(f.x), Y = SY(f.y);
      if (t >= f.Te) {
        nEsc++;
        var hr = haloKm(f, t) * camK;
        var hg = ctx.createRadialGradient(X, Y, 0, X, Y, hr);
        hg.addColorStop(0, rgba(col.bright, col.dark ? 0.3 : 0.24));
        hg.addColorStop(0.75, rgba(col.bright, col.dark ? 0.12 : 0.1));
        hg.addColorStop(1, rgba(col.bright, 0));
        ctx.fillStyle = hg; circle(X, Y, hr); ctx.fill();
        ctx.strokeStyle = c["mit-bright"]; ctx.lineWidth = 1.3; ctx.globalAlpha = 0.55;
        circle(X, Y, hr * 0.92); ctx.stroke();
        var pz = ((t - f.Te) / 1.8) % 1;
        ctx.globalAlpha = (1 - pz) * 0.5; ctx.lineWidth = 1;
        circle(X, Y, hr * (0.6 + 0.5 * pz)); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      if (t >= f.Tc) {
        nCont++;
        var sc = ease.out(seg(t, f.Tc, f.Tc + 0.8));
        ctx.fillStyle = c["mit-silver"]; ctx.globalAlpha = 0.6 * sc;
        circle(X, Y, (9 + 2 * f.rho) * us * Math.sqrt(camZ)); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
    // routes: base to fire once, then the fire to water shuttle loop
    for (var pi = 0; pi < plan.length; pi++) {
      var p = plan[pi];
      if (t < p.t0) continue;
      var pr = t < p.Ta ? ease.inOut((t - p.t0) / (p.Ta - p.t0)) : 1;
      ctx.strokeStyle = c.accent; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
      ctx.globalAlpha = t < p.Ta ? 0.85 : 0.35;
      ctx.beginPath();
      for (var s = 0; s <= 30; s++) {
        quad(p.park, p.c1, p.f, pr * s / 30, tmp);
        if (s) ctx.lineTo(SX(tmp.x), SY(tmp.y)); else ctx.moveTo(SX(tmp.x), SY(tmp.y));
      }
      ctx.stroke();
      if (t >= p.Ta) {
        ctx.strokeStyle = c.ink2; ctx.lineWidth = 1.1; ctx.setLineDash([2, 3]);
        ctx.globalAlpha = t < p.Tc + 0.5 ? 0.6 : 0.6 * (1 - 0.7 * seg(t, p.Tc + 0.5, p.Tc + 1.5));
        ctx.beginPath();
        for (var s2 = 0; s2 <= 24; s2++) { quad(p.f, p.cA, p.w, s2 / 24, tmp); if (s2) ctx.lineTo(SX(tmp.x), SY(tmp.y)); else ctx.moveTo(SX(tmp.x), SY(tmp.y)); }
        for (var s3 = 1; s3 <= 24; s3++) { quad(p.w, p.cB, p.f, s3 / 24, tmp); ctx.lineTo(SX(tmp.x), SY(tmp.y)); }
        ctx.stroke();
      }
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    // flames, ignition flashes, progress rings, checks
    for (fi2 = 0; fi2 < FIRES.length; fi2++) {
      f = FIRES[fi2];
      if (t < f.ign) continue;
      var FX = SX(f.x), FY = SY(f.y), zs = us * Math.sqrt(camZ);
      var grow = ease.out(seg(t, f.ign, f.ign + 9));
      var r = (3.5 + 4.5 * grow) * (0.85 + 0.12 * f.rho) * zs;
      var inten = ease.out(seg(t, f.ign, f.ign + 0.4));
      var fl = seg(t, f.ign, f.ign + 0.8);
      if (fl < 1) {
        ctx.strokeStyle = c["mit-bright"]; ctx.lineWidth = 2; ctx.globalAlpha = 1 - fl;
        circle(FX, FY, 4 + 26 * ease.out(fl)); ctx.stroke(); ctx.globalAlpha = 1;
      }
      if (t >= f.Te) {
        r *= 1 + 0.35 * ease.out(seg(t, f.Te, f.Te + 2));
        var ef = seg(t, f.Te, f.Te + 0.9);
        if (ef < 1) {
          ctx.strokeStyle = c["mit-bright"]; ctx.lineWidth = 2.5; ctx.globalAlpha = 1 - ef;
          circle(FX, FY, r + 40 * ease.out(ef) * zs); ctx.stroke(); ctx.globalAlpha = 1;
        }
      }
      var pl = f.plan;
      if (pl && t >= pl.Ta) {
        var rf = ringFrac(pl, t);
        inten *= 1 - 0.75 * rf;
        r *= 1 - 0.35 * rf;
        inten *= 1 - seg(t, pl.Tc, pl.Tc + 0.7);
        // liters delivered against the requirement
        var ringA = 1 - seg(t, pl.Tc + 0.6, pl.Tc + 1.4), rr0 = 16 * zs;
        if (ringA > 0) {
          ctx.lineWidth = 3; ctx.globalAlpha = ringA;
          ctx.strokeStyle = c.grid; circle(FX, FY, rr0); ctx.stroke();
          ctx.strokeStyle = c.accent;
          ctx.beginPath(); ctx.arc(FX, FY, rr0, -Math.PI / 2, -Math.PI / 2 + TAU * rf); ctx.stroke();
          ctx.globalAlpha = 1;
        }
        // splash of the latest drop
        var dd = dropsDone(pl, t);
        if (dd > 0 && t < pl.Tc + 0.6) {
          var td = pl.Ta + (dd - 1) * pl.L, su = seg(t, td, td + 0.6);
          if (su < 1) {
            ctx.fillStyle = c.ink2;
            for (var k2 = 0; k2 < 12; k2++) {
              var an2 = k2 / 12 * TAU + dd, rad = (3 + 15 * ease.out(su)) * zs;
              ctx.globalAlpha = (1 - su) * 0.9;
              ctx.fillRect(FX + Math.cos(an2) * rad - 1, FY + Math.sin(an2) * rad - 1, 2, 2);
            }
            ctx.strokeStyle = c.ink2; ctx.lineWidth = 1.2; ctx.globalAlpha = (1 - su) * 0.6;
            circle(FX, FY, (4 + 12 * ease.out(su)) * zs); ctx.stroke();
            ctx.globalAlpha = 1;
          }
        }
      }
      drawFlame(FX, FY, r, inten, t, f.seed);
      if (t >= f.Tc) {
        var ck = ease.back(seg(t, f.Tc + 0.3, f.Tc + 0.9));
        if (ck > 0) {
          ctx.save();
          ctx.translate(FX, FY); ctx.scale(ck * zs, ck * zs);
          ctx.strokeStyle = c.ink; ctx.lineWidth = 2.4; ctx.lineCap = "round";
          ctx.beginPath(); ctx.moveTo(-4.5, 0.5); ctx.lineTo(-1.2, 3.8); ctx.lineTo(5, -3.6); ctx.stroke();
          ctx.restore();
        }
        var fk = seg(t, f.Tc, f.Tc + 1);
        if (fk < 1) {
          ctx.strokeStyle = c.accent; ctx.lineWidth = 2; ctx.globalAlpha = 1 - fk;
          circle(FX, FY, (10 + 24 * ease.out(fk)) * zs); ctx.stroke(); ctx.globalAlpha = 1;
        }
      }
    }
    // refill ripples at the water point
    for (pi = 0; pi < plan.length; pi++) {
      var p2 = plan[pi];
      if (t < p2.Ta || t > p2.Tc) continue;
      var jj = Math.floor((t - p2.Ta) / p2.L), tRef = p2.Ta + jj * p2.L + p2.L / 2, ru = seg(t, tRef, tRef + 0.7);
      if (t >= tRef && ru < 1) {
        ctx.strokeStyle = c.ink; ctx.lineWidth = 1.5; ctx.globalAlpha = (1 - ru) * 0.8;
        circle(SX(p2.w.x), SY(p2.w.y), (6 + 14 * ease.out(ru)) * us); ctx.stroke(); ctx.globalAlpha = 1;
      }
    }

    /* Firehawks and their trails */
    for (pi = 0; pi < plan.length; pi++) {
      var p3 = plan[pi], app2 = ease.back(seg(t, 14.4 + 0.2 * pi, 15 + 0.2 * pi));
      if (app2 <= 0) continue;
      posAt(p3, t, tmp);
      var HX = SX(tmp.x), HY = SY(tmp.y);
      var moving = tmp.m === 1 || tmp.m === 2 || tmp.m === 4;
      if (moving) {
        var lx = HX, ly = HY;
        ctx.strokeStyle = c.accent; ctx.lineCap = "round";
        for (var k3 = 1; k3 <= 16; k3++) {
          posAt(p3, t - k3 * 0.03, tmp2);
          var qx = SX(tmp2.x), qy = SY(tmp2.y);
          ctx.globalAlpha = 0.75 * (1 - k3 / 17);
          ctx.lineWidth = 3 * (1 - k3 / 18);
          ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(qx, qy); ctx.stroke();
          lx = qx; ly = qy;
        }
        ctx.globalAlpha = 1; ctx.lineCap = "butt";
      }
      posAt(p3, t - 0.05, tmp2);
      var ang = 0, vx = SX(tmp.x) - SX(tmp2.x), vy = SY(tmp.y) - SY(tmp2.y);
      if (moving && vx * vx + vy * vy > 0.01) ang = Math.atan2(vy, vx);
      else if (tmp.m === 3) ang = Math.sin(t * 1.5) * 0.3;
      var lift = tmp.m === 0 || tmp.m === 5 ? 1 : 1.12;
      drawHeli(HX, HY, ang, 0.95 * us * lift * Math.min(1.25, Math.sqrt(camZ)) * app2, t, 1, pi * 2);
    }

    /* scene labels */
    var la = ease.out(seg(t, 2.2, 3)), dim = (1 - 0.35 * seg(t, 18, 20)) * (tallyK ? 1 - seg(t, 43.6, 44.6) : 1);
    label(tr(P + "l.bogota"), SX(9), SY(4), "left", c.ink, la, FONT);
    if (la > 0) {
      ctx.save();
      ctx.translate(SX(-101), SY(-12)); ctx.rotate(-Math.PI / 2 + 0.08);
      label(tr(P + "l.magdalena"), 0, 0, "center", c.muted, ease.out(seg(t, 2.8, 3.6)) * dim, FONT_S);
      ctx.restore();
    }
    label(tr(P + "l.cerritos"), bx, by + 16 * us, "center", c.accent, ease.out(seg(t, 12.5, 13.2)), FONT_B);
    for (wi = 0; wi < WATER.length; wi++) {
      var wq = WATER[wi], wl = ease.out(seg(t, 13.6 + wi * 0.3, 14.2 + wi * 0.3));
      label(tr(P + "l." + wq.key), SX(wq.x) + wq.dx * us, SY(wq.y) + wq.dy * us, wq.al, c.ink2, wl * dim, FONT_S);
    }

    /* the tally: objective per budget */
    drawPanel(t);

    /* counters */
    var sc2 = SCEN[state.bud];
    if (t < 9) {
      setChip(0, fmt(ST.fireApp), tr(P + "k.events"), ease.out(seg(t, 2.3, 2.8)), false);
      setChip(1, fmt(ST.baseApp), tr(P + "k.bases"), ease.out(seg(t, 3.8, 4.3)), false);
      setChip(2, fmt(ST.waterApp), tr(P + "k.water"), ease.out(seg(t, 5.4, 5.9)), false);
    } else if (t < 18) {
      setChip(0, fmt(Math.max(1, ST.baseLeft)), tr(P + "k.opened"), 1, false);
      setChip(1, fmt(Math.max(6, ST.waterLeft)), tr(P + "k.used"), 1, false);
      setChip(2, fmt(n), tr(P + "k.air"), ease.out(seg(t, 14.2, 14.7)), false);
    } else if (t < 43.4) {
      setChip(0, fmt(n), tr(P + "k.air"), 1, false);
      setChip(1, fmt(nCont), tr(P + "k.cont"), 1, false);
      setChip(2, fmt(nEsc), tr(P + "k.esc"), 1, false);
    } else {
      var ou = ease.out(seg(t, 44, 47.5)), done = ou >= 1;
      var ov = (sc2.approx ? "≈ " : "") + (done ? fmt(sc2.obj, sc2.obj % 1 ? 2 : 0) : fmt(Math.round(sc2.obj * ou)));
      setChip(0, fmt(nCont), tr(P + "k.cont"), 1, false);
      setChip(1, fmt(nEsc), tr(P + "k.esc"), 1, false);
      setChip(2, ov, tr(P + "k.obj"), 1, true);
    }
  }

  function drawPanel(t) {
    var u = ease.out(seg(t, 44.2, 45.4));
    if (u <= 0 || !panel) return;
    var c = col.c, p = panel, compact = p.overlay, rowH = compact ? 30 : 44, ph = 24 + rowH * 3;
    ctx.save();
    ctx.globalAlpha = u;
    ctx.translate(0, (1 - u) * 12);
    if (compact) {
      ctx.fillStyle = c.surface2;
      ctx.fillRect(p.x - 8, p.y - 8, p.w + 16, ph + 4);
      ctx.strokeStyle = c.border; ctx.lineWidth = 1;
      ctx.strokeRect(p.x - 8.5, p.y - 8.5, p.w + 17, ph + 5);
    }
    ctx.font = FONT_S; ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.fillStyle = c.muted;
    ctx.fillText(tr(P + "k.obj"), p.x, p.y + 5);
    var maxObj = SCEN[150].obj;
    for (var i = 0; i < BUDS.length; i++) {
      var b = BUDS[i], s = SCEN[b], on = b === state.bud, y = p.y + 22 + i * rowH;
      var g = ease.out(seg(t, 44.8 + i * 0.35, 46.4 + i * 0.35));
      for (var j = 0; j < s.n; j++) drawHeli(p.x + 8 + j * 16, y + 5, 0, 0.58, t, (on ? 1 : 0.55) * u, j + i);
      ctx.globalAlpha = u;
      ctx.font = on ? FONT_B : FONT_S; ctx.textAlign = "left"; ctx.fillStyle = on ? c.ink : c.muted;
      ctx.fillText(tr("r.wildfire.bud.opt", { b: fmt(b) }), p.x + 6 + 3 * 16, y + 5);
      ctx.textAlign = "right";
      var val = (s.approx ? "≈ " : "") + (g >= 1 ? fmt(s.obj, s.obj % 1 ? 2 : 0) : fmt(Math.round(s.obj * g)));
      ctx.fillText(val, p.x + p.w, y + 5);
      var chg = s.chg ? tr(P + "better", { p: fmt(s.chg) }) : tr("r.wildfire.bud.base");
      var barY = compact ? y + 13 : y + 15, barH = compact ? 5 : 7;
      ctx.fillStyle = c.grid; ctx.fillRect(p.x, barY, p.w, barH);
      ctx.fillStyle = on ? c.accent : c["mit-silver"]; ctx.fillRect(p.x, barY, p.w * (s.obj / maxObj) * g, barH);
      ctx.font = FONT_S; ctx.fillStyle = on ? c["accent-text"] : c.muted;
      ctx.globalAlpha = u * g;
      if (compact) {
        var vw = ctx.measureText(val).width;
        ctx.fillText(chg + "  ·", p.x + p.w - vw - 6, y + 5);
      } else ctx.fillText(chg, p.x + p.w, y + 32);
      ctx.globalAlpha = u;
    }
    ctx.restore();
  }

  computePlan();
  layout();
  var player = A.create({
    root: root,
    duration: 54,
    chapters: [
      { t: 0, key: P + "ch1" }, { t: 9, key: P + "ch2" }, { t: 18, key: P + "ch3" },
      { t: 25, key: P + "ch4" }, { t: 43, key: P + "ch5" }
    ],
    onResize: function () { cv.fit(); layout(); },
    render: render
  });

  /* scenario control: 150 / 225 / 300 G COP (1 / 2 / 3 Firehawks) */
  var segEl = document.getElementById("wf-anim-seg");
  segEl.querySelectorAll("button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.bud = +btn.dataset.bud;
      segEl.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(b === btn)); });
      computePlan();
      layout();
      if (player.time > 18) { player.seek(21); player.play(); } else player.refresh();
    });
  });
})();
</script>
</body>
</html>
