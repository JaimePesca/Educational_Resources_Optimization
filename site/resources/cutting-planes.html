<style>

  .layout { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 880px) { .layout, .brief { grid-template-columns: minmax(0, 1fr); } }
  .stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

  svg.plot { display: block; width: 100%; height: auto; max-height: 500px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 12.5px; color: var(--ink2); }

  .sw { width: 14px; height: 3px; border-radius: 2px; flex: none; }
  .sw.area { width: 13px; height: 13px; border-radius: 2px; }
  .sw.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
  .sw.ring { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--accent); background: transparent; }
  .sw.dash { background: repeating-linear-gradient(90deg, var(--good) 0 5px, transparent 5px 8px); }
  .sw.dash2 { background: repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 7px); }
  .chk { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13.5px; color: var(--ink2); cursor: pointer; }
  .chk input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }

  .crow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button.btn {
    font: 600 14px var(--font-sans); border-radius: 3px; padding: 9px 14px; cursor: pointer;
    background: transparent; color: var(--ink2); border: 1.5px solid var(--border);
  }
  button.btn:hover { background: var(--surface2); }
  button.btn.primary { background: var(--accent); color: var(--on-solid); border-color: var(--accent); }

  button.btn.ghost { color: var(--accent-text); border-color: var(--accent-text); }
  button.btn:disabled { opacity: 0.45; cursor: default; filter: none; }

  .speed select {

    border: 1px solid var(--border); border-radius: 3px; padding: 6px 8px;
  }

  .tile .tl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

  table.tab th.rhs, table.tab td.rhs { border-left: 1px solid var(--axis); }

  table.tab tr.src td { background: var(--sel); }
  table.tab tr.src td:first-child { border-left-color: var(--accent); }
  table.tab td.fr { color: var(--accent-text); font-weight: 600; }
  table.tab td.ok { color: var(--good-text); font-weight: 600; }

  .ctl label { font-size: 13.5px; color: var(--ink2); overflow-wrap: anywhere; }

    });
    if (subs.length) { L.push(t("cut.dv.sub")); L.push.apply(L, subs); X.push(texT(t("cut.dv.sub"))); X.push.apply(X, subsT); }
    L.push(t("cut.dv.inx"), "  " + ineq(c.al, c.ga));
    X.push(t("cut.dv.inx.tex"), m(ineqT(c.al, c.ga)));
    if (c.lam.cmp(Z(1))) {
      L.push("  × " + c.lam.str() + ":  " + ineq(c.A, c.B));
      X.push(m("\\times " + frT(c.lam) + ":\\quad " + ineqT(c.A, c.B)));
    }
    return out();
  }

  function narr(P, st) {
    var k = st.k, r = P.R[k], v = { x1: r.x[0].str(), x2: r.x[1].str(), z: r.z.str(), piv: r.piv, k: k };
    if (st.t === "lp") {
      if (r.done) {
        var same = Math.abs(area(P.polys[k]) - P.hullArea) < 1e-9;
        return t("cut.n.done", v) + " " + t(same ? "cut.n.hullEq" : "cut.n.hullNe");
      }
      if (!k) return t("cut.n.lp0", v);
      v.zold = P.R[k - 1].z.str();
      return t("cut.n.lp", v) + " " + t("cut.n.again");
    }
    var c = r.cut;
    v.v = vname(c.bv); v.val = c.rhs.str(); v.f0 = c.f0.str();
    if (st.t === "row") return t("cut.n.row", v);
    var gco = [], gnm = [];
    c.terms.forEach(function (tm) { if (tm.f.sgn()) { gco.push(tm.f); gnm.push(vname(tm.j)); } });
    v.cut = lin(gco, gnm) + " ≥ " + c.f0.str();
    if (st.t === "cut") return t("cut.n.cut", v);
    v.xcut = ineq(c.A, c.B);
    v.a = I18N.fmt(area(P.polys[k]) - area(P.polys[k + 1]), 2);
    return t("cut.n.x", v);
  }

  function renderTable(P, st) {
    var r = P.R[st.k], T = r.T, src = st.t !== "lp" && r.cut ? r.cut.row : -1, h = "<thead><tr><th>" + t("cut.tab.basis") + "</th>";
    for (var j = 0; j < T.nc; j++) h += "<th>" + vname(j) + "</th>";
    h += '<th class="rhs">b̄</th></tr></thead><tbody>';
    var rowH = function (lbl, R, cls, rc) {
      var s = '<tr class="' + cls + '"><td>' + lbl + "</td>";
      R.a.forEach(function (v) { s += "<td>" + v.str() + "</td>"; });
      return s + '<td class="rhs ' + rc + '">' + R.rhs.str() + "</td></tr>";
    };
    h += rowH("z", T.z, "zrow", "");
    T.rows.forEach(function (R, i) {
      h += rowH(vname(R.bv), R, i === src ? "src" : "", R.rhs.isInt() ? (R.bv < 2 && r.done ? "ok" : "") : "fr");
    });
    $("tab").innerHTML = h + "</tbody>";
    var d = [];
    for (j = 2; j < T.nc; j++) d.push(vname(j) + " = " + aff(T.expr[j]) + "  (" + (j < 4 ? nm(P, "r" + (j - 1)) : t("cut.tab.cut", { k: j - 3 })) + ")");
    $("defs").innerHTML = d.join("<br>");
  }

  function renderA() {
    var P = cur(), st = P.steps[step], r = P.R[st.k], fin = st.t === "lp" && r.done;
    drawA();
    var ncut = st.t === "x" ? st.k + 1 : st.k;
    $("tcuts").textContent = ncut;
    $("tlp").textContent = r.z.str();
    $("tlps").textContent = approx(r.z) || " ";
    $("tip").textContent = P.zip;
    $("tarea").textContent = I18N.fmt(area(P.polys[ncut]), 2);
    $("tareas").textContent = t("cut.tile.hullA", { a: I18N.fmt(P.hullArea, 2) });
    $("explain").className = "card explain" + (fin ? " final" : "");
    $("exiter").textContent = t("cut.stepOf", { i: step + 1, n: P.steps.length }) + " · " +
      (st.t === "lp" ? (st.k ? t("cut.afterCut", { k: st.k }) : t("cut.start")) : t("cut.cutN", { k: st.k + 1 }));
    $("extitle").textContent = t("cut.h." + (fin ? "done" : st.t === "lp" ? (st.k ? "lp" : "lp0") : st.t));
    $("exbody").innerHTML = narr(P, st);
    var dv = derivText(P, st);
    TeX.set($("deriv"), dv[0], dv[1]);
    renderTable(P, st);
    $("back").disabled = step === 0;
    $("step").disabled = step >= P.steps.length - 1;
    $("play").textContent = playing ? "❚❚ " + t("cut.btn.pause") : "▶ " + t("cut.btn.play");
    persist();
  }

  function stopAnim() { if (raf) { cancelAnimationFrame(raf); raf = null; } prog = 1; }
  function go(i, animate) {
    var P = cur();
    stopAnim();
    step = Math.max(0, Math.min(P.steps.length - 1, i));
    if (animate && P.steps[step].t === "x" && !reduced()) {
      var t0 = performance.now(), dur = 1100 / +$("speed").value;
      prog = 0;
      var f = function (now) {
        prog = Math.min(1, (now - t0) / dur);
        drawA();
        raf = prog < 1 ? requestAnimationFrame(f) : null;
      };
      raf = requestAnimationFrame(f);
    }
    renderA();
  }
  function setPlay(on) {
    playing = on;
    clearTimeout(timer);
    if (on) tick(true); else renderA();
  }
  function tick(first) {
    if (!playing) return;
    var P = cur();
    if (!first || step >= P.steps.length - 1) {
      if (step >= P.steps.length - 1) { if (first) go(0, false); else { setPlay(false); return; } }
      else go(step + 1, true);
    } else go(step + 1, true);
    timer = setTimeout(tick, (P.steps[step].t === "x" ? 2700 : 2000) / +$("speed").value);
  }

  // ---- part B ----
  function cgNow(P) {
    var u1 = U[uIdx[0]], u2 = U[uIdx[1]];
    var comb = [0, 1].map(function (j) { return u1.mul(Z(P.A[0][j])).add(u2.mul(Z(P.A[1][j]))); });
    var cb = u1.mul(Z(P.b[0])).add(u2.mul(Z(P.b[1])));
    var a = comb.map(function (v) { return v.floor().val(); }), b = cb.floor().val();
    return { u1: u1, u2: u2, comb: comb, cb: cb, a: a, b: b, triv: !a[0] && !a[1] };
  }
  function renderB() {
    var P = cur(), g = cgNow(P), x0 = P.R[0].x, A0 = area(P.polys[0]);
    $("u1").value = uIdx[0]; $("u2").value = uIdx[1];
    $("u1o").textContent = g.u1.str(); $("u2o").textContent = g.u2.str();
    $("u1l").textContent = "u₁ · " + nm(P, "r1");
    $("u2l").textContent = "u₂ · " + nm(P, "r2");
    TeX.set($("cgsteps"), alignedT([
      "& " + frT(g.u1) + "\\cdot(" + ineqT(P.A[0], P.b[0]) + ")",
      "+\\;& " + frT(g.u2) + "\\cdot(" + ineqT(P.A[1], P.b[1]) + ")",
      "=\\;& {" + ineqT(g.comb, g.cb) + "} && " + texT("(" + t("cut.b.comb") + ")"),
      "\\lfloor\\,\\rfloor\\;& {" + ineqT(g.a, g.b) + "} && " + texT("(" + t("cut.b.round") + ")")]), [
      "  " + g.u1.str() + " · (" + ineq(P.A[0], P.b[0]) + ")",
      "+ " + g.u2.str() + " · (" + ineq(P.A[1], P.b[1]) + ")",
      "= " + ineq(g.comb, g.cb) + "   (" + t("cut.b.comb") + ")",
      "⌊⌋ " + ineq(g.a, g.b) + "   (" + t("cut.b.round") + ")"].join("\n"));
    var lines = origLines(P), rem = 0, cuts = false, poly = P.polys[0], sliver = null;
    var li = function (ic, cls, html) { return '<li><span class="ic ' + cls + '" aria-hidden="true">' + ic + "</span><span>" + html + "</span></li>"; };
    var h = li("✓", "y", t("cut.b.valid"));
    if (g.triv) h += li("·", "i", t("cut.b.trivial"));
    else {
      if (g.comb[0].sgn() || g.comb[1].sgn())
        lines.push({ a: g.comb[0].val(), b: g.comb[1].val(), c: g.cb.val(), col: css("--muted"), w: 1.6, dash: "5 4" });
      lines.push({ a: g.a[0], b: g.a[1], c: g.b, col: css("--c-violet"), w: 2.6, lab: t("cut.b.lgCut"),
        at: chordMid(P.polys[0], g.a[0], g.a[1], g.b) || (function () { var s = boxSeg(P, g.a[0], g.a[1], g.b); return s && [(s[0][0] + s[1][0]) / 2, (s[0][1] + s[1][1]) / 2]; })() });
      poly = clip(P.polys[0], g.a[0], g.a[1], g.b);
      rem = A0 - area(poly);
      if (rem > 1e-9) sliver = clip(P.polys[0], -g.a[0], -g.a[1], -g.b);
      var lhs = x0[0].mul(Z(g.a[0])).add(x0[1].mul(Z(g.a[1])));
      cuts = lhs.cmp(Z(g.b)) > 0;
      h += li(cuts ? "✓" : "✗", cuts ? "y" : "n", t(cuts ? "cut.b.cutsYes" : "cut.b.cutsNo", { p: pt(x0), lhs: lhs.str(), rhs: g.b }));
      h += li("▪", "i", rem > 1e-9 ? t("cut.b.area", { a: I18N.fmt(rem, 2), p: I18N.fmt(100 * rem / (A0 - P.hullArea), 0) }) : t("cut.b.areaNone"));
      var on = P.pts.filter(function (p) { return g.a[0] * p[0] + g.a[1] * p[1] === g.b; }).length;
      h += li("▪", "i", on >= 2 ? t("cut.b.facet", { n: on }) : on === 1 ? t("cut.b.touch1") : t("cut.b.touch0"));
      if (cuts) {
        var T = makeTab({ A: P.A.concat([g.a]), b: P.b.concat([g.b]), c: P.c });
        primal(T);
        h += li("▪", "i", t("cut.b.bound", { z: T.z.rhs.str(), z0: P.R[0].z.str() }));
      }
    }
    $("checks").innerHTML = h;
    $("gnote").textContent = t("cut.b.gnote", { u1: U[P.ug[0]].str(), u2: U[P.ug[1]].str(), cut: ineq(P.R[0].cut.A, P.R[0].cut.B) });
    plot($("plotB"), P, { poly: poly, sliver: sliver, lines: lines, hull: true,
      opt: { x: x0[0].val(), y: x0[1].val(), mode: cuts ? "cut" : "lp", lab: pt(x0) } });
    persist();
  }

  // ---- instance picker + brief ----
  function renderInst() {
    var P = cur(), box = $("insts");
    box.textContent = "";
    INST.forEach(function (Q, i) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "ibtn"; b.id = "inst-" + Q.id;
      b.setAttribute("aria-pressed", i === inst ? "true" : "false");
      b.textContent = t("cut.i." + Q.id + ".tab");
      b.addEventListener("click", function () { if (i !== inst) pick(i); });
      box.appendChild(b);
    });
    $("bname").textContent = nm(P, "tab");
    $("btext").textContent = nm(P, "brief");
    TeX.set($("model"), alignedT(["\\max\\;& z = " + linT(P.c, XT)].concat(
      P.A.map(function (a, i) { return (i ? "" : "\\text{ST}\\;") + "& {" + ineqT(a, P.b[i]) + "} && " + texT("(" + nm(P, "r" + (i + 1)) + ")"); }),
      ["& " + t("cut.model.int.tex")])),
      "max  z = " + lin(P.c, XN) + "\n" + t("ui.st") + " " +
      P.A.map(function (a, i) { return ineq(a, P.b[i]) + "   (" + nm(P, "r" + (i + 1)) + ")"; }).join("\n     ") +
      "\n     " + t("cut.model.int"));
  }
  function pick(i) {
    playing = false; clearTimeout(timer); stopAnim();
    inst = i; step = 0; uIdx = INST[i].u0.slice();
    renderAll();
  }
  function renderAll() { renderInst(); renderA(); renderB(); }

  // ---- controls ----
  $("step").addEventListener("click", function () { if (playing) setPlay(false); go(step + 1, true); });
  $("back").addEventListener("click", function () { if (playing) setPlay(false); go(step - 1, false); });
  $("restart").addEventListener("click", function () { playing = false; clearTimeout(timer); go(0, false); });
  $("play").addEventListener("click", function () { setPlay(!playing); });
  $("hull").addEventListener("change", function (e) { showHull = e.target.checked; drawA(); persist(); });
  ["u1", "u2"].forEach(function (id, i) {
    $(id).addEventListener("input", function (e) { uIdx[i] = +e.target.value; renderB(); });
  });
  $("gom").addEventListener("click", function () { uIdx = cur().ug.slice(); renderB(); });
  $("ureset").addEventListener("click", function () { uIdx = cur().u0.slice(); renderB(); });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { drawA(); renderB(); });

  // ---- hot state ----
  function persist() {
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
      try { window.claude.hot.snapshot({ inst: inst, step: step, u: uIdx, hull: showHull }); } catch (e) { /* ok */ }
    }
  }
  function start(d) {
    if (d && INST[d.inst]) {
      inst = d.inst;
      step = Math.max(0, Math.min(prep(INST[inst]).steps.length - 1, +d.step || 0));
      if (Array.isArray(d.u) && d.u.length === 2 && d.u.every(function (x) { return U[x]; })) uIdx = d.u.slice();
      else uIdx = INST[inst].u0.slice();
      showHull = !!d.hull;
    }
    $("hull").checked = showHull;
    I18N.onChange(renderAll);
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
</body>
</html>
