<script>
(function () {
  "use strict";
  var t = I18N.t;
  var MAXX = 15;

  // Days 0..6 = Mon..Sun. A nurse who starts on day d works d..d+4 (mod 7) and rests the next two.
  // Level 3 adds "split weekends <= k": starting Tue (works Sat, rests Sun) or Sun (rests Sat, works Sun).
  var LEVELS = [
    { dem: [4, 5, 6, 6, 6, 4, 4], draft: [2, 0, 2, 0, 0, 0, 2] },
    { dem: [5, 5, 5, 5, 7, 8, 7], draft: [2, 1, 1, 1, 1, 1, 1] },
    { dem: [9, 6, 8, 8, 5, 5, 8], draft: [2, 0, 1, 2, 0, 2, 3], split: 2 }
  ];
  var SPLIT = [0, 1, 0, 0, 0, 0, 1];

  function works(d, day) { return (day - d + 7) % 7 < 5; }
  function coverage(x) {
    var c = [0, 0, 0, 0, 0, 0, 0];
    for (var day = 0; day < 7; day++) for (var d = 0; d < 7; d++) if (works(d, day)) c[day] += x[d];
    return c;
  }
  function sum(a) { return a.reduce(function (s, v) { return s + v; }, 0); }
  function splitCount(x) { return x[1] + x[6]; }

  // rows {a, b} mean a·x >= b
  function buildRows(L, withRule) {
    var rows = [];
    for (var day = 0; day < 7; day++) {
      var a = []; for (var d = 0; d < 7; d++) a.push(works(d, day) ? 1 : 0);
      rows.push({ a: a, b: L.dem[day] });
    }
    if (withRule && L.split != null) rows.push({ a: SPLIT.map(function (v) { return -v; }), b: -L.split });
    return rows;
  }

  // ---- exact solvers ----
  // LP: min c·x s.t. rows, x >= 0, with c >= 0. Solved through its dual max b·y s.t. A^T y <= c, y >= 0,
  // whose origin is feasible (no phase 1). Dense tableau, Bland's rule against cycling.
  // At the end the primal solution is read from the reduced costs of the dual slacks.
  function lpSolve(rows, c) {
    var m = rows.length, n = c.length, W = m + n, i, j, k, EPS = 1e-9;
    var T = [];
    for (j = 0; j < n; j++) {
      var r = new Array(W + 1).fill(0);
      for (i = 0; i < m; i++) r[i] = rows[i].a[j];
      r[m + j] = 1; r[W] = c[j];
      T.push(r);
    }
    var z = new Array(W + 1).fill(0);
    for (i = 0; i < m; i++) z[i] = -rows[i].b;
    var basis = []; for (j = 0; j < n; j++) basis.push(m + j);
    for (var it = 0; it < 500; it++) {
      var e = -1;
      for (k = 0; k < W; k++) if (z[k] < -EPS) { e = k; break; }
      if (e < 0) break;
      var p = -1, best = Infinity;
      for (j = 0; j < n; j++) if (T[j][e] > EPS) {
        var q = T[j][W] / T[j][e];
        if (q < best - EPS || (Math.abs(q - best) <= EPS && basis[j] < basis[p])) { best = q; p = j; }
      }
      if (p < 0) return null; // dual unbounded: the primal is infeasible
      var pv = T[p][e];
      for (k = 0; k <= W; k++) T[p][k] /= pv;
      for (j = 0; j < n; j++) if (j !== p && Math.abs(T[j][e]) > EPS) {
        var f = T[j][e]; for (k = 0; k <= W; k++) T[j][k] -= f * T[p][k];
      }
      var fz = z[e]; for (k = 0; k <= W; k++) z[k] -= fz * T[p][k];
      basis[p] = e;
    }
    var x = []; for (j = 0; j < n; j++) x.push(snap(Math.max(0, z[m + j])));
    return { val: snap(z[W]), x: x };
  }
  function snap(v) { return Math.abs(v - Math.round(v)) < 1e-7 ? Math.round(v) : v; }

  // Integer optimum: depth-first branch and bound on that LP (integer objective, so ceil(LP) prunes)
  function ipSolve(rows, c) {
    var best = Infinity, bestX = null, nodes = 0;
    function rec(extra) {
      nodes++;
      var r = lpSolve(rows.concat(extra), c);
      if (!r || Math.ceil(r.val - 1e-6) >= best) return;
      var j = -1, fr = 1e-6;
      for (var i = 0; i < c.length; i++) {

      var up = c.map(function (v, i) { return i === j ? 1 : 0; });
      rec(extra.concat([{ a: up, b: Math.ceil(r.x[j]) }]));
      rec(extra.concat([{ a: up.map(function (v) { return -v; }), b: -Math.floor(r.x[j]) }]));
    }

  }

  var ONES = [1, 1, 1, 1, 1, 1, 1];
  var SOL = LEVELS.map(function (L) {
    var rows = buildRows(L, true);
    var lp = lpSolve(rows, ONES), ip = ipSolve(rows, ONES);
    var rnd = lp.x.map(function (v) { return Math.max(0, Math.ceil(v - 1e-7)); }); // max() also turns -0 into 0

    return { lp: lp, ip: ip, rnd: rnd, ip0: ip0 };
  });

  // ---- state ----
  var lv = 0, x = LEVELS[0].draft.slice(), phase = "pick", attempts = [0, 0, 0], starsBy = [null, null, null];
  var showingOpt = false;
  try {
    var saved = JSON.parse(localStorage.getItem("hs-stars") || "null");
    if (Array.isArray(saved)) starsBy = [0, 1, 2].map(function (i) { return typeof saved[i] === "number" ? saved[i] : null; });
  } catch (e) { /* private mode: play without records */ }

  var $ = function (id) { return document.getElementById(id); };

  function status(xx) {

    }
    var ruleOk = L().split == null || splitCount(xx) <= L().split;
    return { cov: cov, short: short, surplus: surplus, ruleOk: ruleOk, ok: !short.length && ruleOk };
  }

  // ---- SVG helpers ----
  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, txt) {

    return n;
  }
  function tip(node, text) { node.appendChild(el("title", {}, text)); return node; }
  function topRounded(x0, y0, w, h, r) { // bar with rounded data end (top), square at the baseline
    r = Math.max(0, Math.min(r, h, w / 2));
    return "M" + x0 + " " + (y0 + h) + "V" + (y0 + r) + "Q" + x0 + " " + y0 + " " + (x0 + r) + " " + y0 +
      "H" + (x0 + w - r) + "Q" + (x0 + w) + " " + y0 + " " + (x0 + w) + " " + (y0 + r) + "V" + (y0 + h) + "Z";
  }
  function boardWidth() { return Math.max(300, Math.round($("weekin").getBoundingClientRect().width)) || 640; }
  var MONO = "JetBrains Mono, monospace";

  // ---- coverage chart ----
  function renderCoverage(xx) {
    var svg = $("cov"), W = boardWidth(), cw = W / 7, top = 36, ph = 118, H = top + ph + 2;
    var st = status(xx), dem = L().dem;
    var yMax = Math.max(Math.max.apply(null, dem) + 1, Math.max.apply(null, st.cov), 1);
    var y = function (v) { return top + ph - v / yMax * ph; };
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.textContent = "";
    var good = css("--good"), crit = css("--crit");
    for (var d = 0; d < 7; d++) {
      var cx = d * cw, cov = st.cov[d], dm = dem[d];
      var g = el("g", {});
      if (d >= 5) g.appendChild(el("rect", { x: cx, y: top - 4, width: cw, height: ph + 4, fill: css("--surface2") }));
      var bw = Math.min(cw * 0.5, 44), bx = cx + (cw - bw) / 2;
      var baseTop = y(Math.min(cov, dm));
      if (Math.min(cov, dm) > 0) {
        g.appendChild(el("path", { d: topRounded(bx, baseTop, bw, y(0) - baseTop, cov > dm ? 0 : 4),
          fill: cov < dm ? crit : good }));
      }
      if (cov > dm) {
        var et = y(cov), eb = y(dm) - 2;
        if (eb - et > 0.5) g.appendChild(el("path", { d: topRounded(bx, et, bw, eb - et, 4), fill: good, "fill-opacity": 0.4 }));
      } else if (cov < dm) {
        g.appendChild(el("rect", { x: bx + 0.75, y: y(dm) + 0.75, width: bw - 1.5, height: y(cov) - y(dm) - 1.5, rx: 3,
          fill: "none", stroke: crit, "stroke-width": 1.4, "stroke-dasharray": "3 3" }));
      }
      g.appendChild(el("line", { x1: cx + cw * 0.1, x2: cx + cw * 0.9, y1: y(dm), y2: y(dm),
        stroke: css("--ink"), "stroke-width": 2, "stroke-linecap": "round" }));
      g.appendChild(el("text", { x: cx + cw / 2, y: 13, "text-anchor": "middle", fill: css("--ink"),
        "font-size": 11.5, "font-weight": 600, "font-family": MONO }, cov + "/" + dm));
      var sTxt = cov < dm ? "−" + (dm - cov) : cov > dm ? "+" + (cov - dm) : "✓";
      g.appendChild(el("text", { x: cx + cw / 2, y: 27, "text-anchor": "middle", "font-size": 11, "font-weight": 600,
        "font-family": MONO, fill: cov < dm ? crit : cov > dm ? css("--muted") : css("--good-text") }, sTxt));
      var det = cov < dm ? t("shift.cov.tipShort", { n: dm - cov }) : cov > dm ? t("shift.cov.tipExtra", { n: cov - dm }) : t("shift.cov.tipOk");
      tip(g.appendChild(el("rect", { x: cx, y: 0, width: cw, height: H, fill: "transparent" })),
        t("shift.cov.tip", { day: dl(d), cov: cov, dem: dm }) + " (" + det + ")");
      svg.appendChild(g);
    }
    svg.appendChild(el("line", { x1: 0, x2: W, y1: y(0) + 0.5, y2: y(0) + 0.5, stroke: css("--axis"), "stroke-width": 1 }));
  }

  // ---- roster (Gantt) chart ----
  function renderGantt(xx) {

    svg.textContent = "";

      if (d) svg.appendChild(el("line", { x1: d * cw, x2: d * cw, y1: 0, y2: H, stroke: css("--grid"), "stroke-width": 1 }));
    }

        "font-family": "Arimo, Helvetica, Arial, sans-serif" }, t("shift.gantt.empty")));

    var aqua = css("--c-aqua"), accent = css("--accent"), axis = css("--axis");

          if (split) { r.setAttribute("stroke", accent); r.setAttribute("stroke-width", 2); }

        tip(g, t("shift.gantt.tip", { n: idx, from: dl(d), to: dl((d + 4) % 7), r1: dl((d + 5) % 7), r2: dl((d + 6) % 7) }));

  }

  // ---- steppers ----
  function renderSteps(xx) {
    var host = $("steps"); host.textContent = "";

      var col = document.createElement("div"); col.className = "step";

      var plus = document.createElement("button"); plus.type = "button"; plus.id = "plus-" + d; plus.textContent = "+";

      out.setAttribute("aria-label", t("shift.aria.value", { day: dl(d) }));

      minus.addEventListener("click", function () { if (phase === "pick" && x[d] > 0) { x[d]--; renderBoard(); refocus("minus-" + d); } });

  function refocus(id) { var b = $(id); if (b && !b.disabled) b.focus(); else if (b) $((id.indexOf("plus") === 0 ? "minus-" : "plus-") + id.split("-")[1]).focus(); }

  // ---- board ----
  function renderBoard() {
    var n = lv + 1, xx = shown(), st = status(xx);

    var rb = $("rulebox");

    if (!rb.hidden) rb.innerHTML = t("shift.rule", { k: L().split, tue: dl(1), sun: dl(6), mon: dl(0),
      sunL: dl(6), fri: dl(4), sat: dl(5) });

    var c = $("counters"); c.textContent = "";

    } else if (!st.ruleOk) { msg.className = "msg bad"; msg.textContent = t("shift.msg.rule", { k: L().split, n: splitCount(xx) }); }

  function renderLevels() {

  function goLevel(i) { lv = i; x = LEVELS[i].draft.slice(); phase = "pick"; showingOpt = false; renderAll(); }

  // ---- result ----
  function barsRow(host, label, note, noteBad, value, max, color, lp) {

  function renderResult() {

    box.hidden = false;
    var s = S(), mine = sum(x), ip = s.ip.val, lp = s.lp.val, rndSum = sum(s.rnd);
    var diff = mine - ip;

    $("stars").setAttribute("aria-label", t("shift.starsAria", { n: stars }));
    $("stars").innerHTML = "★".repeat(stars) + '<span class="off">' + "★".repeat(3 - stars) + "</span>";

  // ---- model box: the 0/1 coverage matrix of the current level ----
  function renderModel() {
    var days = [0, 1, 2, 3, 4, 5, 6].map(dn);
    var pad = function (s, n) { s = String(s); while (s.length < n) s += " "; return s; };
    var lines = ["min  Σ x_d      (" + t("shift.model.obj") + ")", t("shift.model.st")];
    lines.push("  " + pad(t("shift.model.start"), 7) + " " + days.map(function (d) { return pad(d, 4); }).join(""));
    for (var r = 0; r < 7; r++) {
      var cells = [0, 1, 2, 3, 4, 5, 6].map(function (d) { return " " + (works(d, r) ? 1 : 0) + "  "; }).join("");
      lines.push("  " + pad(days[r], 7) + "[" + cells + "] · x  ≥  " + L().dem[r]);
    }
    if (L().split != null) {
      lines.push("  " + pad(t("shift.model.rule"), 7) + "[" + SPLIT.map(function (v) { return " " + v + "  "; }).join("") + "] · x  ≤  " + L().split);
    }
    lines.push("  " + t("shift.model.int"));
    // typeset version: the same 0/1 matrix as an array (start days in columns, days in rows)
    var tx = function (w) { return "\\text{" + w + "}"; };
    var row = function (label, coef, rel) { return tx(label) + " & " + coef.join(" & ") + " & " + rel; };
    var body = [0, 1, 2, 3, 4, 5, 6].map(function (q) {
      return row(days[q], [0, 1, 2, 3, 4, 5, 6].map(function (d) { return works(d, q) ? 1 : 0; }), "\\ge " + L().dem[q]);
    }).join(" \\\\ ");
    if (L().split != null) body += " \\\\ \\hline " + row(t("shift.model.rule"), SPLIT, "\\le " + L().split);
    var arr = "\\begin{array}{l|ccccccc|l}" + tx(t("shift.model.start")) + " & " + days.map(tx).join(" & ") +
      " & \\\\ \\hline " + body + "\\end{array}";
    TeX.set($("modelbox"), t("shift.model.tex", { coverage: arr }), lines.join("\n"));
  }

  function renderAll() { renderLevels(); renderLegend(); renderBoard(); renderResult(); }

  // ---- actions ----
  $("confirm").addEventListener("click", function () {

  });

  // redraw charts at their real width (text stays at its true size) and when the OS theme flips
  var lastW = 0, started = false;

  if (window.ResizeObserver) new ResizeObserver(onResize).observe($("weekin"));
  else window.addEventListener("resize", onResize);
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderAll);

  // ---- hot reload state (survives republish while the page is open) ----
  function persist() {
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
      try { window.claude.hot.snapshot({ lv: lv, x: x, phase: phase, attempts: attempts, showingOpt: showingOpt }); } catch (e) { /* ok */ }
    }
  }
  function start(data) {
    if (data && typeof data.lv === "number" && LEVELS[data.lv]) {
      lv = data.lv;
      if (Array.isArray(data.x) && data.x.length === 7) x = data.x.map(function (v) { return Math.max(0, Math.min(MAXX, v | 0)); });
      phase = data.phase === "done" && status(x).ok ? "done" : "pick";
      showingOpt = phase === "done" && !!data.showingOpt;
      if (Array.isArray(data.attempts)) attempts = data.attempts;
    }
    started = true;
    I18N.onChange(renderAll);
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) {
    window.claude.hot.ready(start);
  } else {
    start((window.claude && window.claude.hot && window.claude.hot.data) || {});
  }
})();
</script>
