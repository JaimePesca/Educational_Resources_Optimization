<style>
  .intro { font-size: 14.5px; color: var(--ink2); margin: 0 0 12px; max-width: 78ch; }
  .intro b { color: var(--ink); }

  /* ---- controls ---- */
  .abm-ctl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 26px; margin-bottom: 12px; }
  @media (max-width: 620px) { .abm-ctl { grid-template-columns: minmax(0, 1fr); } }
  .abm-btns { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 12px; }
  button.abm-b {
    font: 700 14px var(--font-sans); height: 34px; padding: 0 14px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 2px;
  }
  button.abm-b.primary { background: var(--accent); color: var(--on-solid); border-color: var(--accent); min-width: 108px; }
  button.abm-b:hover { filter: brightness(1.08); }
  .seedtag { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink2); font-variant-numeric: tabular-nums; }
  .abm-btns .spacer { flex: 1 1 auto; }
  .abm-btns .ctl-label { font-size: 13px; color: var(--ink2); font-weight: 600; }
  .abm-btns .seg button { padding: 6px 10px; font-family: var(--font-mono); font-size: 12px; }

  /* ---- counters ---- */
  .abm-hud.anim-hud {
    position: static; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; max-width: none; margin-bottom: 10px;
  }
  @media (max-width: 760px) { .abm-hud.anim-hud { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .abm-hud .chip-stat { min-width: 0; box-shadow: none; }
  .abm-hud .chip-stat span { display: flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .abm-hud .chip-stat.acc b { color: var(--accent-text); }
  @media (max-width: 420px) {
    .abm-hud .chip-stat { padding: 4px 6px; font-size: 11px; }
    .abm-hud .chip-stat b { font-size: 15px; }
    .abm-hud .chip-stat span { white-space: normal; overflow: visible; line-height: 1.2; }
  }

  /* state shapes: ring, disc, square, frame (shape and colour, never colour alone) */
  i.sh { display: inline-block; flex: none; width: 11px; height: 11px; }
  i.sh.s { border-radius: 50%; border: 1.6px solid var(--ink); background: var(--surface); }
  i.sh.i { border-radius: 50%; background: var(--accent); }
  i.sh.r { width: 9px; height: 9px; background: var(--mit-silver); }
  i.sh.h { width: 13px; height: 13px; border: 1.3px solid var(--mit-silver); background: none; }
  i.sh.rad { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--accent); background: var(--sel); position: relative; }
  i.sh.rad::after { content: ""; position: absolute; left: 4px; top: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  i.sh.spark { width: 18px; height: 0; border-top: 2px solid var(--mit-bright); background: none; }
  i.ln { display: inline-block; flex: none; width: 20px; height: 0; }
  i.ln.s { border-top: 1.6px solid var(--ink); }
  i.ln.i { border-top: 3px solid var(--accent); }
  i.ln.r { border-top: 2.4px solid var(--mit-silver); }
  i.ln.ode { border-top: 1.8px dashed var(--ink); }
  i.ln.run { border-top: 1px solid var(--mit-silver); }
  i.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink2); background: var(--surface); display: inline-block; flex: none; }
  i.dot.live { background: var(--accent); border-color: var(--accent); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) i.sh.spark { border-top-color: var(--crit); }
  }
  :root[data-theme="dark"] i.sh.spark { border-top-color: var(--crit); }

  /* ---- stage ---- */
  .abm-stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 12px; }
  @media (max-width: 760px) { .abm-stage { grid-template-columns: minmax(0, 1fr); } }
  .cv-box { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .cv-box canvas { position: absolute; inset: 0; display: block; }
  .cv-world { aspect-ratio: 1 / 1; }
  .cv-live { min-height: 260px; }
  @media (max-width: 760px) { .cv-live { aspect-ratio: 4 / 3; min-height: 0; } }
  .cv-reps { aspect-ratio: 16 / 7; }
  @media (max-width: 620px) { .cv-reps { aspect-ratio: 4 / 3; } }
  .cv-dist { height: 250px; margin-top: 10px; }
  .abm-scrub { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; margin-top: 10px; }
  .abm-scrub label { font-size: 13px; color: var(--ink2); font-weight: 600; }
  .abm-scrub input { width: 100%; accent-color: var(--accent); margin: 0; }
  .abm-scrub output { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 7ch; text-align: right; }
  .anim-legend { margin-top: 10px; }
  .scen-status {
    background: var(--surface2); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 3px; padding: 9px 13px; font-size: 14px; color: var(--ink2); margin: 12px 0 0;
  }
  .scen-status b { color: var(--ink); }

  /* ---- replications ---- */
  .stats { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); margin-top: 14px; }
  .stat .k { font-size: 12.5px; color: var(--ink2); font-weight: 600; }
  .stat .v { color: var(--accent-text); }
  .stat .v.ink { color: var(--ink); }
  @media (max-width: 560px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .stat { padding: 10px 11px; }
    .stat .v { font-size: 21px; }
    .stat .l { font-size: 12px; }
  }
  details.runs { margin-top: 14px; }
  table.data { min-width: 0; }
  table.data th.num, table.data td.num { text-align: right; }
  table.data td.num { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
  table.data tr.on td { background: var(--sel); }
  table.data td.acc { color: var(--accent-text); font-weight: 600; }
  @media (max-width: 560px) {
    table.data th, table.data td { padding-inline: 5px; }
    table.data .wide { display: none; }
  }
  .sw-note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }

  /* ---- model ---- */
  .model-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 8px 22px; align-items: start; }
  @media (max-width: 860px) { .model-grid { grid-template-columns: minmax(0, 1fr); } }
  .model-grid > div { min-width: 0; }
  .mhead { margin: 12px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-text); }
  .mhead:first-child { margin-top: 0; }
  .mtext { font-size: 14px; color: var(--ink2); margin: 6px 0 0; max-width: 72ch; }
  .mtext b { color: var(--ink); }
</style>
</head>

<div class="wrap">

  <!-- the live run -->
  <div class="card" id="abm-sim">
    <h2><span class="kicker" data-i18n="abm.sim.kicker"></span><span data-i18n="abm.sim.title"></span></h2>
    <p class="intro" id="abm-sim-intro"></p>
    <div class="abm-ctl">
      <div class="ctl">
        <label for="abm-d" data-i18n="abm.ctl.d"></label><output id="abm-d-out" for="abm-d"></output>
        <input type="range" id="abm-d" min="0" max="90" step="10" value="0">

      <div class="ctl">
        <label for="abm-p" data-i18n="abm.ctl.p"></label><output id="abm-p-out" for="abm-p"></output>
        <input type="range" id="abm-p" min="0.02" max="0.3" step="0.01" value="0.15">
      </div>
    </div>
    <div class="abm-btns">
      <button type="button" class="abm-b primary" id="abm-run"></button>
      <button type="button" class="abm-b" id="abm-reset" data-i18n="abm.btn.reset"></button>
      <button type="button" class="abm-b" id="abm-new" data-i18n="abm.btn.new"></button>
      <span class="seedtag" id="abm-seed"></span>
      <span class="spacer"></span>
      <span class="ctl-label" id="abm-speed-lbl" data-i18n="abm.speed"></span>

        <button type="button" data-v="1" aria-pressed="true">1×</button>
        <button type="button" data-v="2" aria-pressed="false">2×</button>
        <button type="button" data-v="4" aria-pressed="false">4×</button>
      </div>
    </div>
    <div class="anim-hud abm-hud" id="abm-hud">
      <div class="chip-stat" id="abm-c0"><b></b><span data-i18n="abm.k.step"></span></div>
      <div class="chip-stat" id="abm-c1"><b></b><span><i class="sh s"></i><span data-i18n="abm.k.s"></span></span></div>
      <div class="chip-stat acc" id="abm-c2"><b></b><span><i class="sh i"></i><span data-i18n="abm.k.i"></span></span></div>
      <div class="chip-stat" id="abm-c3"><b></b><span><i class="sh r"></i><span data-i18n="abm.k.r"></span></span></div>
      <div class="chip-stat acc" id="abm-c4"><b></b><span data-i18n="abm.k.peak"></span></div>
      <div class="chip-stat" id="abm-c5"><b></b><span data-i18n="abm.k.c"></span></div>
    </div>
    <div class="abm-stage">
      <div class="cv-box cv-world" id="abm-world" role="img"></div>
      <div class="cv-box cv-live" id="abm-live" role="img"></div>
    </div>
    <div class="abm-scrub">
      <label for="abm-t" data-i18n="abm.ctl.t"></label>
      <input type="range" id="abm-t" min="0" max="400" step="1" value="0">
      <output id="abm-t-out" for="abm-t"></output>
    </div>
    <div class="anim-legend">
      <span><i class="sh s"></i><span data-i18n="abm.lg.s"></span></span>
      <span><i class="sh rad"></i><span data-i18n="abm.lg.i"></span></span>
      <span><i class="sh r"></i><span data-i18n="abm.lg.r"></span></span>
      <span><i class="sh h"></i><span data-i18n="abm.lg.home"></span></span>
      <span><i class="sh spark"></i><span data-i18n="abm.lg.new"></span></span>
      <span><i class="ln s"></i><span data-i18n="abm.cl.s"></span></span>
      <span><i class="ln i"></i><span data-i18n="abm.cl.i"></span></span>
      <span><i class="ln r"></i><span data-i18n="abm.cl.r"></span></span>
      <span><i class="ln ode"></i><span data-i18n="abm.cl.ode"></span></span>
    </div>
    <p class="scen-status" id="abm-status" aria-live="polite"></p>
  </div>

  <!-- replications -->
  <div class="card" id="abm-reps">
    <h2><span class="kicker" data-i18n="abm.rep.kicker"></span><span data-i18n="abm.rep.title"></span></h2>
    <p class="intro" id="abm-rep-intro"></p>
    <div class="cv-box cv-reps" id="abm-repcv" role="img"></div>
    <div class="cv-box cv-dist" id="abm-distcv" role="img"></div>
    <div class="anim-legend">
      <span><i class="ln run"></i><span data-i18n="abm.rl.run"></span></span>
      <span><i class="ln i"></i><span id="abm-rl-live"></span></span>
      <span><i class="ln ode"></i><span data-i18n="abm.rl.ode"></span></span>
      <span><i class="dot"></i><span data-i18n="abm.rl.dot"></span></span>
      <span><i class="dot live"></i><span id="abm-rl-dlive"></span></span>
    </div>
    <div class="stats">
      <div class="stat"><div class="k" data-i18n="abm.s.peak"></div><div class="v" id="abm-s-peak"></div><div class="l" id="abm-s-peak-l"></div></div>
      <div class="stat"><div class="k" data-i18n="abm.s.tpeak"></div><div class="v ink" id="abm-s-tpeak"></div><div class="l" id="abm-s-tpeak-l"></div></div>
      <div class="stat"><div class="k" data-i18n="abm.s.final"></div><div class="v" id="abm-s-final"></div><div class="l" id="abm-s-final-l"></div></div>
      <div class="stat"><div class="k" data-i18n="abm.s.fizz"></div><div class="v ink" id="abm-s-fizz"></div><div class="l" id="abm-s-fizz-l"></div></div>

      <div class="stat"><div class="k" data-i18n="abm.s.r0"></div><div class="v" id="abm-s-r0"></div><div class="l" id="abm-s-r0-l"></div></div>
    </div>
    <details class="runs">

        <div class="tblwrap"><table class="data" id="abm-runs"></table></div>

    });
    document.getElementById("abm-ode-text").textContent = T("abm.ode.text", { h: fmt(ODE_H, 2), s: fmt(N - I0), i: fmt(I0) });
    var v = { c: tnum(B.cbar, 3, 3), g: tnum(geomC, 3, 3), p: tnum(state.p, 2, 2), b: tnum(o.beta, 4, 4), D: D, ga: tnum(o.gamma, 2, 2), R0: tnum(o.R0, 2, 2) };
    var vp = { c: fmt(B.cbar, 3, 3), g: fmt(geomC, 3, 3), p: fmt(state.p, 2, 2), b: fmt(o.beta, 4, 4), D: fmt(D), ga: fmt(o.gamma, 2, 2), R0: fmt(o.R0, 2, 2) };
    TeX.set(document.getElementById("abm-inst"), T("abm.inst.tex", v), T("abm.inst.formula", vp));
    document.getElementById("abm-fs-text").textContent = T("abm.fs.text", { eq: fmt(o.finalEq, 1, 1), rk: fmt(o.finalRK, 1, 1), T: fmt(ODE_END), R0: fmt(o.R0, 2, 2) });
  }
  function renderSweep() {
    var ready = SWEEP.every(function (d) { return sweep.rows[d]; });
    document.getElementById("abm-sw-intro").textContent = T("abm.sw.intro", { n: RUNS, p: fmt(state.p, 2, 2), a: state.seed, b: state.seed + RUNS - 1 });
    var h = "<thead><tr><th class='num'>" + T("abm.sw.d") + "</th><th class='num'>" + T("abm.sw.c") + "</th><th class='num wide'>" + T("abm.sw.fix") +
      "</th><th class='num wide'>" + T("abm.sw.po") + "</th><th class='num wide'>" + T("abm.sw.pa") + "</th><th class='num'>" + T("abm.sw.fo") +
      "</th><th class='num'>" + T("abm.sw.fa") + "</th><th class='num wide'>" + T("abm.sw.fz") + "</th></tr></thead><tbody>";
    SWEEP.forEach(function (d) {
      var R = sweep.rows[d], on = d === state.pct ? " class='on'" : "";
      if (!R) { h += "<tr" + on + "><td class='num'>" + T("abm.pct", { v: fmt(d) }) + "</td><td colspan='7'>" + T("abm.sw.wait") + "</td></tr>"; return; }
      h += "<tr" + on + "><td class='num'>" + T("abm.pct", { v: fmt(d) }) + "</td><td class='num'>" + fmt(R.cbar, 3, 3) + "</td><td class='num wide'>" + T("abm.pct", { v: fmt(100 * R.fixedShare, 1, 1) }) + "</td><td class='num wide'>" +
        fmt(R.ode.peak, 1, 1) + "</td><td class='num wide acc'>" + fmt(R.medPeak, 1) + "</td><td class='num'>" + fmt(R.ode.finalRK, 1, 1) + "</td><td class='num acc'>" + fmt(R.medFinal, 1) +
        "</td><td class='num wide'>" + fmt(R.fizz) + "</td></tr>";
    });
    document.getElementById("abm-sw").innerHTML = h + "</tbody>";
    document.getElementById("abm-sw-note").textContent = ready ? T("abm.sw.note", { t: fmt(FIZZ) }) : T("abm.sw.wait");
  }
  function renderNotes() {
    var a = sweep.rows[0], z = sweep.rows[80];
    var ids = ["abm-n1", "abm-n2", "abm-n3", "abm-n4"];
    if (!a || !z) { ids.slice(0, 3).forEach(function (id) { document.getElementById(id).textContent = T("abm.sw.wait"); }); }
    else {
      // the wording follows the numbers: agents close to the equations or not, below the threshold, a clear drop or not
      var close = Math.abs(a.medFinal - a.ode.finalRK) <= 0.05 * N && Math.abs(a.medPeak - a.ode.peak) <= Math.max(0.15 * a.ode.peak, 5);
      var k1 = a.ode.R0 <= 1 ? "abm.n.p1c" : (close ? "abm.n.p1" : "abm.n.p1b");
      document.getElementById("abm-n1").textContent = T(k1, { p: fmt(state.p, 2, 2), pa: fmt(a.medPeak, 1), po: fmt(a.ode.peak, 1, 1), fa: fmt(a.medFinal, 1), fo: fmt(a.ode.finalRK, 1, 1),
        r0: fmt(a.ode.R0, 2, 2), k: fmt(a.fizz), n: fmt(RUNS), pc: fmt(1 / (a.cbar * D), 3, 3) });
      var k2 = a.medFinal - z.medFinal >= 0.05 * N ? "abm.n.p2" : "abm.n.p2b";
      document.getElementById("abm-n2").textContent = T(k2, { c0: fmt(a.cbar, 3, 3), c8: fmt(z.cbar, 3, 3), sh: fmt(100 * z.fixedShare, 1, 1), f8: fmt(z.medFinal, 1), f0: fmt(a.medFinal, 1) });
      document.getElementById("abm-n3").textContent = T("abm.n.p3", { o8: fmt(z.ode.finalRK, 1, 1), o0: fmt(a.ode.finalRK, 1, 1), r8: fmt(z.ode.R0, 2, 2) });
    }
    var pc = 1 / (B.cbar * D);
    document.getElementById("abm-n4").textContent = T("abm.n.p4", { lo: fmt(B.minPeak), hi: fmt(B.maxPeak), r0: fmt(B.ode.R0, 2, 2), k: fmt(B.fizz), n: fmt(RUNS), pc: fmt(pc, 3, 3) });
  }
  function renderAll() {
    renderOutputs(); renderReps(); renderModel(); renderSweep(); renderNotes();
    scrub.max = live.end;
    colors(); showFrame(); drawReps(); drawDist(); renderAria();
  }

  readInputs();
  recompute();
  if (A.reducedMotion) play.tau = live.end;
  I18N.onChange(function () { renderAll(); });
})();
</script>
</body>
