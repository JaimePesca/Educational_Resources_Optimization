  }
  function renderResult() {
    var box = $("result");
    if (!isDone()) { box.hidden = true; return; }
    box.hidden = false;
    var Lv = L(), b = selMask(), wtd = weighted(), opt = Lv.ex.opt, few = Lv.ex.few, gr = Lv.gr;
    var mine = wtd ? costOf(b) : popc(b), best = wtd ? opt.c : opt.k, gv = wtd ? gr.c : gr.k;
    var ratio = mine > 0 ? best / mine : 0;
    var stars = mine === best ? 3 : ratio >= 0.8 ? 2 : ratio >= 0.6 ? 1 : 0;
    if (starsBy[lv] == null || stars > starsBy[lv]) { starsBy[lv] = stars; saveStars(); renderLevels(); }
    $("verdict").textContent = t("cov.verdict." + stars);
    $("stars").setAttribute("aria-label", t("cov.starsAria", { n: stars }));
    $("stars").innerHTML = "★".repeat(stars) + '<span class="off">' + "★".repeat(3 - stars) + "</span>";
    var show = wtd ? money : ants;
    $("rsub").textContent = t(wtd ? "cov.rsub.cost" : "cov.rsub.count", { mine: show(mine), opt: show(best), pct: Math.round(ratio * 100), n: attempts[lv] });

    var bars = $("bars"); bars.textContent = "";
    var mx = Math.max(mine, best, gv, wtd ? few.c : 0);
    barsRow(bars, t("cov.bar.mine"), mine, show(mine) + (wtd ? " · " + ants(popc(b)) : ""), mx, css("--c-blue"));
    barsRow(bars, t("cov.bar.greedy"), gv, show(gv) + (wtd ? " · " + ants(gr.k) : ""), mx, css("--c-aqua"));
    if (wtd) barsRow(bars, t("cov.bar.fewest"), few.c, show(few.c) + " · " + ants(few.k), mx, css("--c-violet"));
    barsRow(bars, t("cov.bar.opt"), best, show(best) + (wtd ? " · " + ants(opt.k) : ""), mx, css("--accent"));

    var ex = [], red = redundant(b);
    var bad = letters(gr.b & ~opt.b);
    ex.push(gv > best
      ? t("cov.extra.worse", { seq: gr.order.map(function (j) { return LET[j]; }).join(" → "), v: show(gv), bad: listFmt(bad) })
      : t("cov.extra.same", { v: show(gv) }));
    if (wtd) ex.push(t("cov.extra.fewest", { k: few.k, c: money(few.c), kopt: opt.k, opt: money(opt.c) }));
    ex.push(red.length > 1 ? t("cov.extra.redN", { list: listFmt(red) }) : red.length ? t("cov.extra.red1", { s: red[0] }) : t("cov.extra.nored"));
    $("rextra").innerHTML = ex.map(function (s) { return "<p>" + s + "</p>"; }).join("");
    $("showopt").setAttribute("aria-pressed", showingOpt ? "true" : "false");
    $("showgre").setAttribute("aria-pressed", showingGre ? "true" : "false");
    $("next").hidden = lv >= LEVELS.length - 1;
  }

  function renderAll() { renderLevels(); renderBoard(); renderResult(); persist(); }

  // ---- actions ----
  $("confirm").addEventListener("click", function () {
    if (covOf(selMask()) !== L().full) return;
    attempts[lv]++; phase = "done"; showingOpt = showingGre = false;
    renderAll();
    var rm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    $("result").scrollIntoView({ behavior: rm ? "auto" : "smooth", block: "nearest" });
  });
  $("reset").addEventListener("click", function () { clearSel(); renderAll(); });
  $("retry").addEventListener("click", function () { clearSel(); phase = "pick"; showingOpt = showingGre = false; renderAll(); });
  $("next").addEventListener("click", function () { if (lv < LEVELS.length - 1) goLevel(lv + 1); });
  $("showopt").addEventListener("click", function () { showingOpt = !showingOpt; renderBoard(); renderResult(); });
  $("showgre").addEventListener("click", function () { showingGre = !showingGre; renderBoard(); renderResult(); });

  var rq = 0;
  window.addEventListener("resize", function () {
    if (rq) return;
    rq = requestAnimationFrame(function () {
      rq = 0;
      var w = $("map").getBoundingClientRect().width || VBW;
      if (Math.abs(VBW / w - lastK) / lastK > 0.04) { renderMap(); applyHover(); }
    });
  });
  if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderAll);

  // ---- hot reload state (survives republish while the page is open) ----
  function persist() {
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
      try { window.claude.hot.snapshot({ lv: lv, sel: sel, phase: phase, attempts: attempts }); } catch (e) { /* ok */ }
    }
  }
  function start(data) {
    if (data && typeof data.lv === "number" && LEVELS[data.lv]) {
      lv = data.lv; clearSel();
      if (Array.isArray(data.sel)) data.sel.forEach(function (v, j) { if (j < sel.length) sel[j] = v ? 1 : 0; });
      phase = data.phase === "done" && covOf(selMask()) === L().full ? "done" : "pick";
      if (Array.isArray(data.attempts)) attempts = data.attempts;
    }
    I18N.onChange(renderAll);
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) {
    window.claude.hot.ready(start);
  } else {
    start((window.claude && window.claude.hot && window.claude.hot.data) || {});
  }
})();
</script>
</body>
</html>
