<script>
(function () {
  "use strict";
  var T = I18N.t;
  var MINUS = "−";
  var fmt = function (v, d, m) { if (Math.abs(v) < 5e-10) v = 0; return I18N.fmt(v, d == null ? 2 : d, m); };
  // the sign is chosen after rounding, so a tiny value never shows as "−0" or "+0"
  var signed = function (v, d, neg, pos) { var m = fmt(Math.abs(v), d); return m === fmt(0, d) ? m : (v < 0 ? neg : pos) + m; };
  var num = function (v, d) { return signed(v, d, MINUS, ""); };        // U+2212 for negatives
  var sgn = function (v, d) { return signed(v, d, MINUS, "+"); };       // explicit sign
  var texNum = function (v, d) { return signed(v, d, "-", ""); };
  var pair = function (x, y, d) { return T("kkt.pair", { x: num(x, d), y: num(y, d) }); };

  /* ---------- the model: min (x-a)^2 + (y-b)^2  s.t.  p x + q y <= c ---------- */
  var A0 = 4, B0 = 3, P0 = 1, Q0 = 2, N2 = P0 * P0 + Q0 * Q0, NN = Math.sqrt(N2);
  var CS = { active: 4, slack: 12 };             // right-hand side c of each scenario (illustrative)
  var DC = 1;                                    // how far the fence moves in chapter 4
  var DELTAS = [-1, -0.5, -0.1, 0.1, 0.5, 1];    // rows of the sensitivity table
  function gOf(x, y) { return P0 * x + Q0 * y; }
  function fOf(x, y) { return (x - A0) * (x - A0) + (y - B0) * (y - B0); }
  // closed form of the KKT conditions for one linear constraint
  function solve(c) {
    var e = gOf(A0, B0) - c;
    if (e <= 0) return { c: c, x: A0, y: B0, lam: 0, f: 0, g: gOf(A0, B0), active: false };
    var s = e / N2, x = A0 - s * P0, y = B0 - s * Q0;
    return { c: c, x: x, y: y, lam: 2 * s, f: fOf(x, y), g: gOf(x, y), active: true };
  }
  // linear expression p x + q y as text (plain uses U+2212 and no-break spaces, TeX uses -)
  function lin(p, q, tex) {
    var m = tex ? "-" : MINUS, sp = tex ? " " : " ", s = "";
    function term(k, v, first) {
      if (Math.abs(k) < 1e-12) return "";
      var mag = Math.abs(k), coef = Math.abs(mag - 1) < 1e-12 ? "" : fmt(mag);
      var sign = first ? (k < 0 ? m : "") : (k < 0 ? sp + m + sp : sp + "+" + sp);
      return sign + coef + v;
    }
    s = term(p, "x", true);
    s += term(q, "y", s === "");
    return s;
  }
  var cache = {};
  function scen(key) {
    if (cache[key]) return cache[key];
    var c0 = CS[key], o0 = solve(c0), oD = solve(c0 + DC);
    return (cache[key] = { key: key, c0: c0, o0: o0, oD: oD, act: o0.active });
  }
  var state = { sc: "active" };

  /* =====================================================================================
     "See it in motion". Every number is computed from the model above; the 3D bowl, the
     rolling particles, the camera and the timing are illustrative.
     ===================================================================================== */
  var A = window.Anim, E = A.ease, seg = A.seg, lerp = A.lerp, clamp = A.clamp;

  /* ---------- the fence and its two sides ---------- */
  function drawSides(S, t, c) {

    var R = worldRect(), rect = [[R.x0, R.y0], [R.x1, R.y0], [R.x1, R.y1], [R.x0, R.y1]];

  function fenceSeg(c) {

    ctx.lineCap = "butt";

  function lineAngle(v) {                        // screen angle of a segment, kept readable (not upside down)
    var ang = Math.atan2(SY(v[3]) - SY(v[1]), SX(v[2]) - SX(v[0]));
    if (ang > Math.PI / 2) ang -= Math.PI; else if (ang < -Math.PI / 2) ang += Math.PI;

  }
  function fenceKey(t, c) {                      // the rotated fence label as a key box (polygon and bounds)
    var F = fenceLabel(c);

    var yc = 9 + L.fs / 2, hh = (L.fs + 0.5) / 2 + 3, k = rotBox(F.X, F.Y, F.ang, -F.w / 2 - 3, yc - hh, F.w / 2 + 3, yc + hh);

  function drawGhost(c, a) {                     // dashed silver copy of the fence
    if (a <= 0.01) return;

  function ghostA(t, k) {                        // opacity of the ghost fence at c0 (k = 0, chapter 4) and at c0 + dc (k = 1, recap)
    return k ? seg(t, 43.6, 45) : seg(t, 33.6, 34.2) * (1 - seg(t, 42.4, 43.2));
  }
  function sideSpec(c, ghosts, S) {
    // near the lower end of the visible line, one label on each side, slid up the line when one would leave the plot.
    // A dashed ghost fence on a label's side (ghosts: [{c, a}]) pushes that label out past it, so the ghost never
    // runs through the text. In the Active scenario the touching contour is an obstacle too: the labels slide down
    // the line, away from x*, until they clear it.
    var v = fenceSeg(c);

    var X0 = SX(v[0]), Y0 = SY(v[1]), DX = SX(v[2]) - X0, DY = SY(v[3]) - Y0;
    var nx = P0 / NN, ny = -Q0 / NN, off = L.portrait ? 16 : 22;     // screen normal toward g > c
    var f = font(600, L.fs), su = L.portrait ? 0.16 : 0.1;
    ctx.font = f;

      { txt: T("kkt.l.feas"), sd: -1, col: C.ink2 },

  // small stages: the side labels leave once the gradients arrive (the hatch and the legend keep the meaning)
  function sideAlpha(t) { return seg(t, 11.4, 12.2) * (L.narrow ? 1 - seg(t, 17, 17.6) : 1); }
  function sideGhosts(S, t) { return [{ c: S.c0, a: ghostA(t, 0) }, { c: S.c0 + DC, a: ghostA(t, 1) }]; }
  function sideLabels(S, t, c) {

    if (!sp) return;
    sp.items.forEach(function (it) { label(it.txt, it.x, it.y, "center", it.col, sp.f, a); });

  /* ---------- growing circle, optimum, gradients ---------- */
  function drawGrowing(S, t, O, m, moving) {     // moving: the growing circle and the waves (they give way to the labels)
    if (!S.act) {
      if (!moving || t < 12.8 || t > 18.2) return;
      for (var w = 0; w < 3; w++) {
        var ph = seg(t, 12.8 + w * 1.4, 15.8 + w * 1.4);
        if (ph <= 0 || ph >= 1) continue;
        ctx.globalAlpha = 0.7 * (1 - ph) * m; ctx.strokeStyle = C["mit-silver"]; ctx.lineWidth = 2;
        circle(SX(A0), SY(B0), (0.2 + 2.2 * E.out(ph)) * cam.K); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      return;
    }
    if (t < 12.6) return;
    var X = SX(A0), Y = SY(B0), K = cam.K;
    if (t < TT) {
      if (!moving) return;
      var r = growR(S, t);
      for (var e = 2; e >= 1; e--) {
        ctx.globalAlpha = 0.28 / e * m; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5;
        circle(X, Y, Math.max(0, r - e * 0.13) * K); ctx.stroke();
      }
      ctx.globalAlpha = m; ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
      circle(X, Y, r * K); ctx.stroke();
      ctx.globalAlpha = 1;
      return;
    }
    if (moving) return;
    // the touching contour follows the optimum (it moves with the fence in chapter 4)
    var rr = Math.sqrt(O.f);
    ctx.globalAlpha = 1; ctx.strokeStyle = C.accent; ctx.lineWidth = L.lw;
    circle(X, Y, rr * K); ctx.stroke();
    var fl = seg(t, TT, TT + 0.9);
    if (fl < 1) { ctx.globalAlpha = 0.5 * (1 - fl); ctx.lineWidth = L.lw + 6 * (1 - fl); circle(X, Y, rr * K); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
  function drawRadius(S, t, O, m) {
    if (!S.act) return;
    var a = seg(t, 17.2, 18.2) * (1 - 0.4 * seg(t, 42.4, 43.4)) * m;
    if (a <= 0) return;
    var X = SX(O.x), Y = SY(O.y), CX = SX(A0), CY = SY(B0);
    ctx.globalAlpha = a * 0.8; ctx.strokeStyle = C.ink2; ctx.lineWidth = 1.2; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(X, Y); ctx.stroke(); ctx.setLineDash([]);
    // right angle between the radius and the fence

    ctx.globalAlpha = a; ctx.lineWidth = 1.3; ctx.strokeStyle = C.ink;
    ctx.beginPath(); ctx.moveTo(X + ux * m, Y + uy * m); ctx.lineTo(X + ux * m + vx * m, Y + uy * m + vy * m); ctx.lineTo(X + vx * m, Y + vy * m); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  function drawIdeal(S, t) {
    var a = E.back(seg(t, 1.8, 2.5));
    if (a <= 1e-3) return;
    var X = SX(A0), Y = PY(B0, 0), r = (L.portrait ? 5.5 : 7) * a;
    var bad = S.act ? seg(t, 11.6, 12.2) : 0;

  function idealAlpha(S, t) { return seg(t, 2.1, 2.8) * (S.act ? 1 : 1 - seg(t, 12.6, 13.4)); }
  function idealKey(S, t) {                      // "ideal point (4, 3)" as a key box, as drawn at t

  }
  function idealLabel(t, a, bad) {               // where "ideal point (4, 3)" sits, with its screen box
    var X = SX(A0), Y = PY(B0, 0), r = (L.portrait ? 5.5 : 7) * a;
    var x = X + r + (bad > 0 ? 18 : 9), y2 = Y - r - 4, y1 = y2 - L.fs - 1;
    var f1 = font(700, L.fs + 0.5), f2 = font(400, L.fs, true), w;
    ctx.font = f1; w = ctx.measureText(T("kkt.l.ideal")).width;
    ctx.font = f2; w = Math.max(w, ctx.measureText(pair(A0, B0)).width);
    return { x: x, y1: y1, y2: y2, f1: f1, f2: f2, b: [x - 3, y1 - L.fs / 2 - 3, x + w + 3, y2 + L.fs / 2 + 3] };
  }
  function drawOptimum(S, t, O) {
    var t0 = tOpt(S), a = E.back(seg(t, t0, t0 + 0.6));
    if (a <= 1e-3) return;
    var X = SX(O.x), Y = SY(O.y), r = L.dot * a;
    // burst of particles at the touch
    var bu = seg(t, t0, t0 + 1.1);
    if (bu > 0 && bu < 1) {
      var rn = A.rng(31);
      ctx.fillStyle = C.accent;

    ctx.fillStyle = C.accent; circle(X, Y, r); ctx.fill();

  }
  function optLabels(S, t, O) {                  // "x*" and its coordinates, with their screen boxes
    var t0 = tOpt(S), la = seg(t, t0 + 0.3, t0 + 0.9), X = SX(O.x), Y = SY(O.y), r = L.dot;
    var fsC = L.portrait ? 11.5 : 11, out;
    var fx = font(700, L.fb, false, true), fc = font(400, fsC, true), pa = la * (S.act ? seg(t, 17.6, 18.4) : 1);
    if (S.act) {
      // on the feasible side, in the corner between grad f (down the normal) and the fence (down the line).
      // Both lines are part of the collision check: a text box of width w and height h keeps a clear margin
      // from the fence (Mf: halo, half the line, a visible gap) and from the shaft of grad f (Mg). In screen
      // coordinates the fence runs along u = (q, p)/|n| and grad f along v = (-p, q)/|n|; a box centred at
      // s u + d v clears the fence when d >= Mf + (w p + h q)/(2|n|) and the shaft when s >= Mg + (w q + h p)/(2|n|).
      // The pair sits just deep enough for the widest coordinates it shows (while the fence moves), and each
      // line is centred in the free stretch at its depth, so it stays equally clear of both lines.

      ctx.font = fc;
      for (k = 0; k <= 20; k++) { ok = solve(S.c0 + DC * k / 20); wMax = Math.max(wMax, ctx.measureText(pair(ok.x, ok.y)).width); }
      var need = function (w, h, g) {            // least screen depth for a w x h box, and its free x range there
        var sm = Mg + (w * Q0 + h * P0) / (2 * NN), dm = Mf + g + (w * P0 + h * Q0) / (2 * NN);
        return { y: NN * (P0 * sm + Q0 * dm) / N2, x: function (y) { return ((sm * NN - y * P0) / Q0 + (y * Q0 - dm * NN) / P0) / 2; } };
      };
      ctx.font = fx; var wX = ctx.measureText(T("kkt.l.xs")).width;
      var depths = function (g) {

        return [a2 - gap, a2, a1];                // a1: the least depth of "x*" on its own

      // the x axis (y = 0) runs a fixed O.y K px under x*: where it would cross the pair in the zoomed view or in
      // the recap, the coordinates (or both lines) step down past it, blended in with the camera move to that view
      var d0 = depths(0), B = boxes(S), h1 = L.fb / 2 + 3, h2 = fsC / 2 + 3;
      var pz = axisPush(d0, h1, h2, S.o0.y * viewK(B.zoom)), pf = axisPush(d0, h1, h2, S.o0.y * viewK(B.fin));
      var uz = E.inOut(seg(t, 15.4, 18.6)), uf = E.inOut(seg(t, 42.4, 45.6));

      ctx.font = fc; var nNow = need(ctx.measureText(pair(O.x, O.y)).width, fsC, gd);
      out = [{ txt: T("kkt.l.xs"), x: X + nX.x(d1), y: Y + d1, align: "center", col: C["accent-text"], f: fx, fs: L.fb, a: la },
        { txt: pair(O.x, O.y), x: X + nNow.x(d2), y: Y + d2, align: "center", col: C.ink2, f: fc, fs: fsC, a: pa }];
      // the "grad f" label at the tip of the arrow: a label of the pair at its depth slides down the fence, past it
      // (s along the fence, d along grad f, both from x*; the push fades in with the overlap, so nothing jumps)
      var fa = seg(t, 21.2, 21.8);
      if (fa > 0) {
        var ffs = L.fb + 1, ff = font(700, ffs, false, true);

        var wf = ctx.measureText(T("kkt.l.gf")).width + 6, hf = ffs + 6;

    }
    out.forEach(function (o) {
      ctx.font = o.f;
      var w = ctx.measureText(o.txt).width, x0 = o.align === "center" ? o.x - w / 2 : (o.align === "right" ? o.x - w : o.x);

  /* ---------- caption (top left, under the counters) ---------- */

  /* ---------- inset: f*(c) against its tangent at the original c ---------- */
  function drawInset(S, t) {
    var a = E.out(seg(t, 32.2, 33.2));
    if (a <= 0) return;
    if (L.portrait) return;                       // phones: the counters carry the two numbers
    if (!S.act) return;                           // slack: f*(c) is flat at 0 and the counters already say 0 and 0
    var y0 = L.capBottom45 + 14, h2 = Math.min(170, L.H - y0 - 14);
    if (h2 < 76) return;
    var box = { x: L.capX, y: y0, w: L.capW - 14, h: h2, card: false };
    var c0 = S.c0, cmin = c0 - 0.6, cmax = c0 + 2.6, lam0 = S.o0.lam, f0 = S.o0.f;
    var fmin = Infinity, fmax = -Infinity, c, v;
    for (c = cmin; c <= cmax + 1e-9; c += 0.05) {
      v = solve(c).f; fmin = Math.min(fmin, v, f0 - lam0 * (c - c0)); fmax = Math.max(fmax, v, f0 - lam0 * (c - c0));
    }
    if (fmax - fmin < 2) { fmax = fmin + 2; }
    var pad = L.portrait ? 8 : 10, px0 = box.x + pad + 4, px1 = box.x + box.w - pad, py0 = box.y + pad + (L.portrait ? 6 : 10), py1 = box.y + box.h - pad - 12;
    var cx = function (cc) { return px0 + (cc - cmin) / (cmax - cmin) * (px1 - px0); };
    var fy = function (ff) { return py1 - (ff - fmin) / (fmax - fmin) * (py1 - py0); };
    var fs = L.portrait ? 9.5 : 10.5, LG = insetLegend(S, fs, px0, px1, py0, py1, cx, fy, cmin, cmax);
    if (!LG) return;                              // too short for a legend clear of the curve: no inset at all

    if (box.card) {
      ctx.fillStyle = C.surface; ctx.globalAlpha = a * 0.94; ctx.fillRect(box.x, box.y, box.w, box.h);
      ctx.globalAlpha = a; ctx.strokeStyle = C.axis; ctx.lineWidth = 1; ctx.strokeRect(box.x + 0.5, box.y + 0.5, box.w - 1, box.h - 1);
    }
    // axes
    ctx.strokeStyle = C.axis; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px0, py0 - 4); ctx.lineTo(px0, py1); ctx.lineTo(px1, py1); ctx.stroke();
    // tangent at c0 (slope -lambda)
    ctx.save(); ctx.beginPath(); ctx.rect(px0, py0 - 6, px1 - px0, py1 - py0 + 6); ctx.clip();
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1.3; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(cx(cmin), fy(f0 - lam0 * (cmin - c0))); ctx.lineTo(cx(cmax), fy(f0 - lam0 * (cmax - c0))); ctx.stroke();
    ctx.setLineDash([]);

    for (c = cmin, v = 0; c <= cmax + 1e-9; c += 0.05, v++) { var X = cx(c), Y = fy(solve(c).f); if (v) ctx.lineTo(X, Y); else ctx.moveTo(X, Y); }
    ctx.stroke(); ctx.restore();
    // probe at c(t): stays at c0 + DC after the move
    var cp = S.c0 + DC * E.inOut(seg(t, 33.4, 37.4));
    var yC = fy(solve(cp).f), yT = fy(f0 - lam0 * (cp - c0)), xP = cx(cp);
    if (Math.abs(yC - yT) > 0.5) {
      ctx.strokeStyle = HOT; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(xP, yC); ctx.lineTo(xP, yT); ctx.stroke();
    }
    ctx.fillStyle = C.accent; circle(cx(c0), fy(f0), 3.5); ctx.fill();
    ctx.fillStyle = C.surface; circle(xP, yT, 3.5); ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = C.accent; circle(xP, yC, 3.5); ctx.fill();
    // minimal labels
    ctx.font = font(400, fs, true); ctx.fillStyle = C.muted; ctx.textAlign = "center"; ctx.textBaseline = "top";

    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.font = font(700, fs, false, true);
    var lx = LG.lx, ly = LG.ly;

    ctx.strokeStyle = C.accent; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + 20, ly); ctx.stroke();
    ly += fs + 5;

    ctx.strokeStyle = C.ink; ctx.lineWidth = 1.3; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + 20, ly); ctx.stroke(); ctx.setLineDash([]);

  function insetLegend(S, fs, px0, px1, py0, py1, cx, fy, cmin, cmax) {
    // the two legend rows (text right-aligned before a 20 px swatch) at the first spot that keeps clear of the
    // curve, the tangent and the probe over the whole move: top right first (the curve falls from the top left
    // and the tangent stays under it), then along the top, then the lower left. null when no spot is clear.
    var c0 = S.c0, lam0 = S.o0.lam, f0 = S.o0.f, w1, w2, pts = [], c, k;
    ctx.font = font(700, fs, false, true); w1 = ctx.measureText(T("kkt.l.fc")).width;
    ctx.font = font(400, fs); w2 = ctx.measureText(T("kkt.l.tan")).width;
    var tw = Math.max(w1, w2) + 4 + 20, rows = 2 * fs + 5;
    var n = Math.max(40, Math.ceil((px1 - px0) / 2));
    for (k = 0; k <= n; k++) {                     // curve and tangent, about every 2 px, inside the plot
      c = cmin + (cmax - cmin) * k / n;
      [solve(c).f, f0 - lam0 * (c - c0)].forEach(function (v) { var Y = fy(v); if (Y >= py0 - 6 && Y <= py1) pts.push([cx(c), Y, 3]); });
    }
    for (k = 0; k <= 10; k++) {                    // the probe dots and the gap between them while c moves

      for (var i = 0; i < pts.length; i++) {
        var P = pts[i];

    var S = scen(state.sc), c = cAt(S, t), O = solve(c);

    drawFloor(t, clearM);

    giveWay(clear, function (m) { drawGhost(S.c0, g0 * m); drawGhost(S.c0 + DC, g1 * m); });
    // fences: [{c, a, m}] lines the tick labels keep m px away from

      { c: S.c0, a: g0, m: 4 }, { c: S.c0 + DC, a: g1, m: 4 }]);

    document.getElementById("kkt-sl").textContent = fmt(o.lam);
    document.getElementById("kkt-sll").textContent = T(o.active ? "kkt.sol.lamAct" : "kkt.sol.lamSlk");
    document.getElementById("kkt-sf").textContent = fmt(o.f);
    document.getElementById("kkt-sfl").textContent = o.active ? T("kkt.sol.fAct", { pt: pair(A0, B0) }) : T("kkt.sol.fSlk");
    document.getElementById("kkt-sg").textContent = fmt(o.g);
    document.getElementById("kkt-sgl").textContent = o.active ? T("kkt.sol.bind") : T("kkt.sol.slack", { c: fmt(S.c0) });
    // KKT check with the numbers of the scenario
    var term = function (v, tex) { return v >= 0 ? (tex ? "- " : MINUS + " ") + fmt(v) : "+ " + fmt(-v); };
    var gfx = 2 * (o.x - A0), gfy = 2 * (o.y - B0);
    var v = {
      ta: term(A0, true), tb: term(B0, true), gl: lin(P0, Q0, true), cc: texNum(S.c0),
      gfx: texNum(gfx), gfy: texNum(gfy), lam: texNum(o.lam), pp: texNum(P0), qq: texNum(Q0), gx: texNum(o.g)
    };
    var vp = {
      ta: term(A0, false), tb: term(B0, false), gl: lin(P0, Q0), cc: num(S.c0),
      gfx: num(gfx), gfy: num(gfy), lam: num(o.lam), pp: num(P0), qq: num(Q0), gx: num(o.g)
    };
    TeX.set(document.getElementById("kkt-inst"), T("kkt.inst.tex", v), T("kkt.inst.formula", vp));
  }
  function renderSens() {
    var S = scen(state.sc), o = S.o0;
    document.getElementById("kkt-sens-intro").textContent = T("kkt.sens.intro", { c: fmt(S.c0), l: fmt(o.lam) });
    var h = "<thead><tr><th class='num'>" + T("kkt.sens.dc") + "</th><th class='num wide'>" + T("kkt.sens.c") + "</th><th class='num wide'>" +
      T("kkt.sens.f") + "</th><th class='num'>" + T("kkt.sens.ex") + "</th><th class='num'>" + T("kkt.sens.est") + "</th><th class='num'>" +
      T("kkt.sens.gap") + "</th></tr></thead><tbody>";
    DELTAS.forEach(function (d) {
      var n = solve(S.c0 + d), ex = n.f - o.f, est = -o.lam * d;
      h += "<tr" + (Math.abs(d) === DC ? " class='big'" : "") + "><td class='num'>" + sgn(d, 1) + "</td><td class='num wide'>" + fmt(S.c0 + d, 1) +
        "</td><td class='num wide'>" + fmt(n.f, 3) + "</td><td class='num ex'>" + sgn(ex, 3) + "</td><td class='num'>" + sgn(est, 3) +
        "</td><td class='num gap'>" + sgn(ex - est, 3) + "</td></tr>";
    });
    document.getElementById("kkt-sens").innerHTML = h + "</tbody>";
    document.getElementById("kkt-sens-note").textContent = o.active ? T("kkt.sens.note.act", { n: fmt(N2) }) : T("kkt.sens.note.slk");
    // the link to shadow prices: a first-order estimate while the fence binds, an exact zero while it is slack
    var lp = document.getElementById("kkt-sens-lp"), kl = o.active ? "kkt.sens.lp" : "kkt.sens.lp.slk";
    lp.setAttribute("data-i18n", kl); lp.textContent = T(kl, { gab: fmt(gOf(A0, B0)) });
  }
  function renderNotes() {
    var a = scen("active"), s = scen("slack"), o = a.o0;
    var gfx = 2 * (o.x - A0), gfy = 2 * (o.y - B0);
    document.getElementById("kkt-n1").textContent = T("kkt.n.p1", { x: pair(o.x, o.y) });
    document.getElementById("kkt-n2").textContent = T("kkt.n.p2", { gf: pair(gfx, gfy), gg: pair(P0, Q0), l: fmt(o.lam) });
    document.getElementById("kkt-n3").textContent = T("kkt.n.p3", { gab: fmt(gOf(A0, B0)), c: fmt(s.c0) });
    document.getElementById("kkt-n4").textContent = T("kkt.n.p4", { d: sgn(DC), df: sgn(a.oD.f - o.f), est: sgn(-o.lam * DC) });
  }

  var segBtns = document.querySelectorAll("#kkt-seg button");
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      if (state.sc === b.getAttribute("data-sc")) return;
      state.sc = b.getAttribute("data-sc");
      segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      renderScenText(); renderStatus(); renderSolution(); renderSens();
      if (A.reducedMotion) { player.seek(DUR); return; }
      if (player.time < CH[1]) player.refresh();
      else { player.seek(CH[1] + 0.001); player.play(); }
    });
  });

  function renderPage() {
    renderSeg(); renderScenText(); renderStatus(); renderModel(); renderSolution(); renderSens(); renderNotes();
    hudKey = "";
    player.refresh();
  }
  I18N.onChange(renderPage);
})();
</script>
</body>
</html>
