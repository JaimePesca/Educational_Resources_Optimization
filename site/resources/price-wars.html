<script>
(function () {
  "use strict";
  var T = I18N.t;
  var MINUS = "−";
  var fmt = function (v, d, m) { if (Math.abs(v) < 5e-10) v = 0; return I18N.fmt(v, d == null ? 2 : d, m); };
  var num = function (v, d) { var m = fmt(Math.abs(v), d); return m === fmt(0, d) ? m : (v < 0 ? MINUS : "") + m; };
  // numbers inside TeX: a comma is punctuation there, so it is braced; thin spaces become \,
  var texNum = function (v, d) { return num(v, d).replace(MINUS, "-").replace(/,/g, "{,}").replace(/[   ]/g, "\\,"); };
  var pair = function (x, y, d) { return T("cour.pair", { x: num(x, d), y: num(y, d) }); };

  /* ---------- the model: P = a - b (q1 + q2), cost c per tonne (illustrative data) ---------- */
  var A_ = 1000;     // thousand COP per tonne: the price when nothing is sold
  var B_ = 5;        // thousand COP per tonne for each extra kt on the market
  var C_ = 400;      // thousand COP per tonne: marginal cost of both plants
  var TOL = 0.01;    // kt: the staircase stops when a move changes an output by less than this
  function price(Q) { return A_ - B_ * Q; }
  function prof(qi, Q) { return (price(Q) - C_) * qi / 1000; }          // billion COP per month
  function BR(qj) { return Math.max(0, (A_ - C_ - B_ * qj) / (2 * B_)); } // best response
  function outc(q1, q2) {
    var Q = q1 + q2;
    return { q1: q1, q2: q2, Q: Q, P: price(Q), p1: prof(q1, Q), p2: prof(q2, Q), pt: prof(Q, Q) };
  }
  function iterate(tol) {                        // alternating best responses from (0, 0), firm 1 first
    var q = [0, 0], out = [], qn = (A_ - C_) / (3 * B_);
    for (var k = 1; k <= 500; k++) {
      var i = (k - 1) % 2, from = [q[0], q[1]], nq = BR(q[1 - i]), d = Math.abs(nq - q[i]);
      q[i] = nq;
      out.push({ k: k, i: i, from: from, to: [q[0], q[1]], d: d, gap: Math.max(Math.abs(q[0] - qn), Math.abs(q[1] - qn)) });
      if (d < tol) break;
    }
    return out;
  }
  var M = (function () {
    var qn = (A_ - C_) / (3 * B_), qL = (A_ - C_) / (2 * B_), Qm = (A_ - C_) / (2 * B_), Qk = (A_ - C_) / B_;
    return {
      qn: qn, nash: outc(qn, qn), stack: outc(qL, BR(qL)),
      mono: outc(Qm / 2, Qm / 2), comp: outc(Qk / 2, Qk / 2), Qm: Qm, Qk: Qk,
      moves: iterate(TOL), n10: iterate(TOL / 10).length
    };
  })();
  var NM = M.moves.length;
  var state = { sc: "c" };

  /* =====================================================================================
     "See it in motion". Every number is computed from the model above; the scans, the
     camera and the timing are illustrative.
     ===================================================================================== */
  var A = window.Anim, E = A.ease, seg = A.seg, lerp = A.lerp, clamp = A.clamp;
  var root = document.getElementById("cour-anim");
  var stage = root.querySelector(".anim-stage");
  var hudEl = document.getElementById("cour-hud");
  var cv = A.canvas(stage), ctx = cv.ctx;
  stage.appendChild(hudEl);                      // counters above the canvas
  var DUR = 54, CH = [0, 8, 18, 32, 44];
  var CHS = [{ t: 0, key: "cour.ch1" }, { t: 8, key: "cour.ch2" }, { t: 18, key: "cour.ch3.c" }, { t: 32, key: "cour.ch4.c" }, { t: 44, key: "cour.ch5" }];
  var SANS = "Helvetica Neue, Helvetica, Arimo, Arial, sans-serif";
  var TAU = Math.PI * 2;
  var C = null, HOT = "", L = {}, hudKey = "";
  var cam = { x: 0, y: 0, K: 1 };
  var font = function (w, s, it) { return (it ? "italic " : "") + w + " " + s + "px " + SANS; };

  // the time slots of the staircase: the first six moves in chapter 3, the rest while the camera zooms in
  var SLOT = (function () {
    var out = [], s = 18.8, D = [2.5, 2.3, 2.1, 2.0, 1.9, 1.8], n1 = Math.min(6, NM);
    for (var j = 0; j < n1; j++) { out.push({ s: s, d: D[j] }); s += D[j]; }
    var rest = NM - n1, dr = rest > 0 ? 8 / rest : 1;
    for (j = 0; j < rest; j++) out.push({ s: 33.4 + j * dr, d: dr });
    return out;
  })();
  var T_CONV = NM > 6 ? SLOT[NM - 1].s + SLOT[NM - 1].d : 32;   // the last move has landed
  var ZW = 3.9;                                   // deep zoom: the view is ZW times the current step wide

  /* ---------- layout ---------- */
  function captions(sc, ci) {

  /* ---------- Cournot: the staircase ---------- */

  function drawCommit(t) {                        // chapter 4: from Cournot, the leader's move and the follower's answer

  /* ---------- HUD chips ---------- */

    M.moves.forEach(function (m, j) {
      h += "<tr" + (j === NM - 1 ? " class='on'" : "") + "><td class='num'>" + m.k + "</td><td>" + T(m.i ? "cour.in.f2" : "cour.in.f1") + "</td><td class='num" + (m.i ? "" : " ex") + "'>" +
        fmt(m.to[0], 4) + "</td><td class='num" + (m.i ? " ex" : "") + "'>" + fmt(m.to[1], 4) + "</td><td class='num'>" + fmt(m.d, 4) +
        "</td><td class='num gap wide'>" + fmt(m.gap, 4) + "</td></tr>";
    });
    document.getElementById("cour-it").innerHTML = h + "</tbody>";
    var r = M.moves[NM - 1].d / M.moves[NM - 2].d;
    document.getElementById("cour-it-note").textContent = T("cour.it.note", { r: fmt(r, 3), tol: fmt(TOL), n: NM, n10: M.n10 });
  }
  function renderNotes() {
    var N = M.nash, S = M.stack, mo = M.mono, m1 = M.moves[0], m2 = M.moves[1];
    var qh = mo.q2, br = BR(qh), dev = outc(br, qh);
    document.getElementById("cour-n1").textContent = T("cour.n.p1", { qm: fmt(m1.to[0]), q2: fmt(m2.to[1]), q: fmt(N.q1) });
    document.getElementById("cour-n2").textContent = T("cour.n.p2", { pn: fmt(N.p1), pm: fmt(mo.p1), qh: fmt(qh), br: fmt(br), pd: fmt(dev.p1) });
    document.getElementById("cour-n3").textContent = T("cour.n.p3", { ql: fmt(S.q1), qf: fmt(S.q2), g: fmt(S.p1 - N.p1), l: fmt(N.p2 - S.p2) });
    document.getElementById("cour-n4").textContent = T("cour.n.p4", {
      Qc: fmt(N.Q), Qs: fmt(S.Q), Pc: fmt(N.P), Ps: fmt(S.P), Qm: fmt(M.Qm), Pm: fmt(price(M.Qm)), Qk: fmt(M.Qk), c: fmt(C_)
    });
  }

  var segBtns = document.querySelectorAll("#cour-seg button");
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      if (state.sc === b.getAttribute("data-sc")) return;
      state.sc = b.getAttribute("data-sc");
      segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      setChapters(); renderScenText(); renderStatus(); renderSolution(); renderCompare();
      if (A.reducedMotion) { player.seek(DUR); return; }
      if (player.time < CH[2]) player.refresh();
      else { player.seek(CH[2] + 0.001); player.play(); }
    });
  });

  function renderPage() {
    setChapters(); renderScenText(); renderStatus(); renderModel(); renderSolution(); renderCompare(); renderIter(); renderNotes();
    hudKey = "";
    player.refresh();
  }
  I18N.onChange(renderPage);
})();
</script>
</body>
</html>
