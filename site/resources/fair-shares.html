<style>
  [hidden] { display: none !important; }
  .hint { margin: 0 0 14px; }

  /* ---- controls ---- */
  .fctl { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 14px 28px; align-items: start; }
  @media (max-width: 760px) { .fctl { grid-template-columns: minmax(0, 1fr); } }
  .fctl .ctl { min-width: 0; }
  .ctl label { font-weight: 600; color: var(--ink); }
  .ctl output { font-size: 14px; color: var(--accent-text); }
  .ticks { grid-column: 1 / -1; position: relative; height: 16px; margin: 2px 8px 0; }
  .ticks span {
    position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap;
    font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .ticks span::before { content: ""; position: absolute; left: 50%; top: -4px; width: 1px; height: 4px; background: var(--axis); }
  .ticks span.first { transform: none; }
  .ticks span.first::before { left: 0; }
  .ticks span.last { transform: translateX(-100%); }
  .ticks span.last::before { left: auto; right: 0; }
  @media (max-width: 620px) { .ticks .opt { display: none; } }
  .ctl .seg { grid-column: 1 / -1; margin-top: 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 520px; }
  .ctl .seg button { padding: 6px 8px; font-size: 13px; line-height: 1.2; text-align: center; }
  .ctl .seg button small { display: block; font-family: var(--font-mono); font-weight: 400; font-size: 11.5px; opacity: 0.85; }
  input[type="range"] { accent-color: var(--accent); }

  /* ---- stage ---- */
  .fstage {
    margin-top: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
    padding: 12px 14px 10px; display: grid; gap: 12px;
  }
  .fhud { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  @media (max-width: 620px) {
    .fstage { padding: 8px 8px 6px; }
    .fhud { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
    .fhud .chip-stat { grid-column: span 2; }
    .fhud .chip-stat:nth-child(4), .fhud .chip-stat:nth-child(5) { grid-column: span 3; }
  }
  .chip-stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 5px 9px;
    font-size: 12px; color: var(--ink2); line-height: 1.25; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08); min-width: 0;
  }
  .chip-stat b {
    display: block; font-size: 18px; color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em; white-space: nowrap;
  }
  .chip-stat span { display: block; line-height: 1.15; overflow-wrap: anywhere; }
  .chip-stat.accent { border-color: var(--accent); }
  .chip-stat.accent b { color: var(--accent-text); }
  .chip-stat.crit b { color: var(--crit); }
  @media (max-width: 620px) {
    .chip-stat { padding: 3px 6px; font-size: 11px; }
    .chip-stat b { font-size: 15px; }
  }

  .panels { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 0 18px; }
  .panel2 .pname { display: none; }
  .panel2 .prow { grid-template-columns: minmax(0, 1fr); }
  @media (max-width: 760px) {
    .panels { grid-template-columns: minmax(0, 1fr); gap: 14px; }
    .panel2 .pname { display: block; }
    .panel2 .prow { grid-template-columns: 116px minmax(0, 1fr); }
  }
  .phead {
    margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--ink);
    min-height: 2.6em; display: flex; align-items: flex-end;
  }
  .phead span { display: block; }
  .panel1 .phead { padding-left: 160px; }
  @media (max-width: 760px) { .phead { min-height: 0; } .panel1 .phead { padding-left: 0; } }
  .prow { display: grid; grid-template-columns: 150px minmax(0, 1fr); align-items: center; height: 48px; column-gap: 10px; }
  @media (max-width: 760px) { .prow { grid-template-columns: 116px minmax(0, 1fr); height: 50px; } }
  .pname { min-width: 0; font-size: 13.5px; line-height: 1.2; color: var(--ink); }
  .pname b { display: block; font-weight: 700; line-height: 1.15; }
  .pname small { display: block; font-size: 11.5px; color: var(--muted); font-family: var(--font-mono); white-space: nowrap; }
  @media (max-width: 760px) { .pname { font-size: 12.5px; } }
  .track { position: relative; height: 100%; border-left: 1.5px solid var(--axis); --f: 0; --m: 0; }
  .track .fill {
    position: absolute; left: 0; top: 50%; height: 20px; margin-top: -10px; width: calc((100% - 5.8em) * var(--f));
    transition: width 0.22s cubic-bezier(.3, .7, .3, 1);
  }
  .panel1 .fill { background: var(--accent); }
  .panel2 .fill { background: var(--ink2); }
  .track .val {
    position: absolute; top: 50%; transform: translateY(-50%); left: calc((100% - 5.8em) * var(--f) + 6px);
    font-size: 13px; font-weight: 700; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums;
    background: var(--surface); padding: 1px 3px; margin-left: -3px;
    transition: left 0.22s cubic-bezier(.3, .7, .3, 1);
  }
  .track .val small { font-weight: 400; color: var(--muted); font-size: 11.5px; margin-left: 3px; }
  .track .mark {
    position: absolute; top: -1px; bottom: -1px; left: calc((100% - 5.8em) * var(--m)); width: 0;
    transition: left 0.22s cubic-bezier(.3, .7, .3, 1);
  }
  .panel1 .mark { border-left: 1.5px dashed var(--mit-silver); }
  .panel2 .mark { border-left: 2px dashed var(--crit); }
  .prow.worst .pname b { color: var(--crit); }

  .legend i { display: inline-block; flex: none; }
  .legend i.lx { width: 14px; height: 11px; background: var(--accent); }
  .legend i.lu { width: 14px; height: 11px; background: var(--ink2); }
  .legend i.leq { width: 0; height: 14px; border-left: 1.5px dashed var(--mit-silver); margin: 0 6px; }
  .legend i.lmin { width: 0; height: 14px; border-left: 2px dashed var(--crit); margin: 0 6px; }
  .scen-status {
    background: var(--surface2); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 3px; padding: 9px 13px; font-size: 14px; color: var(--ink2); margin: 12px 0 0;
  }
  .scen-status b { color: var(--ink); }

  /* ---- price of fairness chart ---- */
  .pf-intro { margin: 0 0 10px; color: var(--ink2); font-size: 14.5px; max-width: 80ch; }
  .pf-intro b { color: var(--ink); }
  .pfbox { position: relative; }
  svg.pf { display: block; width: 100%; height: auto; touch-action: none; cursor: crosshair; user-select: none; }
  svg.pf text { font-family: var(--font-sans); }
  .legend i.lp { width: 18px; height: 0; border-top: 2.5px solid var(--accent); }
  .legend i.lg { width: 18px; height: 0; border-top: 2px dashed var(--ink); }
  .legend i.ln { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--accent); }
  .legend b { color: var(--ink); font-variant-numeric: tabular-nums; }

  /* ---- landmark cards ---- */
  .cases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 820px) { .cases { grid-template-columns: minmax(0, 1fr); } }
  button.case {
    display: grid; gap: 8px; text-align: left; font: inherit; color: inherit; cursor: pointer; min-width: 0;
    background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--mit-silver); border-radius: 3px; padding: 11px 12px 12px;
  }
  button.case:hover { border-color: var(--ink2); border-top-color: var(--mit-silver); }
  button.case[aria-pressed="true"] { border-color: var(--accent); border-top-color: var(--accent); background: var(--sel); }
  .case h3 { margin: 0; font-size: 15px; font-weight: 700; color: var(--ink); }
  .case h3 small { font-weight: 400; color: var(--muted); font-family: var(--font-mono); font-size: 12px; margin-left: 6px; }
  .case p.cd { margin: 0; font-size: 13px; color: var(--ink2); }
  .mini { display: grid; gap: 3px; }
  .mrow { display: grid; grid-template-columns: 1.4em minmax(0, 1fr); align-items: center; gap: 6px; font-size: 12px; }
  .mrow > span { color: var(--muted); font-family: var(--font-mono); }
  .mtrack { position: relative; height: 14px; --f: 0; }
  .mtrack i { position: absolute; left: 0; top: 2px; bottom: 2px; width: calc((100% - 4.4em) * var(--f)); background: var(--ink2); }
  .mtrack em {
    position: absolute; top: 50%; transform: translateY(-50%); left: calc((100% - 4.4em) * var(--f) + 5px);
    font-style: normal; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap;
  }
  .mrow.worst > span, .mrow.worst em { color: var(--crit); }
  dl.cnum { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 10px; font-size: 12.5px; }
  dl.cnum div { min-width: 0; }
  dl.cnum dt { color: var(--muted); }
  dl.cnum dd { margin: 0; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  .cs-intro { margin: 0 0 12px; color: var(--ink2); font-size: 14.5px; max-width: 80ch; }

  /* ---- model ---- */
  .model-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 8px 22px; align-items: start; }
  @media (max-width: 860px) { .model-grid { grid-template-columns: minmax(0, 1fr); } }
  .model-grid > div { min-width: 0; }
  .mhead { margin: 12px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-text); }
  .mhead:first-child { margin-top: 0; }
  .mtext { font-size: 14px; color: var(--ink2); margin: 6px 0 0; max-width: 72ch; }
  .mtext b { color: var(--ink); }

  /* ---- solution ---- */
  .stats { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  .stat .k { font-size: 12.5px; color: var(--ink2); font-weight: 600; }
  .stat .v { color: var(--accent-text); }
  .stat .v.ink { color: var(--ink); }
  @media (max-width: 560px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .stat { padding: 10px 11px; }
    .stat .v { font-size: 21px; }
    .stat .l { font-size: 12px; }
  }
  .solcheck { font-size: 14px; color: var(--ink2); margin: 14px 0 0; }
</style>

<script>
(function () {
  "use strict";
  var T = I18N.t;
  var MINUS = "−";
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- the model: max sum U_alpha(a_i x_i)  s.t.  sum x_i = B, x >= 0 ---------- */
  var A = [180, 150, 120, 90, 60];     // households connected per COP billion (illustrative)
  var N = A.length, AMAX = Math.max.apply(null, A);
  var B_MIN = 5, B_MAX = 50;
  var SM = 1000, S_PROP = 500;         // slider positions: 0 = utilitarian, 500 = proportional, 1000 = maximin
  // nonlinear slider scale: alpha = (s / (SM - s))^2, so alpha = 1 sits in the middle and the right end is alpha -> infinity
  function alphaOf(s) { if (s <= 0) return 0; if (s >= SM) return Infinity; var r = s / (SM - s); return r * r; }
  function sOf(al) { if (al <= 0) return 0; if (!isFinite(al)) return SM; var r = Math.sqrt(al); return SM * r / (1 + r); }

  function gini(u) {
    var s = 0, tot = 0, i, j;
    for (i = 0; i < N; i++) { tot += u[i]; for (j = 0; j < N; j++) s += Math.abs(u[i] - u[j]); }
    return tot > 0 ? s / (2 * N * tot) : 0;
  }
  // closed form of the KKT conditions: x_i = B a_i^p / sum_j a_j^p with p = (1 - alpha) / alpha
  function shares(al) {
    var w = [], i, s = 0;
    if (al === 0) {                                      // limit p -> +infinity: all to the largest a_i (ties split)
      for (i = 0; i < N; i++) w.push(A[i] === AMAX ? 1 : 0);
    } else if (!isFinite(al)) {                          // limit p -> -1: x_i proportional to 1/a_i
      for (i = 0; i < N; i++) w.push(1 / A[i]);
    } else {
      var p = (1 - al) / al, lg = A.map(function (a) { return p * Math.log(a); }), mx = Math.max.apply(null, lg);
      for (i = 0; i < N; i++) w.push(Math.exp(lg[i] - mx));   // log-sum-exp: safe for tiny alpha (p in the thousands)
    }
    for (i = 0; i < N; i++) s += w[i];
    return w.map(function (v) { return v / s; });
  }
  function solve(s, B) {
    var al = alphaOf(s), sh = shares(al);
    var x = sh.map(function (v) { return B * v; }), u = x.map(function (v, i) { return A[i] * v; });
    var U = u.reduce(function (a, b) { return a + b; }, 0), imin = 0, imax = 0;
    // ties (all but municipality 1 get 0 at alpha = 0) name the last one, the least efficient
    u.forEach(function (v, i) { if (v <= u[imin] + 1e-12) imin = i; if (v > u[imax] + 1e-12) imax = i; });
    var Uu = B * AMAX;                                    // utilitarian optimum
    return {
      s: s, al: al, B: B, p: al === 0 ? Infinity : (isFinite(al) ? (1 - al) / al : -1),
      sh: sh, x: x, u: u, U: U, umin: u[imin], imin: imin, imax: imax,
      gini: gini(u), Uu: Uu, pof: (Uu - U) / Uu
    };
  }

  var state = { s: S_PROP, B: 20 };

  /* ---------- formatting ---------- */
  var fmt = function (v, d, m) { if (Math.abs(v) < 5e-10) v = 0; return I18N.fmt(v, d == null ? 2 : d, m); };
  var signed = function (v, d, neg, pos) { var m = fmt(Math.abs(v), d); return m === fmt(0, d) ? m : (v < 0 ? neg : pos) + m; };
  var num = function (v, d) { return signed(v, d, MINUS, ""); };
  // a positive amount too small for the displayed precision shows as "< 0.01", never as 0: for α > 0 every municipality gets money
  var tiny = function (v, lim) { return v > 0 && v < lim / 2 ? "< " + fmt(lim, 2) : null; };
  var hh = function (v) { return tiny(v, 0.1) || fmt(v, v < 9.95 ? 1 : 0); };   // households
  var bx = function (v) { return tiny(v, 0.01) || fmt(v, 2); };                 // COP billion
  // eps: below it a value counts as 0 (the price of fairness is a difference and carries rounding noise; shares do not)
  var pct = function (v, d, eps) {
    var dd = d == null ? 1 : d, lim = Math.pow(10, -dd);
    if (v > (eps == null ? 1e-9 : eps) && 100 * v < lim / 2) return T("fair.pct", { v: "< " + fmt(lim, dd, dd) });
    return T("fair.pct", { v: fmt(100 * v, dd, dd) });
  };
  var gfmt = function (g) { return fmt(g, 2, 2); };
  function afmt(al) {
    if (al === 0) return "0";
    if (!isFinite(al)) return "∞";
    if (al < 0.01) return fmt(al, Math.min(10, Math.ceil(-Math.log10(al)) + 1));   // two significant digits
    if (al < 0.1) return fmt(al, 3);
    if (al < 10) return fmt(al, 2);
    if (al < 100) return fmt(al, 1);
    return fmt(al, 0);
  }
  function pfmt(o) { return o.p === Infinity ? "+∞" : (o.al === Infinity ? MINUS + "1" : num(o.p, Math.abs(o.p) < 10 ? 3 : 1)); }
  // numbers inside TeX: "-" for minus and no Unicode spaces (French groups digits with a narrow no-break space)
  function tx(s) { return String(s).replace(/< /g, "{<}\\,").replace(/−/g, "-").replace(/[  ]/g, "\\,").replace(/∞/g, "\\infty "); }
  function vec(arr, f, tex) {
    var sep = T("fair.sep");
    return arr.map(function (v) { return tex ? tx(f(v)) : f(v); }).join(tex ? sep.replace(/ /g, "\\ ") : sep);
  }
  function money(v) { return T("fair.money", { v: v }); }
  function gname(i) { return T("fair.g" + (i + 1)); }
  function mun(i) { return T("fair.mun", { i: i + 1 }); }

  /* ---------- sliders ---------- */
  var aIn = $("fair-alpha"), bIn = $("fair-b");
  var TICKS = [[0, 1], [0.1, 0], [0.25, 1], [0.5, 0], [1, 1], [4, 1], [10, 0], [Infinity, 1]];   // [alpha, shown on phones]
  function renderSeg() {
    segBtns.forEach(function (b) {
      var c = b.getAttribute("data-c");
      b.innerHTML = T("fair.cs." + c) + "<small>" + T("fair.cs." + c + ".a") + "</small>";
    });
  }
  function renderTicks() {
    $("fair-ticks").innerHTML = TICKS.map(function (k, i) {
      var f = sOf(k[0]) / SM, cls = (i === 0 ? "first" : (i === TICKS.length - 1 ? "last" : "")) + (k[1] ? "" : " opt");
      return "<span class='" + cls + "' style='left:" + (100 * f).toFixed(3) + "%'>" + afmt(k[0]) + "</span>";
    }).join("");
  }
  var segBtns = document.querySelectorAll("#fair-seg button");
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () { setS(+b.getAttribute("data-s")); });
  });
  aIn.addEventListener("input", function () { setS(+aIn.value); });
  bIn.addEventListener("input", function () { state.B = +bIn.value; update(); });
  function setS(s) { state.s = Math.max(0, Math.min(SM, Math.round(s))); aIn.value = state.s; update(); }

  /* ---------- the stage: budget and households per municipality ---------- */
  function buildRows() {
    var r1 = "", r2 = "";
    for (var i = 0; i < N; i++) {
      var nm = "<div class='pname'><b>" + T("fair.gl", { i: i + 1, g: gname(i) }) + "</b><small>" + T("fair.eff", { a: fmt(A[i], 0) }) + "</small></div>";
      r1 += "<div class='prow' id='fair-r1-" + i + "'>" + nm + "<div class='track'><div class='mark'></div><div class='fill'></div><div class='val'></div></div></div>";
      r2 += "<div class='prow' id='fair-r2-" + i + "'>" + nm + "<div class='track'><div class='mark'></div><div class='fill'></div><div class='val'></div></div></div>";
    }
    $("fair-rows1").innerHTML = r1; $("fair-rows2").innerHTML = r2;
    $("fair-h1").innerHTML = T("fair.col.x");
    $("fair-h2").innerHTML = T("fair.col.u");
  }
  function renderStage(o) {
    for (var i = 0; i < N; i++) {
      var r1 = $("fair-r1-" + i), r2 = $("fair-r2-" + i), t1 = r1.querySelector(".track"), t2 = r2.querySelector(".track");
      t1.style.setProperty("--f", o.sh[i].toFixed(5));
      t1.style.setProperty("--m", (1 / N).toFixed(5));
      t1.querySelector(".val").innerHTML = bx(o.x[i]) + "<small>" + pct(o.sh[i], o.sh[i] < 0.0995 ? 1 : 0, 0) + "</small>";
      // households on a fixed scale for this budget: the most any municipality can get, B max a_i
      t2.style.setProperty("--f", (o.u[i] / o.Uu).toFixed(5));
      t2.style.setProperty("--m", (o.umin / o.Uu).toFixed(5));
      t2.querySelector(".val").textContent = hh(o.u[i]);
      var worst = o.u[i] <= o.umin * (1 + 1e-9) && o.al !== Infinity;   // relative: tiny but distinct amounts are not ties
      r1.classList.toggle("worst", worst); r2.classList.toggle("worst", worst);
    }
    var ch = function (k, v) { $("fair-c" + k).querySelector("b").textContent = v; };
    ch(0, afmt(o.al)); ch(1, hh(o.U)); ch(2, hh(o.umin)); ch(3, gfmt(o.gini)); ch(4, pct(o.pof));
  }
  function renderStatus(o) {
    // municipality 1 has the largest a_i and municipality 5 the smallest
    var k, L = N - 1;
    if (o.al === 0) k = "fair.st.util";
    else if (o.s === S_PROP) k = "fair.st.prop";
    else if (!isFinite(o.al)) k = "fair.st.maxmin";
    else k = o.al < 1 ? "fair.st.low" : "fair.st.high";
    $("fair-status").innerHTML = T(k, {
      a: afmt(o.al), p: pfmt(o), b: T("fair.money", { v: fmt(o.B, 0) }), g1: mun(0), g5: mun(L),
      x1: money(bx(o.x[0])), x5: money(bx(o.x[L])), u1: hh(o.u[0]), u5: hh(o.u[L]), U: hh(o.U), umin: hh(o.umin), pof: pct(o.pof)
    });
  }

  /* ---------- price of fairness chart (does not depend on B: the optimum scales with B) ---------- */
  var box = $("fair-pfbox"), svg = null, curve = null, CW = 0;
  var SVGNS = "http://www.w3.org/2000/svg";
  function el(tag, at, parent) {
    var e = document.createElementNS(SVGNS, tag);
    for (var k in at) e.setAttribute(k, at[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function buildChart() {
    var W = Math.max(280, Math.round(box.clientWidth)), narrow = W < 560;
    var H = narrow ? 250 : 290, m = { l: narrow ? 40 : 46, r: narrow ? 10 : 16, t: 30, b: 42 };
    CW = W;
    box.innerHTML = "";
    svg = el("svg", { class: "pf", viewBox: "0 0 " + W + " " + H, width: W, height: H, role: "img" }, box);
    var pw = W - m.l - m.r, ph = H - m.t - m.b;
    var X = function (s) { return m.l + pw * s / SM; }, Y = function (v) { return m.t + ph * (1 - v); };
    curve = { X: X, Y: Y, m: m, W: W, H: H };
    var g = el("g", {}, svg), k;
    // y grid and labels (0 to 100 %)
    for (k = 0; k <= 4; k++) {
      var v = k / 4;
      el("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: "var(--grid)", "stroke-width": 1 }, g);
      var ty = el("text", { x: m.l - 6, y: Y(v) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" }, g);
      ty.textContent = T("fair.pct", { v: fmt(100 * v, 0) });
    }
    // x ticks on the alpha scale
    TICKS.forEach(function (t, i) {
      if (narrow && !t[1]) return;
      var xx = X(sOf(t[0]));
      el("line", { x1: xx, x2: xx, y1: Y(0), y2: Y(0) + 4, stroke: "var(--axis)" }, g);
      var tt = el("text", { x: xx, y: Y(0) + 17, "text-anchor": i === 0 ? "start" : (i === TICKS.length - 1 ? "end" : "middle"), "font-size": 11, fill: "var(--muted)" }, g);
      tt.textContent = afmt(t[0]);
    });
    el("line", { x1: m.l, x2: W - m.r, y1: Y(0), y2: Y(0), stroke: "var(--axis)", "stroke-width": 1.5 }, g);
    var xl = el("text", { x: m.l + pw / 2, y: H - 6, "text-anchor": "middle", "font-size": 12, fill: "var(--ink2)" }, g);
    xl.textContent = T("fair.pf.x");
    // the three landmarks
    [[0, "fair.cs.util", "start"], [S_PROP, "fair.cs.prop", "middle"], [SM, "fair.cs.maxmin", "end"]].forEach(function (L) {
      var xx = X(L[0]);
      el("line", { x1: xx, x2: xx, y1: m.t - 6, y2: Y(0), stroke: "var(--mit-silver)", "stroke-width": 1, "stroke-dasharray": "2 3" }, g);
      var lt = el("text", { x: xx, y: m.t - 12, "text-anchor": L[2], "font-size": 11.5, "font-weight": 700, fill: "var(--ink2)" }, g);
      lt.textContent = T(L[1]);
    });
    // curves, sampled on the slider scale
    var dp = "", dg = "";
    for (var s = 0; s <= SM; s += 4) {
      var o = solve(s, 1);
      dp += (s ? "L" : "M") + X(s).toFixed(1) + " " + Y(o.pof).toFixed(1);
      dg += (s ? "L" : "M") + X(s).toFixed(1) + " " + Y(o.gini).toFixed(1);
    }
    el("path", { d: dg, fill: "none", stroke: "var(--ink)", "stroke-width": 2, "stroke-dasharray": "6 4" }, g);
    el("path", { d: dp, fill: "none", stroke: "var(--accent)", "stroke-width": 2.5 }, g);
    // current alpha
    curve.vl = el("line", { y1: m.t - 6, y2: Y(0), stroke: "var(--accent)", "stroke-width": 1.2 }, svg);
    curve.dg = el("circle", { r: 5, fill: "var(--surface)", stroke: "var(--ink)", "stroke-width": 2.5 }, svg);
    curve.dp = el("circle", { r: 5.5, fill: "var(--accent)", stroke: "var(--surface)", "stroke-width": 2 }, svg);
    // click or drag to set alpha
    var drag = false;
    function at(ev) {
      var r = svg.getBoundingClientRect(), xx = (ev.clientX - r.left) * W / r.width;
      setS((xx - m.l) / pw * SM);
    }
    svg.addEventListener("pointerdown", function (ev) { drag = true; svg.setPointerCapture(ev.pointerId); at(ev); });
    svg.addEventListener("pointermove", function (ev) { if (drag) at(ev); });
    svg.addEventListener("pointerup", function () { drag = false; });
    svg.addEventListener("pointercancel", function () { drag = false; });
  }
  function renderChart(o) {
    if (!svg || Math.abs(Math.round(box.clientWidth) - CW) > 1) buildChart();
    var X = curve.X(o.s);
    curve.vl.setAttribute("x1", X); curve.vl.setAttribute("x2", X);
    curve.dp.setAttribute("cx", X); curve.dp.setAttribute("cy", curve.Y(o.pof));
    curve.dg.setAttribute("cx", X); curve.dg.setAttribute("cy", curve.Y(o.gini));
    $("fair-lg-pof").innerHTML = T("fair.pf.lg.pof", { v: "<b>" + pct(o.pof) + "</b>" });
    $("fair-lg-gini").innerHTML = T("fair.pf.lg.gini", { v: "<b>" + gfmt(o.gini) + "</b>" });
    svg.setAttribute("aria-label", T("fair.pf.aria", { a: afmt(o.al), p: pct(o.pof), g: gfmt(o.gini) }));
  }

  /* ---------- the three landmark cases ---------- */
  var CASES = [["util", 0], ["prop", S_PROP], ["maxmin", SM]];
  function buildCases() {
    $("fair-cases").innerHTML = CASES.map(function (c) {
      var rows = "";
      for (var i = 0; i < N; i++) rows += "<div class='mrow' id='fair-m-" + c[0] + "-" + i + "'><span>" + (i + 1) + "</span><div class='mtrack'><i></i><em></em></div></div>";
      return "<button type='button' class='case' data-s='" + c[1] + "' aria-pressed='false'>" +
        "<h3>" + T("fair.cs." + c[0]) + "<small>" + T("fair.cs." + c[0] + ".a") + "</small></h3>" +
        "<p class='cd'>" + T("fair.cs." + c[0] + ".d") + "</p>" +
        "<div class='mini'>" + rows + "</div>" +
        "<dl class='cnum'>" +
        "<div><dt>" + T("fair.cs.total") + "</dt><dd data-k='U'></dd></div>" +
        "<div><dt>" + T("fair.cs.min") + "</dt><dd data-k='min'></dd></div>" +
        "<div><dt>" + T("fair.cs.gini") + "</dt><dd data-k='gini'></dd></div>" +
        "<div><dt>" + T("fair.cs.pof") + "</dt><dd data-k='pof'></dd></div>" +
        "</dl></button>";
    }).join("");
    $("fair-cases").querySelectorAll("button.case").forEach(function (b) {
      b.addEventListener("click", function () { setS(+b.getAttribute("data-s")); });
    });
  }
  function renderCases(o) {
    $("fair-cs-intro").textContent = T("fair.cs.intro", { b: T("fair.money", { v: fmt(o.B, 0) }) });
    CASES.forEach(function (c, ci) {
      var r = solve(c[1], o.B), btn = $("fair-cases").children[ci];
      for (var i = 0; i < N; i++) {
        var row = $("fair-m-" + c[0] + "-" + i), tr = row.querySelector(".mtrack");
        tr.style.setProperty("--f", (r.u[i] / r.Uu).toFixed(5));
        tr.querySelector("em").textContent = hh(r.u[i]);
        row.classList.toggle("worst", c[0] !== "maxmin" && r.u[i] <= r.umin * (1 + 1e-9));
      }
      var dd = function (k, v) { btn.querySelector("dd[data-k='" + k + "']").textContent = v; };
      dd("U", hh(r.U)); dd("min", hh(r.umin)); dd("gini", gfmt(r.gini)); dd("pof", pct(r.pof));
      btn.setAttribute("aria-pressed", String(o.s === c[1]));
    });
  }

  /* ---------- model data, solution, notes ---------- */
  function renderModel() {
    $("fair-data").textContent = T("fair.md.data", { a: vec(A, function (v) { return fmt(v, 0); }), b0: fmt(B_MIN, 0), b1: fmt(B_MAX, 0) });
    $("fair-bnote").textContent = T("fair.ctl.bnote");
  }
  function renderSolution(o) {
    $("fair-sol-title").textContent = T("fair.sol.title", { a: afmt(o.al), b: T("fair.money", { v: fmt(o.B, 0) }) });
    $("fair-sU").textContent = hh(o.U);
    $("fair-sUl").textContent = T("fair.sol.Ul", { v: pct(o.U / o.Uu), u: hh(o.Uu) });
    $("fair-sm").textContent = hh(o.umin);
    $("fair-sml").textContent = isFinite(o.al) ? T("fair.sol.minl", { g: mun(o.imin) }) : T("fair.sol.minall");
    $("fair-sg").textContent = gfmt(o.gini);
    $("fair-sgl").textContent = T("fair.sol.ginil");
    $("fair-sp").textContent = pct(o.pof);
    $("fair-spl").textContent = T("fair.sol.pofl", { u: hh(o.Uu - o.U) });
    var rel = (o.al === 0 || !isFinite(o.al)) ? "\\to" : "=";
    var pTex = o.al === 0 ? "+\\infty" : tx(pfmt(o));
    var v = {
      a: tx(afmt(o.al)), arel: isFinite(o.al) ? "=" : "\\to", rel: rel, p: pTex, B: tx(fmt(o.B, 0)),
      x: vec(o.x, bx, true), u: vec(o.u, hh, true), U: tx(hh(o.U)), m: tx(hh(o.umin))
    };
    var vp = {
      a: afmt(o.al), arel: isFinite(o.al) ? "=" : "\u2192", rel: o.al === 0 || !isFinite(o.al) ? "→" : "=", p: pfmt(o), B: fmt(o.B, 0),
      x: vec(o.x, bx), u: vec(o.u, hh), U: hh(o.U), m: hh(o.umin)
    };
    // phones: one quantity per line so the vectors keep a readable size
    var narrow = $("fair-inst").clientWidth > 0 && $("fair-inst").clientWidth < 560;
    TeX.set($("fair-inst"), T(narrow ? "fair.inst.tex.narrow" : "fair.inst.tex", v), T("fair.inst.formula", vp));
  }
  function renderNotes(o) {
    var B = o.B, u0 = solve(0, B), p1 = solve(S_PROP, B), mm = solve(SM, B), h = solve(sOf(0.5), B);
    $("fair-n1").innerHTML = T("fair.n.p1", {
      b: money(fmt(B, 0)), x: money(bx(p1.x[0])), u1: hh(p1.u[0]), u5: hh(p1.u[N - 1]), g: gfmt(p1.gini)
    });
    $("fair-n2").innerHTML = T("fair.n.p2", {
      U0: hh(u0.U), um: hh(mm.umin), Um: hh(mm.U), pof: pct(mm.pof), x5: money(bx(mm.x[N - 1])), x1: money(bx(mm.x[0]))
    });
    $("fair-n3").innerHTML = T("fair.n.p3", {
      p1: pct(p1.pof), pm: pct(mm.pof), g0: gfmt(u0.gini), g1: gfmt(p1.gini), share: pct((u0.gini - p1.gini) / u0.gini, 0),
      part: pct(p1.pof / mm.pof, 0), r: fmt(A[0] / A[N - 1], 2)
    });
    $("fair-n4").innerHTML = T("fair.n.p4", { x: vec(h.x, bx), b: money(fmt(B, 0)) });
    $("fair-n5").innerHTML = T("fair.n.p5", { pof: pct(o.pof), g: gfmt(o.gini), a: afmt(o.al) });
  }

  function update() {
    var o = solve(state.s, state.B);
    $("fair-aout").textContent = T("fair.ctl.aval", { a: afmt(o.al) });
    $("fair-bout").textContent = T("fair.money", { v: fmt(o.B, 0) });
    aIn.setAttribute("aria-valuetext", T("fair.ctl.aval", { a: afmt(o.al) }));
    bIn.setAttribute("aria-valuetext", T("fair.money", { v: fmt(o.B, 0) }));
    segBtns.forEach(function (b) { b.setAttribute("aria-pressed", String(+b.getAttribute("data-s") === state.s)); });
    renderStage(o); renderStatus(o); renderChart(o); renderCases(o); renderSolution(o); renderNotes(o);
  }
  function renderPage() {
    renderSeg(); renderTicks(); buildRows(); buildChart(); buildCases(); renderModel();
    update();
  }
  var rsz = 0;
  window.addEventListener("resize", function () {
    clearTimeout(rsz);
    rsz = setTimeout(function () { if (Math.abs(Math.round(box.clientWidth) - CW) > 1) update(); }, 120);
  });
  I18N.onChange(renderPage);
})();
</script>
</body>
</html>
