<script>
(function () {
  "use strict";
  var T = I18N.t;
  var MINUS = "−";
  var fmt = function (v, d, m) { if (Math.abs(v) < 5e-10) v = 0; return I18N.fmt(v, d == null ? 2 : d, m); };
  var f2 = function (v) { return fmt(v, 2, 2); };          // errors and alphas with two decimals
  var f1 = function (v) { return fmt(v, 1, 1); };          // forecasts in bags with one decimal
  var fa = function (a) { return fmt(a, 2); };             // a button alpha: 0.1, 0.4, 0.8
  var pct = function (v) { return T("ses.pct", { v: fmt(100 * v, 1, 1) }); };

  /* ---------- the data: weekly demand, generated from a fixed seed (illustrative) ---------- */
  var SEED = 40, N = 52, WU = 4, JUMP = 27, L1 = 120, L2 = 150, SD = 10, GAP = 10;
  var REACH = L2 - GAP;                                   // "caught up": the forecast reaches 140 bags
  var SCEN = { a1: 0.1, a4: 0.4, a8: 0.8 };
  var D = [0];                                            // D[1..N]
  (function () {
    var r = Anim.rng(SEED);
    for (var w = 1; w <= N; w++) {
      var u = r() + r() + r() + r();                      // sum of four uniforms: mean 2, variance 1/3
      D.push(Math.round((w < JUMP ? L1 : L2) + SD * Math.sqrt(3) * (u - 2)));
    }
  })();
  var F1 = 0;
  for (var w0 = 1; w0 <= WU; w0++) F1 += D[w0];
  F1 /= WU;
  function ses(a) {                                       // F[1..N+1]
    var F = [0, F1];
    for (var t = 1; t <= N; t++) F.push(a * D[t] + (1 - a) * F[t]);
    return F;
  }
  function maeOf(F, t0, t1) {
    var s = 0;
    for (var t = t0; t <= t1; t++) s += Math.abs(D[t] - F[t]);
    return s / (t1 - t0 + 1);
  }
  function maeA(a) { return maeOf(ses(a), WU + 1, N); }
  function stats(a) {
    var F = ses(a), lag = null, m = 0, v = 0, t, n = JUMP - 1 - WU;
    for (t = JUMP; t <= N; t++) if (F[t] >= REACH) { lag = t - JUMP; break; }
    for (t = WU + 1; t < JUMP; t++) m += F[t];
    m /= n;
    for (t = WU + 1; t < JUMP; t++) v += (F[t] - m) * (F[t] - m);
    return { a: a, F: F, mae: maeOf(F, WU + 1, N), pre: maeOf(F, WU + 1, JUMP - 1), post: maeOf(F, JUMP, N), lag: lag, sd: Math.sqrt(v / n) };
  }
  // best alpha: a grid on [0, 1], then golden-section search in the interval around the best grid point
  var GRID = 1000, BEST = (function () {
    var bi = 0, bv = Infinity, k, v;
    for (k = 0; k <= GRID; k++) { v = maeA(k / GRID); if (v < bv) { bv = v; bi = k; } }
    var lo = Math.max(0, (bi - 1) / GRID), hi = Math.min(1, (bi + 1) / GRID), g = (Math.sqrt(5) - 1) / 2, it = 2;
    var c = hi - g * (hi - lo), d = lo + g * (hi - lo), fc = maeA(c), fd = maeA(d);
    while (hi - lo > 1e-7) {
      if (fc < fd) { hi = d; d = c; fd = fc; c = hi - g * (hi - lo); fc = maeA(c); }
      else { lo = c; c = d; fc = fd; d = lo + g * (hi - lo); fd = maeA(d); }
      it++;
    }
    var x = (lo + hi) / 2, fx = maeA(x);
    it++;
    if (fx > bv) { x = bi / GRID; fx = bv; }
    return { a: x, mae: fx, grid: GRID + 1, it: it };
  })();
  var CURVE = [];                                         // MAE(alpha) for drawing
  for (var k0 = 0; k0 <= 200; k0++) CURVE.push([k0 / 200, maeA(k0 / 200)]);
  var cache = {};
  function scen(key) { return cache[key] || (cache[key] = stats(SCEN[key])); }
  var SB = stats(BEST.a);
  var state = { sc: "a4" };

    // the curve, traced while alpha sweeps
    var sw = t < 51 ? sweepA(t) : 1, ca = seg(t, 44.6, 44.9);
    if (ca > 0) {
      ctx.globalAlpha = u * ca; ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.lineJoin = "round";
      ctx.beginPath(); ctx.moveTo(AX(0), MY(CURVE[0][1]));
      for (var i = 1; i < CURVE.length && CURVE[i][0] <= sw; i++) ctx.lineTo(AX(CURVE[i][0]), MY(CURVE[i][1]));
      ctx.lineTo(AX(sw), MY(maeA(sw)));
      ctx.stroke(); ctx.globalAlpha = 1;
    }
    // the three buttons on the curve (the chosen one ringed)
    var ba = seg(t, 53.3, 54.2);
    if (ba > 0) {
      ["a1", "a4", "a8"].forEach(function (k) {
        var G = scen(k), X = AX(G.a), Y = MY(G.mae), me = k === state.sc;
        ctx.globalAlpha = ba;
        if (me) {
          ctx.fillStyle = C.surface; ctx.strokeStyle = C.accent; ctx.lineWidth = 2.2; circle(X, Y, 6); ctx.fill(); ctx.stroke();
        } else { ctx.fillStyle = C["mit-silver"]; circle(X, Y, 3.6); ctx.fill(); }
        ctx.globalAlpha = 1;
        label(T("ses.l.alpha", { a: fa(G.a) }), X + (k === "a1" ? 6 : 0), Y - 11, k === "a1" ? "left" : "center", me ? C.ink : C.ink2, font(me ? 700 : 400, L.fs), ba, "bottom");
      });
    }
    // the marker on the sweep, then alpha*
    if (t >= 44.6) {
      var X2 = AX(sweepA(t)), Y2 = MY(maeA(sweepA(t))), fin = seg(t, 52.8, 53.2);
      ctx.fillStyle = C.surface; circle(X2, Y2, 7.5); ctx.fill();
      ctx.fillStyle = C.accent; circle(X2, Y2, 5); ctx.fill();
      if (fin > 0) {
        ctx.globalAlpha = fin; ctx.strokeStyle = C.accent; ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]);
        ctx.beginPath(); ctx.moveTo(X2, Y2 + 8); ctx.lineTo(X2, MY(MMIN)); ctx.stroke(); ctx.setLineDash([]);
        ctx.lineWidth = 1.5; circle(X2, Y2, 9); ctx.stroke(); ctx.globalAlpha = 1;
        var q = seg(t, 53, 54.3);
        if (q > 0 && q < 1) { ctx.globalAlpha = (1 - q) * 0.8; ctx.strokeStyle = C.accent; ctx.lineWidth = 2.5; circle(X2, Y2, 9 + 22 * E.out(q)); ctx.stroke(); ctx.globalAlpha = 1; }
        label(T("ses.l.best", { a: f2(BEST.a) }), X2 + 7, Y2 + 16, "left", C["accent-text"], font(700, L.fs + 1), fin, "top");
      }
    }
  }

  /* ---------- caption ---------- */
  function drawCaption(S, t) {
    var ci = 0; CH.forEach(function (c, k) { if (t >= c) ci = k; });
    var a = ci === 0 ? seg(t, 0.3, 1) : seg(t, CH[ci] + 0.15, CH[ci] + 0.8);
    if (ci < CH.length - 1) a *= 1 - seg(t, CH[ci + 1] - 0.45, CH[ci + 1] - 0.05);
    if (t >= DUR - 1e-6) a = 1;
    if (a <= 0) return;
    var lines = captions(S, t), x = L.capX, y = L.capY, maxW = L.capW - 12;
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = C.accent; ctx.fillRect(x, y - L.ft + 2, 3, L.ft + 1);
    ctx.font = font(700, L.ft); ctx.fillStyle = C.ink; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    var tl = wrap(lines[0], maxW);
    tl.forEach(function (s, k) { ctx.fillText(s, x + 10, y + k * (L.ft + 3), maxW); });
    y += (tl.length - 1) * (L.ft + 3) + L.fs + 6;
    ctx.font = font(400, L.fs + (L.portrait ? 0 : 1)); ctx.fillStyle = C.ink2;
    wrap(lines[1], maxW).forEach(function (s) { ctx.fillText(s, x + 10, y, maxW); y += L.fs + 5; });
    ctx.restore();
  }

  /* ---------- HUD chips ---------- */
  var chips = [0, 1, 2, 3, 4, 5].map(function (i) {
    var el = document.getElementById("ses-c" + i);
    return { el: el, b: el.querySelector("b"), s: el.querySelector("span"), v: null, l: null, o: null, k: null };
  });
  function setChip(i, val, lab, op, kind) {
    var c = chips[i];
    op = Math.round(clamp(op, 0, 1) * 20) / 20;
    if (c.v !== val) { c.b.textContent = val; c.v = val; }
    if (c.l !== lab) { c.s.textContent = lab; c.l = lab; }
    if (c.o !== op) { c.el.style.opacity = op; c.o = op; }
    if (c.k !== kind) { c.el.classList.toggle("accent", kind === "acc"); c.k = kind; }
  }
  function hud(S, t) {
    var p = pAt(t), k = clamp(Math.floor(p), 1, N), n = clamp(Math.floor(lineEnd(p)), 1, N + 1);
    setChip(0, fa(S.a), T("ses.k.alpha"), seg(t, 8.6, 9.1), "acc");
    setChip(1, String(k), T("ses.k.week"), seg(t, 9.8, 10.3), "");
    setChip(2, f1(S.F[n]), T("ses.k.fc", { n: n }), seg(t, 9.3, 9.8), "");
    var kk = Math.min(k, N);
    if (kk >= WU + 1) setChip(3, f2(maeOf(S.F, WU + 1, kk)), kk === WU + 1 ? T("ses.k.mae1", { a: WU + 1 }) : T("ses.k.mae", { a: WU + 1, b: kk }), 1, "");
    else setChip(3, "0", T("ses.k.mae1", { a: WU + 1 }), 0, "");
    var sa = sweepA(t), best = t >= 53;
    setChip(4, f2(best ? BEST.a : sa), T(best ? "ses.k.best" : "ses.k.sweep"), seg(t, 44.6, 45), best ? "acc" : "");
    setChip(5, f2(best ? BEST.mae : maeA(sa)), T(best ? "ses.k.low" : "ses.k.maeA"), seg(t, 44.6, 45), best ? "acc" : "");
  }

  /* ---------- the frame ---------- */
  function render(t) {
    C = A.colors();
    HOT = C.accent.toLowerCase() === C["mit-bright"].toLowerCase() ? C.crit : C["mit-bright"];
    var S = scen(state.sc);
    hud(S, t);
    if (hudKey !== cv.w + "x" + cv.h + ":" + hudEl.offsetHeight + ":" + hudEl.offsetWidth) layout();
    ctx.clearRect(0, 0, L.W, L.H);
    ctx.fillStyle = C.surface; ctx.fillRect(0, 0, L.W, L.H);
    ctx.lineCap = "butt"; ctx.lineJoin = "round"; ctx.setLineDash([]);
    var P = panels(t), V = view(t), M = mapper(P.ts, V);
    drawAxesTS(t, P, V, M);
    ctx.save(); ctx.beginPath(); ctx.rect(P.ts.x0 - 2, 0, P.ts.x1 - P.ts.x0 + 4, L.H); ctx.clip();
    drawWarm(t, P, M);
    drawLevel(t, M);
    drawDemand(t, M);
    drawForecast(S, t, P, M);
    ctx.restore();
    drawStrip(S, t, P, V);
    drawMaePanel(S, t, P);
    drawCaption(S, t);
  }

  layout();
  var player = A.create({
    root: root,
    duration: DUR,
    chapters: CH.map(function (c, k) { return { t: c, key: "ses.ch" + (k + 1) }; }),
    onResize: function () { cv.fit(); layout(); },
    render: render
  });

  /* =====================================================================================
     Page text: status line, model, results, notes
     ===================================================================================== */
  function lagText(S) { return S.lag == null ? T("ses.st.never") : T("ses.st.lag", { wk: weeks(S.lag) }); }
  function above(S) { return S.mae - BEST.mae < 5e-7 ? null : pct(S.mae / BEST.mae - 1); }
  function renderSeg() {
    document.querySelectorAll("#ses-seg button").forEach(function (b) { b.textContent = T("ses.sc", { a: fa(SCEN[b.getAttribute("data-sc")]) }); });
  }
  function renderScenText() {
    var S = scen(state.sc);
    stage.setAttribute("aria-label", T("ses.anim.aria") + " " + T("ses.anim.aria.nums", {
      a: fa(S.a), m: f2(S.mae), n: N + 1, f: f1(S.F[N + 1]), mb: f2(BEST.mae), ab: f2(BEST.a)
    }));
    var ab = above(S);
    document.getElementById("ses-status").innerHTML = T("ses.st", {
      a: fa(S.a), m: f2(S.mae), w1: WU + 1, n: N, pct: ab || T("ses.st.best"), ab: f2(BEST.a), mb: f2(BEST.mae),
      b: REACH, lag: lagText(S), sd: f1(S.sd)
    });
  }
  function renderModel() {
    document.getElementById("ses-lg-warm").textContent = T("ses.lg.warm", { w: WU });
    document.getElementById("ses-data").textContent = T("ses.model.data", {
      n: N, l1: L1, l2: L2, s0: JUMP - 1, s: JUMP, sd: SD, seed: SEED
    });
    var parts = [], tex = [];
    for (var w = 1; w <= WU; w++) { parts.push(String(D[w])); tex.push(String(D[w])); }
    TeX.set(document.getElementById("ses-init"), T("ses.init.tex", { w: WU, sum: tex.join(" + "), f1: fmt(F1, 2) }),
      T("ses.init.formula", { w: WU, sum: parts.join(" + "), f1: fmt(F1, 2) }));
    document.getElementById("ses-init-why").textContent = T("ses.init.why", { w: WU, w1: WU + 1 });
    var a1 = SCEN.a1, a8 = SCEN.a8;
    document.getElementById("ses-wts-why").textContent = T("ses.wts.why", {
      a1: fa(a1), w1: fmt(a1, 3), w8: fmt(a1 * Math.pow(1 - a1, 4), 3), a8: fa(a8), v1: fmt(a8, 3), v8: fmt(a8 * Math.pow(1 - a8, 4), 3)
    });
    var ov = { cnt: N - WU, w1: WU + 1, n: N };
    TeX.set(document.getElementById("ses-opt"), T("ses.opt.tex", ov), T("ses.opt.formula", ov));
  }
  function renderResults() {
    var S = scen(state.sc), ab = above(S);
    document.getElementById("ses-res-title").textContent = T("ses.res.title", { a: fa(S.a) });
    document.getElementById("ses-sb").textContent = fmt(BEST.a, 3, 3);
    document.getElementById("ses-sbl").textContent = T("ses.res.bestL", { w1: WU + 1, n: N });
    document.getElementById("ses-sm").textContent = f2(BEST.mae);
    document.getElementById("ses-smk").textContent = T("ses.res.mine", { a: fa(S.a) });
    document.getElementById("ses-sa").textContent = f2(S.mae);
    document.getElementById("ses-sal").textContent = ab ? T("ses.res.mineL", { pct: ab }) : T("ses.res.mineBest");
    document.getElementById("ses-sfk").textContent = T("ses.res.fc", { n: N + 1 });
    document.getElementById("ses-sf").textContent = f1(S.F[N + 1]);
    document.getElementById("ses-sfl").textContent = T("ses.res.fcL", { a: fa(S.a), fb: f1(SB.F[N + 1]) });
    document.getElementById("ses-how").textContent = T("ses.res.how", { g: fmt(BEST.grid, 0), it: BEST.it });
    var h = "<thead><tr><th>" + T("ses.tb.alpha") + "</th><th class='num'>" + T("ses.tb.mae", { w1: WU + 1, n: N }) + "</th><th class='num wide'>" +
      T("ses.tb.pre") + "</th><th class='num wide'>" + T("ses.tb.post") + "</th><th class='num'>" + T("ses.tb.lag", { b: REACH }) + "</th><th class='num'>" +
      T("ses.tb.sd") + "</th></tr></thead><tbody>";
    var rows = [["a1", scen("a1"), fa(0.1)], ["a4", scen("a4"), fa(0.4)], ["a8", scen("a8"), fa(0.8)], ["best", SB, T("ses.tb.best") + " " + fmt(BEST.a, 3, 3)], ["naive", stats(1), T("ses.tb.naive")]];
    rows.forEach(function (r) {
      var s = r[1], cls = r[0] === state.sc ? " class='mine'" : (r[0] === "best" ? " class='best'" : "");
      h += "<tr" + cls + "><td>" + r[2] + "</td><td class='num'>" + f2(s.mae) + "</td><td class='num wide'>" + f2(s.pre) + "</td><td class='num wide'>" +
        f2(s.post) + "</td><td class='num'>" + (s.lag == null ? T("ses.tb.never") : s.lag) + "</td><td class='num'>" + f1(s.sd) + "</td></tr>";
    });
    document.getElementById("ses-tbl").innerHTML = h + "</tbody>";
    document.getElementById("ses-tbl-note").textContent = T("ses.tb.note", { w1: WU + 1, s0: JUMP - 1, s: JUMP, n: N, b: REACH, gap: GAP });
  }
  function renderNotes() {
    var s1 = scen("a1"), s4 = scen("a4"), s8 = scen("a8"), nv = stats(1);
    var lagW = function (S) { return S.lag == null ? T("ses.tb.never") : weeks(S.lag); };
    document.getElementById("ses-n1").textContent = T("ses.n.p1", { a1: fa(s1.a), k1: lagW(s1), b: REACH, a4: fa(s4.a), k4: lagW(s4) });
    document.getElementById("ses-n2").textContent = T("ses.n.p2", { a8: fa(s8.a), s8: f1(s8.sd), s1: f1(s1.sd), a1: fa(s1.a) });
    document.getElementById("ses-n3").textContent = T("ses.n.p3", { ab: f2(BEST.a), mb: f2(BEST.mae), m1: f2(s1.mae), m4: f2(s4.mae), m8: f2(s8.mae), mn: f2(nv.mae) });
  }

  var segBtns = document.querySelectorAll("#ses-seg button");
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      if (state.sc === b.getAttribute("data-sc")) return;
      state.sc = b.getAttribute("data-sc");
      segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      renderScenText(); renderResults();
      if (A.reducedMotion) { player.seek(DUR); return; }
      if (player.time < CH[1] || player.time >= DUR - 1e-6) player.refresh();
      else { player.seek(CH[1] + 0.001); player.play(); }
    });
  });

  function renderPage() {
    renderSeg(); renderScenText(); renderModel(); renderResults(); renderNotes();
    hudKey = "";
    player.refresh();
  }
  I18N.onChange(renderPage);
})();
</script>
</body>
</html>
