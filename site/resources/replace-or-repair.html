<script>
(function () {

  var fmtD = function (v) { return fmt(v, v >= 10 ? 1 : v >= 1 ? 2 : v >= 0.1 ? 3 : 4); };   // a change or a gap
  var fmtP = function (v) { return fmt(v, 1); };

  /* ---------- the model (illustrative data, million COP per quarter) ---------- */
  var N = 6;
  var COST = [4, 6, 10, 16, 25, 50];        // running and maintenance cost c(x) of keeping the roaster in state x
  var RCOST = 22;                           // replacement R (new roaster minus the resale of the old one)
  var PK = [0.7, 0.2, 0.1];                 // kept: stay, up one state, up two states (never past 5)
  var TOL = 0.01;                           // stopping tolerance on the largest change
  var BETA = { lo: 0.5, hi: 0.95 };
  var P = [];
  (function () {
    for (var x = 0; x < N; x++) {
      var row = []; for (var y = 0; y < N; y++) row.push(0);
      if (x === N - 1) row[x] = 1;
      else PK.forEach(function (q, d) { row[Math.min(x + d, N - 1)] += q; });
      P.push(row);
    }
  })();
  function bell(V, b) {                     // one application of the Bellman operator
    var s0 = 0, y, x, qk = [], v = [], pol = [];
    for (y = 0; y < N; y++) s0 += P[0][y] * V[y];
    var qr = RCOST + COST[0] + b * s0;
    for (x = 0; x < N; x++) {
      var s = 0; for (y = 0; y < N; y++) s += P[x][y] * V[y];
      qk.push(COST[x] + b * s);
      pol.push(qr < qk[x] - 1e-12);       // replace only when strictly cheaper
      v.push(Math.min(qk[x], qr));
    }
    return { qk: qk, qr: qr, v: v, pol: pol };
  }
  function thrOf(pol) { for (var x = 0; x < N; x++) if (pol[x]) return x; return N; }
  function solveLin(A, r) {                 // Gaussian elimination with partial pivoting
    var n = r.length, M = A.map(function (row, i) { return row.slice().concat([r[i]]); }), i, j, k;
    for (i = 0; i < n; i++) {
      var p = i; for (k = i + 1; k < n; k++) if (Math.abs(M[k][i]) > Math.abs(M[p][i])) p = k;
      var tmp = M[i]; M[i] = M[p]; M[p] = tmp;
      for (k = i + 1; k < n; k++) { var f = M[k][i] / M[i][i]; for (j = i; j <= n; j++) M[k][j] -= f * M[i][j]; }
    }

    var A = [], r = [];

  /* ---------- the heat map of V_k(x) ---------- */
  function rowGeom(S, t) {
    var kf = kF(S, t), top = heatTop(t), bot = L.hy1, rows = Math.max(12, kf);

  /* ---------- desktop inset: largest change on a log scale, then policy iteration ---------- */
  function drawInset(S, t) {

    drawPolicy(S, t);
    drawInset(S, t);
    drawCaption(S, t);
  }

  layout();
  var player = A.create({
    root: root,
    duration: DUR,
    chapters: CH.map(function (c, k) { return { t: c, key: "mdp.ch" + (k + 1) }; }),
    onResize: function () { cv.fit(); fitHud(); layout(); },
    render: render
  });

  /* =====================================================================================
     Page text: controls, status, model data, solution, policy iteration, notes
     ===================================================================================== */
  function scenName(key) { return T("mdp.sc." + key, { b: fmt(BETA[key], 2) }); }
  function polHtml(pol) {
    return "<span class='pol'>" + pol.map(function (r) { return "<i" + (r ? " class='r'" : "") + ">" + T(r ? "mdp.l.repS" : "mdp.l.keepS") + "</i>"; }).join("") + "</span>";
  }
  function renderStatic() {
    document.querySelectorAll("#mdp-seg button").forEach(function (b) { b.textContent = scenName(b.getAttribute("data-sc")); });
    document.getElementById("mdp-intro").textContent = T("mdp.anim.intro", { tol: fmt(TOL, 2) });
    document.getElementById("mdp-lg-ks").textContent = T("mdp.l.keepS");
    document.getElementById("mdp-lg-rs").textContent = T("mdp.l.repS");
    document.getElementById("mdp-lg-keep").textContent = T("mdp.lg.keep", { s: T("mdp.l.keepS") });
    document.getElementById("mdp-lg-rep").textContent = T("mdp.lg.rep", { s: T("mdp.l.repS") });
    document.getElementById("mdp-data").textContent = T("mdp.data", {
      c: COST.map(function (v) { return fmt(v, 0); }).join("; "), R: fmt(RCOST, 0), rc: fmt(RCOST + COST[0], 0),
      p0: fmtP(PK[0]), p1: fmtP(PK[1]), p2: fmtP(PK[2]), tol: fmt(TOL, 2)
    });
    var h = "<thead><tr><th class='num'>" + T("mdp.tbl.x") + "</th><th>" + T("mdp.tbl.cond") + "</th><th class='num'>" + T("mdp.tbl.c") +
      "</th><th class='num'>" + T("mdp.tbl.p0") + "</th><th class='num'>" + T("mdp.tbl.p1") + "</th><th class='num'>" + T("mdp.tbl.p2") + "</th></tr></thead><tbody>";
    for (var x = 0; x < N; x++) {
      var pr = [0, 1, 2].map(function (d) { return x + d < N ? P[x][x + d] : 0; });
      h += "<tr><td class='num'>" + x + "</td><td>" + T("mdp.cond." + x) + "</td><td class='num'>" + fmt(COST[x], 0) + "</td>" +
        pr.map(function (q) { return "<td class='num'>" + fmtP(q) + "</td>"; }).join("") + "</tr>";
    }
    document.getElementById("mdp-dtab").innerHTML = h + "</tbody>";
    renderNotes();
  }
  function renderScen() {
    var S = scen(state.sc), b = fmt(S.b, 2);
    stage.setAttribute("aria-label", T("mdp.anim.aria") + " " + T("mdp.anim.aria.nums", {
      b: b, K: S.K, d: fmtD(S.sup[S.K]), m: S.m, v0: fmt(S.ex[0], 1), pi: S.steps.length
    }));
    document.getElementById("mdp-status").innerHTML = T("mdp.st", {
      b: b, K: S.K, d: fmtD(S.sup[S.K]), tol: fmt(TOL, 2), m1: S.m - 1, m: S.m, v0: fmt(S.ex[0], 1)
    });
    // solution
    document.getElementById("mdp-sol-title").textContent = T("mdp.sol.title", { b: b });
    document.getElementById("mdp-s-thr").textContent = thrTxt(S.m);
    document.getElementById("mdp-s-thrl").textContent = T("mdp.sol.thrL", { m1: S.m - 1, m: S.m });
    document.getElementById("mdp-s-k").textContent = String(S.K);
    document.getElementById("mdp-s-kl").textContent = T("mdp.sol.KL", { d: fmtD(S.sup[S.K]), tol: fmt(TOL, 2) });
    document.getElementById("mdp-s-v0").textContent = fmt(S.ex[0], 1);
    document.getElementById("mdp-s-gap").textContent = fmtD(S.gap);
    document.getElementById("mdp-s-gapl").textContent = T("mdp.sol.gapL", { bnd: fmtD(S.bnd) });
    var h = "<thead><tr><th class='num'>" + T("mdp.tbl.x") + "</th><th class='num wide'>" + T("mdp.sol.vk") + "</th><th class='num'>" + T("mdp.sol.vex") +
      "</th><th class='num'>" + T("mdp.sol.qk") + "</th><th class='num'>" + T("mdp.sol.qr") + "</th><th>" + T("mdp.sol.dec") + "</th></tr></thead><tbody>";
    for (var x = 0; x < N; x++) {
      var rep = S.chk.pol[x];
      h += "<tr" + (x === S.m - 1 ? " class='last'" : "") + "><td class='num'>" + x + "</td><td class='num wide'>" + fmt(S.Vs[S.K][x], 3) + "</td><td class='num'>" +
        fmt(S.ex[x], 3) + "</td><td class='num" + (rep ? "" : " best") + "'>" + fmt(S.chk.qk[x], 3) + "</td><td class='num" + (rep ? " best" : "") + "'>" +
        fmt(S.chk.qr, 3) + "</td><td class='dec" + (rep ? " rep" : "") + "'>" + T(rep ? "mdp.sol.rep" : "mdp.sol.keep") + "</td></tr>";
    }
    document.getElementById("mdp-stab").innerHTML = h + "</tbody>";
    // policy iteration
    h = "<thead><tr><th class='num'>" + T("mdp.pit.step") + "</th><th>" + T("mdp.pit.pol") + "</th><th class='num'>" + T("mdp.pit.v0") +
      "</th><th>" + T("mdp.pit.chg") + "</th></tr></thead><tbody>";
    S.steps.forEach(function (st, i) {
      h += "<tr><td class='num'>" + i + "</td><td>" + polHtml(st.pol) + "</td><td class='num'>" + fmt(st.V[0], 1) + "</td><td>" +
        (st.chg.length ? st.chg.join(", ") : T("mdp.pit.none")) + "</td></tr>";
    });
    document.getElementById("mdp-ptab").innerHTML = h + "</tbody>";
    document.getElementById("mdp-pnote").textContent = T("mdp.pit.note", { n: S.steps.length, K: S.K, gap: fmtD(S.gap) });
  }
  function renderNotes() {
    var lo = scen("lo"), hi = scen("hi"), arrow = " → ";
    var seqTxt = function (S) { return S.seq.map(function (m) { return T("mdp.l.thr", { m: m }); }).join(arrow); };
    document.getElementById("mdp-n1").textContent = T("mdp.n.p1", { slo: seqTxt(lo), shi: seqTxt(hi), blo: fmt(lo.b, 2), bhi: fmt(hi.b, 2) });
    document.getElementById("mdp-n2").textContent = T("mdp.n.p2", { bhi: fmt(hi.b, 2), blo: fmt(lo.b, 2), mhi: hi.m, mlo: lo.m });
    document.getElementById("mdp-n3").textContent = T("mdp.n.p3", { Klo: lo.K, Khi: hi.K, blo: fmt(lo.b, 2), bhi: fmt(hi.b, 2), kst: hi.kst });
    document.getElementById("mdp-n4").textContent = T("mdp.n.p4", { bhi: fmt(hi.b, 2), bnd: fmtD(hi.bnd), gap: fmtD(hi.gap), pi: hi.steps.length });
  }

  var segBtns = document.querySelectorAll("#mdp-seg button");
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      if (state.sc === b.getAttribute("data-sc")) return;
      state.sc = b.getAttribute("data-sc");
      segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      renderScen();
      if (A.reducedMotion) { player.seek(DUR); return; }
      if (player.time < CH[2]) player.refresh();
      else { player.seek(CH[2] + 0.001); player.play(); }
    });
  });

  function renderPage() {
    renderStatic(); renderScen();
    fitHud();
    hudKey = "";
    player.refresh();
  }
  I18N.onChange(renderPage);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fitHud(); hudKey = ""; player.refresh(); });
})();
</script>
</body>
</html>
