<script>
(function () {
  "use strict";
  var T = I18N.t;
  var MINUS = "−";
  var fmt = function (v, d, m) { if (Math.abs(v) < 5e-10) v = 0; return I18N.fmt(v, d == null ? 2 : d, m); };
  var signed = function (v, d, neg, m) { var s = fmt(Math.abs(v), d, m); return s === fmt(0, d, m) ? s : (v < 0 ? neg : "") + s; };
  var num = function (v, d, m) { return signed(v, d, MINUS, m); };         // U+2212 for negatives
  var texNum = function (v, d, m) { return signed(v, d, "-", m); };
  var cnt = function (v) { return I18N.fmt(v, 0); };
  var pair = function (x, y, d, m) { return T("chord.pair", { x: num(x, d, m), y: num(y, d, m) }); };
  var pairTex = function (x, y, d, m) { return T("chord.pairTex", { x: texNum(x, d, m), y: texNum(y, d, m) }); };
  var ofN = function (k, n) { return T("chord.k.of", { k: cnt(k), n: cnt(n) }); };

  /* =====================================================================================
     The shapes. Functions: f1 is convex, f2 has two valleys. Sets: C1 is a sheared ellipse,
     C2 is the union of two overlapping disks. All four are illustrative.
     ===================================================================================== */
  var M = 200;                                   // each chord is checked at M + 1 evenly spaced points
  var TOL = 1e-9;
  var D1 = [-1.6, 2.9], D2 = [-2.2, 2.1];        // domains of f1 and f2
  var K1 = { c: [-0.5, 0.9], r: 0.85 }, K2 = { c: [0.45, -0.55], r: 1 };   // the two disks of C2
  var NRUN = 6;                                  // descents per shape
  var SEEDS = {                                  // Anim.rng seeds of each group of chords and of the descents
    fn: { g1: 11, g2: 175, g3: 21, g4: 5, run: 3 },
    sets: { g1: 12, g2: 9, g3: 22, g4: 6, run: 4 }
  };

  function f1(x) { return x * x / 2 + Math.exp(-x); }
  function d1(x) { return x - Math.exp(-x); }
  function f2(x) { return x * x * x * x / 2 - 2 * x * x + x / 2 + 3; }
  function d2(x) { return 2 * x * x * x - 4 * x + 0.5; }
  function g1(x, y) { var u = y - x / 2; return x * x + u * u / 2 - 1; }          // C1: g1 <= 0
  function g2(x, y) {                                                            // C2: g2 <= 0 (signed distance)
    return Math.min(Math.hypot(x - K1.c[0], y - K1.c[1]) - K1.r, Math.hypot(x - K2.c[0], y - K2.c[1]) - K2.r);

    set("chord-r1k", T("chord.res.nc." + k)); set("chord-r1", ofN(t1.v, t1.n)); set("chord-r1l", T(fn ? "chord.res.ncL" : "chord.res.ncL.sets", { a: cnt(t1.v1), b: cnt(t1.v3) }));
    var F = S.feat, fx = F ? F.A[0] + F.wu * (F.B[0] - F.A[0]) : 0, fy = F ? F.A[1] + F.wu * (F.B[1] - F.A[1]) : 0;
    set("chord-r2", F ? fmt(F.measure) : fmt(0));
    set("chord-r2l", F ? T("chord.res.worstL." + k, { x: num(fx), p: pair(fx, fy) }) : "");
    // minima
    var gm0 = S.gmin[0], gm1 = S.gmin[1], te = trapEnd(S, 1);
    var val = function (P) { return fn ? P[1] : P[1]; };
    set("chord-r3k", T("chord.res.min0." + k)); set("chord-r3", pair(gm0[0], gm0[1]));
    set("chord-r3l", T("chord.res.min0L." + k, { n: ofN(NRUN - t0.trap, NRUN) }));
    set("chord-r4k", T("chord.res.min1." + k)); set("chord-r4", pair(gm1[0], gm1[1]));
    set("chord-r4l", T("chord.res.min1L." + k, { n: ofN(NRUN - t1.trap, NRUN) }));
    set("chord-r5k", T("chord.res.loc." + k)); set("chord-r5", te ? pair(te[0], te[1]) : MINUS);
    set("chord-r5l", te ? T("chord.res.locL." + k, { n: ofN(t1.trap, NRUN), d: fmt(val(te) - val(gm1)) }) : "");
    // the largest failure, in numbers
    set("chord-check-p", T("chord.res.check." + k));
    if (!F) return;
    var th = 1 - F.wu, v, vp;
    if (fn) {
      var o = S.O[1], cy = th * o.f(F.A[0]) + (1 - th) * o.f(F.B[0]);
      v = { a: texNum(F.A[0], 3, 3), b: texNum(F.B[0], 3, 3), th: texNum(th, 3, 3), x: texNum(fx, 3, 3), fx: texNum(o.f(fx), 3, 3), cy: texNum(cy, 3, 3) };
      vp = { a: num(F.A[0], 3, 3), b: num(F.B[0], 3, 3), th: num(th, 3, 3), x: num(fx, 3, 3), fx: num(o.f(fx), 3, 3), cy: num(cy, 3, 3) };
    } else {
      var e1 = Math.hypot(fx - K1.c[0], fy - K1.c[1]), e2 = Math.hypot(fx - K2.c[0], fy - K2.c[1]);
      v = { a: pairTex(F.A[0], F.A[1], 3, 3), b: pairTex(F.B[0], F.B[1], 3, 3), th: texNum(th, 3, 3), p: pairTex(fx, fy, 3, 3),
        e1: texNum(e1, 3, 3), r1: texNum(K1.r), e2: texNum(e2, 3, 3), r2: texNum(K2.r) };
      vp = { a: pair(F.A[0], F.A[1], 3, 3), b: pair(F.B[0], F.B[1], 3, 3), th: num(th, 3, 3), p: pair(fx, fy, 3, 3),
        e1: num(e1, 3, 3), r1: num(K1.r), e2: num(e2, 3, 3), r2: num(K2.r) };
    }
    TeX.set(document.getElementById("chord-inst"), T("chord.inst." + k + ".tex", v), T("chord.inst." + k + ".formula", vp));
  }
  function renderLog() {
    var S = scen(state.sc), k = S.key, fn = isFn();
    document.getElementById("chord-log-intro").textContent = T("chord.log.intro." + k, { m: cnt(M + 1) });
    var f2d = function (v) { var m = I18N.fmt(Math.abs(v), 2, 2); return (v < 0 && m !== I18N.fmt(0, 2, 2) ? MINUS : "") + m; };
    var pt = function (P) { return fn ? f2d(P[0]) : T("chord.pair", { x: f2d(P[0]), y: f2d(P[1]) }); };
    var h = "<thead><tr><th class='num'>#</th><th>" + T("chord.log.shape") + "</th><th class='num wide'>" + T("chord.log.from." + k) +
      "</th><th class='num wide'>" + T("chord.log.to." + k) + "</th><th class='num'>" + T("chord.log.meas." + k) + "</th><th>" +
      T("chord.log.verdict") + "</th></tr></thead><tbody>";
    var i = 0;
    S.chords.forEach(function (c) {
      if (!c.big) return;
      i++;
      h += "<tr" + (i === 8 ? " class='split'" : "") + "><td class='num'>" + cnt(i) + "</td><td>" + T("chord.h." + (c.p ? "nc." : "cv.") + k) +
        "</td><td class='num wide'>" + pt(c.A) + "</td><td class='num wide'>" + pt(c.B) + "</td><td class='num'>" + fmt(c.measure, 3, 3) +
        "</td><td class='" + (c.bad ? "fail" : "pass") + "'>" + T(c.bad ? "chord.log.fails" : "chord.log.passes") + "</td></tr>";
    });
    document.getElementById("chord-log").innerHTML = h + "</tbody>";
    var t1 = S.tot[1];
    document.getElementById("chord-log-note").textContent = T("chord.log.note." + k, { v: cnt(t1.v1), n: cnt(7) });
  }
  function renderNotes() {
    var S = scen(state.sc), k = S.key, t0 = S.tot[0], t1 = S.tot[1], te = trapEnd(S, 1), gm1 = S.gmin[1];
    var v = {
      n0: cnt(t0.n), n1: cnt(t1.n), v1: cnt(t1.v), m: cnt(M + 1), r: cnt(NRUN), tr: cnt(t1.trap),
      loc: te ? pair(te[0], te[1]) : "", glob: pair(gm1[0], gm1[1]), d: te ? fmt(te[1] - gm1[1]) : ""
    };
    ["n1", "n2", "n3", "n4"].forEach(function (id, i) {
      document.getElementById("chord-" + id).textContent = T("chord.n.p" + (i + 1) + "." + k, v);
    });
  }

  var segBtns = document.querySelectorAll("#chord-seg button");
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      if (state.sc === b.getAttribute("data-sc")) return;
      state.sc = b.getAttribute("data-sc");
      segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      renderScenText(); renderStatus(); renderResults(); renderLog(); renderNotes();
      if (A.reducedMotion) { player.seek(DUR); return; }
      if (player.time < 0.5) player.refresh();
      else { player.seek(0.001); player.play(); }
    });
  });

  function renderPage() {
    renderScenText(); renderStatus(); renderData(); renderResults(); renderLog(); renderNotes();
    hudKey = "";
    player.refresh();
  }
  I18N.onChange(renderPage);
})();
</script>
