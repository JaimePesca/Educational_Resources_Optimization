<script>
(function () {
  "use strict";
  var T = I18N.t;
  var A = window.Anim, E = A.ease, seg = A.seg, lerp = A.lerp, clamp = A.clamp;
  var fmt = function (v, d, m) { if (Math.abs(v) < 5e-10) v = 0; return I18N.fmt(v, d == null ? 2 : d, m); };
  var fx = function (v, d) { return fmt(v, d, d); };             // fixed number of decimals
  // numbers inside TeX: no digit grouping (a grouping comma or space would read as a decimal comma or break the math)
  var texNum = function (v, d) {
    var s = (+v).toFixed(d), dec = I18N.fmt(1.5, 1).charAt(1);
    return dec === "." ? s : s.replace(".", dec);
  };

  /* =====================================================================================
     The queue: one toll booth (a single server), Poisson arrivals, three service laws
     ===================================================================================== */
  var TAU = 0.5;                                  // mean service time, minutes (30 s): illustrative
  var MU = 1 / TAU;                               // services per minute
  var RHOS = [0.7, 0.9, 0.97];                    // the three loads
  var CSV = { det: 0, exp: 1, hyp: 1.5 };         // coefficient of variation of the service time
  var NCUST = 1000000;                            // cars per load in the long run
  var NB = 20, T975 = 2.093;                      // batch means: 20 batches, Student t with 19 df
  var K0 = 200000;                                // the week shown starts after this many cars
  var HOR = 7 * 24 * 60;                          // the week shown, in minutes
  var SEED_A = 7100, SEED_S = 9300;               // seeds of the arrival and service streams
  // balanced two-phase hyperexponential with mean TAU and coefficient of variation cs
  function h2p(cs) { var c2 = cs * cs; return 0.5 * (1 + Math.sqrt((c2 - 1) / (c2 + 1))); }
  var P2 = h2p(CSV.hyp), M1 = TAU / (2 * P2), M2 = TAU / (2 * (1 - P2));
  function kfac(cs) { return (1 + cs * cs) / 2; }
  function exactW(rho, cs) { return rho / (1 - rho) * kfac(cs) * TAU + TAU; }   // Pollaczek-Khinchine
  function mm1W(rho) { return 1 / (MU - rho * MU); }                              // 1/(mu - lambda)

  // one long run: Lindley recursion, then a sweep over arrivals and departures for the time average.
  // The run is split into slices of about `budget` cars (step returns null until the run is finished) so
  // that choosing a scenario never freezes the page; the arithmetic and its order are those of one long loop.
  function simJob(ir, cs) {
    var rho = RHOS[ir], lam = rho / TAU, ra = A.rng(SEED_A + ir), rs = A.rng(SEED_S + ir);
    var N = NCUST, AA = new Float64Array(N), DD = new Float64Array(N);
    var a = 0, dp = 0, sumW = 0, sumS = 0, bs = N / NB, bW = new Float64Array(NB), i = 0, phase = 0;
    var Lx = Math.round(exactW(rho, cs) * lam), n = 0, area = 0, tl = 0, j = 0, i0 = -1;
    return function step(budget) {
      var S, d, w, end;
      if (phase === 0) {
        for (end = Math.min(N, i + budget); i < end; i++) {
          a += -Math.log(1 - ra()) / lam;
          if (cs === 0) S = TAU;
          else if (cs === 1) S = -TAU * Math.log(1 - rs());
          else { var u1 = rs(), u2 = rs(); S = -(u1 < P2 ? M1 : M2) * Math.log(1 - u2); }
          d = (a > dp ? a : dp) + S;
          AA[i] = a; DD[i] = d; dp = d;
          w = d - a; sumW += w; sumS += S; bW[(i / bs) | 0] += w;
        }
        if (i === N) { phase = 1; i = 0; }
        return null;
      }
      // time average of N(t): merge the arrivals and the departures (a departure first on a tie)
      for (end = Math.min(N, j + budget); j < end;) {
        if (i < N && AA[i] < DD[j]) {
          if (i0 < 0 && i >= K0 && n === Lx) i0 = i;        // the week shown starts at the long-run level
          area += n * (AA[i] - tl); tl = AA[i]; n++; i++;
        } else { area += n * (DD[j] - tl); tl = DD[j]; n--; j++; }
      }
      return j < N ? null : finish(rho, cs, lam, N, AA, DD, sumW, sumS, bW, bs, area, i0);
    };
  }
  function finish(rho, cs, lam, N, AA, DD, sumW, sumS, bW, bs, area, i0) {
    if (i0 < 0) i0 = K0;
    var Tend = DD[N - 1], W = sumW / N, mb = 0, sd = 0, k;
    for (k = 0; k < NB; k++) mb += bW[k] / bs / NB;
    for (k = 0; k < NB; k++) sd += Math.pow(bW[k] / bs - mb, 2) / (NB - 1);
    var ci = T975 * Math.sqrt(sd) / Math.sqrt(NB);
    // the week shown: every car in the system at its start, and every car arriving during it
    var s0 = AA[i0], lo = i0, hi = i0;
    while (lo > 0 && DD[lo - 1] > s0) lo--;
    while (hi < N && AA[hi] <= s0 + HOR) hi++;
    var m = hi - lo, ca = new Float64Array(m), cb = new Float64Array(m), cd = new Float64Array(m);
    for (k = lo; k < hi; k++) {
      ca[k - lo] = AA[k] - s0;
      cb[k - lo] = (k > 0 ? Math.max(AA[k], DD[k - 1]) : AA[k]) - s0;
      cd[k - lo] = DD[k] - s0;
    }
    // N(t) during the week: event times and the count after each event
    var et = [], en = [], ia = i0 - lo, id = 0, nn = i0 - lo, n0 = nn;
    while (true) {
      var ta = ia < m ? ca[ia] : Infinity, td = id < m ? cd[id] : Infinity;
      if (td <= 0) { id++; continue; }
      var tn = Math.min(ta, td);
      if (tn > HOR) break;
      if (td <= ta) { nn--; id++; } else { nn++; ia++; }
      et.push(tn); en.push(nn);
    }
    return {

      var w = S.runs[k].wk, env = w.env, cur = k === Math.min(li, 2) && t < CH[3] + 999;
      var last = k < li || t >= CH[3] ? env.cols : Math.floor(simAt(CLK[k], t) / HOR * env.cols);
      if (last <= 0) continue;
      var isNow = k === li;
      var col = isNow ? C.accent : C["mit-silver"];
      // envelope: one vertical stroke per pixel column
      ctx.globalAlpha = a * (isNow ? 1 : 0.5);
      ctx.strokeStyle = col; ctx.lineWidth = 1.05;
      ctx.beginPath();
      for (var c = 0; c < last; c++) {
        var xc = B.x0 + c + 0.5, y1 = Y(env.lo[c]), y2 = Y(env.hi[c]);
        ctx.moveTo(xc, y1 + 0.5); ctx.lineTo(xc, Math.min(y1 - 0.5, y2));
      }
      ctx.stroke();
      if (isNow) {                                // a light fill under the current week: the area under N(t)
        ctx.globalAlpha = a * 0.13; ctx.fillStyle = C.accent; ctx.beginPath(); ctx.moveTo(B.x0, B.y1);
        for (c = 0; c < last; c++) ctx.lineTo(B.x0 + c + 0.5, Y((env.lo[c] + env.hi[c]) / 2));
        ctx.lineTo(B.x0 + last - 0.5, B.y1); ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
    // long-run average L of the current week's load
    var r = S.runs[li], la = a * seg(t, (li === 0 ? 1.4 : CH[li] + 0.4), (li === 0 ? 2 : CH[li] + 1));
    if (la > 0.01) {
      var yl = Y(r.L);
      ctx.globalAlpha = la; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);
      ctx.beginPath(); ctx.moveTo(B.x0, yl); ctx.lineTo(B.x1, yl); ctx.stroke(); ctx.setLineDash([]);
      ctx.font = font(700, fs, false, true); ctx.fillStyle = C.ink; ctx.strokeStyle = C.surface; ctx.lineWidth = 4;
      tick(T("qx.l.L"), B.x1 - 2, yl - 3, "right", "bottom");
    }
    // the head of the current week
    if (t < CH[3]) {
      var ck = CLK[li], s = simAt(ck, t), nn = nAt(r.wk, s);
      if (t > ck.t0 - 0.05) {
        var hx = X(s), hy = Y(nn), pulse = 0.5 + 0.5 * Math.sin(t * 9);
        ctx.globalAlpha = a; ctx.fillStyle = C.surface; ctx.beginPath(); ctx.arc(hx, hy, 5.5, 0, TAU2); ctx.fill();
        ctx.fillStyle = HOT; ctx.beginPath(); ctx.arc(hx, hy, 3.6 + 0.8 * pulse * (t < ck.t1 ? 1 : 0), 0, TAU2); ctx.fill();
      }
    }
    ctx.restore(); ctx.globalAlpha = 1;
  }

  /* ---------- W against rho: the exact curve and the three simulated points ---------- */
  function curveMax(S) { var r = S.runs[2]; return Math.max(r.Wex, r.W + r.ci) * 1.15; }
  function drawCurve(S, t) {
    var a = E.out(seg(t, CH[3] + 0.6, CH[3] + 1.6));
    if (a <= 0.01) return;
    var B = L.curve, ym = curveMax(S), cs = S.cs, f = kfac(cs);
    var X = function (r) { return B.x0 + r / 1.045 * (B.x1 - B.x0); };
    var Y = function (w) { return B.y1 - w / ym * (B.y1 - B.y0); };
    ctx.save(); ctx.globalAlpha = a;
    var st = niceStep(ym, L.portrait ? 3 : 4), v, fs = L.fs;
    ctx.font = font(400, fs - 0.5, true); ctx.fillStyle = C.muted; ctx.lineJoin = "round";
    for (v = 0; v <= ym + 1e-9; v += st) {
      ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(B.x0, Math.round(Y(v)) + 0.5); ctx.lineTo(B.x1, Math.round(Y(v)) + 0.5); ctx.stroke();
      ctx.strokeStyle = C.surface; ctx.lineWidth = 3; tick(fmt(v, 0), B.x0 - 5, Y(v), "right", "middle");
    }
    for (v = 0; v <= 1.0001; v += 0.2) {
      ctx.strokeStyle = C.axis; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(Math.round(X(v)) + 0.5, B.y1); ctx.lineTo(Math.round(X(v)) + 0.5, B.y1 + 4); ctx.stroke();
      ctx.strokeStyle = C.surface; ctx.lineWidth = 3; tick(fmt(v, 1), X(v), B.y1 + 5, "center", "top");
    }
    ctx.strokeStyle = C.axis; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(B.x0, B.y0 - 6); ctx.lineTo(B.x0, B.y1); ctx.lineTo(B.x1, B.y1); ctx.stroke();
    ctx.font = font(600, fs); ctx.fillStyle = C.ink2; ctx.strokeStyle = C.surface; ctx.lineWidth = 3;
    tick(T("qx.l.w"), B.x0 + 6, B.y0 - 10, "left", "middle");
    ctx.font = font(700, fs + 1, false, true); tick(T("qx.l.rho"), B.x1 + 6, B.y1 + 4, "right", "top");
    // the wall at rho = 1
    var wa = a * E.out(seg(t, CH[3] + 4.2, CH[3] + 5.2));
    if (wa > 0.01) {
      ctx.globalAlpha = wa; ctx.strokeStyle = HOT; ctx.lineWidth = 1.6; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.moveTo(X(1), B.y1); ctx.lineTo(X(1), B.y0 - 4); ctx.stroke(); ctx.setLineDash([]);
      ctx.font = font(700, fs); ctx.fillStyle = HOT; ctx.strokeStyle = C.surface; ctx.lineWidth = 4;
      ctx.save(); ctx.translate(X(1) + 4, B.y1 - 6); ctx.rotate(-Math.PI / 2);
      tick(T("qx.l.rho1"), 0, 0, "left", "top"); ctx.restore();
    }
    ctx.save(); ctx.beginPath(); ctx.rect(B.x0, B.y0 - 8, B.x1 - B.x0 + 4, B.y1 - B.y0 + 8); ctx.clip();
    // M/M/1 reference, 1/(mu - lambda)
    var ma = a * seg(t, CH[3] + 3.4, CH[3] + 4.4);
    if (ma > 0.01) {
      ctx.globalAlpha = ma; ctx.strokeStyle = C["mit-silver"]; ctx.lineWidth = 1.8; ctx.setLineDash([6, 4]);
      path(function (r) { return mm1W(r); }, 1, X, Y, ym); ctx.stroke(); ctx.setLineDash([]);
    }
    // the exact curve, drawn from left to right
    var u = E.inOut(seg(t, CH[3] + 1.2, CH[3] + 3.6));
    if (u > 0) {
      ctx.globalAlpha = a; ctx.strokeStyle = C.accent; ctx.lineWidth = 2.6;
      path(function (r) { return exactW(r, cs); }, u, X, Y, ym); ctx.stroke();
    }
    ctx.restore();
    // the simulated points, dropping in one after the other
    var order = [0, 1, 2];
    order.forEach(function (ir) {
      var r = S.runs[ir], p = seg(t, CH[3] + 5.4 + 1.1 * ir, CH[3] + 6.2 + 1.1 * ir);
      if (p <= 0) return;
      var px = X(r.rho), py = lerp(B.y0 - 20, Y(r.W), E.out(p)), pa = a * Math.min(1, p * 2);
      ctx.globalAlpha = pa;
      var ylo = Y(r.W - r.ci), yhi = Y(r.W + r.ci);
      if (p >= 1) {
        ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(px, ylo); ctx.lineTo(px, yhi); ctx.moveTo(px - 4, ylo); ctx.lineTo(px + 4, ylo); ctx.moveTo(px - 4, yhi); ctx.lineTo(px + 4, yhi); ctx.stroke();
      }
      ctx.fillStyle = C.surface; ctx.beginPath(); ctx.arc(px, py, 6, 0, TAU2); ctx.fill();
      ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(px, py, 4.2, 0, TAU2); ctx.fill();
      var la = seg(t, CH[3] + 6.2 + 1.1 * ir, CH[3] + 6.8 + 1.1 * ir);
      if (la > 0) {
        ctx.globalAlpha = a * la; ctx.font = font(700, fs + (L.portrait ? 0 : 1), true); ctx.fillStyle = C.ink; ctx.strokeStyle = C.surface; ctx.lineWidth = 4;
        tick(fx(r.W, 1), px - 9, Math.min(Y(r.W), yhi + 0) - 2, "right", "bottom");
      }
    });
    ctx.restore(); ctx.globalAlpha = 1;
  }
  function path(fn, u, X, Y, ym) {               // W(rho) from 0 to where it leaves the plot, u = share drawn
    var rEnd = 0.999, n = 160, k;
    for (k = 0; k <= 400; k++) { var rr = k / 400 * 0.999; if (fn(rr) > ym * 1.02) { rEnd = rr; break; } }
    ctx.beginPath();
    for (k = 0; k <= n; k++) {
      var r = rEnd * u * k / n, w = fn(r);
      if (k) ctx.lineTo(X(r), Y(w)); else ctx.moveTo(X(r), Y(w));
    }
  }

  /* ---------- Little's law: L (time average) against lambda * W (per car) ---------- */
  function drawBars(S, t) {
    var a = E.out(seg(t, CH[4] + 0.5, CH[4] + 1.5));
    if (a <= 0.01) return;
    var B = L.bars, fs = L.fs, top = Math.max.apply(null, S.runs.map(function (r) { return Math.max(r.L, r.Lex); })) * 1.2;
    var Y = function (v) { return B.y1 - v / top * (B.y1 - B.y0); };
    ctx.save(); ctx.globalAlpha = a;
    ctx.strokeStyle = C.axis; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(B.x0, B.y1); ctx.lineTo(B.x1, B.y1); ctx.stroke();
    var gw = (B.x1 - B.x0) / 3, bw = Math.min(46, gw * 0.24), gap = Math.min(8, bw * 0.2);
    S.runs.forEach(function (r, ir) {
      var cx = B.x0 + gw * (ir + 0.5);
      var g1 = E.out(seg(t, CH[4] + 1.4 + 0.5 * ir, CH[4] + 2.6 + 0.5 * ir));
      var g2 = E.out(seg(t, CH[4] + 3.4 + 0.5 * ir, CH[4] + 4.6 + 0.5 * ir));
      var xL = cx - gap / 2 - bw, xW = cx + gap / 2;
      ctx.globalAlpha = a;
      if (g1 > 0) { ctx.fillStyle = C.ink2; ctx.fillRect(xL, Y(r.L * g1), bw, B.y1 - Y(r.L * g1)); }
      if (g2 > 0) { ctx.fillStyle = C.accent; ctx.fillRect(xW, Y(r.lamW * g2), bw, B.y1 - Y(r.lamW * g2)); }
      // the formula value of L as a dashed tick across the pair
      var fa = seg(t, CH[4] + 5.6, CH[4] + 6.4);
      if (fa > 0) {
        ctx.globalAlpha = a * fa; ctx.strokeStyle = C["mit-silver"]; ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
        ctx.beginPath(); ctx.moveTo(xL - 6, Y(r.Lex)); ctx.lineTo(xW + bw + 6, Y(r.Lex)); ctx.stroke(); ctx.setLineDash([]);
      }
      // values
      ctx.font = font(700, fs - (L.portrait ? 0.5 : 0), true); ctx.strokeStyle = C.surface; ctx.lineWidth = 3.5; ctx.lineJoin = "round";
      var yv = Math.min(Y(r.L), Y(r.lamW), Y(r.Lex)) - 5;
      if (g1 >= 1) { ctx.globalAlpha = a * seg(t, CH[4] + 2.6 + 0.5 * ir, CH[4] + 3 + 0.5 * ir); ctx.fillStyle = C.ink; tick(fx(r.L, 2), xL + bw / 2, yv, "center", "bottom"); }
      if (g2 >= 1) { ctx.globalAlpha = a * seg(t, CH[4] + 4.6 + 0.5 * ir, CH[4] + 5 + 0.5 * ir); ctx.fillStyle = C["accent-text"]; tick(fx(r.lamW, 2), xW + bw / 2, yv - (L.portrait ? fs + 3 : 0), "center", "bottom"); }
      ctx.globalAlpha = a; ctx.font = font(600, fs); ctx.fillStyle = C.ink2;
      tick(T("qx.l.grp", { r: fmt(r.rho, 2) }), cx, B.y1 + 6, "center", "top");
    });
    ctx.restore(); ctx.globalAlpha = 1;
  }

  /* ---------- caption ---------- */
  function captions(key, t) {
    var cs = CSV[key], w = RHOS.map(function (r) { return exactW(r, cs); });
    if (t < CH[1]) return [T("qx.cap1"), T("qx.cap1.sub", { lam: fmt(RHOS[0] * MU * 60, 1) })];
    if (t < CH[2]) return [T("qx.cap2"), T("qx.cap2.sub", { p: fmt((RHOS[1] / RHOS[0] - 1) * 100, 0), k: fmt(w[1] / w[0], 1) })];
    if (t < CH[3]) return [T("qx.cap3"), T("qx.cap3.sub", { p: fmt((RHOS[2] / RHOS[1] - 1) * 100, 0), k: fmt(w[2] / w[1], 1) })];
    if (t < CH[4]) return [T("qx.cap4"), T("qx.cap4.sub", { f: fmt(kfac(cs), 3) })];
    return [T("qx.cap5"), T("qx.cap5.sub")];
  }
  function wrap(s, maxW) {
    var words = String(s).split(" "), lines = [], cur = "";
    words.forEach(function (w) {
      var tr = cur ? cur + " " + w : w;
      if (ctx.measureText(tr).width > maxW && cur) { lines.push(cur); cur = w; } else cur = tr;
    });
    if (cur) lines.push(cur);
    return lines;
  }
  function drawCaption(t) {
    var ci = 0; CH.forEach(function (c, k) { if (t >= c) ci = k; });
    var a = ci === 0 ? seg(t, 0.4, 1.1) : seg(t, CH[ci] + 0.15, CH[ci] + 0.8);
    if (ci < CH.length - 1) a *= 1 - seg(t, CH[ci + 1] - 0.45, CH[ci + 1] - 0.05);
    if (t >= DUR - 1e-6) a = 1;
    if (a <= 0) return;
    var lines = captions(state.sc, t), x = L.capX, y = L.capY, maxW = L.capW - 12;
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = C.accent; ctx.fillRect(x, y - L.ft + 2, 3, L.ft + 1);
    ctx.font = font(700, L.ft); ctx.fillStyle = C.ink; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    var tl = wrap(lines[0], maxW);
    tl.forEach(function (s, k) { ctx.fillText(s, x + 10, y + k * (L.ft + 3), maxW); });
    y += (tl.length - 1) * (L.ft + 3) + L.fs + 6;
    ctx.font = font(400, L.fs + (L.portrait ? 0.5 : 1.5)); ctx.fillStyle = C.ink2;
    wrap(lines[1], maxW).forEach(function (s) { ctx.fillText(s, x + 10, y, maxW); y += L.fs + 5.5; });
    ctx.restore();
  }

  /* ---------- HUD chips ---------- */
  var chips = [0, 1, 2, 3, 4, 5].map(function (i) {
    var el = document.getElementById("qx-c" + i);
    return { el: el, b: el.querySelector("b"), s: el.querySelector("span"), v: null, l: null, o: null, k: null };
  });
  function setChip(i, val, lab, op, kind) {
    var c = chips[i];
    op = Math.round(clamp(op, 0, 1) * 20) / 20;
    if (c.v !== val) { c.b.textContent = val; c.v = val; }
    if (c.l !== lab) { c.s.textContent = lab; c.l = lab; }
    if (c.o !== op) { c.el.style.opacity = op; c.o = op; }
    if (c.k !== kind) { c.el.classList.toggle("accent", kind === "acc"); c.k = kind; }
  }
  function hud(S, t) {
    var li = weekAt(t), r = S.runs[li], p = li > 0 ? S.runs[li - 1] : r;
    var u = li === 0 ? 1 : E.inOut(seg(t, CH[li] + 0.1, CH[li] + 0.9));
    var v = function (k) { return lerp(p[k], r[k], u); };
    var ap = function (i) { return seg(t, 0.5 + 0.12 * i, 0.9 + 0.12 * i); };
    var little = t >= CH[4] + 3.4;
    setChip(0, fx(v("rhoh"), 3), T("qx.k.rho"), ap(0), "");
    if (t < CH[3]) setChip(1, fmt(nAt(r.wk, simAt(CLK[li], t)), 0), T("qx.k.now"), ap(1), "");
    else setChip(1, fx(r.lamh, 1), T("qx.k.lam"), 1, "");
    setChip(2, T("qx.min", { v: fx(v("W"), 2) }), T("qx.k.w"), ap(2), "acc");
    setChip(3, T("qx.min", { v: fx(v("Wex"), 2) }), T("qx.k.wx"), ap(3), "");
    setChip(4, fx(v("L"), 2), T("qx.k.l"), ap(4), little ? "acc" : "");
    setChip(5, fx(v("lamW"), 2), T("qx.k.lw"), ap(5), little ? "acc" : "");
  }

  /* ---------- the frame ---------- */
  function render(t) {
    C = A.colors();
    HOT = C.accent.toLowerCase() === C["mit-bright"].toLowerCase() ? C.crit : C["mit-bright"];
    var S = scen(state.sc);
    hud(S, t);
    if (hudKey !== cv.w + "x" + cv.h + ":" + hudEl.offsetHeight + ":" + hudEl.offsetWidth) layout();
    envelopes();
    ROAD.R = roadRows(S);
    ctx.clearRect(0, 0, L.W, L.H);
    ctx.fillStyle = C.surface; ctx.fillRect(0, 0, L.W, L.H);
    ctx.lineCap = "butt"; ctx.lineJoin = "round"; ctx.setLineDash([]);

    drawCurve(S, t);
    drawStrip(S, t, 1 - E.inOut(seg(t, CH[4] - 0.1, CH[4] + 0.6)));

  layout();
  var player = A.create({

  });

    }));

    });

      T("qx.res.l") + "</th><th class='num'>" + T("qx.res.lw") + "</th></tr></thead><tbody>";

  function renderNotes() {

    document.getElementById("qx-n1").textContent = T("qx.n.p1", {
      a: fmt((RHOS[1] / RHOS[0] - 1) * 100, 0), b: fmt((RHOS[2] / RHOS[1] - 1) * 100, 0),
      w1: fx(w[0], 2), w2: fx(w[1], 2), w3: fx(w[2], 2),
      f1: fmt(RHOS[0] / (1 - RHOS[0]), 2), f2: fmt(RHOS[1] / (1 - RHOS[1]), 2), f3: fmt(RHOS[2] / (1 - RHOS[2]), 2)
    });
    document.getElementById("qx-n2").textContent = T("qx.n.p2", {
      d: fx(exactW(RHOS[2], CSV.det), 2), e: fx(exactW(RHOS[2], CSV.exp), 2), h: fx(exactW(RHOS[2], CSV.hyp), 2),
      g0: fmt(kfac(CSV.det), 3), g1: fmt(kfac(CSV.exp), 3), g2: fmt(kfac(CSV.hyp), 3)
    });
    var r0 = S.runs[0], r2 = S.runs[2];
    document.getElementById("qx-n3").textContent = T("qx.n.p3", { l: fx(r2.L, 2), lw: fx(r2.lamW, 2) });
    document.getElementById("qx-n4").textContent = T("qx.n.p4", {
      n: fmt(NCUST, 0),
      e1: fmt(Math.abs(r0.W - r0.Wex) / r0.Wex * 100, 1), e3: fmt(Math.abs(r2.W - r2.Wex) / r2.Wex * 100, 1),
      r: fmt((r2.ci / r2.W) / (r0.ci / r0.W), 0)
    });
  }

  /* ---------- choosing a scenario: its simulation runs in slices, never in one long block ---------- */
  var segBtns = document.querySelectorAll("#qx-seg button"), pending = null;
  function pressed(key) { segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o.getAttribute("data-sc") === key)); }); }
  function busy(on) {
    root.classList.toggle("qx-busy", on);
    if (on) root.setAttribute("aria-busy", "true"); else root.removeAttribute("aria-busy");
    if (on) document.getElementById("qx-status").textContent = T("qx.loading", { n: fmt(NCUST, 0) });
  }
  function apply(key) {                           // the scenario is ready: switch to it
    pending = null; busy(false);
    state.sc = key; envKey = "";
    renderScenText(); renderResults(); renderNotes();
    warm();
    if (A.reducedMotion) { player.seek(DUR); return; }
    var ci = 0; CH.forEach(function (c, k) { if (player.time >= c) ci = k; });
    player.seek(CH[ci] + 0.001); player.play();
  }
  function choose(key) {
    if (key === (pending || state.sc)) return;
    pressed(key);
    if (key === state.sc || simCache[key]) { apply(key); return; }
    pending = key; busy(true);
    player.pause();                               // the dimmed stage waits, so the simulation gets the time
    function run() {                              // about 30 ms of work per task, so the page stays responsive
      if (pending !== key) return;
      player.pause();                             // autoplay on scroll may have restarted it
      if (scenStep(key, 30)) apply(key); else setTimeout(run, 0);
    }
    requestAnimationFrame(function () { setTimeout(run, 0); });   // paint the busy state first
  }
  segBtns.forEach(function (b) { b.addEventListener("click", function () { choose(b.getAttribute("data-sc")); }); });
  // while the page is idle, prepare the other scenarios so a click usually switches at once
  var idle = window.requestIdleCallback || function (cb) { return setTimeout(function () { cb({ timeRemaining: function () { return 8; } }); }, 60); };
  var warming = false;
  function warm() {
    if (warming || pending) return;
    var key = ["det", "hyp", "exp"].filter(function (k) { return !simCache[k]; })[0];
    if (!key) return;
    warming = true;
    idle(function (dl) {
      warming = false;
      if (pending) return;                        // a click drives the work now; warm() runs again after it
      scenStep(key, clamp(dl.timeRemaining() - 1, 1, 12));
      warm();
    });
  }

  function renderPage() {
    renderSeg(); renderScenText(); renderModel(); renderResults(); renderNotes();
    if (pending) busy(true);
    hudKey = "";
    player.refresh();
  }
  I18N.onChange(renderPage);
  warm();
})();
</script>
</body>
</html>
