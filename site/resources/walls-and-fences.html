<script>
(function () {
  "use strict";
  var T = I18N.t;
  var MINUS = "−";
  var fmt = function (v, d, m) { if (Math.abs(v) < 5e-13) v = 0; return I18N.fmt(v, d == null ? 2 : d, m); };
  var signed = function (v, d, neg, pos, fix) { var m = fmt(Math.abs(v), d, fix ? d : null); return m === fmt(0, d, fix ? d : null) ? m : (v < 0 ? neg : pos) + m; };
  var num = function (v, d) { return signed(v, d, MINUS, ""); };
  var sgn = function (v, d) { return signed(v, d, MINUS, "+"); };
  var digitsFor = function (v, n) { return v === 0 ? 0 : Math.max(0, n - 1 - Math.floor(Math.log10(Math.abs(v)) + 1e-9)); };
  var sig = function (v, n) { return num(v, digitsFor(v, n)); };           // n significant digits
  var pair = function (x, y, d) { return T("wf.pair", { x: num(x, d), y: num(y, d) }); };
  var list = function (arr) { return arr.join(T("wf.sep")); };

  /* ---------- the model: min (x-2)^2 + (y-2)^2  s.t.  x + y <= 2 ---------- */
  var A0 = 2, B0 = 2, CAP = 2;                     // ideal point (2, 2) and the fence x + y <= 2
  var METHODS = {
    penalty: { mus: [1, 10, 100, 1000], start: [2, 2] },       // start: the unconstrained minimum
    barrier: { mus: [1, 0.1, 0.01, 0.001], start: [0, 0] }     // start: a strictly feasible point
  };
  var OTHER = { penalty: "barrier", barrier: "penalty" };
  function fOf(x, y) { return (x - A0) * (x - A0) + (y - B0) * (y - B0); }
  function gOf(x, y) { return x + y; }
  function term(m, mu, x, y) {                     // the term that replaces the fence (Infinity outside the barrier domain)
    if (m === "penalty") { var v = x + y - CAP; return v > 0 ? mu * v * v : 0; }
    var s = CAP - x - y;
    return s > 0 ? -mu * Math.log(s) : Infinity;
  }
  function phi(m, mu, x, y) { return fOf(x, y) + term(m, mu, x, y); }
  function gradHess(m, mu, x, y) {
    var gx = 2 * (x - A0), gy = 2 * (y - B0), h = 0;
    if (m === "penalty") { var v = x + y - CAP; if (v > 0) { gx += 2 * mu * v; gy += 2 * mu * v; h = 2 * mu; } }
    else { var s = CAP - x - y; gx += mu / s; gy += mu / s; h = mu / (s * s); }
    return { g: [gx, gy], H: [[2 + h, h], [h, 2 + h]] };
  }
  // damped Newton with backtracking (the barrier step is cut back while it would cross the fence)
  function newton(m, mu, x0) {
    var x = x0[0], y = x0[1], it = 0;
    for (; it < 60; it++) {
      var o = gradHess(m, mu, x, y), H = o.H, g = o.g, det = H[0][0] * H[1][1] - H[0][1] * H[1][0];

      var st = 1, p0 = phi(m, mu, x, y);
      while (st > 1e-12) {

      }
      x += st * dx; y += st * dy;
      if (Math.max(Math.abs(st * dx), Math.abs(st * dy)) < 1e-12) break;   // counted: the steps longer than 1e-12

  }

  function closed(m, mu) {
    var s, v, sl;

      var cands = sd > 0 ? [[o, 6, "left"], [o, 12, "left"], [o + 4, 20, "left"], [-o, -12, "right"], [-o, -20, "right"]]
        : [[-o, -6, "right"], [-o, -12, "right"], [-o - 4, -20, "right"], [o, 12, "left"], [o, 20, "left"]];
      var pl = place(txt, f, L.fs, X, Y, cands, used);
      if (!pl) return;
      pl.f = f; pl.col = C["accent-text"]; pl.a = a;
      out.push(pl); used.push({ b: pl.b });
    });
    var oa = otherA(t);
    if (oa > 0.01) {
      var o2 = OTHER[m], p = stagePts(o2)[0], X = SX(p[0]), Y = SY(p[1]), txt = T("wf.l." + o2), s2 = -sd, of = 12;
      var cands2 = s2 > 0 ? [[of, 8, "left"], [of, 16, "left"], [of + 10, 26, "left"]] : [[-of, -8, "right"], [-of, -16, "right"], [-of - 10, -26, "right"]];
      var pl2 = place(txt, font(600, L.fs), L.fs, X, Y, cands2, used);
      if (pl2) { pl2.f = font(600, L.fs); pl2.col = C.ink2; pl2.a = seg(t, 46.6, 47.4); out.push(pl2); }
    }
    return out;
  }

  /* ---------- caption (under the counters) ---------- */
  function captions(m, t) {
    var M = METHODS[m], pt = pair(A0, B0);
    if (t < CH[1]) return [T("wf.cap1"), T("wf.cap1.sub", { pt: pt, xs: pair(KKT.x, KKT.y) })];
    if (t < CH[2]) return [T("wf.cap2." + m), T("wf.cap2." + m + ".sub", { mu: sig(M.mus[0], 3) })];
    if (t < CH[3]) return [T("wf.cap3." + m), T("wf.cap3." + m + ".sub")];
    if (t < CH[4]) {
      var mu = muAt(m, Math.max(t, 38.5)), c = closed(m, mu);
      return [T("wf.cap4." + m), T("wf.cap4." + m + ".sub", { z: fmt(zoomFactor(m), 0), mu: sig(mu, 3), v: sig(m === "penalty" ? c.v : c.sl, 3) })];
    }
    return [T("wf.cap5." + m), T("wf.cap5." + m + ".sub", { fs: fmt(KKT.f) })];
  }
  function wrap(s, maxW) {
    var words = String(s).split(" "), lines = [], cur = "";
    words.forEach(function (w) {
      var tr = cur ? cur + " " + w : w;
      if (ctx.measureText(tr).width > maxW && cur) { lines.push(cur); cur = w; } else cur = tr;
    });
    if (cur) lines.push(cur);
    return lines;
  }
  function drawCaption(m, t) {
    var ci = 0; CH.forEach(function (c, k) { if (t >= c) ci = k; });
    var a = ci === 0 ? seg(t, 0.4, 1.1) : seg(t, CH[ci] + 0.15, CH[ci] + 0.8);
    if (ci < CH.length - 1) a *= 1 - seg(t, CH[ci + 1] - 0.45, CH[ci + 1] - 0.05);
    if (t >= DUR - 1e-6) a = 1;
    if (a <= 0) return;
    var lines = captions(m, t), x = L.capX, y = L.capY, maxW = L.capW - 12;
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = C.accent; ctx.fillRect(x, y - L.ft + 2, 3, L.ft + 1);
    ctx.font = font(700, L.ft); ctx.fillStyle = C.ink; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    var tl = wrap(lines[0], maxW);
    tl.forEach(function (s, k) { ctx.fillText(s, x + 10, y + k * (L.ft + 3), maxW); });
    y += (tl.length - 1) * (L.ft + 3) + L.fs + 6;
    ctx.font = font(400, L.fs + (L.portrait ? 0 : 1)); ctx.fillStyle = C.ink2;
    wrap(lines[1], maxW).forEach(function (s) { ctx.fillText(s, x + 10, y, maxW); y += L.fs + 5; });
    ctx.restore();
  }

  /* ---------- inset (desktop): f at each stage minimizer against f* ---------- */
  function drawInset(m, t) {
    var a = E.out(seg(t, 20.4, 21.4));
    if (a <= 0 || L.portrait) return;
    var y0 = L.capBottom + 18, h = Math.min(190, L.H - y0 - 14);
    if (h < 110) return;
    var x0 = L.capX, w = L.capW - 10, fs = 10.5;
    var px0 = x0 + 12, px1 = x0 + w - 8, py0 = y0 + fs + 12, py1 = y0 + h - fs - 12;
    var fmin = 0.7, fmax = 3.1, nK = METHODS[m].mus.length;
    var kx = function (k) { return lerp(px0 + 18, px1 - 14, k / (nK - 1)); };
    var fy = function (v) { return py1 - (v - fmin) / (fmax - fmin) * (py1 - py0); };
    ctx.save(); ctx.globalAlpha = a;
    ctx.font = font(700, fs + 0.5); ctx.fillStyle = C.ink; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    ctx.fillText(T("wf.l.inset"), x0 + 10, y0 + fs, w - 10);
    ctx.strokeStyle = C.axis; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px0, py0 - 4); ctx.lineTo(px0, py1); ctx.lineTo(px1, py1); ctx.stroke();
    // f* line
    ctx.strokeStyle = C.ink2; ctx.lineWidth = 1.3; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(px0, fy(KKT.f)); ctx.lineTo(px1, fy(KKT.f)); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = font(400, fs, false, true); ctx.fillStyle = C.ink2; ctx.textAlign = "left"; ctx.textBaseline = "bottom";
    ctx.fillText(T("wf.l.fstar", { f: fmt(KKT.f) }), px0 + 5, fy(KKT.f) - 3);
    // x ticks: subproblem k
    ctx.font = font(400, fs, true); ctx.fillStyle = C.muted; ctx.textAlign = "center"; ctx.textBaseline = "top";
    for (var k = 0; k < nK; k++) ctx.fillText(String(k + 1), kx(k), py1 + 3);
    ctx.textAlign = "right"; ctx.font = font(400, fs); ctx.fillText(T("wf.l.round"), px1, py1 + fs + 6);
    function series(mm, n, col, dash, lw, r) {
      var rows = seq(mm).rows;
      ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.setLineDash(dash);
      ctx.beginPath();
      for (var i = 0; i < n; i++) { var X = kx(i), Y = fy(rows[i].f); if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y); }
      ctx.stroke(); ctx.setLineDash([]);
      for (var j = 0; j < n; j++) { ctx.fillStyle = C.surface; circle(kx(j), fy(rows[j].f), r + 1.5); ctx.fill(); ctx.fillStyle = col; circle(kx(j), fy(rows[j].f), r); ctx.fill(); }
    }
    var oa = otherA(t);
    if (oa > 0.01) { ctx.globalAlpha = a * oa; series(OTHER[m], nK, C["mit-silver"], [5, 4], 1.6, 3); ctx.globalAlpha = a; }
    var n = stagesShown(t);
    if (n > 0) series(m, n, C.accent, [], 2.2, 3.6);
    // legend, top right
    var lx = px1 - 4, ly = y0 + fs + 16;
    ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.font = font(600, fs);
    ctx.fillStyle = C["accent-text"]; ctx.fillText(T("wf.l." + m), lx - 26, ly);
    ctx.strokeStyle = C.accent; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(lx - 20, ly); ctx.lineTo(lx, ly); ctx.stroke();
    if (oa > 0.01) {
      ctx.globalAlpha = a * oa; ly += fs + 6;
      ctx.fillStyle = C.ink2; ctx.fillText(T("wf.l." + OTHER[m]), lx - 26, ly);
      ctx.strokeStyle = C["mit-silver"]; ctx.lineWidth = 1.6; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(lx - 20, ly); ctx.lineTo(lx, ly); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.restore();
  }

  /* ---------- HUD chips ---------- */
  var chips = [0, 1, 2, 3].map(function (i) {
    var el = document.getElementById("wf-c" + i);
    return { el: el, b: el.querySelector("b"), s: el.querySelector("span"), v: null, l: null, o: null, k: null };
  });
  function setChip(i, val, lab, op, kind) {
    var c = chips[i];
    op = Math.round(clamp(op, 0, 1) * 20) / 20;
    if (c.v !== val) { c.b.textContent = val; c.v = val; }
    if (c.l !== lab) { c.s.textContent = lab; c.l = lab; }
    if (c.o !== op) { c.el.style.opacity = op; c.o = op; }
    if (c.k !== kind) { c.el.classList.toggle("accent", kind === "acc"); c.el.classList.toggle("bad", kind === "bad"); c.k = kind; }
  }
  function hud(m, t, P) {
    var mu = muAt(m, t), v = Math.max(0, gOf(P[0], P[1]) - CAP), sl = CAP - gOf(P[0], P[1]);
    var lam = m === "penalty" ? 2 * mu * v : mu / sl;
    setChip(0, sig(mu, 3), T("wf.k.mu"), seg(t, 9.6, 10.1), "acc");
    setChip(1, v > 0 ? sig(v, 3) : fmt(0), T("wf.k.viol"), seg(t, 4.6, 5.1), v > 0 ? "bad" : "");
    setChip(2, fmt(fOf(P[0], P[1]), 3), T("wf.k.f"), seg(t, 1.9, 2.4), "");
    setChip(3, fmt(lam, 4), T("wf.k.lam"), seg(t, 12.4, 12.9), "");   // 4 decimals: the barrier's last estimate 2.0005 must not read as lambda* = 2
  }

  /* ---------- the frame ---------- */
  function render(t) {
    C = A.colors();
    HOT = C.accent.toLowerCase() === C["mit-bright"].toLowerCase() ? C.crit : C["mit-bright"];
    var m = state.sc, mu = muAt(m, t), w = morphW(t), P = iterAt(m, t);
    hud(m, t, P);
    if (hudKey !== cv.w + "x" + cv.h + ":" + hudEl.offsetHeight + ":" + hudEl.offsetWidth) layout();
    setCam(m, t);
    ctx.clearRect(0, 0, L.W, L.H);
    ctx.fillStyle = C.surface; ctx.fillRect(0, 0, L.W, L.H);
    ctx.lineCap = "butt"; ctx.lineJoin = "round"; ctx.setLineDash([]);

    drawGrid(t);
    drawSides(t, w);
    fieldFill(m, mu, w);
    drawTint(m, mu, w);
    if (t < 3.2) drawIntroCircles(t);
    drawContours(m, t, w, seg(t, 2.6, 3.2));
    drawFStar(t);
    drawFence(t);
    drawOther(m, t);
    drawTrail(m, t, P);
    drawStageDots(m, t);
    drawParticles(m, t);
    drawMinF(t);
    drawStart(m, t);
    drawOptRing(t);
    drawIterate(m, t, P);

    // labels, placed clear of the fence, the diagonal path and each other
    var F = fenceLabel(t), OL = optLabels(m, t), keep = [];
    var fs = fenceSeg(), fenceObs = fs ? { s: [SX(fs[0]), SY(fs[1]), SX(fs[2]), SY(fs[3])], m: 4 } : null;
    var obs = [{ s: diagSeg(), m: 3 }, { c: [SX(KKT.x), SY(KKT.y), L.dot + 8] }, { c: [SX(P[0]), SY(P[1]), L.dot + 6] }];
    if (fenceObs) obs.push(fenceObs);
    OL.forEach(function (o) {
      ctx.font = o.f; var ww = ctx.measureText(o.txt).width, bx = o.align === "left" ? o.x : o.x - ww / 2;
      o.b = [bx - 3, o.y - o.fs / 2 - 3, bx + ww + 3, o.y + o.fs / 2 + 3]; obs.push({ b: o.b });
    });
    if (F) obs.push({ b: F.b });
    var SL = stageLabels(m, t, obs), sideL = sideLabels(t, obs.concat(SL.map(function (o) { return { b: o.b }; })));
    drawFenceLabel(F);
    minFLabels(t).concat(startLabels(m, t)).forEach(function (o) { label(o.txt, o.x, o.y, o.align, o.col, o.f, o.a); ctx.font = o.f; var ww = ctx.measureText(o.txt).width; keep.push(o.align === "right" ? [o.x - ww - 4, o.y - 9, o.x + 4, o.y + 9] : [o.x - 4, o.y - 9, o.x + ww + 4, o.y + 9]); });
    SL.concat(sideL).forEach(function (o) { label(o.txt, o.x, o.y, o.align, o.col, o.f, o.a); keep.push(o.b); });
    OL.forEach(function (o) { label(o.txt, o.x, o.y, o.align, o.col, o.f, o.a); keep.push(o.b); });
    if (F) keep.push(F.b);
    drawTicks(t, keep);

    // quiet band under the counters and the caption: solid behind the text, fading out only past it
    var gr, e1, e2;
    if (L.portrait) {
      e2 = L.y0 + 4; e1 = clamp((L.capBottom + 2) / e2, 0, 0.98);
      gr = ctx.createLinearGradient(0, 0, 0, e2);
      gr.addColorStop(0, rgba(C.surface, 1)); gr.addColorStop(e1, rgba(C.surface, 1)); gr.addColorStop(1, rgba(C.surface, 0));
      ctx.fillStyle = gr; ctx.fillRect(0, 0, L.W, e2);
    } else {
      e2 = L.x0 + 4; e1 = clamp((L.capX + L.capW + 4) / e2, 0, 0.98);
      gr = ctx.createLinearGradient(0, 0, e2, 0);
      gr.addColorStop(0, rgba(C.surface, 1)); gr.addColorStop(e1, rgba(C.surface, 1)); gr.addColorStop(1, rgba(C.surface, 0));
      ctx.fillStyle = gr; ctx.fillRect(0, 0, e2, L.H);
    }
    ctx.globalAlpha = 1;
    drawCaption(m, t);
    drawInset(m, t);
  }

  layout();
  var player = A.create({
    root: root,
    duration: DUR,
    chapters: CH.map(function (c, k) { return { t: c, key: "wf.ch" + (k + 1) }; }),
    onResize: function () { cv.fit(); layout(); },
    render: render
  });

  /* =====================================================================================
     Page text: status line, model data, solution, sequence table, notes
     ===================================================================================== */
  function xDigits(v) { var d = Math.abs(v - 1); return d === 0 ? 0 : clamp(Math.ceil(-Math.log10(d)) + 2, 3, 7); }
  function renderScenText() {
    var m = state.sc, R = seq(m).rows;
    document.getElementById("wf-lg-wall").hidden = m !== "penalty";
    document.getElementById("wf-lg-bar").hidden = m !== "barrier";
    var lo = document.getElementById("wf-lg-other");
    lo.setAttribute("data-i18n", "wf.lg.other." + m); lo.textContent = T("wf.lg.other." + m);
    stage.setAttribute("data-i18n-attr", "aria-label:wf.anim.aria." + m);
    stage.setAttribute("aria-label", T("wf.anim.aria." + m) + " " + T("wf.anim.aria.nums", {
      mus: list(R.map(function (r) { return sig(r.mu, 3); })),
      xs: list(R.map(function (r) { return pair(r.x, r.y, xDigits(r.x)); })),
      fs: list(R.map(function (r) { return fmt(r.f, 4); })),
      xo: pair(KKT.x, KKT.y), fo: fmt(KKT.f)
    }));
    var n = R.length - 1;
    document.getElementById("wf-status").innerHTML = T("wf.st." + m, {
      mus: list(R.map(function (r) { return sig(r.mu, 3); })),
      v1: sig(m === "penalty" ? R[0].v : R[0].sl, 3), v4: sig(m === "penalty" ? R[n].v : R[n].sl, 3),
      f1: fmt(R[0].f, 3), f4: fmt(R[n].f, 4), fs: fmt(KKT.f)
    });
  }
  function renderModel() {
    document.getElementById("wf-data").textContent = T("wf.model.data", { xs: pair(KKT.x, KKT.y), fs: fmt(KKT.f), ls: fmt(KKT.lam) });
    document.getElementById("wf-lim").innerHTML = T("wf.closed.lim", { ls: fmt(KKT.lam) });
  }
  function renderSolution() {
    var m = state.sc, R = seq(m).rows, last = R[R.length - 1];
    document.getElementById("wf-sx").textContent = pair(KKT.x, KKT.y);
    document.getElementById("wf-sf").textContent = fmt(KKT.f);
    document.getElementById("wf-sfl").textContent = T("wf.sol.fl", { pt: pair(A0, B0) });
    document.getElementById("wf-sl").textContent = fmt(KKT.lam);
    document.getElementById("wf-sdk").textContent = T("wf.sol.last", { s: T("wf.sc." + m).toLowerCase() });
    var d = Math.hypot(last.x - KKT.x, last.y - KKT.y);
    document.getElementById("wf-sd").textContent = sig(d, 3);
    document.getElementById("wf-sdl").textContent = T("wf.sol.lastl", { mu: sig(last.mu, 3) });
  }
  function renderSeq() {
    var m = state.sc, S = seq(m), pen = m === "penalty";
    document.getElementById("wf-seq-title").textContent = T("wf.seq.title", { s: T("wf.sc." + m) });
    document.getElementById("wf-seq-intro").innerHTML = T("wf.seq.intro." + m, { st: pair(METHODS[m].start[0], METHODS[m].start[1]) });
    var h = "<thead><tr><th class='num wide'>" + T("wf.seq.k") + "</th><th class='num'>" + T("wf.seq.mu") + "</th><th class='num'>" + T("wf.seq.x") +
      "</th><th class='num'>" + T(pen ? "wf.seq.viol" : "wf.seq.slack") + "</th><th class='num'>" + T("wf.seq.f") + "</th><th class='num wide'>" +
      T("wf.seq.gap") + "</th><th class='num'>" + T("wf.seq.lam") + "</th><th class='num wide'>" + T("wf.seq.it") + "</th><th class='num wide'>" +
      T("wf.seq.cond") + "</th></tr></thead><tbody>";
    S.rows.forEach(function (r) {
      h += "<tr><td class='num wide'>" + r.k + "</td><td class='num'>" + sig(r.mu, 3) + "</td><td class='num ex'>" + num(r.x, xDigits(r.x)) +
        "</td><td class='num'>" + sig(pen ? r.v : r.sl, 3) + "</td><td class='num'>" + fmt(r.f, 4) + "</td><td class='num wide gap'>" +
        sgn(r.f - KKT.f, digitsFor(r.f - KKT.f, 3)) + "</td><td class='num'>" + fmt(r.lam, 4) + "</td><td class='num wide'>" + r.it +
        "</td><td class='num wide'>" + fmt(r.cond, 0) + "</td></tr>";
    });
    document.getElementById("wf-seq").innerHTML = h + "</tbody>";
    var dp = S.maxd === 0 ? 15 : clamp(Math.floor(-Math.log10(S.maxd)), 0, 15);
    document.getElementById("wf-seq-agree").textContent = T("wf.seq.agree", { n: dp });
    document.getElementById("wf-seq-note").innerHTML = T("wf.seq.note." + m);
  }
  function renderNotes() {
    var P = seq("penalty").rows, B = seq("barrier").rows, n = P.length - 1;
    document.getElementById("wf-n1").textContent = T("wf.n.p1", { xp: list(P.map(function (r) { return pair(r.x, r.y, xDigits(r.x)); })) });
    document.getElementById("wf-n2").textContent = T("wf.n.p2", { xb: list(B.map(function (r) { return pair(r.x, r.y, xDigits(r.x)); })) });
    document.getElementById("wf-n3").textContent = T("wf.n.p3", { lp: fmt(P[n].lam, 4), lb: fmt(B[n].lam, 4), ls: fmt(KKT.lam) });
    // cold start: Newton on the last subproblem straight from the starting point, against the warm-started total
    var cold = function (m) { var M = METHODS[m]; return newton(m, M.mus[M.mus.length - 1], M.start).it; };
    var tot = function (R) { return R.reduce(function (s, r) { return s + r.it; }, 0); };
    document.getElementById("wf-n4").textContent = T("wf.n.p4", { cp: fmt(P[n].cond, 0), cb: fmt(B[n].cond, 0),
      np: fmt(cold("penalty"), 0), nb: fmt(cold("barrier"), 0), wp: fmt(tot(P), 0), wb: fmt(tot(B), 0) });
  }

  var segBtns = document.querySelectorAll("#wf-seg button");
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      if (state.sc === b.getAttribute("data-sc")) return;
      state.sc = b.getAttribute("data-sc");
      segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      renderScenText(); renderSolution(); renderSeq();
      if (A.reducedMotion) { player.seek(DUR); return; }
      if (player.time < CH[1]) player.refresh();
      else { player.seek(CH[1] + 0.001); player.play(); }
    });
  });

  function renderPage() {
    renderScenText(); renderModel(); renderSolution(); renderSeq(); renderNotes();
    hudKey = "";
    player.refresh();
  }
  I18N.onChange(renderPage);
})();
</script>
</body>
</html>
