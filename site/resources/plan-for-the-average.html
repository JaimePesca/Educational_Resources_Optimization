<script>
(function () {
  "use strict";
  var T = I18N.t;
  var MINUS = "−";
  var fmt = function (v, d) { if (Math.abs(v) < 5e-10) v = 0; return I18N.fmt(v, d == null ? 0 : d); };
  var money = function (v) {                    // rounded to whole dollars; U+2212 for negatives
    var r = Math.round(v), s = T("farm.money", { v: fmt(Math.abs(r)) });
    return r < 0 ? MINUS + s : s;
  };
  var sgnMoney = function (v) { var r = Math.round(v); return r > 0 ? "+" + money(r) : money(r); };
  var acres = function (v) { return fmt(v, 1); };
  var tons = function (v) { return T("farm.tons", { v: fmt(v) }); };
  var pct = function (m) { var p = Math.round((m - 1) * 100); return p > 0 ? "+" + p + "%" : p < 0 ? MINUS + (-p) + "%" : "0%"; };
  var dec = function () { return fmt(1.5, 1).replace(/\d/g, "") || "."; };
  var texNum = function (v) { return String(+v.toFixed(6)).replace(".", dec()); }; // no grouping inside TeX

  /* =====================================================================================
     The farmer problem of Birge and Louveaux (2011, Section 1.1). Every value on this page
     comes from LP.solve (assets/lp.js) run on the data below.
     ===================================================================================== */
  var D = {
    land: 500,                                  // acres
    cost: [150, 230, 260],                      // planting cost, $ per acre: wheat, corn, sugar beets
    yld: [2.5, 3, 20],                          // average yield, t per acre
    sell: [170, 150, 36],                       // selling price, $ per t (beets: up to the quota)
    low: 10,                                    // beets above the quota, $ per t
    buy: [238, 210],                            // purchase price, $ per t (beets cannot be bought)
    need: [200, 240],                           // cattle feed, t
    quota: 6000                                 // beets sold at the full price, t
  };
  var WX = [{ k: "good", m: 1.2 }, { k: "avg", m: 1 }, { k: "bad", m: 0.8 }];
  var PR = 1 / WX.length;                       // equally likely
  var CROPS = ["wheat", "corn", "beets"];
  var nLP = 0;
  function zeros(n) { var a = []; for (var i = 0; i < n; i++) a.push(0); return a; }
  function lp(p) {
    nLP++;
    var r = LP.solve(p);
    if (r.status !== "optimal") throw new Error("LP " + r.status);
    return r;
  }
  // extensive form over the scenarios [{m, p}]: x1..x3, then per scenario y1 w1 y2 w2 w3 w4
  // (y = bought, w = sold; w3 beets at the full price, w4 beets above the quota)
  function extensive(sc) {
    var n = 3 + 6 * sc.length, c = zeros(n), rows = [], land = zeros(n);
    for (var i = 0; i < 3; i++) { c[i] = -D.cost[i]; land[i] = 1; }
    rows.push({ a: land, op: "<=", b: D.land });
    sc.forEach(function (s, k) {
      var o = 3 + 6 * k, a;
      c[o] = -s.p * D.buy[0]; c[o + 1] = s.p * D.sell[0];
      c[o + 2] = -s.p * D.buy[1]; c[o + 3] = s.p * D.sell[1];
      c[o + 4] = s.p * D.sell[2]; c[o + 5] = s.p * D.low;
      a = zeros(n); a[0] = D.yld[0] * s.m; a[o] = 1; a[o + 1] = -1; rows.push({ a: a, op: ">=", b: D.need[0] });
      a = zeros(n); a[1] = D.yld[1] * s.m; a[o + 2] = 1; a[o + 3] = -1; rows.push({ a: a, op: ">=", b: D.need[1] });
      a = zeros(n); a[2] = -D.yld[2] * s.m; a[o + 4] = 1; a[o + 5] = 1; rows.push({ a: a, op: "<=", b: 0 });
      a = zeros(n); a[o + 4] = 1; rows.push({ a: a, op: "<=", b: D.quota });
    });
    var r = lp({ sense: "max", c: c, rows: rows });
    return { z: r.z, x: r.x.slice(0, 3) };
  }
  // second stage of a fixed plan x in a year with yield factor m: the best buy/sell decisions
  function evaluate(x, m) {
    var h = [0, 1, 2].map(function (i) { return D.yld[i] * m * x[i]; });
    var r = lp({
      sense: "max",
      c: [-D.buy[0], D.sell[0], -D.buy[1], D.sell[1], D.sell[2], D.low],
      rows: [
        { a: [1, -1, 0, 0, 0, 0], op: ">=", b: D.need[0] - h[0] },

    C = A.colors();
    HOT = C.accent.toLowerCase() === C["mit-bright"].toLowerCase() ? C.crit : C["mit-bright"];
    COLS = [C["mit-silver"], C.ink, C.accent];
    var S = state.sc;
    hud(S, t);
    if (hudKey !== cv.w + "x" + cv.h + ":" + hudEl.offsetHeight + ":" + hudEl.offsetWidth) layout();
    ctx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
    ctx.clearRect(0, 0, L.W, L.H);
    ctx.fillStyle = C.surface; ctx.fillRect(0, 0, L.W, L.H);
    ctx.lineCap = "butt"; ctx.lineJoin = "round"; ctx.setLineDash([]); ctx.globalAlpha = 1;
    drawGauges(S, t);
    drawRail(t);
    drawBranches(t);
    drawField(S, t);
    drawWeather(t);
    drawFlows(S, t);
    drawProfits(S, t);
    drawBand(S, t);
    drawCaption(S, t);
  }

  layout();
  var player = A.create({
    root: root,
    duration: DUR,
    chapters: CH.map(function (c, k) { return { t: c, key: "farm.ch" + (k + 1) }; }),
    onResize: function () { cv.fit(); layout(); },
    render: render
  });

  /* =====================================================================================
     Page text: status line, model, solution tables, notes
     ===================================================================================== */
  function planTxt(k) { var x = M.plan[k]; return { w: acres(x[0]), c: acres(x[1]), b: acres(x[2]) }; }
  function renderScenText() {
    var S = state.sc, other = S === "avg" ? "sto" : "avg";
    document.getElementById("farm-lg-ghost").textContent = T("farm.lg.ghost." + other);
    var nums = T("farm.anim.aria.nums", { eev: money(M.EEV), rp: money(M.RP), ws: money(M.WS), vss: money(M.VSS), evpi: money(M.EVPI) });
    var p = planTxt(S), O = M.out[S];
    stage.setAttribute("aria-label", T("farm.anim.aria." + S, {
      w: p.w, c: p.c, b: p.b, g: money(O[0].profit), a: money(O[1].profit), d: money(O[2].profit), e: money(M.exp[S])
    }) + " " + nums);
  }
  function renderStatus() {
    var S = state.sc, p = planTxt(S);
    document.getElementById("farm-status").innerHTML = T("farm.st." + S, {
      w: p.w, c: p.c, b: p.b, ev: money(M.EV), eev: money(M.EEV), rp: money(M.RP), vss: money(M.VSS)
    });
  }
  // phones: the formulas drop their comment column (the text around them names each line), keeping "for all s"
  var NARROW = 600, narrowNow = window.innerWidth < NARROW;
  function narrowTeX(tex) {
    if (!narrowNow) return tex;
    tex = tex.replace(/(y_\{2s\}) \+ /, "$1\\\\ & \\qquad + ");   // the long objective line breaks after the corn terms
    return tex.split("\\\\").map(function (line) {
      var i = line.indexOf("&&");
      if (i < 0) return line;
      var rest = line.slice(i), e = rest.indexOf("\\end{aligned}");
      return line.slice(0, i) + (/\\forall s/.test(rest) ? "\\quad \\forall s" : "") + (e >= 0 ? rest.slice(e) : "");
    }).join("\\\\");
  }
  window.addEventListener("resize", function () {
    var n = window.innerWidth < NARROW;
    if (n !== narrowNow) { narrowNow = n; renderModel(); }
  });
  function renderModel() {
    document.getElementById("farm-lg-low").textContent = T("farm.lg.low", { p: money(D.low) });
    // one column per crop, so the table stays narrow on phones
    var none = "<span class='dim'>" + T("farm.data.none") + "</span>";
    var h = "<thead><tr><th></th>" + CROPS.map(function (c) { return "<th class='num'>" + T("farm.crop." + c) + "</th>"; }).join("") + "</tr></thead><tbody>";
    var drow = function (key, f) { return "<tr><td>" + T(key) + "</td>" + [0, 1, 2].map(function (i) { return "<td class='num wr'>" + f(i) + "</td>"; }).join("") + "</tr>"; };
    h += drow("farm.data.cost", function (i) { return fmt(D.cost[i]); });
    h += drow("farm.data.yld", function (i) { return fmt(D.yld[i], 1); });
    h += drow("farm.data.sell", function (i) { return i < 2 ? fmt(D.sell[i]) : T("farm.data.beetSell", { hi: fmt(D.sell[2]), lo: fmt(D.low) }); });
    h += drow("farm.data.buy", function (i) { return i < 2 ? fmt(D.buy[i]) : none; });
    h += drow("farm.data.need", function (i) { return i < 2 ? fmt(D.need[i]) : none; });
    document.getElementById("farm-data").innerHTML = h + "</tbody>";
    document.getElementById("farm-data-note").textContent = T("farm.data.note", {
      land: fmt(D.land), q: fmt(D.quota), hi: money(D.sell[2]), lo: money(D.low),
      g: pct(WX[0].m), b: pct(WX[2].m), n: WX.length, p: "1/" + WX.length
    });
    var v = {
      pc1: D.cost[0], pc2: D.cost[1], pc3: D.cost[2], sp1: D.sell[0], sp2: D.sell[1], sp3: D.sell[2], lo: D.low,
      bp1: D.buy[0], bp2: D.buy[1], land: D.land, n1: D.need[0], n2: D.need[1], q: D.quota, ns: WX.length,
      th: WX.map(function (w) { return texNum(w.m); }).join(",\\ "), ps: "\\tfrac{1}{" + WX.length + "}"
    };
    var vp = {};
    Object.keys(v).forEach(function (k) { vp[k] = typeof v[k] === "number" ? fmt(v[k]) : v[k]; });
    vp.th = WX.map(function (w) { return fmt(w.m, 1); }).join("; "); vp.ps = "1/" + WX.length;
    TeX.set(document.getElementById("farm-ext"), narrowTeX(T("farm.ext.tex", v)), T("farm.ext.formula", vp));
    TeX.set(document.getElementById("farm-def"), narrowTeX(T("farm.def.tex")), T("farm.def.formula"));
    document.getElementById("farm-ext-note").textContent = T("farm.ext.note", {
      y1: fmt(D.yld[0], 1), y2: fmt(D.yld[1], 1), y3: fmt(D.yld[2], 1)
    });
  }
  function renderSolution() {
    var S = state.sc;
    document.getElementById("farm-sol-title").textContent = T("farm.sol.title", { n: M.n });
    document.getElementById("farm-s-ev").textContent = money(M.EV);
    document.getElementById("farm-s-eev").textContent = money(M.EEV);
    document.getElementById("farm-s-rp").textContent = money(M.RP);
    document.getElementById("farm-s-ws").textContent = money(M.WS);
    document.getElementById("farm-s-vss").textContent = money(M.VSS);
    document.getElementById("farm-s-evpi").textContent = money(M.EVPI);
    // first-stage plans
    var h = "<thead><tr><th>" + T("farm.plans.plan") + "</th><th class='num'>" + T("farm.crop.wheat") + "</th><th class='num'>" +
      T("farm.crop.corn") + "</th><th class='num'>" + T("farm.crop.beets") + "</th><th class='num wide'>" + T("farm.plans.promise") +
      "</th><th class='num'>" + T("farm.plans.exp") + "</th></tr></thead><tbody>";
    var row = function (name, x, prom, ex, on) {
      return "<tr" + (on ? " class='on'" : "") + "><td>" + name + "</td><td class='num'>" + acres(x[0]) + "</td><td class='num'>" + acres(x[1]) +
        "</td><td class='num'>" + acres(x[2]) + "</td><td class='num wide'>" + money(prom) + "</td><td class='num" + (on ? " acc" : "") + "'>" +
        (ex == null ? "" : money(ex)) + "</td></tr>";
    };
    h += row(T("farm.plans.avg"), M.plan.avg, M.EV, M.EEV, S === "avg");
    h += row(T("farm.plans.sto"), M.plan.sto, M.RP, M.exp.sto, S === "sto");
    WX.forEach(function (w, k) { h += row(T("farm.plans.ws." + w.k), M.ws[k].x, M.ws[k].z, null, false); });
    h += "<tr class='sum'><td colspan='4'>" + T("farm.plans.wsrow") + "</td><td class='num wide'></td><td class='num'>" + money(M.WS) + "</td></tr>";
    document.getElementById("farm-plans").innerHTML = h + "</tbody>";
    // second stage of the selected plan
    document.getElementById("farm-rec-head").textContent = T("farm.rec.head." + S);
    var O = M.out[S];
    // one column per year, so the table stays narrow on phones
    h = "<thead><tr><th></th>" + WX.map(function (w) { return "<th class='num'>" + T("farm.k.year." + w.k) + "</th>"; }).join("") +
      "<th class='num'>" + T("farm.rec.exp") + "</th></tr></thead><tbody>";
    var cell = function (o, i) {
      if (o.buy[i] > 1e-6) return "<td class='num buy'>" + T("farm.rec.bought", { v: fmt(o.buy[i]) }) + "</td>";
      return "<td class='num'>" + T("farm.rec.sold", { v: fmt(o.sold[i]) }) + "</td>";
    };
    var rrow = function (name, f, last) { return "<tr" + (last ? " class='sum'" : "") + "><td>" + name + "</td>" + O.map(f).join("") + (last || "<td></td>") + "</tr>"; };
    h += rrow(T("farm.crop.wheat"), function (o) { return cell(o, 0); });
    h += rrow(T("farm.crop.corn"), function (o) { return cell(o, 1); });
    h += rrow(T("farm.rec.hi", { p: money(D.sell[2]) }), function (o) { return "<td class='num'>" + fmt(o.hi) + "</td>"; });
    h += rrow(T("farm.rec.lo", { p: money(D.low) }), function (o) { return "<td class='num'>" + fmt(o.lo) + "</td>"; });
    // a currency sign written before the number may wrap above it on phones (the digits stay together)
    var moneyW = function (v) { return money(v).replace(/(\$)\u00a0/, "$1 "); };
    h += rrow(T("farm.rec.profit"), function (o) { return "<td class='num mw'>" + moneyW(o.profit) + "</td>"; }, "<td class='num mw acc'>" + moneyW(M.exp[S]) + "</td>");
    document.getElementById("farm-rec").innerHTML = h + "</tbody>";
    document.getElementById("farm-check").textContent = T("farm.sol.check", { n: M.n });
  }
  function renderNotes() {
    var a = M.out.avg, s = M.out.sto, xa = M.plan.avg, xs = M.plan.sto;
    document.getElementById("farm-n1").textContent = T("farm.n.p1", {
      b: acres(xa[2]), q: fmt(D.quota), lo: fmt(a[0].lo), plo: money(D.low), buy: fmt(a[2].buy[1]), gp: money(a[0].profit), bp: money(a[2].profit)
    });
    document.getElementById("farm-n2").textContent = T("farm.n.p2", {
      w: acres(xs[0]), b: acres(xs[2]), wa: acres(xa[0]), ba: acres(xa[2]), hg: fmt(s[0].harvest[2]),
      pa: money(s[1].profit), pb: money(a[1].profit), bs: money(s[2].profit), ba2: money(a[2].profit),
      gs: money(s[0].profit), ga: money(a[0].profit)
    });
    document.getElementById("farm-n3").textContent = T("farm.n.p3", {
      eev: money(M.EEV), rp: money(M.RP), ws: money(M.WS), vss: money(M.VSS), evpi: money(M.EVPI)
    });
    document.getElementById("farm-n4").textContent = T(M.EV > M.WS ? "farm.n.p4" : "farm.n.p4b", { ev: money(M.EV), ws: money(M.WS), eev: money(M.EEV) });
  }

  var segBtns = document.querySelectorAll("#farm-seg button");
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      if (state.sc === b.getAttribute("data-sc")) return;
      state.sc = b.getAttribute("data-sc");
      segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      renderScenText(); renderStatus(); renderSolution();
      player.refresh();
    });
  });

  function renderPage() {
    renderScenText(); renderStatus(); renderModel(); renderSolution(); renderNotes();
    hudKey = "";
    player.refresh();
  }
  I18N.onChange(renderPage);
})();
</script>
</body>
</html>
