<!doctype html>
<html lang="en" data-title-key="tsp.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23750014%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27Helvetica,Arial,sans-serif%27 font-size=%2716%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3Ex*%3C/text%3E%3C/svg%3E">
<title>Patrol Route</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="../assets/site.css?v=__BUILD__">
<style>
  .wrap { max-width: 1080px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 880px) { .layout { grid-template-columns: 1fr; } }

  canvas#map { display: block; width: 100%; aspect-ratio: 4 / 3; border-radius: 3px; background: var(--surface2); max-width: 100%; }
  .maplegend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 10px; align-items: center; font-size: 13px; color: var(--ink2); }
  .maplegend > span { display: inline-flex; align-items: center; gap: 7px; }
  .sw { width: 14px; height: 3px; border-radius: 2px; flex: none; }
  .sw.dot { width: 10px; height: 10px; border-radius: 50%; }
  .sw.dash { background: repeating-linear-gradient(90deg, var(--accent) 0 4px, transparent 4px 7px); }

  .stack { display: flex; flex-direction: column; gap: 18px; }
  .controls { display: flex; flex-direction: column; gap: 13px; }
  .crow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button.btn {
    font: 600 14px var(--font-sans); color: var(--on-solid); background: var(--accent);
    border: none; border-radius: 4px; padding: 10px 18px; cursor: pointer; min-width: 128px;
  }
  button.btn:hover { filter: brightness(1.08); }
  button.quiet { background: transparent; color: var(--ink2); border: 1.5px solid var(--border); min-width: 0; }
  .field { display: grid; gap: 5px; }
  .field > label, .field > .flabel { font-size: 12.5px; font-weight: 600; color: var(--ink2); }
  select, input[type="range"] { accent-color: var(--accent); }
  .field select {
    font: 500 14px var(--font-sans); color: var(--ink); background: var(--surface2);
    border: 1px solid var(--border); border-radius: 3px; padding: 8px 10px;
  }
  .seg { display: inline-flex; flex-wrap: wrap; border: 1.5px solid var(--border); border-radius: 4px; overflow: hidden; }
  .seg button {
    font: 600 13px var(--font-sans); padding: 8px 13px; border: none; cursor: pointer;
    background: transparent; color: var(--ink2);
  }
  .seg button[aria-pressed="true"] { background: var(--pine); color: var(--on-solid); }
  .nrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
  .nrow output { font-family: "JetBrains Mono", monospace; font-size: 13px; font-variant-numeric: tabular-nums; }

  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .tile { background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 10px 12px; }
  .tile .tl { font-family: "JetBrains Mono", monospace; font-size: 10.5px; letter-spacing: 0.11em; text-transform: uppercase; color: var(--muted); }
  .tile .tv { font-family: "JetBrains Mono", monospace; font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .tile .tv.best { color: var(--accent-text); }
  .lastmove {
    font-family: "JetBrains Mono", monospace; font-size: 12.5px; color: var(--ink2);
    background: var(--surface2); border: 1px solid var(--border); border-radius: 3px;
    padding: 9px 12px; line-height: 1.7; min-height: 3.2em; margin-top: 10px;
  }
  .lastmove b { color: var(--ink); font-weight: 600; }
  .lastmove .acc { color: var(--pine-text); font-weight: 600; }
  .lastmove .rej { color: var(--crit); font-weight: 600; }
  .statuspill {
    display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px;
    border: 1px solid var(--border); color: var(--muted); margin-left: 6px; vertical-align: 2px;
  }
  .statuspill.run { color: var(--accent-text); border-color: currentColor; }
  .statuspill.done { color: var(--pine-text); border-color: currentColor; }

  .chartcard { position: relative; }
  svg#chart { display: block; width: 100%; height: auto; }
  #ctip {
    position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
    border-radius: 3px; padding: 6px 10px; font-family: "JetBrains Mono", monospace; font-size: 12px;
    box-shadow: 0 3px 14px rgba(0, 0, 0, 0.16); white-space: nowrap; z-index: 5; line-height: 1.5;
  }
  .chart-foot { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 8px; font-size: 13px; color: var(--ink2); }
  .chart-foot > span { display: inline-flex; align-items: center; gap: 7px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="backlink" href="../index.html#learn" data-keep-lang><span aria-hidden="true">←</span> <span data-i18n="nav.backToPath"></span></a>
    <div class="lang" data-lang-switcher></div>
  </div>
</header>

<div class="wrap">
  <header class="masthead">
    <p class="eyebrow" data-i18n-html="tsp.eyebrow"></p>
    <h1 data-i18n="tsp.title"></h1>
    <p class="lede" data-i18n-html="tsp.lede"></p>
  </header>

  <div class="layout">
    <div class="card">
      <h2><span class="kicker" data-i18n="tsp.map.kicker"></span><span data-i18n="tsp.map.title"></span> <span class="statuspill" id="status"></span></h2>
      <canvas id="map"></canvas>
      <div class="maplegend">
        <span><span class="sw dot" style="background:var(--pine)"></span><span data-i18n="tsp.legend.tower"></span></span>
        <span><span class="sw dot" style="background:var(--accent)"></span><span data-i18n="tsp.legend.base"></span></span>
        <span><span class="sw" style="background:var(--c-blue)"></span><span data-i18n="tsp.legend.current"></span></span>
        <span><span class="sw dash"></span><span data-i18n="tsp.legend.best"></span></span>
      </div>
    </div>

    <div class="stack">
      <div class="card controls">
        <div class="crow">
          <button class="btn" id="play" type="button"></button>
          <button class="btn quiet" id="restart" type="button" data-i18n="tsp.btn.restart"></button>
          <button class="btn quiet" id="newmap" type="button" data-i18n="tsp.btn.newmap"></button>
        </div>
        <div class="field">
          <span class="flabel" id="modelbl" data-i18n="tsp.strategy"></span>
          <div class="seg" role="group" aria-labelledby="modelbl">
            <button type="button" id="mode-sa" aria-pressed="true" data-i18n="tsp.mode.sa"></button>
            <button type="button" id="mode-hc" aria-pressed="false" data-i18n="tsp.mode.hc"></button>
          </div>
        </div>
        <div class="crow">
          <div class="field">
            <label for="speed" data-i18n="tsp.speed"></label>
            <select id="speed">
              <option value="12">1×</option>
              <option value="48" selected>4×</option>
              <option value="192">16×</option>
            </select>
          </div>
          <div class="field">
            <label for="cool" data-i18n="tsp.cooling"></label>
            <select id="cool">
              <option value="0.999" data-i18n="tsp.cool.fast"></option>
              <option value="0.9995" selected data-i18n="tsp.cool.medium"></option>
              <option value="0.9998" data-i18n="tsp.cool.slow"></option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="ncities" data-i18n="tsp.towers"></label>
          <div class="nrow">
            <input type="range" id="ncities" min="10" max="40" step="1" value="24">
            <output id="ncitieso">24</output>
          </div>
        </div>
      </div>

      <div class="card">
        <h2><span class="kicker" data-i18n="tsp.tel.kicker"></span><span data-i18n="tsp.tel.title"></span></h2>
        <div class="tiles">
          <div class="tile"><div class="tl" data-i18n="tsp.tel.iter"></div><div class="tv" id="t-iter">0</div></div>
          <div class="tile"><div class="tl" data-i18n="tsp.tel.temp"></div><div class="tv" id="t-temp">·</div></div>
          <div class="tile"><div class="tl" data-i18n="tsp.tel.cur"></div><div class="tv" id="t-cur">·</div></div>
          <div class="tile"><div class="tl" data-i18n="tsp.tel.best"></div><div class="tv best" id="t-best">·</div></div>
        </div>
        <div class="lastmove" id="lastmove"></div>
      </div>
    </div>
  </div>

  <div class="card chartcard">
    <h2><span class="kicker" data-i18n="tsp.chart.kicker"></span><span data-i18n="tsp.chart.title"></span></h2>
    <svg id="chart" viewBox="0 0 640 240" role="img" data-i18n-attr="aria-label:tsp.chart.aria"></svg>
    <div id="ctip" hidden></div>
    <div class="chart-foot">
      <span><span class="sw" style="background:var(--c-blue)"></span><span data-i18n="tsp.tel.cur"></span></span>
      <span><span class="sw" style="background:var(--accent)"></span><span data-i18n="tsp.chart.bestLegend"></span></span>
    </div>
  </div>

  <section>
    <details open>
      <summary data-i18n="tsp.d1.title"></summary>
      <div class="body">
        <p data-i18n-html="tsp.d1.p1"></p>
        <div class="formula" data-i18n="tsp.d1.formula"></div>
        <p data-i18n-html="tsp.d1.p2"></p>
      </div>
    </details>
    <details>
      <summary data-i18n="tsp.d2.title"></summary>
      <div class="body">
        <p data-i18n-html="tsp.d2.p1"></p>
        <p data-i18n-html="tsp.d2.p2"></p>
        <p data-i18n-html="tsp.d2.p3"></p>
        <p data-i18n-html="tsp.d2.p4"></p>
      </div>
    </details>
    <details>
      <summary data-i18n="tsp.d3.title"></summary>
      <div class="body">
        <p data-i18n-html="tsp.d3.p1"></p>
      </div>
    </details>
  </section>

  <p class="note" data-i18n="tsp.footer"></p>
</div>

<script src="../assets/i18n.js?v=__BUILD__" charset="utf-8"></script>
<script src="../locales/en.js?v=__BUILD__" charset="utf-8"></script>
<script>
(function () {
  "use strict";
  var t = I18N.t;
  var $ = function (id) { return document.getElementById(id); };
  var css = function (n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); };
  var fmt = function (v, d) { return I18N.fmt(v, d, d); };
  var fmtInt = function (v) { return I18N.fmt(v, 0); };

  // ---- world ----
  var WX = 100, WY = 75; // km
  var N = 24, cities = [], tour = [], best = [], curD = 0, bestD = 0;
  var T = 0, T0 = 0, Tmin = 0, alpha = 0.9995, iter = 0, mode = "sa";
  var running = false, finished = false, sinceImprove = 0;
  var hist = [], histStride = 20, lastProp = null;
  var status = "ready";

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function makeCities() {
    cities = [];
    var guard = 0;
    while (cities.length < N && guard++ < 4000) {
      var p = { x: rnd(5, WX - 5), y: rnd(5, WY - 5) };
      if (cities.every(function (q) { return (q.x - p.x) * (q.x - p.x) + (q.y - p.y) * (q.y - p.y) > 16; }))
        cities.push(p);
    }
    N = cities.length;
  }
  function d(i, j) {
    var a = cities[i], b = cities[j];
    return Math.hypot(a.x - b.x, a.y - b.y);
  }
  function tourDist(tt) {
    var s = 0;
    for (var i = 0; i < tt.length; i++) s += d(tt[i], tt[(i + 1) % tt.length]);
    return s;
  }

  function resetSearch() {
    tour = cities.map(function (_, i) { return i; });
    for (var i = tour.length - 1; i > 1; i--) { // Fisher-Yates, keep 0 (base) first
      var j = 1 + Math.floor(Math.random() * i);
      var tmp = tour[i]; tour[i] = tour[j]; tour[j] = tmp;
    }
    curD = tourDist(tour);
    best = tour.slice(); bestD = curD;
    T0 = (curD / N) * 1.6; T = T0; Tmin = T0 * 0.001;
    alpha = +$("cool").value;
    iter = 0; sinceImprove = 0; finished = false;
    hist = [{ i: 0, c: curD, b: bestD }]; histStride = 20;
    lastProp = null;
    setStatus("ready");
    drawAll();
  }

  function step() {
    // one 2-opt proposal
    var n = tour.length;
    var i = 1 + Math.floor(Math.random() * (n - 2));
    var j = i + 1 + Math.floor(Math.random() * (n - i - 1));
    var a = tour[i - 1], b = tour[i], c = tour[j], e = tour[(j + 1) % n];
    var delta = d(a, c) + d(b, e) - d(a, b) - d(c, e);
    var accept;
    if (delta < 0) { accept = true; }
    else if (mode === "sa") {
      var p = Math.exp(-delta / T);
      accept = Math.random() < p;
      lastProp = { delta: delta, p: p, acc: accept };
    } else {
      accept = false;
      lastProp = { delta: delta, p: 0, acc: false };
    }
    if (accept) {
      var lo = i, hi = j; // reverse tour[i..j]
      while (lo < hi) { var tmp = tour[lo]; tour[lo] = tour[hi]; tour[hi] = tmp; lo++; hi--; }
      curD += delta;
      if (curD < bestD - 1e-9) { bestD = curD; best = tour.slice(); sinceImprove = 0; }
      else sinceImprove++;
    } else sinceImprove++;
    if (mode === "sa") T = Math.max(Tmin, T * alpha);
    iter++;
    if (iter % histStride === 0) {
      hist.push({ i: iter, c: curD, b: bestD });
      if (hist.length > 1600) { // downsample
        hist = hist.filter(function (_, k) { return k % 2 === 0; });
        histStride *= 2;
      }
    }
    // stopping rule
    if (mode === "sa" && T <= Tmin && sinceImprove > 4000) finish();
    if (mode === "hc" && sinceImprove > 6000) finish();
    if (iter > 200000) finish();
  }

  function finish() {
    running = false; finished = true;
    hist.push({ i: iter, c: curD, b: bestD });
    setStatus("done");
    renderPlay();
    renderLastMove();
  }

  function setStatus(s) {
    status = s;
    var el = $("status");
    el.textContent = t("tsp.status." + s);
    el.className = "statuspill" + (s === "running" ? " run" : s === "done" ? " done" : "");
  }
  function renderPlay() { $("play").textContent = running ? "❚❚ " + t("tsp.btn.pause") : "▶ " + t("tsp.btn.play"); }

  // ---- map drawing ----
  var canvas = $("map"), ctx = canvas.getContext("2d");
  function resizeCanvas() {
    var r = canvas.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    if (canvas.width !== Math.round(r.width * dpr)) {
      canvas.width = Math.round(r.width * dpr);
      canvas.height = Math.round(r.height * dpr);
    }
  }
  function drawMap() {
    resizeCanvas();
    var w = canvas.width, h = canvas.height;
    var dpr = window.devicePixelRatio || 1;
    var pad = 14 * dpr;
    var sx = function (x) { return pad + x / WX * (w - 2 * pad); };
    var sy = function (y) { return pad + y / WY * (h - 2 * pad); };
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = css("--grid"); ctx.lineWidth = 1;
    for (var gx = 0; gx <= WX; gx += 10) {
      ctx.beginPath(); ctx.moveTo(sx(gx), sy(0)); ctx.lineTo(sx(gx), sy(WY)); ctx.stroke();
    }
    for (var gy = 0; gy <= WY; gy += 10) {
      ctx.beginPath(); ctx.moveTo(sx(0), sy(gy)); ctx.lineTo(sx(WX), sy(gy)); ctx.stroke();
    }
    function trace(route) {
      ctx.beginPath();
      route.forEach(function (ci, k) {
        var p = cities[ci];
        if (k === 0) ctx.moveTo(sx(p.x), sy(p.y)); else ctx.lineTo(sx(p.x), sy(p.y));
      });
      ctx.closePath(); ctx.stroke();
    }
    if (best.length && bestD < curD - 1e-9) {
      ctx.strokeStyle = css("--accent"); ctx.lineWidth = 2 * dpr;
      ctx.setLineDash([6 * dpr, 6 * dpr]);
      trace(best);
      ctx.setLineDash([]);
    }
    if (tour.length) {
      ctx.strokeStyle = css("--c-blue"); ctx.lineWidth = 2 * dpr;
      trace(tour);
    }
    cities.forEach(function (p, i) {
      ctx.beginPath();
      ctx.arc(sx(p.x), sy(p.y), (i === 0 ? 6.5 : 4.5) * dpr, 0, Math.PI * 2);
      ctx.fillStyle = i === 0 ? css("--accent") : css("--pine");
      ctx.fill();
      ctx.lineWidth = 1.5 * dpr; ctx.strokeStyle = css("--surface");
      ctx.stroke();
    });
    if (cities.length) {
      var b0 = cities[0], lbl = t("tsp.legend.base");
      ctx.font = "600 " + 12 * dpr + "px Neue Haas Grotesk Text, Helvetica Neue, Helvetica, Arimo, Arial, sans-serif";
      ctx.fillStyle = css("--ink2");
      ctx.strokeStyle = css("--halo"); ctx.lineWidth = 3 * dpr;
      ctx.strokeText(lbl, sx(b0.x) + 9 * dpr, sy(b0.y) - 8 * dpr);
      ctx.fillText(lbl, sx(b0.x) + 9 * dpr, sy(b0.y) - 8 * dpr);
    }
  }

  // ---- chart ----
  var svg = $("chart"), NS = "http://www.w3.org/2000/svg";
  var CW = 640, CH = 240, CM = { l: 52, r: 78, t: 12, b: 34 };
  function el(tag, attrs) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  function txt(x, y, s, attrs) {
    var n = el("text", Object.assign({ x: x, y: y, "font-size": 11, fill: css("--muted"),
      "font-family": "JetBrains Mono, monospace" }, attrs || {}));
    n.textContent = s;
    return n;
  }
  function niceTicks(min, max, count) {
    var span = max - min || 1;
    var stp = Math.pow(10, Math.floor(Math.log10(span / count)));
    var err = span / count / stp;
    stp *= err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1;
    var out = [];
    for (var v = Math.ceil(min / stp) * stp; v <= max + 1e-9; v += stp) out.push(v);
    return out;
  }
  function drawChart() {
    svg.textContent = "";
    if (hist.length < 2) {
      svg.appendChild(txt(CW / 2, CH / 2, t("tsp.chart.empty"),
        { "text-anchor": "middle", "font-size": 13, "font-family": "Neue Haas Grotesk Text, Helvetica Neue, Helvetica, Arimo, Arial, sans-serif", fill: css("--muted") }));
      return;
    }
    var xmax = hist[hist.length - 1].i || 1;
    var ymin = Infinity, ymax = -Infinity;
    hist.forEach(function (p) {
      ymin = Math.min(ymin, p.c, p.b);
      ymax = Math.max(ymax, p.c);
    });
    var padY = (ymax - ymin) * 0.08 + 1;
    ymin -= padY; ymax += padY;
    var X = function (v) { return CM.l + v / xmax * (CW - CM.l - CM.r); };
    var Y = function (v) { return CH - CM.b - (v - ymin) / (ymax - ymin) * (CH - CM.t - CM.b); };

    niceTicks(ymin, ymax, 4).forEach(function (v) {
      svg.appendChild(el("line", { x1: CM.l, y1: Y(v), x2: CW - CM.r, y2: Y(v), stroke: css("--grid"), "stroke-width": 1 }));
      svg.appendChild(txt(CM.l - 7, Y(v) + 4, fmtInt(v), { "text-anchor": "end" }));
    });
    niceTicks(0, xmax, 5).forEach(function (v) {
      svg.appendChild(txt(X(v), CH - CM.b + 16, v >= 1000 ? Math.round(v / 1000) + "k" : Math.round(v), { "text-anchor": "middle" }));
    });
    svg.appendChild(el("line", { x1: CM.l, y1: CH - CM.b, x2: CW - CM.r, y2: CH - CM.b, stroke: css("--axis"), "stroke-width": 1.2 }));
    svg.appendChild(txt((CM.l + CW - CM.r) / 2, CH - 4, t("tsp.chart.xlabel"), { "text-anchor": "middle", "font-family": "Neue Haas Grotesk Text, Helvetica Neue, Helvetica, Arimo, Arial, sans-serif", "font-size": 12, fill: css("--ink2") }));
    svg.appendChild(txt(14, CM.t + 2, "km", { "font-family": "Neue Haas Grotesk Text, Helvetica Neue, Helvetica, Arimo, Arial, sans-serif", "font-size": 12, fill: css("--ink2") }));

    function path(key, color) {
      var dstr = hist.map(function (p, k) { return (k ? "L" : "M") + X(p.i).toFixed(1) + " " + Y(p[key]).toFixed(1); }).join(" ");
      svg.appendChild(el("path", { d: dstr, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round" }));
    }
    path("c", css("--c-blue"));
    path("b", css("--accent"));
    var last = hist[hist.length - 1];
    var yC = Y(last.c), yB = Y(last.b);
    if (Math.abs(yC - yB) < 14) yB = yC + 14; // keep end labels from overlapping when the curves meet
    [[css("--c-blue"), t("tsp.chart.endCur"), Y(last.c), yC], [css("--accent"), t("tsp.chart.endBest"), Y(last.b), yB]].forEach(function (s) {
      svg.appendChild(el("circle", { cx: X(last.i), cy: s[2], r: 3.5, fill: s[0] }));
      svg.appendChild(txt(X(last.i) + 7, s[3] + 4, s[1], {
        fill: css("--ink2"), "font-family": "Neue Haas Grotesk Text, Helvetica Neue, Helvetica, Arimo, Arial, sans-serif", "font-weight": 600,
        stroke: css("--halo"), "stroke-width": 4, "paint-order": "stroke"
      }));
    });
    svg._scales = { xmax: xmax };
  }

  // chart hover
  var ctip = $("ctip");
  svg.addEventListener("pointermove", function (ev) {
    if (!svg._scales || hist.length < 2) return;
    var r = svg.getBoundingClientRect();
    var px = (ev.clientX - r.left) / r.width * CW;
    var it = (px - CM.l) / (CW - CM.l - CM.r) * svg._scales.xmax;
    if (it < 0 || it > svg._scales.xmax) { ctip.hidden = true; return; }
    var lo = 0, hi = hist.length - 1;
    while (lo < hi) { var mid = (lo + hi) >> 1; if (hist[mid].i < it) lo = mid + 1; else hi = mid; }
    var p = hist[lo];
    ctip.innerHTML = t("tsp.tip", { i: fmtInt(p.i), c: fmt(p.c, 1), b: fmt(p.b, 1) });
    ctip.hidden = false;
    var host = svg.parentElement.getBoundingClientRect();
    var tx = ev.clientX - host.left + 14, ty = ev.clientY - host.top + 8;
    if (tx + 170 > host.width) tx -= 185;
    ctip.style.left = tx + "px"; ctip.style.top = ty + "px";
  });
  svg.addEventListener("pointerleave", function () { ctip.hidden = true; });

  // ---- telemetry ----
  function renderLastMove() {
    var box = $("lastmove");
    if (finished) {
      var gain = hist.length ? (1 - bestD / hist[0].c) * 100 : 0;
      box.innerHTML = t("tsp.done", { iter: fmtInt(iter), best: fmt(bestD, 1), gain: fmt(gain, 0) }) +
        (mode === "hc" ? "<br>" + t("tsp.stuck") : "");
    } else if (running && lastProp) {
      box.innerHTML = t("tsp.lastWorse", { delta: fmt(lastProp.delta, 2) }) + "<br>" +
        (mode === "sa"
          ? t("tsp.prob", { p: fmt(lastProp.p, 2) }) + " → " +
            (lastProp.acc ? '<span class="acc">' + t("tsp.accepted") + "</span>" : '<span class="rej">' + t("tsp.rejected") + "</span>")
          : t("tsp.onlyImprove") + ' → <span class="rej">' + t("tsp.rejected") + "</span>");
    } else if (!running && iter === 0) {
      box.innerHTML = t("tsp.pressPlay");
    }
  }
  function drawStats() {
    $("t-iter").textContent = fmtInt(iter);
    $("t-temp").textContent = mode === "sa" ? fmt(T, 2) : "·";
    $("t-cur").textContent = curD ? fmt(curD, 1) + " km" : "·";
    $("t-best").textContent = bestD ? fmt(bestD, 1) + " km" : "·";
    renderLastMove();
  }
  function drawAll() { drawMap(); drawChart(); drawStats(); }

  // ---- loop ----
  var lastDraw = 0;
  function loop(now) {
    if (!running) return;
    var K = +$("speed").value;
    for (var k = 0; k < K && running && !finished; k++) step();
    if (now - lastDraw > 40) { drawAll(); lastDraw = now; }
    if (running) requestAnimationFrame(loop);
    else drawAll();
  }

  // ---- controls ----
  function stop() { running = false; renderPlay(); }
  $("play").addEventListener("click", function () {
    if (finished) resetSearch();
    running = !running;
    renderPlay();
    setStatus(running ? "running" : "paused");
    if (running) requestAnimationFrame(loop);
  });
  $("restart").addEventListener("click", function () { stop(); resetSearch(); });
  $("newmap").addEventListener("click", function () { stop(); makeCities(); resetSearch(); });
  $("ncities").addEventListener("input", function (e) {
    $("ncitieso").textContent = e.target.value;
    N = +e.target.value;
    stop(); makeCities(); resetSearch();
  });
  $("cool").addEventListener("change", function () {
    if (!running) resetSearch();
    else alpha = +$("cool").value;
  });
  function setMode(m) {
    mode = m;
    $("mode-sa").setAttribute("aria-pressed", m === "sa" ? "true" : "false");
    $("mode-hc").setAttribute("aria-pressed", m === "hc" ? "true" : "false");
    stop(); resetSearch();
  }
  $("mode-sa").addEventListener("click", function () { setMode("sa"); });
  $("mode-hc").addEventListener("click", function () { setMode("hc"); });

  window.addEventListener("resize", drawMap);
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawAll);

  var booted = false;
  I18N.onChange(function () {
    if (!booted) { booted = true; makeCities(); resetSearch(); }
    setStatus(status);
    renderPlay();
    drawAll();
  });
})();
</script>
</body>
</html>
