<style>
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin-bottom: 14px; }
  .flabel { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); }
  .seg { display: inline-flex; border: 1.5px solid var(--border); border-radius: 4px; overflow: hidden; }
  .seg button {
    font: 600 13.5px var(--font-mono); padding: 7px 13px; border: none; cursor: pointer;
    background: transparent; color: var(--ink2);
  }
  .seg button + button { border-left: 1.5px solid var(--border); }
  .seg button:hover { background: var(--surface2); }
  .seg button[aria-pressed="true"] { background: var(--pine); color: var(--on-solid); }
  button.btn {
    font: 600 13.5px var(--font-sans); color: var(--on-solid); background: var(--accent);
    border: none; border-radius: 4px; padding: 8px 14px; cursor: pointer;
  }
  button.btn:hover { filter: brightness(1.08); }
  button.btn:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
  button.ghost { background: transparent; color: var(--accent-text); border: 1.5px solid var(--accent-text); }
  button.quiet { background: transparent; color: var(--ink2); border: 1.5px solid var(--border); }

  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .two.wide { grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); }
  @media (max-width: 800px) { .two, .two.wide { grid-template-columns: 1fr; } }

  /* ---- matrices ---- */
  .mwrap { overflow-x: auto; padding: 2px; }
  table.mx { border-collapse: separate; border-spacing: 3px; }
  table.mx th { font: 600 12px var(--font-mono); color: var(--ink2); padding: 0 3px; white-space: nowrap; }
  table.mx th.rh { text-align: right; font: 600 13px var(--font-sans); }
  table.mx th.corner { color: var(--muted); font-weight: 400; font-size: 10.5px; text-align: right; }
  table.mx td { padding: 0; }
  .cell {
    position: relative; width: 46px; height: 46px; padding: 0; border: 1px solid var(--border); border-radius: 3px;
    background: var(--surface); color: var(--ink); cursor: pointer; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    font: 600 15px var(--font-mono); font-variant-numeric: tabular-nums;
  }
  .mx.sm .cell { width: 40px; height: 34px; font-size: 13px; }
  .cell > span { position: relative; pointer-events: none; }
  .cell .heat { position: absolute; inset: 0; background: var(--c-aqua); }
  .cell .xv { font-size: 10.5px; font-weight: 400; color: var(--muted); line-height: 1; }
  .cell.one .xv { color: var(--pine-text); font-weight: 600; }
  .cell.frac .xv { color: var(--crit); font-weight: 600; }
  .cell .ring { position: absolute; inset: 2px; border-radius: 2px; }
  .cell.one .ring { border: 2.5px solid var(--pine); }
  .cell.frac .ring { border: 2px dashed var(--c-violet); }
  .cell .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--c-violet); }
  .cell .ipm { position: absolute; top: 0; right: 0; width: 0; height: 0; border-top: 11px solid var(--accent); border-left: 11px solid transparent; }
  .cell[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
  .editbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 8px; font-size: 13.5px; color: var(--ink2); min-height: 34px; }
  .editbar b { color: var(--ink); }
  .step {
    width: 30px; height: 30px; border: 1.5px solid var(--border); border-radius: 4px; background: var(--surface);
    color: var(--ink); font: 600 16px var(--font-mono); cursor: pointer; padding: 0;
  }
  .step:disabled { opacity: 0.4; cursor: default; }
  .editbar .grp { display: inline-flex; align-items: center; gap: 6px; }
  .editbar output { font: 600 14px var(--font-mono); min-width: 3ch; text-align: center; }
  .editbar .hint { font-size: 12px; color: var(--muted); }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 12.5px; color: var(--ink2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 14px; height: 14px; border-radius: 2px; flex: none; position: relative; }
  .sw.one { border: 2.5px solid var(--pine); }
  .sw.frac { border: 2px dashed var(--c-violet); }
  .sw.ipm { border-top: 11px solid var(--accent); border-left: 11px solid transparent; width: 0; height: 0; border-radius: 0; }
  .sw.line { height: 3px; }
  .sw.dash { height: 0; border-top: 2px dashed var(--accent); }
  .sw.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-aqua); }
  .sw.vline { height: 0; border-top: 2px dashed var(--ink2); }

  svg.fig { display: block; width: 100%; height: auto; }

  /* ---- results ---- */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 16px; }
  .stat { background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 9px 12px; }
  .slabel { display: block; font: 400 10.5px var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .sval { font: 600 20px var(--font-mono); font-variant-numeric: tabular-nums; }
  .stat.chipbox { display: flex; align-items: center; }
  .chip { display: inline-block; font-weight: 600; font-size: 13px; padding: 4px 11px; border-radius: 99px; border: 1.5px solid currentColor; }
  .chip.int { color: var(--good-text); }
  .chip.frac { color: var(--crit); }
  .chip.inf { color: var(--muted); border-style: dashed; }
  .status { margin: 12px 0 0; color: var(--ink2); font-size: 14.5px; max-width: 78ch; }
  .mix { list-style: none; padding: 0; margin: 8px 0 0; font: 12.5px var(--font-mono); color: var(--ink2); }
  .mix li { border-left: 3px solid var(--c-violet); background: var(--surface2); padding: 4px 9px; margin-bottom: 4px; }
  .mix li.sum { border-left-color: var(--pine); color: var(--ink); }

  /* ---- side constraint ---- */
  .toggle { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 14px; cursor: pointer; }
  input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; flex: none; margin: 0; }
  .ctl { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; margin: 12px 0 6px; }
  .ctl label { font-size: 13.5px; color: var(--ink2); white-space: nowrap; }
  .ctl output { font: 600 13px var(--font-mono); min-width: 9ch; text-align: right; }
  input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; min-width: 60px; }
  .zone { font-size: 13.5px; color: var(--ink2); margin: 0 0 14px; min-height: 2.8em; }
  .zone.bind { color: var(--crit); }
  .mlabel { font-size: 13px; color: var(--ink2); margin: 0 0 6px; }
  .chartnote { font-size: 13px; color: var(--muted); margin: 8px 0 0; }

  /* ---- TU grid ---- */
  .whyp { margin: 0 0 12px; color: var(--ink2); max-width: 78ch; font-size: 14.5px; }
  table.tu { border-collapse: separate; border-spacing: 2px; font: 12px var(--font-mono); }
  table.tu th { font-weight: 400; color: var(--muted); padding: 0 4px; white-space: nowrap; }
  table.tu th.rh { text-align: right; color: var(--ink2); font-family: var(--font-sans); font-size: 12.5px; }
  table.tu td { width: 30px; height: 26px; text-align: center; border-radius: 2px; color: var(--muted); background: var(--surface); border: 1px solid var(--grid); }
  table.tu td.one { background: var(--surface2); color: var(--ink); font-weight: 600; border-color: var(--axis); }
  table.tu td.side { color: var(--accent-text); font-weight: 600; }
  table.tu td.pick { outline: 2px solid var(--accent); outline-offset: -1px; background: var(--sel); }
  table.tu th.pick { color: var(--accent-text); font-weight: 600; }
  @media (max-width: 440px) { .cell { width: 42px; height: 44px; } table.tu td { width: 25px; } table.tu th { padding: 0 2px; } }
  .tures { margin: 10px 0 0; font-size: 14px; color: var(--ink2); min-height: 1.5em; }
  .tures b.ok { color: var(--good-text); }
  .tures b.no { color: var(--crit); }
</style>

    for (v = Math.ceil(x0 / s) * s; v <= x1 + 1e-9; v += s) {
      g.appendChild(el("line", { x1: sx(v), y1: M.t, x2: sx(v), y2: H - M.b, stroke: css("--grid") }));
      g.appendChild(el("text", { x: sx(v), y: H - M.b + 16, "text-anchor": "middle", fill: css("--muted"), "font-size": 11, "font-family": mono }, fmt(v, 0)));
    }
    s = niceStep(y1 - y0);
    for (v = Math.ceil(y0 / s) * s; v <= y1 + 1e-9; v += s) {
      g.appendChild(el("line", { x1: M.l, y1: sy(v), x2: W - M.r, y2: sy(v), stroke: css("--grid") }));
      g.appendChild(el("text", { x: M.l - 7, y: sy(v) + 4, "text-anchor": "end", fill: css("--muted"), "font-size": 11, "font-family": mono }, fmt(v, 0)));
    }
    g.appendChild(el("line", { x1: M.l, y1: H - M.b, x2: W - M.r, y2: H - M.b, stroke: css("--axis"), "stroke-width": 1.2 }));
    g.appendChild(el("line", { x1: M.l, y1: M.t, x2: M.l, y2: H - M.b, stroke: css("--axis"), "stroke-width": 1.2 }));
    g.appendChild(el("text", { x: (M.l + W - M.r) / 2, y: H - 8, "text-anchor": "middle", fill: css("--ink2"), "font-size": 12.5, "font-family": sans }, t("asg.chart.x")));
    g.appendChild(el("text", { x: 13, y: (M.t + H - M.b) / 2, "text-anchor": "middle", fill: css("--ink2"), "font-size": 12.5, "font-family": sans,
      transform: "rotate(-90 13 " + (M.t + H - M.b) / 2 + ")" }, t("asg.chart.y")));
    svg.appendChild(g);
    // infeasible band
    if (S.amin > x0) {
      svg.appendChild(el("rect", { x: M.l, y: M.t, width: sx(S.amin) - M.l, height: H - M.t - M.b, fill: css("--region") }));
      svg.appendChild(el("text", { x: (M.l + sx(S.amin)) / 2, y: M.t + 14, "text-anchor": "middle", fill: css("--muted"),
        "font-size": 10.5, "font-family": mono }, t("asg.chart.inf")));
    }
    // dots
    var dg = el("g", { fill: css("--c-aqua") }), rr = N >= 6 ? 2.4 : 3.2;
    S.list.forEach(function (q) {
      dg.appendChild(el("circle", { cx: sx(q.a), cy: sy(q.c), r: rr, "fill-opacity": side && q.a > T ? 0.3 : 0.95 }));
    });
    svg.appendChild(dg);
    // IP staircase: best dot to the left of each budget
    var sorted = S.list.slice().sort(function (p, q) { return p.a - q.a || p.c - q.c; });
    var best = Infinity, d = "";
    sorted.forEach(function (q) {
      if (q.c < best) {
        d += d ? " H" + sx(q.a) + " V" + sy(q.c) : "M" + sx(q.a) + " " + sy(q.c);
        best = q.c;
      }
    });
    d += " H" + sx(x1);
    svg.appendChild(el("path", { d: d, fill: "none", stroke: css("--pine"), "stroke-width": 2 }));
    // LP: lower convex hull
    d = S.curve.map(function (p, k) { return (k ? "L" : "M") + sx(p[0]) + " " + sy(p[1]); }).join(" ") + " H" + sx(x1);
    svg.appendChild(el("path", { d: d, fill: "none", stroke: css("--c-violet"), "stroke-width": 2.5, "stroke-linejoin": "round" }));
    // budget line, gap and markers
    var lpOk = S.lp.status === "optimal";
    if (side) {
      svg.appendChild(el("line", { x1: sx(T), y1: M.t, x2: sx(T), y2: H - M.b, stroke: css("--ink2"), "stroke-width": 1.5, "stroke-dasharray": "6 5" }));
      var nearR = sx(T) > W - 100;
      svg.appendChild(el("text", { x: sx(T) + (nearR ? -6 : 6), y: H - M.b - 8, "text-anchor": nearR ? "end" : "start", fill: css("--ink"),
        "font-size": 12, "font-weight": 600, "font-family": mono, stroke: css("--halo"), "stroke-width": 4, "paint-order": "stroke" }, "T = " + T));
      if (S.mix && S.mix.length === 2) {
        svg.appendChild(el("line", { x1: sx(S.mix[0].a), y1: sy(S.mix[0].c), x2: sx(S.mix[1].a), y2: sy(S.mix[1].c),
          stroke: css("--c-violet"), "stroke-width": 1.2, "stroke-dasharray": "2 3" }));
        S.mix.forEach(function (m) {
          svg.appendChild(el("circle", { cx: sx(m.a), cy: sy(m.c), r: 6, fill: "none", stroke: css("--c-violet"), "stroke-width": 2 }));
        });
      }
      if (lpOk && S.ip && S.ip.c - S.lp.z > 1e-6) {
        var gx = sx(T), ga = sy(S.lp.z), gb = sy(S.ip.c);
        svg.appendChild(el("line", { x1: gx, y1: ga, x2: gx, y2: gb, stroke: css("--crit"), "stroke-width": 3 }));
        svg.appendChild(el("text", { x: gx + (nearR ? -8 : 8), y: (ga + gb) / 2 + 4, "text-anchor": nearR ? "end" : "start", fill: css("--crit"),
          "font-size": 12, "font-weight": 600, "font-family": mono, stroke: css("--halo"), "stroke-width": 4, "paint-order": "stroke" },
          t("asg.chart.gap") + " " + fmt(S.ip.c - S.lp.z, 2)));
      }
    }
    if (S.ip) svg.appendChild(el("circle", { cx: sx(S.ip.a), cy: sy(S.ip.c), r: 7, fill: "none", stroke: css("--pine"), "stroke-width": 2.5 }));
    if (lpOk) {
      var la = 0;
      S.lp.x.forEach(function (row, i) { row.forEach(function (xv, j) { la += xv * A[i][j]; }); });
      var cx = sx(la), cy = sy(S.lp.z);
      svg.appendChild(el("path", { d: "M" + cx + " " + (cy - 6) + " L" + (cx + 6) + " " + cy + " L" + cx + " " + (cy + 6) + " L" + (cx - 6) + " " + cy + " Z",
        fill: css("--c-violet"), stroke: css("--surface"), "stroke-width": 1.5 }));
    }
  }

  // ---- TU check on the n = 3 constraint matrix ----
  function tuMat() {
    var M = [], i, j;
    for (i = 0; i < 7; i++) M.push(new Array(9).fill(0));
    for (i = 0; i < 3; i++) for (j = 0; j < 3; j++) { M[i][i * 3 + j] = 1; M[3 + j][i * 3 + j] = 1; M[6][i * 3 + j] = A[i][j]; }
    return M;
  }
  function tuLabels() {
    var P = people();
    return [P[0], P[1], P[2], "#1", "#2", "#3", t("asg.why.budget")];
  }
  function pickK(arr, k) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var r = Math.floor(Math.random() * (i + 1)), tmp = a[i]; a[i] = a[r]; a[r] = tmp; }
    return a.slice(0, k).sort(function (p, q) { return p - q; });
  }
  function drawPick(kMin, kMax) {
    var k = kMin + Math.floor(Math.random() * (kMax - kMin + 1));
    var rows = tuSide ? pickK([0, 1, 2, 3, 4, 5], k - 1).concat([6]) : pickK([0, 1, 2, 3, 4, 5], k);
    return { rows: rows, cols: pickK([0, 1, 2, 3, 4, 5, 6, 7, 8], k) };
  }
  function detOf(pk) {
    var M = tuMat();
    return det(pk.rows.map(function (r) { return pk.cols.map(function (c) { return M[r][c]; }); })) + 0;
  }
  function renderTU() {
    var M = tuMat(), L = tuLabels(), host = $("tu"), rows = tuSide ? 7 : 6, i, j;
    var tbl = mk("table", "tu"), hr = mk("tr");
    hr.appendChild(mk("th"));
    for (j = 0; j < 9; j++) {
      var th = mk("th", tuPick && tuPick.cols.indexOf(j) >= 0 ? "pick" : null, xname(Math.floor(j / 3), j % 3));
      hr.appendChild(th);
    }
    tbl.appendChild(hr);
    for (i = 0; i < rows; i++) {
      var tr = mk("tr"), inR = tuPick && tuPick.rows.indexOf(i) >= 0;
      tr.appendChild(mk("th", "rh" + (inR ? " pick" : ""), L[i]));
      for (j = 0; j < 9; j++) {
        var v = M[i][j], cls = i === 6 ? "side" : v ? "one" : "";
        if (inR && tuPick.cols.indexOf(j) >= 0) cls += " pick";
        tr.appendChild(mk("td", cls, String(v)));
      }
      tbl.appendChild(tr);
    }
    host.textContent = "";
    host.appendChild(tbl);
    var out = $("tures");
    out.textContent = "";
    if (!tuPick && !tuTest) { out.textContent = t("asg.why.start"); return; }
    if (tuPick) {
      var dv = detOf(tuPick), ok = dv === 0 || dv === 1 || dv === -1;
      var sp = mk("span", null, t("asg.why.res", {
        rows: tuPick.rows.map(function (r) { return L[r]; }).join(", "),
        cols: tuPick.cols.map(function (c) { return xname(Math.floor(c / 3), c % 3); }).join(", "),
        d: dv < 0 ? "−" + (-dv) : dv
      }) + " ");
      out.append(sp, mk("b", ok ? "ok" : "no", t(ok ? "asg.why.in" : "asg.why.out")));
      if (tuSide) out.append(" " + t("asg.why.one", { v: A[0][0] }));
    }
    if (tuTest) {
      if (tuPick) out.appendChild(mk("br"));
      out.append(t(tuTest.side ? "asg.why.testSide" : "asg.why.testPure", { k: I18N.fmt(tuTest.k, 0), bad: I18N.fmt(tuTest.bad, 0) }));
    }
  }

  // ---- results panel ----
  function renderResults() {
    var lpOk = S.lp.status === "optimal", u = t("asg.u.pay");
    $("zlp").textContent = lpOk ? fmt(S.lp.z, 2) + " " + t("asg.u.min") : t("asg.infShort");
    $("zip").textContent = S.ip ? S.ip.c + " " + t("asg.u.min") : t("asg.infShort");
    var gap = lpOk && S.ip ? S.ip.c - S.lp.z : null;
    if (gap != null && gap < 1e-7) gap = 0;
    $("zgap").textContent = gap == null ? "·" : t("asg.gapFmt", { v: fmt(gap, 2), p: fmt(100 * gap / S.ip.c, 1) });
    var chip = $("chip");
    chip.className = "chip " + (!lpOk ? "inf" : S.lp.integral ? "int" : "frac");
    chip.textContent = t(!lpOk ? "asg.chip.inf" : S.lp.integral ? "asg.chip.int" : "asg.chip.frac");
    var st;
    if (!lpOk) st = t("asg.st.inf", { T: T, u: u, amin: S.amin });
    else if (S.lp.integral) {
      var p = S.lp.x.map(function (row) { return row.indexOf(1); });
      st = t(!side ? "asg.st.pure" : T >= S.afree ? "asg.st.slack" : "asg.st.bindInt", { list: plist(p) });
    } else if (gap === 0) st = t("asg.st.tie", { list: plist(S.ip.p) });
    else st = t("asg.st.frac", { T: T, u: u, gap: fmt(gap, 2), list: plist(S.ip.p) });
    $("status").textContent = st;
    var ul = $("mix");
    ul.textContent = "";
    if (S.mix) {
      ul.appendChild(mk("li", "sum", t("asg.mix.head")));
      S.mix.forEach(function (m) {
        ul.appendChild(mk("li", null, t("asg.mix.item", { w: fmt(m.w, 3), list: plist(m.p), c: m.c, a: m.a, u: u })));
      });
      var zc = S.mix.map(function (m) { return fmt(m.w, 3) + " × " + m.c; }).join(" + ");
      var ac = S.mix.map(function (m) { return fmt(m.w, 3) + " × " + m.a; }).join(" + ");
      var at = S.mix.reduce(function (s, m) { return s + m.w * m.a; }, 0);
      ul.appendChild(mk("li", "sum", t("asg.mix.check", { zc: zc, z: fmt(S.lp.z, 2), ac: ac, a: fmt(at, 2), u: u })));
    }
  }

  function renderSide() {
    var r = $("T");
    $("sideon").checked = side;
    r.min = S.lo; r.max = S.hi; r.value = T; r.disabled = !side;
    $("To").textContent = T + " " + t("asg.u.pay");
    var z = $("zone"), key = !side ? "asg.zone.off" : T < S.amin ? "asg.zone.inf" : T < S.afree ? "asg.zone.bind" : "asg.zone.slack";
    z.className = "zone" + (key === "asg.zone.bind" ? " bind" : "");
    z.textContent = t(key, { amin: S.amin, afree: S.afree, u: t("asg.u.pay") });
    $("chartk").textContent = t("asg.chart.kicker", { k: I18N.fmt(S.list.length, 0), n: N });
    $("legdot").textContent = t("asg.leg.dot", { k: I18N.fmt(S.list.length, 0) });
  }

  function renderAll() {
    [3, 4, 5, 6].forEach(function (k) { $("n" + k).setAttribute("aria-pressed", k === N ? "true" : "false"); });
    buildMatrix("c");
    buildMatrix("a");
    drawGraph();
    renderResults();
    renderSide();
    drawChart();
    renderTU();
    persist();
  }
  function update() { derive(); renderAll(); }

  // ---- controls ----
  [3, 4, 5, 6].forEach(function (k) {
    $("n" + k).addEventListener("click", function () {
      if (N === k) return;
      N = k;
      ["c", "a"].forEach(function (key) { if (sel[key] && (sel[key][0] >= N || sel[key][1] >= N)) sel[key] = null; });
      T = defaultT();
      update();
    });
  });
  $("rand").addEventListener("click", function () { randomData(); T = defaultT(); update(); });
  $("preset").addEventListener("click", function () { C = copy(PRESET_C); A = copy(PRESET_A); T = defaultT(); update(); });
  $("sideon").addEventListener("change", function (e) { side = e.target.checked; update(); });
  $("T").addEventListener("input", function (e) { T = +e.target.value; update(); });
  $("tuside").addEventListener("change", function (e) { tuSide = e.target.checked; tuPick = null; tuTest = null; renderTU(); });
  $("draw").addEventListener("click", function () { tuPick = drawPick(2, 4); renderTU(); });
  $("test").addEventListener("click", function () {
    var bad = 0, k = 1000;
    for (var q = 0; q < k; q++) {
      var dv = detOf(drawPick(1, tuSide ? 5 : 6));
      if (dv !== 0 && dv !== 1 && dv !== -1) bad++;
    }
    tuTest = { k: k, bad: bad, side: tuSide };
    renderTU();
  });
  wireMatrix("c");
  wireMatrix("a");
  var rz = 0;
  window.addEventListener("resize", function () {
    cancelAnimationFrame(rz);
    rz = requestAnimationFrame(function () { if (S.list) drawChart(); });
  });

  // ---- hot state (survives republish while the page is open) ----
  function persist() {
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
      try { window.claude.hot.snapshot({ n: N, C: C, A: A, side: side, T: T, sel: sel, tuSide: tuSide }); } catch (e) { /* ok */ }
    }
  }
  function okM(M) {
    return Array.isArray(M) && M.length === 6 && M.every(function (r) {
      return Array.isArray(r) && r.length === 6 && r.every(function (v) { return typeof v === "number" && v >= 1 && v <= 99; });
    });
  }
  function start(data) {
    if (data && [3, 4, 5, 6].indexOf(data.n) >= 0 && okM(data.C) && okM(data.A)) {
      N = data.n; C = copy(data.C); A = copy(data.A); side = !!data.side;
      if (typeof data.T === "number") T = data.T;
      if (data.sel) sel = { c: data.sel.c || null, a: data.sel.a || null };
      tuSide = !!data.tuSide;
    }
    $("tuside").checked = tuSide;
    derive();
    I18N.onChange(renderAll);
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderAll);
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
</body>
</html>
