<script>
(function () {
  "use strict";
  var t = I18N.t;
  var SVGNS = "http://www.w3.org/2000/svg";

  // Illustrative data. d = demand per week (jars), S = setup cost ($ per batch),
  // h = holding cost ($ per jar per week), C = weekly capacity (null = no limit). No initial stock.
  var LEVELS = [
    { d: [40, 40, 40, 40, 40, 40], S: 100, h: 0.5, C: null },
    { d: [30, 40, 60, 90, 140, 100, 50, 30], S: 150, h: 1, C: null },
    { d: [30, 30, 60, 120, 180, 120, 60, 30], S: 200, h: 1, C: 160 }
  ];
  var SMIN = 20, SMAX = 600, SSTEP = 10;
  var EPS = 1e-9;

  // ---------- exact computations ----------
  function sum(a) { return a.reduce(function (s, v) { return s + v; }, 0); }

  // For a fixed setup pattern y the rest is an LP in x and s. Filling backward (each batch week
  // makes as much of the still-uncovered demand as it can) makes every jar as late as possible,
  // which gives the smallest possible stock in every week, hence the LP optimum.
  function planFor(L, y, S) {
    var T = L.d.length, x = new Array(T).fill(0), R = 0, t;
    if (S == null) S = L.S;
    for (t = T - 1; t >= 0; t--) {
      R += L.d[t];
      if (y[t]) { var q = L.C ? Math.min(L.C, R) : R; x[t] = q; R -= q; }
    }
    var k = sum(y);
    if (R > 0) {
      // first prefix of weeks whose demand exceeds what its batches can make
      var cumD = 0, cumK = 0;
      for (t = 0; t < T; t++) {
        cumD += L.d[t]; cumK += y[t];
        var can = L.C ? cumK * L.C : (cumK > 0 ? Infinity : 0);
        if (cumD > can) return { ok: false, k: k, week: t, need: cumD, can: can, batches: cumK };
      }
      return { ok: false, k: k, week: 0, need: L.d[0], can: 0, batches: 0 };
    }
    var s = [], inv = 0, H = 0;
    for (t = 0; t < T; t++) { inv += x[t] - L.d[t]; s.push(inv); H += inv; }
    return { ok: true, x: x, s: s, k: k, jw: H, setup: S * k, hold: L.h * H, total: S * k + L.h * H };
  }

  function patterns(T) {
    var out = [];
    for (var m = 0; m < (1 << T); m++) {
      var y = [];
      for (var t = 0; t < T; t++) y.push((m >> t) & 1);
      out.push(y);
    }
    return out;
  }

  // Enumerate every setup pattern (2^T) with the exact quantity rule.
  function solveExact(L, S) {
    var T = L.d.length, best = null, kset = {}, kmin = Infinity, few = null;
    var all = patterns(T).map(function (y) { return { y: y, p: planFor(L, y, S) }; })
      .filter(function (r) { return r.p.ok; });
    all.forEach(function (r) {
      if (!best || r.p.total < best.p.total - EPS || (Math.abs(r.p.total - best.p.total) <= EPS && r.p.k < best.p.k)) best = r;
      if (r.p.k < kmin) kmin = r.p.k;
    });
    all.forEach(function (r) {
      if (Math.abs(r.p.total - best.p.total) <= EPS) kset[r.p.k] = true;
      if (r.p.k === kmin && (!few || r.p.total < few.p.total - EPS)) few = r;
    });
    return { best: best, few: few, kset: Object.keys(kset).map(Number).sort(function (a, b) { return a - b; }) };
  }

  // LP relaxation (0 <= y_t <= 1) as a min-cost flow: producing one jar in week t costs S / M_t
  // (the fraction of a setup it forces), storing it costs h per week. Solved exactly with
  // successive shortest paths (Bellman-Ford), since the network is tiny.
  function lpRelax(L, M, cap) {
    var T = L.d.length, N = T + 2, src = 0, snk = T + 1, BIG = 1e12, E = [], G = [];
    for (var i = 0; i < N; i++) G.push([]);
    function add(u, v, c, w) {
      G[u].push(E.length); E.push({ to: v, cap: c, cost: w, flow: 0 });
      G[v].push(E.length); E.push({ to: u, cap: 0, cost: -w, flow: 0 });
    }
    var prodEdge = [];
    for (var t = 0; t < T; t++) {
      prodEdge.push(E.length); add(src, t + 1, cap[t], L.S / M[t]);
      if (t < T - 1) add(t + 1, t + 2, BIG, L.h);
      add(t + 1, snk, L.d[t], 0);
    }
    var need = sum(L.d), cost = 0, guard = 0;
    while (need > EPS && guard++ < 500) {
      var dist = new Array(N).fill(Infinity), pe = new Array(N).fill(-1);
      dist[src] = 0;
      for (var it = 0; it < N; it++) {
        var ch = false;
        for (var u = 0; u < N; u++) {
          if (dist[u] === Infinity) continue;
          G[u].forEach(function (ei) {
            var e = E[ei];
            if (e.cap - e.flow > EPS && dist[u] + e.cost < dist[e.to] - 1e-12) { dist[e.to] = dist[u] + e.cost; pe[e.to] = ei; ch = true; }
          });
        }
        if (!ch) break;
      }
      if (dist[snk] === Infinity) return null;
      var f = need, v = snk;
      while (v !== src) { var e1 = E[pe[v]]; f = Math.min(f, e1.cap - e1.flow); v = E[pe[v] ^ 1].to; }
      v = snk;
      while (v !== src) { E[pe[v]].flow += f; E[pe[v] ^ 1].flow -= f; v = E[pe[v] ^ 1].to; }
      cost += f * dist[snk]; need -= f;
    }
    var ysum = 0;
    for (t = 0; t < T; t++) ysum += E[prodEdge[t]].flow / M[t];
    return { value: cost, ysum: ysum };
  }

  function relaxRows(L) {
    var T = L.d.length, tot = sum(L.d), rem = [], t;
    for (t = 0; t < T; t++) rem.push(sum(L.d.slice(t)));
    var fill = function (v) { return new Array(T).fill(v); };
    var rows = [{ key: L.C ? "lot.rel.totalCap" : "lot.rel.total", M: fill(tot), cap: L.C ? fill(L.C) : fill(tot) }];
    if (L.C) {
      rows.push({ key: "lot.rel.cap", M: fill(L.C), cap: fill(L.C) });
      var mm = rem.map(function (r) { return Math.min(L.C, r); });
      rows.push({ key: "lot.rel.tightCap", M: mm, cap: mm });
    } else {
      rows.push({ key: "lot.rel.rem", M: rem, cap: rem });
    }
    rows.forEach(function (r) { r.res = lpRelax(L, r.M, r.cap); });
    return rows;
  }

  // caches
  var exactCache = {}, sweepCache = {}, relCache = {};
  function exact(i, S) {
    var k = i + ":" + S;

  }

      sweepCache[i] = arr;
    }
    return sweepCache[i];
  }
  function rel(i) { if (!relCache[i]) relCache[i] = relaxRows(LEVELS[i]); return relCache[i]; }

  // ---------- state ----------

  function niceMax(v) {

  function geom() {

  function renderTop(g, p, opt) {

      mk("text", { x: cx, y: Y(0) + 13, "text-anchor": "middle", "font-size": fs, fill: "var(--muted)" }, svg, I18N.fmt(dv, 0));
      // production (continuous, ink) with an accent cap when a setup happens

      } else if (ys[lv][i] && p && p.ok) {

    var Y = function (v) { return mt + ph - v / top * ph; };

    [0, top / 2, top].forEach(function (v) {

      mk("text", { x: g.ml - 5, y: Y(v) + 3.5, "text-anchor": "end", "font-size": fs, fill: "var(--muted)" }, svg, I18N.fmt(v, 0));

  }

  function renderResult() {

    var lvl = L(), ex = exact(lv, lvl.S), mine = planFor(lvl, ys[lv]);
    var lfl = planFor(lvl, lvl.d.map(function () { return 1; }));
    var opt = ex.best.p, few = ex.few.p;
    var gap = (mine.total - opt.total) / opt.total;
    var stars = starsFor(gap);
    if (starsBy[lv] == null || stars > starsBy[lv]) { starsBy[lv] = stars; saveStars(); renderLevels(); }
    $("verdict").textContent = t("lot.verdict." + stars);
    $("stars").setAttribute("aria-label", t("lot.starsAria", { n: stars }));
    $("stars").innerHTML = "★".repeat(stars) + '<span class="off">' + "★".repeat(3 - stars) + "</span>";
    $("rsub").innerHTML = gap <= 0.0005
      ? t("lot.rsub.opt", { mine: money(mine.total) })
      : t("lot.rsub", { mine: money(mine.total), opt: money(opt.total), pct: I18N.fmt(gap * 100, 1) });

    var bars = $("bars"); bars.textContent = "";
    var mx = Math.max(mine.total, lfl.total, few.total, opt.total);
    barRow(bars, t("lot.bar.mine"), mine, mx, true);
    barRow(bars, t("lot.bar.lfl"), lfl, mx);
    barRow(bars, t(lvl.C ? "lot.bar.fewCap" : "lot.bar.few"), few, mx);
    barRow(bars, t("lot.bar.opt"), opt, mx);

    var cmp = $("cmp"); cmp.textContent = ""; cmp.hidden = !showOpt;
    if (showOpt) {
      var T = lvl.d.length, diffs = [];
      cmpRow(cmp, t("lot.cmp.mine"), ys[lv], ex.best.y, T);
      cmpRow(cmp, t("lot.cmp.opt"), ex.best.y, ys[lv], T);
      ys[lv].forEach(function (v, i) { if (v !== ex.best.y[i]) diffs.push(i + 1); });
      var note = el("p", "cmp-note");
      note.innerHTML = diffs.length ? t("lot.cmp.diff", { list: diffs.join(", ") }) : t("lot.cmp.same");
      cmp.appendChild(note);
    }
    $("showopt").setAttribute("aria-pressed", showOpt ? "true" : "false");
    $("showopt").textContent = t(showOpt ? "lot.btn.hideOpt" : "lot.btn.showOpt");

    var lflGap = (lfl.total - mine.total) / lfl.total;
    var extra = t("lot.extra.lv" + (lv + 1), { opt: money(opt.total), weeks: weeksList(ex.best.y), k: opt.k });
    extra += " " + (lflGap > 0 ? t("lot.extra.vsLfl", { pct: I18N.fmt(lflGap * 100, 1) }) : t("lot.extra.noLfl"));
    $("rextra").innerHTML = extra;
    $("next").hidden = lv >= LEVELS.length - 1;
    renderTrade();
  }

  function renderTrade() {
    var lvl = L(), sw = sweep(lv);
    if (tradeS == null) tradeS = lvl.S;
    var slider = $("sS");
    slider.value = tradeS;
    slider.setAttribute("aria-valuetext", money(tradeS));
    $("sSout").textContent = money(tradeS);
    var cur = sw.filter(function (r) { return r.S === tradeS; })[0];
    // step chart: optimal number of batches against S
    var svg = $("chartTrade"); svg.textContent = "";
    var w = Math.max(280, Math.round(svg.parentNode.clientWidth || 600)), narrow = w < 560;
    w = Math.min(w, 640);
    var H = narrow ? 180 : 200, ml = 34, mr = 10, mt = 14, mb = 30, ph = H - mt - mb, pw = w - ml - mr;
    svg.setAttribute("viewBox", "0 0 " + w + " " + H);
    svg.style.maxWidth = "640px";
    svg.setAttribute("aria-label", t("lot.trade.aria"));
    var T = lvl.d.length, fs = narrow ? 9.5 : 10.5;
    var X = function (S) { return ml + (S - SMIN) / (SMAX - SMIN) * pw; };
    var Y = function (k) { return mt + ph - (k - 0.5) / (T) * ph; };
    for (var k = 1; k <= T; k++) {
      mk("line", { x1: ml, x2: w - mr, y1: Y(k), y2: Y(k), stroke: "var(--grid)", "stroke-width": 1 }, svg);
      mk("text", { x: ml - 6, y: Y(k) + 3.5, "text-anchor": "end", "font-size": fs, fill: "var(--muted)" }, svg, String(k));
    }
    [SMIN, 100, 200, 300, 400, 500, SMAX].forEach(function (S) {
      if (S !== SMIN && S % 100 !== 0) return;
      mk("text", { x: X(S), y: H - mb + 14, "text-anchor": "middle", "font-size": fs, fill: "var(--muted)" }, svg, I18N.fmt(S, 0));
    });
    mk("text", { x: ml + pw / 2, y: H - 3, "text-anchor": "middle", "font-size": fs, fill: "var(--muted)" }, svg, t("lot.trade.xaxis"));
    mk("text", { x: 0, y: 9, "font-size": fs, fill: "var(--muted)" }, svg, t("lot.trade.yaxis"));
    var dstr = "";
    sw.forEach(function (r, i) {
      var x0 = i === 0 ? X(r.S) : X(r.S - SSTEP / 2), x1 = i === sw.length - 1 ? X(r.S) : X(r.S + SSTEP / 2);
      dstr += (i === 0 ? "M" : "L") + x0 + "," + Y(r.k) + " L" + x1 + "," + Y(r.k) + " ";
    });
    mk("path", { d: dstr, fill: "none", stroke: "var(--accent)", "stroke-width": 2.5 }, svg);
    // level's own S and the slider position
    mk("line", { x1: X(lvl.S), x2: X(lvl.S), y1: mt, y2: mt + ph, stroke: "var(--axis)", "stroke-width": 1, "stroke-dasharray": "3 3" }, svg);
    mk("line", { x1: X(tradeS), x2: X(tradeS), y1: mt, y2: mt + ph, stroke: "var(--ink)", "stroke-width": 1.5 }, svg);
    mk("circle", { cx: X(tradeS), cy: Y(cur.k), r: 5, fill: "var(--accent)", stroke: "var(--surface)", "stroke-width": 2 }, svg);

    var row = $("tradeRow"); row.textContent = ""; row.style.setProperty("--n", T);
    row.appendChild(el("span", "rl", t("lot.cmp.opt")));
    cur.y.forEach(function (v, i) { row.appendChild(el("span", "cell" + (v ? " on" : ""), t("lot.weekShort", { n: i + 1 }))); });
    var p = planFor(lvl, cur.y, tradeS);
    var txt = t("lot.trade.read", { s: money(tradeS), kb: nb(cur.k), weeks: weeksList(cur.y), c: money(cur.cost), set: money(p.setup), hold: money(p.hold) });
    if (cur.kset.length > 1) txt += " " + t("lot.trade.tie", { list: cur.kset.join(", ") });
    $("tradeTxt").innerHTML = txt;
  }

  function renderRelax() {
    var lvl = L(), rows = rel(lv), ex = exact(lv, lvl.S), body = $("relBody");
    body.textContent = "";
    var opt = ex.best.p.total;
    rows.forEach(function (r) {
      var tr = el("tr");
      tr.append(el("td", null, t(r.key)), el("td", "num", money(Math.round(r.res.value * 100) / 100)),
        el("td", "num", I18N.fmt(r.res.ysum, 2)), el("td", "num", I18N.fmt((opt - r.res.value) / opt * 100, 1) + " %"));
      body.appendChild(tr);
    });
    var tr = el("tr", "ip");
    tr.append(el("td", null, t("lot.rel.ip")), el("td", "num", money(opt)), el("td", "num", I18N.fmt(ex.best.p.k, 0)), el("td", "num", "0 %"));
    body.appendChild(tr);
    var tight = rows[rows.length - 1].res.value;
    $("relTxt").innerHTML = t("lot.rel.txt", { lv: lv + 1, D: I18N.fmt(sum(lvl.d), 0), s: money(lvl.S), k: ex.best.p.k,
      tight: money(Math.round(tight * 100) / 100), opt: money(opt), pct: I18N.fmt(tight / opt * 100, 0) });
  }

  function renderChallenges() {
    var ol = $("chal"); ol.textContent = "";
    var l2 = LEVELS[1], lfl2 = planFor(l2, l2.d.map(function () { return 1; })).total;
    [["lot.ch1", { lfl: money(lfl2), target: money(lfl2 * 0.8) }], ["lot.ch2", {}], ["lot.ch3", {}], ["lot.ch4", {}]].forEach(function (c) {
      var li = el("li"); li.innerHTML = t(c[0], c[1]); ol.appendChild(li);
    });
  }

  function renderAll() { renderLevels(); renderBoard(); renderResult(); renderRelax(); renderChallenges(); }

  // ---------- actions ----------
  function toggle(i) {
    if (phase !== "pick" || i === 0) return;
    var lvl = L(), before = planFor(lvl, ys[lv]);
    ys[lv][i] = ys[lv][i] ? 0 : 1;
    var after = planFor(lvl, ys[lv]);
    lastMsg = before.ok && after.ok ? { on: !!ys[lv][i], week: i + 1, before: before.total, after: after.total, dh: after.hold - before.hold } : null;
    renderBoard();
    var btn = $("weeks").children[i]; if (btn) btn.focus();
  }
  function go(i) {
    lv = i; phase = "pick"; showOpt = false; lastMsg = null; tradeS = null;
    renderAll();
  }
  $("check").addEventListener("click", function () {
    if (!planFor(L(), ys[lv]).ok) return;
    phase = "done"; showOpt = false; tradeS = null;
    renderAll();
    $("result").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" });
  });
  $("reset").addEventListener("click", function () {
    ys[lv] = L().d.map(function () { return 1; }); lastMsg = null; renderBoard();
  });
  $("retry").addEventListener("click", function () { phase = "pick"; showOpt = false; lastMsg = null; renderAll(); });
  $("next").addEventListener("click", function () { if (lv < LEVELS.length - 1) go(lv + 1); });
  $("showopt").addEventListener("click", function () { showOpt = !showOpt; renderBoard(); renderResult(); });
  $("sS").addEventListener("input", function () { tradeS = +$("sS").value; renderTrade(); });

  var raf = 0;
  window.addEventListener("resize", function () {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(function () { renderBoard(); if (phase === "done") renderTrade(); });
  });

  // test hook: exposes the exact numbers the page shows
  window.__lot = { LEVELS: LEVELS, planFor: planFor, exact: exact, rel: rel, sweep: sweep };

  I18N.onChange(renderAll);
})();
</script>
</body>
</html>
