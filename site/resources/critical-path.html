<script>
(function () {
  "use strict";
  var T = I18N.t;
  var MINUS = "−";
  var fmt = function (v, d, m) { if (Math.abs(v) < 5e-10) v = 0; return I18N.fmt(v, d == null ? 1 : d, m); };
  var days = function (v, d) { return T("cpm.d", { v: fmt(v, d) }); };
  var pct = function (p, d) { return T("cpm.pct", { v: fmt(100 * p, d == null ? 1 : d) }); };
  // the sign is chosen after rounding, so a tiny value never shows as "−0" or "+0"
  var sgnDays = function (v, d) { var m = fmt(Math.abs(v), d); return T("cpm.d", { v: m === fmt(0, d) ? m : (v < 0 ? MINUS : "+") + m }); };

  /* ---------- the project: activities, precedences and triangular durations (illustrative) ---------- */
  var ACTS = [
    { id: "A", tri: [7, 9, 14], pred: [] },
    { id: "B", tri: [4, 5, 9], pred: ["A"] },
    { id: "C", tri: [7, 11, 21], pred: ["A"] },
    { id: "D", tri: [6, 7, 11], pred: ["B"] },
    { id: "E", tri: [11, 13, 21], pred: ["C", "D"] },
    { id: "F", tri: [5, 6, 13], pred: ["E"] },
    { id: "G", tri: [6, 8, 13], pred: ["E"] },
    { id: "H", tri: [6, 7, 11], pred: ["F", "G"] },
    { id: "I", tri: [18, 26, 46], pred: ["C"] }
  ];
  var DL = 60, RUNS = 2000, SEED = 2000;
  // grid position (column, row) of each box in the drawing; END is the finish node
  var POS = { A: [0, 0], B: [1, -1], C: [1, 1], D: [2, -1], E: [3, 0], F: [4, -1], G: [4, 1], I: [3, 2], H: [5, 0], END: [6, 0] };
  var NA = ACTS.length, END = NA, IDX = {};
  ACTS.forEach(function (a, i) {
    IDX[a.id] = i;
    a.mean = (a.tri[0] + a.tri[1] + a.tri[2]) / 3;           // mean of a triangular distribution
    a.succ = [];
  });
  ACTS.forEach(function (a, j) {                             // ACTS is in topological order
    a.pi = a.pred.map(function (p) { return IDX[p]; });
    a.pi.forEach(function (i) { ACTS[i].succ.push(j); });
  });
  var ARCS = [];                                             // {i, j}: i before j (j = END for the finish)
  ACTS.forEach(function (a, j) { a.pi.forEach(function (i) { ARCS.push({ i: i, j: j }); }); });
  ACTS.forEach(function (a, i) { if (!a.succ.length) ARCS.push({ i: i, j: END }); });

  function passes(d) {                                       // forward and backward pass for durations d[i]
    var ES = [], EF = [], LS = [], LF = [], i;

    if (t < CH[4]) return [T("cpm.cap4"), T("cpm.cap4.sub", { T: fmt(CPM.T, 1) })];
    if (t < CH[5]) return mc ? [T("cpm.cap5.mc", { n: fmt(RUNS, 0) }), T("cpm.cap5.mc.sub", { p: pct(MC.p), dl: fmt(DL, 0) })]
      : [T("cpm.cap5.fixed", { T: fmt(CPM.T, 1) }), T("cpm.cap5.fixed.sub", { dl: fmt(DL, 0), m: fmt(DL - CPM.T, 1) })];
    return mc ? [T("cpm.cap6.mc"), T("cpm.cap6.mc.sub", { mean: fmt(MC.mean, 1), bias: fmt(MC.mean - CPM.T, 1) })]
      : [T("cpm.cap6.fixed"), T("cpm.cap6.fixed.sub")];
  }
  function drawCaption(sc, t) {
    var ci = 0; CH.forEach(function (c, k) { if (t >= c) ci = k; });
    var a = ci === 0 ? seg(t, 0.4, 1.1) : seg(t, CH[ci] + 0.15, CH[ci] + 0.8);
    if (ci < CH.length - 1) a *= 1 - seg(t, CH[ci + 1] - 0.45, CH[ci + 1] - 0.05);
    if (t >= DUR - 1e-6) a = 1;
    if (a <= 0) return;
    var lines = captions(sc, t), x = L.capX, y = L.capY, maxW = L.capW - 12;
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = C.accent; ctx.fillRect(x, y - L.ft + 2, 3, L.ft + 1);
    ctx.font = font(700, L.ft); ctx.fillStyle = C.ink; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    var tl = wrap(lines[0], maxW);
    tl.forEach(function (s, k) { ctx.fillText(s, x + 10, y + k * (L.ft + 3), maxW); });
    y += (tl.length - 1) * (L.ft + 3) + L.fs + 6;
    ctx.font = font(400, L.fs + (L.portrait ? 0 : 1)); ctx.fillStyle = C.ink2;
    wrap(lines[1], maxW).forEach(function (s) { ctx.fillText(s, x + 10, y, maxW); y += L.fs + 5; });
    ctx.restore();
  }

  /* ---------- HUD chips ---------- */
  var chips = [0, 1, 2, 3].map(function (i) {
    var el = document.getElementById("cpm-c" + i);
    return { el: el, b: el.querySelector("b"), s: el.querySelector("span"), v: null, l: null, o: null, k: null };
  });
  function setChip(i, val, lab, op, kind) {
    var c = chips[i];
    op = Math.round(clamp(op, 0, 1) * 20) / 20;
    if (c.v !== val) { c.b.textContent = val; c.v = val; }
    if (c.l !== lab) { c.s.textContent = lab; c.s.title = lab; c.l = lab; }
    if (c.o !== op) { c.el.style.opacity = op; c.o = op; }
    if (c.k !== kind) { c.el.classList.toggle("accent", kind === "acc"); c.el.classList.toggle("bad", kind === "bad"); c.k = kind; }
  }
  function hud(sc, t) {
    var n = sc === "mc" ? runsAt(t) : 0;
    // duration: the largest EF known so far, then the running mean of the runs
    var known = 0, any = false;
    for (var i = 0; i < NA; i++) if (t >= tf(i) + 0.45) { known = Math.max(known, CPM.EF[i]); any = true; }
    if (n > 0) setChip(0, days(MC.cumT[n] / n, 1), T("cpm.k.mean"), 1, "acc");
    else setChip(0, days(known, 1), T("cpm.k.cpm"), any ? 1 : 0, t >= tf(END) + 0.4 ? "acc" : "");
    setChip(1, days(DL, 0), T("cpm.k.dl"), seg(t, 0.8, 1.3), "");
    if (n > 0) setChip(2, pct(MC.cumOn[n] / n), T("cpm.k.p"), 1, "bad");
    else setChip(2, sgnDays(DL - CPM.T, 1), T("cpm.k.margin"), seg(t, tf(END) + 0.4, tf(END) + 0.9), "");
    if (n > 0) setChip(3, fmt(n, 0), T("cpm.k.runs"), 1, "");
    else setChip(3, T("cpm.of", { k: fmt(NCRIT, 0), n: fmt(NA, 0) }), T("cpm.k.crit"), seg(t, T_CR, T_CR + 0.5), "");
  }

  /* ---------- the frame ---------- */
  function render(t) {
    C = A.colors();
    // new or urgent cues use bright red; where the theme makes the accent that same red (dark), the crit shade
    HOT = C.accent.toLowerCase() === C["mit-bright"].toLowerCase() ? C.crit : C["mit-bright"];
    var sc = state.sc;
    hud(sc, t);
    if (hudKey !== cv.w + "x" + cv.h + ":" + hudEl.offsetHeight + ":" + hudEl.offsetWidth) layout();
    var g = geomAt(t), Hh = heat(sc, t);
    ctx.clearRect(0, 0, L.W, L.H);
    ctx.fillStyle = C.surface; ctx.fillRect(0, 0, L.W, L.H);
    ctx.lineCap = "butt"; ctx.lineJoin = "round"; ctx.setLineDash([]);
    // the run that just landed flashes its own critical path (first runs only)
    var n = sc === "mc" ? runsAt(t) : 0, runA = 0, runMask = 0;
    if (n > 0 && n <= SLOW + 30) {
      runMask = MC.masks[n - 1];
      runA = (1 - seg(n, SLOW, SLOW + 30)) * (1 - seg(t, runTime(n - 1) + 0.25, runTime(n - 1) + 0.55) * (n >= SLOW ? 1 : 0.45));
    }
    drawArcs(sc, t, g, Hh);
    if (runA > 0.01) ARCS.forEach(function (r, k) {
      var endOk = r.j === END || runMask & (1 << r.j);
      if (runMask & (1 << r.i) && endOk) strokePath(g.arcs[k], 1, HOT, 2.4, runA * 0.8);
    });
    passParticles(t, g);
    critPulse(t, g);
    drawNames(t, g);
    drawDist(sc, t, g);
    for (var i = 0; i < NA; i++) drawNode(sc, t, g, Hh, i, runMask, runA);
    drawEnd(sc, t, g, Hh);
    drawBadges(sc, t, g);
    meetLabels(t, g);
    if (sc === "mc") drawHist(t); else drawGantt(t, Hh);
    drawCaption(sc, t);
  }

  layout();
  var player = A.create({
    root: root,
    duration: DUR,
    chapters: CH.map(function (c, k) { return { t: c, key: "cpm.ch" + (k + 1) }; }),
    onResize: function () { cv.fit(); layout(); },
    render: render
  });

  /* =====================================================================================
     Page text: status line, data, LP check, solution, notes
     ===================================================================================== */
  function renderScenText() {
    var mc = state.sc === "mc", ka = mc ? "cpm.anim.aria.mc" : "cpm.anim.aria";
    stage.setAttribute("data-i18n-attr", "aria-label:" + ka);
    stage.setAttribute("aria-label", T(ka) + " " + T("cpm.anim.aria.nums", {
      path: pathText(CPM), T: fmt(CPM.T, 1), dl: fmt(DL, 0), mean: fmt(MC.mean, 1), p: pct(MC.p)
    }));
    document.querySelectorAll("#cpm-sec [data-only]").forEach(function (el) { el.hidden = el.getAttribute("data-only") !== state.sc; });
    document.getElementById("cpm-lg-dl").textContent = T("cpm.lg.dl", { dl: fmt(DL, 0) });
    document.getElementById("cpm-status").innerHTML = T("cpm.st." + state.sc, {
      path: pathText(CPM), T: fmt(CPM.T, 1), m: fmt(DL - CPM.T, 1), dl: fmt(DL, 0), n: fmt(RUNS, 0), mean: fmt(MC.mean, 1), p: pct(MC.p)
    });
  }
  function renderData() {
    document.getElementById("cpm-data-intro").textContent = T("cpm.data.intro", { dl: fmt(DL, 0) });
    var h = "<thead><tr><th>" + T("cpm.data.act") + "</th><th>" + T("cpm.data.pred") + "</th><th class='num'>" + T("cpm.data.a") +
      "</th><th class='num'>" + T("cpm.data.m") + "</th><th class='num'>" + T("cpm.data.b") + "</th><th class='num'>" + T("cpm.data.e") + "</th></tr></thead><tbody>";
    ACTS.forEach(function (a) {
      h += "<tr><td class='id'>" + a.id + " <small>" + T("cpm.a." + a.id) + "</small></td><td class='pr'>" + (a.pred.length ? a.pred.join(", ") : T("cpm.data.none")) +
        "</td><td class='num'>" + fmt(a.tri[0], 1) + "</td><td class='num'>" + fmt(a.tri[1], 1) + "</td><td class='num'>" + fmt(a.tri[2], 1) +
        "</td><td class='num'>" + fmt(a.mean, 2) + "</td></tr>";
    });
    document.getElementById("cpm-data").innerHTML = h + "</tbody>";
    var arcs = [];
    ARCS.forEach(function (r, k) {
      if (Math.abs(LPR.duals[k]) > 1e-6) arcs.push(ACTS[r.i].id + " → " + (r.j === END ? T("cpm.l.end").toLowerCase() : ACTS[r.j].id));
    });
    document.getElementById("cpm-lp").textContent = T("cpm.lp.res", { z: fmt(LPR.z, 2), arcs: arcs.join(", ") });
  }
  function renderSolution() {
    document.getElementById("cpm-s-cpm").textContent = days(CPM.T, 1);
    document.getElementById("cpm-s-cpm-l").textContent = T("cpm.sol.cpm.l", { path: pathText(CPM) });
    document.getElementById("cpm-s-mean").textContent = days(MC.mean, 1);
    document.getElementById("cpm-s-mean-l").textContent = T("cpm.sol.mean.l", { se: fmt(MC.seMean, 2) });
    document.getElementById("cpm-s-bias").textContent = sgnDays(MC.mean - CPM.T, 1);
    document.getElementById("cpm-s-p-k").textContent = T("cpm.sol.p", { dl: fmt(DL, 0) });
    document.getElementById("cpm-s-p").textContent = pct(MC.p);
    document.getElementById("cpm-s-p-l").textContent = T("cpm.sol.p.l", { se: pct(MC.seP) });
    document.getElementById("cpm-s-p0-k").textContent = T("cpm.sol.p0", { T: fmt(CPM.T, 1) });
    document.getElementById("cpm-s-p0").textContent = pct(MC.p0);
    document.getElementById("cpm-s-q").textContent = days(MC.q90, 1);
    document.getElementById("cpm-check").textContent = T("cpm.sol.check", { n: fmt(RUNS, 0), seed: SEED });
    var h = "<thead><tr><th>" + T("cpm.tab.act") + "</th><th class='num'>" + T("cpm.tab.d") + "</th><th class='num'>" + T("cpm.tab.es") +
      "</th><th class='num'>" + T("cpm.tab.ef") + "</th><th class='num'>" + T("cpm.tab.ls") + "</th><th class='num'>" + T("cpm.tab.lf") +
      "</th><th class='num'>" + T("cpm.tab.s") + "</th><th class='num'>" + T("cpm.tab.ci") + "</th></tr></thead><tbody>";
    ACTS.forEach(function (a, i) {
      var c = CPM.crit[i];
      h += "<tr" + (c ? " class='on'" : "") + "><td class='id'>" + a.id + "<span class='wide'> <small>" + T("cpm.s." + a.id) + "</small></span></td><td class='num'>" + fmt(CPM.d[i], 1) +
        "</td><td class='num'>" + fmt(CPM.ES[i], 1) + "</td><td class='num'>" + fmt(CPM.EF[i], 1) + "</td><td class='num'>" + fmt(CPM.LS[i], 1) +
        "</td><td class='num'>" + fmt(CPM.LF[i], 1) + "</td><td class='num" + (c ? " zero" : "") + "'>" + fmt(CPM.S[i], 1) +
        "</td><td class='num'>" + pct(MC.ci[i]) + "</td></tr>";
    });
    document.getElementById("cpm-sched").innerHTML = h + "</tbody>";
  }
  function renderNotes() {
    var iE = IDX.E, iC = IDX.C, iD = IDX.D;
    document.getElementById("cpm-n1").textContent = T("cpm.n.p1", {
      eD: fmt(CPM.EF[iD], 1), eC: fmt(CPM.EF[iC], 1), esE: fmt(CPM.ES[iE], 1), path: pathText(CPM)
    });
    var sl = [];
    ACTS.forEach(function (a, i) { if (!CPM.crit[i]) sl.push(a.id + " " + days(CPM.S[i], 1)); });
    document.getElementById("cpm-n2").textContent = T("cpm.n.p2", { slacks: sl.join(", ") });
    document.getElementById("cpm-n3").textContent = T("cpm.n.p3", {
      T: fmt(CPM.T, 1), n: fmt(RUNS, 0), mean: fmt(MC.mean, 1), bias: sgnDays(MC.mean - CPM.T, 1), Tm: fmt(MODE.T, 1)
    });
    var off = [], on = [];                                   // criticality index off and on the critical path
    ACTS.forEach(function (a, i) { (CPM.crit[i] ? on : off).push(a.id + " " + pct(MC.ci[i], 0)); });
    document.getElementById("cpm-n4").textContent = T("cpm.n.p4", {
      m: fmt(DL - CPM.T, 1), p: pct(MC.p), dl: fmt(DL, 0), p0: pct(MC.p0), T: fmt(CPM.T, 1), off: off.join(", "), on: on.join(", "), q: fmt(Math.ceil(MC.q90), 0)
    });
    document.getElementById("cpm-footer").textContent = T("cpm.footer", { n: fmt(RUNS, 0) });
  }

  var segBtns = document.querySelectorAll("#cpm-seg button");
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      if (state.sc === b.getAttribute("data-sc")) return;
      state.sc = b.getAttribute("data-sc");
      segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      renderScenText();
      hudKey = "";
      if (A.reducedMotion) { player.seek(DUR); return; }
      // the two scenarios differ from chapter 5 on (and in the small distributions of chapter 1)
      if (player.time < CH[4]) player.refresh();
      else { player.seek(CH[4] + 0.001); player.play(); }
    });
  });

  function renderPage() {
    renderScenText(); renderData(); renderSolution(); renderNotes();
    hudKey = "";
    player.refresh();
  }
  I18N.onChange(renderPage);
})();
</script>
</body>
</html>
