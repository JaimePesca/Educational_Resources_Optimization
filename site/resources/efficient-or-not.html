<script>
(function () {
  "use strict";
  var T = I18N.t;
  var f2 = function (v) { if (Math.abs(v) < 5e-10) v = 0; return I18N.fmt(v, 2, 2); };   // scores and weights
  var f1 = function (v) { return I18N.fmt(v, 1, 1); };                                    // targets
  var f0 = function (v) { return I18N.fmt(v, 0); };
  var fr = function (v) { return I18N.fmt(v, 2); };                                       // ratios

  /* ---------- data: eight illustrative public schools ---------- */
  var SCH = [
    { id: "A", x: 14, b: 60, y: 30 },
    { id: "B", x: 22, b: 144, y: 60 },
    { id: "C", x: 30, b: 250, y: 96 },
    { id: "D", x: 34, b: 154, y: 70 },
    { id: "E", x: 46, b: 230, y: 112 },
    { id: "F", x: 50, b: 195, y: 130 },
    { id: "G", x: 56, b: 186, y: 124 },
    { id: "H", x: 62, b: 156, y: 142 }
  ];
  var N = SCH.length, SEL = 4;                    // school E is the one the animation follows
  SCH.forEach(function (s) { s.u = 100 * s.x / s.y; s.v = 100 * s.b / s.y; });

  /* ---------- DEA: input-oriented envelopment model, one LP per school ---------- */
  // variables [theta, lambda_1..lambda_N]; inputs(s) lists the inputs of school s
  function dea(o, inputs, vrs) {
    var rows = [], m = inputs(SCH[o]).length, i;
    for (i = 0; i < m; i++) {
      rows.push({ a: [-inputs(SCH[o])[i]].concat(SCH.map(function (s) { return inputs(s)[i]; })), op: "<=", b: 0 });
    }
    rows.push({ a: [0].concat(SCH.map(function (s) { return s.y; })), op: ">=", b: SCH[o].y });
    if (vrs) rows.push({ a: [0].concat(SCH.map(function () { return 1; })), op: "=", b: 1 });
    var r = LP.solve({ sense: "min", c: [1].concat(SCH.map(function () { return 0; })), rows: rows });
    var lam = r.x.slice(1), th = r.x[0], peers = [];
    lam.forEach(function (l, j) { if (l > 1e-7) peers.push(j); });
    return { th: th, lam: lam, peers: peers, eff: th > 1 - 1e-7 };
  }
  var IN1 = function (s) { return [s.x]; }, IN2 = function (s) { return [s.x, s.b]; };
  var cache = {};
  function model(sc) {
    if (cache[sc]) return cache[sc];
    var vrs = sc === "bcc", one = [], two = [], j;
    for (j = 0; j < N; j++) { one.push(dea(j, IN1, vrs)); two.push(dea(j, IN2, vrs)); }
    var cnt = function (a) { return a.filter(function (r) { return r.eff; }).length; };
    var M = { sc: sc, vrs: vrs, one: one, two: two, k1: cnt(one), k2: cnt(two) };
    // one input frontier: the best ratio (CCR) or the efficient schools sorted by teachers (BCC)
    M.eff1 = []; M.eff2 = [];
    for (j = 0; j < N; j++) { if (one[j].eff) M.eff1.push(j); if (two[j].eff) M.eff2.push(j); }
    M.eff1.sort(function (a, b) { return SCH[a].x - SCH[b].x; });
    return (cache[sc] = M);
  }
  // constant returns isoquant per 100 graduates (Farrell): the CCR efficient schools with two inputs, by teachers per graduate
  var ISO = (function () {
    var M = model("ccr"), e = M.eff2.slice();
    e.sort(function (a, b) { return SCH[a].u - SCH[b].u; });
    return e;
  })();
  var BEST = (function () {                       // closed form check: the best ratio of graduates per teacher
    var bi = 0;
    SCH.forEach(function (s, j) { if (s.y / s.x > SCH[bi].y / SCH[bi].x) bi = j; });
    return { j: bi, r: SCH[bi].y / SCH[bi].x };
  })();
  function names(list) {                          // "A, C and F"
    var ids = list.map(function (j) { return SCH[j].id; });
    if (ids.length < 2) return ids.join("");
    return T("dea.and", { a: ids.slice(0, -1).join(", "), b: ids[ids.length - 1] });
  }
  var state = { sc: "ccr" };

  /* =====================================================================================
     "See it in motion". Every number is computed with LP.solve from the data above; the
     positions of labels, the particles and the timing are illustrative.
     ===================================================================================== */
  var A = window.Anim, E = A.ease, seg = A.seg, lerp = A.lerp, clamp = A.clamp;
  var root = document.getElementById("dea-anim");
  var stage = root.querySelector(".anim-stage");
  var hudEl = document.getElementById("dea-hud");
  var cv = A.canvas(stage), ctx = cv.ctx;
  stage.appendChild(hudEl);
  var DUR = 56, CH = [0, 8, 19, 30, 39, 50];
  var SANS = "Helvetica Neue, Helvetica, Arimo, Arial, sans-serif";
  var MONO = "JetBrains Mono, ui-monospace, Menlo, monospace";
  var TAU = Math.PI * 2;
  var C = null, HOT = "", L = {}, hudKey = "";
  var font = function (w, s, mono) { return w + " " + s + "px " + (mono ? MONO : SANS); };
  function rgbOf(c) {
    if (c && c[0] === "#") {
      var h = c.slice(1);
      if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      var n = parseInt(h, 16);
      return [n >> 16 & 255, n >> 8 & 255, n & 255];
    }
    var m = (c || "").match(/[\d.]+/g);
    return m ? [+m[0], +m[1], +m[2]] : [255, 255, 255];
  }
  function rgba(c, a) { var r = rgbOf(c); return "rgba(" + r[0] + "," + r[1] + "," + r[2] + "," + a + ")"; }
  // staggered entrance of the schools (deterministic jitter)
  var APPEAR = (function () {
    var r = A.rng(11), out = [];
    for (var j = 0; j < N; j++) out.push(1.3 + 0.36 * j + (r() - 0.5) * 0.16);
    return out;
  })();

  // world windows of the two charts
  var V1 = { x0: 0, x1: 70, y0: 0, y1: 160 };

    });
    document.getElementById("dea-tbl").innerHTML = h + "</tbody>";
    document.getElementById("dea-tbl-note").textContent = M.vrs ? T("dea.tb.noteBcc") : T("dea.tb.note", { r: fr(BEST.r), s: SCH[BEST.j].id });
    // the LP of school E with two inputs, with the numbers of the data
    var lamT = function (k) { return SCH.map(function (s) { return s[k] + "\\lambda_{" + s.id + "}"; }).join(" + "); };
    var lamP = function (k) { return SCH.map(function (s) { return s[k] + "·λ" + s.id; }).join(" + "); };
    var tex = "\\begin{aligned}\\min\\;& \\theta \\\\ \\text{ST}\\;& " + lamT("x") + " \\le " + sE.x + "\\,\\theta \\\\ & " + lamT("b") + " \\le " + sE.b + "\\,\\theta \\\\ & " +
      lamT("y") + " \\ge " + sE.y + (M.vrs ? " \\\\ & " + SCH.map(function (s) { return "\\lambda_{" + s.id + "}"; }).join(" + ") + " = 1" : "") +
      " \\\\ & \\lambda_j \\ge 0\\end{aligned}";
    var txt = "min θ\n" + T("ui.st") + " " + lamP("x") + " ≤ " + sE.x + "·θ\n" + lamP("b") + " ≤ " + sE.b + "·θ\n" + lamP("y") + " ≥ " + sE.y +
      (M.vrs ? "\n" + SCH.map(function (s) { return "λ" + s.id; }).join(" + ") + " = 1" : "") + "\nλ ≥ 0";
    TeX.set(document.getElementById("dea-inst"), tex, txt);
    document.getElementById("dea-inst-sol").textContent = T("dea.inst.sol", {
      th: f2(o2.th), lams: o2.peers.map(function (j) { return "λ" + SCH[j].id + " = " + f2(o2.lam[j]); }).join(", ")
    });
  }
  function renderNotes() {
    var c = model("ccr"), v = model("bcc"), sE = SCH[SEL];
    document.getElementById("dea-n1").textContent = T("dea.n.p1", {
      s: SCH[BEST.j].id, r: fr(BEST.r), re: fr(sE.y / sE.x), t: f2(c.one[SEL].th), y: f0(sE.y), tx: f1(c.one[SEL].th * sE.x), x: f0(sE.x)
    });
    document.getElementById("dea-n2").textContent = T("dea.n.p2", {
      list: names(v.eff1), k: v.k1, n: N, t: f2(v.one[SEL].th), peers: names(v.one[SEL].peers),
      t0: f2(c.one[SEL].th), se: f2(c.one[SEL].th / v.one[SEL].th)
    });
    document.getElementById("dea-n3").textContent = T("dea.n.p3", {
      t1c: f2(c.one[SEL].th), t1v: f2(v.one[SEL].th), t2c: f2(c.two[SEL].th), t2v: f2(v.two[SEL].th), k1c: c.k1, k1v: v.k1, k2c: c.k2, k2v: v.k2, n: N, peers: names(model(state.sc).two[SEL].peers)
    });
    var io = IN2(SCH[0]).length + 1;
    document.getElementById("dea-n4").textContent = T("dea.n.p4", { n: N, io: io, need: 3 * io });
  }

  var segBtns = document.querySelectorAll("#dea-seg button");
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      if (state.sc === b.getAttribute("data-sc")) return;
      state.sc = b.getAttribute("data-sc");
      segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      renderScenText(); renderSolution(); renderNotes();
      hudKey = "";
      if (A.reducedMotion) { player.seek(DUR); return; }
      if (player.time < CH[1]) player.refresh();
      else { player.seek(CH[1] + 0.001); player.play(); }
    });
  });

  function renderPage() {
    renderScenText(); renderSolution(); renderNotes();
    hudKey = "";
    player.refresh();
  }
  I18N.onChange(renderPage);
})();
</script>
</body>
