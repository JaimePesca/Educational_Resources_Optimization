<style>
  .wrap { max-width: 1000px; }

  /* variable symbols: binary in accent, continuous in ink */
  .vb { color: var(--accent-text); font-weight: 600; }
  .vc { color: var(--ink); font-weight: 600; }
  .fx { font-family: var(--font-mono); font-size: 14px; color: var(--ink); line-height: 1.6; }
  .fx sub, .vb sub, .vc sub { font-size: 0.72em; line-height: 0; }
  .tag {
    display: inline-block; font: 600 10.5px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase;
    padding: 2px 6px; border-radius: 2px; vertical-align: 1px; white-space: nowrap;
  }
  .tag.bin { background: var(--accent); color: var(--on-solid); }
  .tag.cont { border: 1px solid var(--ink2); color: var(--ink); padding: 1px 5px; }
  .tag.data { border: 1px dashed var(--mit-silver); color: var(--ink2); padding: 1px 5px; }

  /* navigation */
  .navrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .lvbtn {
    font: 600 13.5px var(--font-sans); padding: 8px 12px; min-height: 38px; border-radius: 2px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink2); cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px; text-align: left;
  }
  .lvbtn[aria-current="true"] { background: var(--ink); color: var(--on-solid); border-color: var(--ink); }
  .lvbtn .st { font: 600 12px var(--font-mono); opacity: 0.9; }
  .cardbtn {
    font: 600 13px var(--font-mono); min-width: 52px; min-height: 42px; padding: 4px 8px; border-radius: 2px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink2); cursor: pointer;
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15;
  }
  .cardbtn .st { font-size: 10.5px; letter-spacing: 1px; color: var(--accent-text); }
  .cardbtn .st .off { color: var(--axis); }
  .cardbtn[aria-current="true"] { border: 2px solid var(--accent); color: var(--ink); }
  .navrow .spacer { flex: 1; }

  /* game card */
  .game { display: grid; gap: 16px; }
  .cardhead h2 { font-size: 21px; margin: 0; letter-spacing: -0.01em; }
  .rule {
    margin: 0; font-size: 16.5px; line-height: 1.55; color: var(--ink);
    border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; max-width: 72ch;
  }
  .sublabel {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.13em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 6px;
  }
  .varlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; color: var(--ink2); }
  .varlist li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .varlist .dom { font-family: var(--font-mono); font-size: 13.5px; white-space: nowrap; }

  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
  .opt {
    display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: start; text-align: left;
    font: inherit; color: var(--ink); background: var(--surface); cursor: pointer;
    border: 1.5px solid var(--border); border-radius: 3px; padding: 10px 12px; min-height: 52px;
  }
  .opt:hover { border-color: var(--ink2); }
  .opt .letter {
    width: 28px; height: 28px; display: grid; place-items: center; border-radius: 2px;
    background: var(--surface2); border: 1px solid var(--border); font: 600 13px var(--font-mono); color: var(--ink2);
  }
  .opt .lines { display: grid; gap: 2px; padding-top: 2px; }
  .opt .otag { grid-column: 2; justify-self: start; }
  .opt[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .opt[aria-pressed="true"] .letter { background: var(--ink); color: var(--on-solid); border-color: var(--ink); }
  .opt.right { border-color: var(--good); }
  .opt.wrong { border-color: var(--crit); }
  .otag { font: 600 11px var(--font-mono); letter-spacing: 0.05em; text-transform: uppercase; }
  .otag.ok { color: var(--good-text); }
  .otag.bad { color: var(--crit); }

  /* result */
  .res { border-left: 4px solid var(--border); padding: 4px 0 4px 14px; display: grid; gap: 8px; }
  .res.ok { border-left-color: var(--good); }
  .res.bad { border-left-color: var(--crit); }
  .res .verdict { font-weight: 700; font-size: 20px; margin: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
  .stars { font-size: 18px; letter-spacing: 3px; color: var(--accent-text); }
  .stars .off { color: var(--axis); }
  .stars .bonus { color: var(--mit-bright); }
  .res p { margin: 0; color: var(--ink2); max-width: 74ch; }
  .res p b { color: var(--ink); }
  .why { background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 10px 12px; }
  .why .pat { font-weight: 700; color: var(--ink); margin: 0 0 4px; }
  .why code, .res code, details code { font-family: var(--font-mono); font-size: 0.92em; color: var(--ink); white-space: nowrap; }

  /* verifier table */
  .ver { display: grid; gap: 8px; }
  .ver .sum { margin: 0; font-size: 14px; color: var(--ink2); }
  .ver .sum b { color: var(--ink); }
  table.vt { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  table.vt th {
    text-align: left; font-weight: 600; font-size: 11.5px; color: var(--muted); letter-spacing: 0.03em;
    border-bottom: 1px solid var(--axis); padding: 6px 8px; vertical-align: bottom;
  }
  table.vt td { padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; font-variant-numeric: tabular-nums; }
  table.vt tr.mis td { background: var(--sel); }
  table.vt tr.mis td:first-child { box-shadow: inset 3px 0 0 var(--crit); }
  .plan { font-family: var(--font-mono); font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 12px; }
  .plan span { white-space: nowrap; }
  .yes { color: var(--ink); }
  .no { color: var(--ink2); }
  .detail { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .detail .fx { font-size: 12px; color: var(--ink2); }
  .badge { font: 700 12px var(--font-sans); white-space: nowrap; }
  .badge.cut, .badge.thr { color: var(--crit); }
  .badge.okb { color: var(--good-text); font-weight: 600; }
  .vnote { font-size: 12.5px; color: var(--muted); margin: 0; }
  .vlegend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--ink2); margin: 0; }
  .vlegend b { color: var(--crit); }

  /* fractional point */
  .frac { border: 1px solid var(--border); border-left: 3px solid var(--mit-silver); border-radius: 3px; padding: 10px 12px; display: grid; gap: 8px; background: var(--surface); }
  .frac h3 { margin: 0; font-size: 14.5px; }
  .frac p { margin: 0; font-size: 14px; color: var(--ink2); }
  .frac ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .frac li { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; font-size: 13.5px; }
  .frac .sat { color: var(--crit); font-weight: 600; }
  .frac .vio { color: var(--good-text); font-weight: 600; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button.btn {
    font: 600 14px var(--font-sans); color: var(--on-solid); background: var(--accent);
    border: 1.5px solid var(--accent); border-radius: 2px; padding: 9px 16px; min-height: 40px; cursor: pointer;
  }
  button.btn:hover { filter: brightness(1.08); }
  button.btn.quiet { background: transparent; color: var(--ink2); border-color: var(--border); }
  .sumbox { border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 3px; padding: 12px 14px; display: grid; gap: 6px; background: var(--surface2); }
  .sumbox h3 { margin: 0; font-size: 16px; }
  .sumbox p { margin: 0; color: var(--ink2); font-size: 14px; }

  /* cheat sheet */
  .sheet { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
  .sheet li { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 4px 16px; padding: 8px 0; border-bottom: 1px solid var(--grid); align-items: baseline; }
  .sheet li:last-child { border-bottom: none; }
  .sheet .pn { font-weight: 600; font-size: 14px; }
  .sheet .pn small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .sheet li.locked .pn, .sheet li.locked .fx { color: var(--muted); font-weight: 400; }
  @media (max-width: 560px) { .sheet li { grid-template-columns: 1fr; } }

  /* big-M lab inside the details */
  .lab { display: grid; gap: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 12px; margin: 10px 0; }
  .lab .ctl label .fx { font-size: 13px; }
  .meter { height: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 2px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); width: 0; }
  .lab .verdict2 { margin: 0; font-weight: 600; color: var(--ink); font-size: 14px; }
  .chal { margin: 0; padding-left: 20px; display: grid; gap: 10px; }
  .ans { margin-top: 6px; }
  .ans button { font: 600 13px var(--font-sans); padding: 6px 12px; min-height: 34px; border-radius: 2px; border: 1px solid var(--border); background: var(--surface); color: var(--ink2); cursor: pointer; }
  .ans p { margin: 6px 0 0; }
  .formula sub { font-size: 0.75em; }
  .fx.nw { white-space: nowrap; }
  .sheet li.locked { padding: 5px 0; grid-template-columns: 1fr; font-size: 13.5px; }
</style>
</head>

<script>
(function () {
  "use strict";
  var t = I18N.t;
  var $ = function (id) { return document.getElementById(id); };
  var LETTERS = ["A", "B", "C", "D"];
  var EPS = 1e-9;

  // ---------------------------------------------------------------------------
  // Cards as data. Every option is a list of linear (in)equalities written as
  // text over the card's variables; chains like "20y <= x <= 80y" are allowed.
  // Every rule is a JS predicate on a plan. The verifier derives all verdicts.
  // ok: correct option; tight / agg: the stronger or the aggregated correct form.
  // aux: a helper binary the rule does not mention (the verifier looks for a value that works).
  // ---------------------------------------------------------------------------
  var B = function (id, sym, extra) { var v = { id: id, sym: sym, bin: true }; if (extra) for (var k in extra) v[k] = extra[k]; return v; };
  var C = function (id, sym, lo, hi, unit, test) { return { id: id, sym: sym, bin: false, lo: lo, hi: hi, unit: unit, test: test }; };

  var CARDS = [
    // ---- level 1: switches ----

    var rows = pickRows(v);
    var aux = card.vars.filter(function (x) { return x.aux; });
    var h = '<table class="vt"><thead><tr><th>' + t("mlogic.th.plan") + "</th><th>" + t("mlogic.th.rule") + "</th><th>" +
      t("mlogic.th.cons") + "</th><th>" + t("mlogic.th.check") + "</th></tr></thead><tbody>";
    rows.forEach(function (r) {
      var plan = card.vars.filter(function (x) { return !x.aux; }).map(function (x) {
        return "<span>" + symOf(card, x.id) + " = " + fmtVal(r.plan[x.id]) + "</span>";
      }).join("");
      var consCell = '<span class="' + (r.cons.ok ? "yes" : "no") + '">' + t(r.cons.ok ? "mlogic.allowed" : "mlogic.forbidden") + "</span>";
      if (r.cons.ok && r.cons.aux) {
        consCell += '<span class="detail">' + t("mlogic.withAux", { v: aux.map(function (a) { return '<span class="fx">' + symOf(card, a.id) + " = " + r.cons.aux[a.id] + "</span>"; }).join(" ") }) + "</span>";
      } else if (!r.cons.ok && r.cons.fail) {
        consCell += '<span class="detail">' + t("mlogic.breaks", { c: '<span class="fx">' + renderCon(card, r.cons.fail) + "</span>" }) + "</span>";
      } else if (!r.cons.ok && r.cons.auxNone) {
        consCell += '<span class="detail">' + t("mlogic.noAux", { v: aux.map(function (a) { return '<span class="fx">' + symOf(card, a.id) + "</span>"; }).join(" ") }) + "</span>";
      }
      var badge = r.kind === "cut" ? '<span class="badge cut">' + t("mlogic.badge.cut") + "</span>"
        : r.kind === "thr" ? '<span class="badge thr">' + t("mlogic.badge.thr") + "</span>"
        : '<span class="badge okb">' + t("mlogic.badge.ok") + "</span>";
      h += '<tr class="' + (r.kind === "ok" ? "" : "mis") + '" data-kind="' + r.kind + '"><td><span class="plan">' + plan + "</span></td><td>" +
        '<span class="' + (r.rule ? "yes" : "no") + '">' + t(r.rule ? "mlogic.allowed" : "mlogic.forbidden") + "</span></td><td>" +
        consCell + "</td><td>" + badge + "</td></tr>";
    });
    h += "</tbody></table>";
    wrap.innerHTML = h;
    var misCount = v.cut + v.thr, misShown = rows.filter(function (r) { return r.kind !== "ok"; }).length;
    var note = t("mlogic.ver.rows", { shown: rows.length, n: v.n });
    if (misCount > misShown) note += " " + t("mlogic.ver.moreMis", { k: misCount - misShown });
    $("vnote").textContent = note;
  }

  function renderFrac(card) {
    var host = $("fracbox"), s = S(card), p = P(card);
    if (!card.frac || !p) { host.innerHTML = ""; return; }
    var pt = card.vars.map(function (v) { return '<span class="fx nw">' + symOf(card, v.id) + " = " + fmtVal(card.frac[v.id]) + "</span>"; }).join(" · ");
    var items = card.opts.map(function (o, i) {
      if (!o.ok) return "";
      var bad = null;
      o.cons.forEach(function (c) { if (!bad && !holds(c, card.frac)) bad = c; });
      var res = bad
        ? '<span class="vio" data-frac="violated">' + t("mlogic.frac.viol") + "</span>" + '<span class="detail">' + t("mlogic.breaks", { c: '<span class="fx">' + renderCon(card, bad) + "</span>" }) + "</span>"
        : '<span class="sat" data-frac="satisfied">' + t("mlogic.frac.sat") + "</span>";
      return "<li><b>" + LETTERS[i] + "</b>" + renderOpt(card, o, ", ") + res + "</li>";
    }).join("");
    host.innerHTML = '<div class="frac"><h3><span class="kicker">' + t("mlogic.frac.kicker") + "</span>" + t("mlogic.frac.title") + "</h3><p>" +
      t("mlogic.frac.intro", { pt: pt }) + "</p><ul>" + items + "</ul><p>" + t("mlogic.frac.lesson") + "</p></div>";
  }

  function renderLevelSum(card) {
    var host = $("levelsum");
    var ls = levelStars(card.lv);
    var html = "";
    if (ls.solved === ls.n) {
      var bonusMax = cardsOf(card.lv).filter(hasBonus).length;
      html += '<div class="sumbox" id="lvsum"><h3>' + t("mlogic.sum.title", { n: card.lv }) + "</h3><p>" +
        t("mlogic.sum.text", { s: ls.s, max: ls.max }) + (bonusMax ? " " + t("mlogic.sum.bonus", { b: ls.b, bmax: bonusMax }) : "") + "</p><p>" +
        t(ls.s === ls.max ? "mlogic.sum.perfect" : "mlogic.sum.again") + "</p></div>";
    }
    var all = CARDS.every(function (c) { return P(c); });
    if (all && card.lv === 3) {
      var tot = 0, tb = 0;
      CARDS.forEach(function (c) { tot += P(c).stars; tb += P(c).bonus ? 1 : 0; });
      html += '<div class="sumbox" id="finalsum" style="margin-top:10px"><h3>' + t("mlogic.final.title", { n: CARDS.length }) + "</h3><p>" +
        t("mlogic.final.text", { s: tot, max: CARDS.length * 3, b: tb, bmax: CARDS.filter(hasBonus).length }) + "</p></div>";
    }
    host.innerHTML = html;
  }

  function renderSheet() {
    var ul = $("sheet"); ul.textContent = "";
    var n = 0;
    CARDS.forEach(function (c) {
      var li = document.createElement("li"), p = P(c);
      if (p) {
        n++;
        var best = c.opts.filter(function (o) { return o.tight; })[0] || c.opts.filter(function (o) { return o.ok; })[0];
        li.innerHTML = '<span class="pn"></span><span>' + renderOpt(c, best, ", ") + "</span>";
        li.firstChild.textContent = t("mlogic.c" + c.n + ".pattern");
        var sm = document.createElement("small"); sm.textContent = t("mlogic.sheet.card", { n: c.n }) + ": " + t("mlogic.c" + c.n + ".title");
        li.firstChild.appendChild(sm);
      } else {
        li.className = "locked";
        li.innerHTML = '<span class="pn"></span>';
        li.firstChild.textContent = t("mlogic.sheet.locked", { n: c.n });
      }
      ul.appendChild(li);
    });
    $("sheetcount").textContent = t("mlogic.sheet.count", { k: n, n: CARDS.length });
  }

  function renderAll() { renderNav(); renderCard(); renderSheet(); renderBigM(); renderAns(); }

  // ---- actions ----
  function choose(i) {
    var card = CARDS[cur], s = S(card), o = card.opts[i];
    s.sel = i;
    if (!P(card)) {
      if (o.ok) {
        progress[card.n] = { stars: Math.max(1, 3 - s.wrong.length), bonus: !!o.tight };
      } else if (s.wrong.indexOf(i) < 0) s.wrong.push(i);
    } else if (o.tight) progress[card.n].bonus = true;
    save();
    renderAll();
    var b = $("copts").children[i]; if (b) b.focus();
  }
  $("next").addEventListener("click", function () {
    if (cur < CARDS.length - 1) { cur++; renderAll(); $("ctitle").scrollIntoView({ block: "nearest" }); }
  });
  $("replay").addEventListener("click", function () {
    var lv = CARDS[cur].lv;
    cardsOf(lv).forEach(function (c) { delete progress[c.n]; delete sess[c.n]; });
    save();
    cur = CARDS.indexOf(cardsOf(lv)[0]);
    renderAll();
  });

  // ---- big-M lab (card 7: x <= 50 + M y, x in [0, 80]) ----
  var LABCARD = { vars: [C("x", "x", 0, 80, "t", [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60, 65, 70, 75, 80]), B("y", "y")],
    rule: CARDS[6].rule };
  function renderBigM() {
    var M = +$("bigm").value;
    $("bigmout").textContent = "M = " + M;
    var cons = parseLine("x <= 50 + " + M + "y").cons;
    var v = verify(LABCARD, cons);
    var ymin = M >= 30 ? 30 / M : null;
    var r = t("mlogic.bm.cut", { k: "<b>" + v.cut + "</b>", n: v.n }) + "<br>" +
      (ymin == null ? t("mlogic.bm.ynone") : t("mlogic.bm.ymin", { y: "<b>" + I18N.fmt(ymin, 3) + "</b>", pct: "<b>" + I18N.fmt(ymin * 100, 1) + "</b>" }));
    var rd = $("bmread"); rd.innerHTML = r; rd.dataset.cut = v.cut;
    $("bmfill").style.width = (ymin == null ? 100 : ymin * 100) + "%";
    $("bmmeter").setAttribute("aria-label", ymin == null ? t("mlogic.bm.ynoneAria") : t("mlogic.bm.meterAria", { pct: I18N.fmt(ymin * 100, 1) }));
    $("bmverdict").textContent = M < 30 ? t("mlogic.bm.small", { lim: 50 + M }) : M === 30 ? t("mlogic.bm.exact") : t("mlogic.bm.weak", { pct: I18N.fmt(ymin * 100, 1) });
  }
  $("bigm").addEventListener("input", renderBigM);

  var ansOpen = false;
  function renderAns() {
    $("ansbtn").textContent = t(ansOpen ? "mlogic.btn.hideAns" : "mlogic.btn.showAns");
    $("ansbtn").setAttribute("aria-expanded", ansOpen ? "true" : "false");
    $("anstext").hidden = !ansOpen;
  }
  $("ansbtn").addEventListener("click", function () { ansOpen = !ansOpen; renderAns(); });

  I18N.onChange(renderAll);
})();
</script>
</body>
</html>
