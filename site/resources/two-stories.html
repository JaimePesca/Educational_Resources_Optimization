<style>
  :root { --p: 0; --mid: 0; }

  /* ---- control ---- */
  .control {

  .slider { flex: 1 1 220px; display: flex; align-items: center; min-width: 180px; }

    height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--ink));

  button.btn {

  .ledger b { display: block; font: 700 26px/1 var(--font-sans); color: var(--ink); margin-bottom: 6px; }

  @media (max-width: 560px) { .ledger { grid-template-columns: 1fr; } }

  /* ---- variables ---- */
  .vars { display: grid; gap: 8px; font-size: 16px; color: var(--ink2); }

  /* ---- math (from research.css) ---- */

    background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent);

  .math-out mjx-container[display="true"] { margin: 0.6em 0 !important; }

  /* ---- model card: one row per line of the LP ---- */

    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center;
    padding: 0 10px; margin: 0 -10px; border-radius: 2px; transition: background 0.2s, box-shadow 0.2s;
  }
  .row .math { border: 0; background: transparent; padding: 0; }
  .row .math-out mjx-container[display="true"] { margin: 0.45em 0 !important; }
  .row.lit { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
  .row.obj { border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-bottom: 6px; }
  .tag { font-size: 13.5px; color: var(--muted); text-align: right; }

  @media (max-width: 620px) {
    .row { grid-template-columns: minmax(0, 1fr); padding-bottom: 6px; }
    .tag { text-align: left; font-size: 12.5px; }
  }
  @media (prefers-reduced-motion: reduce) { .swap > i { transform: none !important; } }
</style>

<script>
(function () {
  "use strict";
  var t = I18N.t;

  // ---- tokens: fixed text (F), swapped text (S, "story A || story B"), numbers linked to model rows (N) ----
  var F = function (k) { return { t: "f", k: "two.f." + k }; };
  var S = function (k) { return { t: "s", k: "two.s." + k }; };
  var V = function (k) { return { t: "s", k: "two.v." + k }; };     // swapped text in the variable list
  var VF = function (k) { return { t: "f", k: "two.v." + k }; };    // fixed text in the variable list
  var N = function (s, id) { return { t: "n", s: s, id: id || null }; };

  var TEXT = [
    S("company"), F("uses"), S("inputs"), F("sp"), N("1"), F("and"), N("2"), F("toMake"), S("products"), F("dot"),
    S("ProductCap"), F("sp"), N("1"), F("mustContain"), N("70%", "r1"), F("of"), S("input"), F("sp"), N("1"), F("commaAnd"),
    S("product"), F("sp"), N("2"), F("mustContain"), N("60%", "r2"), F("of"), S("input"), F("sp"), N("2"),
    F("sell1"), N("50", "r3"), F("sp"), S("unitsOfProduct"), F("sp"), N("1"), F("sellAt"), N("$6", "obj"), F("sp"), S("perUnit"),
    F("sell2"), N("30", "r4"), F("sp"), S("unitsOfProduct"), F("sp"), N("2"), F("sellAt"), N("$5", "obj"), F("sp"), S("perUnit"),
    F("buy1"), N("47", "r5"), F("sp"), S("unitsOfInput"), F("sp"), N("1"), F("buyAt"), N("$6", "obj"), F("sp"), S("perUnit"),
    F("buy2"), N("40", "r6"), F("sp"), S("unitsOfInput"), F("sp"), N("2"), F("buyAt"), N("$5", "obj"), F("sp"), S("perUnit"),
    F("ask"), S("companyShort"), F("end")
  ];

  function varLine(i, j) {
    return [V("units"), VF("of"), V("input"), F("sp"), N(String(i)), F("sp"), V("usedIn"), F("sp"), N(String(j))];
  }
  var VARS = [
    ["x_1", varLine(1, 1)],
    ["x_2", varLine(2, 1)],
    ["y_1", varLine(1, 2)],
    ["y_2", varLine(2, 2)]
  ];

  function parts(key) {
    var v = t(key).split("||");
    return [v[0].trim(), (v[1] == null ? v[0] : v[1]).trim()];
  }

  function build(tokens, host) {
    tokens.forEach(function (tk) {
      if (tk.t === "f") {
        host.appendChild(document.createTextNode(t(tk.k)));
      } else if (tk.t === "s") {
        var ab = parts(tk.k);
        var g = document.createElement("span");
        g.className = "swap";
        var a = document.createElement("i"); a.className = "a"; a.textContent = ab[0];
        var b = document.createElement("i"); b.className = "b"; b.textContent = ab[1];
        g.appendChild(a); g.appendChild(b);
        host.appendChild(g);
      } else {
        var n = document.createElement("span");
        n.className = "num";
        n.textContent = tk.s;
        if (tk.id) { n.dataset.link = tk.id; n.tabIndex = 0; }
        host.appendChild(n);
      }
    });
  }

  // ---- math (MathJax 3, SVG output) ----
  var mathReady = false;
  var mathOuts = [];
  function renderMath() {
    if (!mathReady) return;
    var outs = Array.prototype.map.call(document.querySelectorAll(".math script[type='text/x-tex']"), function (s) {
      var out = s.parentNode.querySelector(".math-out");
      if (!out) {
        out = document.createElement("div");
        out.className = "math-out";
        s.parentNode.appendChild(out);
      }
      var tex = s.textContent.replace(/\\text\{ST\}/g, "\\text{" + t("ui.st") + "}");
      out.textContent = "\\[" + tex + "\\]";
      return out;
    });
    outs = outs.concat(Array.prototype.slice.call(document.querySelectorAll(".vars .sym")));
    if (window.MathJax.typesetClear) window.MathJax.typesetClear(mathOuts);
    mathOuts = outs;
    window.MathJax.typesetPromise(outs).catch(function (e) { console.error(e); });
  }
  window.MathJax = {
    tex: { inlineMath: [["\\(", "\\)"]] },
    svg: { fontCache: "global", displayAlign: "left", displayIndent: "0" },
    startup: {
      typeset: false,
      ready: function () {
        window.MathJax.startup.defaultReady();
        mathReady = true;
        renderMath();
      }
    }
  };
  var mj = document.createElement("script");
  mj.src = "https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js";
  mj.async = true;
  document.head.appendChild(mj);

  // ---- number to model row link ----
  function lite(id, on) {
    Array.prototype.forEach.call(document.querySelectorAll(".row"), function (r) {
      if (r.dataset.id === id) r.classList.toggle("lit", on);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.num[data-link="' + id + '"]'), function (n) {
      n.classList.toggle("lit", on);
    });
  }
  function wireNums(host) {
    Array.prototype.forEach.call(host.querySelectorAll(".num[data-link]"), function (n) {
      var id = n.dataset.link;
      ["mouseenter", "focus"].forEach(function (ev) { n.addEventListener(ev, function () { lite(id, true); }); });
      ["mouseleave", "blur"].forEach(function (ev) { n.addEventListener(ev, function () { lite(id, false); }); });
    });
  }

  // ---- render (text depends on the language) ----
  var stmt = document.getElementById("statement");
  var varsHost = document.getElementById("vars");
  function render() {
    Array.prototype.forEach.call(document.querySelectorAll(".lit"), function (e) { e.classList.remove("lit"); });
    stmt.textContent = "";
    build(TEXT, stmt);
    wireNums(stmt);

    varsHost.textContent = "";
    VARS.forEach(function (v) {
      var line = document.createElement("div");
      var sym = document.createElement("span");
      sym.className = "sym";
      sym.textContent = "\\(" + v[0] + " =\\)";
      line.appendChild(sym);
      build(v[1], line);
      varsHost.appendChild(line);
    });

    var nData = TEXT.filter(function (x) { return x.t === "n" && x.id; }).length;
    var nRows = document.querySelectorAll("#model .row").length;
    document.getElementById("cSwap").textContent = I18N.fmt(TEXT.filter(function (x) { return x.t === "s"; }).length, 0);
    document.getElementById("lSwap").textContent = t("two.ledger.swap");
    document.getElementById("lData").textContent = t("two.ledger.data", { n: I18N.fmt(nData, 0) });
    document.getElementById("lRows").textContent = t("two.ledger.rows", { n: I18N.fmt(nRows, 0) });

    renderMath();
  }

  // ---- transition between the two stories ----
  var root = document.documentElement;
  var scrub = document.getElementById("scrub");
  var raf = null;
  function set(p) {
    p = Math.min(1, Math.max(0, p));
    root.style.setProperty("--p", p.toFixed(4));
    root.style.setProperty("--mid", (1 - Math.abs(2 * p - 1)).toFixed(4));
  }
  scrub.addEventListener("input", function () {
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    set(scrub.value / 100);
  });
  function glide(to) {
    if (raf) cancelAnimationFrame(raf);
    var from = scrub.value / 100;
    if (Math.abs(to - from) < 0.001) return;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { scrub.value = to * 100; set(to); return; }
    var t0 = performance.now(), dur = 1500;
    (function step(now) {
      var k = Math.min(1, (now - t0) / dur);
      var e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      var p = from + (to - from) * e;
      scrub.value = p * 100;
      set(p);
      if (k < 1) raf = requestAnimationFrame(step); else raf = null;
    })(t0);
  }
  document.getElementById("play").addEventListener("click", function () {
    glide(scrub.value / 100 > 0.5 ? 0 : 1);
  });
  Array.prototype.forEach.call(document.querySelectorAll(".vname"), function (btn) {
    btn.addEventListener("click", function () { glide(Number(btn.dataset.goto)); });
  });

  set(0);
  I18N.onChange(render);
})();
</script>
</body>
</html>
