<title>Growing the Search Tree</title>

<style>
  /* week tabs */
  .levels { display: flex; gap: 8px; flex-wrap: wrap; }
  .lvbtn {
    font: 600 13.5px var(--font-sans); padding: 8px 14px; border-radius: 99px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink2); display: inline-flex; align-items: baseline; gap: 8px;
  }
  .lvbtn[aria-current="true"] { background: var(--pine); color: var(--on-solid); border-color: var(--pine); }
  .lvbtn .st { font-size: 12px; font-weight: 500; opacity: 0.85; }

  /* controls */
  .ctlgrid { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.3fr); gap: 16px 24px; align-items: start; }
  @media (max-width: 820px) { .ctlgrid { grid-template-columns: minmax(0, 1fr); } }
  .formula.model { margin: 4px 0 0; }
  .controls { display: flex; flex-direction: column; gap: 12px; }
  .crow { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
  .crow.fields { align-items: end; gap: 10px 16px; }
  button.btn { font: 600 14px var(--font-sans); color: var(--on-solid); background: var(--accent); border: none; border-radius: 4px; padding: 9px 16px; cursor: pointer; }
  button.btn:hover { filter: brightness(1.08); }
  button.btn:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
  button.ghost, button.quiet { background: transparent; padding: 7.5px 14px; }
  button.ghost { color: var(--accent-text); border: 1.5px solid var(--accent-text); }
  button.quiet { color: var(--ink2); border: 1.5px solid var(--border); }
  .stepcount { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .field { display: grid; gap: 5px; }
  .flabel { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); }
  .seg { display: inline-flex; border: 1.5px solid var(--border); border-radius: 4px; overflow: hidden; }
  .seg button { font: 600 13px var(--font-sans); padding: 7px 12px; border: none; cursor: pointer; background: transparent; color: var(--ink2); line-height: 1.3; }
  .seg button + button { border-left: 1.5px solid var(--border); }
  .seg button:hover { background: var(--surface2); }
  .seg button[aria-pressed="true"] { background: var(--pine); color: var(--on-solid); }
  select { font: 500 13.5px var(--font-sans); color: var(--ink); background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 7px 8px; }
  .narr {
    margin-top: 14px; background: var(--surface2); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 3px; padding: 10px 13px; font-size: 14.5px; line-height: 1.6; min-height: 5.2em; color: var(--ink2);
  }
  .narr b { color: var(--ink); }
  .narr .why { display: block; color: var(--muted); font-size: 13.5px; }
  .narr .k-inf b:last-child { color: var(--crit); }
  .narr .k-int b { color: var(--good-text); }
  .narr .done { display: block; margin-top: 4px; color: var(--ink); }

  /* plane + tree */
  .layout { display: grid; grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr); gap: 18px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  svg#plane { display: block; width: 100%; height: auto; max-width: 540px; margin: 0 auto; }
  .viewing { font-size: 13.5px; color: var(--ink2); margin-top: 8px; min-height: 1.6em; }
  .viewing button { margin-left: 6px; padding: 3px 10px; font-size: 12.5px; }
  .plot-foot, .chart-foot { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; align-items: center; }
  .legend-item { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink2); }
  .sw { width: 14px; height: 13px; border-radius: 2px; flex: none; }
  .sw.area { background: var(--region); border: 1.5px solid var(--ink); }
  .sw.hatch { background: repeating-linear-gradient(45deg, var(--crit) 0 1.5px, transparent 1.5px 5px); border: 1px solid var(--crit); }
  .sw.open { border: 1.5px dashed var(--ink2); }
  .sw.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
  .sw.lp { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); }
  .sw.star { width: auto; height: auto; color: var(--good); font-size: 15px; line-height: 1; }
  .sw.iso, .sw.isog { height: 3px; background: repeating-linear-gradient(90deg, var(--accent) 0 5px, transparent 5px 8px); }
  .sw.isog { background: repeating-linear-gradient(90deg, var(--good) 0 5px, transparent 5px 8px); }
  .sw.line { height: 3px; }
  .sw.band { background: var(--region); }
  .treewrap { overflow-x: auto; overscroll-behavior-x: contain; padding-bottom: 4px; }
  svg#tree { display: block; width: 100%; height: auto; margin: 0 auto; }
  svg#tree .tn { cursor: pointer; }
  svg#tree .tn:focus { outline: none; }
  svg#tree .tn:focus-visible .box { stroke: var(--accent); stroke-width: 3; }
  .chiplegend { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px 14px; margin-top: 10px; font-size: 12.5px; color: var(--ink2); }
  .chip { display: inline-block; font: 600 11px var(--font-sans); padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; margin-right: 6px; background: var(--surface2); white-space: nowrap; }
  .chip.open { color: var(--muted); border-style: dashed; }
  .chip.br { color: var(--ink2); }
  .chip.inf { color: var(--crit); }
  .chip.bound { color: var(--muted); }
  .chip.inc { color: var(--good-text); }

  /* telemetry */
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 640px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .tile { background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 10px 12px; }
  .tile .tl { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.11em; text-transform: uppercase; color: var(--muted); }
  .tile .tv { font-family: var(--font-mono); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .tile .tv.inc { color: var(--good-text); }
  .tile .tv.bd { color: var(--accent-text); }
  .telsub { font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
  .chartcard { position: relative; }
  svg#chart { display: block; width: 100%; height: auto; margin-top: 6px; }
  #ctip {
    position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 6px 10px;
    font-family: var(--font-mono); font-size: 12px; box-shadow: 0 3px 14px rgba(0, 0, 0, 0.16); white-space: nowrap; z-index: 5; line-height: 1.5;
  }

  /* summary */
  .result { border-left: 4px solid var(--accent); }
  .result p { margin: 0 0 8px; color: var(--ink2); }
  .result p b { color: var(--ink); }
  .tblwrap { overflow-x: auto; margin-top: 6px; }
  table { border-collapse: collapse; font-size: 13.5px; min-width: 300px; }
  caption { text-align: left; font-size: 12.5px; color: var(--muted); padding-bottom: 6px; }
  th { text-align: left; font: 400 11px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--axis); padding: 6px 12px; }
  td { padding: 7px 12px; border-bottom: 1px solid var(--grid); font: 13px var(--font-mono); font-variant-numeric: tabular-nums; }
  td.cur { background: var(--sel); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }

    <details>

<script>
(function () {
  "use strict";
  var t = I18N.t, $ = function (id) { return document.getElementById(id); };
  var fmt = function (v, d) { return I18N.fmt(v, d == null ? 2 : d); };
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var SUB = ["₁", "₂"], NS = "http://www.w3.org/2000/svg";
  var MONO = "JetBrains Mono, monospace", SANS = "Neue Haas Grotesk Text, Helvetica Neue, Helvetica, Arimo, Arial, sans-serif";

  // ---- the three weekly orders: max c·x s.t. a·x ≤ rhs, x ≥ 0 integer ----
  var WEEKS = [
    { c: [8, 5], cons: [{ a: 3, b: 5, rhs: 27, k: "wood" }, { a: 5, b: 3, rhs: 21, k: "labor" }] },
    { c: [5, 4], cons: [{ a: 8, b: 5, rhs: 27, k: "wood" }, { a: 1, b: 3, rhs: 9, k: "finish" }, { a: 6, b: 3, rhs: 20, k: "labor" }] },
    { c: [9, 4], cons: [{ a: 8, b: 6, rhs: 30, k: "wood" }, { a: 8, b: 3, rhs: 26, k: "labor" }] }
  ];

  // ---- exact LP of a node: enumerate the vertices of {a·x ≤ rhs, lo ≤ x ≤ hi} ----
  var EPS = 1e-9;
  function isInt(v) { return Math.abs(v - Math.round(v)) <= EPS; }
  function solveLP(w, lo, hi) {
    var L = w.cons.map(function (c) { return [c.a, c.b, c.rhs]; }), pts = [], best = null;
    L.push([1, 0, lo[0]], [0, 1, lo[1]]);
    if (isFinite(hi[0])) L.push([1, 0, hi[0]]);
    if (isFinite(hi[1])) L.push([0, 1, hi[1]]);
    for (var i = 0; i < L.length; i++) for (var k = i + 1; k < L.length; k++) {
      var det = L[i][0] * L[k][1] - L[k][0] * L[i][1];
      if (Math.abs(det) < EPS) continue;
      var x = (L[i][2] * L[k][1] - L[k][2] * L[i][1]) / det, y = (L[i][0] * L[k][2] - L[k][0] * L[i][2]) / det;
      if (isInt(x)) x = Math.round(x) || 0; // "|| 0" turns −0 into 0
      if (isInt(y)) y = Math.round(y) || 0;
      if (x < lo[0] - EPS || x > hi[0] + EPS || y < lo[1] - EPS || y > hi[1] + EPS) continue;
      if (!w.cons.every(function (c) { return c.a * x + c.b * y <= c.rhs + EPS; })) continue;
      if (pts.some(function (p) { return Math.abs(p[0] - x) < 1e-7 && Math.abs(p[1] - y) < 1e-7; })) continue;
      pts.push([x, y]);
    }
    if (!pts.length) return { ok: false, poly: [] };
    var cx = 0, cy = 0;
    pts.forEach(function (p) {
      var z = w.c[0] * p[0] + w.c[1] * p[1];
      if (!best || z > best.z + EPS) best = { x: p, z: z };
      cx += p[0] / pts.length; cy += p[1] / pts.length;
    });
    pts.sort(function (p, q) { return Math.atan2(p[1] - cy, p[0] - cx) - Math.atan2(q[1] - cy, q[0] - cx); });
    return { ok: true, x: best.x, z: best.z, poly: pts };
  }

  // ---- branch and bound, recorded step by step (one node processed per step) ----
  function runBB(w, sel, br) {
    var nodes = [], open = [], steps = [], inc = null, lps = 0;
    function mk(parent, lo, hi, bc) {
      var n = { id: nodes.length, parent: parent, depth: parent ? parent.depth + 1 : 0, lo: lo, hi: hi, bc: bc,
        bound: parent ? parent.lp.z : Infinity, st: "open", kids: [] };
      nodes.push(n); open.push(n);
      if (parent) parent.kids.push(n.id);
    }
    function snap(ev) {
      var b = inc ? inc.z : -Infinity;
      open.forEach(function (n) { if (n.bound > b) b = n.bound; });
      ev.st = nodes.map(function (n) { return n.st; });
      ev.inc = inc ? { z: inc.z, x: inc.x, id: inc.id } : null;
      ev.ub = b; ev.lps = lps; ev.open = open.length;
      steps.push(ev);
    }
    mk(null, [0, 0], [Infinity, Infinity], null);
    snap({ kind: "start", id: 0 });
    while (open.length) {
      open.sort(function (p, q) {
        if (sel === "best" && p.bound !== q.bound) return q.bound - p.bound;
        if (p.depth !== q.depth) return q.depth - p.depth;
        return p.id - q.id;
      });
      var n = open.shift(), lp = solveLP(w, n.lo, n.hi), ev = { id: n.id, bound: n.bound };
      lps++; n.lp = lp; n.step = steps.length;

      var g = add(el("g", { "class": "tn", tabindex: 0, role: "button", "aria-pressed": n.id === fid ? "true" : "false",
        "aria-label": t("bnb.node.aria", { n: n.id + 1, state: [n.bc ? bcText(n.bc) : "", zTxt, row2, t(chip)].filter(Boolean).join(", ") }) }));
      if (n.id === ev.id || n.id === fid) g.appendChild(el("rect", { x: x0 - 5, y: y0 - 5, width: TW + 10, height: TH + 10, rx: 8, fill: n.id === ev.id ? C.sel : "none",
        stroke: C.accent, "stroke-width": n.id === ev.id ? 2.5 : 2, "stroke-dasharray": n.id === ev.id ? "none" : "5 3" }));
      g.appendChild(el("rect", { "class": "box", x: x0, y: y0, width: TW, height: TH, rx: 4, fill: sty[1], stroke: sty[0],
        "stroke-width": code === "inc" ? 2.4 : 1.5, "stroke-dasharray": code === "open" ? "4 3" : "none" }));
      g.appendChild(tx(x0 + 7, y0 + 16, "#" + (n.id + 1), { "font-weight": 600 }));
      g.appendChild(tx(x0 + TW - 7, y0 + 16, zTxt, { "text-anchor": "end", "font-size": 12, "font-weight": 600, fill: solved ? C.ink : C.muted }));
      g.appendChild(tx(n.px, y0 + 32, row2, { "text-anchor": "middle", fill: solved ? C.ink2 : C.muted, "font-style": solved ? "normal" : "italic" }));
      g.appendChild(el("rect", { x: x0 + 6, y: y0 + 39, width: TW - 12, height: 14, rx: 7, fill: C.surface2, stroke: sty[2], "stroke-width": 1, "stroke-dasharray": code === "open" ? "3 2" : "none" }));
      g.appendChild(tx(n.px, y0 + 49.5, t(chip), { "text-anchor": "middle", "font-size": 10, "font-weight": 600, "font-family": SANS, fill: sty[2] }));
      function pick() { stop(); S.focus = n.id === ev.id ? null : n.id; renderAll(); }
      g.addEventListener("click", pick);
      g.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
    });
    var wrap = $("treewrap"); // keep the selected node in view when the tree scrolls sideways
    if (wrap.scrollWidth > wrap.clientWidth + 2) wrap.scrollLeft = Math.max(0, r.nodes[fid].px * svg.getBoundingClientRect().width / r.tw - wrap.clientWidth / 2);
  }

  // ---- telemetry + bound chart ----
  var CW = 640, CH = 210, CM = { l: 44, r: 124, t: 14, b: 36 }, chartState = null;
  function niceTicks(min, max, count) {
    var span = max - min || 1, stp = Math.pow(10, Math.floor(Math.log10(span / count))), err = span / count / stp, out = [];
    stp *= err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1;
    for (var v = Math.ceil(min / stp) * stp; v <= max + 1e-9; v += stp) out.push(Math.round(v * 1000) / 1000);
    return out;
  }
  function gapOf(e) { return (e.ub - e.inc.z) / Math.abs(e.inc.z) * 100; }
  function renderTel() {
    var ev = run().steps[S.step];
    $("t-lps").textContent = ev.lps;
    $("t-inc").textContent = ev.inc ? fmt(ev.inc.z) : "·";
    $("t-bound").textContent = S.step === 0 ? "∞" : fmt(ev.ub);
    $("t-gap").textContent = S.step > 0 && ev.inc ? pct(gapOf(ev)) : "·";
    $("telsub").textContent = t("bnb.tel.sub", { open: ev.open, n: ev.st.length });
    renderChart();
  }
  function renderChart() {
    var r = run(), s = S.step, L = last(), svg = $("chart"), lo = Infinity, hi = -Infinity, i;
    var add = function (n) { svg.appendChild(n); return n; };
    CW = Math.round(Math.max(340, Math.min(780, svg.getBoundingClientRect().width || 640))); // about 1:1 text at any width
    svg.setAttribute("viewBox", "0 0 " + CW + " " + CH);
    svg.textContent = ""; chartState = null;
    if (s < 1) { add(tx(CW / 2, CH / 2, t("bnb.chart.empty"), { "text-anchor": "middle", "font-size": 13, "font-family": SANS })); return; }
    r.steps.forEach(function (e, k) {
      if (!k) return;
      hi = Math.max(hi, e.ub); lo = Math.min(lo, e.ub, e.inc ? e.inc.z : Infinity);
    });
    var pad = (hi - lo) * 0.12 + 0.3; lo -= pad; hi += pad;
    var X = function (k) { return CM.l + (k - 1) / Math.max(1, L - 1) * (CW - CM.l - CM.r); };
    var Y = function (v) { return CH - CM.b - (v - lo) / (hi - lo) * (CH - CM.t - CM.b); };
    niceTicks(lo, hi, 4).forEach(function (v) {
      add(ln(CM.l, Y(v), CW - CM.r, Y(v), C.grid, 1));
      add(tx(CM.l - 7, Y(v) + 4, fmt(v, 1), { "text-anchor": "end" }));
    });
    var every = X(2) - X(1) < 20 ? 2 : 1;
    for (i = 1; i <= L; i++) if ((i - 1) % every === 0 || i === L) add(tx(X(i), CH - CM.b + 16, i, { "text-anchor": "middle", fill: i <= s ? C.ink2 : C.muted }));
    add(ln(CM.l, CH - CM.b, CW - CM.r, CH - CM.b, C.axis, 1.2));
    add(tx((CM.l + CW - CM.r) / 2, CH - 3, t("bnb.chart.x"), { "text-anchor": "middle", "font-size": 12, "font-family": SANS, fill: C.ink2 }));
    // gap band, then the two step lines (a value set at step k holds until step k + 1)
    for (i = 1; i < s; i++) {
      var e = r.steps[i];
      if (e.inc && e.ub > e.inc.z) add(el("rect", { x: X(i), y: Y(e.ub), width: X(i + 1) - X(i), height: Y(e.inc.z) - Y(e.ub), fill: C.region }));
    }
    function stepPath(val, color) {
      var d = "";
      for (var k = 1; k <= s; k++) {
        var v = val(r.steps[k]);
        if (v != null) d += d ? " H" + X(k).toFixed(1) + " V" + Y(v).toFixed(1) : "M" + X(k).toFixed(1) + " " + Y(v).toFixed(1);
      }
      if (d) add(el("path", { d: d, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round" }));
    }
    stepPath(function (e) { return e.ub; }, C.accent);
    stepPath(function (e) { return e.inc ? e.inc.z : null; }, C.good);
    var ev = r.steps[s], yB = Y(ev.ub), yI = ev.inc ? Y(ev.inc.z) : null, lab = { "font-size": 11.5, "font-weight": 600, "font-family": SANS, fill: C.ink2 };
    if (yI != null && Math.abs(yI - yB) < 14) { yB = Math.min(yB, yI) - 7; yI = yB + 14; }
    add(el("circle", { cx: X(s), cy: Y(ev.ub), r: 3.5, fill: C.accent }));
    add(tx(X(s) + 8, yB + 4, t("bnb.chart.bound"), hal(Object.assign({}, lab))));
    if (ev.inc) {
      add(el("circle", { cx: X(s), cy: Y(ev.inc.z), r: 3.5, fill: C.good }));
      add(tx(X(s) + 8, yI + 4, t("bnb.chart.inc"), hal(Object.assign({}, lab))));
    }
    chartState = { X: X, s: s, L: L, cross: add(el("line", { x1: 0, y1: CM.t, x2: 0, y2: CH - CM.b, stroke: C.axis, "stroke-dasharray": "3 3", visibility: "hidden" })) };
  }
  var ctip = $("ctip");
  $("chart").addEventListener("pointermove", function (ev) {
    if (!chartState) { ctip.hidden = true; return; }
    var rect = this.getBoundingClientRect(), px = (ev.clientX - rect.left) / rect.width * CW;
    var i = Math.round((px - CM.l) / (CW - CM.l - CM.r) * Math.max(1, chartState.L - 1)) + 1;
    if (i < 1 || i > chartState.s) { ctip.hidden = true; chartState.cross.setAttribute("visibility", "hidden"); return; }
    var e = run().steps[i], x = chartState.X(i), host = this.parentElement.getBoundingClientRect();
    chartState.cross.setAttribute("x1", x); chartState.cross.setAttribute("x2", x); chartState.cross.setAttribute("visibility", "visible");
    ctip.innerHTML = t("bnb.chart.tip", { k: i, b: fmt(e.ub), i: e.inc ? fmt(e.inc.z) : "·", g: e.inc ? pct(gapOf(e)) : "·" });
    ctip.hidden = false;
    var tx0 = ev.clientX - host.left + 14;
    ctip.style.left = (tx0 + 170 > host.width ? tx0 - 190 : tx0) + "px"; ctip.style.top = (ev.clientY - host.top + 8) + "px";
  });
  $("chart").addEventListener("pointerleave", function () { ctip.hidden = true; if (chartState) chartState.cross.setAttribute("visibility", "hidden"); });

  // ---- summary after the last step: the other strategies are run silently for comparison ----
  function renderSummary() {
    var r = run(), box = $("summary");
    box.hidden = S.step < last();
    if (box.hidden) return;
    var other = S.sel === "dfs" ? "best" : "dfs", r2 = getRun(S.w, other, S.br), d = r2.lps - r.lps;
    $("sum-opt").innerHTML = t("bnb.sum.opt", { x1: r.inc.x[0], x2: r.inc.x[1], z: fmt(r.inc.z) });
    $("sum-run").innerHTML = t("bnb.sum.run", { sel: t("bnb.sel." + S.sel), br: t("bnb.br." + S.br), lps: r.lps, n: r.nodes.length });
    $("sum-cmp").innerHTML = t("bnb.sum.cmp", { sel: t("bnb.sel." + other), lps: r2.lps, n: r2.nodes.length }) + " " +
      (d < 0 ? t("bnb.sum.fewer", { d: -d }) : d > 0 ? t("bnb.sum.more", { d: d }) : t("bnb.sum.same"));
    var html = "<caption>" + t("bnb.sum.tbl") + "</caption><tr><th></th><th>" + t("bnb.br.most") + "</th><th>" + t("bnb.br.first") + "</th></tr>";
    ["dfs", "best"].forEach(function (sl) {
      html += '<tr><th scope="row">' + t("bnb.sel." + sl) + "</th>";
      ["most", "first"].forEach(function (b) {
        var q = getRun(S.w, sl, b);
        html += "<td" + (sl === S.sel && b === S.br ? ' class="cur"' : "") + ">" + q.lps + " (" + q.nodes.length + ")</td>";
      });
      html += "</tr>";
    });
    $("sum-tbl").innerHTML = html;
    $("sum-check").textContent = t("bnb.sum.check", { n: WEEKS[S.w].brute.all, z: fmt(WEEKS[S.w].brute.z) });
  }

  function renderAll() {
    readColors();
    S.focus = focusId() === run().steps[S.step].id ? null : S.focus;
    renderWeeks(); renderControls(); renderNarr(); renderPlane(); renderTree(); renderTel(); renderSummary();
    persist();
  }

  // ---- playback ----
  function stop() { playing = false; clearTimeout(timer); }
  function go(k) { S.step = Math.max(0, Math.min(last(), k)); S.focus = null; renderAll(); }
  function tick() {
    if (!playing) return;
    if (S.step < last()) go(S.step + 1);
    if (S.step >= last()) { stop(); renderControls(); return; }
    timer = setTimeout(tick, +$("speed").value);
  }
  function reset() { stop(); S.step = 0; S.focus = null; renderAll(); }
  $("step").addEventListener("click", function () { stop(); go(S.step + 1); });
  $("back").addEventListener("click", function () { stop(); go(S.step - 1); });
  $("restart").addEventListener("click", reset);
  $("play").addEventListener("click", function () {
    if (reduce) { stop(); go(last()); return; } // reduced motion: no autoplay, jump to the final state
    if (playing) { stop(); renderControls(); return; }
    if (S.step >= last()) S.step = 0;
    playing = true; tick();
  });
  $("speed").addEventListener("change", function () { if (playing) { clearTimeout(timer); timer = setTimeout(tick, +$("speed").value); } });
  [["sel-dfs", "sel", "dfs"], ["sel-best", "sel", "best"], ["br-most", "br", "most"], ["br-first", "br", "first"]].forEach(function (b) {
    $(b[0]).addEventListener("click", function () { if (S[b[1]] !== b[2]) { S[b[1]] = b[2]; reset(); } });
  });
  document.addEventListener("keydown", function (e) {
    var tag = e.target && e.target.tagName;
    if (e.altKey || e.ctrlKey || e.metaKey || tag === "SELECT" || tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { stop(); go(S.step + 1); }
    if (e.key === "ArrowLeft") { stop(); go(S.step - 1); }
  });

  // colors come from the tokens: redraw when the theme flips
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderAll);
  new MutationObserver(renderAll).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  var rt = 0;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { renderTree(); renderChart(); }, 120); });

  // ---- hot state (survives a republish while the page is open) ----
  function persist() {
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
      try { window.claude.hot.snapshot({ w: S.w, sel: S.sel, br: S.br, step: S.step, focus: S.focus }); } catch (e) { /* ok */ }
    }
  }
  function start(data) {
    if (data && typeof data.w === "number" && WEEKS[data.w]) {
      S.w = data.w;
      if (data.sel === "dfs" || data.sel === "best") S.sel = data.sel;
      if (data.br === "most" || data.br === "first") S.br = data.br;
      S.step = Math.max(0, Math.min(last(), data.step | 0));
      S.focus = typeof data.focus === "number" ? data.focus : null;
    }
    I18N.onChange(renderAll);
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
</body>
