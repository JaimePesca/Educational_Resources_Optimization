<script>
(function () {
  "use strict";
  var T = I18N.t;
  var fmt = function (v) { return I18N.fmt(Math.round(v), 0); };
  var ARR = " → ", BARR = " ⇢ ";

  /* =====================================================================================
     The two networks. Capacities of the gas network and every position are illustrative;
     the trap network is the classic example (four arcs of capacity C and a middle arc of 1).
     Nodes are handled in alphabetical order, so every tie is broken alphabetically.
     ===================================================================================== */
  var C_TRAP = 1000;
  var GAS = prep({ src: "s", snk: "t",
    pos: { s: [0, 1.3], a: [1.15, 2.2], b: [1.15, 0.35], c: [2.45, 2.0], d: [2.45, 0.35], e: [2.3, 3.05], t: [3.6, 1.3] },
    arcs: [["s", "a", 300], ["s", "b", 250], ["a", "c", 250], ["a", "e", 150], ["b", "d", 300],
      ["c", "t", 250], ["d", "c", 50], ["d", "t", 150], ["e", "t", 200]] });
  var TRAP = prep({ src: "s", snk: "t",
    pos: { s: [0, 1], a: [1.5, 2], b: [1.5, 0], t: [3, 1] },
    arcs: [["s", "a", C_TRAP], ["s", "b", C_TRAP], ["a", "b", 1], ["a", "t", C_TRAP], ["b", "t", C_TRAP]] });

  function prep(net) {
    var names = Object.keys(net.pos).sort(), n = names.length, id = {}, i;
    names.forEach(function (k, j) { id[k] = j; });
    var arc = [];
    for (i = 0; i < n; i++) arc.push(new Array(n).fill(-1));
    var cmax = 0, cmin = Infinity;
    net.A = net.arcs.map(function (a, k) {
      var u = id[a[0]], v = id[a[1]]; arc[u][v] = k; cmax = Math.max(cmax, a[2]); cmin = Math.min(cmin, a[2]);
      return { u: u, v: v, c: a[2] };
    });
    net.names = names; net.n = n; net.id = id; net.arc = arc; net.cmax = cmax; net.cmin = cmin;
    net.s = id[net.src]; net.t = id[net.snk];
    return net;
  }
  function zeros(net) { return net.A.map(function () { return 0; }); }
  function resid(net, f, u, v, fwdOnly) {        // residual capacity of u -> v (forward spare + backward flow)
    var r = 0, k = net.arc[u][v], j = net.arc[v][u];
    if (k >= 0) r += net.A[k].c - f[k];
    if (j >= 0 && !fwdOnly) r += f[j];
    return r;
  }
  function value(net, f) {
    var v = 0;
    net.A.forEach(function (a, k) { if (a.u === net.s) v += f[k]; if (a.v === net.s) v -= f[k]; });
    return v;
  }
  function bfsPath(net, f, fwdOnly) {             // Edmonds-Karp: breadth-first search, fewest arcs
    var prev = new Array(net.n).fill(-2), q = [net.s], u, v;
    prev[net.s] = -1;
    while (q.length) {
      u = q.shift();
      for (v = 0; v < net.n; v++) if (prev[v] === -2 && resid(net, f, u, v, fwdOnly) > 0) { prev[v] = u; q.push(v); }
    }
    if (prev[net.t] === -2) return null;
    var p = [net.t];
    while (prev[p[p.length - 1]] !== -1) p.push(prev[p[p.length - 1]]);
    return p.reverse();
  }
  function longestPath(net, f, fwdOnly) {         // the unlucky rule: the simple path with the most arcs
    var best = null, p = [net.s], on = new Array(net.n).fill(false);
    on[net.s] = true;
    (function dfs() {
      var u = p[p.length - 1];
      if (u === net.t) { if (!best || p.length > best.length) best = p.slice(); return; }
      for (var v = 0; v < net.n; v++) {
        if (!on[v] && resid(net, f, u, v, fwdOnly) > 0) { on[v] = true; p.push(v); dfs(); p.pop(); on[v] = false; }
      }
    })();
    return best;
  }
  function run(net, rule, fwdOnly) {
    var f = zeros(net), log = [], guard = 0;
    while (guard++ < 100000) {

    if (bi >= 0) {
      var Lb = ek[bi], s = Lb.back.indexOf(true), u = Lb.path[s + 1], w = Lb.path[s];   // the pipe u -> w is run backward
      p2.textContent = T("mf.n.p2", { k: fmt(bi + 1), p: pathText(GAS, Lb, false), d: fmt(Lb.d), u: GAS.names[u], w: GAS.names[w], g: fmt(GREEDY.v), v: fmt(RES.ek.gas.v) });
    } else p2.textContent = "";
    document.getElementById("mf-n3").textContent = T("mf.n.p3", { a: fmt(RES.ek.trap.log.length), b: fmt(RES.long.trap.log.length) });
    document.getElementById("mf-n4").textContent = T("mf.n.p4", { S: setName(GAS, GR), arcs: GR.cut.map(function (k) { return arcName(GAS, k); }).join(", "), c: fmt(GR.cap) });
  }

  var segBtns = document.querySelectorAll("#mf-seg button");
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      if (state.sc === b.getAttribute("data-sc")) return;
      state.sc = b.getAttribute("data-sc");
      segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      renderScenText(); renderSolution();
      if (A.reducedMotion) { player.seek(DUR); return; }
      if (player.time < CH[1]) player.refresh();
      else { player.seek(CH[1] + 0.001); player.play(); }
    });
  });

  function renderPage() {
    renderSeg(); renderScenText(); renderModel(); renderSolution(); renderNotes();
    hudKey = "";
    player.refresh();
  }
  I18N.onChange(renderPage);
})();
</script>
</body>
</html>
