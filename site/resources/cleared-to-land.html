<title>Cleared to Land</title>

<style>
  /* animation section */
  #anim-section .anim-legend i.tick { width: 2px; height: 11px; background: var(--mit-silver); }
  #anim-section .anim-legend i.line { height: 0; width: 16px; border-top: 2px solid var(--mit-bright); }
  #anim-section .anim-legend i.ring { background: none; border: 2px solid var(--accent); border-radius: 50%; width: 11px; height: 11px; }
  #anim-section .anim-legend i.hold { background: none; border: 1.5px dashed var(--mit-bright); border-radius: 50%; width: 11px; height: 11px; }
  #anim-section .chip-stat { min-width: 70px; }
  @media (max-width: 620px) {
    #anim-section .anim-hud { flex-wrap: nowrap; gap: 5px; top: 8px; left: 8px; width: calc(100% - 16px); max-width: calc(100% - 16px); }
    #anim-section .anim-hud .chip-stat { min-width: 0; flex: 1 1 0; padding: 4px 6px; font-size: 10px; line-height: 1.2; }
    #anim-section .anim-hud .chip-stat b { font-size: 15px; }
  }

  /* try your own order */
  .try-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin: 0 0 12px; }
  .try-intro { margin: 0 0 12px; color: var(--ink2); max-width: 78ch; font-size: 14.5px; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
  button.btn {
    font: 600 13.5px var(--font-sans); min-height: 36px; padding: 7px 12px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 2px;
  }
  button.btn:hover { background: var(--surface2); }
  button.btn.primary { background: var(--accent); color: var(--on-solid); border-color: var(--accent); }
  button.btn.primary:hover { filter: brightness(1.08); }
  .try-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .try-side { position: sticky; top: 70px; display: grid; gap: 12px; }
  @media (max-width: 860px) { .try-grid { grid-template-columns: minmax(0, 1fr); } .try-side { position: static; order: -1; } }

  .seq { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .seq li {
    display: grid; grid-template-columns: 22px 28px minmax(0, 1fr) auto auto; gap: 2px 8px; align-items: center;
    padding: 4px 6px 4px 8px; border: 1px solid var(--border); border-left: 3px solid var(--border);
    border-radius: 2px; background: var(--surface); font-size: 13.5px;
  }
  .seq li.moved { border-left-color: var(--accent); }
  .seq li.late { background: var(--sel); }
  .seq .pos { font-family: var(--font-mono); font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .seq .gl { display: flex; justify-content: center; }
  .seq .gl svg { display: block; fill: var(--ink); }
  .seq .who b { font-family: var(--font-mono); font-size: 13px; font-weight: 600; }
  .seq .who .tag { font-size: 12px; color: var(--muted); margin-left: 6px; white-space: nowrap; }
  .seq .tm { display: block; font-size: 12px; color: var(--ink2); font-variant-numeric: tabular-nums; }
  .seq .tm .late-msg { color: var(--crit); font-weight: 600; }
  .seq .dl { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; text-align: right; min-width: 52px; font-variant-numeric: tabular-nums; }
  .seq .dl.pos0 { color: var(--muted); font-weight: 400; }
  .seq .dl.neg { color: var(--crit); }
  .seq .mv { display: inline-flex; gap: 4px; }
  .seq .mv button {
    width: 36px; height: 34px; font: 700 13px var(--font-sans); cursor: pointer; border-radius: 2px;
    border: 1px solid var(--border); background: var(--surface2); color: var(--ink);
  }
  .seq .mv button:hover:not(:disabled) { background: var(--sel); border-color: var(--accent); }
  .seq .mv button:disabled { opacity: 0.35; cursor: default; }

  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .tiles .stat { padding: 10px 11px; }
  .tiles .stat .v { font-size: 24px; }
  .tiles .stat.you .v { color: var(--ink); }
  .tiles .stat.opt .v { color: var(--accent-text); }
  .tiles .stat .l { font-size: 12.5px; }
  .verdict { padding: 10px 12px; border-radius: 3px; border: 1px solid var(--border); background: var(--surface2); font-size: 14px; color: var(--ink2); }
  .verdict b { color: var(--ink); }
  .verdict.best { border-color: var(--accent); }
  .verdict.bad { border-color: var(--crit); }
  .flips { font-size: 13px; color: var(--ink2); margin: 0; }
  .flips b { color: var(--accent-text); font-variant-numeric: tabular-nums; }
  .gantt { display: block; width: 100%; height: auto; }
  .glegend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink2); }
  .glegend span { display: inline-flex; align-items: center; gap: 6px; }
  .glegend i { width: 10px; height: 10px; display: inline-block; }
  .glegend i.line { height: 0; width: 14px; border-top: 2px solid var(--mit-bright); }

  @media (max-width: 560px) {
    .seq li { grid-template-columns: 18px 22px minmax(0, 1fr) auto; padding: 4px 4px 4px 6px; gap: 2px 6px; }
    .seq .dl { grid-column: 3; grid-row: 2; text-align: left; min-width: 0; }
    .seq .mv { grid-column: 4; grid-row: 1 / span 2; }
    .seq .who .tag { margin-left: 4px; }
    .tiles .stat .v { font-size: 20px; }
  }

  /* model section */
  .vars { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); margin: 6px 0 10px; }
  .vars li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .type {
    display: inline-block; font: 600 10.5px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase;
    padding: 1px 6px; border-radius: 2px; border: 1px solid currentColor;
  }
  .type.bin { color: var(--accent-text); }
  .type.cont { color: var(--ink2); }
  .sepwrap table.data { min-width: 0; width: auto; }
  .sepwrap td, .sepwrap th { text-align: center; }
  .sepwrap td:first-child, .sepwrap th:first-child { text-align: left; }
  .sepwrap caption { caption-side: top; text-align: left; font-size: 12.5px; color: var(--muted); padding-bottom: 4px; }
  details .body ul { margin: 0 0 9px; padding-left: 20px; }
  details .body li { margin-bottom: 5px; }
</style>

  var SEP = DATA.sep, WT = DATA.w, DMAX = DATA.dmax;

  /* shared: the landing time of every flight for a given order (earliest time that respects the
     target and the gap to every flight already landed) */
  function schedule(fl, order) {
    var t = new Array(fl.length), done = [], cost = 0, late = 0;

    // the embedded schedules must match what the page computes

      }

      // chapter 4: the sequence reorders (first come order to the model's order)
      var ra = ease.out(seg(t, T4 + 0.2, T4 + 0.8)) * (1 - seg(t, T2a - 0.7, T2a));
      if (ra > 0) {
        var mu = ease.inOut(seg(t, T4 + 1.1, T4 + 2.9));
        var gx0 = x0 + 14, gx1 = x1 - 14, gap = (gx1 - gx0) / Math.max(1, n - 1);
        ctx.fillStyle = c.surface; ctx.globalAlpha = ra;
        ctx.fillRect(x0 - 4, G.rowB - (G.wide ? 28 : 18), x1 - x0 + 8, G.wide ? 50 : 40); ctx.globalAlpha = 1;
        for (var k3 = 0; k3 < n; k3++) {
          var i3 = S.fcfs.order[k3], f3 = fl[i3], pf = S.posF[i3], po = S.posO[i3];
          var xa = gx0 + pf * gap, xb = gx0 + po * gap, mv = S.moved[i3];
          var xx3 = lerp(xa, xb, mu), yy3 = G.rowB - (mv ? Math.sin(Math.PI * mu) * (po < pf ? 16 : -12) : 0);
          plane(xx3, yy3, 0, G.ps * 0.85 * CATM[f3.c], mv ? c.accent : c.ink2, ra);
          if (mv && mu > 0) {
            ctx.strokeStyle = c.accent; ctx.lineWidth = 1.5; ctx.globalAlpha = ra * Math.min(1, mu * 2);
            circle(xx3, yy3, G.ps * 0.85 * CATM[f3.c] + 4); ctx.stroke(); ctx.globalAlpha = 1;
          }
          text(tr("land.cat." + f3.c + ".s"), xx3, yy3 - G.ps * 1.3 - 5, "center", mv ? c["accent-text"] : c.ink2, ra, F(700, fsz - 2), false);
        }
      }
    }
    function simC(t, which) {
      if (which === 0) return t < T1a ? c0 : t < T4 ? lerp(c0, c1, seg(t, T1a, T1b)) : c1;
      return t < T2a ? c0 : lerp(c0, c1, seg(t, T2a, T2b));
    }

    /* ---- chapter 3: the separation matrix ---- */
    function drawMatrix(t) {
      var u = ease.out(seg(t, T3 + 0.4, T3 + 1.4)) * (1 - ease.inOut(seg(t, T4 - 1.2, T4 - 0.3)));
      if (u <= 0) return;
      var c = col.c, cats = ["H", "M", "L"], wide = G.wide;
      var cw = wide ? 72 : 60, lw = wide ? 90 : 74, rh = wide ? 26 : 22;
      var W = lw + cw * 3, H = rh * 4 + (wide ? 38 : 32);
      var px = (G.w - W) / 2, py = G.mapTop + (G.mapBot - G.mapTop - H) / 2;
      ctx.save();
      ctx.globalAlpha = u; ctx.translate(0, (1 - u) * 10);
      ctx.fillStyle = c.surface; ctx.fillRect(px - 12, py - 10, W + 24, H + 16);
      ctx.strokeStyle = c.border; ctx.lineWidth = 1; ctx.strokeRect(px - 12.5, py - 10.5, W + 25, H + 17);
      ctx.restore();
      var a = u, fs = G.fs;
      text(tr(P + "m.title"), px, py + 6, "left", c.ink, a, F(700, fs + 1), false);
      var y0 = py + (wide ? 30 : 26);
      text(tr(P + "m.corner"), px, y0 + rh / 2, "left", c.muted, a, F(600, fs - 1), false);
      cats.forEach(function (cf, j) {
        text(tr("land.cat." + cf), px + lw + cw * j + cw / 2, y0 + rh / 2, "center", c.muted, a, F(600, fs - 1), false);
      });
      cats.forEach(function (cl, i) {
        var yy = y0 + rh * (i + 1);
        ctx.strokeStyle = c.grid; ctx.globalAlpha = a; ctx.beginPath(); ctx.moveTo(px, yy); ctx.lineTo(px + W, yy); ctx.stroke(); ctx.globalAlpha = 1;
        text(tr("land.cat." + cl), px, yy + rh / 2, "left", c.ink2, a, F(600, fs), false);
        cats.forEach(function (cf, j) {
          var cx = px + lw + cw * j, on = PAIR && S.fl[PAIR.l].c === cl && S.fl[PAIR.f].c === cf;
          var pop = seg(t, T3 + 0.8 + (i * 3 + j) * 0.08, T3 + 1.2 + (i * 3 + j) * 0.08);
          if (on) {
            var hu = ease.out(seg(t, T3 + 2, T3 + 2.6));
            ctx.fillStyle = c.accent; ctx.globalAlpha = a * hu;
            ctx.fillRect(cx + 6, yy + 3, cw - 12, rh - 6); ctx.globalAlpha = 1;
            text(fmt(SEP[cl][cf]), cx + cw / 2, yy + rh / 2, "center", hu > 0.5 ? c["on-solid"] : c.ink, a * pop, F(700, fs + 1), false);
          } else {
            text(fmt(SEP[cl][cf]), cx + cw / 2, yy + rh / 2, "center", c.ink, a * pop, F(600, fs + 1), false);
          }
        });
      });
    }

    /* ---- chapter 5: the tally ---- */
    function drawTally(t) {
      var u = ease.out(seg(t, T5 + 0.4, T5 + 1.4));
      if (u <= 0) return;
      var c = col.c, p = G.panel, wide = G.wide, fs = G.fs;
      var W = p.w, H = Math.min(p.h, wide ? 196 : 176), px = p.x, py = p.y + (p.h - H) / 2;
      ctx.save();
      ctx.globalAlpha = u; ctx.translate(0, (1 - u) * 12);
      ctx.fillStyle = c.surface; ctx.fillRect(px, py, W, H);
      ctx.strokeStyle = c.border; ctx.lineWidth = 1; ctx.strokeRect(px + 0.5, py + 0.5, W - 1, H - 1);
      ctx.fillStyle = c.accent; ctx.fillRect(px, py, 3, H);
      ctx.restore();
      var ix = px + 16, iw = W - 32, y = py + (wide ? 20 : 16);
      text(tr(P + "tl.title"), ix, y, "left", c.muted, u, F(600, fs), false);
      var mx = S.fcfs.cost;
      [[S.fcfs.cost, "tl.fcfs", c["mit-silver"], c.ink2], [S.opt.cost, "tl.opt", c.accent, c["accent-text"]]].forEach(function (b, k) {
        var g = ease.out(seg(t, T5 + 1 + k * 0.5, T5 + 2.6 + k * 0.5));
        var yy = y + (wide ? 24 : 20) + k * (wide ? 42 : 36);
        text(tr(P + b[1]), ix, yy, "left", c.ink, u, F(k ? 700 : 600, fs), false);
        text(fmt(Math.round(b[0] * g)), ix + iw, yy, "right", b[3], u, F(700, fs + 3), false);
        ctx.globalAlpha = u; ctx.fillStyle = c.grid; ctx.fillRect(ix, yy + 10, iw, wide ? 9 : 7);
        ctx.fillStyle = b[2]; ctx.fillRect(ix, yy + 10, iw * (b[0] / mx) * g, wide ? 9 : 7); ctx.globalAlpha = 1;
      });
      var pa = ease.back(seg(t, T5 + 3, T5 + 3.8)), pc = saved(S);
      var yb = y + (wide ? 24 : 20) + 2 * (wide ? 42 : 36) + (wide ? 20 : 16);
      if (pa > 0) {
        ctx.save();
        ctx.translate(ix, yb); ctx.scale(Math.max(0.01, pa), Math.max(0.01, pa));
        text(tr(P + "tl.pct", { p: fmt(Math.round(pc * seg(t, T5 + 3, T5 + 4))) }), 0, 0, "left", c["accent-text"], Math.min(1, u * pa), F(700, wide ? 30 : 24), false);
        ctx.restore();
        ctx.font = F(700, wide ? 30 : 24);
        var pw = ctx.measureText(tr(P + "tl.pct", { p: fmt(pc) })).width;
        text(tr(P + "tl.saved"), ix + pw + 10, yb + 1, "left", c.ink2, seg(t, T5 + 3.6, T5 + 4.2) * u, F(600, fs), false);
      }
    }

    /* ---- the frame ---- */
    function render(t) {
      palette();
      var c = col.c, w = cv.w, h = cv.h, n = S.n;
      ctx.clearRect(0, 0, w, h);
      ctx.lineCap = "butt"; ctx.lineJoin = "round"; ctx.setLineDash([]);
      // separator between map and strip
      ctx.strokeStyle = c.grid; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, G.stripTop - 0.5); ctx.lineTo(w, G.stripTop - 0.5); ctx.stroke();
      var dim = 1 - 0.8 * ease.inOut(seg(t, T3, T3 + 0.8)) * (1 - ease.inOut(seg(t, T4 - 0.8, T4))) - 0.8 * ease.inOut(seg(t, T5, T5 + 0.8));
      drawMap(t, Math.max(0.12, dim));
      drawStrip(t);
      drawMatrix(t);
      drawTally(t);

      /* counters */
      var stag = Math.min(0.24, 3.4 / n);
      if (t < T1a - 0.6) {
        var shown = 0;
        for (var k = 0; k < n; k++) if (t >= 1.3 + k * stag) shown++;
        setChip(0, fmt(shown), tr(P + "k.flights"), ease.out(seg(t, 1.1, 1.6)), false);
        setChip(1, fmt(n * (n - 1)), tr(P + "k.bin"), ease.out(seg(t, 4.6, 5.1)), true);
        setChip(2, fmt(2 * n), tr(P + "k.cont"), ease.out(seg(t, 5.4, 5.9)), false);
        setChip(3, "", "", 0, false);
      } else if (t < T4) {
        setChip(0, fmt(n), tr(P + "k.flights"), 1, false);
        setChip(1, fmt(Math.round(accrued(S.fcfs, simC(t, 0)))), tr(P + "k.fcfs"), ease.out(seg(t, T1a - 0.6, T1a)), false);
        setChip(2, "", "", 0, false);
        setChip(3, "", "", 0, false);
      } else {
        setChip(0, fmt(n), tr(P + "k.flights"), 1, false);
        setChip(1, fmt(S.fcfs.cost), tr(P + "k.fcfs"), 1, false);
        setChip(2, fmt(Math.round(accrued(S.opt, simC(t, 1)))), tr(P + "k.opt"), ease.out(seg(t, T4 + 0.2, T4 + 0.8)), true);
        setChip(3, tr(P + "k.pct", { p: fmt(saved(S)) }), tr(P + "k.saved"), ease.out(seg(t, T2b, T2b + 0.6)), true);
      }
    }

    prepare();
    layout();
    var player = A.create({
      root: root,
      duration: DUR,
      chapters: [
        { t: 0, key: P + "ch1" }, { t: T1a - 0.6, key: P + "ch2" }, { t: T3, key: P + "ch3" },
        { t: T4, key: P + "ch4" }, { t: T5, key: P + "ch5" }
      ],
      onResize: function () { cv.fit(); layout(); },
      render: render
    });
    listeners.push(function () {
      prepare();
      layout();
      if (A.reducedMotion) { player.refresh(); return; }
      if (player.time > T1a - 0.6) { player.seek(T1a - 0.6); player.play(); } else player.refresh();
    });
  })();

  /* =====================================================================================
     "Try your own order"
     ===================================================================================== */
  var seqEl = document.getElementById("land-seq");
  var order = [];
  var PLANE_PATH = "M10 0 L6.2 -1.3 L1.2 -1.3 L-2.2 -9 L-4 -9 L-2 -1.3 L-6.6 -1.3 L-8.6 -4.4 L-10 -4.4 L-9 0 L-10 4.4 L-8.6 4.4 L-6.6 1.3 L-2 1.3 L-4 9 L-2.2 9 L1.2 1.3 L6.2 1.3 Z";
  var GSZ = { H: 22, M: 17, L: 12 };
  function resetOrder() { order = SCEN[state.scen].fcfs.order.slice(); }
  function move(k, d, focusDir) {
    var j = k + d;
    if (j < 0 || j >= order.length) return;
    var x = order[k]; order[k] = order[j]; order[j] = x;
    renderTry();
    var li = seqEl.children[j];
    if (li) {
      var b = li.querySelector(focusDir < 0 ? "button.up" : "button.down");
      if (b && b.disabled) b = li.querySelector(focusDir < 0 ? "button.down" : "button.up");
      if (b) b.focus();
    }
  }
  function renderTry() {
    var S = SCEN[state.scen], fl = S.fl, sch = schedule(fl, order), moved = movedSet(order, S.posF);
    // list
    seqEl.innerHTML = "";
    order.forEach(function (i, k) {
      var f = fl[i], ti = sch.t[i], d = ti - f.T, late = d > DMAX;
      var li = document.createElement("li");
      if (moved[i]) li.classList.add("moved");
      if (late) li.classList.add("late");
      var sz = GSZ[f.c];
      li.innerHTML =
        '<span class="pos"></span>' +
        '<span class="gl" aria-hidden="true"><svg width="' + sz + '" height="' + sz + '" viewBox="-10 -10 20 20"><path d="' + PLANE_PATH + '"/></svg></span>' +
        '<span class="who"><b></b><span class="tag"></span><span class="tm"></span></span>' +
        '<span class="dl"></span>' +
        '<span class="mv"><button type="button" class="up">▲</button><button type="button" class="down">▼</button></span>';
      li.querySelector(".pos").textContent = k + 1;
      li.querySelector(".who b").textContent = f.id;
      li.querySelector(".tag").textContent = tr("land.try.tag", { c: tr("land.cat." + f.c), w: fmt(WT[f.c]) });
      var tm = li.querySelector(".tm");
      tm.textContent = tr("land.try.times", { a: clock(f.T), b: clock(ti) });
      if (late) {
        var sp = document.createElement("span");
        sp.className = "late-msg";
        sp.textContent = " " + tr("land.try.late", { t: clock(f.T + DMAX) });
        tm.appendChild(sp);
      }
      var dl = li.querySelector(".dl");
      dl.textContent = d > 0 ? tr("land.try.delay", { d: fmt(d), wd: fmt(WT[f.c] * d) }) : tr("land.try.ontime");
      dl.className = "dl" + (d > 0 ? " neg" : " pos0");
      var up = li.querySelector(".up"), dn = li.querySelector(".down");
      up.disabled = k === 0; dn.disabled = k === order.length - 1;
      up.setAttribute("aria-label", tr("land.try.up", { code: f.id }));
      dn.setAttribute("aria-label", tr("land.try.down", { code: f.id }));
      up.title = up.getAttribute("aria-label"); dn.title = dn.getAttribute("aria-label");
      up.addEventListener("click", function () { move(k, -1, -1); });
      dn.addEventListener("click", function () { move(k, 1, 1); });
      seqEl.appendChild(li);
    });
    // numbers
    document.getElementById("land-v-you").textContent = fmt(sch.cost);
    document.getElementById("land-v-fcfs").textContent = fmt(S.fcfs.cost);
    document.getElementById("land-v-opt").textContent = fmt(S.opt.cost);
    var v = document.getElementById("land-verdict"), msg, cls = "";
    var isF = order.every(function (i, k) { return i === S.fcfs.order[k]; });
    if (sch.late) { msg = tr(sch.late === 1 ? "land.try.msg.late1" : "land.try.msg.lateN", { n: fmt(sch.late), m: fmt(DMAX) }); cls = "bad"; }
    else if (sch.cost === S.opt.cost) { msg = tr("land.try.msg.opt"); cls = "best"; }
    else if (isF) msg = tr("land.try.msg.fcfs");
    else if (sch.cost < S.fcfs.cost) msg = tr("land.try.msg.better", { p: fmt(Math.round(100 * (1 - sch.cost / S.fcfs.cost))), g: fmt(sch.cost - S.opt.cost) });
    else if (sch.cost === S.fcfs.cost) msg = tr("land.try.msg.same");
    else { msg = tr("land.try.msg.worse", { g: fmt(sch.cost - S.fcfs.cost) }); cls = "bad"; }
    v.innerHTML = msg;
    v.className = "verdict " + cls;
    // pair decisions that differ from first come
    var pos = {}, flips = 0, n = fl.length;
    order.forEach(function (i, k) { pos[i] = k; });
    for (var a = 0; a < n; a++) for (var b = a + 1; b < n; b++) if ((pos[a] < pos[b]) !== (S.posF[a] < S.posF[b])) flips++;
    document.getElementById("land-flips").innerHTML = tr("land.try.flips", { k: fmt(flips), m: fmt(n * (n - 1) / 2), b: fmt(n * (n - 1)) });
    drawGantt(S, sch);
  }
  function drawGantt(S, sch) {
    var svg = document.getElementById("land-gantt");
    var W = Math.max(280, Math.round(svg.getBoundingClientRect().width || 440));
    var fl = S.fl, lo = 1e9, hi = -1e9;
    fl.forEach(function (f, i) { lo = Math.min(lo, f.T); hi = Math.max(hi, sch.t[i], S.fcfs.t[i], S.opt.t[i]); });
    lo -= 1; hi += 2;
    var lab = W < 380 ? 64 : 84, x0 = lab + 6, x1 = W - 10, rowH = 34, top = 8, H = top + rowH * 3 + 26;
    function X(m) { return x0 + (m - lo) / (hi - lo) * (x1 - x0); }
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("aria-label", tr("land.try.g.aria"));
    var out = [];
    var rows = [[sch, "land.try.g.you", "var(--ink)"], [S.fcfs, "land.try.g.fcfs", "var(--mit-silver)"], [S.opt, "land.try.g.opt", "var(--accent)"]];
    rows.forEach(function (r, ri) {
      var y = top + rowH * ri + rowH / 2;
      out.push('<text x="0" y="' + (y + 4) + '" font-size="12" font-weight="600" fill="var(--ink2)">' + esc(tr(r[1])) + '</text>');
      out.push('<line x1="' + x0 + '" x2="' + x1 + '" y1="' + y + '" y2="' + y + '" stroke="var(--grid)"/>');
      fl.forEach(function (f, i) {
        var ti = r[0].t[i], d = ti - f.T;
        if (d > 0) out.push('<line x1="' + X(f.T).toFixed(1) + '" x2="' + X(ti).toFixed(1) + '" y1="' + (y + 9 + (i % 3) * 3) + '" y2="' + (y + 9 + (i % 3) * 3) + '" stroke="var(--mit-bright)" stroke-width="1.8"/>');
        var s = GSZ[f.c] / 20 * 0.75;
        out.push('<path d="' + PLANE_PATH + '" transform="translate(' + X(ti).toFixed(1) + ' ' + y + ') scale(' + s.toFixed(3) + ')" fill="' + r[2] + '"/>');
      });
      out.push('<text x="' + x1 + '" y="' + (y - 9) + '" font-size="11" text-anchor="end" font-weight="700" fill="' + (ri === 2 ? "var(--accent-text)" : "var(--ink2)") + '">' + esc(fmt(r[0].cost)) + '</text>');
    });
    var ay = top + rowH * 3 + 4;
    out.push('<line x1="' + x0 + '" x2="' + x1 + '" y1="' + ay + '" y2="' + ay + '" stroke="var(--axis)"/>');
    var step = (x1 - x0) / (hi - lo) * 5 > 44 ? 5 : 10;
    for (var m = Math.ceil(lo / step) * step; m <= hi; m += step) {
      out.push('<line x1="' + X(m) + '" x2="' + X(m) + '" y1="' + ay + '" y2="' + (ay + 4) + '" stroke="var(--axis)"/>');
      out.push('<text x="' + X(m) + '" y="' + (ay + 16) + '" font-size="10.5" text-anchor="middle" fill="var(--muted)" font-family="var(--font-mono)">' + clock(m) + '</text>');
    }
    svg.innerHTML = out.join("");
  }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  document.getElementById("land-reset").addEventListener("click", function () { resetOrder(); renderTry(); });
  document.getElementById("land-best").addEventListener("click", function () { order = SCEN[state.scen].opt.order.slice(); renderTry(); });
  listeners.push(function () { resetOrder(); renderTry(); });
  var rz = 0;
  window.addEventListener("resize", function () { clearTimeout(rz); rz = setTimeout(renderTry, 120); });
  resetOrder();
  I18N.onChange(renderTry);
})();
</script>
