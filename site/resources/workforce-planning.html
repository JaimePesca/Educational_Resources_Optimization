<script>
/* Problem 12 (CSL): hire trainees month by month so that 160 y_t - 50 x_t covers the repair hours,
   with y_{t+1} = (1 - attrition) y_t + x_t and y_1 = 50. Every number shown comes from LP.solve. */
(function () {
  "use strict";
  var t = I18N.t;
  var fmt = function (v, d, m) { return I18N.fmt(Math.abs(v) < 5e-7 ? 0 : v, d == null ? 2 : d, m); };
  var money = function (v, d) { return t("wfp.money", { v: fmt(v, d == null ? 0 : d) }); };

  /* ---------------- data and model ---------------- */
  var D = [6000, 7000, 8000, 9500, 11000];
  var N = 5, HOURS = 160, SUP = 50, PAY_E = 2000, PAY_T = 1000, Y1 = 50;

  // variables: x_1..x_5 (trainees hired in month t), then y_1..y_5 (experienced in month t)
  function solve(att) {
    var nv = 2 * N, rows = [], i;
    var row = function () { var a = []; for (var k = 0; k < nv; k++) a.push(0); return a; };
    var a0 = row(); a0[N] = 1; rows.push({ a: a0, op: "=", b: Y1, name: "start" });
    for (i = 0; i < N - 1; i++) {
      var a = row(); a[N + i + 1] = 1; a[N + i] = -(1 - att); a[i] = -1;
      rows.push({ a: a, op: "=", b: 0, name: "bal" + (i + 1) });
    }
    for (i = 0; i < N; i++) {
      var h = row(); h[N + i] = HOURS; h[i] = -SUP;
      rows.push({ a: h, op: ">=", b: D[i], name: "hours" + (i + 1) });
    }
    var c = [];
    for (i = 0; i < N; i++) c.push(PAY_T);
    for (i = 0; i < N; i++) c.push(PAY_E);
    var r = LP.solve({ sense: "min", c: c, rows: rows });
    if (r.status !== "optimal") throw new Error("LP " + r.status);
    var P = { att: att, z: r.z, x: r.x.slice(0, N), y: r.x.slice(N), duals: r.duals.slice(N), month: [] };
    P.x = P.x.map(function (v) { return v < 1e-7 ? 0 : v; });
    var cum = 0;
    for (i = 0; i < N; i++) {
      var avail = HOURS * P.y[i], sup = SUP * P.x[i], cost = PAY_E * P.y[i] + PAY_T * P.x[i];
      cum += cost;
      P.month.push({ avail: avail, sup: sup, prod: avail - sup, slack: avail - sup - D[i], cost: cost, cum: cum,
        tight: Math.abs(avail - sup - D[i]) < 1e-4, leave: i < N - 1 ? att * P.y[i] : 0 });
    }
    // verify every constraint of the model before anything is drawn
    var ok = Math.abs(P.y[0] - Y1) < 1e-6 && Math.abs(cum - P.z) < 1e-4;
    for (i = 0; i < N; i++) {
      ok = ok && P.month[i].slack > -1e-5 && P.x[i] >= 0 && P.y[i] >= 0;
      if (i < N - 1) ok = ok && Math.abs(P.y[i + 1] - ((1 - att) * P.y[i] + P.x[i])) < 1e-6;
    }
    P.verified = ok;
    if (!ok) console.error("workforce plan failed verification", P);
    return P;
  }
  var SC = { "0.05": solve(0.05), "0.10": solve(0.10) };
  var BASE = SC["0.05"];

  // rounding the hires up to whole people: recompute the team and check every month is still covered
  function roundedUp(P) {
    var x = P.x.map(function (v) { return Math.ceil(v - 1e-7); }), y = [Y1], cost = 0, ok = true;
    for (var i = 0; i < N; i++) {
      if (i > 0) y.push((1 - P.att) * y[i - 1] + x[i - 1]);
      if (HOURS * y[i] - SUP * x[i] < D[i] - 1e-6) ok = false;
      cost += PAY_E * y[i] + PAY_T * x[i];
    }
    return { x: x, y: y, cost: cost, ok: ok };
  }
  window.__wfp = { SC: SC, roundedUp: roundedUp };

  /* ---------------- formulation and solution (DOM) ---------------- */
  function renderCons() {
    var ul = document.getElementById("wfp-clist");
    ul.textContent = "";
    [["obj", "min Σ (2000 yₜ + 1000 xₜ)"], ["start", "y₁ = 50"], ["bal", "yₜ₊₁ = 0.95 yₜ + xₜ"],
      ["hours", "160 yₜ − 50 xₜ ≥ dₜ"], ["nn", "xₜ, yₜ ≥ 0"]].forEach(function (c) {
      var li = document.createElement("li");
      var head = document.createElement("span"); head.className = "cname";
      head.textContent = t("wfp.c." + c[0]) + " ";
      var eq = document.createElement("span"); eq.className = "ceq"; eq.textContent = c[1];
      head.appendChild(eq);
      var tx = document.createElement("span"); tx.className = "ctext"; tx.innerHTML = t("wfp.c." + c[0] + ".why");
      li.append(head, tx);
      ul.appendChild(li);
    });
  }

  function renderSolution() {
    var P = BASE, tb = document.getElementById("wfp-tbody");
    document.getElementById("wfp-soltitle").textContent = t("wfp.sol.title", { z: money(P.z) });
    tb.textContent = "";
    var sx = 0, sy = 0;
    P.month.forEach(function (m, i) {
      sx += P.x[i]; sy += P.y[i];
      var tr = document.createElement("tr");
      var cells = [
        [t("wfp.m." + (i + 1)), ""], [fmt(D[i], 0), ""], [fmt(P.y[i]), ""], [fmt(P.x[i]), "dec"],
        [fmt(m.sup, 1), ""], [fmt(m.prod, 1), m.tight ? "tight" : ""],
        [m.tight ? "0" : fmt(m.slack, 1), m.tight ? "tight" : ""], [money(m.cost), ""]
      ];
      cells.forEach(function (c) {
        var td = document.createElement("td"); td.textContent = c[0]; if (c[1]) td.className = c[1]; tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    var tot = document.createElement("tr"); tot.className = "tot";
    [t("wfp.sol.total"), "", fmt(sy), fmt(sx), "", "", "", money(P.z)].forEach(function (c, j) {
      var td = document.createElement("td"); td.textContent = c; if (j === 3) td.className = "dec"; tot.appendChild(td);
    });
    tb.appendChild(tot);
    var tight = P.month.map(function (m, i) { return m.tight ? t("wfp.m." + (i + 1)) : null; }).filter(Boolean);
    document.getElementById("wfp-solnote").textContent = t("wfp.sol.note", {
      z: money(P.z, 2), tight: tight.join(", ")
    });
  }

  function renderNotes() {
    var P = BASE, Q = SC["0.10"], R = roundedUp(P);
    var firstHire = P.x.findIndex(function (v) { return v > 1e-6; });

    if (a <= 0) return;
    var x0 = L.gx, y0 = L.bottom + 44, h = Math.min(92, L.H - y0 - 16), w = Math.min(L.bw, 420);
    if (h < 60) return;
    ctx.globalAlpha = a;
    ctx.strokeStyle = C.border; ctx.lineWidth = 1; ctx.strokeRect(x0 + 0.5, y0 + 0.5, w, h);
    var hs = Math.min(40, h * 0.5), cy = y0 + h * 0.42;
    var sx = x0 + 34, tx = x0 + w - 34;
    person(sx, cy, hs, C.ink, 1, a);
    person(tx, cy, hs, C.accent, 1, a);
    text(money(PAY_E), sx, y0 + h - 10, C.ink2, 12, 600, "center");
    text(money(PAY_T), tx, y0 + h - 10, C.accent, 12, 600, "center");
    // the 160 h bar with the 50 h of supervision hatched
    var bx0 = sx + 34, bx1 = tx - 34, bw = bx1 - bx0, by = cy - 7, bh = 14;
    var sup = SUP / HOURS, grow = E.out(seg(tt, 1.2, 2.4));
    ctx.fillStyle = C.ink2; ctx.globalAlpha = a * 0.85; ctx.fillRect(bx0, by, bw * (1 - sup) * grow, bh);
    var hg = seg(tt, 2.0, 2.8);
    ctx.globalAlpha = a * hg * 0.16; ctx.fillStyle = C.accent; ctx.fillRect(bx0 + bw * (1 - sup), by, bw * sup, bh);
    ctx.globalAlpha = a * hg; ctx.fillStyle = hatch; ctx.fillRect(bx0 + bw * (1 - sup), by, bw * sup, bh);
    ctx.strokeStyle = C.accent; ctx.lineWidth = 1; ctx.strokeRect(bx0 + bw * (1 - sup) + 0.5, by + 0.5, bw * sup - 1, bh - 1);
    ctx.globalAlpha = a;
    text(t("wfp.hours", { v: fmt(HOURS, 0) }), bx0, by - 7, C.ink2, 11.5, 600, "left");
    ctx.globalAlpha = a * hg;
    text(t("wfp.hours", { v: fmt(SUP, 0) }), bx0 + bw * (1 - sup / 2), by + bh + 15, C.accent, 11.5, 700, "center");
    dashedCurve([bx0 + bw * (1 - sup / 2), by], [tx - hs * 0.35, cy - hs * 0.05], 1, C.accent, a * hg, 12);
    ctx.globalAlpha = 1;
  }

  /* ---- chart: hours per month against demand ---- */
  function drawChart(tt) {
    var m = monthOf(tt), u = tt - m * MD, sum = tt >= CH[5], fs = L.fs, i;
    // grid
    ctx.lineWidth = 1;
    [0, 3000, 6000, 9000, 12000].forEach(function (v) {
      var y = Math.round(yS(v)) + 0.5;
      ctx.strokeStyle = v === 0 ? C.axis : C.grid; ctx.beginPath(); ctx.moveTo(L.cx0, y); ctx.lineTo(L.cx1, y); ctx.stroke();
      text(fmt(v, 0), L.cx0 - 6, y + 3.5, C.muted, fs - 1.5, 400, "right");
    });
    text(t("wfp.anim.lbl.hours"), L.cx0 - 6, yS(12000) - 10, C.muted, fs - 1.5, 600, "right");
    // current month band
    if (!sum) {
      var ba = E.out(seg(u, 0, 0.6));
      ctx.fillStyle = C.sel; ctx.globalAlpha = ba;
      ctx.fillRect(L.cx0 + m * L.colW + 1, L.cy0 - 6, L.colW - 2, L.cy1 - L.cy0 + 6);
      ctx.globalAlpha = 1;
    }
    var bw = Math.min(L.colW * 0.5, 54);
    for (i = 0; i < N; i++) {
      var x = colX(i), M = P.month[i], t0 = i * MD;
      var g = E.out(seg(tt, t0 + 3.3, t0 + 5.4));
      if (g > 0) {
        var h = M.avail * g, prod = Math.min(h, M.prod);
        // slack between demand and the productive hours
        if (g >= 1 && M.slack > 1) {
          ctx.fillStyle = C.region; ctx.globalAlpha = seg(tt, t0 + 5.4, t0 + 5.9);
          ctx.fillRect(x - bw / 2 - 4, yS(M.prod), bw + 8, yS(D[i]) - yS(M.prod));
          ctx.globalAlpha = 1;
        }
        ctx.fillStyle = C.ink2; ctx.globalAlpha = 0.9;
        ctx.fillRect(x - bw / 2, yS(prod), bw, L.cy1 - yS(prod));
        ctx.globalAlpha = 1;
        if (h > M.prod + 1e-6) {
          var y1 = yS(h), y0 = yS(M.prod);
          ctx.fillStyle = C.accent; ctx.globalAlpha = 0.16; ctx.fillRect(x - bw / 2, y1, bw, y0 - y1);
          ctx.globalAlpha = 1; ctx.fillStyle = hatch; ctx.fillRect(x - bw / 2, y1, bw, y0 - y1);
          ctx.strokeStyle = C.accent; ctx.lineWidth = 1; ctx.strokeRect(x - bw / 2 + 0.5, y1 + 0.5, bw - 1, y0 - y1 - 1);
        }
      }
      // demand: silver ghost for the months ahead, ink once the month starts, accent red where it binds
      var dy = Math.round(yS(D[i])) + 0.5, on = seg(tt, t0 + 2.8, t0 + 3.3), hit = M.tight ? seg(tt, t0 + 5.4, t0 + 5.8) : 0;
      ctx.save();
      ctx.setLineDash([5, 4]); ctx.lineWidth = 2;
      ctx.strokeStyle = C["mit-silver"]; ctx.globalAlpha = 0.7 * (1 - on);
      ctx.beginPath(); ctx.moveTo(x - L.colW * 0.42, dy); ctx.lineTo(x + L.colW * 0.42, dy); ctx.stroke();
      ctx.globalAlpha = on; ctx.strokeStyle = hit > 0.5 ? C.accent : C.ink; ctx.lineWidth = hit > 0.5 ? 2.6 : 2;
      ctx.beginPath(); ctx.moveTo(x - L.colW * 0.42, dy); ctx.lineTo(x + L.colW * 0.42, dy); ctx.stroke();
      ctx.restore();
      // binding pulse
      if (M.tight) {
        var pu = seg(tt, t0 + 5.4, t0 + 6.6);
        var pu2 = sum ? seg(tt, CH[5] + 1.6 + i * 0.35, CH[5] + 2.8 + i * 0.35) : 0;
        [pu, pu2].forEach(function (q) {
          if (q <= 0 || q >= 1) return;
          ctx.strokeStyle = C.accent; ctx.lineWidth = 2; ctx.globalAlpha = 1 - q;
          ctx.beginPath(); ctx.arc(x, dy, 4 + q * L.colW * 0.45, 0, Math.PI * 2); ctx.stroke();
          ctx.globalAlpha = 1;
        });
        if (hit > 0) { ctx.fillStyle = C.accent; ctx.globalAlpha = hit; ctx.beginPath(); ctx.arc(x, dy, 3.5, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
      }
      // demand value while its month plays
      var la = on * (sum ? 0 : (i === m ? 1 - seg(u, 7.6, 8.4) : 0));
      if (la > 0) {
        var ds = fmt(D[i], 0);
        ctx.font = "700 " + fs + "px " + FONT;
        var dw = ctx.measureText(ds).width;
        ctx.globalAlpha = la * 0.9; ctx.fillStyle = C.surface;
        ctx.fillRect(x - dw / 2 - 4, dy - 8 - fs, dw + 8, fs + 5);
        ctx.globalAlpha = la;
        text(ds, x, dy - 7, M.tight && hit > 0.5 ? C.accent : C.ink, fs, 700, "center");
        ctx.globalAlpha = 1;
      }
      // month label
      var cur = !sum && i === m;
      text(t("wfp.ms." + (i + 1)), x, L.cy1 + (L.portrait ? 14 : 17), cur ? C.ink : C.muted, fs, cur ? 700 : 600, "center");
    }
    // summary rows: experienced and trainees per month
    var ra = E.out(seg(tt, CH[5] + 0.6, CH[5] + 1.6));
    if (ra > 0) {
      var r1 = L.cy1 + (L.portrait ? 29 : 35), r2 = L.cy1 + (L.portrait ? 43 : 53), ih = L.portrait ? 11 : 14;
      person(L.cx0 - 12, r1 - ih * 0.3, ih, C.ink, 1, ra);
      person(L.cx0 - 12, r2 - ih * 0.3, ih, C.accent, 1, ra);
      for (i = 0; i < N; i++) {
        var a2 = ra * E.out(seg(tt, CH[5] + 0.6 + i * 0.12, CH[5] + 1.4 + i * 0.12));
        ctx.globalAlpha = a2;
        text(fmt(P.y[i]), colX(i), r1, C.ink, fs, 600, "center");
        text(P.x[i] > 0 ? "+" + fmt(P.x[i]) : "0", colX(i), r2, P.x[i] > 0 ? C.accent : C.muted, fs, 700, "center");
        ctx.globalAlpha = 1;
      }
    }
  }

  /* ---- hours flowing from the board into the month's bar ---- */
  function drawFlows(tt) {
    if (tt >= CH[5]) return;
    var m = monthOf(tt), u = tt - m * MD, mo = SIM.months[m], M = P.month[m];
    var x = colX(m), bw = Math.min(L.colW * 0.5, 54);
    mo.parts.forEach(function (pp) {
      var q = seg(u, pp.t0, pp.t0 + 0.95);
      if (q <= 0 || q >= 1) return;
      var a = slotXY(pp.slot);
      var tv = pp.sup ? M.prod + (M.sup) * (0.2 + 0.6 * pp.f) : M.prod * (0.15 + 0.8 * pp.f);
      var c = [x + (pp.f - 0.5) * bw * 0.6, yS(tv)];
      var b = [(a[0] + c[0]) / 2, Math.min(a[1], c[1]) - (L.portrait ? 30 : 70)];
      var col = pp.sup ? C.accent : C.ink2;
      for (var k = 0; k < 4; k++) {
        var uq = E.inOut(clamp(q - k * 0.035, 0, 1)), p = qpt(a, b, c, uq);
        ctx.globalAlpha = (k === 0 ? 0.9 : 0.35 - k * 0.07) * Math.min(1, q * 6) * Math.min(1, (1 - q) * 6);
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(p[0], p[1], k === 0 ? 2.6 : 2, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    });
  }

  /* ---- summary panel over the board ---- */
  function drawSummary(tt) {
    var a = E.out(seg(tt, CH[5] + 0.5, CH[5] + 1.5));
    if (a <= 0) return;
    var eCost = 0, tCost = 0;
    for (var i = 0; i < N; i++) { eCost += PAY_E * P.y[i]; tCost += PAY_T * P.x[i]; }
    var cx = L.gx + (GC + 1 + TC) * L.s / 2, cy = L.portrait ? L.gy + SIM.rows * L.s * 0.3 : L.gy + SIM.rows * L.s * 0.35;
    var big = L.portrait ? 30 : 46, fs = L.portrait ? 10.5 : 12.5, lf = L.portrait ? 11.5 : 14;
    var bw = Math.min((GC + 1 + TC) * L.s - 40, 420), x0 = cx - bw / 2, y0 = cy + (L.portrait ? 14 : 22), bh = L.portrait ? 12 : 16;
    // backing card so the numbers read cleanly over the faded board
    var pt = cy - big - 6 - lf - (L.portrait ? 10 : 16), pb = y0 + bh + 2 * fs + (L.portrait ? 18 : 24);
    ctx.globalAlpha = a * 0.94; ctx.fillStyle = C.surface;
    ctx.fillRect(x0 - 18, pt, bw + 36, pb - pt);
    ctx.globalAlpha = a; ctx.strokeStyle = C.border; ctx.lineWidth = 1;
    ctx.strokeRect(Math.round(x0 - 18) + 0.5, Math.round(pt) + 0.5, Math.round(bw + 36), Math.round(pb - pt));
    ctx.fillStyle = C.accent; ctx.fillRect(x0 - 18, pt, 3, pb - pt);
    text(t("wfp.anim.lbl.total"), cx, cy - big - 6, C.ink2, lf, 600, "center");
    text(money(P.z), cx, cy, C.accent, big, 700, "center");
    // split bar: experienced vs trainee salaries
    var g = E.inOut(seg(tt, CH[5] + 1.0, CH[5] + 2.6)), fe = eCost / P.z;
    ctx.fillStyle = C.ink2; ctx.fillRect(x0, y0, bw * fe * g, bh);
    ctx.fillStyle = C.accent; ctx.fillRect(x0 + bw * fe * g, y0, bw * (1 - fe) * g, bh);
    var la = seg(tt, CH[5] + 2.2, CH[5] + 3.0) * a;
    ctx.globalAlpha = la;
    text(t("wfp.anim.lbl.expPay"), x0, y0 + bh + fs + 5, C.ink2, fs, 600, "left");
    text(money(eCost), x0, y0 + bh + 2 * fs + 9, C.ink, fs + 1, 700, "left");
    text(t("wfp.anim.lbl.trPay"), x0 + bw, y0 + bh + fs + 5, C.accent, fs, 600, "right");
    text(money(tCost), x0 + bw, y0 + bh + 2 * fs + 9, C.accent, fs + 1, 700, "right");
    ctx.globalAlpha = 1;
  }

  /* ---- HUD counters ---- */
  var hudCache = {};
  function setText(id, s) { if (hudCache[id] !== s) { hudCache[id] = s; document.getElementById(id).textContent = s; } }
  function hud(tt) {
    var m = monthOf(tt), u = tt - m * MD, sum = tt >= CH[5], y, x;
    if (sum) y = P.y[N - 1];
    else if (m === 0) y = P.y[0] * E.out(seg(tt, 0.1, 1.4));
    else y = lerp(P.y[m - 1] - P.month[m - 1].leave, P.y[m], E.inOut(seg(u, 0.1, 1.5)));
    if (!sum && m < N - 1) y = lerp(y, P.y[m] - P.month[m].leave, E.inOut(seg(u, 6.3, 7.8)));
    setText("wfp-v1", fmt(y));
    setText("wfp-l1", t("wfp.anim.k.exp"));
    if (sum) {
      setText("wfp-v2", fmt(sum5(P.x)));
      setText("wfp-l2", t("wfp.anim.k.trTotal"));
    } else {
      x = P.x[m] * E.out(seg(u, 1.6, 3.0));
      if (m > 0 && u < 1.6) x = P.x[m - 1] * (1 - E.inOut(seg(u, 0.1, 1.5)));
      setText("wfp-v2", fmt(x));
      setText("wfp-l2", t("wfp.anim.k.tr"));
    }
    var cost = 0;
    for (var i = 0; i < N; i++) cost += P.month[i].cost * E.inOut(seg(tt, i * MD + 3.3, i * MD + 5.4));
    setText("wfp-v3", money(cost));
    setText("wfp-l3", t("wfp.anim.k.cost"));
  }
  function sum5(a) { return a.reduce(function (s, v) { return s + v; }, 0); }

  function render(tt) {
    tt = clamp(tt, 0, DUR); // the player can hand a tiny negative time on its first frame
    pal();
    ctx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
    ctx.clearRect(0, 0, cv.w, cv.h);
    ctx.fillStyle = C.surface; ctx.fillRect(0, 0, cv.w, cv.h);
    ctx.lineJoin = "round";
    drawChart(tt);
    drawBoard(tt);
    drawInset(tt);
    drawFlows(tt);
    drawSummary(tt);
    hud(tt);
  }

  layout();
  var player = A.create({
    root: document.getElementById("wfp-anim"),
    duration: DUR,
    chapters: CH.map(function (c, i) { return { t: c, key: "wfp.anim.ch" + (i + 1) }; }),
    onResize: function () { cv.fit(); layout(); },
    render: render
  });
  window.__wfpAnim = player;

  var segBtns = document.querySelectorAll("#wfp-seg button");
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      var key = b.getAttribute("data-att");
      state.att = +key;
      P = SC[key]; SIM = simulate(P); layout();
      segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      document.getElementById("wfp-lg-leave").textContent = t("wfp.anim.lg.leave", { p: fmt(state.att * 100, 0) });
      if (A.reducedMotion) { player.seek(DUR); return; }
      player.seek(0); player.play();
    });
  });

  function renderPage() {
    renderCons();
    renderSolution();
    renderNotes();
    renderMath();
  }
  I18N.onChange(renderPage);
})();
</script>
</body>
</html>
