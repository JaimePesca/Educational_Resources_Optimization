<script>
(function () {
  "use strict";
  var T = I18N.t;
  var fmt = function (v, d, m) { return I18N.fmt(v, d == null ? 2 : d, m); };
  var SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
  function sup(e) { return String(e).replace(/-/g, "⁻").replace(/\d/g, function (c) { return SUP[+c]; }); }
  function sci(x, d) {                           // m × 10^e with d decimals (rounding done by toExponential)
    d = d == null ? 1 : d;
    var p = Number(x).toExponential(d).split("e");
    return T("cx.sci", { m: fmt(+p[0], d, d), e: sup(+p[1]) });
  }
  function pow10(e) { return T("cx.pow", { e: sup(e) }); }
  function count(x, d) { x = Number(x); return x < 1e6 ? fmt(x, 0) : sci(x, d); }
  function km(v) { return T("cx.km", { v: fmt(v, 0) }); }
  function pct(v) { return T("cx.pct", { v: fmt(v, 1, 1) }); }

  /* ---------- time units ---------- */
  var YEAR = 365.25 * 86400, AGE = 13.8e9 * YEAR;     // 13.8 billion years, in seconds
  var UNITS = [["ps", 1e-12], ["ns", 1e-9], ["us", 1e-6], ["ms", 1e-3], ["s", 1], ["min", 60], ["h", 3600], ["d", 86400],

  function sig(v) { return fmt(v, v < 10 ? 2 : v < 100 ? 1 : 0); }
  function dur(sec, long) {                      // readable time; past the age of the universe, a short flag or the multiple
    if (sec > AGE) return long ? T("cx.u.ages", { v: sci(sec / AGE, 1) }) : T("cx.u.beyond");
    var u = UNITS[0];
    for (var i = 0; i < UNITS.length; i++) if (sec >= UNITS[i][1] * (1 - 1e-12)) u = UNITS[i];
    return T("cx.u." + u[0], { v: sig(sec / u[1]) });
  }

  /* ---------- exact operation counts (BigInt) and their continuous logs ---------- */
  var KEYS = ["sq", "cu", "ex", "fa"], NTOP = 60;

      KEYS.forEach(function (k) { OPS[k][n] = Number(OPSB[k][n]); });
    }
  })();
  function lnGamma(z) {                          // Stirling series after shifting z up to 7
    var acc = 0;

  /* ---------- the map ---------- */
  function proj(R) {
    var cl = Math.cos(6.5 * Math.PI / 180), lon0 = Infinity, lon1 = -Infinity, la0 = Infinity, la1 = -Infinity;
    CITY.forEach(function (c) { lon0 = Math.min(lon0, c[1]); lon1 = Math.max(lon1, c[1]); la0 = Math.min(la0, c[0]); la1 = Math.max(la1, c[0]); });

  function path(P, tour, closed) {
    ctx.beginPath();

    if (closed) ctx.closePath();

  function seg2(P, a, b, u) {                    // a partial edge from city a toward city b
    ctx.beginPath(); ctx.moveTo(P[a][0], P[a][1]); ctx.lineTo(lerp(P[a][0], P[b][0], u), lerp(P[a][1], P[b][1], u)); ctx.stroke();

  function drawMap(S, t) {
    var ma = E.out(seg(t, 24.6, 25.6));

    var R = mixRect(L.reg, L.mapF, E.inOut(seg(t, 46, 47.4)));

    ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
    for (var la = -10; la <= 24; la += 2) { var p0 = pr.g(la, -92), p1 = pr.g(la, -58); ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke(); }

    var ca = t < 34.2 ? 1 : 1 - seg(t, 34.2, 35);
    if (ca > 0.01) {
      for (i = 0; i < NC; i++) {
        var u = seg(t, EDGE0 + i * EDGEDT, EDGE0 + (i + 1) * EDGEDT - 0.08);
        if (u <= 0) break;
        ctx.globalAlpha = ma * ca; ctx.strokeStyle = C.accent; ctx.lineWidth = lw;
        seg2(P, CAND[i], CAND[(i + 1) % NC], E.inOut(u));
        if (u < 1) {
          var hx = lerp(P[CAND[i]][0], P[CAND[(i + 1) % NC]][0], E.inOut(u)), hy = lerp(P[CAND[i]][1], P[CAND[(i + 1) % NC]][1], E.inOut(u));
          ctx.fillStyle = HOT; circle(hx, hy, lw + 2); ctx.fill();
        }
      }
      var vp = seg(t, 32.6, 33.8);                 // verdict: the tour glows once
      if (vp > 0 && vp < 1) { ctx.globalAlpha = ma * ca * (1 - vp) * 0.3; ctx.strokeStyle = C.accent; ctx.lineWidth = lw + 12 * vp; path(P, CAND, true); ctx.stroke(); }
    }
    // chapter 4: every tour, the best one so far on top
    if (t >= EN0 - 0.2) {
      var cnt = done(t);
      if (t < EN1 + 0.3) for (var j = 5; j >= 0; j--) {
        var kk = done(t - j * 0.06) - 1;
        if (kk < 0) continue;

      }
      var b = bestAt(Math.max(1, cnt));

        ctx.globalAlpha = ma; ctx.strokeStyle = fresh > 0.5 && b !== OPT ? HOT : C.accent; ctx.lineWidth = lw;

      }
    }

        if (t < s0) break;

        if (ra > 0 && i < NC - 1) {                // look at every unvisited city, then take the closest
          ctx.globalAlpha = ma * ra * 0.7; ctx.strokeStyle = C["mit-silver"]; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
          for (var q = i + 1; q < NC; q++) { ctx.beginPath(); ctx.moveTo(P[from][0], P[from][1]); ctx.lineTo(P[NN[q]][0], P[NN[q]][1]); ctx.stroke(); }
          ctx.setLineDash([]);

        var eu = E.inOut(seg(t, s0 + 0.15, s0 + NNDT - 0.03));
        if (eu > 0) {
          ctx.globalAlpha = ma; ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.setLineDash([7, 5]); ctx.lineCap = "butt";

    }
    ctx.restore();
    // cities and names
    var fs = L.portrait ? 10.5 : 11.5;
    for (i = 0; i < NC; i++) {
      var pa = E.back(seg(t, 25.0 + 0.09 * i, 25.5 + 0.09 * i));
      if (pa <= 0) continue;
      var X = P[i][0], Y = P[i][1], r = (i === 0 ? 5.5 : 4.3) * pa;
      ctx.globalAlpha = ma; ctx.fillStyle = C.surface; circle(X, Y, r + 2); ctx.fill();
      ctx.fillStyle = C.ink; circle(X, Y, r); ctx.fill();
      if (i === 0) { ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; circle(X, Y, r + 4); ctx.stroke(); }
      var sd = SIDE[i], off = i === 0 ? 12 : 9, txt = T("cx.city." + i), la2 = ma * seg(t, 25.3 + 0.09 * i, 25.8 + 0.09 * i);
      if (sd === "r") label(txt, X + off, Y, "left", C.ink2, font(i === 0 ? 700 : 400, fs), la2);
      else if (sd === "l") label(txt, X - off, Y, "right", C.ink2, font(i === 0 ? 700 : 400, fs), la2);
      else label(txt, X, Y + off + fs / 2, "center", C.ink2, font(400, fs), la2);

    // chapter 3: each addition floats up from its edge
    for (i = 0; i < NC; i++) {

      if (fa <= 0.01) continue;
      var e0 = P[CAND[i]], e1 = P[CAND[(i + 1) % NC]];
      label(T("cx.plus", { v: fmt(CAND_E[i], 0) }), (e0[0] + e1[0]) / 2, (e0[1] + e1[1]) / 2 - 10 * seg(t, tc, tc + 1.4), "center",
        C.accent === C["mit-bright"] ? C.crit : HOT, font(700, fs + 1), ma * fa);

  /* ---------- caption ---------- */
  function captions(S, t) {

    if (t < CH[2]) {
      if (S.fast) return [T("cx.cap2.x1000"), T("cx.cap2.x1000.sub", { ex0: S.nm1.ex, ex: S.nm.ex, fa0: S.nm1.fa, fa: S.nm.fa })];
      return [T("cx.cap2.x1"), T("cx.cap2.x1.sub", { b: sci(S.B1, 1), ex: S.nm1.ex, fa: S.nm1.fa })];
    }
    if (t < CH[3]) return [T("cx.cap3"), T("cx.cap3.sub", { n: NC, L: km(LIMIT) })];
    if (t < CH[4]) return [T("cx.cap4"), T("cx.cap4.sub", { tours: fmt(TOURS, 0), n: NC })];
    return [T("cx.cap5"), T("cx.cap5.sub", { gap: pct(GAP) })];

    var ci = 0; CH.forEach(function (c, k) { if (t >= c) ci = k; });
    var a = ci === 0 ? seg(t, 0.4, 1.1) : seg(t, CH[ci] + 0.15, CH[ci] + 0.8);
    if (ci < CH.length - 1) a *= 1 - seg(t, CH[ci + 1] - 0.45, CH[ci + 1] - 0.05);
    if (t >= DUR - 1e-6) a = 1;

    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = C.accent; ctx.fillRect(x, y - L.ft + 2, 3, L.ft + 1);
    ctx.font = font(700, L.ft); ctx.fillStyle = C.ink; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";

    tl.forEach(function (s, k) { ctx.fillText(s, x + 10, y + k * (L.ft + 3), maxW); });
    y += (tl.length - 1) * (L.ft + 3) + L.fs + 6;

  /* ---------- HUD chips ---------- */

  });

    if (c.l !== lab) { c.s.textContent = lab; c.l = lab; }
    if (c.o !== op) { c.el.style.opacity = op; c.o = op; }
    if (c.k !== kind) {
      c.el.classList.toggle("accent", kind === "acc"); c.el.classList.toggle("bad", kind === "bad");

      var n = Math.floor(nRace(t) + 1e-9);
      setChip(0, fmt(n, 0), T("cx.k.n"), f * seg(t, 0.6, 1.1), "acc");
      setChip(1, pow10(9), T("cx.k.speed"), f * seg(t, 0.8, 1.3), "");

      setChip(2, T("cx.plus", { v: pct(GAP) }), T("cx.k.gap"), f * seg(t, 52.9, 53.4), "bad");
      setChip(3, fmt(NC, 0), T("cx.k.check"), f * seg(t, 53.3, 53.8), "");
      setChip(4, fmt(TOURS, 0), T("cx.k.search"), f * seg(t, 53.5, 54), "");

  /* ---------- the frame ---------- */
  function render(t) {

      st(T("cx.tsp.s.check"), T("cx.tsp.s.checkV", { n: NC }), T("cx.tsp.s.checkL", { v: km(tourLen(CAND)), L: km(LIMIT), t: dur(NC / S.v) }), true) +
      st(T("cx.tsp.s.tours"), fmt(TOURS, 0), T("cx.tsp.s.toursL", { n: NC }), true) +
      st(T("cx.tsp.s.opt"), km(OPT_LEN), T("cx.tsp.s.optL", { k: fmt(OPT.k + 1, 0), tours: fmt(TOURS, 0) })) +
      st(T("cx.tsp.s.nn"), km(NN_LEN), T("cx.tsp.s.nnL", { gap: pct(GAP) }), true);
    document.getElementById("cx-route-opt").innerHTML = T("cx.tsp.route.opt", { r: routeTxt(OPT_TOUR) });
    document.getElementById("cx-route-nn").innerHTML = T("cx.tsp.route.nn", { r: routeTxt(NN) });
    document.getElementById("cx-grow-title").textContent = T("cx.tsp.grow", { s: speedTxt(S) });
    var h = "<thead><tr><th class='num'>" + T("cx.tsp.c.n") + "</th><th class='num'>" + T("cx.tsp.c.tours") + "</th><th class='num'>" +
      T("cx.tsp.c.adds") + "</th><th class='num'>" + T("cx.tsp.c.time") + "</th></tr></thead><tbody>";
    [5, 10, 15, 20, 25, 30].forEach(function (m) {
      var sec = Number(enumOps(m)) / S.v;
      h += "<tr" + (m === NC ? " class='on'" : "") + "><td class='num'>" + m + "</td><td class='num'>" + count(toursOf(m), 2) + "</td><td class='num'>" +
        count(enumOps(m), 2) + "</td><td class='num" + (sec > AGE ? " far" : "") + "'>" + dur(sec, true) + "</td></tr>";
    });
    document.getElementById("cx-grow").innerHTML = h + "</tbody>";
    var d = "<thead><tr><th></th>";
    for (var i = 0; i < NC; i++) d += "<th class='num'>" + T("cx.city." + i) + "</th>";
    d += "</tr></thead><tbody>";
    for (i = 0; i < NC; i++) {
      d += "<tr><th>" + T("cx.city." + i) + "</th>";
      for (var j = 0; j < NC; j++) d += "<td class='num" + (i === j ? " self" : "") + "'>" + fmt(DIST[i][j], 0) + "</td>";
      d += "</tr>";
    }
    document.getElementById("cx-dist").innerHTML = d + "</tbody>";
  }
  function renderNotes() {
    var S0 = scen("x1"), S1 = scen("x1000"), v = {};
    KEYS.forEach(function (k) { v[k + "0"] = fmt(S0.nm[k], 0); v[k] = fmt(S1.nm[k], 0); });
    document.getElementById("cx-n1").textContent = T("cx.n.p1", {
      sq: dur(OPS.sq[50] / 1e9), cu: dur(OPS.cu[50] / 1e9), ex: dur(OPS.ex[50] / 1e9), fa: dur(OPS.fa[50] / 1e9, true) });
    document.getElementById("cx-n2").textContent = T("cx.n.p2", v);
    document.getElementById("cx-n3").textContent = T("cx.n.p3", {
      opt: km(OPT_LEN), L: km(LIMIT), n: NC, tours: fmt(TOURS, 0), adds: fmt(Number(enumOps(NC)), 0),
      t20: sci(Number(toursOf(20)), 2), time20: dur(Number(enumOps(20)) / 1e9, true) });
    document.getElementById("cx-n4").textContent = T("cx.n.p4", { looks: NN_LOOKS, nn: km(NN_LEN), gap: pct(GAP), opt: km(OPT_LEN) });
  }

  var segBtns = document.querySelectorAll("#cx-seg button");
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      if (state.sc === b.getAttribute("data-sc")) return;
      state.sc = b.getAttribute("data-sc");
      segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      renderScenText(); renderRace(); renderHour(); renderTsp();
      if (A.reducedMotion) { player.seek(DUR); return; }
      if (player.time < CH[1]) player.refresh();
      else { player.seek(CH[1] + 0.001); player.play(); }
    });
  });

  function renderPage() {
    renderSeg(); renderScenText(); renderModel(); renderRace(); renderHour(); renderTsp(); renderNotes();
    hudKey = "";
    player.refresh();
  }
  I18N.onChange(renderPage);
})();
</script>
</body>
</html>
