<style>
  .wrap { max-width: 1080px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 880px) { .layout, .duo { grid-template-columns: minmax(0, 1fr); } }
  .stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

  /* variant switch */
  .qlabel { font-weight: 600; font-size: 14.5px; margin: 0 0 8px; }
  .seg.variants { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; }
  .seg.variants button { min-height: 48px; padding: 7px 6px; line-height: 1.2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .seg.variants button small { font: 600 11px var(--font-mono); letter-spacing: 0.06em; opacity: 0.85; }
  .seg.variants button:hover:not([aria-pressed="true"]) { background: var(--surface2); }
  @media (max-width: 520px) {
    .seg.variants { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .seg.variants button:nth-child(3) { border-left: none; }
    .seg.variants button:nth-child(n+3) { border-top: 1px solid var(--border); }
  }
  .setnote { font-size: 14px; color: var(--ink2); margin: 10px 0 0; min-height: 3em; }
  .setnote b { color: var(--ink); }

  /* plot */
  svg.plot { display: block; width: 100%; height: auto; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  svg text { font-family: var(--font-sans); }
  svg .tick { font-family: var(--font-mono); font-size: 11px; fill: var(--muted); }
  svg .axlab { font-size: 12.5px; fill: var(--ink2); }
  svg .clab { font-size: 12px; font-weight: 600; fill: var(--ink2); stroke: var(--halo); stroke-width: 4px; paint-order: stroke; stroke-linejoin: round; }
  svg .isolab { font-family: var(--font-mono); font-size: 12px; font-weight: 600; fill: var(--ink); stroke: var(--halo); stroke-width: 4px; paint-order: stroke; }
  svg .mlab { font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; stroke: var(--halo); stroke-width: 4px; paint-order: stroke; stroke-linejoin: round; }
  svg .knob { cursor: grab; touch-action: none; }
  svg .knob:focus { outline: none; }
  svg .knob:focus-visible circle.ring { stroke: var(--accent); stroke-width: 3; }
  svg .bar { cursor: pointer; }
  svg .bar:focus { outline: none; }
  svg .bar:focus-visible rect.hit { stroke: var(--accent); stroke-width: 2; }
  svg .vlab { font-family: var(--font-mono); font-size: 11px; font-weight: 600; fill: var(--ink2); stroke: var(--halo); stroke-width: 3.5px; paint-order: stroke; stroke-linejoin: round; }
  @media (max-width: 560px) {
    svg .tick { font-size: 17px; }
    svg .axlab { font-size: 19px; }
    svg .clab, svg .isolab { font-size: 18px; stroke-width: 5px; }
    svg .mlab { font-size: 17px; stroke-width: 5px; }
    svg .vlab { font-size: 15px; }
  }
  .hint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }

  .legend .sw.region { background: var(--region); border: 1px solid var(--mit-silver); }
  .legend .sw.int { background: var(--accent); border-radius: 50%; width: 9px; height: 9px; }
  .legend .sw.cont { background: var(--ink); height: 4px; width: 16px; }
  .legend .sw.opt { background: var(--accent); border-radius: 50%; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--accent); }
  .legend .sw.lpo { border: 2px solid var(--ink); border-radius: 50%; background: transparent; }
  .legend .sw.iso { height: 0; width: 18px; border-top: 2px dashed var(--ink2); }

  /* objective */
  .obj-eq { font-family: var(--font-mono); font-size: 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 9px 12px; margin-bottom: 12px; overflow-x: auto; white-space: nowrap; }
  .obj-eq .ivar { color: var(--accent-text); font-weight: 600; }
  .obj-eq .cvar { color: var(--ink); font-weight: 600; }
  .controls .ctl input[type="range"] { height: 26px; }
  .isorow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; }
  button.btn {
    font: 600 13.5px var(--font-sans); color: var(--on-solid); background: var(--accent); border: 1px solid var(--accent);
    border-radius: 3px; padding: 8px 14px; min-height: 36px; cursor: pointer;
  }
  button.btn:hover { filter: brightness(1.08); }
  button.btn.ghost { background: transparent; color: var(--accent-text); border-color: var(--accent-text); }
  button.btn.ghost[aria-pressed="true"] { background: var(--accent); color: var(--on-solid); border-color: var(--accent); }
  .isonote { font-size: 13.5px; color: var(--ink2); margin: 8px 0 0; }
  .optbox { margin-top: 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 10px 12px; font-size: 13.5px; color: var(--ink2); }
  .optbox .zval { display: block; font-family: var(--font-mono); font-size: 21px; font-weight: 600; color: var(--accent-text); margin: 2px 0; font-variant-numeric: tabular-nums; }
  .optbox .xy { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink); }

  /* comparison */
  table.data { min-width: 0; }
  table.data th.num { text-align: right; }
  table.data td.num { text-align: right; font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
  table.data td .vn { font-weight: 600; color: var(--ink); }
  table.data td .vs { display: block; font-size: 11.5px; color: var(--muted); }
  table.data tr.on td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  .order { white-space: pre-line; font-family: var(--font-mono); font-size: 13px; color: var(--ink); background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 8px 12px; margin: 12px 0 8px; overflow-x: auto; }
  .expl { font-size: 14px; color: var(--ink2); margin: 0 0 6px; }
  .expl b { color: var(--ink); }

  /* slices + rounding */
  .sinfo { font-size: 14px; color: var(--ink2); margin: 8px 0 0; min-height: 3em; }
  .sinfo b { color: var(--ink); }
  .ptext { font-size: 14px; color: var(--ink2); margin: 10px 0 0; }
  .ptext b { color: var(--ink); }
  .rdhead { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 10px; }
  .rdhead p { margin: 0; font-size: 14px; color: var(--ink2); flex: 1 1 260px; }
  .ok { color: var(--good-text); font-weight: 600; }
  .bad { color: var(--crit); font-weight: 600; }
  .warn { color: var(--ink); font-weight: 600; }
  .verdict { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; margin: 12px 0 0; font-size: 14px; color: var(--ink2); }
  .verdict b { color: var(--ink); }

  /* model details */
  .vars { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); margin: 8px 0 10px; }
  .vtag { display: inline-block; font: 600 11px var(--font-mono); letter-spacing: 0.05em; padding: 1px 7px; border-radius: 2px; margin-left: 6px; vertical-align: 1px; }
  .vtag.int { background: var(--accent); color: var(--on-solid); }
  .vtag.cont { border: 1px solid var(--mit-silver); color: var(--ink2); }
  .chlist { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: ch; }
  .chlist li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: baseline; background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 9px 11px; }
  .chlist li::before { counter-increment: ch; content: counter(ch); font-weight: 700; color: var(--accent-text); }
  .chst { font: 600 11.5px var(--font-mono); padding: 2px 7px; border-radius: 2px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .chst.done { background: var(--good); border-color: var(--good); color: #ffffff; }
  @media (max-width: 520px) { .chlist li { grid-template-columns: auto minmax(0, 1fr); } .chst { grid-column: 2; justify-self: start; } }
</style>

  function drawIsoText() {
    var opt = variantOpt(), z = st.z, msg;
    document.getElementById("zisoo").textContent = f2(z);
    if (Math.abs(z - opt.z) < 0.26) msg = t("mset.iso.at", { z: f2(opt.z) });
    else if (z < opt.z) msg = t("mset.iso.touch", { z: f2(z) });
    else msg = t("mset.iso.above", { z: f2(z), best: f2(opt.z) });
    document.getElementById("isonote").innerHTML = msg;
  }

  var VN = { lp: "mset.row.lp", x: "mset.row.x", y: "mset.row.y", ip: "mset.row.ip" };
  var VS = { lp: "mset.row.lpSub", x: "mset.row.xSub", y: "mset.row.ySub", ip: "mset.row.ipSub" };

  function drawPanels() {
    var opt = variantOpt();
    document.getElementById("c1o").textContent = f0(st.c1);
    document.getElementById("c2o").textContent = f0(st.c2);
    document.getElementById("budo").textContent = f0(st.B);
    document.getElementById("objeq").innerHTML = "max&nbsp; " + f0(st.c1) + "·<span class=\"ivar\">x</span> + " + f0(st.c2) + "·<span class=\"cvar\">y</span>";

    // variant buttons and set description
    document.querySelectorAll("#variants button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.v === st.v)); });
    var note = st.v === "lp" ? t("mset.set.lp")
      : st.v === "x" ? t("mset.set.x", { n: S.xs.length })
      : st.v === "y" ? t("mset.set.y", { n: S.ys.length })
      : t("mset.set.ip", { n: S.pts.length });
    document.getElementById("setnote").innerHTML = note;

    // optimum box
    document.getElementById("optlab").textContent = t("mset.opt.label", { v: t(VN[st.v]) });
    document.getElementById("optz").textContent = t("mset.opt.z", { z: f2(opt.z) });
    document.getElementById("optxy").textContent = "x = " + f2(opt.x) + " · y = " + f2(opt.y);
    var zs = document.getElementById("ziso");
    zs.max = zCap();
    zs.value = st.z;

    // comparison table
    var rows = [["lp", S.lp], ["x", S.mx], ["y", S.my], ["ip", S.ip]];
    var tb = document.getElementById("cmpbody");
    tb.textContent = "";
    rows.forEach(function (r) {
      var tr = document.createElement("tr");
      if (r[0] === st.v) tr.className = "on";
      var gap = S.lp.z > 0 ? (S.lp.z - r[1].z) / S.lp.z * 100 : 0;
      tr.innerHTML = "<td><span class=\"vn\"></span><span class=\"vs\"></span></td><td class=\"num\"></td><td class=\"num\"></td><td class=\"num\"></td><td class=\"num\"></td>";
      tr.children[0].children[0].textContent = t(VN[r[0]]);
      tr.children[0].children[1].textContent = t(VS[r[0]]);
      tr.children[1].textContent = f2(r[1].x);
      tr.children[2].textContent = f2(r[1].y);
      tr.children[3].textContent = f2(r[1].z);
      tr.children[4].textContent = gap < 0.005 ? t("mset.pct0") : t("mset.pct", { p: I18N.fmt(gap, 1) });
      tb.appendChild(tr);
    });
    document.getElementById("order").textContent = t("mset.cmp.order", { lp: f2(S.lp.z), mx: f2(S.mx.z), my: f2(S.my.z), ip: f2(S.ip.z) });
    var key = S.mx.z > S.my.z + 1e-7 ? "mset.cmp.xy.x" : S.my.z > S.mx.z + 1e-7 ? "mset.cmp.xy.y" : "mset.cmp.xy.eq";
    document.getElementById("cmpxy").innerHTML = t(key, { mx: f2(S.mx.z), my: f2(S.my.z) });

    drawBars();
    drawRounding();
    drawChallenges();
    TeX.set(document.getElementById("formula"),
      texModel(),
      t("mset.d1.formula", { obj: (st.c1 + "·x + " + st.c2 + "·y" + "                     ").slice(0, 21), B: st.B }));
  }

  // the model in TeX: the last two lines follow the buttons (which variables must be whole)
  function texModel() {
    var xi = st.v === "x" || st.v === "ip", yi = st.v === "y" || st.v === "ip";
    return t("mset.d1.tex", {
      c1: I18N.fmt(st.c1), c2: I18N.fmt(st.c2), B: I18N.fmt(st.B),
      xset: xi ? "x\\in\\{0, 1, 2, \\dots\\}" : "x\\ge 0", xtag: t(xi ? "mset.tag.int" : "mset.tag.cont"),
      yset: yi ? "y\\in\\{0, 1, 2, \\dots\\}" : "y\\ge 0", ytag: t(yi ? "mset.tag.int" : "mset.tag.cont")
    });
  }

  // ---- slice bar chart ----
  var bars = document.getElementById("bars");
  var BW = 520, BH = 280, BM = { l: 44, r: 12, t: 26, b: 42 };
  function drawBars() {
    bars.textContent = "";
    var top = Math.max(10, Math.ceil(S.lp.z * 1.12 / 10) * 10);
    var byx = function (v) { return BM.l + (v + 0.5) / 9 * (BW - BM.l - BM.r); };
    var byz = function (z) { return BH - BM.b - z / top * (BH - BM.t - BM.b); };
    var step = top <= 50 ? 10 : top <= 120 ? 20 : top <= 240 ? 40 : 50;
    for (var z = 0; z <= top + 1e-9; z += step) {
      bars.appendChild(el("line", { x1: BM.l, y1: byz(z), x2: BW - BM.r, y2: byz(z), stroke: "var(--grid)", "stroke-width": 1 }));
      bars.appendChild(el("text", { x: BM.l - 7, y: byz(z) + 4, "text-anchor": "end", "class": "tick" }, f0(z)));
    }
    bars.appendChild(el("line", { x1: BM.l, y1: byz(0), x2: BW - BM.r, y2: byz(0), stroke: "var(--axis)", "stroke-width": 1.3 }));
    bars.appendChild(el("text", { x: (BM.l + BW - BM.r) / 2, y: BH - 6, "text-anchor": "middle", "class": "axlab" }, t("mset.sl.xaxis")));
    var bw = (BW - BM.l - BM.r) / 9 * 0.62;
    for (var v = 0; v <= 8; v++) {
      var s = S.xs.filter(function (q) { return q.v === v; })[0];
      var isBest = s && s.v === S.mx.x;
      var g = el("g", { "class": "bar", tabindex: 0, role: "button", "data-x": v,
        "aria-pressed": String(st.sel === v),
        "aria-label": s ? t("mset.sl.barAria", { x: v, z: f2(s.z) }) : t("mset.sl.barEmpty", { x: v }) });
      g.appendChild(el("rect", { "class": "hit", x: byx(v) - bw / 2 - 4, y: BM.t - 18, width: bw + 8, height: byz(0) - BM.t + 18, fill: st.sel === v ? "var(--sel)" : "transparent", stroke: "none" }));
      if (s) {
        var h = Math.max(1.5, byz(0) - byz(s.z));
        g.appendChild(el("rect", { x: byx(v) - bw / 2, y: byz(0) - h, width: bw, height: h,
          fill: isBest ? "var(--accent)" : "var(--mit-silver)", "fill-opacity": isBest ? 1 : 0.7 }));
        g.appendChild(el("text", { x: byx(v), y: byz(s.z) - 6, "text-anchor": "middle", "class": "vlab", fill: isBest ? "var(--accent-text)" : "var(--ink2)", style: isBest ? "fill: var(--accent-text)" : "" }, I18N.fmt(s.z, 1)));
      } else {
        g.appendChild(el("text", { x: byx(v), y: byz(0) - 8, "text-anchor": "middle", "class": "vlab" }, t("mset.sl.none")));
      }
      g.appendChild(el("text", { x: byx(v), y: BH - BM.b + 17, "text-anchor": "middle", "class": "tick", style: "fill: var(--accent-text); font-weight: 600" }, f0(v)));
      bars.appendChild(g);
    }
    // LP bound
    bars.appendChild(el("line", { x1: BM.l, y1: byz(S.lp.z), x2: BW - BM.r, y2: byz(S.lp.z), stroke: "var(--ink)", "stroke-width": 1.5, "stroke-dasharray": "6 4" }));
    bars.appendChild(el("text", { x: BW - BM.r, y: byz(S.lp.z) - 6, "text-anchor": "end", "class": "isolab" }, t("mset.sl.lpbound", { z: f2(S.lp.z) })));

    // info about selected slice
    var sel = st.sel != null ? st.sel : S.mx.x;
    var si = S.xs.filter(function (q) { return q.v === sel; })[0], msg;
    if (si) {
      msg = t("mset.sl.info", { x: sel, lo: f2(si.lo), hi: f2(si.hi), lim: lname(si.lim), z: f2(si.z) });
      if (si.v === S.mx.x) msg += " " + t("mset.sl.isBest");
      else msg += " " + t("mset.sl.notBest", { d: f2(S.mx.z - si.z) });
    } else {
      var vc = violatedAtZero(sel);
      msg = t("mset.sl.infoEmpty", { x: sel, lim: vc ? lname(vc) : "" });
    }
    if (st.sel == null) msg += " " + t("mset.sl.pick");
    document.getElementById("sinfo").innerHTML = msg;
    var n = S.xs.length;
    document.getElementById("explode").innerHTML = t("mset.sl.p2", { n: n, big: f0(Math.pow(n, 10)), b30: f0(Math.pow(2, 30)) });
  }
  function pickBar(v) {
    st.sel = st.sel === v ? null : v;
    if (st.sel != null && st.v !== "x") st.v = "x";
    render(true);
    var b = bars.querySelector('.bar[data-x="' + v + '"]'); if (b) b.focus();
  }
  bars.addEventListener("click", function (e) { var b = e.target.closest(".bar"); if (b) pickBar(+b.dataset.x); });
  bars.addEventListener("keydown", function (e) {
    var b = e.target.closest(".bar"); if (!b) return;
    var v = +b.dataset.x;
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pickBar(v); }
    else if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      e.preventDefault();
      var nv = Math.max(0, Math.min(8, v + (e.key === "ArrowRight" ? 1 : -1)));
      var nb = bars.querySelector('.bar[data-x="' + nv + '"]'); if (nb) nb.focus();
    }
  });

  // ---- rounding ----
  function drawRounding() {
    document.getElementById("rdintro").innerHTML = t("mset.rd.intro", { x: f2(S.lp.x) });
    var btn = document.getElementById("roundbtn");
    btn.setAttribute("aria-pressed", String(st.round));
    document.getElementById("rdout").hidden = !st.round;
    if (!st.round) return;
    var tb = document.getElementById("rdbody");
    tb.textContent = "";
    R.forEach(function (o) {
      var tr = document.createElement("tr");
      tr.innerHTML = "<td></td><td class=\"num\"></td><td class=\"num\"></td><td class=\"num\"></td><td></td>";
      tr.children[0].textContent = t("mset.rd." + o.id);
      tr.children[1].textContent = f0(o.v);
      tr.children[2].textContent = o.ok ? f2(o.y) : "·";
      tr.children[3].textContent = o.ok ? f2(o.z) : "·";
      var span = document.createElement("span");
      if (!o.ok) { span.className = "bad"; span.textContent = t("mset.rd.infeasible", { lim: o.lim ? lname(o.lim) : "" }); }
      else if (o.opt) { span.className = "ok"; span.textContent = t("mset.rd.optimal"); }
      else { span.className = "warn"; span.textContent = t("mset.rd.gap", { p: I18N.fmt(o.gap * 100, 1) }); }
      tr.children[4].appendChild(span);
      tb.appendChild(tr);
    });
    var down = R[0], near = R[1], parts = [];
    if (!near.ok) parts.push(t("mset.rd.v.nearInf", { x: near.v, lim: near.lim ? lname(near.lim) : "" }));
    var cands = [down, near].filter(function (o) { return o.ok; });
    var bestR = cands.length ? cands.reduce(function (a, b) { return b.z > a.z ? b : a; }) : null;
    if (Math.abs(S.lp.x - Math.round(S.lp.x)) < 1e-7) parts.push(t("mset.rd.v.integral"));
    else if (bestR && bestR.opt) parts.push(t("mset.rd.v.lucky"));
    else if (bestR) parts.push(t("mset.rd.v.miss", { p: I18N.fmt(bestR.gap * 100, 1), x: f2(S.mx.x), y: f2(S.mx.y), z: f2(S.mx.z) }));
    document.getElementById("verdict").innerHTML = parts.join(" ");
  }
  document.getElementById("roundbtn").addEventListener("click", function () {
    st.round = !st.round;
    if (st.round) { st.v = "x"; }
    render(true);
  });

  // ---- challenges (checked live) ----
  function drawChallenges() {
    var fracX = Math.abs(S.lp.x - Math.round(S.lp.x)) > 1e-7;
    var Rr = R || rounding(S);
    var done = {
      1: Math.abs(S.mx.z - S.lp.z) < 1e-7,
      2: S.mx.z > S.my.z + 1e-7,
      3: !Rr[1].ok,
      4: fracX && Rr[0].ok && Rr[0].opt
    };
    document.querySelectorAll(".chst").forEach(function (s) {
      var ok = done[s.dataset.ch];
      s.classList.toggle("done", ok);
      s.textContent = ok ? t("mset.ch.done") : t("mset.ch.todo");
    });
  }

  // ---- wiring ----
  document.querySelectorAll("#variants button").forEach(function (b) {
    b.addEventListener("click", function () { st.v = b.dataset.v; st.zLinked = true; stopSweep(); render(); });
  });
  [["c1", "c1"], ["c2", "c2"], ["bud", "B"]].forEach(function (p) {
    var inp = document.getElementById(p[0]);
    st[p[1]] = +inp.value;
    inp.addEventListener("input", function () { st[p[1]] = +inp.value; st.zLinked = true; stopSweep(); render(); });
  });
  document.getElementById("ziso").addEventListener("input", function (e) { stopSweep(); setZ(+e.target.value); });

  function render() {
    S = solveAll();
    R = rounding(S);
    if (st.zLinked) st.z = variantOpt().z;
    drawPanels();
    drawPlot();
    drawIsoText();
  }
  I18N.onChange(function () { render(); });
})();
</script>
</body>
</html>
