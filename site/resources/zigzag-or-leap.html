    for (var i = 0; i < sd.N; i++) { var st = Math.hypot(P.x[i + 1] - P.x[i], P.y[i + 1] - P.y[i]); if (st > best) { best = st; kl = i; } }
    document.getElementById("zz-n1").textContent = T("zz.n.p1", { kl: intf(kl + 1), from: pair(P.x[kl], P.y[kl], 3), al: alphaText(P.nb[kl + 1]),
      to: pair(P.x[kl + 1], P.y[kl + 1], 3), d: fmt(D, 1), k1: intf(k1), n: intf(sd.N) });
    var dd = [];
    for (var k = Math.max(0, nw.N - 2); k <= nw.N; k++) dd.push(sci(dist(nw, k), 1));
    document.getElementById("zz-n2").textContent = T("zz.n.p2", { n: intf(nw.N), full: intf(nw.full), xs: pair(XS[0], XS[1]), dd: dd.join("; ") });
    document.getElementById("zz-n3").textContent = T("zz.n.p3", { n: intf(bf.N), full: intf(bf.full) });
    document.getElementById("zz-n4").textContent = T("zz.n.p4", { fsd: intf(sd.fev), fnw: intf(nw.fev), fbf: intf(bf.fev) });
    document.getElementById("zz-footer").textContent = T("zz.footer", { x0: pair(X0[0], X0[1]) });
  }

  var segBtns = document.querySelectorAll("#zz-seg button");
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      if (state.m === b.getAttribute("data-sc")) return;
      state.m = b.getAttribute("data-sc");
      segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      renderStatus(); renderResults();
      if (A.reducedMotion) { player.seek(DUR); return; }
      if (player.time < CH[1]) player.refresh();
      else { player.seek(CH[1] + 0.001); player.play(); }
    });
  });

  function renderPage() {
    renderSeg(); renderAria(); renderStatus(); renderModel(); renderResults(); renderNotes();
    hudKey = "";
    player.refresh();
  }
  I18N.onChange(renderPage);
})();
</script>
