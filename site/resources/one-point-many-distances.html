<script>
(function () {
  "use strict";
  var T = I18N.t;
  var MINUS = "−";
  var fmt = function (v, d, m) { if (Math.abs(v) < 5e-10) v = 0; return I18N.fmt(v, d == null ? 2 : d, m); };
  var fx2 = function (v) { return fmt(v, 2, 2); };                          // fixed two decimals
  var pair = function (x, y) { return T("weber.pair", { x: fx2(x), y: fx2(y) }); };
  var km = function (v) { return T("weber.v.km", { v: fx2(v) }); };
  var tkm = function (v) { return T("weber.v.tkm", { v: fx2(v) }); };
  var pct = function (v) { return T("weber.v.pct", { v: fmt(v, 1, 1) }); };
  var meters = function (v) { return T("weber.v.m", { v: v >= 100 ? fmt(v, 0) : v >= 10 ? fmt(v, 1, 1) : fx2(v) }); };

  /* ---------- the data (illustrative): positions in km east and north, demand in t per week ---------- */
  var P = [[13, 1], [19, 12.5], [15, 13.5], [5.5, 4], [5, 9], [1, 5], [17, 1.5]];
  var WT = [5, 15, 14, 7, 18, 16, 10];
  var N = P.length, WSUM = WT.reduce(function (a, b) { return a + b; }, 0), HALF = WSUM / 2;
  var TOL = 0.001;                                // km: stop when a step is shorter than 1 m

  function f2(x, y) { var s = 0; for (var i = 0; i < N; i++) s += WT[i] * Math.hypot(x - P[i][0], y - P[i][1]); return s; }
  function f1(x, y) { var s = 0; for (var i = 0; i < N; i++) s += WT[i] * (Math.abs(x - P[i][0]) + Math.abs(y - P[i][1])); return s; }

  // Weiszfeld from the weighted centroid; an iterate on a village gets the optimality test and the escape step
  function weiszfeld() {
    var x = 0, y = 0, i;
    for (i = 0; i < N; i++) { x += WT[i] * P[i][0]; y += WT[i] * P[i][1]; }
    x /= WSUM; y /= WSUM;
    var pts = [[x, y]], vals = [f2(x, y)], steps = [0], minD = Infinity, landed = -1;
    for (var k = 0; k < 1000; k++) {
      var j = -1, nx = 0, ny = 0, den = 0;
      for (i = 0; i < N; i++) {
        var d = Math.hypot(x - P[i][0], y - P[i][1]);
        minD = Math.min(minD, d);
        if (d < 1e-12) { j = i; break; }
        nx += WT[i] * P[i][0] / d; ny += WT[i] * P[i][1] / d; den += WT[i] / d;
      }
      if (j >= 0) {                               // on village j
        var rx = 0, ry = 0, s = 0;

    tl.forEach(function (s, k) { ctx.fillText(s, x + 10, y + k * (L.ft + 3), maxW); });
    y += (tl.length - 1) * (L.ft + 3) + L.fs + 6;
    ctx.font = font(400, L.fs + (L.portrait ? 0 : 1)); ctx.fillStyle = C.ink2;
    wrap(lines[1], maxW).forEach(function (s) { ctx.fillText(s, x + 10, y, maxW); y += L.fs + 5; });
    ctx.restore();
  }

  /* ---------- HUD chips ---------- */
  var chips = [0, 1, 2, 3].map(function (i) {
    var el = document.getElementById("wb-c" + i);
    return { el: el, b: el.querySelector("b"), s: el.querySelector("span"), v: null, l: null, o: null, k: null };
  });
  function setChip(i, val, lab, op, kind) {
    var c = chips[i];
    op = Math.round(clamp(op, 0, 1) * 20) / 20;
    if (c.v !== val) { c.b.textContent = val; c.v = val; }
    if (c.l !== lab) { c.s.textContent = lab; c.l = lab; }
    if (c.o !== op) { c.el.style.opacity = op; c.o = op; }
    if (c.k !== kind) { c.el.classList.toggle("accent", kind === "acc"); c.k = kind; }
  }
  function hud(sc, t, it, ms) {
    var tot = T("weber.v.t", { v: fmt(WSUM) });
    if (sc === "euc") {
      if (t < 8.5) setChip(0, tot, T("weber.k.total"), seg(t, 3.6, 4.2), "");
      else setChip(0, fmt(it.k), T("weber.k.iter"), 1, t >= SCH.s[WZ.k] + SCH.g[WZ.k] ? "acc" : "");
      setChip(1, tkm(f2(it.x, it.y)), T("weber.k.sum"), seg(t, 8.8, 9.3), t >= SCH.s[WZ.k] + SCH.g[WZ.k] ? "acc" : "");
      setChip(2, it.k ? meters(1000 * WZ.steps[it.k]) : meters(0), T("weber.k.step"), seg(t, SCH.s[1] + SCH.g[1] - 0.2, SCH.s[1] + SCH.g[1]), "");
      if (t < CH[4]) setChip(3, T("weber.v.t", { v: fmt(WZ.grad, 3, 3) }), T("weber.k.pull"), seg(t, 42, 42.5), "");
      else setChip(3, tkm(f2(XM[0], XM[1])), T("weber.k.atM"), seg(t, 46.4, 46.9), "");
    } else {
      if (t < MT.gx[0]) setChip(0, tot, T("weber.k.total"), seg(t, 3.6, 4.2), "");
      else if (t < CH[3]) {
        var P0 = ms.p, onY = t >= MT.gy[0];
        setChip(0, T(onY ? "weber.v.y" : "weber.v.x", { v: fx2(onY ? P0.y : P0.x) }), T("weber.k.sweep"), 1, "");
      } else setChip(0, T("weber.v.t", { v: fmt(HALF, 1) }), T("weber.k.half"), 1, "");
      setChip(1, tkm(f1(ms.p.x, ms.p.y)), T("weber.k.sum"), seg(t, 8.8, 9.3), t >= MT.opt ? "acc" : "");
      if (t < CH[3]) setChip(2, T("weber.v.of", { v: fmt(ms.s), w: fmt(WSUM) }), T("weber.k.passed"), seg(t, MT.sx[0], MT.sx[0] + 0.4), ms.s >= HALF ? "acc" : "");
      else setChip(2, T("weber.v.t", { v: fmt(Math.max(MX.lo, MX.hi, MY.lo, MY.hi)) }), T("weber.k.side"), 1, "");
      setChip(3, tkm(f1(XS[0], XS[1])), T("weber.k.atE"), t < CH[4] ? 0 : seg(t, 46.4, 46.9), "");
    }
  }

  /* ---------- the frame ---------- */
  function render(t) {
    C = A.colors();
    HOT = C.accent.toLowerCase() === C["mit-bright"].toLowerCase() ? C.crit : C["mit-bright"];
    var sc = state.sc, euc = sc === "euc";
    var it = euc ? eucIter(t) : null, ms = euc ? null : manSides(t);
    var cur = euc ? { x: it.x, y: it.y } : ms.p;
    hud(sc, t, it, ms || { p: cur, s: 0 });           // chips first: the layout reads their size
    if (hudKey !== cv.w + "x" + cv.h + ":" + hudEl.offsetHeight + ":" + hudEl.offsetWidth) layout();
    setCam(sc, t);
    ctx.clearRect(0, 0, L.W, L.H);
    ctx.fillStyle = C.surface; ctx.fillRect(0, 0, L.W, L.H);
    ctx.lineCap = "butt"; ctx.lineJoin = "round"; ctx.setLineDash([]);
    drawGrid(t);
    // level curves of the cost (chapter 4 on)
    drawContours(sc, E.inOut(seg(t, euc ? 40.6 : 38.4, euc ? 43.4 : 41.2)));
    // routes: from the moving point while it searches, then faint from the optimum
    var ra = seg(t, 8.6, 9.6);
    if (euc) {
      var ropt = t >= CH[3];
      var fl = flashAmt(t);
      var rw = pullWidths(cur.x, cur.y);
      if (!ropt) {
        drawRoutes(cur.x, cur.y, sc, ra * (t < CH[2] ? 0.8 : 0.65), t < CH[2] ? null : rw);
        if (fl > 0) drawRoutes(cur.x, cur.y, sc, fl * 0.9, rw, C.accent);
      } else drawRoutes(XS[0], XS[1], sc, 0.45 + 0.1 * seg(t, 44, 45), null);
    } else {
      var rp = t >= MT.opt ? XM : [cur.x, cur.y];
      drawRoutes(rp[0], rp[1], sc, ra * (t >= MT.opt ? 0.6 : 0.75), null);
    }
    drawVillages(t, sc);
    drawTrucks(t, cur.x, cur.y, sc);
    if (euc) { drawTrail(t, it); drawPulls(t); }
    else drawSweep(t);
    drawStart(t, sc);
    if (euc) {
      var tEnd = SCH.s[WZ.k] + SCH.g[WZ.k];
      if (t < tEnd) {                             // the moving point
        var ap = seg(t, 8.4, 9.0);
        if (t >= SCH.s[1] && ap > 0) {
          var X = SX(cur.x), Y = SY(cur.y);
          ctx.globalAlpha = ap; ctx.fillStyle = C.surface; circle(X, Y, L.dot + 2); ctx.fill();
          ctx.fillStyle = C.accent; circle(X, Y, L.dot); ctx.fill(); ctx.globalAlpha = 1;
        }
      }
      drawOpt(SX(XS[0]), SY(XS[1]), tEnd, t, T("weber.l.xs"), true);
      var sl = seg(t, tEnd + 0.4, tEnd + 1) * (1 - seg(t, CH[3], CH[3] + 0.5));
      if (sl > 0) label(T("weber.l.stop"), SX(XS[0]) + L.dot + 7, SY(XS[1]) + L.dot + 12, "left", C.ink2, font(600, L.fs), sl);
    } else {
      drawRunner(t, cur);
      drawOpt(SX(XM[0]), SY(XM[1]), MT.opt, t, T("weber.l.xs"), false);
    }
    drawCompare(t, sc);
    villageLabels(t, sc);

    // quiet band under the counters and the caption
    var gr, e1, e2;
    if (L.portrait) {
      e2 = L.y0 + 4; e1 = clamp((L.capBottom + 2) / e2, 0, 0.98);
      gr = ctx.createLinearGradient(0, 0, 0, e2);
      gr.addColorStop(0, rgba(C.surface, 1)); gr.addColorStop(e1, rgba(C.surface, 1)); gr.addColorStop(1, rgba(C.surface, 0));
      ctx.fillStyle = gr; ctx.fillRect(0, 0, L.W, e2);
    } else {
      e2 = L.x0 + 4; e1 = clamp((L.capX + L.capW + 4) / e2, 0, 0.98);
      gr = ctx.createLinearGradient(0, 0, e2, 0);
      gr.addColorStop(0, rgba(C.surface, 1)); gr.addColorStop(e1, rgba(C.surface, 1)); gr.addColorStop(1, rgba(C.surface, 0));
      ctx.fillStyle = gr; ctx.fillRect(0, 0, e2, L.H);
    }
    ctx.globalAlpha = 1;
    drawScale(t);
    drawCaption(sc, t);
  }

  layout();
  var player = A.create({
    root: root,
    duration: DUR,
    chapters: CH.map(function (c, k) { return { t: c, key: "weber.ch" + (k + 1) }; }),
    onResize: function () { cv.fit(); layout(); },
    render: render
  });

  /* =====================================================================================
     Page text: status line, data table, solution, iterations, medians, notes
     ===================================================================================== */
  var vname = function (i) { return T("weber.vil" + (i + 1)); };
  var pctE = function () { return 100 * (f2(XM[0], XM[1]) / F2S - 1); };
  var pctM = function () { return 100 * (f1(XS[0], XS[1]) / F1S - 1); };
  function renderScenText() {
    var e = state.sc === "euc", ka = e ? "weber.anim.aria.euc" : "weber.anim.aria.man";
    stage.setAttribute("data-i18n-attr", "aria-label:" + ka);
    stage.setAttribute("aria-label", T(ka) + " " + T("weber.anim.aria.nums", {
      xe: pair(XS[0], XS[1]), fe: tkm(F2S), k: WZ.k, xm: pair(XM[0], XM[1]), fm: tkm(F1S), d: km(DIST)
    }));
    document.getElementById("wb-lg-iter").hidden = !e;
    document.getElementById("wb-lg-sweep").hidden = e;
    var lo = document.getElementById("wb-lg-other"), ko = e ? "weber.lg.other.euc" : "weber.lg.other.man";
    lo.setAttribute("data-i18n", ko); lo.textContent = T(ko);
    document.getElementById("wb-status").innerHTML = e
      ? T("weber.st.euc", { x0: pair(X0[0], X0[1]), k: WZ.k, x: pair(XS[0], XS[1]), f: tkm(F2S), m: pair(XM[0], XM[1]), d: km(DIST) })
      : T("weber.st.man", { m: pair(XM[0], XM[1]), f: tkm(F1S), x: pair(XS[0], XS[1]), d: km(DIST) });
  }
  function renderModel() {
    var h = "<thead><tr><th>" + T("weber.tbl.name") + "</th><th class='num'>" + T("weber.tbl.a") + "</th><th class='num'>" +
      T("weber.tbl.b") + "</th><th class='num'>" + T("weber.tbl.w") + "</th></tr></thead><tbody>";
    P.forEach(function (p, i) {
      h += "<tr><td>" + vname(i) + "</td><td class='num'>" + fmt(p[0], 1, 1) + "</td><td class='num'>" + fmt(p[1], 1, 1) + "</td><td class='num'>" + fmt(WT[i]) + "</td></tr>";
    });
    h += "<tr class='tot'><td>" + T("weber.tbl.total") + "</td><td></td><td></td><td class='num'>" + fmt(WSUM) + "</td></tr></tbody>";
    document.getElementById("wb-data").innerHTML = h;
    document.getElementById("wb-vwhy").textContent = T("weber.v.why", { d: km(WZ.minD) });
  }
  function renderSolution() {
    document.getElementById("wb-sxe").textContent = pair(XS[0], XS[1]);
    document.getElementById("wb-sxel").textContent = T("weber.sol.xel", { k: WZ.k });
    document.getElementById("wb-sfe").textContent = fx2(F2S);
    document.getElementById("wb-sxm").textContent = pair(XM[0], XM[1]);
    document.getElementById("wb-sfm").textContent = fx2(F1S);
    document.getElementById("wb-sd").textContent = km(DIST);
    var rows = [["weber.cmp.c", X0], ["weber.cmp.e", XS], ["weber.cmp.m", XM]];
    var v2 = rows.map(function (r) { return f2(r[1][0], r[1][1]); }), v1 = rows.map(function (r) { return f1(r[1][0], r[1][1]); });
    var b2 = Math.min.apply(null, v2), b1 = Math.min.apply(null, v1);
    var cell = function (v, b) {
      var best = Math.abs(v - b) < 1e-9, p = 100 * (v / b - 1);
      return "<td class='num" + (best ? " best" : "") + "'>" + fx2(v) + (best ? "" : "<span class='pl'>" + T("weber.cmp.plus", { p: pct(p) }) + "</span>") + "</td>";
    };
    var h = "<thead><tr><th>" + T("weber.cmp.pt") + "</th><th class='num'>" + T("weber.cmp.f2") + "</th><th class='num'>" + T("weber.cmp.f1") + "</th></tr></thead><tbody>";
    rows.forEach(function (r, k) { h += "<tr><td>" + T(r[0]) + " <span style='color:var(--muted)'>" + pair(r[1][0], r[1][1]) + "</span></td>" + cell(v2[k], b2) + cell(v1[k], b1) + "</tr>"; });
    document.getElementById("wb-cmp").innerHTML = h + "</tbody>";
  }
  function renderIter() {
    var h = "<thead><tr><th class='num'>" + T("weber.it.k") + "</th><th class='num'>" + T("weber.it.x") + "</th><th class='num'>" + T("weber.it.f") +
      "</th><th class='num'>" + T("weber.it.s") + "</th></tr></thead><tbody>";
    WZ.pts.forEach(function (p, k) {
      h += "<tr" + (k === WZ.k ? " class='on'" : "") + "><td class='num'>" + k + "</td><td class='num'>" + T("weber.pair", { x: fmt(p[0], 4, 4), y: fmt(p[1], 4, 4) }) +
        "</td><td class='num'>" + fmt(WZ.f[k], 4, 4) + "</td><td class='num'>" + (k ? fx2(1000 * WZ.steps[k]) : T("weber.it.start")) + "</td></tr>";
    });
    document.getElementById("wb-iter").innerHTML = h + "</tbody>";
    document.getElementById("wb-it-note").textContent = T("weber.it.note", { r: fmt(RATIO, 2, 2), g: fmt(WZ.grad, 3, 3) });
    document.getElementById("wb-it-note2").textContent = T("weber.it.note2", {
      e: meters(1000 * Math.hypot(LIM[0] - XS[0], LIM[1] - XS[1])), q: meters(1000 * WZ.steps[WZ.k] * RATIO / (1 - RATIO)) });
  }
  function renderMedians() {
    document.getElementById("wb-md-intro").textContent = T("weber.md.intro", { w: fmt(WSUM), h: fmt(HALF, 1) });
    [[MX, "wb-mdx", "weber.md.a"], [MY, "wb-mdy", "weber.md.b"]].forEach(function (d) {
      var M = d[0], h = "<thead><tr><th>" + T("weber.md.v") + "</th><th class='num'>" + T(d[2]) + "</th><th class='num'>" + T("weber.md.w") +
        "</th><th class='num'>" + T("weber.md.cum") + "</th></tr></thead><tbody>";
      M.rows.forEach(function (r, k) {
        h += "<tr" + (k === M.mi ? " class='on'" : "") + "><td>" + vname(r.i) + "</td><td class='num'>" + fmt(r.v, 1, 1) + "</td><td class='num'>" + fmt(r.w) +
          "</td><td class='num'>" + fmt(r.cum) + "</td></tr>";
      });
      document.getElementById(d[1]).innerHTML = h + "</tbody>";
    });
    document.getElementById("wb-md-check").textContent = T("weber.md.check", { n: BRUTE.n, m: pair(BRUTE.x, BRUTE.y), f: tkm(BRUTE.f) });
  }
  function renderNotes() {
    var vx = MX.rows[MX.mi].i;
    document.getElementById("wb-n1").textContent = T("weber.n.p1", { x0: pair(X0[0], X0[1]), s1: meters(1000 * WZ.steps[1]), d: km(Math.hypot(X0[0] - XS[0], X0[1] - XS[1])) });
    document.getElementById("wb-n2").textContent = T("weber.n.p2", { r: fmt(RATIO, 2, 2), n: fmt(Math.log(0.1) / Math.log(RATIO), 0), k: WZ.k, sl: meters(1000 * WZ.steps[WZ.k]) });
    document.getElementById("wb-n3").textContent = T("weber.n.p3", { m: pair(XM[0], XM[1]), mx: fmt(XM[0], 1), vx: vname(vx), wx: fmt(WT[vx]), wl: fmt(MX.lo) });
    document.getElementById("wb-n4").textContent = T("weber.n.p4", { pe: pct(pctM()), pm: pct(pctE()), d: km(DIST) });
  }

  var segBtns = document.querySelectorAll("#wb-seg button");
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      if (state.sc === b.getAttribute("data-sc")) return;
      state.sc = b.getAttribute("data-sc");
      segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      renderScenText();
      if (A.reducedMotion) { player.seek(DUR); return; }
      if (player.time < CH[1]) player.refresh();
      else { player.seek(CH[1] + 0.001); player.play(); }
    });
  });

  function renderPage() {
    renderScenText(); renderModel(); renderSolution(); renderIter(); renderMedians(); renderNotes();
    hudKey = "";
    player.refresh();
  }
  I18N.onChange(renderPage);
})();
</script>
</body>
</html>
