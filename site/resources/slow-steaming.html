<style>
  /* ---- the game ---- */
  .gtop { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
  .gtop .ctl-label { font-size: 13px; font-weight: 600; color: var(--ink2); }
  .brief { margin: 0 0 4px; color: var(--ink2); font-size: 14.5px; max-width: 78ch; }
  .brief b { color: var(--ink); }
  .facts { margin: 0 0 14px; font-size: 13px; color: var(--muted); max-width: 78ch; }

  .play { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px 22px; align-items: start; }
  @media (max-width: 760px) { .play { grid-template-columns: minmax(0, 1fr); } }
  .play > div { min-width: 0; }
  .mapbox { background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; }
  .mapbox svg { display: block; width: 100%; }
  svg text { font-family: var(--font-sans); }
  svg .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  .legs { display: grid; gap: 14px; }
  .leg { display: grid; gap: 3px; }
  .leg .row { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 10px; flex-wrap: wrap; }
  .leg .nm { font-size: 14px; font-weight: 600; color: var(--ink); display: inline-flex; align-items: center; gap: 7px; }
  .leg .sub { font-size: 12.5px; color: var(--muted); }
  .leg output { font-family: var(--font-mono); font-size: 13.5px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .track { position: relative; padding-top: 2px; }
  .track input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); display: block; }
  .opt-tick {
    position: absolute; top: -3px; width: 0; height: 28px; border-left: 2px dashed var(--ink2); pointer-events: none;
    left: calc(8px + (100% - 16px) * var(--f, 0));
  }
  .opt-tick span {
    position: absolute; top: 26px; left: 0; transform: translateX(-50%); font-size: 11px; color: var(--ink2); white-space: nowrap;
    background: var(--halo); padding: 0 3px;
  }
  .scale { display: flex; justify-content: space-between; font: 400 11px var(--font-mono); color: var(--muted); }
  .leg.revealed .scale { margin-top: 14px; }
  .sw.l1 { background: var(--accent); height: 4px; width: 18px; }
  .sw.l2 { background: var(--ink); height: 4px; width: 18px; }
  .sw.l3 { height: 0; width: 18px; border-top: 3px dashed var(--mit-silver); }

  /* time strip */
  .strip { margin-top: 18px; }
  .strip-head { display: flex; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; font-size: 13px; color: var(--ink2); margin-bottom: 5px; }
  .strip-head b { color: var(--ink); font-family: var(--font-mono); }
  .bar { position: relative; height: 22px; background: var(--surface2); border: 1px solid var(--border); border-radius: 2px; }
  .bar i { position: absolute; top: 0; bottom: 0; display: block; }
  .bar i.s1 { background: var(--accent); }
  .bar i.s2 { background: var(--ink); }
  .bar i.s3 { background: repeating-linear-gradient(135deg, var(--mit-silver) 0 5px, var(--region) 5px 8px); }
  .bar i.over { background: repeating-linear-gradient(135deg, var(--crit) 0 2px, transparent 2px 6px); border-left: 0; }
  .bar .dl { position: absolute; top: -6px; bottom: -6px; width: 0; border-left: 2.5px solid var(--ink); }
  .bar .gap { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--surface); }
  .baraxis { position: relative; height: 16px; font: 400 11px var(--font-mono); color: var(--muted); }
  .baraxis span { position: absolute; top: 2px; transform: translateX(-50%); white-space: nowrap; }
  .baraxis span.dlab { color: var(--ink); font-family: var(--font-sans); font-weight: 600; font-size: 12px; }

  .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 16px; }
  @media (max-width: 900px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } }
  .stat .k { font-size: 12.5px; color: var(--ink2); font-weight: 600; }
  .stat .v { font-size: 22px; }
  .stat.tot .v { color: var(--accent-text); }
  .stat .l.opt { color: var(--ink); font-weight: 600; }
  .stat.bad .v { color: var(--crit); }
  @media (max-width: 560px) {
    .stat { padding: 10px 11px; }
    .stat .v { font-size: 18px; }
    .stat .l { font-size: 12px; }
  }
  .msg { margin: 12px 0 0; font-size: 14px; color: var(--ink2); }
  .msg b { color: var(--ink); }
  .msg.bad, .msg.bad b { color: var(--crit); }

  .score { margin-top: 14px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 14px; align-items: center;
    border-left: 4px solid var(--accent); background: var(--surface2); padding: 10px 14px; border-radius: 2px; }
  .score.late { border-left-color: var(--crit); }
  .stars { font-size: 21px; letter-spacing: 3px; color: var(--accent-text); grid-row: span 2; }
  .stars .off { color: var(--axis); }
  .verdict { font-weight: 700; font-size: 16px; margin: 0; color: var(--ink); }
  .score .rsub { margin: 0; font-size: 13.5px; color: var(--ink2); }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
  button.btn {
    font: 600 14px var(--font-sans); color: var(--on-solid); background: var(--accent);
    border: 1.5px solid var(--accent); border-radius: 2px; padding: 9px 16px; min-height: 40px; cursor: pointer;
  }
  button.btn:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; color: var(--accent-text); border-color: var(--accent-text); }
  button.quiet { background: transparent; color: var(--ink2); border-color: var(--border); }
  button[hidden] { display: none; }

  /* ---- model ---- */
  .model-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 8px 22px; align-items: start; }
  @media (max-width: 860px) { .model-grid { grid-template-columns: minmax(0, 1fr); } }
  .model-grid > div { min-width: 0; }
  .mhead { margin: 14px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-text); }
  .mhead:first-child { margin-top: 0; }
  .mtext { font-size: 14px; color: var(--ink2); margin: 6px 0 0; max-width: 72ch; }
  .mtext b { color: var(--ink); }

  /* ---- solution ---- */
  #sol .stats { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  @media (max-width: 560px) { #sol .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  #sol .stat .v { color: var(--accent-text); }
  #sol .stat .v.ink { color: var(--ink); }
  .solp { font-size: 14px; color: var(--ink2); margin: 16px 0 0; max-width: 80ch; }
  .solp b { color: var(--ink); }
  table.data th.num, table.data td.num { text-align: right; }
  table.data td.num { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
  table.data td.ex { color: var(--accent-text); font-weight: 600; }
  table.data td.muted { color: var(--muted); }
  table.data tr.base td { background: var(--sel); font-weight: 600; }
  .tblwrap { margin-top: 8px; }
  #legTable { min-width: 560px; }
  #legTable td.lg { white-space: nowrap; }
  @media (max-width: 560px) { #legTable { min-width: 0; } }
  #bisTable, #sensTable { min-width: 0; }
  @media (max-width: 560px) {
    table.data .wide { display: none; }
    table.data th, table.data td { padding-inline: 6px; }
  }
  .tag { font-size: 11.5px; color: var(--muted); font-family: var(--font-sans); display: block; }

  .bars { display: grid; gap: 8px; max-width: 720px; margin-top: 8px; }
  .brow { display: grid; grid-template-columns: minmax(96px, 150px) 1fr; gap: 10px; align-items: center; font-size: 13.5px; }
  .brow .lbl { color: var(--ink2); text-align: right; line-height: 1.2; }
  @media (max-width: 560px) {               /* phones: label above its bar, so a long total never covers it */
    .brow { grid-template-columns: minmax(0, 1fr); gap: 3px; }
    .brow .lbl { text-align: left; }
  }
  .brow.opt .lbl { color: var(--ink); font-weight: 600; }
  .btrack { position: relative; height: 26px; background: var(--surface2); border: 1px solid var(--border); border-radius: 2px; }
  .btrack i { position: absolute; top: 0; bottom: 0; display: block; }
  .btrack i.cf { background: var(--accent); }
  .btrack i.ci { background: var(--mit-silver); }
  .bval {
    position: absolute; top: 50%; transform: translateY(-50%); font: 600 12.5px var(--font-mono);
    color: var(--ink); background: var(--halo); padding: 0 4px; border-radius: 2px; white-space: nowrap;
  }
  .sw.cf { background: var(--accent); }
  .sw.ci { background: var(--mit-silver); }

  .charts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px 22px; margin-top: 8px; }
  @media (max-width: 760px) { .charts { grid-template-columns: minmax(0, 1fr); } }
  .charts > div { min-width: 0; }
  .charts h3, .solh { font-size: 14.5px; margin: 18px 0 6px; font-weight: 600; }
  .charts h3 { margin-top: 10px; }
  .chartbox svg { display: block; width: 100%; overflow: visible; }
  .sw.lt { width: 9px; height: 9px; border-radius: 50%; background: var(--mit-silver); }
  .sw.ls { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .sw.ld { height: 0; width: 18px; border-top: 2px dashed var(--ink2); }
</style>

  <div class="card" id="game">
    <div class="gtop">
      <span class="ctl-label" id="sc-lbl" data-i18n="steam.sc.label"></span>
      <div class="seg" role="group" aria-labelledby="sc-lbl" id="sc-seg">

  /* ---------- the map (schematic, positions approximate) ---------- */

    document.getElementById("s-timel").textContent = o.zero ? T("steam.sol.timeSlack") : T("steam.sol.timeBind");
    document.getElementById("s-gain").textContent = usd(cp.C - o.C);
    document.getElementById("s-gainl").textContent = T("steam.sol.gainL", { v: kn(cp.v[0]), c: usd(cp.C) });
    // leg table
    var h = "<thead><tr><th>" + T("steam.tbl.leg") + "</th><th class='num wide'>" + T("steam.tbl.h") + "</th><th class='num'>" + T("steam.tbl.vopt") +
      "</th><th class='num wide'>" + T("steam.tbl.vyou") + "</th><th class='num'>" + T("steam.tbl.days") + "</th><th class='num'>" + T("steam.tbl.fuel") +
      "</th><th class='num'>" + T("steam.tbl.inv") + "</th></tr></thead><tbody>";
    for (var i = 0; i < 3; i++) {
      h += "<tr><td class='lg'>" + T("steam.legShort", { n: i + 1 }) + "<span class='tag'>" + T(SHARE[i] > 0 ? "steam.tbl.lad" : "steam.tbl.bal") +
        (o.clip[i] ? " · " + T("steam.tbl.clip") : "") + "</span></td><td class='num wide'>" + fx(Math.round(o.h[i]), 0) +
        "</td><td class='num ex'>" + T("steam.kn", { v: fx(o.v[i], 2) }) + "</td><td class='num wide'>" + T("steam.kn", { v: kn(you.v[i]) }) +
        "</td><td class='num'>" + fx(o.t[i], 2) + "</td><td class='num'>" + fx(Math.round(o.fuel[i]), 0) + "</td><td class='num'>" + fx(Math.round(o.inv[i]), 0) + "</td></tr>";
    }
    document.getElementById("legTable").innerHTML = h + "</tbody>";
    // stationarity with the numbers
    var rows = [], plain = [], narrow = document.getElementById("sol").clientWidth < 560;
    for (i = 0; i < 3; i++) {
      var vv = { n: i + 1, P: texNum(P, 0), k: texNum(K[i], 6), v: texNum(o.v[i], 3), lhs: texNum(2 * P * K[i] * Math.pow(o.v[i], 3), 0),
        h: texNum(Math.round(o.h[i]), 0), lam: texNum(Math.round(o.lam), 0) };
      var vp = { n: i + 1, P: fx(P, 0), k: fx(K[i], 6), v: fx(o.v[i], 3), lhs: fx(2 * P * K[i] * Math.pow(o.v[i], 3), 0),
        h: fx(Math.round(o.h[i]), 0), lam: fx(Math.round(o.lam), 0) };
      var row = T(o.clip[i] ? "steam.inst.rowClip" : "steam.inst.row", vv);
      if (narrow && !o.clip[i]) row = row.replace("&&=", "\\\\ & \\qquad =");
      rows.push(row);
      plain.push(T(o.clip[i] ? "steam.inst.plainClip" : "steam.inst.plain", vp));
    }
    TeX.set(document.getElementById("inst"), "\\begin{aligned}" + rows.join("\\\\ ") + "\\end{aligned}", plain.join("\n"));
    renderBars();
    renderCharts();
    // bisection table
    var bt = document.getElementById("bisTable"), bn = document.getElementById("bisNote");
    if (o.zero) { bt.innerHTML = ""; bn.textContent = T("steam.bis.zero"); }
    else {
      h = "<thead><tr><th class='num'>" + T("steam.bis.n") + "</th><th class='num wide'>" + T("steam.bis.lo") + "</th><th class='num wide'>" + T("steam.bis.hi") +
        "</th><th class='num'>" + T("steam.bis.mid") + "</th><th class='num'>" + T("steam.bis.t") + "</th><th>" + T("steam.bis.then") + "</th></tr></thead><tbody>";
      o.log.forEach(function (s, j) {
        // one decimal on lambda and five on days, so the last steps (bracket under USD 10) stay distinguishable
        h += "<tr><td class='num'>" + (j + 1) + "</td><td class='num wide'>" + fx(s.lo, 1) + "</td><td class='num wide'>" + fx(s.hi, 1) +
          "</td><td class='num ex'>" + fx(s.mid, 1) + "</td><td class='num'>" + fx(s.t, 5) + "</td><td class='muted'>" + T(s.late ? "steam.bis.late" : "steam.bis.early") + "</td></tr>";
      });
      bt.innerHTML = h + "</tbody>";
      bn.textContent = T("steam.bis.note", { n: o.log.length, l: usd(o.lam), hi: usd(o.hi0) });
    }
    // sensitivity
    document.getElementById("sensIntro").textContent = T("steam.sens.intro", { l: usd(o.lam), T: fx(TDL, 0) });
    h = "<thead><tr><th class='num'>" + T("steam.sens.T") + "</th><th class='num'>" + T("steam.sens.c") + "</th><th class='num wide'>" + T("steam.sens.l") +
      "</th><th class='num'>" + T("steam.sens.ex") + "</th><th class='num'>" + T("steam.sens.est") + "</th></tr></thead><tbody>";
    DT.forEach(function (d) {
      var s = solve(state.sc, TDL + d);
      h += "<tr" + (d === 0 ? " class='base'" : "") + "><td class='num'>" + fx(TDL + d, 1) + "</td><td class='num'>" + fx(Math.round(s.C), 0) +
        "</td><td class='num wide'>" + fx(Math.round(s.lam), 0) + "</td><td class='num ex'>" + (d === 0 ? "" : sgn(Math.round(s.C - o.C), 0)) +
        "</td><td class='num'>" + (d === 0 ? "" : sgn(Math.round(-o.lam * d), 0)) + "</td></tr>";
    });
    document.getElementById("sensTable").innerHTML = h + "</tbody>";
  }
  function renderBars() {
    var o = solve(state.sc, TDL), cp = constPlan(state.sc), you = plan(state.sc, state.v);
    var items = [["you", you], ["const", cp], ["opt", o]], mx = Math.max(you.C, cp.C, o.C) * 1.3, h = "";
    items.forEach(function (it) {
      var r = it[1], lab = it[0] === "const" ? T("steam.bars.const", { v: kn(cp.v[0]) }) : T("steam.bars." + it[0]);
      var late = r.time > TDL + 1e-9;
      var wf = r.F / mx * 100, wi = r.I / mx * 100;
      h += "<div class='brow" + (it[0] === "opt" ? " opt" : "") + "'><span class='lbl'>" + lab + "</span><div class='btrack'>" +
        "<i class='cf' style='left:0;width:" + wf + "%'></i><i class='ci' style='left:calc(" + wf + "% + 2px);width:" + wi + "%'></i>" +
        "<span class='bval' style='right:6px'>" + usd(r.C) + (late ? " · " + T("steam.bars.late") : "") + "</span></div></div>";
    });
    document.getElementById("bars").innerHTML = h;
  }

  /* ---------- charts (px-sized SVG) ---------- */
  function niceStep(span, n) {
    var raw = span / n, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
    return (m < 1.5 ? 1 : m < 3 ? 2 : m < 7 ? 5 : 10) * p;
  }
  function frame(svg, W, H, M, X, Y, xt, yt, xlab, ylab) {
    var g = [];
    var sx = function (x) { return M.l + (x - X[0]) / (X[1] - X[0]) * (W - M.l - M.r); };
    var sy = function (y) { return H - M.b - (y - Y[0]) / (Y[1] - Y[0]) * (H - M.t - M.b); };
    var fs = W < 420 ? 11 : 11.5;
    xt.forEach(function (x) {
      g.push("<line x1='" + sx(x) + "' x2='" + sx(x) + "' y1='" + M.t + "' y2='" + (H - M.b) + "' stroke='var(--grid)'/>");
      g.push("<text class='num' x='" + sx(x) + "' y='" + (H - M.b + 15) + "' text-anchor='middle' font-size='" + fs + "' fill='var(--muted)'>" + fx(x / 1000, 0) + "</text>");
    });
    yt.forEach(function (y) {
      g.push("<line x1='" + M.l + "' x2='" + (W - M.r) + "' y1='" + sy(y) + "' y2='" + sy(y) + "' stroke='var(--grid)'/>");
      g.push("<text class='num' x='" + (M.l - 6) + "' y='" + (sy(y) + 4) + "' text-anchor='end' font-size='" + fs + "' fill='var(--muted)'>" + fx(y, 0) + "</text>");
    });
    g.push("<line x1='" + M.l + "' x2='" + (W - M.r) + "' y1='" + (H - M.b) + "' y2='" + (H - M.b) + "' stroke='var(--axis)' stroke-width='1.5'/>");
    g.push("<text x='" + ((M.l + W - M.r) / 2) + "' y='" + (H - 4) + "' text-anchor='middle' font-size='" + fs + "' fill='var(--ink2)'>" + xlab + "</text>");
    g.push("<text x='" + M.l + "' y='" + (M.t - 8) + "' text-anchor='start' font-size='" + fs + "' fill='var(--ink2)'>" + ylab + "</text>");
    return { g: g, sx: sx, sy: sy, fs: fs };
  }
  function renderCharts() {
    var o = solve(state.sc, TDL), sc = state.sc;
    var xmax = o.zero ? 50000 : o.hi0;
    var xt = [], st = niceStep(xmax, 5);
    for (var x = 0; x <= xmax + 1e-6; x += st) xt.push(x);
    // chart 1: total time against lambda
    var svg1 = document.getElementById("ch1"), W = svg1.parentNode.clientWidth || 360, H = Math.round(clamp(W * 0.62, 220, 290));
    var M = { l: 34, r: 14, t: 22, b: 36 };
    var tmin = timeAt(sc, xmax), tmax = timeAt(sc, 0), y0 = Math.floor(Math.min(tmin, TDL) - 0.3), y1 = Math.ceil(Math.max(tmax, TDL) + 0.2);
    var yt = []; for (var y = y0; y <= y1; y += (y1 - y0 > 6 ? 2 : 1)) yt.push(y);
    var F = frame(svg1, W, H, M, [0, xmax], [y0, y1], xt, yt, T("steam.ch1.x"), T("steam.days", { v: "" }).trim());
    var g = F.g, pts = [], i;
    for (i = 0; i <= 160; i++) { var l = xmax * i / 160; pts.push(F.sx(l).toFixed(1) + "," + F.sy(timeAt(sc, l)).toFixed(1)); }
    g.push("<line x1='" + M.l + "' x2='" + (W - M.r) + "' y1='" + F.sy(TDL) + "' y2='" + F.sy(TDL) + "' stroke='var(--ink2)' stroke-width='1.6' stroke-dasharray='6 5'/>");
    g.push("<text x='" + (W - M.r) + "' y='" + (F.sy(TDL) - 6) + "' text-anchor='end' font-size='" + F.fs + "' fill='var(--ink2)'>" + T("steam.ch1.dead") + "</text>");
    g.push("<polyline points='" + pts.join(" ") + "' fill='none' stroke='var(--ink)' stroke-width='2'/>");
    // box of the lambda* label (drawn below), so the step numbers never land on it or on the red dot
    var SX0 = F.sx(o.lam), SY0 = F.sy(o.time), right0 = SX0 < W * 0.55;
    var starW = (T("steam.ch1.star", { l: fx(Math.round(o.lam), 0) }).length) * (F.fs + 1) * 0.62;
    var sbx0 = right0 ? SX0 - 8 : SX0 - 14 - starW, sbx1 = right0 ? SX0 + 14 + starW : SX0 + 8, sby0 = SY0 - 10, sby1 = SY0 + 24;
    o.log.forEach(function (s, j) {
      var X = F.sx(s.mid), Y = F.sy(s.t);
      g.push("<circle cx='" + X + "' cy='" + Y + "' r='4.5' fill='var(--mit-silver)' stroke='var(--surface)' stroke-width='2'/>");
      if (j >= 3) return;
      // first free spot among up-right, up-left, down-left, down-right
      var spots = [[7, -7, "start"], [-7, -7, "end"], [-7, 16, "end"], [7, 16, "start"]], pick = null;
      spots.forEach(function (q) {
        if (pick) return;
        var tx = X + q[0], ty = Y + q[1], x0 = q[2] === "start" ? tx - 1 : tx - 10, x1 = x0 + 11;
        if (!(x1 > sbx0 && x0 < sbx1 && ty > sby0 && ty - 12 < sby1)) pick = q;
      });
      if (pick) g.push("<text class='num' x='" + (X + pick[0]) + "' y='" + (Y + pick[1]) + "' text-anchor='" + pick[2] + "' font-size='" + F.fs + "' fill='var(--ink2)' stroke='var(--surface)' stroke-width='3' paint-order='stroke'>" + (j + 1) + "</text>");
    });
    var SX = F.sx(o.lam), SY = F.sy(o.time);
    g.push("<circle cx='" + SX + "' cy='" + SY + "' r='6' fill='var(--accent)' stroke='var(--surface)' stroke-width='2'/>");
    var right = SX < W * 0.55;
    g.push("<text class='num' x='" + (SX + (right ? 10 : -10)) + "' y='" + (SY + 18) + "' text-anchor='" + (right ? "start" : "end") + "' font-size='" + (F.fs + 1) +
      "' font-weight='700' fill='var(--accent-text)' stroke='var(--surface)' stroke-width='4' paint-order='stroke'>" + T("steam.ch1.star", { l: fx(Math.round(o.lam), 0) }) + "</text>");
    svg1.setAttribute("viewBox", "0 0 " + W + " " + H); svg1.setAttribute("height", H); svg1.innerHTML = g.join("");

    // chart 2: speed of each leg against lambda
    var svg2 = document.getElementById("ch2"), W2 = svg2.parentNode.clientWidth || 360, H2 = Math.round(clamp(W2 * 0.62, 220, 290));
    var M2 = { l: 34, r: 14, t: 22, b: 36 };
    var F2 = frame(svg2, W2, H2, M2, [0, xmax], [VMIN - 1, VMAX + 1], xt, [VMIN, 12, 14, VMAX], T("steam.ch1.x"), T("steam.ch2.y"));
    var g2 = F2.g, h = hOf(sc);
    [VMIN, VMAX].forEach(function (b) {
      g2.push("<line x1='" + M2.l + "' x2='" + (W2 - M2.r) + "' y1='" + F2.sy(b) + "' y2='" + F2.sy(b) + "' stroke='var(--ink2)' stroke-width='1.6' stroke-dasharray='6 5'/>");
    });
    g2.push("<line x1='" + F2.sx(o.lam) + "' x2='" + F2.sx(o.lam) + "' y1='" + M2.t + "' y2='" + (H2 - M2.b) + "' stroke='var(--accent)' stroke-width='1.5'/>");
    for (i = 2; i >= 0; i--) {
      var p2 = [];
      for (var j = 0; j <= 160; j++) { var l2 = xmax * j / 160; p2.push(F2.sx(l2).toFixed(1) + "," + F2.sy(vOf(h[i], K[i], l2)).toFixed(1)); }
      g2.push("<polyline points='" + p2.join(" ") + "' fill='none' stroke='" + LEGCOL[i] + "' stroke-width='" + (i === 2 ? 2.5 : 2.2) + "'" + (i === 2 ? " stroke-dasharray='6 4'" : "") + "/>");
    }
    for (i = 0; i < 3; i++) {
      g2.push("<circle cx='" + F2.sx(o.lam) + "' cy='" + F2.sy(o.v[i]) + "' r='5' fill='" + LEGCOL[i] + "' stroke='var(--surface)' stroke-width='2'/>");
    }
    svg2.setAttribute("viewBox", "0 0 " + W2 + " " + H2); svg2.setAttribute("height", H2); svg2.innerHTML = g2.join("");
    document.getElementById("ch2leg").innerHTML = [0, 1, 2].map(function (k) {
      return "<span><i class='sw l" + (k + 1) + "'></i><span>" + (k === 2 ? T("steam.ch2.bal") : T("steam.legShort", { n: k + 1 })) + "</span></span>";
    }).join("") + "<span><i class='sw ld'></i><span>" + T("steam.lg.dead") + "</span></span>";
  }

  /* ---------- page text ---------- */
  function renderText() {
    var h = hOf(state.sc);
    document.getElementById("brief").innerHTML = T("steam.brief", {
      V: usd(VAL[state.sc]), drop: fx((1 - SHARE[1]) * 100, 0), T: fx(TDL, 0), P: usd(P), r: fx(RATE * 100, 2)
    });
    document.getElementById("facts").textContent = T("steam.facts", {
      qL: fx(Q14, 1), qB: fx(Q14 * (1 - CUT), 1), cut: fx(CUT * 100, 0), vmin: fx(VMIN, 0), vmax: fx(VMAX, 0)
    });
    document.getElementById("mdata").textContent = T("steam.model.data", {
      d1: fx(D[0], 0), d2: fx(D[1], 0), d3: fx(D[2], 0), P: usd(P), kL: fx(K[0], 6), kB: fx(K[2], 6), T: fx(TDL, 0),
      vmin: fx(VMIN, 0), vmax: fx(VMAX, 0), h1: fx(h[0], 0), h2: fx(h[1], 0)
    });
    var c = solve("cheap", TDL), e = solve("expensive", TDL);
    document.getElementById("n1").textContent = T("steam.n.p1", { f: fx(1 - CUT, 2), x: fx(Math.cbrt(1 / (1 - CUT)), 3) });
    document.getElementById("n2").textContent = T("steam.n.p2", { vc: kn(c.v[2]), vl: kn(c.v[0]), ve: kn(e.v[0]), vb: kn(e.v[2]) });
    document.getElementById("n3").textContent = T("steam.n.p3", { lc: usd(c.lam), le: usd(e.lam) });
    document.getElementById("n4").innerHTML = T("steam.n.p4");
  }

  /* ---------- events ---------- */
  var segBtns = document.querySelectorAll("#sc-seg button");
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      if (state.sc === b.getAttribute("data-sc")) return;
      state.sc = b.getAttribute("data-sc");
      segBtns.forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      renderText(); renderGame(); renderSolution();
    });
  });
  document.getElementById("reveal").addEventListener("click", function () {
    state.revealed = true; renderGame(); renderSolution();
    document.getElementById("use").focus();
  });
  document.getElementById("use").addEventListener("click", function () {
    var o = solve(state.sc, TDL);
    // the sliders move in steps of 0.1 knots: round each optimal speed down or up, keeping the cheapest plan that is on time
    var best = null;
    for (var m = 0; m < 8; m++) {
      var v = o.v.map(function (x, i) { return clamp(Math.floor(x * 10 + 1e-9) / 10 + ((m >> i) & 1) / 10, VMIN, VMAX); });
      v = v.map(function (x) { return Math.round(x * 10) / 10; });
      var r = plan(state.sc, v);
      if (r.time <= TDL + 1e-9 && (!best || r.C < best.C)) best = { C: r.C, v: v };
    }
    state.v = best ? best.v : o.v.map(function (x) { return clamp(Math.ceil(x * 10 - 1e-9) / 10, VMIN, VMAX); });
    renderGame(); renderSolution();
  });
  document.getElementById("reset").addEventListener("click", function () {
    state.v = [V0, V0, V0]; renderGame(); if (state.revealed) renderSolution();
  });
  var rsT = null, lastW = 0;
  window.addEventListener("resize", function () {
    clearTimeout(rsT);
    rsT = setTimeout(function () {
      var w = document.getElementById("game").clientWidth;
      if (w === lastW) return;
      lastW = w; mapL = null; renderGame(); renderSolution();
    }, 120);
  });

  I18N.onChange(function () {
    renderLegText(); renderText(); mapL = null; renderGame(); renderSolution();
    lastW = document.getElementById("game").clientWidth;
  });
})();
</script>
</body>
</html>
