  }
  function stat(k, v, l, ink) {
    return "<div class='stat'><div class='k'>" + k + "</div><div class='v" + (ink ? " ink" : "") + "'>" + v + "</div><div class='l'>" + l + "</div></div>";
  }
  function renderExamples() {
    var h = "";
    document.getElementById("flat-ex-title").textContent = T("flat.ex.title." + state.sc);
    if (state.sc === "d1") {
      h += stat(T("flat.ex.fp"), num(FN1[0].fp), T("flat.ex.fpL"), true);
      FN1.forEach(function (o) { h += stat(T("flat.ex.fpp", { f: fname(o.k) }), num(o.fpp), T("flat.ex.v." + o.near + "." + o.test)); });
      var rows = FN1.map(function (o) {
        return T("flat.inst1.row", { f: T("flat.tex." + o.k), p: texNum(o.fp), q: texNum(o.fpp), v: T("flat.tb.t." + o.test) });
      }).join(" \\\\ ");
      TeX.set(document.getElementById("flat-inst"), "\\begin{aligned}" + rows + "\\end{aligned}",
        FN1.map(function (o) { return T("flat.inst1.plain", { f: fname(o.k), p: num(o.fp), q: num(o.fpp), v: T("flat.tb.t." + o.test) }); }).join("\n"));
      document.getElementById("flat-ex-check").textContent = T("flat.ex.check.d1");
    } else {
      h += stat(T("flat.ex.gn"), num(Math.max(FN2[0].gn, FN2[1].gn)), T("flat.ex.gnL"), true);
      FN2.forEach(function (o) { h += stat(T("flat.ex.eig", { f: fname(o.k) }), eigs(o.e), T("flat.ex.v2." + o.test)); });
      var M = function (o) { return "\\begin{pmatrix} " + texNum(o.H[0]) + " & " + texNum(o.H[1]) + " \\\\ " + texNum(o.H[1]) + " & " + texNum(o.H[2]) + " \\end{pmatrix}"; };
      var rows2 = FN2.map(function (o) {
        return T("flat.inst2.row", { f: T("flat.tex." + o.k), M: M(o), a: "{" + texNum(o.e[0]) + "}", b: "{" + texNum(o.e[1]) + "}", v: T("flat.ex.word." + (o.test === "sad" ? "sad" : o.near)) });
      }).join(" \\\\[6pt] ");
      TeX.set(document.getElementById("flat-inst"), "\\begin{aligned}" + rows2 + "\\end{aligned}",
        FN2.map(function (o) { return T("flat.inst2.plain", { f: fname(o.k), a: num(o.e[0]), b: num(o.e[1]), v: T("flat.ex.word." + (o.test === "sad" ? "sad" : o.near)) }); }).join("\n"));
      document.getElementById("flat-ex-check").textContent = T("flat.ex.check.d2");
    }
    document.getElementById("flat-stats").innerHTML = h;
  }
  function renderTable() {
    var d1s = state.sc === "d1", h;
    document.getElementById("flat-tb-intro").textContent = T("flat.tb.intro." + state.sc, { n: d1s ? 2 * N1 : N2R * N2A, r: fmt(NR_) });
    if (d1s) {
      h = "<thead><tr><th>" + T("flat.tb.f") + "</th><th class='num wide'>" + T("flat.tb.fp") + "</th><th class='num'>" + T("flat.tb.fpp") +
        "</th><th>" + T("flat.tb.test") + "</th><th>" + T("flat.tb.near") + "</th></tr></thead><tbody>";
      ROWS1.forEach(function (o) {
        h += "<tr><td class='fn'>" + fname(o.k) + "</td><td class='num wide'>" + num(o.fp) + "</td><td class='num'>" + num(o.fpp) + "</td><td class='" +
          (o.test === "inc" ? "q" : "ok") + "'>" + T("flat.tb.t." + o.test) + "</td><td>" + T("flat.tb.n." + o.near) + "<small>" + T("flat.tb.nd1." + o.near) + "</small></td></tr>";
      });
    } else {
      h = "<thead><tr><th>" + T("flat.tb.fxy") + "</th><th class='num wide'>" + T("flat.tb.gn") + "</th><th class='num'>" + T("flat.tb.eig") +
        "</th><th>" + T("flat.tb.test") + "</th><th>" + T("flat.tb.near") + "</th></tr></thead><tbody>";
      ROWS2.forEach(function (o) {
        h += "<tr><td class='fn'>" + fname(o.k) + "</td><td class='num wide'>" + num(o.gn) + "</td><td class='num'>" + eigs(o.e) + "</td><td class='" +
          (o.test === "inc" ? "q" : "ok") + "'>" + T("flat.tb.t." + o.test) + "</td><td>" + T("flat.tb.n." + o.near) + "<small>" + T("flat.tb.nd2." + o.near) + "</small></td></tr>";
      });
    }
    document.getElementById("flat-tb").innerHTML = h + "</tbody>";
    document.getElementById("flat-tb-note").textContent = d1s
      ? T("flat.tb.note.d1", { p: num(ROWS1[3].fp), q: num(ROWS1[3].fpp), r: num(ROWS1[4].fpp) })
      : T("flat.tb.note.d2", { a: pair(ROWS2[3].e[0], ROWS2[3].e[1]), b: pair(ROWS2[4].e[0], ROWS2[4].e[1]) });
  }
  function renderNotes() {
    var r = ROWS1, s = ROWS2;
    document.getElementById("flat-n1").textContent = T("flat.n.p1", { a: num(r[0].fp), b: num(r[1].fp), c: num(r[2].fp) });
    document.getElementById("flat-n2").textContent = T("flat.n.p2", { a: num(r[0].fpp), b: num(r[1].fpp), c: num(r[2].fpp) });
    document.getElementById("flat-n3").textContent = T("flat.n.p3", { q: num(r[3].fpp), p: num(r[3].fp) });
    document.getElementById("flat-n4").textContent = T("flat.n.p4", { o: pair(0, 0), g: num(s[1].gn), a: num(s[1].e[0]), b: num(s[1].e[1]) });
    document.getElementById("flat-n5").textContent = T("flat.n.p5", { b: eigs(s[0].e) });
  }

  var segBtns = document.querySelectorAll("#flat-seg button");
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      if (state.sc === b.getAttribute("data-sc")) return;
      state.sc = b.getAttribute("data-sc");
      segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      renderChapters(); renderScenText(); renderExamples(); renderTable();
      if (A.reducedMotion) { player.seek(DUR); return; }
      player.seek(0); player.play();
    });
  });

  function renderPage() {
    renderChapters(); renderScenText(); renderExamples(); renderTable(); renderNotes();
    hudKey = "";
    player.refresh();
  }
  I18N.onChange(renderPage);
})();
</script>
</body>
</html>
