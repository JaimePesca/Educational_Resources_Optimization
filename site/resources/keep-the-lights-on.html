<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23750014%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27Helvetica,Arial,sans-serif%27 font-size=%2716%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3Ex*%3C/text%3E%3C/svg%3E">
<title>Keep the Lights On</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">

<style>
  .wrap { max-width: 1060px; }

  /* level tabs */
  .levels { display: flex; gap: 8px; flex-wrap: wrap; }
  .lvbtn {
    font: 600 13.5px var(--font-sans); min-height: 36px; padding: 7px 14px; border-radius: 3px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink2); cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .lvbtn[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .lvbtn .st { font-size: 12px; letter-spacing: 0.06em; opacity: 0.9; }

  /* mission */
  .mission { display: grid; gap: 4px; margin-bottom: 14px; }
  .mtitle { font-weight: 700; font-size: 17px; }
  .mbrief { color: var(--ink2); max-width: 78ch; }
  .minit {
    font-size: 13.5px; color: var(--ink2); border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; max-width: 78ch;
  }
  .minit b { color: var(--ink); }
  .sub { font: 400 10.5px var(--font-mono); letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }

  /* plant data table */
  table.data.plants { min-width: 520px; }
  table.data.plants td.num, table.data.plants th.num { text-align: right; font-family: var(--font-mono); font-size: 12.5px; }
  .pname { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; color: var(--ink); }

  /* plant swatches (continuous output: ink and silver shades) */
  .sw.p0 { background: var(--ink2); }
  .sw.p1 { background: var(--mit-silver); }
  .sw.p2 { background: var(--axis); }
  .sw.p3 { background: repeating-linear-gradient(45deg, var(--mit-silver) 0 2px, var(--surface2) 2px 5px); border: 1px solid var(--mit-silver); }
  .sw.band { background: var(--region); border: 1px solid var(--axis); }
  .sw.dem { height: 3px; background: var(--ink); }
  .sw.res { height: 0; border-top: 2px dashed var(--ink2); }
  .sw.uns { background: repeating-linear-gradient(45deg, var(--crit) 0 2px, transparent 2px 5px); border: 1px solid var(--crit); }
  .sw.on { background: var(--accent); }

  /* commitment grid */
  .tblwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.ucgrid { border-collapse: separate; border-spacing: 0; font-size: 13px; width: 100%; }
  table.ucgrid th, table.ucgrid td { padding: 3px; text-align: center; }
  table.ucgrid thead th {
    font: 600 12px var(--font-mono); color: var(--ink2); padding: 4px 3px 6px; border-bottom: 1px solid var(--axis); white-space: nowrap;
  }
  table.ucgrid .rh {
    position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left;
    min-width: 112px; max-width: 150px; padding-right: 8px; font-weight: 600; font-size: 13px; color: var(--ink);
  }
  table.ucgrid thead .rh { font-family: var(--font-sans); color: var(--muted); font-weight: 600; }
  .rowbtn {
    font: 600 13px var(--font-sans); color: var(--ink); background: none; border: none; padding: 4px 0; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; text-align: left; min-height: 34px;
  }
  .rowbtn:hover { color: var(--accent-text); }
  .rowbtn:disabled { cursor: default; color: var(--ink); }
  .initag { display: block; font: 400 10.5px var(--font-mono); color: var(--accent-text); letter-spacing: 0.02em; }
  .cell {
    width: 100%; min-width: 62px; min-height: 52px; border: 1.5px solid var(--border); border-radius: 3px;
    background: var(--surface); color: var(--muted); cursor: pointer; font-family: inherit; padding: 4px 3px;
    display: grid; grid-template-rows: auto auto; justify-items: center; align-content: center; gap: 1px; position: relative;
  }
  button.cell:hover { border-color: var(--accent); }
  .cell .st { font: 600 11px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; }
  .cell .mw { font: 600 12.5px var(--font-mono); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cell .lim { font: 400 10px var(--font-mono); color: var(--muted); margin-left: 2px; }
  .cell.on { border-color: var(--accent); background: var(--sel); }
  .cell.on .st { background: var(--accent); color: var(--on-solid); padding: 0 5px; border-radius: 2px; }
  .cell .su {
    position: absolute; top: 2px; right: 3px; font-size: 10px; color: var(--accent-text); line-height: 1;
  }
  .cell.diff { outline: 2.5px solid var(--mit-bright); outline-offset: 1px; }
  span.cell { cursor: default; }
  table.ucgrid tr.sum th, table.ucgrid tr.sum td {
    font: 400 12px var(--font-mono); color: var(--ink2); white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  table.ucgrid tr.sum th { font-family: var(--font-sans); font-size: 12.5px; }
  table.ucgrid tr.first th, table.ucgrid tr.first td { border-top: 1px solid var(--axis); padding-top: 6px; }
  table.ucgrid td.ok { color: var(--good-text); font-weight: 600; }
  table.ucgrid td.bad { color: var(--crit); font-weight: 600; }
  table.ucgrid tr.dem td { color: var(--ink); font-weight: 600; }

  .gridlegend { font-size: 12.5px; }
  .live { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; }
  .live li { padding-left: 16px; position: relative; color: var(--ink2); }
  .live li::before { content: ""; position: absolute; left: 0; top: 0.55em; width: 8px; height: 8px; background: var(--axis); }
  .live li.bad::before { background: var(--crit); }
  .live li.good::before { background: var(--good); }
  .live b { color: var(--ink); }

  .chartwrap { margin-top: 14px; }
  .chartwrap svg { display: block; width: 100%; height: auto; }

  .stats { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-top: 14px; }
  .stat .v { font-size: 22px; }
  .stat.total { border-color: var(--ink); }
  .stat.total .v { color: var(--ink); }
  .stat.invalid .v { color: var(--crit); }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
  button.btn {
    font: 600 14px var(--font-sans); color: var(--on-solid); background: var(--accent);
    border: none; border-radius: 3px; padding: 10px 18px; min-height: 40px; cursor: pointer;
  }
  button.btn:hover { filter: brightness(1.08); }
  button.btn:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
  button.ghost { background: transparent; color: var(--accent-text); border: 1.5px solid var(--accent-text); }
  button.quiet { background: transparent; color: var(--ink2); border: 1.5px solid var(--border); }

  /* result */
  .result { border-left: 4px solid var(--accent); }
  .verdict { font-weight: 700; font-size: 26px; margin: 0 0 2px; }
  .stars { font-size: 21px; letter-spacing: 4px; color: var(--accent-text); }
  .stars .off { color: var(--axis); }
  .rsub { color: var(--ink2); margin: 4px 0 14px; max-width: 70ch; }
  .rsub b { color: var(--ink); }
  .bars { display: flex; flex-direction: column; gap: 9px; max-width: 620px; }
  .brow { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: center; font-size: 13.5px; }
  .brow .lbl { color: var(--ink2); text-align: right; }
  .btrack { background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; height: 28px; position: relative; overflow: hidden; }
  .bfill { height: 100%; min-width: 2px; }
  .bval {
    position: absolute; top: 50%; left: 0; transform: translateY(-50%); font: 600 12.5px var(--font-mono);
    color: var(--ink); padding: 1px 6px; margin-left: 4px; background: var(--bar-bg); border-radius: 2px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .rextra { margin-top: 14px; color: var(--ink2); font-size: 14.5px; max-width: 74ch; }
  .rextra b { color: var(--ink); }
  .rextra p { margin: 0 0 8px; }
  .optbox { margin-top: 16px; }
  .optbox h3 { font-size: 15px; margin: 0 0 6px; }

  /* model: variable list with type tags */
  .vlist { list-style: none; margin: 8px 0; padding: 0; display: grid; gap: 6px; }
  .vlist li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .vlist code { font-family: var(--font-mono); font-size: 13px; color: var(--ink); }
  .vt {
    font: 600 10.5px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; padding: 1px 6px; border-radius: 2px;
    border: 1px solid currentColor;
  }
  .vt.bin { color: var(--accent-text); }
  .vt.cont { color: var(--ink2); }
  #whatif .body { max-width: none; }
  #whatif .body > p { max-width: 72ch; }
  details .body .ctl { max-width: 520px; margin: 10px 0; }
  details .body .readout { margin: 6px 0 10px; }
  details .body ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
  details .body b { color: var(--ink); }

  @media (max-width: 560px) {
    .brow { grid-template-columns: 84px 1fr; }
    .verdict { font-size: 22px; }
    table.ucgrid .rh { min-width: 92px; max-width: 108px; }
    .rowbtn, table.ucgrid .rh { font-size: 12px; }
    .cell { min-width: 56px; }
  }
</style>
</head>

<header class="topbar">
  <div class="topbar-in">
    <a class="backlink" href="../index.html#learn" data-keep-lang><span aria-hidden="true">←</span> <span data-i18n="nav.backToPath"></span></a>

<div class="wrap">

    <p class="eyebrow" data-i18n-html="uc.eyebrow"></p>

    <p class="lede" data-i18n-html="uc.lede"></p>

    <div class="legend gridlegend">
      <span><i class="sw on"></i><span data-i18n="uc.lg.on"></span></span>

      <span><span class="mono" style="font-family:var(--font-mono);font-size:11px;color:var(--muted)">min / max</span><span data-i18n="uc.lg.lim"></span></span>

  </div>

  <section>

          <li><code>u<sub>g,t</sub></code><span class="vt bin" data-i18n="uc.tag.binary"></span><span data-i18n-html="uc.d1.vu"></span></li>
          <li><code>v<sub>g,t</sub></code><span class="vt bin" data-i18n="uc.tag.binary"></span><span data-i18n-html="uc.d1.vv"></span></li>
          <li><code>p<sub>g,t</sub></code><span class="vt cont" data-i18n="uc.tag.cont"></span><span data-i18n-html="uc.d1.vp"></span></li>
        </ul>
        <div class="formula" data-tex="uc.d1.tex" data-i18n="uc.d1.formula"></div>
        <p data-i18n-html="uc.d1.p2"></p>
        <p data-i18n-html="uc.d1.p3"></p>
      </div>
    </details>
    <details>
      <summary data-i18n="uc.d2.title"></summary>
      <div class="body">
        <p data-i18n-html="uc.d2.p1"></p>
        <p data-i18n-html="uc.d2.p2"></p>
        <p data-i18n-html="uc.d2.p3"></p>
        <p data-i18n-html="uc.d2.p4"></p>

    <details>
      <summary data-i18n="uc.d3.title"></summary>

        <p data-i18n-html="uc.d3.p1"></p>

        <p data-i18n-html="uc.d3.p3"></p>

          <li data-i18n-html="uc.d5.c4"></li>
        </ol>
      </div>
    </details>
  </section>

  <p class="note" data-i18n="uc.footer"></p>

<script>
(function () {
  "use strict";
  var t = I18N.t;
  var H = 3; // hours per period
  var EPS = 1e-9;

  // Illustrative plant data. Output limits in MW, fuel (marginal) cost in $/MWh,
  // no-load cost in $/h while on, start-up cost in $ per start.
  var PLANTS = {
    base: { id: "base", min: 140, max: 400, c: 30, a: 5000, S: 10000, col: 0 },
    cc:   { id: "cc",   min: 100, max: 250, c: 42, a: 400,  S: 8000,  col: 1 },
    eng:  { id: "eng",  min: 20,  max: 100, c: 70, a: 200,  S: 3000,  col: 3 },
    gt:   { id: "gt",   min: 20,  max: 100, c: 90, a: 200,  S: 200,   col: 2 }
  };
  var DAY = [160, 160, 420, 600, 300, 450, 640, 370];
  var LEVELS = [
    { plants: ["base", "cc", "gt"], per: "a", dem: [280, 460, 520, 240], init: [1, 0, 0], reserve: 0 },
    { plants: ["base", "cc", "eng", "gt"], per: "d", dem: DAY, init: [1, 0, 0, 0], reserve: 0 },
    { plants: ["base", "cc", "eng", "gt"], per: "d", dem: DAY, init: [1, 0, 0, 0], reserve: 1.1 }
  ];
  var BASE_S = PLANTS.base.S;

  var $ = function (id) { return document.getElementById(id); };
  var SVGNS = "http://www.w3.org/2000/svg";
  function money(v) { return t("uc.money", { v: I18N.fmt(Math.round(v), 0) }); }
  function mw(v) { return t("uc.mwv", { v: I18N.fmt(v, 0) }); }
  function pname(pl) { return t("uc.pl." + pl.id); }
  function perLabel(L, k) { return t("uc.per." + L.per + "." + k); }
  function plantsOf(L, baseS) {
    return L.plants.map(function (id) {
      var p = Object.assign({}, PLANTS[id]);
      if (id === "base" && baseS != null) p.S = baseS;
      return p;
    });
  }

  // ---- economic dispatch for one period (exact: all committed plants at their minimum, then merit order) ----
  function evalPeriod(pl, on, prev, D, reserve) {
    var G = pl.length, p = [], capOn = 0, minOn = 0, g;
    for (g = 0; g < G; g++) { p.push(0); if (on[g]) { capOn += pl[g].max; minOn += pl[g].min; } }
    var r = { p: p, capOn: capOn, minOn: minOn, kind: "ok", unserved: 0, over: 0, need: reserve ? reserve * D : 0 };
    if (minOn > D + EPS) {
      r.kind = "over"; r.over = minOn - D;
      for (g = 0; g < G; g++) if (on[g]) p[g] = pl[g].min;
    } else if (capOn < D - EPS) {
      r.kind = "short"; r.unserved = D - capOn;
      for (g = 0; g < G; g++) if (on[g]) p[g] = pl[g].max;
    } else {
      var rest = D - minOn;
      for (g = 0; g < G; g++) if (on[g]) p[g] = pl[g].min;
      var order = [];
      for (g = 0; g < G; g++) if (on[g]) order.push(g);
      order.sort(function (x, y) { return pl[x].c - pl[y].c; });
      order.forEach(function (k) {
        var add = Math.min(rest, pl[k].max - pl[k].min);
        p[k] += add; rest -= add;
      });
      if (reserve && capOn < reserve * D - EPS) r.kind = "reserve";
    }
    r.fuel = 0; r.noload = 0; r.start = 0; r.starts = 0;
    for (g = 0; g < G; g++) {
      if (!on[g]) continue;
      r.fuel += pl[g].c * p[g] * H;
      r.noload += pl[g].a * H;
      if (!prev[g]) { r.start += pl[g].S; r.starts++; }
    }
    r.cost = r.fuel + r.noload + r.start;
    r.valid = r.kind === "ok";
    return r;
  }

  // plan[g][t] in {0,1}
  function evalPlan(L, pl, plan) {
    var T = L.dem.length, G = pl.length, prev = L.init.slice(), out = [];
    var tot = { fuel: 0, noload: 0, start: 0, starts: 0, cost: 0, bad: 0 };
    for (var tt = 0; tt < T; tt++) {
      var on = [];
      for (var g = 0; g < G; g++) on.push(plan[g][tt] ? 1 : 0);
      var r = evalPeriod(pl, on, prev, L.dem[tt], L.reserve);
      out.push(r);
      tot.fuel += r.fuel; tot.noload += r.noload; tot.start += r.start; tot.starts += r.starts; tot.cost += r.cost;
      if (!r.valid) tot.bad++;
      prev = on;
    }
    tot.valid = tot.bad === 0;
    return { per: out, tot: tot };
  }

  // ---- exact optimum: dynamic programming over periods, state = set of plants that are on ----
  function bits(mask, G) { var a = []; for (var g = 0; g < G; g++) a.push((mask >> g) & 1); return a; }
  function solveDP(L, pl) {
    var G = pl.length, N = 1 << G, T = L.dem.length, s, q, tt, g;
    var initMask = 0;
    for (g = 0; g < G; g++) if (L.init[g]) initMask |= 1 << g;
    // period cost without start-ups (start-ups are added on the transitions)
    var pc = [];
    for (tt = 0; tt < T; tt++) {
      var row = [];
      for (s = 0; s < N; s++) {
        var on = bits(s, G);
        var r = evalPeriod(pl, on, on, L.dem[tt], L.reserve);
        row.push(r.valid ? r.fuel + r.noload : Infinity);
      }
      pc.push(row);
    }
    var stc = [];
    for (q = 0; q < N; q++) {
      stc.push([]);
      for (s = 0; s < N; s++) {
        var c = 0;
        for (g = 0; g < G; g++) if (((s >> g) & 1) && !((q >> g) & 1)) c += pl[g].S;
        stc[q].push(c);
      }
    }
    var best = [], par = [];
    for (tt = 0; tt < T; tt++) {
      var b = [], pr = [];
      for (s = 0; s < N; s++) {
        var bv = Infinity, bp = -1;
        if (pc[tt][s] < Infinity) {
          if (tt === 0) { bv = stc[initMask][s] + pc[0][s]; bp = initMask; }
          else {
            for (q = 0; q < N; q++) {
              if (best[tt - 1][q] === Infinity) continue;
              var v = best[tt - 1][q] + stc[q][s] + pc[tt][s];
              if (v < bv - 1e-6) { bv = v; bp = q; }
            }
          }
        }
        b.push(bv); pr.push(bp);
      }
      best.push(b); par.push(pr);
    }
    var fs = -1, fv = Infinity;
    for (s = 0; s < N; s++) if (best[T - 1][s] < fv - 1e-6) { fv = best[T - 1][s]; fs = s; }
    var masks = [];
    for (tt = T - 1; tt >= 0; tt--) { masks.unshift(fs); fs = par[tt][fs]; }
    var plan = [];
    for (g = 0; g < G; g++) plan.push(masks.map(function (m) { return (m >> g) & 1; }));
    return { cost: fv, plan: plan };
  }

  // ---- priority list heuristic: plants ranked by average cost at full output (c + a / Pmax);
  // in each period, switch plants on down the list until capacity covers demand (or the reserve),
  // skipping a plant whose minimum would push the total minimum above demand.
  function priorityPlan(L, pl) {
    var G = pl.length, T = L.dem.length;
    var order = pl.map(function (p, g) { return g; }).sort(function (x, y) {
      return (pl[x].c + pl[x].a / pl[x].max) - (pl[y].c + pl[y].a / pl[y].max);
    });
    var plan = pl.map(function () { return []; });
    for (var tt = 0; tt < T; tt++) {
      var D = L.dem[tt], need = (L.reserve || 1) * D, cap = 0, mn = 0, on = pl.map(function () { return 0; });
      for (var i = 0; i < order.length; i++) {
        var g = order[i];
        if (cap >= need - EPS) break;
        if (mn + pl[g].min > D + EPS) continue;
        on[g] = 1; cap += pl[g].max; mn += pl[g].min;
      }
      for (var k = 0; k < G; k++) plan[k].push(on[k]);
    }
    return plan;
  }

  // ---- state ----
  var lv = 0, phase = ["plan", "plan", "plan"], showOpt = false, attempts = [0, 0, 0];
  var starsBy = [null, null, null];
  var plans = LEVELS.map(function (L) { return L.plants.map(function () { return L.dem.map(function () { return 0; }); }); });

  function L() { return LEVELS[lv]; }

  function optimum(i) {

      var Lx = LEVELS[i], pl = plantsOf(Lx);
      var o = solveDP(Lx, pl);
      var pp = priorityPlan(Lx, pl);
      cache["opt" + i] = { opt: o, ev: evalPlan(Lx, pl, o.plan), prio: evalPlan(Lx, pl, pp), prioPlan: pp };
    }
    return cache["opt" + i];
  }

  // ---- stacked output chart ----
  function drawChart(svg, Lx, pl, ev, ariaKey) {
    var host = svg.parentNode;
    var W = Math.max(280, Math.round(host.clientWidth || 600));
    var Hh = W < 520 ? 230 : 260;
    svg.textContent = "";
    svg.setAttribute("viewBox", "0 0 " + W + " " + Hh);
    svg.setAttribute("width", W); svg.setAttribute("height", Hh);
    svg.setAttribute("aria-label", t(ariaKey || "uc.chartAria"));
    var T = Lx.dem.length, G = pl.length;
    var padL = 44, padR = 8, padT = 12, padB = 26;
    var ymax = 0;
    ev.per.forEach(function (r, k) {
      var stack = r.p.reduce(function (a, b) { return a + b; }, 0);
      ymax = Math.max(ymax, stack, r.capOn, Lx.dem[k] * (Lx.reserve || 1));
    });
    ymax = Math.ceil((ymax + 20) / 100) * 100;
    var plotH = Hh - padT - padB, slot = (W - padL - padR) / T;
    var y = function (v) { return padT + plotH - v / ymax * plotH; };
    // patterns
    var defs = svgEl("defs", {});
    var pat = svgEl("pattern", { id: svg.id + "-hEng", width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" });
    pat.appendChild(svgEl("rect", { width: 6, height: 6 }, "fill:var(--surface2)"));
    pat.appendChild(svgEl("rect", { width: 2.5, height: 6 }, "fill:var(--mit-silver)"));
    defs.appendChild(pat);
    var pc = svgEl("pattern", { id: svg.id + "-hCrit", width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" });
    pc.appendChild(svgEl("rect", { width: 2, height: 6 }, "fill:var(--crit)"));
    defs.appendChild(pc);
    svg.appendChild(defs);
    var fills = ["fill:var(--ink2)", "fill:var(--mit-silver)", "fill:var(--axis)", "fill:url(#" + svg.id + "-hEng)"];
    // grid lines and y labels
    var step = ymax > 600 ? 200 : 100;
    for (var v = 0; v <= ymax; v += step) {
      svg.appendChild(svgEl("line", { x1: padL, x2: W - padR, y1: y(v), y2: y(v) }, "stroke:var(--grid);stroke-width:1"));
      var tl = svgEl("text", { x: padL - 6, y: y(v) + 4, "text-anchor": "end" }, "fill:var(--muted);font:11px var(--font-mono)");
      tl.textContent = I18N.fmt(v, 0);
      svg.appendChild(tl);
    }
    var yl = svgEl("text", { x: 4, y: padT - 2 }, "fill:var(--muted);font:10px var(--font-mono)");
    yl.textContent = t("uc.mw");
    svg.appendChild(yl);
    var shortLbl = slot < 44;
    for (var k = 0; k < T; k++) {
      var r = ev.per[k], cx = padL + slot * (k + 0.5);
      var bw = Math.min(46, slot * 0.52), band = Math.min(70, slot * 0.84);
      // range the committed plants can produce: [sum of minimums, sum of maximums]
      if (r.capOn > 0) {
        svg.appendChild(svgEl("rect", { x: cx - band / 2, y: y(r.capOn), width: band, height: Math.max(0, y(r.minOn) - y(r.capOn)) },
          "fill:var(--region);stroke:var(--axis);stroke-width:1"));
      }
      var acc = 0;
      for (var g = 0; g < G; g++) {
        if (r.p[g] <= 0) continue;
        svg.appendChild(svgEl("rect", { x: cx - bw / 2, y: y(acc + r.p[g]), width: bw, height: y(acc) - y(acc + r.p[g]) },
          fills[pl[g].col] + ";stroke:var(--surface);stroke-width:1"));
        acc += r.p[g];
      }
      var D = Lx.dem[k];
      if (r.kind === "short") {
        svg.appendChild(svgEl("rect", { x: cx - bw / 2, y: y(D), width: bw, height: y(acc) - y(D) },
          "fill:url(#" + svg.id + "-hCrit);stroke:var(--crit);stroke-width:1.5"));
      } else if (r.kind === "over") {
        svg.appendChild(svgEl("rect", { x: cx - bw / 2 - 2, y: y(acc), width: bw + 4, height: y(D) - y(acc) },
          "fill:url(#" + svg.id + "-hCrit);stroke:var(--crit);stroke-width:1.5"));
      }
      if (Lx.reserve) {
        svg.appendChild(svgEl("line", { x1: cx - band / 2, x2: cx + band / 2, y1: y(Lx.reserve * D), y2: y(Lx.reserve * D) },
          "stroke:" + (r.kind === "reserve" ? "var(--crit)" : "var(--ink2)") + ";stroke-width:2;stroke-dasharray:4 3"));
      }
      svg.appendChild(svgEl("line", { x1: cx - band / 2, x2: cx + band / 2, y1: y(D), y2: y(D) }, "stroke:var(--halo);stroke-width:6"));
      svg.appendChild(svgEl("line", { x1: cx - band / 2, x2: cx + band / 2, y1: y(D), y2: y(D) }, "stroke:var(--ink);stroke-width:2.5"));
      var lb = svgEl("text", { x: cx, y: Hh - 8, "text-anchor": "middle" }, "fill:var(--ink2);font:" + (shortLbl ? 10 : 11) + "px var(--font-mono)");
      var lab = perLabel(Lx, k);
      lb.textContent = shortLbl ? lab.split("-")[0] : lab;
      svg.appendChild(lb);
      if (r.kind !== "ok") {
        var mk = svgEl("text", { x: cx, y: Math.max(padT + 10, Math.min(y(acc), y(D), y(r.need || 0)) - 4), "text-anchor": "middle" }, "fill:var(--crit);font:700 13px var(--font-sans)");
        mk.textContent = "!";
        svg.appendChild(mk);
      }
    }
  }

  function starsFor(ev, optCost) {
    if (!ev.tot.valid) return 0;
    var ratio = ev.tot.cost / optCost;
    return ratio <= 1 + 1e-9 ? 3 : ratio <= 1.02 ? 2 : 1;
  }

  function renderResult() {
    var box = $("result");
    if (phase[lv] !== "done") { box.hidden = true; return; }
    box.hidden = false;
    var Lx = L(), pl = PL(), O = optimum(lv);
    var ev = evalPlan(Lx, pl, plans[lv]);
    var stars = starsFor(ev, O.opt.cost);
    $("verdict").textContent = t("uc.verdict." + stars);
    $("stars").setAttribute("aria-label", t("uc.starsAria", { n: stars }));
    $("stars").innerHTML = "★".repeat(stars) + '<span class="off">' + "★".repeat(3 - stars) + "</span>";
    var pct = ev.tot.valid ? (ev.tot.cost / O.opt.cost - 1) * 100 : 0;
    if (!ev.tot.valid) $("rsub").innerHTML = t("uc.rsub.bad", { n: ev.tot.bad });
    else if (stars === 3) $("rsub").innerHTML = t("uc.rsub.opt", { mine: money(ev.tot.cost) });
    else $("rsub").innerHTML = t("uc.rsub.valid", { mine: money(ev.tot.cost), opt: money(O.opt.cost), pct: I18N.fmt(pct, 2, 1) });

    var bars = $("bars"); bars.textContent = "";
    var mx = Math.max(ev.tot.valid ? ev.tot.cost : 0, O.prio.tot.cost, O.opt.cost);
    barsRow(bars, t("uc.bar.mine"), ev.tot.valid ? ev.tot.cost : null, mx, "var(--ink2)", ev.tot.valid ? money(ev.tot.cost) : t("uc.bar.invalid"));
    barsRow(bars, t("uc.bar.prio"), O.prio.tot.cost, mx, "var(--mit-silver)", money(O.prio.tot.cost));
    barsRow(bars, t("uc.bar.opt"), O.opt.cost, mx, "var(--accent)", money(O.opt.cost));

    var prioPct = (O.prio.tot.cost / O.opt.cost - 1) * 100;
    var html = "<p>" + t("uc.extra.prio", { v: money(O.prio.tot.cost), pct: I18N.fmt(prioPct, 2, 1) }) + "</p>";
    if (ev.tot.valid) {
      if (ev.tot.cost < O.prio.tot.cost - EPS) html += "<p>" + t("uc.extra.beat") + "</p>";
      else if (Math.abs(ev.tot.cost - O.prio.tot.cost) < EPS) html += "<p>" + t("uc.extra.same") + "</p>";
      else html += "<p>" + t("uc.extra.lost") + "</p>";
    }
    $("rextra").innerHTML = html;

    var ob = $("optbox");
    ob.hidden = !showOpt;
    $("showopt").textContent = t(showOpt ? "uc.btn.hideOpt" : "uc.btn.showOpt");
    $("showopt").setAttribute("aria-pressed", showOpt ? "true" : "false");
    if (showOpt) {
      var nd = 0;
      O.opt.plan.forEach(function (row, g) { row.forEach(function (x, k) { if (!!x !== !!plans[lv][g][k]) nd++; }); });
      $("opthead").textContent = t(nd ? "uc.optHead" : "uc.optHeadSame", { n: nd, cost: money(O.opt.cost) });
      renderGrid($("optgrid"), Lx, pl, O.opt.plan, O.ev, { diff: plans[lv] });
      drawChart($("optchart"), Lx, pl, O.ev, "uc.optChartAria");
      $("insight").innerHTML = t("uc.lv" + (lv + 1) + ".insight");
    }
    $("next").hidden = lv >= LEVELS.length - 1;
  }

  // ---- what-if: base plant start-up cost ----
  function renderWhatIf() {
    var S = +$("wsS").value, Lx = L();
    $("wsOut").textContent = money(S);
    var pl = plantsOf(Lx, S);
    var o = solveDP(Lx, pl), ev = evalPlan(Lx, pl, o.plan);
    var ref = optimum(lv).opt.plan;
    var nd = 0;
    o.plan.forEach(function (row, g) { row.forEach(function (x, k) { if (!!x !== !!ref[g][k]) nd++; }); });
    var baseStarts = 0;
    o.plan[0].forEach(function (x, k) { var prev = k === 0 ? Lx.init[0] : o.plan[0][k - 1]; if (x && !prev) baseStarts++; });
    $("wsRead").innerHTML = t("uc.d4.read", { lv: lv + 1, cost: money(o.cost), n: baseStarts });
    renderGrid($("wsGrid"), Lx, pl, o.plan, ev, { diff: ref });
    $("wsMsg").innerHTML = S === BASE_S ? t("uc.d4.ref") : nd ? t("uc.d4.changed", { n: nd, s: money(BASE_S) }) : t("uc.d4.same", { s: money(BASE_S) });
  }

  function renderAll() {
    renderLevels(); renderBoard(); renderResult(); renderWhatIf();
  }

  // ---- actions ----
  $("check").addEventListener("click", function () {
    attempts[lv]++;
    phase[lv] = "done"; showOpt = false;
    var O = optimum(lv), ev = evalPlan(L(), PL(), plans[lv]);
    var st = starsFor(ev, O.opt.cost);
    if (starsBy[lv] == null || st > starsBy[lv]) { starsBy[lv] = st; saveStars(); }
    renderAll();
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    $("result").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" });
  });
  $("clear").addEventListener("click", function () {
    plans[lv] = L().plants.map(function () { return L().dem.map(function () { return 0; }); });
    renderBoard();
  });
  $("retry").addEventListener("click", function () { phase[lv] = "plan"; showOpt = false; renderAll(); $("grid").scrollIntoView({ block: "nearest" }); });
  $("next").addEventListener("click", function () {
    if (lv < LEVELS.length - 1) { lv++; showOpt = false; renderAll(); window.scrollTo({ top: 0 }); }
  });
  $("showopt").addEventListener("click", function () { showOpt = !showOpt; renderResult(); });
  $("wsS").addEventListener("input", renderWhatIf);

  var rt = null;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () { renderBoard(); renderResult(); }, 120);
  });
  // redraw when the theme changes (SVG uses CSS variables, so only the layout needs it)
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", function () { renderBoard(); renderResult(); });
  }

  // exposed for automated checks
  window.UC = { levels: LEVELS, plantsOf: plantsOf, solveDP: solveDP, evalPlan: evalPlan, priorityPlan: priorityPlan };

  I18N.onChange(renderAll);
})();
</script>
</body>
</html>
