<script>
(function () {
  "use strict";
  var T = I18N.t;
  var MINUS = "−";
  var fmt = function (v, d, m) { if (Math.abs(v) < 5e-10) v = 0; return I18N.fmt(v, d == null ? 1 : d, m); };
  var signed = function (v, d, m, neg, pos) { var s = fmt(Math.abs(v), d, m); return s === fmt(0, d, m) ? s : (v < 0 ? neg : pos) + s; };
  var f1 = function (v) { return fmt(v, 1, 1); };             // money values: one decimal
  var f0 = function (v) { return fmt(v, 0); };                // payoffs: integers
  var fp = function (v) { return fmt(v, 2); };                // probabilities
  var f4 = function (v) { return fmt(v, 4, 4); };             // utilities
  var sg1 = function (v) { return signed(v, 1, 1, MINUS, "+"); };

  /* ---------- the tree (illustrative, plausible data; millions of COP for one container lot) ---------- */
  var P_OK = 0.8, P_HI = 0.6, R_AV = 250;
  var NODES = {
    D1: { t: "d", kids: [["C1", "export"], ["L6", "local"]] },
    C1: { t: "c", kids: [["C2", "ok", P_OK], ["D2", "rej", 1 - P_OK]] },
    C2: { t: "c", kids: [["L1", "hi", P_HI], ["L2", "lo", 1 - P_HI]] },
    D2: { t: "d", kids: [["C3", "cert"], ["L5", "disc"]] },
    C3: { t: "c", kids: [["L3", "hi", P_HI], ["L4", "lo", 1 - P_HI]] },
    L1: { t: "l", x: 880 }, L2: { t: "l", x: 400 }, L3: { t: "l", x: 740 },
    L4: { t: "l", x: 220 }, L5: { t: "l", x: 420 }, L6: { t: "l", x: 600 }
  };
  var LEAVES = ["L1", "L2", "L3", "L4", "L5", "L6"];
  var INNER = ["D1", "C1", "C2", "D2", "C3"];
  var PARENT = {};
  Object.keys(NODES).forEach(function (id) { (NODES[id].kids || []).forEach(function (k, i) { PARENT[k[0]] = { id: id, i: i, br: k[1], p: k[2] }; }); });
  function util(x, R) { return 1 - Math.exp(-x / R); }
  // rollback: neutral (R = Infinity) rolls back money, otherwise expected utility. For every node:
  // v (EV or EU), ce (certainty equivalent; = EV when neutral), ev (EV under the chosen strategy), best (decision)
  function rollback(R) {
    var neutral = !isFinite(R), out = {};
    (function go(id) {
      var n = NODES[id], r;
      if (n.t === "l") r = { v: neutral ? n.x : util(n.x, R), ev: n.x };
      else {
        var ks = n.kids.map(function (k) { return go(k[0]); });
        if (n.t === "c") {
          r = { v: 0, ev: 0 };
          n.kids.forEach(function (k, i) { r.v += k[2] * ks[i].v; r.ev += k[2] * ks[i].ev; });
        } else {
          var b = 0;
          ks.forEach(function (s, i) { if (s.v > ks[b].v) b = i; });
          r = { v: ks[b].v, ev: ks[b].ev, best: b };
        }
      }
      r.ce = neutral ? r.v : -R * Math.log(1 - r.v);
      out[id] = r;
      return r;
    })("D1");
    return out;
  }
  var cache = {};
  function scen(key) {
    if (cache[key]) return cache[key];
    var R = key === "neutral" ? Infinity : R_AV;
    return (cache[key] = { key: key, R: R, neutral: key === "neutral", rb: rollback(R) });
  }
  // strategy outcome lottery (for the probability of ending below the sure local sale)
  function lottery(rb) {
    var out = [];
    (function go(id, p) {
      var n = NODES[id];
      if (n.t === "l") { out.push([p, n.x]); return; }
      if (n.t === "d") { go(n.kids[rb[id].best][0], p); return; }
      n.kids.forEach(function (k) { go(k[0], p * k[2]); });
    })(NODES.D1.kids[0][0], 1);                   // the export branch
    return out;
  }
  function bisect(g, lo, hi) {                   // g(lo) < 0 < g(hi)
    for (var i = 0; i < 200; i++) { var m = (lo + hi) / 2; if (g(m) < 0) lo = m; else hi = m; }
    return (lo + hi) / 2;
  }
  var state = { sc: "neutral" };

  /* =====================================================================================
     "See it in motion". Every value is computed by the rollback above; the layout, the
     moving dots and the timing are illustrative.
     ===================================================================================== */
  var A = window.Anim, E = A.ease, seg = A.seg, lerp = A.lerp, clamp = A.clamp;
  var root = document.getElementById("dt-anim");

            ctx.beginPath(); ctx.moveTo(pb[0], pb[1]); ctx.lineTo(pa[0], pa[1]); ctx.stroke();
          }
          var h = pointAt(path, ue);
          ctx.globalAlpha = a; ctx.fillStyle = C.surface; circle(h[0], h[1], rad + 1.5); ctx.fill();
          ctx.fillStyle = C.accent; circle(h[0], h[1], rad); ctx.fill();
          ctx.globalAlpha = 1; ctx.lineCap = "butt";
        }
      });
    });
  }
  function childPoint(kid) { var K = L.P[kid]; return NODES[kid].t === "l" ? [K.x - L.tri * 0.5, K.y] : [K.x, K.y]; }
  function drawDecisionFlow(S, t) {
    ["D2", "D1"].forEach(function (id) {
      var ph = decPhase(id, t);
      // compare: rings around both children
      if (ph.cmp > 0) {
        NODES[id].kids.forEach(function (k, i) {
          var c = childPoint(k[0]), win = S.rb[id].best === i, rr = (L.portrait ? 12 : 16) + 3 * Math.sin(ph.cmp * Math.PI * 2);
          ring(c[0], c[1], rr, win && ph.slash > 0 ? C.accent : C.ink, 2, ph.cmp * 0.8);
        });
      }
      // the winner's value travels back to the decision node
      if (ph.fly > 0 && ph.fly < 1) {
        var kid = NODES[id].kids[S.rb[id].best][0], path = revPath(kid), p = pointAt(path, ph.fly);
        var txt = S.neutral ? f1(S.rb[kid].v) : f1(S.rb[kid].ce);
        ctx.font = font(700, L.fVal);
        var w = ctx.measureText(txt).width + 10, h = L.fVal + 6;
        ctx.globalAlpha = Math.min(1, ph.fly * 5) * (1 - seg(ph.fly, 0.85, 1));
        ctx.fillStyle = C.accent; ctx.fillRect(p[0] - w / 2, p[1] - h / 2, w, h);
        ctx.fillStyle = C["on-solid"]; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(txt, p[0], p[1] + 0.5);
        ctx.globalAlpha = 1;
      }
    });
  }

  /* ---------- inset (desktop): the value of money, u(x) or x itself ---------- */
  function drawInset(S, t) {
    var B = L.inset;
    if (!B) return;
    var a = E.out(seg(t, 9.2, 10.0));
    if (a <= 0) return;
    var XMAX = 1000, fs = 10.5;
    var px0 = B.x + 34, px1 = B.x + B.w - 10, py0 = B.y + 12, py1 = B.y + B.h - 24;
    var X = function (x) { return px0 + x / XMAX * (px1 - px0); };
    var yOf = function (x) { return S.neutral ? x / XMAX : util(x, S.R); };
    var ymax = S.neutral ? 1 : 1;
    var Y = function (v) { return py1 - v / ymax * (py1 - py0); };
    ctx.save(); ctx.globalAlpha = a;
    // axes and ticks
    ctx.strokeStyle = C.axis; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px0, py0 - 4); ctx.lineTo(px0, py1); ctx.lineTo(px1 + 4, py1); ctx.stroke();
    ctx.font = font(400, fs, true); ctx.fillStyle = C.muted;
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    [0, 500, 1000].forEach(function (x) { ctx.fillText(f0(x), X(x), py1 + 4); });
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    (S.neutral ? [[0, f0(0)], [0.5, f0(500)], [1, f0(1000)]] : [[0, fmt(0, 1)], [0.5, fmt(0.5, 1)], [1, fmt(1, 1)]]).forEach(function (q) { ctx.fillText(q[1], px0 - 5, Y(q[0])); });
    // the curve
    var u = E.inOut(seg(t, 9.3, 10.8)), n = 80;
    ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.beginPath();
    for (var i = 0; i <= Math.round(n * u); i++) { var x = XMAX * i / n; if (i) ctx.lineTo(X(x), Y(yOf(x))); else ctx.moveTo(X(x), Y(yOf(x))); }
    ctx.stroke();
    ctx.font = font(700, fs + 0.5); ctx.fillStyle = C.ink; ctx.textAlign = "right"; ctx.textBaseline = "bottom";
    ctx.globalAlpha = a * seg(t, 10.4, 11);
    ctx.fillText(T(S.neutral ? "dtree.l.v" : "dtree.l.u"), px1, Y(yOf(XMAX)) - (S.neutral ? 8 : 6));
    ctx.globalAlpha = a;
    ctx.font = font(400, fs); ctx.fillStyle = C.muted; ctx.textAlign = "right"; ctx.textBaseline = "top";
    // the endings rise from the axis to the curve as they are valued
    LEAVES.forEach(function (id) {
      var v = seg(t, VAL[id], VAL[id] + 0.7);
      if (v <= 0) return;
      var x = NODES[id].x, yy = lerp(0, yOf(x), E.out(v));
      ctx.strokeStyle = C["mit-silver"]; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(X(x), py1); ctx.lineTo(X(x), Y(yy)); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = v < 1 ? HOT : C.ink; circle(X(x), Y(yy), 3.2); ctx.fill();
    });
    // once the export branch is solved: its EU read back as a CE on the axis (averse), or its EV (neutral)
    var ex = S.rb.C1, sa = E.out(seg(t, doneT("C1") - 0.2, doneT("C1") + 0.6));
    if (sa > 0) {
      ctx.globalAlpha = a * sa;
      var yv = S.neutral ? ex.v / XMAX : ex.v;
      ctx.strokeStyle = C.accent; ctx.lineWidth = 1.4; ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.moveTo(px0, Y(yv)); ctx.lineTo(X(ex.ce), Y(yv)); ctx.lineTo(X(ex.ce), py1); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = C.accent; circle(X(ex.ce), Y(yv), 4); ctx.fill();
      ctx.font = font(700, fs); ctx.fillStyle = C["accent-text"]; ctx.textBaseline = "bottom";
      if (S.neutral) {
        ctx.textAlign = "right"; ctx.fillText(T("dtree.l.ev"), X(ex.ce) - 6, Y(yv) - 3);
      } else {
        // CE and, on the axis, the EV of the same strategy: the gap is the risk premium
        ctx.textAlign = "right"; ctx.fillText(T("dtree.l.ce"), X(ex.ce) - 4, py1 - 3);
        ctx.fillStyle = C.surface; circle(X(ex.ev), py1, 4); ctx.fill();
        ctx.strokeStyle = C.ink; ctx.lineWidth = 1.6; circle(X(ex.ev), py1, 4); ctx.stroke();
        ctx.fillStyle = C.ink; ctx.textAlign = "left"; ctx.fillText(T("dtree.l.ev"), X(ex.ev) + 5, py1 - 3);
      }
    }
    // the sure local sale, compared at the root
    var la = E.out(seg(t, SOLVE.D1, SOLVE.D1 + 0.8));
    if (la > 0) {
      var xl = NODES.L6.x, win = S.rb.D1.best === 1;
      ctx.globalAlpha = a * la;
      ctx.fillStyle = win ? C.accent : C.ink; circle(X(xl), Y(yOf(xl)), 4.5); ctx.fill();
      ctx.strokeStyle = C.surface; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.font = font(700, fs); ctx.fillStyle = win ? C["accent-text"] : C.ink;
      // neutral: under the line (the EV guide runs above it); averse: above the curve, left of the point
      if (S.neutral) { ctx.textAlign = "left"; ctx.textBaseline = "top"; ctx.fillText(T("dtree.l.local"), X(xl) + 6, Y(yOf(xl)) + 4); }
      else { ctx.textAlign = "right"; ctx.textBaseline = "bottom"; ctx.fillText(T("dtree.l.local"), X(xl) - 6, Y(yOf(xl)) - 4); }
    }
    ctx.restore();
  }

  /* ---------- caption (top left, under the counters) ---------- */
  function actName(S, id) { var k = NODES[id].kids[S.rb[id].best][1]; return T("dtree.act." + k); }
  function vOf(S, id) { return f1(S.neutral ? S.rb[id].v : S.rb[id].ce); }
  function captions(S, t) {
    var k = S.key, R = f0(S.R);
    if (t < CH[1]) return [T("dtree.cap1"), T("dtree.cap1.sub")];
    if (t < CH[2]) return [T("dtree.cap2." + k), T("dtree.cap2." + k + ".sub", { R: R })];
    if (t < CH[3]) return [T("dtree.cap3." + k), T("dtree.cap3." + k + ".sub")];
    if (t < CH[4]) {
      var b = S.rb.D2.best;
      return [T("dtree.cap4"), T("dtree.cap4.sub", { act: actName(S, "D2"), v: vOf(S, NODES.D2.kids[b][0]), w: vOf(S, NODES.D2.kids[1 - b][0]) })];
    }
    return [T("dtree.cap5", { act: T("dtree.act." + NODES.D1.kids[S.rb.D1.best][1]) }), T("dtree.cap5." + k + ".sub", { x: vOf(S, "C1"), f: vOf(S, "L6") })];
  }
  function wrap(s, maxW) {
    var words = String(s).split(" "), lines = [], cur = "";
    words.forEach(function (w) {
      var tr = cur ? cur + " " + w : w;
      if (ctx.measureText(tr).width > maxW && cur) { lines.push(cur); cur = w; } else cur = tr;
    });
    if (cur) lines.push(cur);
    return lines;
  }
  function drawCaption(S, t) {
    var ci = 0; CH.forEach(function (c, k) { if (t >= c) ci = k; });
    var a = ci === 0 ? seg(t, 0.4, 1.1) : seg(t, CH[ci] + 0.15, CH[ci] + 0.8);
    if (ci < CH.length - 1) a *= 1 - seg(t, CH[ci + 1] - 0.45, CH[ci + 1] - 0.05);
    if (t >= DUR - 1e-6) a = 1;
    if (a <= 0) return;
    var lines = captions(S, t), x = L.capX, y = L.capY, maxW = L.capW - 12;
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = C.accent; ctx.fillRect(x, y - L.ft + 2, 3, L.ft + 1);
    ctx.font = font(700, L.ft); ctx.fillStyle = C.ink; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    var tl = wrap(lines[0], maxW);
    tl.forEach(function (s, k) { ctx.fillText(s, x + 10, y + k * (L.ft + 3), maxW); });
    y += (tl.length - 1) * (L.ft + 3) + L.fs + 6;
    ctx.font = font(400, L.fs + (L.portrait ? 0 : 1)); ctx.fillStyle = C.ink2;
    wrap(lines[1], maxW).forEach(function (s) { ctx.fillText(s, x + 10, y, maxW); y += L.fs + 5; });
    ctx.restore();
  }

  /* ---------- HUD chips ---------- */
  var chips = [0, 1, 2, 3, 4, 5].map(function (i) {
    var el = document.getElementById("dt-c" + i);
    return { el: el, b: el.querySelector("b"), s: el.querySelector("span"), v: null, l: null, o: null, k: null };
  });
  function setChip(i, val, lab, op, kind) {
    var c = chips[i];
    op = Math.round(clamp(op, 0, 1) * 20) / 20;
    if (c.v !== val) { c.b.textContent = val; c.v = val; }
    if (c.l !== lab) { c.s.textContent = lab; c.l = lab; }
    if (c.o !== op) { c.el.style.opacity = op; c.o = op; }
    if (c.k !== kind) { c.el.classList.toggle("accent", kind === "acc"); c.el.classList.toggle("bad", kind === "bad"); c.k = kind; }
  }
  function hud(S, t) {
    var solved = INNER.filter(function (id) { return t >= doneT(id); }).length;
    setChip(0, T("dtree.k.frac", { n: solved, m: INNER.length }), T("dtree.k.solved"), seg(t, 17.6, 18.1), "");
    setChip(1, f1(S.rb.L6.ce), T("dtree.k.local"), seg(t, POP.L6, POP.L6 + 0.4), "");
    var ev = S.neutral ? "ev" : "ce", dC1 = doneT("C1");
    setChip(2, f1(S.rb.C1.ce), T("dtree.k.export." + ev), seg(t, dC1 - 0.35, dC1), "");
    var gap = S.rb.C1.ce - S.rb.L6.ce;
    setChip(3, sg1(gap), T("dtree.k.gap"), seg(t, SOLVE.D1 + 0.2, SOLVE.D1 + 0.7), gap < 0 ? "bad" : "");
    var dR = doneT("D1");
    setChip(4, f1(S.rb.D1.ce), T("dtree.k.root." + ev), seg(t, dR - 0.4, dR), "acc");
    setChip(5, T("dtree.act." + NODES.D1.kids[S.rb.D1.best][1]), T("dtree.k.move"), seg(t, dR - 0.4, dR), "acc");
  }

  /* ---------- the frame ---------- */
  function render(t) {
    C = A.colors();
    HOT = C.accent.toLowerCase() === C["mit-bright"].toLowerCase() ? C.crit : C["mit-bright"];
    var S = scen(state.sc);
    hud(S, t);
    if (hudKey !== cv.w + "x" + cv.h + ":" + hudEl.offsetHeight + ":" + hudEl.offsetWidth) layout();
    ctx.clearRect(0, 0, L.W, L.H);
    ctx.fillStyle = C.surface; ctx.fillRect(0, 0, L.W, L.H);
    ctx.lineCap = "butt"; ctx.lineJoin = "round"; ctx.setLineDash([]);
    drawEdges(S, t);
    drawSlashes(S, t);
    drawParticles(S, t);
    drawNodes(S, t);
    drawBranchLabels(S, t);
    drawLeafLabels(S, t);
    drawBadges(S, t);
    drawDecisionFlow(S, t);
    drawCaption(S, t);
    drawInset(S, t);
  }

  layout();
  var player = A.create({
    root: root,
    duration: DUR,
    chapters: CH.map(function (c, k) { return { t: c, key: "dtree.ch" + (k + 1) }; }),
    onResize: function () { cv.fit(); layout(); },
    render: render
  });

  /* =====================================================================================
     Page text: status line, data, solution, node table, sensitivity, notes
     ===================================================================================== */
  function scenName(key) { return T("dtree.sc." + key, { R: f0(R_AV) }); }
  function actOf(S, id) { return T("dtree.act." + NODES[id].kids[S.rb[id].best][1]); }
  function kidV(S, id, i) { return f1(S.rb[NODES[id].kids[i][0]].ce); }
  function renderSeg() {
    document.querySelectorAll("#dt-seg button").forEach(function (b) { b.textContent = scenName(b.getAttribute("data-sc")); });
  }
  function nums(S) {
    return { x: f1(S.rb.C1.ce), f: f1(S.rb.L6.ce), c: f1(S.rb.C3.ce), e: f1(S.rb.L5.ce), R: f0(R_AV) };
  }
  function renderScenText() {
    var S = scen(state.sc);
    stage.setAttribute("aria-label", T("dtree.anim.aria") + " " + T("dtree.anim.aria." + state.sc, nums(S)));
    document.getElementById("dt-lg-val").textContent = T("dtree.lg.val." + state.sc);
  }
  function renderStatus() {
    document.getElementById("dt-status").innerHTML = T("dtree.st." + state.sc, nums(scen(state.sc)));
  }
  function renderModel() {
    var X = function (id) { return f0(NODES[id].x); };
    document.getElementById("dt-data").textContent = T("dtree.model.data", {
      f: X("L6"), pA: fp(P_OK), pH: fp(P_HI), a: X("L1"), b: X("L2"), c: X("L3"), d: X("L4"), e: X("L5")
    });
  }
  function renderSolution() {
    var S = scen(state.sc), rb = S.rb, N = scen("neutral").rb, V = scen("averse").rb;
    document.getElementById("dt-sol-title").textContent = T("dtree.sol.title", { s: scenName(state.sc) });
    document.getElementById("dt-s-root").textContent = f1(rb.D1.ce);
    document.getElementById("dt-s-rootl").textContent = T("dtree.sol.root.l." + state.sc);
    document.getElementById("dt-s-move").textContent = actOf(S, "D1");
    document.getElementById("dt-s-movel").textContent = T("dtree.sol.move.l", { a: kidV(S, "D1", rb.D1.best), b: kidV(S, "D1", 1 - rb.D1.best) });
    var d2 = T("dtree.act." + NODES.D2.kids[rb.D2.best][1]);
    document.getElementById("dt-s-rej").textContent = d2.charAt(0).toLocaleUpperCase(I18N.locale) + d2.slice(1);
    document.getElementById("dt-s-rejl").textContent = T("dtree.sol.rej.l", { a: kidV(S, "D2", rb.D2.best), b: kidV(S, "D2", 1 - rb.D2.best) });
    document.getElementById("dt-s-prem").textContent = f1(rb.C1.ev - rb.C1.ce);
    document.getElementById("dt-s-preml").textContent = S.neutral ? T("dtree.sol.prem.l.neutral") : T("dtree.sol.prem.l.averse", { ev: f1(rb.C1.ev), ce: f1(rb.C1.ce) });
    // node table: both attitudes side by side
    var h = "<thead><tr><th>" + T("dtree.tbl.node") + "</th><th class='num'>" + T("dtree.tbl.ev") + "</th><th class='wide'>" + T("dtree.tbl.chN") +
      "</th><th class='num wide'>" + T("dtree.tbl.eu") + "</th><th class='num'>" + T("dtree.tbl.ce") + "</th><th class='wide'>" + T("dtree.tbl.chA") + "</th></tr></thead><tbody>";
    var keep = function (rbx, id) { return NODES[id].t === "d" ? T("dtree.br." + NODES[id].kids[rbx[id].best][1]) : ""; };
    INNER.concat(LEAVES).forEach(function (id, i) {
      var leaf = NODES[id].t === "l", dcls = NODES[id].t === "d" ? " ex" : "";
      h += "<tr" + (i === INNER.length ? " class='sep'" : "") + "><td" + (leaf ? " class='leaf'" : "") + ">" + id + " · " + T("dtree.n." + id) + "</td>" +
        "<td class='num" + (state.sc === "neutral" ? dcls : "") + "'>" + f1(N[id].v) + "</td><td class='wide'>" + keep(N, id) + "</td>" +
        "<td class='num wide'>" + f4(V[id].v) + "</td><td class='num" + (state.sc === "averse" ? dcls : "") + "'>" + f1(V[id].ce) + "</td><td class='wide'>" + keep(V, id) + "</td></tr>";
    });
    document.getElementById("dt-tbl").innerHTML = h + "</tbody>";
    document.getElementById("dt-tbl-note").textContent = T("dtree.tbl.note", { R: f0(R_AV) });
    // the risk neutral rollback with its numbers
    var tx = function (v, d) { return fmt(v, d, d); };
    var v = {
      pH: fp(P_HI), pL: fp(1 - P_HI), pA: fp(P_OK), pR: fp(1 - P_OK),
      a: f0(NODES.L1.x), b: f0(NODES.L2.x), c: f0(NODES.L3.x), d: f0(NODES.L4.x), e: tx(NODES.L5.x, 1), f: tx(NODES.L6.x, 1),
      vC2: tx(N.C2.v, 1), vC3: tx(N.C3.v, 1), vD2: tx(N.D2.v, 1), vC1: tx(N.C1.v, 1), vD1: tx(N.D1.v, 1)
    };
    TeX.set(document.getElementById("dt-inst"), T("dtree.inst.tex", v), T("dtree.inst.formula", v));
  }
  var SENS_R = [100, R_AV, 400, 750, 1000, 2500, Infinity];
  function renderSens() {
    var h = "<thead><tr><th class='num'>" + T("dtree.sens.R") + "</th><th class='num wide'>" + T("dtree.sens.cc") + "</th><th>" + T("dtree.sens.d2") +
      "</th><th class='num'>" + T("dtree.sens.cx") + "</th><th>" + T("dtree.sens.d1") + "</th></tr></thead><tbody>";
    SENS_R.forEach(function (R) {
      var rb = rollback(R), S = { rb: rb };
      h += "<tr" + (R === R_AV && state.sc === "averse" || !isFinite(R) && state.sc === "neutral" ? " class='on'" : "") + "><td class='num'>" + (isFinite(R) ? f0(R) : T("dtree.sens.inf")) +
        "</td><td class='num wide'>" + f1(rb.C3.ce) + "</td><td>" + T("dtree.br." + NODES.D2.kids[rb.D2.best][1]) +
        "</td><td class='num'>" + f1(rb.C1.ce) + "</td><td>" + actOf(S, "D1") + "</td></tr>";
    });
    document.getElementById("dt-sens").innerHTML = h + "</tbody>";
    var f = NODES.L6.x, e = NODES.L5.x;
    var Rs = bisect(function (R) { return rollback(R).C1.ce - f; }, 50, 1e6);
    var Rd = bisect(function (R) { return rollback(R).C3.ce - e; }, 50, 1e6);
    document.getElementById("dt-sens-note").textContent = T("dtree.sens.note", { f: f0(f), e: f0(e), Rs: f1(Rs), Rd: f1(Rd) });
    return Rs;
  }
  function renderNotes(Rs) {
    var N = scen("neutral").rb, V = scen("averse").rb, f = NODES.L6.x;
    var pl = lottery(N).reduce(function (s, q) { return s + (q[1] < f ? q[0] : 0); }, 0);
    var worst = lottery(N).reduce(function (m, q) { return Math.min(m, q[1]); }, Infinity);
    document.getElementById("dt-n1").textContent = T("dtree.n.p1", { x: f1(N.D1.v) });
    document.getElementById("dt-n2").textContent = T("dtree.n.p2", { f: f0(f), pl: fp(pl), d: f0(worst) });
    document.getElementById("dt-n3").textContent = T("dtree.n.p3", { R: f0(R_AV), ce: f1(V.C1.ce), prem: f1(V.C1.ev - V.C1.ce), ev: f1(V.C1.ev), gap: f1(V.C1.ev - f) });
    document.getElementById("dt-n4").textContent = T("dtree.n.p4", { Rs: f1(Rs) });
  }

  var segBtns = document.querySelectorAll("#dt-seg button");
  segBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      if (state.sc === b.getAttribute("data-sc")) return;
      state.sc = b.getAttribute("data-sc");
      segBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      renderScenText(); renderStatus(); renderSolution(); renderSens();
      hudKey = "";
      if (A.reducedMotion) { player.seek(DUR); return; }
      if (player.time < CH[1]) player.refresh();
      else { player.seek(CH[1] + 0.001); player.play(); }
    });
  });

  function renderPage() {
    renderSeg(); renderScenText(); renderStatus(); renderModel(); renderSolution();
    var Rs = renderSens(); renderNotes(Rs);
    hudKey = "";
    player.refresh();
  }
  I18N.onChange(renderPage);
})();
</script>
</body>
</html>
