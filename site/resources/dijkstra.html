          pred: { A: null, B: "C", C: "A", D: "B", E: "B", F: null }, activeArcs: ["B-D", "B-E"] },
        { current: "E", updated: ["F"], visited: ["A", "C", "B", "E"], optimal: [],
          dist: { A: 0, B: 3, C: 2, D: 8, E: 4, F: 6 },
          pred: { A: null, B: "C", C: "A", D: "B", E: "B", F: "E" }, activeArcs: ["E-F"] },
        { current: "F", updated: [], visited: ["A", "C", "B", "E", "F"], optimal: ["A", "C", "B", "E", "F"],
          dist: { A: 0, B: 3, C: 2, D: 8, E: 4, F: 6 },
          pred: { A: null, B: "C", C: "A", D: "B", E: "B", F: "E" }, activeArcs: ["A-C", "C-B", "B-E", "E-F"] }
      ]
    },
    exercise: {
      directed: false, viewBox: "0 0 380 290", origin: "O", dest: "T", bodyKey: "dij.ot.s", titleKey: "dij.graph.exercise",
      weightOffset: 0, badgeStroke: true,
      nodes: ["O", "A", "B", "C", "D", "T"],
      pos: { O: { x: 34, y: 140 }, A: { x: 130, y: 44 }, B: { x: 130, y: 236 }, C: { x: 250, y: 44 }, D: { x: 250, y: 236 }, T: { x: 346, y: 140 } },
      labelBelow: function (name, p) { return p.y > 140 || name === "O" || name === "T"; },
      arcs: [
        { f: "O", t: "A", w: 3 }, { f: "O", t: "B", w: 6 },
        { f: "A", t: "B", w: 2 }, { f: "A", t: "C", w: 2 }, { f: "A", t: "D", w: 7 },
        { f: "B", t: "D", w: 2 }, { f: "C", t: "D", w: 3 },
        { f: "C", t: "T", w: 5 }, { f: "D", t: "T", w: 1 }
      ],
      states: [
        { current: null, updated: [], visited: [], optimal: [],
          dist: { O: 0, A: INF, B: INF, C: INF, D: INF, T: INF },
          pred: { O: null, A: null, B: null, C: null, D: null, T: null }, activeArcs: [] },
        { current: "O", updated: ["A", "B"], visited: ["O"], optimal: [],
          dist: { O: 0, A: 3, B: 6, C: INF, D: INF, T: INF },
          pred: { O: null, A: "O", B: "O", C: null, D: null, T: null }, activeArcs: [ukey("O", "A"), ukey("O", "B")] },
        { current: "A", updated: ["B", "C", "D"], visited: ["O", "A"], optimal: [],
          dist: { O: 0, A: 3, B: 5, C: 5, D: 10, T: INF },
          pred: { O: null, A: "O", B: "A", C: "A", D: "A", T: null }, activeArcs: [ukey("A", "B"), ukey("A", "C"), ukey("A", "D")] },
        { current: "B", updated: ["D"], visited: ["O", "A", "B"], optimal: [],
          dist: { O: 0, A: 3, B: 5, C: 5, D: 7, T: INF },
          pred: { O: null, A: "O", B: "A", C: "A", D: "B", T: null }, activeArcs: [ukey("B", "D")] },
        { current: "C", updated: ["T"], visited: ["O", "A", "B", "C"], optimal: [],
          dist: { O: 0, A: 3, B: 5, C: 5, D: 7, T: 10 },
          pred: { O: null, A: "O", B: "A", C: "A", D: "B", T: "C" }, activeArcs: [ukey("C", "D"), ukey("C", "T")] },
        { current: "D", updated: ["T"], visited: ["O", "A", "B", "C", "D"], optimal: [],
          dist: { O: 0, A: 3, B: 5, C: 5, D: 7, T: 8 },
          pred: { O: null, A: "O", B: "A", C: "A", D: "B", T: "D" }, activeArcs: [ukey("D", "T")] },
        { current: "T", updated: [], visited: ["O", "A", "B", "C", "D", "T"], optimal: ["O", "A", "B", "D", "T"],
          dist: { O: 0, A: 3, B: 5, C: 5, D: 7, T: 8 },
          pred: { O: null, A: "O", B: "A", C: "A", D: "B", T: "D" }, activeArcs: [ukey("O", "A"), ukey("A", "B"), ukey("B", "D"), ukey("D", "T")] }
      ]
    }
  };

  function modeFromHash() { return location.hash === "#exercise" ? "exercise" : "example"; }
  var mode = modeFromHash();
  var cur = 0;
  var G = function () { return GRAPHS[mode]; };
  var arcKey = function (a) { return G().directed ? a.f + "-" + a.t : ukey(a.f, a.t); };
  var last = function () { return G().states.length - 1; };

  // ---- graph ----
  var svg = $("dij-graph");
  var NS = "http://www.w3.org/2000/svg";
  function mk(tag, attrs, txt) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (txt != null) n.textContent = txt;
    return n;
  }

  function drawGraph(s) {
    var g = G(), R = 19;
    var C = {
      surface: css("--surface"), surface2: css("--surface2"), ink: css("--ink"), ink2: css("--ink2"),
      muted: css("--muted"), axis: css("--axis"), border: css("--border"), accent: css("--accent"),
      accentText: css("--accent-text"), bright: css("--mit-bright"), silver: css("--mit-silver"),
      onSolid: css("--on-solid"), crit: css("--crit"), bg: css("--bg")
    };
    var sans = css("--font-sans"), mono = css("--font-mono");
    var active = {}; s.activeArcs.forEach(function (k) { active[k] = true; });
    var opt = {}; s.optimal.forEach(function (n) { opt[n] = true; });
    var vis = {}; s.visited.forEach(function (n) { vis[n] = true; });
    var upd = {}; s.updated.forEach(function (n) { upd[n] = true; });
    var hasOpt = s.optimal.length > 0;

    svg.textContent = "";
    svg.setAttribute("viewBox", g.viewBox);

    if (g.directed) {
      var defs = mk("defs", {});
      [["p", C.axis], ["a", C.accent], ["o", C.ink]].forEach(function (m) {
        var mark = mk("marker", { id: "dij-arr-" + m[0], viewBox: "0 0 10 10", refX: 9, refY: 5,
          markerWidth: 8, markerHeight: 8, markerUnits: "userSpaceOnUse", orient: "auto" });
        mark.appendChild(mk("path", { d: "M1 1L9 5L1 9Z", fill: m[1] }));
        defs.appendChild(mark);
      });
      svg.appendChild(defs);
    }

    var arcsL = mk("g", {}), nodesL = mk("g", {});
    svg.append(arcsL, nodesL);

    g.arcs.forEach(function (a) {
      var p1 = g.pos[a.f], p2 = g.pos[a.t];
      var dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.sqrt(dx * dx + dy * dy);
      var ux = dx / len, uy = dy / len;
      var isActive = !!active[arcKey(a)];
      var isOpt = hasOpt && isActive;
      var col = isOpt ? C.ink : isActive ? C.accent : C.axis;
      var line = mk("line", {
        x1: p1.x + ux * R, y1: p1.y + uy * R, x2: p2.x - ux * (R + 1), y2: p2.y - uy * (R + 1),
        stroke: col, "stroke-width": isOpt ? 3.4 : isActive ? 2.4 : 1.3, "stroke-linecap": "round"
      });
      if (g.directed) line.setAttribute("marker-end", "url(#dij-arr-" + (isOpt ? "o" : isActive ? "a" : "p") + ")");
      arcsL.appendChild(line);

      var mx = (p1.x + p2.x) / 2 - uy * g.weightOffset, my = (p1.y + p2.y) / 2 + ux * g.weightOffset;
      arcsL.appendChild(mk("circle", { cx: mx, cy: my, r: g.badgeStroke ? 10 : 9, fill: C.surface,
        stroke: g.badgeStroke ? (isOpt ? C.ink : isActive ? C.accent : C.axis) : "none", "stroke-width": isOpt ? 1.6 : 1 }));
      arcsL.appendChild(mk("text", { x: mx, y: my, "text-anchor": "middle", "dominant-baseline": "central",
        "font-size": 10.5, "font-weight": isActive ? 600 : 400, "font-family": mono,
        fill: isOpt ? C.ink : isActive ? C.accentText : C.muted }, num(a.w)));
    });

    g.nodes.forEach(function (name) {
      var p = g.pos[name];
      var isOpt = !!opt[name], isCur = name === s.current;
      var isVis = vis[name] && !isCur && !isOpt;
      var isUpd = upd[name] && !isCur && !isVis && !isOpt;
      var fill = isOpt ? C.ink : isCur ? C.accent : isVis ? C.surface2 : C.surface;
      var stroke = isOpt ? C.ink : isCur ? C.accent : isUpd ? C.bright : isVis ? C.silver : C.axis;
      var textCol = isOpt || isCur ? C.onSolid : isVis ? C.muted : C.ink;

      nodesL.appendChild(mk("circle", { cx: p.x, cy: p.y, r: R, fill: fill, stroke: stroke,
        "stroke-width": isOpt || isCur || isUpd ? 2.2 : 1.4 }));
      if (isUpd) nodesL.appendChild(mk("circle", { cx: p.x, cy: p.y, r: R - 1, fill: C.bright, "fill-opacity": 0.13 }));
      nodesL.appendChild(mk("text", { x: p.x, y: p.y, "text-anchor": "middle", "dominant-baseline": "central",
        "font-size": 14, "font-weight": 700, "font-family": sans, fill: textCol }, name));

      var below = g.labelBelow(name, p);
      nodesL.appendChild(mk("text", { x: p.x, y: below ? p.y + R + 12 : p.y - R - 10,
        "text-anchor": "middle", "dominant-baseline": "central", "font-size": 11, "font-family": mono,
        "font-weight": isCur || isOpt || isUpd ? 600 : 400,
        fill: isCur ? C.accentText : isOpt ? C.ink : isUpd ? C.crit : C.muted }, num(s.dist[name])));
    });
  }

  // ---- table ----
  function renderTable(s) {
    var g = G(), tb = $("dij-tbody");
    tb.textContent = "";
    g.nodes.forEach(function (n) {
      var isCur = n === s.current;
      var isOpt = s.optimal.indexOf(n) >= 0;
      var isVis = s.visited.indexOf(n) >= 0 && !isCur && !isOpt;
      var isUpd = s.updated.indexOf(n) >= 0 && !isCur;
      var tr = document.createElement("tr");
      if (isOpt) tr.className = "optimal";
      else if (isCur) tr.className = "current";
      else if (isVis) tr.className = "visited";
      else if (isUpd) tr.className = "updated-row";

      var td1 = document.createElement("td");
      var b = document.createElement("b"); b.textContent = n; td1.appendChild(b);
      var tagKey = n === g.origin ? "dij.tag.origin" : n === g.dest ? "dij.tag.dest" : null;
      if (tagKey) {
        var sp = document.createElement("span"); sp.className = "tag"; sp.textContent = " " + t(tagKey);
        td1.appendChild(sp);
      }
      var td2 = document.createElement("td"); td2.className = "mono" + (isUpd ? " upd" : ""); td2.textContent = num(s.dist[n]);
      var td3 = document.createElement("td"); td3.className = "mono"; td3.textContent = s.pred[n] || "-";
      var td4 = document.createElement("td"); td4.className = "status";
      td4.textContent = t(isOpt ? "dij.st.optimal" : isCur ? "dij.st.current" : isVis ? "dij.st.visited" : "dij.st.pending");
      tr.append(td1, td2, td3, td4);
      tb.appendChild(tr);
    });
  }

  // ---- progress ----
  function renderProgress() {
    var bar = $("dij-progress"), L = last();
    bar.textContent = "";
    G().states.forEach(function (s, i) {
      var li = document.createElement("li");
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "prog-step" + (i < cur ? " done" : i === cur ? " active" : "") + (i === L && cur === L ? " finished" : "");
      if (i === cur) btn.setAttribute("aria-current", "step");
      btn.setAttribute("aria-label", t("dij.progress.goto", { n: I18N.fmt(i, 0) }));
      var dot = document.createElement("span"); dot.className = "prog-dot"; dot.textContent = I18N.fmt(i, 0);
      var lab = document.createElement("span"); lab.className = "prog-label";
      if (i === 0) lab.textContent = t("dij.prog.start");
      else {
        lab.append(t("dij.prog.iter", { n: I18N.fmt(i, 0) }), document.createElement("br"), s.current + (i === L ? " ✓" : ""));
      }
      btn.append(dot, lab);
      btn.addEventListener("click", function () { goTo(i); });
      li.appendChild(btn);
      bar.appendChild(li);
    });
  }

  // ---- explanation ----
  function renderExplain(s) {
    var L = last(), isLast = cur === L;
    $("dij-explain").classList.toggle("final", isLast);
    $("dij-ex-iter").textContent = cur === 0 ? t("dij.iter.initial") : t(isLast ? "dij.iter.last" : "dij.iter.n", { n: I18N.fmt(cur, 0) });
    $("dij-ex-title").textContent = cur === 0 ? t("dij.title.before")
      : isLast ? t("dij.title.reached", { node: s.current })
      : t("dij.title.visit", { node: s.current, d: num(s.dist[s.current]) });
    $("dij-ex-body").innerHTML = t(G().bodyKey + cur);
  }

  function renderPath(s) {
    var box = $("dij-path");
    var isLast = cur === last();
    box.hidden = !isLast;
    box.textContent = "";
    if (!isLast) return;
    s.optimal.forEach(function (n, i) {
      if (i) { var ar = document.createElement("span"); ar.className = "path-arrow"; ar.textContent = "→"; box.appendChild(ar); }
      var nd = document.createElement("span"); nd.className = "path-node"; nd.textContent = n; box.appendChild(nd);
    });
    var cost = document.createElement("span"); cost.className = "path-cost";
    cost.textContent = t("dij.path.cost", { c: num(s.dist[G().dest]) });
    box.appendChild(cost);
    $("dij-alt").hidden = !(isLast && mode === "exercise");
  }

  // ---- whole page ----
  function render() {
    var s = G().states[cur], L = last(), isLast = cur === L;
    ["example", "exercise"].forEach(function (m) { $("dij-mode-" + m).setAttribute("aria-pressed", m === mode ? "true" : "false"); });
    $("dij-graph-title").textContent = t(G().titleKey);
    drawGraph(s);
    renderTable(s);
    renderProgress();
    renderExplain(s);
    renderPath(s);
    if (!isLast) $("dij-alt").hidden = true;

    $("dij-prev").disabled = cur === 0;
    var next = $("dij-next");
    next.textContent = t(isLast ? "dij.btn.end" : "dij.btn.next");
    next.className = "btn " + (isLast ? "done" : "primary");
    next.disabled = isLast;
    $("dij-counter").textContent = t("dij.counter", { n: I18N.fmt(cur, 0), total: I18N.fmt(L, 0) });
  }

  function goTo(n) { cur = Math.max(0, Math.min(last(), n)); render(); }
  function step(dir) { goTo(cur + dir); }

  function setMode(m, push) {
    if (m !== "example" && m !== "exercise") m = "example";
    var changed = m !== mode;
    mode = m;
    if (changed) cur = 0;
    if (push) {
      try { history.replaceState(null, "", location.pathname + location.search + "#" + m); } catch (e) { /* ok */ }
    }
    render();
  }

  $("dij-reset").addEventListener("click", function () { goTo(0); });
  $("dij-prev").addEventListener("click", function () { step(-1); });
  $("dij-next").addEventListener("click", function () { step(1); });
  $("dij-mode-example").addEventListener("click", function () { setMode("example", true); });
  $("dij-mode-exercise").addEventListener("click", function () { setMode("exercise", true); });
  window.addEventListener("hashchange", function () { setMode(modeFromHash(), false); });

  // Keyboard navigation (as in the original): right/down = next, left/up = previous
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var tag = e.target && e.target.tagName;
    if (tag === "SELECT" || tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight" || e.key === "ArrowDown") step(1);
    if (e.key === "ArrowLeft" || e.key === "ArrowUp") step(-1);
  });

  // SVG colors are read from the tokens: redraw when the OS theme flips
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
  I18N.onChange(render); // first render and every language switch
})();
</script>
