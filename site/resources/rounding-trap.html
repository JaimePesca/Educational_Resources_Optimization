  function renderModel() {

    var rows = cons.map(function (r) {
      return tco(r.a) + "x_1+" + tco(r.b) + "x_2\\le " + r.rhs + " && \\text{(" + cname(r).toLocaleLowerCase(I18N.locale) + ")}";
    }).join("\\\\ & ");
    TeX.set($("modelbox"), t("rnd.model.tex", { c1: c1, c2: c2, rows: rows }), plain);
  }

  function renderAll() {
    renderPresets();
    buildRows();
    $("hullchk").checked = showHull;
    update();
  }
  function update() {
    S = compute();
    renderPlot();
    renderPanels();
    persist();
  }

  // ---- inputs ----
  ["c1", "c2"].forEach(function (id) {
    $(id).addEventListener("input", function (e) {
      if (id === "c1") c1 = +e.target.value; else c2 = +e.target.value;
      hl = null; update();
    });
  });
  $("hullchk").addEventListener("change", function (e) { showHull = e.target.checked; update(); });
  $("reset").addEventListener("click", function () { loadPreset(pi); renderAll(); });

  // ---- hover readout on lattice points ----
  var tip = $("tip");
  function onPoint(ev) {
    if (!S || !S.lp.best) { tip.hidden = true; return; }
    var rect = svg.getBoundingClientRect();
    var px = (ev.clientX - rect.left) / rect.width * W, py = (ev.clientY - rect.top) / rect.height * H;
    var x = Math.round((px - M.l) / (W - M.l - M.r) * D), y = Math.round((H - M.b - py) / (H - M.t - M.b) * D);
    if (x < 0 || y < 0 || x > D || y > D || Math.hypot(sx(x) - px, sy(y) - py) > 16) { tip.hidden = true; return; }
    var ok = feasible(x, y), ipb = S.ip.best;
    var html = "(x₁" + t("rnd.sep") + "x₂) = " + pt(x, y, 0) + "<br>Z = " + fmt(c1 * x + c2 * y) + "<br>" +
      (ok ? '<span class="si">✓ ' + t("rnd.tip.feas") + "</span>"
          : '<span class="no">✗ ' + t("rnd.tip.infeas", { list: violated(x, y).join(", ") }) + "</span>");
    if (ipb && ipb.x === x && ipb.y === y) html += "<br>" + t("rnd.tip.ipopt");
    tip.innerHTML = html;
    tip.hidden = false;
    var host = svg.parentElement.getBoundingClientRect();
    var tx = ev.clientX - host.left + 14, ty = ev.clientY - host.top + 12;
    if (tx + tip.offsetWidth + 8 > host.width) tx = ev.clientX - host.left - tip.offsetWidth - 14;
    tip.style.left = Math.max(4, tx) + "px"; tip.style.top = ty + "px";
  }
  svg.addEventListener("pointermove", onPoint);
  svg.addEventListener("pointerdown", onPoint);
  svg.addEventListener("pointerleave", function () { tip.hidden = true; });

  // ---- hot state (survives a republish while the page is open) ----
  function persist() {
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
      try {
        window.claude.hot.snapshot({ pi: pi, c1: c1, c2: c2, rhs: cons.map(function (r) { return r.rhs; }), hull: showHull });
      } catch (e) { /* ok */ }
    }
  }
  function start(data) {
    loadPreset(0);
    if (data && typeof data.pi === "number" && PRESETS[data.pi]) {
      loadPreset(data.pi);
      if (typeof data.c1 === "number") c1 = data.c1;
      if (typeof data.c2 === "number") c2 = data.c2;
      if (Array.isArray(data.rhs)) cons.forEach(function (r, i) { if (typeof data.rhs[i] === "number") r.rhs = data.rhs[i]; });
      showHull = !!data.hull;
    }
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { if (S) renderPlot(); });
    I18N.onChange(renderAll);
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
</body>
</html>
