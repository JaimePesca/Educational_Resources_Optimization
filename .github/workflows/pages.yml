name: Deploy website

# Publishes the site/ folder to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp asset links with this build
        # Pages cache CSS and JS for 10 minutes; a new ?v= per deploy keeps pages and assets in sync
        run: find site -name '*.html' -exec sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" {} +
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
